function storyIcon(t){ t = (t||"").toLowerCase();
  if (/cricket|kohli|rohit|world cup|ipl|match|smith|bowler|pakistan|odi|test/.test(t)) return IC.ball;
  if (/movie|film|dialogue|shack|idiots|cinema|actor/.test(t)) return IC.film;
  if (/report|news|bomb|rap|police|covid|corona|pandemic|vaccine|died|death of/.test(t)) return IC.news;
  if (/luther|bishop|history|reform/.test(t)) return IC.book; return IC.spark; }

/* ---------- Bible books (for scripture index) ---------- */
const BOOKS = ["Genesis|gen|ge","Exodus|exo|ex","Leviticus|lev","Numbers|num","Deuteronomy|deu|dt","Joshua|jos","Judges|judg|jdg","Ruth|rut","1 Samuel|1 sam|1sa|1 sa","2 Samuel|2 sam|2sa|2 sa","1 Kings|1 ki|1kg","2 Kings|2 ki|2kg","1 Chronicles|1 ch","2 Chronicles|2 ch","Ezra|ezr","Nehemiah|neh","Esther|est","Job|job","Psalms|psa|ps","Proverbs|pro|prv","Ecclesiastes|ecc","Song of Songs|song|sos","Isaiah|isa","Jeremiah|jer","Lamentations|lam","Ezekiel|eze|ezk","Daniel|dan","Hosea|hos","Joel|joe","Amos|amo","Obadiah|oba","Jonah|jon","Micah|mic","Nahum|nah","Habakkuk|hab","Zephaniah|zep","Haggai|hag","Zechariah|zec","Malachi|mal","Matthew|mat|mt","Mark|mar|mk","Luke|luk|lk","John|joh|jn","Acts|act","Romans|rom","1 Corinthians|1 cor|1co","2 Corinthians|2 cor|2co","Galatians|gal","Ephesians|eph","Philippians|phil|php","Colossians|col","1 Thessalonians|1 th","2 Thessalonians|2 th","1 Timothy|1 ti","2 Timothy|2 ti","Titus|tit","Philemon|phm|philem","Hebrews|heb","James|jam|jas","1 Peter|1 pe|1 pet","2 Peter|2 pe|2 pet","1 John|1 jo|1 jn","2 John|2 jo|2 jn","3 John|3 jo|3 jn","Jude|jud","Revelation|rev"].map(s => { const p = s.split("|"); return {name:p[0], keys:[p[0].toLowerCase(), ...p.slice(1)]}; });
function bookOf(ref){ let r = String(ref).trim().toLowerCase().replace(/^(i{1,3})\s/, m => ({"i ":"1 ","ii ":"2 ","iii ":"3 "}[m])).replace(/^([123])([a-z])/, "$1 $2");
  const m = r.match(/^([123]\s)?[a-z][a-z .]*?(?=\s*\d|$)/); if (!m) return null; const head = m[0].trim();
  let best = null; for (const b of BOOKS){ for (const k of b.keys){ if (head === k || (head.startsWith(k) && k.length >= 3) || (k.startsWith(head) && head.length >= 3 && /^[123]?\s?[a-z]/.test(head))) { if (!best || k.length > best.len) best = {b, len:k.length}; } } }
  if (head === "john" || head === "jn") return "John"; if (head === "jude") return "Jude"; if (/^phil/.test(head) && !/philem/.test(head)) return "Philippians";
  return best ? best.b.name : null; }

/* gather refs & questions */
const REFS = []; // {ref, book, ch, where}
function addRefs(list, c, where){ (list||[]).forEach(r => { if (!r) return; String(r).split(/;\s*/).forEach(x => { x = x.trim(); if (!x) return; REFS.push({ref:x, book:bookOf(x), ch:c, where}); }); }); }
CH.forEach(c => { c.outlinesAll.forEach(o => o.items.forEach(it => addRefs(it.refs, c, it.label))); c.claims.forEach(a => { addRefs(a.refs, c, a.claim); if (ANS && a.response) addRefs(a.response.refs, c, "Response: " + a.claim); }); c.keyVerses.forEach(v => addRefs([v.ref], c, v.use || "Key verse")); });
const totals = { claims: CH.reduce((n,c)=>n+c.claims.length,0), qs: CH.reduce((n,c)=>n+c.questions.length,0), crit: CH.reduce((n,c)=>n+c.criticisms.length,0), refs: new Set(REFS.map(r=>r.ref.replace(/\s+/g," "))).size, stories: CH.reduce((n,c)=>n+c.illustrations.length,0) };

/* ---------- nav ---------- */
const NAV = [["home","Map"],["chapters","Chapters"],["diagrams","Diagrams"]].concat(ANS ? [["lenses","Six Lenses"],["compare","Compare"]] : [["positions","Positions"]]).concat([["questions","Questions"],["scripture","Scripture"]]);
$("#nav").innerHTML = NAV.map(([k,n]) => `<a href="#${k}" data-k="${k}">${n}</a>`).join("");
$("#foot").innerHTML = ANS
  ? `A companion that answers each argument of the book <i>Hyper Biblical</i> through six lenses: relational gospel, word of faith, life and immortality, sonship, postmillennial hope and partial preterism. ${CH.length} chapters · ${totals.claims} arguments answered.`
  : `An interactive study map of the book <i>Hyper Biblical</i>: every section, chapter, argument, question and critique, drawn as maps, flowcharts and diagrams. ${CH.length} chapters · ${totals.claims} arguments.`;

/* ---------- helpers ---------- */
const refChips = refs => (refs && refs.length) ? `<div class="refs">${refs.map(r => `<button class="ref" data-ref="${esc(r)}">${esc(r)}</button>`).join("")}</div>` : "";
const lensChips = ls => (ls && ls.length) ? `<div class="lenses">${ls.map(k => { const l = lensOf(k); return l ? `<span class="lens" style="--lc:var(${l.v})">${l.label}</span>` : ""; }).join("")}</div>` : "";
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
document.addEventListener("click", e => { const r = e.target.closest(".ref"); if (r) { location.hash = "scripture"; setTimeout(() => { const i = $("#sq"); if (i) { i.value = r.dataset.ref.replace(/[-–,].*$/,""); i.dispatchEvent(new Event("input")); } }, 30); } });

/* ---------- mind map ---------- */
function mindMap(){
  const W = 1000, C = 500, secs = SECTIONS.filter(s => CH.some(c => c.section === s.key));
  const n = CH.length, gap = 1.3, slots = n + gap * secs.length; let pos = 0; const angOf = {}, secAng = {};
  secs.forEach(s => { const cs = CH.filter(c => c.section === s.key); const a0 = pos; cs.forEach(c => { angOf[c.id] = (pos + .5) / slots * Math.PI * 2 - Math.PI/2; pos++; }); secAng[s.key] = ((a0 + pos) / 2) / slots * Math.PI * 2 - Math.PI/2; pos += gap; });
  const P = (a, r) => [C + Math.cos(a) * r, C + Math.sin(a) * r];
  let edges = "", nodes = "", labels = "";
  secs.forEach((s, i) => { const [x,y] = P(secAng[s.key], 215);
    edges += `<path class="map-edge draw" style="animation-delay:${i*90}ms;stroke:var(${s.v});stroke-opacity:.55;stroke-width:3" d="M${C} ${C} L${x.toFixed(1)} ${y.toFixed(1)}"/>`;
    CH.filter(c => c.section === s.key).forEach((c, j) => { const [cx, cy] = P(angOf[c.id], 410); const [mx, my] = P((angOf[c.id] + secAng[s.key]) / 2, 330);
      edges += `<path class="map-edge draw" style="animation-delay:${500 + j*25}ms;stroke:var(${s.v});stroke-opacity:.35" d="M${x.toFixed(1)} ${y.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)}"/>`;
      nodes += `<g class="map-node" tabindex="0" role="link" data-go="${c.id}" data-tip="${esc(chName(c) + " · " + c.title)}"><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${16 + Math.min(c.claims.length, 14) * .6}" fill="var(--surface)" stroke="var(${s.v})" stroke-width="3"/><text x="${cx.toFixed(1)}" y="${(cy + 5).toFixed(1)}" text-anchor="middle" font-size="15" fill="var(--fg)">${c.num === 0 ? "i" : c.num}</text></g>`; });
    const [lx, ly] = P(secAng[s.key], 215);
    labels += `<g class="map-node" tabindex="0" role="link" data-go="sec-${i}" data-tip="${esc(s.label)}"><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="44" fill="var(${s.v})"/><text x="${lx.toFixed(1)}" y="${(ly + 6).toFixed(1)}" text-anchor="middle" font-size="17" fill="var(--bg)">${s.short}</text></g>`; });
  const center = ANS ? ["Hyper Biblical", "Answered"] : ["Hyper", "Biblical"];
  return `<div class="mapbox"><svg viewBox="0 0 ${W} ${W}" role="img" aria-label="Visual map of the book's sections and chapters">${edges}
   <g class="pulse"><circle cx="${C}" cy="${C}" r="92" fill="var(--accent)"/><circle cx="${C}" cy="${C}" r="104" fill="none" stroke="var(--accent)" stroke-opacity=".3" stroke-width="2"/></g>
   <text x="${C}" y="${C - 4}" text-anchor="middle" font-size="24" font-weight="900" fill="var(--accent-fg)" font-family="var(--font)">${center[0]}</text><text x="${C}" y="${C + 24}" text-anchor="middle" font-size="24" font-weight="900" fill="var(--accent-fg)" font-family="var(--font)">${center[1]}</text>
   ${labels}${nodes}</svg><div class="maptip" id="maptip">Tap a node to open a chapter</div></div>`;
}
function wireMap(root){
  const tip = $("#maptip", root);
  root.querySelectorAll(".map-node").forEach(g => {
    const show = () => { tip.textContent = g.dataset.tip; };
    g.addEventListener("mouseenter", show); g.addEventListener("focus", show);
    const go = () => { const t = g.dataset.go; if (t.startsWith("sec-")) { const el = document.getElementById(t); if (el) el.scrollIntoView({behavior:"smooth"}); } else location.hash = t; };
    g.addEventListener("click", go); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}

/* ---------- views ---------- */
function chapterCard(c){ const s = secOf(c.section);
  return `<a class="ccard" href="#${c.id}" style="--c:var(${s.v})"><span class="num">${chName(c)}</span><h3>${esc(c.title)}</h3><p>${esc(c.thesis || c.summary)}</p><span class="meta"><span>${c.claims.length} arguments</span><span>${c.questions.length} questions</span>${c.outlinesAll.length ? `<span>${esc(c.outlinesAll[0].acronym || "outline")}</span>` : ""}</span></a>`; }

function vHome(){
  const lede = ANS
    ? "Every argument in <i>Hyper Biblical</i>, set beside a reply drawn from the relational gospel, word of faith, life and immortality, sonship, postmillennial and partial-preterist readings of Scripture."
    : "A visual, chapter-by-chapter map of <i>Hyper Biblical</i>: its warnings against hyper-grace, hyper-supernaturalism, hyper-love and other teachings, and its call to test everything by the whole of Scripture.";
  const h = ANS ? `Every argument, <em>answered</em> from grace.` : `Is it biblical to be <em>hyper-biblical</em>?`;
  return `<section class="hero"><div>
      <div class="eyebrow">${ANS ? "A response companion" : "Interactive study map"}</div>
      <h1>${h}</h1><p class="lede">${lede}</p>
      <div class="stats">${[[CH.length,"chapters"],[totals.claims, ANS ? "answers" : "arguments"],[totals.qs,"questions"],[totals.crit,"critiques"],[totals.refs,"scripture refs"]].map(([v,l]) => `<div class="stat"><b data-count="${v}">${v}</b><span>${l}</span></div>`).join("")}</div>
      <div class="cta"><a class="btn primary" href="#${CH[0].id}">Start reading</a><a class="btn" href="#diagrams">See the diagrams</a>${ANS ? `<a class="btn" href="#lenses">Meet the six lenses</a>` : `<a class="btn" href="#positions">The author’s positions</a>`}</div>
    </div><div>${mindMap()}</div></section>
    <div class="sections">${SECTIONS.map((s,i) => { const cs = CH.filter(c => c.section === s.key); if (!cs.length) return "";
      return `<section id="sec-${i}"><div class="sec-head"><span class="sec-dot" style="background:var(${s.v})"></span><div><h2>${s.label}</h2><div class="muted" style="font-size:.9rem">${s.blurb}</div></div><span class="count">${cs.length} ${cs.length === 1 ? "chapter" : "chapters"}</span></div><div class="cards">${cs.map(chapterCard).join("")}</div></section>`; }).join("")}</div>`;
}
function vChapters(){
  return `<div class="eyebrow">All chapters</div><h1 style="font-size:2rem;font-weight:900;margin:4px 0 14px">${CH.length} chapters in five sections</h1>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="cq" placeholder="Filter chapters by title or topic" autocomplete="off"></div>
  <div class="cards" id="clist">${CH.map(chapterCard).join("")}</div>`;
}

function flowHTML(c){ const f = c.flow; if (!f.length) return "";
  return `<div class="flow">${f.map((s,i) => `${i ? `<div class="farrow" style="--i:${i}"></div>` : ""}<div class="fnode${i === f.length-1 ? " last" : ""}" style="--i:${i}">${esc(s)}</div>`).join("")}</div>`; }
function outlineHTML(o){
  const word = (o.acronym || "").trim();
  return `<div class="blk-outline" style="margin-bottom:20px">${word ? `<div class="acro"><span class="word">${esc(word)}</span><span class="muted" style="font-weight:700">tap each tile to turn it over</span></div>` : ""}
  <div class="tiles">${o.items.map(it => `<button class="tile" aria-label="${esc((it.letter||"") + " " + (it.label||""))}"><div class="in"><div class="f"><span class="L">${esc(it.letter || "•")}</span><h4>${esc(it.label)}</h4><small>Turn over</small></div><div class="b"><strong>${esc(it.label)}</strong><span>${esc(it.point)}</span>${refChips(it.refs)}</div></div></button>`).join("")}</div></div>`; }

function argHTML(a, i){
  const resp = a.response || {};
  const lens = (resp.lenses || []).join(" ");
  if (!ANS) return `<details class="arg"${i < 2 ? " open" : ""}><summary><span class="k">${i+1}</span><div><h3>${esc(a.claim)}</h3>${a.target ? `<div class="tgt">Opposes: ${esc(a.target)}</div>` : ""}</div><span class="chev">${IC.chev}</span></summary><div class="body"><p>${esc(a.detail)}</p>${refChips(a.refs)}</div></details>`;
  return `<details class="arg" data-lenses="${esc(lens)}"${i < 2 ? " open" : ""}><summary><span class="k">${i+1}</span><div><h3>${esc(a.claim)}</h3>${a.target ? `<div class="tgt">The book opposes: ${esc(a.target)}</div>` : ""}</div><span class="chev">${IC.chev}</span></summary>
   <div class="body"><div class="vs"><div class="side book"><span class="lbl">The book argues</span><p>${esc(a.detail)}</p>${refChips(a.refs)}</div>
   <div class="side resp"><span class="lbl">The response</span><p>${esc(resp.text)}</p>${lensChips(resp.lenses)}${refChips(resp.refs)}</div></div></div></details>`; }

function vChapter(c){
  const s = secOf(c.section), i = CH.indexOf(c), prev = CH[i-1], next = CH[i+1];
  const blocks = [["ov","Overview"]];
  if (c.flow.length) blocks.push(["fl","Argument flow"]);
  if (c.outlinesAll.length) blocks.push(["ol","Outline"]);
  if (c.claims.length) blocks.push(["ar", ANS ? "Arguments & answers" : "Arguments"]);
  if (c.questions.length) blocks.push(["qa","Questions"]);
  if (c.criticisms.length) blocks.push(["cr","Critiques"]);
  if (c.illustrations.length) blocks.push(["st","Stories"]);
  if (c.keyVerses.length) blocks.push(["kv","Key verses"]);
  const usedLenses = ANS ? LENSES.filter(l => c.claims.some(a => (a.response?.lenses || []).includes(l.key))) : [];
  return `<div style="--c:var(${s.v})">
  <div class="band"><span class="big">${c.num === 0 ? "i" : c.num}</span>
    <div class="crumbs"><a class="pill" href="#sec-${SECTIONS.indexOf(s)}" data-sec="${SECTIONS.indexOf(s)}">${esc(s.label)}</a><span class="pill">${chName(c)}</span></div>
    <h1>${esc(c.title)}</h1>${c.thesis ? `<p class="thesis">${esc(c.thesis)}</p>` : ""}</div>
  <nav class="subnav">${blocks.map(([k,n]) => `<a href="#${c.id}" data-jump="b-${k}">${n}</a>`).join("")}</nav>
  <section class="blk" id="b-ov"><h2>Overview</h2>
    ${ANS && c.responseOverview ? `<div class="two"><div><div class="eyebrow" style="margin-bottom:6px">What the chapter says</div><p class="summary">${esc(c.summary)}</p></div><div class="overview"><div class="eyebrow" style="color:var(--accent);margin-bottom:6px">The response in brief</div>${esc(c.responseOverview)}${usedLenses.length ? `<div style="margin-top:10px">${lensChips(usedLenses.map(l=>l.key))}</div>` : ""}</div></div>`
      : `<p class="summary">${esc(c.summary)}</p>`}</section>
  ${c.flow.length ? `<section class="blk" id="b-fl"><h2>Argument flow <span class="n">${c.flow.length} steps</span></h2>${flowHTML(c)}</section>` : ""}
  ${c.outlinesAll.length ? `<section class="blk" id="b-ol"><h2>Outline</h2>${c.outlinesAll.map(outlineHTML).join("")}</section>` : ""}
  ${c.claims.length ? `<section class="blk" id="b-ar"><h2>${ANS ? "Arguments & answers" : "Arguments"} <span class="n">${c.claims.length}</span></h2>
     ${ANS && usedLenses.length > 1 ? `<div class="toolbar" id="lensbar"><span class="eyebrow">Filter by lens</span><button class="chipbtn on" data-l="">All</button>${usedLenses.map(l => `<button class="chipbtn" data-l="${l.key}" style="--lc:var(${l.v})">${l.label}</button>`).join("")}</div>` : ""}
     <div class="toolbar"><button class="chipbtn" data-all="open">Expand all</button><button class="chipbtn" data-all="close">Collapse all</button></div>
     <div class="args">${c.claims.map(argHTML).join("")}</div></section>` : ""}
  ${c.questions.length ? `<section class="blk" id="b-qa"><h2>Questions <span class="n">${c.questions.length}</span></h2><div class="qs">${c.questions.map(q => qCard(q, c)).join("")}</div></section>` : ""}
  ${c.criticisms.length ? `<section class="blk" id="b-cr"><h2>${ANS ? "Critiques & replies" : "Critiques"} <span class="n">${c.criticisms.length}</span></h2><div class="crit">${c.criticisms.map(k => `<div class="cr"><div class="who">${IC.person}<span>${esc(k.of)}</span></div><div class="what">${k.quote ? `<blockquote>${esc(k.quote)}</blockquote>` : ""}<div><div class="eyebrow">The book’s critique</div><p>${esc(k.critique)}</p></div>${ANS && k.response ? `<div class="side resp"><span class="lbl">Reply</span><p>${esc(k.response)}</p></div>` : ""}</div></div>`).join("")}</div></section>` : ""}
  ${c.illustrations.length ? `<section class="blk" id="b-st"><h2>Stories & illustrations <span class="n">${c.illustrations.length}</span></h2><div class="stories">${c.illustrations.map(t => `<div class="story"><span class="ic">${storyIcon(t.title + " " + t.story)}</span><h4>${esc(t.title)}</h4><p>${esc(t.story)}</p><div class="pt">${esc(t.point)}</div></div>`).join("")}</div></section>` : ""}
  ${c.keyVerses.length ? `<section class="blk" id="b-kv"><h2>Key verses <span class="n">${c.keyVerses.length}</span></h2><div class="verses">${c.keyVerses.map(v => `<div class="verse"><span class="vr">${esc(v.ref)}</span>${v.text ? `<q>${esc(v.text)}</q>` : ""}<small>${esc(v.use)}</small></div>`).join("")}</div></section>` : ""}
  <div class="pager">${prev ? `<a href="#${prev.id}"><small>← ${chName(prev)}</small>${esc(prev.title)}</a>` : "<span></span>"}${next ? `<a class="nx" href="#${next.id}"><small>${chName(next)} →</small>${esc(next.title)}</a>` : ""}</div></div>`;
}
function qCard(q, c){ const s = secOf(c.section);
  if (!ANS) return `<div class="q" style="--c:var(${s.v})"><div class="qq">${esc(q.q)}</div><button class="reveal">Show the author’s answer</button><div class="ans" hidden><b>The author’s answer</b>${esc(q.answer)}</div></div>`;
  return `<div class="q" style="--c:var(${s.v})"><div class="qq">${esc(q.q)}</div><div class="ans"><b>The book</b>${esc(q.answer)}</div><div class="ans r"><b>The response</b>${esc(q.response)}</div></div>`; }

function wireChapter(root){
  root.querySelectorAll(".tile").forEach(t => t.addEventListener("click", e => { if (e.target.closest(".ref")) return; t.classList.toggle("flip"); }));
  root.querySelectorAll(".reveal").forEach(b => b.addEventListener("click", () => { const a = b.nextElementSibling; a.hidden = !a.hidden; b.textContent = a.hidden ? "Show the author’s answer" : "Hide answer"; }));
  root.querySelectorAll("[data-jump]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); document.getElementById(a.dataset.jump)?.scrollIntoView({behavior:"smooth"}); }));
  root.querySelectorAll("[data-sec]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); pendingScroll = "sec-" + a.dataset.sec; location.hash = "home"; }));
  root.querySelectorAll("[data-all]").forEach(b => b.addEventListener("click", () => root.querySelectorAll(".arg").forEach(d => d.open = b.dataset.all === "open")));
  const lb = $("#lensbar", root); if (lb) lb.addEventListener("click", e => { const b = e.target.closest(".chipbtn"); if (!b) return; lb.querySelectorAll(".chipbtn").forEach(x => x.classList.toggle("on", x === b)); const l = b.dataset.l;
    root.querySelectorAll(".arg").forEach(d => { d.hidden = !!l && !(d.dataset.lenses || "").split(" ").includes(l); }); });
}

/* diagrams */
function scaleSVG(left, right, color){ return `<svg viewBox="0 0 240 150" aria-hidden="true"><path d="M120 62 L120 132 M90 136 h60" stroke="var(--muted)" stroke-width="5" stroke-linecap="round" fill="none"/><polygon points="108,132 132,132 120,112" fill="var(--muted)"/>
  <g class="beam"><line x1="30" y1="62" x2="210" y2="62" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/><circle cx="120" cy="62" r="7" fill="var(--fg)"/>
  <line x1="40" y1="62" x2="40" y2="84" stroke="var(--muted)" stroke-width="2"/><line x1="200" y1="62" x2="200" y2="84" stroke="var(--muted)" stroke-width="2"/>
  <rect x="2" y="84" width="76" height="34" rx="9" fill="${color}"/><text x="40" y="106" text-anchor="middle" font-size="13" font-weight="900" fill="var(--bg)" font-family="var(--font)">${left}</text>
  <rect x="162" y="84" width="76" height="34" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/><text x="200" y="106" text-anchor="middle" font-size="13" font-weight="900" fill="var(--muted)" font-family="var(--font)">${right}</text></g></svg>`; }
function vDiagrams(){
  const secs = SECTIONS.map(s => ({s, n: CH.filter(c => c.section === s.key).reduce((a,c) => a + c.claims.length, 0), cs: CH.filter(c => c.section === s.key).length})).filter(x => x.cs);
  const tot = secs.reduce((a,x) => a + x.n, 0);
  const bookCounts = {}; REFS.forEach(r => { if (r.book) bookCounts[r.book] = (bookCounts[r.book] || 0) + 1; });
  const top = Object.entries(bookCounts).sort((a,b) => b[1] - a[1]).slice(0, 18); const mx = top.length ? top[0][1] : 1;
  const hypers = ANS ? (X.balanceAnswer || []) : (X.balance || []);
  const outlines = CH.flatMap(c => c.outlinesAll.filter(o => o.acronym && o.acronym.replace(/[^A-Za-z]/g,"").length > 1).map(o => ({c, o})));
  return `<div class="eyebrow">Diagrams</div><h1 style="font-size:2rem;font-weight:900;margin:4px 0 18px">The book at a glance</h1>
  <div class="dgrid">
   <div class="panel"><h2>${ANS ? "Where the book sees imbalance, and how grace re-weighs it" : "The four “hypers” the book warns against"}</h2><p class="sub">${ANS ? "The book pictures each teaching as a scale tipped toward one truth. The response argues each pan holds the same Christ: grace teaches holiness, love includes correction, faith expects healing, and the kingdom keeps growing." : "In the book’s picture, each error lifts one truth and lets its partner drop. Being “hyper-biblical” means keeping both pans in place."}</p>
    <div class="scales">${hypers.map(h => `<div class="scale">${scaleSVG(esc(h.left), esc(h.right), `var(${h.v})`)}<h4>${esc(h.name)}</h4><p>${esc(h.text)}</p></div>`).join("")}</div></div>
   <div class="panel"><h2>Where the weight of the book falls</h2><p class="sub">Arguments per section. Select a band to jump to that section’s chapters.</p>
    <div class="sectionchart">${secs.map(x => `<a href="#home" data-sec="${SECTIONS.indexOf(x.s)}" style="flex:${x.n};background:var(${x.s.v})" title="${esc(x.s.label)}: ${x.n}">${x.n / tot > .07 ? x.s.short : ""}</a>`).join("")}</div>
    <div class="legend">${secs.map(x => `<span><i style="background:var(${x.s.v})"></i>${esc(x.s.short)} · ${x.cs} ch · ${x.n} args</span>`).join("")}</div></div>
   ${X.timeline && X.timeline.length ? `<div class="panel"><h2>${esc(X.timelineTitle || "Timeline")}</h2><p class="sub">${esc(X.timelineSub || "")}</p>${timelineSVG(X.timeline)}</div>` : ""}
   <div class="panel"><h2>Most-cited books of the Bible</h2><p class="sub">Counted across every argument, outline and key verse${ANS ? ", including the responses" : ""}. Select a bar to list the references.</p>
    <div class="bars">${top.map(([b,n],i) => `<button class="bar" data-book="${esc(b)}" style="--i:${i}"><span>${esc(b)}</span><span class="t"><i style="width:${(n/mx*100).toFixed(1)}%"></i></span><span class="v">${n}</span></button>`).join("")}</div></div>
   ${outlines.length ? `<div class="panel"><h2>Every acronym outline in the book</h2><p class="sub">The author often teaches through acronyms. Select one to open its chapter.</p><div class="cards">${outlines.map(({c,o}) => `<a class="ccard" href="#${c.id}" style="--c:var(${secOf(c.section).v})"><span class="num">${chName(c)}</span><h3 style="font-size:1.4rem;letter-spacing:.05em">${esc(o.acronym)}</h3><p>${esc(o.items.map(i => i.label).join(" · "))}</p></a>`).join("")}</div></div>` : ""}
  </div>`;
}
function timelineSVG(items){ const W = 1000, H = 190, pad = 60, step = (W - pad*2) / Math.max(1, items.length - 1);
  return `<div class="hscroll"><svg viewBox="0 0 ${W} ${H}" style="min-width:680px;width:100%" role="img" aria-label="timeline"><line x1="${pad}" y1="95" x2="${W-pad}" y2="95" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
  <line x1="${pad}" y1="95" x2="${W-pad}" y2="95" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" class="map-edge draw" style="stroke-dasharray:1000;stroke-dashoffset:1000"/>
  ${items.map((t,i) => { const x = pad + i*step, up = i % 2 === 0; return `<circle cx="${x}" cy="95" r="10" fill="var(--surface)" stroke="var(${t.v || "--accent"})" stroke-width="4"/><text x="${x}" y="${up ? 58 : 136}" text-anchor="middle" font-size="17" font-weight="900" fill="var(${t.v || "--accent"})" font-family="var(--font)">${esc(t.when)}</text><text x="${x}" y="${up ? 36 : 158}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fg)" font-family="var(--font)">${esc(t.what)}</text>`; }).join("")}</svg></div>`; }

function vPositions(){ const P = X.positions || [];
  return `<div class="eyebrow">Positions</div><h1 style="font-size:2rem;font-weight:900;margin:4px 0 6px">What the author affirms and rejects</h1><p class="muted" style="max-width:70ch;margin-bottom:18px">Each row sets the teaching the book opposes against the position it defends, with the chapters where the case is made.</p>
  <div class="panel hscroll"><table class="matrix"><thead><tr><th>Topic</th><th>Teaching the book rejects</th><th>Position the book defends</th><th>Chapters</th></tr></thead><tbody>${P.map(p => `<tr><td>${esc(p.topic)}</td><td>${esc(p.rejects)}</td><td>${esc(p.affirms)}</td><td>${(p.ch||[]).map(n => byId["ch"+n] ? `<a class="pill" href="#ch${n}">${n === 0 ? "Intro" : n}</a>` : "").join(" ")}</td></tr>`).join("")}</tbody></table></div>`; }
function vCompare(){ const P = X.compare || [];
  return `<div class="eyebrow">Compare</div><h1 style="font-size:2rem;font-weight:900;margin:4px 0 6px">The book and the response, topic by topic</h1><p class="muted" style="max-width:70ch;margin-bottom:18px">A side-by-side matrix of the main disputed questions, with the lenses that carry each reply.</p>
  <div class="panel hscroll"><table class="matrix"><thead><tr><th>Topic</th><th>The book</th><th>The response</th><th>Lenses</th><th>Chapters</th></tr></thead><tbody>${P.map(p => `<tr><td>${esc(p.topic)}</td><td>${esc(p.book)}</td><td>${esc(p.resp)}</td><td>${lensChips(p.lenses)}</td><td>${(p.ch||[]).map(n => byId["ch"+n] ? `<a class="pill" href="#ch${n}">${n === 0 ? "Intro" : n}</a>` : "").join(" ")}</td></tr>`).join("")}</tbody></table></div>`; }
function vLenses(){ const L = X.lenses || [];
  const counts = Object.fromEntries(LENSES.map(l => [l.key, 0])); CH.forEach(c => c.claims.forEach(a => (a.response?.lenses || []).forEach(k => { if (k in counts) counts[k]++; })));
  const tot = Object.values(counts).reduce((a,b) => a+b, 0) || 1; let a0 = -Math.PI/2; const R = 170, r = 92, C = 200;
  const segs = LENSES.map(l => { const frac = counts[l.key] / tot, a1 = a0 + frac * Math.PI * 2, large = frac > .5 ? 1 : 0;
    const p = (a, rr) => [C + Math.cos(a)*rr, C + Math.sin(a)*rr]; const [x1,y1] = p(a0,R), [x2,y2] = p(a1,R), [x3,y3] = p(a1,r), [x4,y4] = p(a0,r); const am = (a0+a1)/2, [lx,ly] = p(am, (R+r)/2);
    const d = `M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${large} 0 ${x4} ${y4} Z`; a0 = a1;
    return `<g class="seg" data-go="lens-${l.key}"><path d="${d}" fill="var(${l.v})" stroke="var(--surface)" stroke-width="3"/>${frac > .05 ? `<text x="${lx}" y="${ly+5}" text-anchor="middle" font-size="15" fill="var(--bg)">${counts[l.key]}</text>` : ""}</g>`; }).join("");
  return `<div class="eyebrow">Six lenses</div><h1 style="font-size:2rem;font-weight:900;margin:4px 0 6px">The six readings behind every answer</h1><p class="muted" style="max-width:72ch;margin-bottom:18px">Each response draws on one or more of these frameworks. The wheel shows how often each lens is used across all ${totals.claims} answers. Select a slice to read its primer.</p>
  <div class="two" style="align-items:center"><div class="panel"><svg class="wheel" viewBox="0 0 400 400" role="img" aria-label="Lens usage wheel"><g class="spin">${segs}</g><circle cx="200" cy="200" r="86" fill="var(--surface)"/><text x="200" y="196" text-anchor="middle" font-size="40" fill="var(--fg)">${tot}</text><text x="200" y="222" text-anchor="middle" font-size="13" fill="var(--muted)">lens uses</text></svg></div>
  <div class="legend" style="flex-direction:column;gap:10px;font-size:.95rem">${LENSES.map(l => `<span><i style="background:var(${l.v});width:14px;height:14px"></i><b>${l.label}</b>&nbsp;<span class="muted">${counts[l.key]} answers</span></span>`).join("")}</div></div>
  <div class="lensgrid" style="margin-top:20px">${L.map(l => { const lo = lensOf(l.key); return `<article class="lcard" id="lens-${l.key}" style="--lc:var(${lo.v})"><h3>${esc(lo.label)}</h3><p>${esc(l.core)}</p>${l.svg || ""}<ul>${(l.points||[]).map(p => `<li>${esc(p)}</li>`).join("")}</ul>${refChips(l.refs)}<button class="chipbtn" data-lensjump="${l.key}" style="--lc:var(${lo.v});align-self:flex-start">See answers using this lens</button></article>`; }).join("")}</div>
  <div id="lensHits" style="margin-top:20px"></div>`; }
function wireLenses(root){
  root.querySelectorAll(".seg").forEach(g => g.addEventListener("click", () => document.getElementById(g.dataset.go)?.scrollIntoView({behavior:"smooth"})));
  root.querySelectorAll("[data-lensjump]").forEach(b => b.addEventListener("click", () => { const k = b.dataset.lensjump, lo = lensOf(k); const hits = [];
    CH.forEach(c => c.claims.forEach(a => { if ((a.response?.lenses || []).includes(k)) hits.push({c, a}); }));
    const box = $("#lensHits", root); box.innerHTML = `<div class="panel"><h2 style="color:var(${lo.v})">${lo.label}: ${hits.length} answers</h2><div class="hits" style="margin-top:12px">${hits.map(({c,a}) => `<a class="hit" href="#${c.id}"><small>${chName(c)} · ${esc(c.title)}</small><b>${esc(a.claim)}</b><div class="muted" style="font-size:.9rem">${esc((a.response.text || "").slice(0, 220))}…</div></a>`).join("")}</div></div>`; box.scrollIntoView({behavior:"smooth"}); })); }

function vQuestions(){ const all = CH.flatMap(c => c.questions.map(q => ({q, c})));
  return `<div class="eyebrow">Questions</div><h1 style="font-size:2rem;font-weight:900;margin:4px 0 14px">${all.length} questions the book asks${ANS ? ", answered twice" : ""}</h1>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="qq" placeholder="Search questions and answers" autocomplete="off"></div>
  <div class="qs" id="qlist">${all.map(({q,c}) => qCard(q, c).replace('<div class="qq">', `<a class="pill" href="#${c.id}" style="align-self:flex-start">${chName(c)}</a><div class="qq">`)).join("")}</div>`; }
function vScripture(){ const books = {}; REFS.forEach(r => { const b = r.book || "Other"; (books[b] = books[b] || []).push(r); });
  const order = BOOKS.map(b => b.name).concat(["Other"]).filter(b => books[b]);
  return `<div class="eyebrow">Scripture index</div><h1 style="font-size:2rem;font-weight:900;margin:4px 0 14px">${totals.refs} references across ${order.length} books</h1>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="sq" placeholder="Search a reference, e.g. Heb 10 or 2 Tim 1:10" autocomplete="off"></div>
  <div class="toolbar" id="bookbar">${order.map(b => `<button class="chipbtn" data-b="${esc(b)}">${esc(b)} <span style="opacity:.6">${books[b].length}</span></button>`).join("")}</div>
  <div class="hits" id="slist"></div>`; }
function wireScripture(root){
  const list = $("#slist", root), inp = $("#sq", root), bar = $("#bookbar", root);
  const render = (fn, label) => { const hits = REFS.filter(fn).slice(0, 300);
    list.innerHTML = hits.length ? hits.map(r => `<a class="hit" href="#${r.ch.id}"><small>${chName(r.ch)} · ${esc(r.ch.title)}</small><b>${esc(r.ref)}</b> <span class="muted">· ${esc(r.where)}</span></a>`).join("") : `<p class="muted">No references match “${esc(label)}”. Try a book name such as Hebrews or a chapter such as Rom 8.</p>`; };
  const norm = s => s.toLowerCase().replace(/\s+/g, " ").trim();
  inp.addEventListener("input", () => { const v = norm(inp.value); bar.querySelectorAll(".chipbtn").forEach(b => b.classList.remove("on")); if (!v) { list.innerHTML = ""; return; }
    const bk = bookOf(v); const num = (v.match(/\d+(:\d+)?$/) || [""])[0];
    render(r => norm(r.ref).includes(v) || (bk && r.book === bk && (!num || norm(r.ref).includes(" " + num) || norm(r.ref).endsWith(num))), inp.value); });
  bar.addEventListener("click", e => { const b = e.target.closest(".chipbtn"); if (!b) return; bar.querySelectorAll(".chipbtn").forEach(x => x.classList.toggle("on", x === b)); inp.value = ""; render(r => (r.book || "Other") === b.dataset.b, b.dataset.b); });
  const first = bar.querySelector(".chipbtn"); if (first && !inp.value) first.click();
}
function vSearch(){ return `<div class="eyebrow">Search</div><h1 style="font-size:2rem;font-weight:900;margin:4px 0 14px">Search the whole ${ANS ? "companion" : "book map"}</h1>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="gq" placeholder="Try ‘repentance’, ‘Hebrews 6’, ‘healing’, ‘hell’" autocomplete="off"></div><div class="hits" id="glist"></div>`; }
function wireSearch(root){ const inp = $("#gq", root), list = $("#glist", root);
  const docs = []; CH.forEach(c => { docs.push({c, t:c.title, b:c.summary + " " + (c.thesis||"") + (ANS ? " " + (c.responseOverview||"") : "")});
    c.claims.forEach(a => docs.push({c, t:a.claim, b:a.detail + " " + (a.refs||[]).join(" ") + (ANS ? " " + (a.response?.text||"") : "")}));
    c.questions.forEach(q => docs.push({c, t:q.q, b:q.answer + (ANS ? " " + q.response : "")}));
    c.criticisms.forEach(k => docs.push({c, t:"Critique: " + k.of, b:k.critique + " " + (k.quote||"") + (ANS ? " " + (k.response||"") : "")}));
    c.illustrations.forEach(s => docs.push({c, t:s.title, b:s.story + " " + s.point})); });
  const hl = (s, w) => { let h = esc(s); w.forEach(x => { if (x.length > 1) h = h.replace(new RegExp("(" + x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>"); }); return h; };
  const run = () => { const v = inp.value.trim().toLowerCase(); if (v.length < 2) { list.innerHTML = `<p class="muted">Type at least two letters.</p>`; return; } const w = v.split(/\s+/);
    const hits = docs.filter(d => w.every(x => (d.t + " " + d.b).toLowerCase().includes(x))).slice(0, 80);
    list.innerHTML = hits.length ? `<p class="muted">${hits.length}${hits.length === 80 ? "+" : ""} matches</p>` + hits.map(d => { const i = d.b.toLowerCase().indexOf(w[0]); const snip = d.b.slice(Math.max(0, i - 80), i + 180);
      return `<a class="hit" href="#${d.c.id}"><small>${chName(d.c)} · ${esc(d.c.title)}</small><b>${hl(d.t, w)}</b><div class="muted" style="font-size:.9rem">${i > 80 ? "…" : ""}${hl(snip, w)}…</div></a>`; }).join("") : `<p class="muted">Nothing matches “${esc(inp.value)}”. Try a single word such as grace, heal or hell.</p>`; };
  inp.addEventListener("input", run); inp.focus(); }
$("#searchBtn").addEventListener("click", () => { location.hash = "search"; });

/* ---------- router ---------- */
let pendingScroll = null;
function route(){
  const h = (location.hash || "#home").slice(1) || "home";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.k === h || (h.startsWith("ch") && h !== "chapters" && a.dataset.k === "chapters")));
  let html, wire;
  if (byId[h]) { html = vChapter(byId[h]); wire = wireChapter; }
  else if (h === "chapters") { html = vChapters(); wire = r => { const i = $("#cq", r); i.addEventListener("input", () => { const v = i.value.toLowerCase(); r.querySelectorAll(".ccard").forEach(a => { a.hidden = !!v && !a.textContent.toLowerCase().includes(v); }); }); }; }
  else if (h === "diagrams") { html = vDiagrams(); wire = r => { r.querySelectorAll(".bar").forEach(b => b.addEventListener("click", () => { location.hash = "scripture"; setTimeout(() => { const c = document.querySelector(`#bookbar [data-b="${b.dataset.book}"]`); c && c.click(); }, 40); }));
      r.querySelectorAll("[data-sec]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); pendingScroll = "sec-" + a.dataset.sec; location.hash = "home"; })); }; }
  else if (h === "positions" && !ANS) { html = vPositions(); }
  else if (h === "compare" && ANS) { html = vCompare(); }
  else if (h === "lenses" && ANS) { html = vLenses(); wire = wireLenses; }
  else if (h === "questions") { html = vQuestions(); wire = r => { wireChapter(r); const i = $("#qq", r); i.addEventListener("input", () => { const v = i.value.toLowerCase(); r.querySelectorAll(".q").forEach(q => { q.hidden = !!v && !q.textContent.toLowerCase().includes(v); }); }); }; }
  else if (h === "scripture") { html = vScripture(); wire = wireScripture; }
  else if (h === "search") { html = vSearch(); wire = wireSearch; }
  else if (h.startsWith("lens-") && ANS) { location.hash = "lenses"; return; }
  else { html = vHome(); wire = wireMap; }
  app.innerHTML = `<div class="view">${html}</div>`;
  if (wire) wire(app);
  if (pendingScroll) { const id = pendingScroll; pendingScroll = null; setTimeout(() => document.getElementById(id)?.scrollIntoView({behavior:"smooth"}), 60); }
  else window.scrollTo({top:0});
}
window.addEventListener("hashchange", route);
route();
})();
