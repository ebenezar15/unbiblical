 conditional salvation from God's 'if' to Cain to Malachi's 'if' to the priests.","refs":["2 Pet 1:10"],"target":"Unconditional salvation"},{"claim":"Exhortations to continue would be ludicrous if falling away were impossible","detail":"'The one who endures to the end will be saved' (Matt 10:22). 'If you continue in my word, you are truly my disciples' (John 8:31). Branches separated from Christ are dead wood thrown on the fire (John 15:5-6). 'Stand true to the Lord' (1 Cor 16:13). 'We share in Christ, if only we hold our first confidence firm to the end' (Heb 3:14). 'Don't quit, even if it costs your life' (Rev 2:10). 'Keep a tight grip on what you have' (Rev 3:11).","refs":["Matt 10:22","John 8:31","John 15:5-6","1 Cor 16:13","Heb 3:14","Rev 2:10","Rev 3:11"],"target":"Once saved, always saved"},{"claim":"Perseverance has conditions: abiding, continuing, enduring, firmness, faithfulness","detail":"Citing a charismatic systematic theologian whose first volume the author read as an agricultural-college student, he says nothing in the Bible teaches unconditional perseverance for saved people still living in sin. Starting from 1 Cor 10:12 ('if you think you are standing firm, be careful that you don't fall'), the theologian lists five conditions with supporting texts: abiding, continuing, enduring, firmness and faithfulness.","refs":["1 Cor 10:12","1 John 2:24-25","Col 1:21-23","Rom 11:22","2 Tim 2:10-12","Heb 10:34-39","Heb 3:1-6","2 Pet 1:5-11","Rev 2:4-5"],"target":"Unconditional perseverance"},{"claim":"This is not salvation by works: we are guarded through faith","detail":"Expecting the charge of works-salvation, the theologian cites 1 Pet 1:5: believers 'by God's power are being guarded through faith for a salvation ready to be revealed.' We are saved by faith and guard our faith by continuing in faith. But faith that is alone and not expressed in works is not real saving faith, which is the message of James.","refs":["1 Pet 1:5","Jas 2:17"],"target":"Charge that conditional security is works-salvation"},{"claim":"Warnings against apostasy show the danger is real, or Scripture would be lying","detail":"'Be on your guard so that you may not be carried away by the error of lawless men and fall from your secure position' (2 Pet 3:17), with the positive counterpart 'grow in grace' (3:18). If there were no real possibility of permanent backsliding, the Spirit-inspired writers would be joking or even lying.","refs":["2 Pet 3:17-18"],"target":"Once saved, always saved"},{"claim":"Hebrews 6:4-8 describes true Christians in real peril of falling away","detail":"Quoting an evangelical commentator, the author says there is no more powerful description of the true Christian in the New Testament than Heb 6:4-8, and one would have to be stone-blind not to see that these people were in real peril of falling away. Hebrews' warnings are summarised as: pay attention lest you drift (2:1-4), do not harden your heart (3:1-19), fear lest you fall short (4:1-13), press on lest you fall away (5:11-6:12), hold fast lest you die (10:19-39), and be careful lest you fall short (12:1-17).","refs":["Heb 6:4-8","Heb 2:1-4","Heb 3:1-19","Heb 4:1-13","Heb 10:19-39","Heb 12:1-17"],"target":"Once saved, always saved"},{"claim":"Without actively remaining in Christ, a believer could die and burn forever","detail":"Steve Jobs once said that without attention Apple 'could, could, could... die.' The author applies this: a believer receives the tremendous gift of salvation on repenting and trusting Christ, but without actively remaining in Christ he could die in sin, go to hell and burn there forever.","refs":[],"target":"Security without abiding"},{"claim":"Actual cases: those who 'believe for a while' and fall away","detail":"In the parable of the sower some 'believe for a while, but in time of testing fall away' (Luke 8:13). Jesus predicted many would turn from the faith and love would grow cold (Matt 24:10, 12). The author says you can only turn from a faith you were already in, so these were genuine believers, which Calvinists rush to deny. Some have shipwrecked their faith (1 Tim 1:19).","refs":["Luke 8:13","Matt 24:10-12","1 Tim 1:19"],"target":"Once saved, always saved"},{"claim":"Demas, apostate teachers and names removed from the book of life","detail":"Demas, a member of Paul's team, deserted Paul and perhaps the faith because 'he loved this present world' (2 Tim 4:10). Peter describes teachers who had known the way of righteousness and turned their backs on the sacred commandment (2 Pet 2:20-22). If they turned their backs on it, they once faced it and were believers. Rev 22:19 says some can have their names removed from the book of life.","refs":["2 Tim 4:10","2 Pet 2:20-22","Rev 22:19"],"target":"Once saved, always saved"},{"claim":"Ananias, Sapphira and Simon the Sorcerer were believers in real danger of hell","detail":"Quoting a renowned New Testament scholar, the author says we cannot be sure Ananias and Sapphira were not believers unless we hold that no one guilty of deliberate deceit can be a Christian. Simon the Sorcerer's story suggests that serious sin by church members could lead to exclusion from eternal life, with a possibility of repentance. Faith and faithfulness share the same root word in the Bible. These three are offered as believers who became apostate.","refs":["Acts 5:1-11","Acts 8:13-24"],"target":"Once saved, always saved"},{"claim":"Jesus' prayer to keep the disciples shows the danger was real","detail":"Eternal-security advocates cite Jesus asking the Father to keep his disciples (John 17:11, 15, 24). The author replies that the prayer itself shows Jesus knew they were in real danger of being lost, or they would not need guarding. Quoting an evangelical scholar, he says John 17 must be read alongside John 15:6, 16, which warn about falling away.","refs":["John 17:11","John 17:15","John 17:24","John 15:6"],"target":"John 17 as proof of eternal security"},{"claim":"John 10:28 applies only to sheep who keep hearing and following","detail":"John 10:28-29 must not be separated from 10:27: 'My sheep hear my voice... and they follow me.' Citing a scholar of apostasy, the author says the Greek present indicative denotes action in progress. So 'they will never perish; no one will snatch them' applies only to those of whom Jesus can say, 'My sheep keep listening and keep following.'","refs":["John 10:27-29"],"target":"John 10:28 as proof of eternal security"},{"claim":"John 5:24's present tense: the one habitually believing has eternal life","detail":"A Greek scholar's translation keeps the present tense: 'He who habitually hears my word and is believing... has life eternal.' Another Bible teacher, summarising Hebrews, notes that the Old Testament saints 'were still living by faith when they died' (Heb 11:13). Faith must be a present possession for the promises of security to work.","refs":["John 5:24","Heb 11:13"],"target":"John 5:24 as proof of eternal security"},{"claim":"Like Sehwag squandering talent, believers can squander salvation through laziness","detail":"Greg Chappell wrote that Virender Sehwag, the most gifted ball striker he had seen, was in danger of squandering his God-given talent because he would not train with discipline: 'He wants the prize but has been unwilling to pay the price.' Believers likewise risk squandering their God-given salvation by stubbornly refusing to remain in Christ and being lazy in their fight against sin.","refs":[],"target":"Complacent security"},{"claim":"The Spirit's seal is a deposit God can withdraw if we break our side","detail":"Some cite the Spirit's sealing and guarantee (2 Cor 1:22; 5:5; Eph 1:13-14; Rom 8:9; John 14:16). Quoting a Bible commentator, the author argues that earnest money shows God's good intentions but does not guarantee human faithfulness. Human buyers sometimes back out after paying earnest money, and if we break the covenant God can withdraw his earnest. David, after Bathsheba, prayed 'Do not take your Holy Spirit from me' (Ps 51:11), which shows the Spirit could leave.","refs":["2 Cor 1:22","2 Cor 5:5","Eph 1:13-14","Ps 51:11"],"target":"Spirit's seal as proof of eternal security"},{"claim":"The same letters warn of disqualification (2 Cor 13:5; 1 Cor 9:27)","detail":"If Paul meant the seal of 2 Cor 1:22 and 5:5 to rule out backslidden believers going to hell, he would not have written in the same letter, 'Examine yourselves... unless indeed you are disqualified' (2 Cor 13:5). The author says this means those who do not live the 'Christ-in-me' life of holiness will be disqualified from heaven. Paul also uses himself as an example of not being disqualified (1 Cor 9:27).","refs":["2 Cor 13:5","1 Cor 9:27"],"target":"Sealing as unconditional security"},{"claim":"Grieving the Spirit can lead him finally to leave the stubborn believer","detail":"Ephesians mentions the seal (1:13-14) and also says not to grieve the Spirit by whom we were sealed (4:30). Some say the grieved Spirit still stays until the day of redemption, but Eph 5:1-5 warns that the immoral have no inheritance, and the author says that will 'surely' be the stubborn believer's fate too. He argues the Spirit keeps convicting, but after a God-set point the grieved or quenched Spirit (1 Thess 5:19) finally leaves. Only God knows when that happens.","refs":["Eph 1:13-14","Eph 4:30","Eph 5:1-5","1 Thess 5:19"],"target":"Sealing as unconditional security"},{"claim":"Once the Spirit leaves, the person cannot repent; respond to conviction now","detail":"Only the Holy Spirit brings conviction of sin (John 16:8; 1 Cor 14:24), so once his ministry is withdrawn the person cannot repent. Believers must respond immediately when the Spirit gently says 'that is lust, that is pride, that is selfishness, repent now.' Ongoing disobedience stores up wrath that will be fully revealed in eternal hell (Rom 2:4-5; 2 Thess 1:8-9).","refs":["John 16:8","1 Cor 14:24","Rom 2:4-5","2 Thess 1:8-9"],"target":"Delayed repentance"},{"claim":"Rom 8:9: those who once belonged to Christ can still go to hell","detail":"Rom 8:9 ('if anyone does not have the Spirit of Christ, they do not belong to Christ') is used to say the Spirit never leaves. The author reads 'belong to Christ' in light of Rom 1:6: Gentiles who repented began to belong to Christ, but if they backslide and keep sinning stubbornly they store up wrath (Rom 2:4-5). So those who once belonged to Christ, and once had his Spirit, can go to hell after the Spirit, unheeded, finally leaves.","refs":["Rom 8:9","Rom 1:6","Rom 2:4-5"],"target":"Rom 8:9 as proof the Spirit never leaves"},{"claim":"John 14:16's 'forever' applies to obedient disciples; Judas proves the point","detail":"Jesus promised the Spirit 'to be with you forever' (cited as John 16:14; actually John 14:16), but the author says this is not about backslidden disciples. John 14:23 says the Father and Son make their home with those who love and obey Jesus, and the Spirit does the same. Judas's name was written in heaven with the other disciples (Luke 10:20), yet he kept stealing (John 12:6). After many chances, Satan entered him and Jesus said 'What you are about to do, do quickly' (John 13:27), ending his chances. A stubborn believer can likewise have Satan enter, the Spirit leave, and be unable to be saved, though only God knows when this has happened.","refs":["John 14:16","John 14:23","Luke 10:20","John 12:6","John 13:27"],"target":"John 14:16 as proof the Spirit never leaves"},{"claim":"Classical Calvinists and Arminians say the same thing; hyper-grace Calvinists are the problem","detail":"A classical Calvinist theologian says those who forsake the faith may return because the Spirit will complete his work, or may never repent, which shows they were never truly converted. The author has no problem with this. Arminians say the stubborn are lost, and classical Calvinists say the stubborn were never saved: the same thing in different terms. His real problem is with hyper-grace Calvinists who say believers stay saved even if they are stubborn in sin and never repent.","refs":[],"target":"Hyper-grace Calvinism"},{"claim":"Scripture never warns 'make sure you were really converted'; it says continue","detail":"An evangelical New Testament scholar argues that if the Calvinist theory were true, the Bible's warnings would read 'Make sure you are really converted; beware lest your experience was not real.' Scripture's warnings are not like that. The positive command is not to start being a genuine believer, but to continue and persevere in the faith one already has.","refs":[],"target":"Calvinist 'never truly saved' explanation"},{"claim":"Emphasising human faith doesn't destroy grace; faith is no work","detail":"Calvinists say that emphasising human faith destroys salvation's purely gracious character. The author disagrees. Faith is not a work at all (Rom 4:16). Quoting a theologian whose pluralist leanings he rejects, he says faith is surrendering the will and stretching out an empty hand to receive grace. Faith scorns self-righteousness and excludes conceit.","refs":["Rom 4:16"],"target":"Calvinist charge against Arminian faith"},{"claim":"Limited atonement is wrong: 'many' means 'all'; Christ died for all","detail":"The author rejects the Calvinist teaching that Christ died only for the elect (reading 'many' in Mark 10:45 and Matt 20:28 as the elect). Rom 5:15-18 uses 'many' and 'all' interchangeably. 2 Cor 5:14-15 and Heb 2:9 say Jesus died for all, and Jesus commanded preaching to all nations (Matt 24:14; 28:19).","refs":["Mark 10:45","Matt 20:28","Rom 5:15-18","2 Cor 5:14-15","Heb 2:9","Matt 24:14","Matt 28:19"],"target":"Limited atonement"},{"claim":"Philosophically, God overriding free will to secure believers would be evil","detail":"Eternal security, the author says, teaches that God overrides believers' free will to keep them forever. Quoting an apologist: love is the greatest good for free creatures, love requires freedom, and so overriding freedom to secure believers would deprive them of their greatest good. That would be evil, and God committing sin is a philosophical impossibility.","refs":[],"target":"Eternal security as overriding free will"},{"claim":"We are not robots: free will remains until God makes it permanent at Judgment","detail":"Eternal security implies we are robots without free will, but Scripture teaches free will: 'choose today whom you will serve' (Josh 24:15) and 'Do you also want to leave?' (John 6:67). God fixes our free choice only on Judgment Day. He might say to those who rebelled for 60-70 years that he will now make their choice permanent and send them to eternal hell, where there is no fellowship with him, in everlasting torment.","refs":["Josh 24:15","John 6:67"],"target":"Eternal security as fatalism"},{"claim":"Practical: test yourselves; balance Jude 21 and 24; run hard to finish","detail":"Rejecting eternal security calls believers to examine themselves and not drift (2 Cor 13:5). A Bible teacher notes the New Testament balance between keeping ourselves in God's love (Jude 21) and God's ability to keep us from falling (Jude 24). God will not fail, so the ball is in our court. We should run hard for the finish line like Paul (1 Cor 9:24-27).","refs":["2 Cor 13:5","Jude 21","Jude 24","1 Cor 9:24-27"],"target":"Complacency"},{"claim":"There is a way to hell even from the gates of heaven","detail":"Asked his first reaction on reaching heaven, Billy Graham said 'I would be relieved!' He agreed with John Bunyan's line in The Pilgrim's Progress: 'there is a way to Hell, even from the gates of Heaven.' The author uses this to say that even great saints did not take final salvation for granted.","refs":[],"target":"Presumption about final salvation"},{"claim":"Conditional security produces serious Christians who don't play games with God","detail":"The author says this doctrine produces serious Christians who do not dare play games with God or take his grace for granted. He concludes that believers may lose their salvation if they choose constant rebellion, and closes with 2 Tim 2:12: 'If we endure hardship, we will reign with him. If we deny him, he will deny us.'","refs":["2 Tim 2:12"],"target":"Once saved, always saved"},{"claim":"Simon was baptised yet told he could perish; backsliders should repent","detail":"Simon believed and was baptised, yet Peter told him he could perish with his money unless he repented (Acts 8:13, 20-22). The author asks backsliders to repent instead of falsely hoping they will be saved on the final day because they were saved at some point in the past.","refs":["Acts 8:13","Acts 8:20-22"],"target":"False assurance based on a past decision"}],"questions":[{"q":"Can a saved person ever be lost in hell?","answer":"Yes. A believer who wilfully lives in stubborn, unrepentant rebellion until death or Christ's return can lose salvation."},{"q":"If a sportsman can lose titles won by wilful fraud, will we lose salvation if we wilfully live in sin?","answer":"Yes, the author affirms we would."},{"q":"Why would Jesus speak of believers turning from the faith if they weren't already in it?","answer":"They were genuine believers who fell away, which Calvinists rush to deny."},{"q":"Does being sealed by the Spirit mean believers can't go to hell?","answer":"No. The seal is earnest money that God can withdraw if we break covenant. David feared losing the Spirit (Ps 51:11), and Paul warned of disqualification in the same letters."},{"q":"Does John 14:16 ('with you forever') teach once saved, always saved?","answer":"No. It applies to obedient disciples (John 14:23). Like Judas, a stubborn believer can pass the point of no return."},{"q":"Do Romans 8:9 and the 'belonging to Christ' language teach that the Spirit never leaves?","answer":"No. Those who once belonged to Christ can backslide and store up wrath, and the Spirit can finally leave them."},{"q":"If you have gone away from God, will you repent instead of hoping falsely that you'll be saved on the final day because you were once saved?","answer":"The author urges backsliders to repent now."},{"q":"Won't emphasising the conditions of perseverance amount to salvation by works?","answer":"No. We are guarded through faith (1 Pet 1:5) and faith is no work (Rom 4:16), but real faith is expressed in works (James)."}],"criticisms":[{"of":"Hyper-Calvinism and hyper-grace (anonymised)","quote":"Salvation cannot be lost even if a person lives in stubborn, till-death or till-second-coming sin.","critique":"The author says this contradicts the Old Testament 'if' conditions, the New Testament exhortations and warnings, and actual cases of apostasy."},{"of":"Hyper-grace-embracing Calvinists (anonymised)","quote":"Even if believers are stubborn in sin and won't repent, they remain saved!","critique":"This is the author's real target, as distinct from classical Calvinists, whom he says agree with Arminians in substance."},{"of":"Calvinists who cite John 17, John 10:28, John 5:24 and the Spirit's sealing","quote":"","critique":"The author says they divorce these texts from their contexts, the present tenses of continuing faith, and the warnings in the same books."},{"of":"Classical Calvinist view that apostates were never truly converted","quote":"Those who forsake the faith may someday return to faith... Or they may never repent of their apostasy, revealing thereby that they were NOT genuinely converted.","critique":"The author accepts it as equivalent to Arminianism, but an Arminian scholar notes that Scripture never warns 'make sure you were really converted', only 'continue'."},{"of":"Limited atonement teachers","quote":"","critique":"The author says 'many' means 'all' in Rom 5:15-18, and Christ died for all (2 Cor 5:14-15; Heb 2:9)."}],"illustrations":[{"title":"Lance Armstrong stripped of his titles","story":"After admitting to doping, the cyclist lost his seven Tour de France titles and possibly France's Legion d'Honneur.","point":"Wilful fraud forfeits titles, and wilful sin forfeits salvation."},{"title":"Pranab Mukherjee and mercy petitions","story":"India's former President rejected a record number of mercy petitions, including those of the 26/11 attacker and the Parliament attack convict.","point":"Like 'no mercy for callous crimes', some scholars teach there is no heaven for unrepentant believers."},{"title":"Kipling's poem 'If'","story":"The 1895 poem lists conditions for becoming 'a Man, my son.'","point":"Salvation is likewise conditioned by 'if', and we can lose it if careless."},{"title":"A termite-eaten theology book","story":"As an agricultural-college student the author was given a termite-damaged volume of a charismatic systematic theology. He devoured it and taught it in hostel rooms, which began his ministry of leading Bible studies.","point":"It introduces the theologian's five conditions for perseverance."},{"title":"Steve Jobs on Apple 'could die'","story":"Jobs said Apple had great assets but without attention could die.","point":"Without remaining in Christ, a believer could die in sin and go to hell."},{"title":"Greg Chappell on Virender Sehwag","story":"The former coach said Sehwag was the most gifted ball striker but wanted the prize without paying the price and risked squandering his talent.","point":"Lazy, unrepentant believers risk squandering salvation."},{"title":"Earnest money in human transactions","story":"Buyers sometimes back out after paying earnest money.","point":"The Spirit's guarantee does not ensure human faithfulness, and God can withdraw it."},{"title":"Judas and 'do it quickly'","story":"Judas, a thief, was given many chances, then Satan entered him and Jesus said 'What you are about to do, do quickly' (John 13:27).","point":"A stubborn believer can pass a point of no return."},{"title":"Billy Graham 'relieved' and Bunyan's way to hell","story":"Graham said he would be relieved on reaching heaven. Bunyan wrote that there is a way to hell even from the gates of heaven.","point":"Even great saints did not presume on final salvation."}],"keyVerses":[{"ref":"Gen 4:7","text":"it will be accepted if you respond the right way","use":"Salvation was conditional from the beginning."},{"ref":"1 Chr 28:7","text":"if he continues to obey my commands","use":"The Davidic covenant's 'if'."},{"ref":"2 Pet 1:10","text":"For if you do these things, you will never stumble","use":"The NT seconds the OT 'if'."},{"ref":"Matt 10:22","text":"all of you who endure to the end shall be saved","use":"Exhortation to continue."},{"ref":"Heb 3:14","text":"we share in Christ, if only we hold our first confidence firm to the end","use":"Conditional sharing in Christ."},{"ref":"1 Cor 10:12","text":"if you think you are standing firm, be careful that you don't fall","use":"Basis for the conditions of perseverance."},{"ref":"1 Pet 1:5","text":"by God's power are being guarded through faith","use":"Not works: kept through continued faith."},{"ref":"2 Pet 3:17","text":"be on your guard so that you may not... fall from your secure position","use":"Warning against apostasy."},{"ref":"Heb 6:4-8","text":"","use":"True Christians in real peril of falling away."},{"ref":"Luke 8:13","text":"believe for a while, but in the time of testing they fall away","use":"Actual apostasy."},{"ref":"2 Tim 4:10","text":"Demas... loved this world","use":"Actual apostasy."},{"ref":"Rev 22:19","text":"","use":"Names can be removed from the book of life."},{"ref":"John 10:27","text":"My sheep hear my voice... and they follow me","use":"Present tense: security only for those who keep following."},{"ref":"Eph 4:30","text":"do not grieve the Holy Spirit of God, with whom you were sealed","use":"The grieved Spirit can finally leave."},{"ref":"Ps 51:11","text":"Do not take your Holy Spirit from me!","use":"The Spirit can leave a rebel."},{"ref":"John 13:27","text":"What you are about to do, do quickly","use":"Judas passed the point of no return."},{"ref":"Rom 5:18","text":"condemnation of ALL men","use":"'Many' equals 'all', against limited atonement."},{"ref":"John 6:67","text":"Do you also want to leave?","use":"Free will remains."},{"ref":"Jude 21","text":"keep yourselves in God's love","use":"Our responsibility balanced with God's keeping (Jude 24)."},{"ref":"2 Tim 2:12","text":"If we deny him, he will deny us","use":"Concluding text."}],"flow":["Armstrong lost titles; can believers lose salvation?","Reformed vs Arminian views and history","OT covenants all carry 'if' conditions","NT: exhortations, warnings, actual apostates","Rebut proof texts: John 10, 17, sealing, Rom 8:9","Spirit can leave stubborn believer, like Judas","Theology and free will oppose eternal security","Practical: self-examine, persevere, repent now"]},{"num":21,"section":"Hyper-Supernaturalism","title":"“Greater Works Than Jesus” Bible Phrase: Is It Talking About Forensic Prophecy or Miracle Money?","summary":"The author addresses the craze for meetings centred on 'forensic prophecy' (supposed Spirit-revealed phone numbers, bank balances, dates of birth) and 'miracle money', and the use of John 14:12 to justify them. He argues that the Bible, not miracles, is the final court of appeal, and reads John 14:12 by looking below the verse (vv. 13-17: works that glorify the Father, asked in Jesus' name, in line with his commands, empowered by the Spirit), above the verse (vv. 6-11: proclaiming Jesus' uniqueness with proof) and across the whole Bible. Study Bibles explain 'greater works' as the geographical and numerical extension of gospel ministry after Pentecost. Acts shows miracles did not always happen (James killed, Peter freed), that suffering for Jesus is a 'greater work', and that the apostles met money needs by collections, selling property and tent-making, never by praying for money to multiply. Since magicians, demons, false prophets and the Antichrist can work signs, miracles prove nothing about God's approval or one's salvation.","thesis":"John 14:12's 'greater works' means Spirit-empowered, Christ-glorifying worldwide gospel proclamation, not forensic prophecy or miracle-money multiplication, and miracles are never the test of a true ministry.","outlines":[{"acronym":"Three-way reading of John 14:12 (Below / Above / All the Bible)","items":[{"letter":"1","label":"Below the passage","point":"John 14:13-17: greater works must glorify the Father, be fit to be asked in Jesus' name, line up with his commands, and be empowered by the coming Holy Spirit; in Acts they include suffering for Jesus and a worldwide evangelism explosion.","refs":["John 14:13-17","Acts 5:40-42","Acts 1:8","Acts 12:2","Acts 12:7"]},{"letter":"2","label":"Above the passage","point":"John 14:6-11: Jesus claims to be the only way and to be in the Father, offering his works as evidence; so the greater work is proclaiming the unique gospel with an apologia on a far wider scale.","refs":["John 14:6","John 14:11"]},{"letter":"3","label":"All the Bible in the light of this passage","point":"The rest of Scripture shows the apostles never prayed for money to multiply, that miracles happen subject to God's will, and that false prophets and demons also work signs.","refs":["Acts 2:45","Acts 4:34","Acts 18:1-3","Rom 15:26","1 Cor 16:1-2","Matt 7:21-23","2 Thess 2:9-10"]}]}],"claims":[{"claim":"The Bible, not miracles, is the final court of appeal","detail":"A worship leader's challenge to critics to 'first raise 10 people from the dead' shows a hyper-supernatural mindset in which miracles validate a ministry. The author insists the Bible is the final court of appeal for belief and behaviour, and that no interpretation of one verse may violate the rest of the Bible.","refs":["John 14:6","Acts 4:12"],"target":"Miracles as proof that a ministry is genuine"},{"claim":"John 14:12 cannot make believers a greater way of salvation","detail":"If 'greater works' meant believers surpass Jesus in every respect, they could claim to be a greater way of salvation than Jesus, which John 14:6 and Acts 4:12 forbid. So 'works' must be defined from the context and the rest of Scripture, not assumed to mean spectacular signs and wonders.","refs":["John 14:12","John 14:6","Acts 4:12"],"target":"'Greater works' as license for any supernatural spectacle"},{"claim":"Greater works must glorify the Father and be asked in Jesus' name","detail":"Reading below the verse (John 14:13-14), greater works are those that bring the Father glory and are worthy to be asked in Jesus' name. One could not quote John 14:12 to justify marrying many women, since such a request contradicts Jesus' teaching and cannot be asked in his name.","refs":["John 14:13-14"],"target":"Using John 14:12 to justify unbiblical practices"},{"claim":"Greater works must line up with Jesus' commands and need the Spirit","detail":"John 14:15 ties the works to loving obedience to Jesus' commands, and from John 14:16 Jesus introduces the Holy Spirit. So the greater works require the fullness of the Spirit and must be in line with the Word of God.","refs":["John 14:15","John 14:16-17"],"target":"Works detached from obedience and the Spirit"},{"claim":"God does not always grant the miracles believers ask for","detail":"In Acts, James was executed while Peter was miraculously freed (Acts 12); James, like David, served God's purpose in his generation and died (Acts 13:36). The hyper-supernatural belief, echoed in a preacher's book subtitle, that 'you can force God to answer your prayers every time' is plainly unscriptural.","refs":["Acts 12:2","Acts 12:7","Acts 13:36"],"target":"Prayer that forces God's hand every time"},{"claim":"Suffering for Jesus is part of the 'greater works'","detail":"In Acts 5:40-42 the apostles were flogged yet rejoiced to be counted worthy to suffer, and kept preaching daily. Despite the 'battering' they kept 'broadcasting', so suffering for Jesus' name is part and parcel of the greater works.","refs":["Acts 5:40-42"],"target":"A suffering-free 'greater works' gospel"},{"claim":"Greater works means geographical and numerical extension","detail":"Respected study Bibles explain that Jesus' ministry was confined to Palestine, while the apostles preached everywhere and saw thousands converted; Pentecost alone produced more followers than Jesus' whole ministry. 'Greater' refers to worldwide scope (Acts 1:8), not more amazing miracles, and modern teachers twist this to sway a biblically illiterate generation.","refs":["Acts 1:8","Acts 2:41"],"target":"'Greater works' as more spectacular miracles"},{"claim":"The greater work is proclaiming Jesus' uniqueness with proof","detail":"Above the verse, John 14:6-11 has Jesus claim to be the only way and to be in the Father, with miracles as one (not the most important) proof of his deity. So believers do greater works by presenting the unique gospel and its apologia to more people in more places.","refs":["John 14:6","John 14:11"],"target":"Signs detached from gospel proclamation"},{"claim":"Jesus never failed in healing; our miracles are subject to God's will","detail":"Jesus knew the Father's mind perfectly, which is why he never raised John the Baptist. Believers' prayers for miracles are answered subject to God's will, and Gethsemane teaches us to sign off every prayer with 'not my will but yours'. The author's prayer for his unborn daughter was answered, but his prayer for a US visa was not.","refs":["Luke 22:42"],"target":"Guaranteed miracles on demand"},{"claim":"Forensic prophecy meetings have no precedent in Acts","detail":"A Kerala preacher in Chennai 'prophesied' a 68 lakh credit into an Andhra Bank account and described the man's blue debit card; another 'prophet' revealed a phone number. Acts records no meetings focused on such revelations; the apostles prayed, looked to God in crises, and kept serving when miracles did not come.","refs":["John 14:12"],"target":"Forensic prophecy as 'greater works'"},{"claim":"The apostles met money needs by giving and work, not miracle money","detail":"When money was needed, believers sold property (Acts 2:45; 4:34-37), worked jobs like tent-making (Acts 18:1-3), took collections (Rom 15:26; 1 Cor 16:1-2), supported missionaries (2 Cor 11:9; Phil 4:15-16) and stressed giving over receiving (Acts 20:35). Since Paul calls us to imitate the apostles (1 Cor 11:1), we must follow their way, which excludes miracle-money multiplication.","refs":["Acts 2:45","Acts 4:34-37","Acts 18:1-3","Acts 20:35","Rom 15:26","1 Cor 16:1-2","2 Cor 11:9","Phil 4:15-16","1 Cor 11:1"],"target":"Praying for money to multiply"},{"claim":"Miracles happen in secular shows and through demonic power","detail":"Mentalists on secular TV make forensic predictions; Pharaoh's magicians did signs (Exod 7:11, 22; 8:7); false messiahs and prophets will deceive (Mark 13:22); miracle-workers may be rejected (Matt 7:21-23); a demonised girl prophesied (Acts 16:16-18); the lawless one and the False Prophet work deceptive signs (2 Thess 2:9-10; Rev 16:14; 19:20). So miracles neither prove God's approval nor guarantee heaven.","refs":["Exod 7:11","Exod 7:22","Exod 8:7","Mark 13:22","Matt 7:21-23","Acts 16:16-18","2 Thess 2:9-10","Rev 16:14","Rev 19:20"],"target":"Miracles as proof of God's approval"},{"claim":"Registration fees expose the miracle-money claim","detail":"If miracle money abounds, why do the organisers charge registration fees instead of praying over their own accounts to cover the meeting costs? When believers are ready to be fooled, there are preachers ready to fool them, so believers must be wise as serpents (Matt 10:16) toward those cooperating with the ancient serpent (Rev 20:2).","refs":["Matt 10:16","Rev 20:2"],"target":"Commercialised miracle meetings"}],"questions":[{"q":"Why are you busy chasing forensic-prophecy and miracle-money miracles?","answer":"Proponents answer that John 14:12 promises believers will do greater works than Jesus; the author says this answer does not hold water once the verse is read in context."},{"q":"Will you marry many women quoting John 14:12?","answer":"No; the greater works must glorify the Father and be asked in Jesus' name (John 14:13-14), and such a request contradicts Jesus' teaching."},{"q":"Can you force God to answer your prayers every time?","answer":"No; God's will governs answers, as James' death and Peter's release in Acts 12 show."},{"q":"Was Jesus envisioning forensic-prophecy meetings when he spoke of greater works?","answer":"Absolutely not; there is no record of such a focus in the book of Acts."},{"q":"Why do miracle-money preachers charge registration fees for their meetings?","answer":"Because believers who are ready to be fooled will always find preachers ready to fool them; organisers should pray over their own accounts if miracle money is real."}],"criticisms":[{"of":"a popular-on-YouTube worship leader who calls a miracle-money 'prophet' his spiritual 'papa'","quote":"First raise 10 people from the dead and then come and lecture me from the Bible what true worship is!","critique":"His argument makes miracles, not the Bible, the final court of appeal, the typical assertion of someone swayed by hyper-supernatural false teaching."},{"of":"popular forensic-prophecy preachers from India, Sri Lanka, the UK and elsewhere ('hyper-supernatural preachers')","quote":"","critique":"Their meetings centre on bizarre revelations of phone numbers, birth dates and bank details, going beyond what the Bible teaches and twisting John 14:12 to sway a biblically illiterate generation."},{"of":"a Kerala-based miracle-money preacher ministering in Chennai with a worship leader interpreting","quote":"a credit of 68 lakhs into the Andhra Bank account of someone in the audience","critique":"Such 'prophecy' about bank credits and card colours has no precedent in Acts, where the apostles met needs through giving and work."},{"of":"a popular hyper-supernatural preacher's book subtitle","quote":"You can force God to answer your prayers every time","critique":"This belief is plainly unscriptural, since God's will governs whether miracles happen, as with James and Peter."},{"of":"organisers of miracle-money meetings who charge registration fees","quote":"","critique":"If miracle money were real they would pray over their own accounts; instead they exploit believers who want to be fooled."}],"illustrations":[{"title":"Marrying many women by John 14:12","story":"A hypothetical believer reasons that Jesus never married but promised greater works, so he will marry many women.","point":"Greater works must glorify the Father and be askable in Jesus' name; John 14:12 cannot justify anything contrary to Scripture."},{"title":"Flogged yet bubbling","story":"The apostles were flogged by the Council yet left rejoicing and kept preaching daily (Acts 5:40-42).","point":"Despite the 'battering' they kept 'broadcasting'; suffering for Jesus is part of the greater works."},{"title":"Daughter raised in the womb","story":"In 2007 the author's unborn daughter was declared without a heartbeat; God answered prayer and raised her up.","point":"God does work miracles in answer to prayer, according to his will."},{"title":"The rejected US visa","story":"In 2010 the author desperately prayed his US visa for a Christian conference would be stamped, with costs sponsored, but it was rejected.","point":"Many prayed-for miracles do not happen; honest ministers share this experience."},{"title":"The Andhra Bank prophecy","story":"A Kerala preacher in Chennai 'prophesied' a 68 lakh credit to a man's Andhra Bank account and described his blue debit card; the interpreting worship leader threw his mike in the air like a cricketer taking a World Cup-winning catch.","point":"Such forensic-prophecy spectacles have no precedent in the book of Acts."},{"title":"Phone number revealed in a Chennai church","story":"A visiting 'prophet' accurately revealed a phone number of a relative of a man he pulled from the audience, to the host pastor's excitement.","point":"Meetings built around forensic prophecy are a growing craze but not what Jesus meant by greater works."},{"title":"Mentalist on a TV talent show","story":"Secular TV talent shows feature mentalists such as Colin Cloud who make forensic predictions routinely.","point":"Forensic predictions are no proof of God; non-Christian performers do them too."},{"title":"Pharaoh's magicians","story":"Egypt's magicians replicated some of Moses' signs (Exod 7:11, 22; 8:7).","point":"Miracles alone do not prove God's approval."}],"keyVerses":[{"ref":"John 14:12","text":"whoever believes in me will do the works I have been doing, and they will do even greater things than these","use":"The verse misused by forensic-prophecy and miracle-money groups; interpreted through context."},{"ref":"John 14:13-14","text":"Whatever you ask in My name, that will I do, so that the Father may be glorified in the Son","use":"Greater works must glorify the Father and be fit to be asked in Jesus' name."},{"ref":"John 14:15","text":"If you love Me, you will keep My commandments","use":"Greater works must line up with Jesus' commands."},{"ref":"John 14:6","text":"I am the way, the truth and the life","use":"Jesus is the only way of salvation; no reading of John 14:12 may contradict this."},{"ref":"Acts 1:8","text":"Jerusalem... Samaria, and to the ends of the earth","use":"Greater works are the worldwide evangelism explosion."},{"ref":"Acts 13:36","text":"David... served the purpose of God in his own generation, fell asleep","use":"Like David, James served God's purpose and died; miracles do not always come."},{"ref":"Matt 7:21-23","text":"Many will say... did we not prophesy... and do many miracles in your name?","use":"Miracle-working does not guarantee entry into the kingdom."},{"ref":"2 Thess 2:9-10","text":"signs and wonders that serve the lie","use":"The lawless one works deceptive miracles; miracles are not proof of God."}],"flow":["Forensic prophecy and miracle money are a growing craze","Proponents justify them with John 14:12","Bible, not miracles, is the final court of appeal","Below the verse: glorify Father, obey, Spirit-empowered","Acts: suffering and worldwide spread are greater works","Above the verse: proclaim Jesus' uniqueness with proof","Whole Bible: apostles never prayed for money to multiply","Counterfeit signs exist, so stay rooted in the Word"]},{"num":22,"section":"Hyper-Supernaturalism","title":"The Bible on Pestilences Put in the Outline C-O-R-O-N-A: An Anti-Hyper-Supernaturalism Bible Study","summary":"Transcribed from an online message of 22 March 2020, this chapter answers hyper-supernatural teachers who used Psalm 91 to claim believers could not catch or die of COVID-19, noting that many believers and over a hundred clergy died. Using the acronym C-O-R-O-N-A, the author argues that plagues are Creator-caused (Satan acts only by God's permission), that plagues are not obliterated for believers by the cross in this age, and explains this through 'already but not yet' theology applied to four D's: defilement, disease, death and demons. He then lists what humans can do to see a plague stopped (sacrificial entry into God's presence, separation from the world, proclamation of God's holy standards), urges orderly quarantine and obedience to government, presents pandemics as signs of nearness to the Second Coming, and calls the living to repentance from the 'sin virus'. Elijah and Elisha, Billy Graham, Nabeel Qureshi, Paul's thorn and the author's own brush with symptoms illustrate that full healing and immortality await the Second Coming. It closes with a prayer of repentance and a prayer for healing according to God's will.","thesis":"The whole Bible teaches that God sovereignly sends or permits plagues and that believers' total freedom from disease, death and demonic attack awaits the Second Coming, so Psalm 91 does not guarantee immunity from pandemics now.","outlines":[{"acronym":"C-O-R-O-N-A","items":[{"letter":"C","label":"Creator-Caused Plagues","point":"Scripture repeatedly attributes plagues to God, from Pharaoh in Gen 12 and the ten plagues to Num 11, 16 and 25, Deuteronomy, Joshua, Psalms, Zechariah and Revelation; Satan can cause disease only with God's permission, so ultimate responsibility for any plague, including COVID-19, lies with the sovereign God.","refs":["Gen 12:17","Exod 8:2","Exod 9:3","Exod 9:14","Exod 32:35","Num 11:33","Num 16:46","Num 25:9","Deut 28:59","Deut 32:24","Josh 22:17","Josh 24:5","1 Sam 4:8","Ps 78:50","Zech 14:12","Zech 14:18","Rev 18:8","Rev 22:18","Job 1:12","Dan 4:35"]},{"letter":"O","label":"Obliterated by the Cross? (absolutely not, here and now)","point":"Verses like Exod 12:13, Num 8:19, Ps 91:10 and Rev 18:4 do not mean believers can never be touched by plague now; 'already but not yet' theology applied to defilement, disease, death and demons shows full deliverance comes only after the Second Coming.","refs":["Exod 12:13","Num 8:19","Ps 91:10","Rev 18:4","Rom 8:23","Rev 21:4"]},{"letter":"R","label":"Redemption from the Plagues","point":"What can humanly be done to see a plague stopped (God's prerogative): sacrificial entry into God's presence, separation from the world, and proclamation of God's holy standards.","refs":["2 Sam 24:24","Num 16:46-48","Rev 5:8","Rev 18:4","Num 25:6-8","Ps 106:29-30","Heb 4:12","Acts 2:37"]},{"letter":"O","label":"Orderly Quarantine Has to Be Maintained","point":"The Law prescribed isolation for contagious disease long before modern medicine, and Rom 13:1 calls believers to obey government lockdowns that do not contradict Scripture; online meetings even spread the gospel into closed nations.","refs":["Lev 13:36","Lev 13:45-46","Num 5:2","Lev 15:6","Deut 23:10-11","2 Kgs 7:3","2 Kgs 15:5","2 Chr 26:21","Rom 13:1"]},{"letter":"N","label":"Nearness to the Second Coming of Jesus","point":"Pestilences are signs of Jesus' return (Luke 21:11): HIV, swine flu, Ebola, Zika and COVID-19; we must be clean and ready, as he comes like a thief.","refs":["Luke 21:11","1 Thess 5:2","Deut 23:10-11"]},{"letter":"A","label":"Alive During the Time of Plague, So We Must Repent","point":"Those who survive plagues must repent (Amos 4:10; Luke 13:1-5) of pride, porn and prayerlessness; Jesus, who touched and healed lepers, welcomes all with the sin-virus who come in repentance.","refs":["Amos 4:10","Luke 13:1-5","Prov 6:16-17","Heb 11:25","Luke 17:12","Lev 13:45","John 6:37","Rev 21:7-8"]}]},{"acronym":"The Four D's (Already but Not Yet)","items":[{"letter":"D","label":"Defilement","point":"Already holy through the cross, not yet sinless; we still stumble and must confess, as even Paul did; complete absence of sin only in the New Heaven and Earth.","refs":["1 John 1:7-9","Heb 9:14","2 Cor 5:21","1 John 1:8","Jas 3:2","Acts 23:1-5","Rev 21:27","Rom 8:13"]},{"letter":"D","label":"Disease","point":"Healing was provided at the cross, yet disease persists for mysterious reasons; Trophimus left sick, Elisha died of sickness, Paul's thorn remained; we await the redemption of our bodies.","refs":["Isa 53:5","1 Pet 2:24","2 Tim 4:20","Matt 8:16-17","2 Kgs 13:14","2 Cor 12:7-9","Rom 8:23","Rev 21:4"]},{"letter":"D","label":"Death","point":"The first coming frees us from the fear of death; the Second Coming abolishes death itself and gives immortal bodies; John 11:25-26 refers to spiritual and second death.","refs":["Heb 2:15","1 Cor 15:23","1 Cor 15:26","Phil 3:20-21","Luke 18:30","John 11:25-26","Rev 21:8"]},{"letter":"D","label":"Demons","point":"Satan was defeated at the cross but is still active, and will be consigned to hell only after the Second Coming; the kingdom is inaugurated but not consummated.","refs":["Matt 12:28","Col 2:13-15","1 Pet 5:8","Luke 17:21","Luke 23:42-43","Rev 19:20","Rev 20:10"]}]}],"claims":[{"claim":"Psalm 91 did not keep believers, even clergy, from dying of COVID","detail":"Several hyper-supernatural teachers quoted Psalm 91 to say believers would not be affected by, let alone die of, the coronavirus. Yet many believers died, and one study documented 118 clergy deaths directly related to the virus, so a doctrine built from one passage proved dangerous.","refs":["Ps 91:10"],"target":"Psalm 91 as a guarantee of pandemic immunity"},{"claim":"Doctrine must come from the whole Bible, not one passage","detail":"It is dangerous to formulate a doctrine from just one passage, so the author uses C-O-R-O-N-A to survey what the whole Bible teaches about plagues and pestilences.","refs":["Ps 91:10"],"target":"Single-verse doctrines"},{"claim":"Plagues are Creator-caused; Satan needs God's permission","detail":"Scripture repeatedly attributes plagues to God. Even when Satan causes disease (Luke 13:16; Mark 9:17, 25; Acts 10:38) he needs God's permission (Job 1:12), and God's sovereignty means no one can question him (Dan 4:35). So no plague, including COVID-19, could occur without God's permission.","refs":["Job 1:12","Dan 4:35","Luke 13:16","Acts 10:38","Mark 9:25"],"target":"Plagues as wholly outside God's sovereignty"},{"claim":"The Old Testament repeatedly records God sending plagues","detail":"From Pharaoh's household (Gen 12:17), the ten plagues (Exod 8:2; 9:3, 14), the golden calf (Exod 32:35), quail (Num 11:33), Korah (Num 16:46) and Baal-Peor (Num 25), to Deuteronomy 28:59, 32:24, Joshua 22:17, 24:5, 1 Sam 4:8, Psalm 78:50 and Zechariah 14:12, 18, the 66-book library shows God causing plagues.","refs":["Gen 12:17","Exod 8:2","Exod 9:3","Exod 9:14","Exod 32:35","Num 11:33","Num 16:46","Deut 28:59","Deut 32:24","Josh 22:17","Josh 24:5","1 Sam 4:8","Ps 78:50","Zech 14:12","Zech 14:18"],"target":"A God who never judges with plagues"},{"claim":"The Baal-Peor plague shows sin-triggered judgment","detail":"Baal worship involved temple prostitution on the belief that rain was Baal's semen (Hos 4:12-14; Amos 2:7). Balaam counselled Israel into Baal-Peor worship through a sex-dance with Moabite women (Num 31:16; Rev 2:14), and God's wrath brought a plague that killed 24,000 (Num 25:4, 9).","refs":["Num 25:4","Num 25:9","Num 31:16","Rev 2:14","Hos 4:12-14","Amos 2:7"],"target":"Sin without consequence"},{"claim":"The plague-causing God also appears in the New Testament","detail":"Revelation 18:8 speaks of plagues of death, fire and famine on Babylon in a single day, and Revelation 22:18 warns God can send plagues on rebels. So no false teacher should say the plague-causing God is only an Old Testament God.","refs":["Rev 18:8","Rev 22:18"],"target":"A merely Old Testament plague-sending God"},{"claim":"Plagues are not obliterated for believers by the cross now","detail":"The author asks whether Exod 12:13, Num 8:19, Ps 91:10 and Rev 18:4 mean holy believers cannot be touched by plague, and whether the cultic immortality teaching from South Africa (echoed in Sri Lanka and India) is right. His answer is 'absolutely not' for here and now, explained by 'already but not yet' theology.","refs":["Exod 12:13","Num 8:19","Ps 91:10","Rev 18:4"],"target":"Believers immune to plague now"},{"claim":"Already holy, not yet holy: believers still sin and confess","detail":"The cross made us holy (1 John 1:7-9; Heb 9:14; 2 Cor 5:21), yet 1 John 1:8 and James 3:2 show we still stumble. Grace is not a credit card for sin; even Paul sinned by speaking abusively to the high priest and apologised (Acts 23:1-5). Only in the New Heaven and Earth will sin be absent (Rev 21:27), so we keep putting to death the deeds of the flesh (Rom 8:13).","refs":["1 John 1:7-9","Heb 9:14","2 Cor 5:21","1 John 1:8","Jas 3:2","Acts 23:1-5","Rev 21:27","Rom 8:13","1 John 3:5-6"],"target":"Sinless perfection and grace as license"},{"claim":"Healing was provided at the cross, yet disease persists","detail":"Isa 53:5 and 1 Pet 2:24 show provision for healing, and Matt 8:16-17 records Jesus healing all in a place, in line with Exod 23:25. Yet for mysterious higher reasons not all are healed now: Paul, who healed through handkerchiefs, left Trophimus sick at Miletus (2 Tim 4:20).","refs":["Isa 53:5","1 Pet 2:24","Matt 8:16-17","Exod 23:25","2 Tim 4:20"],"target":"Believers can never be sick"},{"claim":"Elisha, though a mighty miracle-worker, died of sickness","detail":"Elijah performed 14 listed miracles and Elisha, with a double portion, 28; yet Elijah was taken up and did not live forever, and Elisha died of sickness (2 Kgs 13:14). All servants God used in healing ministry died when their time came.","refs":["2 Kgs 13:14","2 Kgs 2:11","2 Kgs 13:21"],"target":"Healing ministers exempt from sickness and death"},{"claim":"Billy Graham and Nabeel Qureshi show healing is not guaranteed","detail":"People were healed touching radios broadcasting Billy Graham's 1956 message in South India, yet he died at 99 ravaged by Parkinson's/hydrocephalus. Apologist Nabeel Qureshi died of cancer at 34 despite worldwide prayer and his plea to live for his daughter. Today there is sickness and suffering with only occasional healing; plagues keep us humble because the sovereign God is in control.","refs":[],"target":"Guaranteed healing for all believers"},{"claim":"Paul's thorn shows believers can be sick for God's purposes","detail":"Paul pleaded three times for his thorn in the flesh, some painful ailment, to be removed, but God said 'My grace is sufficient' (2 Cor 12:9). If 1 Pet 2:24 meant believers cannot be sick, the thorn would not have stayed. Sickness can be for God's glory (John 9) and to prevent conceit (2 Cor 12:7); believing 'we are gods' is conceit, while weakness creates mutual dependence.","refs":["2 Cor 12:7-9","1 Pet 2:24","John 9:1-3"],"target":"Believers cannot be sick"},{"claim":"Death: first coming removes fear; second coming removes death","detail":"Jesus' first coming frees us from the fear of death (Heb 2:15); only at his Second Coming do we receive a glorified, immortal body (1 Cor 15:23; Phil 3:20-21), with 'no more death' in the New Heaven and Earth (Rev 21:4). Eternal, deathless life is promised 'in the age to come' (Luke 18:30), and death is the last enemy defeated at his coming (1 Cor 15:26).","refs":["Heb 2:15","1 Cor 15:23","1 Cor 15:26","Phil 3:20-21","Luke 18:30","Rev 21:4"],"target":"Immortality on earth now"},{"claim":"John 11:25-26 refers to spiritual and second death","detail":"Just as 'Sunny' can mean weather, a cricketer or a car depending on context, 'death' in John 11:25-26 means spiritual death, as in 'let the dead bury their dead' (Luke 9:60) and the prodigal 'dead' son (Luke 15:24). The verse speaks of escaping spiritual death and the second death of hell (Rev 21:8; Rom 8:1), not immortality on earth.","refs":["John 11:25-26","Luke 9:60","Luke 15:24","Rev 21:8","Rom 8:1"],"target":"John 11:25-26 as earthly immortality"},{"claim":"Satan defeated at the cross but not yet in hell","detail":"Jesus cast out demons by the Spirit, showing the kingdom had come (Matt 12:28), and disarmed the powers at the cross (Col 2:13-15). Yet the devil still prowls (1 Pet 5:8) and will be cast into the lake of fire only after the Second Coming (Rev 19:11, 20; 20:10). The dying thief rightly asked to be remembered 'when you come into your kingdom' (Luke 23:42-43), showing the kingdom is already within (Luke 17:21) and yet still coming (Mark 13:26; 14:62).","refs":["Matt 12:28","Col 2:13-15","1 Pet 5:8","Luke 23:42-43","Luke 17:21","Mark 13:26","Mark 14:62","Matt 25:31-34","Rev 19:20","Rev 20:10"],"target":"Satan poses no danger now"},{"claim":"Teaching total victory over disease, death and demons is hellish","detail":"A social-media group teaches that believers cannot have disease, cannot die now and face no danger from Satan. The author calls this hellish false teaching, asks why they do not equally say 'Jesus died for our sins, so we must not sin anymore', and links them to Balaam's wages (2 Pet 2:15) and ear-tickling (2 Tim 4:3-4). The right teaching is power over sin (1 John 3:5-6) though only Jesus is sinless (1 John 1:8).","refs":["2 Pet 2:15","2 Tim 4:3-4","1 John 3:5-6","1 John 1:8"],"target":"Total present victory over disease, death and demons"},{"claim":"Psalm 91:10 is fully true only after the Second Coming","detail":"Psalm 91:10 must be balanced with Hosea 13:14, quoted in 1 Cor 15:55, which points to death's defeat after the Second Coming (1 Cor 15:23, 54). Absolute protection from plague comes only in the New Heaven and Earth (Rev 21:4); now we receive 'first-fruits' (Rom 8:23), as when the author felt COVID symptoms, prayed, and was well within an hour, while knowing he may still die of disease or accident.","refs":["Ps 91:10","Hos 13:14","1 Cor 15:54-55","Rom 8:23","Rev 21:4","1 Cor 15:23"],"target":"Psalm 91 as absolute present protection"},{"claim":"Sacrificial prayer, separation and proclamation can see plagues stopped","detail":"Though stopping plagues is God's prerogative, believers can act: (1) sacrificial entry into God's presence, as David offered costly sacrifice (2 Sam 24:24) and Aaron's incense stayed the plague (Num 16:46-48; Rev 5:8), so we should pray, fast, give and limit screens; (2) separation from the world (Rev 18:4), avoiding foul language and porn; (3) proclaiming God's holy standards like Phinehas (Num 25; Ps 106:29-30), not with a spear but the sword of the Word (Heb 4:12; Acts 2:37).","refs":["2 Sam 24:24","Num 16:46-48","Rev 5:8","Rev 18:4","Num 25:6-8","Ps 106:29-30","Heb 4:12","Acts 2:37"],"target":"Passivity during plagues"},{"claim":"Believers must keep orderly quarantine and obey lockdowns","detail":"The Law prescribed isolation for the contagious (Lev 13:36, 45-46; Num 5:2; Deut 23:10-11; 2 Kgs 7:3; 15:5; 2 Chr 26:21), long before modern medicine. Rom 13:1 calls us to obey government orders like lockdowns that do not contradict God's Word, and online meetings helped the gospel reach closed nations.","refs":["Lev 13:36","Lev 13:45-46","Num 5:2","Deut 23:10-11","2 Kgs 7:3","2 Kgs 15:5","2 Chr 26:21","Rom 13:1"],"target":"Defying public-health measures in the name of faith"},{"claim":"Pandemics signal nearness to the Second Coming","detail":"Luke 21:11 foretells pestilences as signs; HIV (35 million deaths since 1981), swine flu (2009), Ebola (2014), Zika (2015) and COVID-19 (2020) show signs being fulfilled. Cleanliness is next to godliness (Deut 23:10-11), and since the Lord comes like a thief (1 Thess 5:2), we must be ready any second.","refs":["Luke 21:11","1 Thess 5:2","Deut 23:10-11"],"target":"Complacency about Christ's return"},{"claim":"The living must repent of the sin virus","detail":"Amos 4:10 and Luke 13:1-5 show survivors of disasters must repent or perish, turning from pride, porn and prayerlessness. Just as Jesus broke quarantine barriers to touch and heal lepers (Luke 17:12; Lev 13:45), he welcomes all with the sin virus who come in repentance (John 6:37); persistent sin brings a living hell now and literal hell later (Rev 21:7-8).","refs":["Amos 4:10","Luke 13:1-5","Prov 6:16-17","Heb 11:25","Luke 17:12","Lev 13:45","John 6:37","Rev 21:7-8"],"target":"Unrepentant living after surviving disaster"}],"questions":[{"q":"Does the Bible teach that none of the believers will be attacked or affected by the virus?","answer":"No; plagues are not obliterated by the cross for believers in this age, as already-but-not-yet theology shows."},{"q":"Can Numbers 8:19 be applied to believers today?","answer":"The author poses it as part of the question whether believers are immune; his answer is that full immunity awaits the Second Coming."},{"q":"Will a believer who lives a holy life be spared from coronavirus infection, as Revelation 18:4 seems to suggest?","answer":"Not necessarily; holiness and separation may lead God to stop a plague, but believers are not guaranteed exemption before the Second Coming."},{"q":"Is the immortality teaching, originally from South Africa, that believers will not physically die, correct?","answer":"No; death will be fully defeated only at the Second Coming, and John 11:25-26 speaks of spiritual death."},{"q":"Why doesn't this group say 'Jesus died for our sins, so we must not sin anymore'?","answer":"Because their double-standard arguments reveal love of Balaam's wages and ear-tickling; the right teaching is power over sin, though only Jesus is sinless."},{"q":"When will Psalm 91:10 be a reality?","answer":"In an absolute sense only in the New Heaven and Earth after the Second Coming; now we enjoy first-fruits."},{"q":"What can be humanly done to stop a plague?","answer":"Sacrificial entry into God's presence, separation from the world, and proclaiming God's holy standards, knowing that stopping it is ultimately God's prerogative."},{"q":"What do you mean by 'first-fruits'?","answer":"Partial, present experiences of God's promises, like the author's healing from COVID-like symptoms within an hour, with the 'full-fruit' coming after the Second Coming."}],"criticisms":[{"of":"several hyper-supernatural servants of God","quote":"","critique":"They quoted Psalm 91 to teach believers would not be affected by, let alone die of, coronavirus, yet many believers and clergy died."},{"of":"accelerated, passionate, cultic immortality preaching originating in South Africa and echoed in Sri Lanka and India","quote":"if you believe in Jesus, you will not die","critique":"It ignores already-but-not-yet theology; physical death is defeated only at the Second Coming."},{"of":"a group working with missionary zeal on social media","quote":"we have victory over disease (so you can't have diseases), death (so you can't die now), and demons (and Satan poses no danger to you now)","critique":"Hellish false teaching built on double standards, motivated by Balaam's wages and ear-tickling."},{"of":"false teachers who say the plague-causing God is only an Old Testament God","quote":"","critique":"Revelation 18:8 and 22:18 show the plague-sending God in the New Testament."},{"of":"believers who think 'We are gods!'","quote":"We are gods!","critique":"This is the conceit Paul's thorn guarded against; we are human and dependent on God and others."}],"illustrations":[{"title":"118 clergy deaths","story":"A study documented 118 clergy deaths directly related to the coronavirus.","point":"Psalm 91 did not make believers, even pastors, immune."},{"title":"Rain as Baal's semen","story":"Baal theology taught that sex with temple prostitutes excited Baal, whose semen fell as rain for crops; Israel's Baal-Peor sin brought a plague killing 24,000.","point":"God-caused plagues followed gross idolatry."},{"title":"This world is not my home","story":"The Feast of Booths recalled Israel's wilderness journey; believers are pilgrims, exiles and sojourners (1 Pet 2:11), as a Jim Reeves song puts it.","point":"We are passing through to a city with no plagues (Rev 21:4)."},{"title":"Paul's slip before the high priest","story":"Paul called the high priest a 'whitewashed wall' (rendered in a contemporary paraphrase) and then apologised, quoting the law (Acts 23:1-5).","point":"Even great believers sin after conversion and must confess; already holy, not yet holy."},{"title":"Elijah's 14 and Elisha's 28 miracles","story":"Elijah's 14 and Elisha's 28 listed miracles are enumerated; yet Elisha died of sickness (2 Kgs 13:14).","point":"Mighty healing ministers still got sick and died."},{"title":"Healed through a radio","story":"The author's maternal aunt knew people healed by touching radios broadcasting Billy Graham's 1956 Palayamkottai message, yet Graham died at 99 with Parkinson's/hydrocephalus.","point":"A healing instrument can himself need healing."},{"title":"Nabeel Qureshi's prayer","story":"The apologist died of cancer at 34 in 2017 despite worldwide prayer and his plea to live for his daughter.","point":"Healing is occasional now; the sovereign God is in control."},{"title":"'Sunny' depends on context","story":"'Sunny' can mean weather, cricketer Sunil Gavaskar or a Nissan car model.","point":"Context determines meaning; 'death' in John 11:25-26 means spiritual death."},{"title":"The dying thief's request","story":"The thief asked Jesus to remember him 'when you come into your kingdom', and Jesus promised paradise without correcting him.","point":"The thief had a right 'already but not yet' theology of the kingdom."},{"title":"The day the author felt COVID-positive","story":"One morning the author felt he had the virus, prayed without telling his family, and within an hour felt fine.","point":"A first-fruit of Psalm 91:10 now; the full-fruit comes in the next life."},{"title":"David's costly sacrifice","story":"After David's census brought a plague killing 70,000, he insisted on paying for the threshing floor before sacrificing (2 Sam 24:24).","point":"Sacrificial entry into God's presence precedes plague's end."},{"title":"A monthly fasting-prayer Zoom","story":"The author's ministry holds a monthly online fasting and intercession night for nations, India, youth and personal needs.","point":"Believers have a biblical warrant to intercede during plagues."},{"title":"Phinehas' spear","story":"Phinehas speared a couple in a tent during Baal worship and the plague stopped (Num 25:6-8).","point":"Today we wield the sword of the Word, proclaiming God's holy standards."},{"title":"Jesus and the ten lepers","story":"Lepers had to cry 'Unclean!' and keep distance, but Jesus broke through those barriers and healed them.","point":"Jesus draws near to those with the sin virus who repent; he wants repentance, not riddance."}],"keyVerses":[{"ref":"Ps 91:10","text":"There shall no evil befall thee, neither shall any plague come nigh thy dwelling","use":"Misused by hyper-supernaturalists; fully true only after the Second Coming, with first-fruits now."},{"ref":"Job 1:12","text":"the Lord said to Satan, 'all that he has is in your power'","use":"Satan needs God's permission to cause disease."},{"ref":"Rev 18:4","text":"be ye not partakers of her sins, and that ye receive not of her plagues","use":"Separation from the world may lead God to stop a plague."},{"ref":"1 John 1:8","text":"If we claim to be without sin, we deceive ourselves","use":"Already holy, not yet sinless."},{"ref":"2 Tim 4:20","text":"Trophimus have I left at Miletum sick","use":"Even Paul's coworker remained sick."},{"ref":"2 Cor 12:9","text":"My grace is sufficient for thee","use":"Paul's thorn remained; believers can be sick for God's reasons."},{"ref":"Rom 8:23","text":"we wait eagerly for... the redemption of our bodies","use":"We are not yet fully healed; first-fruits now."},{"ref":"Heb 2:15","text":"free those who all their lives were held in slavery by their fear of death","use":"The first coming removes fear of death, not death itself."},{"ref":"1 Cor 15:26","text":"The last enemy to be destroyed is death","use":"Death is defeated at Christ's coming."},{"ref":"Luke 21:11","text":"great earthquakes... famines, and pestilences","use":"Pandemics as signs of nearness to the Second Coming."},{"ref":"Luke 13:3","text":"unless you repent, you will all likewise perish","use":"Those alive in a plague must repent."},{"ref":"John 6:37","text":"the one who comes to Me I will by no means cast out","use":"Jesus welcomes repentant sinners with the sin virus."}],"flow":["Psalm 91 teachers were refuted by believers' COVID deaths","C: God causes or permits all plagues","O: cross does not obliterate plagues now","Four D's explained by already-but-not-yet theology","R: prayer, separation, proclamation may stop plagues","O: obey quarantine and government orders","N: pandemics signal Christ's coming","A: the living must repent of the sin virus"]},{"num":23,"section":"Hyper-Supernaturalism","title":"The Miracles in the Book of Acts and the Miracles in Our Time","summary":"Written by the author's wife from her monthly reading of Acts and an online postgraduate course, this chapter draws lessons about miracles that contradict hyper-supernaturalist teaching. Acts shows miracles happening through demonic power (the fortune-telling slave girl) and the name of Jesus failing as a magic charm (the sons of Sceva), so miracles do not validate a ministry. It shows miracles not happening every time the apostles prayed: Acts is a frank record of persecution and suffering, a New Testament Habakkuk 3, and there was no intervention for Stephen, James or the 21 Coptic Christians beheaded in 2015. Acts 12 and Hebrews 11 both place deliverance and martyrdom side by side among people of equal faith. Finally, believers should interpret Jesus as the apostles did, and practices like forensic prophecy are alien to apostolic ministry.","thesis":"Acts teaches that miracles do not validate a ministry, do not happen on command, and come according to God's sovereign will alongside suffering, so we must interpret Jesus as the apostles did.","outline":{"acronym":"Lessons on miracles from Acts","items":[{"letter":"1","label":"Miracles happened even through demonic power","point":"The slave girl's accurate recognition came from a demon, and the sons of Sceva show Jesus' name is no magic incantation; miracles are not automatic proof of God.","refs":["Acts 16:16-18","Acts 19:11-20"]},{"letter":"2","label":"Miracles did not happen each time the apostles prayed","point":"Acts records arrests, stonings, executions and Paul's sufferings; there was no supernatural intervention for Stephen, James or modern martyrs.","refs":["Acts 4:1-8","Acts 7:60","Acts 12:1-2","Acts 14:19-22","2 Cor 11:22-27","2 Cor 12:7-10"]},{"letter":"3","label":"Acts 12 vs Hebrews 11","point":"Deliverance and martyrdom appear side by side for people of equal faith; miracles come according to God's sovereign will.","refs":["Acts 12:1-11","Heb 11:33-37","Heb 2:4"]},{"letter":"4","label":"So-called miracles today were not endorsed by Jesus and the apostles","point":"We must follow Jesus as the apostles did; forensic prophecy is alien to their ministry.","refs":["1 Cor 11:1","Heb 13:7","Acts 2:42","Acts 4:12"]}]},"claims":[{"claim":"Accurate supernatural knowledge can come from demons","detail":"The slave girl in Acts 16 correctly named Paul's team as servants of the Most High God proclaiming the way of salvation, but by a spirit of divination. Since that could confuse Yahweh with Zeus or Sabazius, Paul cast it out in Jesus' name. So accurate recognition or prediction cannot validate a ministry.","refs":["Acts 16:16-18"],"target":"Accurate revelation as proof of a true ministry"},{"claim":"Jesus' name is not a magic charm for miracles on demand","detail":"The seven sons of a high priest used Jesus' name but could not drive out a demon and were overpowered (Acts 19:11-20). As a commentator notes, the demons' refusal shows Jesus' name is not an incantation to be used at will, so even his name cannot produce healing on demand.","refs":["Acts 19:11-20"],"target":"Commanding miracles by formula"},{"claim":"God expects trust when we cannot trace his paths","detail":"Daniel's friends ('even if not'), Habakkuk 3 ('though the fig tree...'), Job 13:15 ('though he slay me') and David worshipping after his child's death (2 Sam 12:20) teach trusting God when prayers seem unanswered. Acts repeats this as a New Testament Habakkuk 3.","refs":["Dan 3:17-18","Hab 3:17-18","Job 13:15","2 Sam 12:20"],"target":"Faith that demands visible answers"},{"claim":"Acts is a frank record of persecution, not a problem-free life","detail":"Acts records Peter and John arrested and flogged, Stephen stoned, Christians scattered, James executed, Paul stoned, Paul and Silas beaten and imprisoned, and Paul's long trials; the epistles add lashes, shipwrecks, hunger and the unremoved thorn. Teachers who claim Acts promises a problem-free life must scissor out these passages; as Acts 14:22 says, entering the kingdom involves many hardships.","refs":["Acts 4:1-8","Acts 5:22-41","Acts 6:8-7:60","Acts 8:1-3","Acts 12:1-2","Acts 14:19-22","Acts 16:22-28","2 Cor 11:22-27","2 Cor 12:7-10"],"target":"A problem-free, suffering-free Christian life"},{"claim":"After the fizz of miracles comes suffering","detail":"After the fireworks and high of miracles a season of darkness can follow, like Coke going flat; all believers will suffer on this side of eternity, as the apostles taught (Acts 14:22).","refs":["Acts 14:22"],"target":"Perpetual spiritual highs"},{"claim":"No miracle rescued Stephen, James or the 21 Coptic martyrs","detail":"Though there is a supernatural event in almost every chapter of Acts, there are also clear cases of expected miracles not happening. Stephen and James were martyred; the 21 Coptic Christians beheaded by ISIS on a Libyan beach in 2015 had no intervention; and near the end of his ministry Paul 'couldn't even heal his own coworkers' (2 Tim 4:20).","refs":["Acts 7:60","Acts 12:2","2 Tim 4:6","2 Tim 4:16-20"],"target":"Miracles guaranteed in every crisis"},{"claim":"Miracles follow God's will, not our commands of faith","detail":"A couple childless for seven years conceived after prayer and now has two children, but at least two other couples prayed for are still waiting. Since gifts are distributed according to God's will (Heb 2:4), miracles too happen by God's will, not by our words of command or faith.","refs":["Heb 2:4"],"target":"Miracles by words of command or faith"},{"claim":"Acts 12 and Hebrews 11 pair deliverance with martyrdom","detail":"Acts 12 has James executed and Peter rescued; Hebrews 11 lists Sarah's miracle conception and escapes like Daniel's (vv. 33-34) beside saints tortured and sawn in two like Isaiah (vv. 35-37). Their faith was equal, and even Peter was later crucified upside down. Acts' 'prescription theology' calls us to endure suffering and expect miracles according to God's sovereign will.","refs":["Acts 12:1-11","Heb 11:11","Heb 11:33-37"],"target":"Faith always produces deliverance"},{"claim":"Interpret Jesus' words as the apostles did","detail":"Paul repeatedly urges imitation of himself as he follows Christ (1 Cor 11:1; 4:16; Phil 3:17; 4:9; 1 Thess 1:6) and Hebrews says to imitate our leaders' faith (Heb 13:7). Acts calls us to devote ourselves to the apostles' teaching (Acts 2:42). Just as the apostles upheld Jesus' uniqueness (John 14:6; Acts 4:12), we must interpret John 14:12 as they did; forensic prophecies of phone numbers and bank balances are alien to their ministry.","refs":["1 Cor 11:1","1 Cor 4:16","Phil 3:17","Phil 4:9","1 Thess 1:6","Heb 13:7","Acts 2:42","John 14:6","Acts 4:12","John 14:12"],"target":"Novel readings of Jesus that the apostles never held"}],"questions":[{"q":"Can accurate prophecy or recognition validate a ministry?","answer":"No; the slave girl in Acts 16 was accurate through a demon, so accuracy is no proof of God's work."},{"q":"Can the name of Jesus be used as a magic charm to bring miracles on demand?","answer":"No; the sons of Sceva show the name of Jesus is not an incantation to be used at will."},{"q":"Does the book of Acts teach a problem-free life for the believer?","answer":"No; Acts is a frank record of persecution, problems and pain, a New Testament Habakkuk 3."},{"q":"Why did one childless couple conceive after prayer while others still wait?","answer":"Because miracles happen according to God's will, not by our words of command or faith (Heb 2:4)."}],"criticisms":[{"of":"hyper-supernaturalist false teachers popular on social media","quote":"","critique":"Their teaching about miracles contradicts the lessons of Acts."},{"of":"false teachers who teach that Acts presents a totally problem-free life","quote":"","critique":"They must scissor out several passages from Acts and the epistles to sustain their claim."},{"of":"young people who twist John 14:12","quote":"","critique":"They use the verse to accommodate forensic prophecies such as phone-number and bank-balance predictions, practices alien to the apostles."}],"illustrations":[{"title":"Reading Acts monthly","story":"The chapter's writer reads one chapter of Acts daily, finishing its 28 chapters each month, and studied it in an online postgraduate course.","point":"Close study of Acts contradicts popular hyper-supernaturalist teaching about miracles."},{"title":"The fortune-telling slave girl","story":"A demonised girl accurately announced Paul's team as servants of the Most High God until Paul cast the spirit out.","point":"Accurate supernatural knowledge can come from demonic sources."},{"title":"The sons of Sceva","story":"Seven sons of a high priest tried to use Jesus' name and were overpowered by the demon.","point":"Jesus' name is no magic incantation."},{"title":"Coke going flat","story":"After the fizz of miracles, the Coke can taste flat for some time.","point":"Seasons of darkness follow spiritual highs; suffering is part of this life."},{"title":"21 Coptic Christians beheaded","story":"ISIS beheaded 21 blindfolded Coptic Christians on a Libyan beach in 2015 with no supernatural intervention.","point":"As with Stephen and James, expected miracles do not always happen."},{"title":"One couple conceived, two still wait","story":"A couple childless for seven years now has two children after prayer, but at least two other couples prayed for are still waiting.","point":"Pain and power experiences go together; miracles come by God's will."},{"title":"Daniel and Isaiah","story":"Hebrews 11 alludes to Daniel escaping the lions and Isaiah being sawn in two.","point":"Equal faith can meet different outcomes."}],"keyVerses":[{"ref":"Acts 16:16","text":"a slave girl who had a spirit of divination","use":"Supernatural accuracy can be demonic."},{"ref":"Acts 19:15","text":"Jesus I know, and Paul I know, but who are you?","use":"Jesus' name is not a magic charm."},{"ref":"Hab 3:17-18","text":"Even if the fig tree does not blossom... yet I will rejoice in the Lord","use":"Acts is the New Testament Habakkuk 3: trust when we cannot trace."},{"ref":"Acts 14:22","text":"Anyone signing up for the kingdom of God has to go through plenty of hard times","use":"Suffering is part of the believer's life."},{"ref":"Heb 2:4","text":"gifts of the Holy Spirit distributed according to his will","use":"Miracles happen according to God's will, not our commands."},{"ref":"Heb 11:35-37","text":"others were tortured... sawn in two","use":"Faithful people suffer alongside those miraculously delivered."},{"ref":"Acts 2:42","text":"they devoted themselves to the apostles' teaching","use":"Interpret Jesus as the apostles did."},{"ref":"Heb 13:7","text":"Consider the outcome of their way of life and imitate their faith","use":"Follow Christ as the apostles followed him."}],"flow":["Monthly study of Acts challenges hyper-supernaturalism","Demonic power can produce accurate miracles","Jesus' name is not a magic charm","Acts is a frank record of suffering","Deliverance and martyrdom sit side by side","Miracles follow God's sovereign will","Interpret Jesus as the apostles did"]},{"num":24,"section":"Hyper-Supernaturalism","title":"Are We Making What the Bible Calls “The Last Enemy” a Friend If We Expect to Die (Should Jesus' Coming Tarry)?","summary":"Against 'Immortality on Earth' preachers who use 1 Cor 15:26 to say believers need never die and that expecting death befriends the 'last enemy', the author walks through all of 1 Corinthians 15. He shows Paul assumes believers die at least five times (vv. 18, 20, 22, 32, 36) before speaking of immortality, and that resurrection and immortal bodies come only at Christ's coming (v. 23; 1 Thess 4:16-17). Death is finally defeated in heaven and hell, where no one dies, and on this earth death will continue until Christ returns. He addresses baptism for the dead (no salvation after death), the 'beasts at Ephesus' as false teachers, how belief shapes behaviour, the trumpet as the Second Coming (not a new generation's preaching), and 1 Cor 15:56 on sin, law and death's sting. He closes with the call to be steadfast and to fight beast-like false teachers.","thesis":"Read as a whole, 1 Corinthians 15 assumes believers will die if Jesus' coming tarries and places immortality at the Second Coming, so expecting death does not befriend the last enemy.","outline":{"acronym":"Five times Paul assumes believers die in 1 Corinthians 15","items":[{"letter":"1","label":"Those fallen asleep in Christ","point":"Verse 18 speaks of dead believers; death was common in the early church.","refs":["1 Cor 15:18"]},{"letter":"2","label":"Christ the firstfruits","point":"Verse 20: Christ is the first fruits of those who have fallen asleep; dead believers will be the later fruits.","refs":["1 Cor 15:20"]},{"letter":"3","label":"In Adam all die","point":"Verses 21-22: all believers die (should Jesus tarry) and will rise in Christ.","refs":["1 Cor 15:21-22"]},{"letter":"4","label":"Fighting beasts at Ephesus","point":"Verses 30-32: Paul faced death daily because he knew he would rise.","refs":["1 Cor 15:30-32"]},{"letter":"5","label":"What you sow does not come to life unless it dies","point":"Verse 36: the sowing image assumes believers die before the resurrection body is given.","refs":["1 Cor 15:36","1 Cor 15:42-43"]}]},"claims":[{"claim":"1 Cor 15:26 must be read in the context of the whole chapter","detail":"Immortality-on-earth preachers use 'the last enemy to be destroyed is death' to say believers need never die and that expecting death befriends an enemy. Reading the whole chapter shows Paul never meant that there would be no death for believers if the Lord tarries.","refs":["1 Cor 15:26"],"target":"Expecting death befriends the last enemy"},{"claim":"Paul was upset because some denied the resurrection","detail":"Verses 1-11 lay out the gospel, including Christ's resurrection (v. 4), his appearances (vv. 5-8) and Paul's grace-enabled labour (vv. 9-11). In verses 12-14 Paul is upset that some claim there is no resurrection of the dead.","refs":["1 Cor 15:1-14"],"target":"Denial of the bodily resurrection"},{"claim":"No identification with Jesus' resurrection, no victory over sin","detail":"Verse 17 says that without resurrection we are still in our sins. As Rom 6:3-4 teaches, a believe
