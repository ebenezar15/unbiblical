d every word."},{"q":"What version of the Bible should I read?","answer":"ESV for literal, VOICE for contemporary, NLT for balance; NASB is also accurate."},{"q":"Was a famous evangelist wrong to cut passages out of Bibles for sermons, given Rev 22:19?","answer":"No; John's warning is against stubbornly leaving out portions of Scripture over a lifetime of reading."}],"criticisms":[{"of":"Hyper-Grace, Hyper-Supernaturalism and Hyper-Love teaching","quote":"","critique":"Love for God's Word leads the author to abhor these false teachings (Ps 119:163)."},{"of":"A popular single-translator contemporary paraphrase","quote":"","critique":"Being done by one person, it is less safe than team translations like VOICE."}],"illustrations":[{"title":"Tooth-decay vs truth-decay","story":"Forgetting to brush your teeth may cause tooth-decay; forgetting to study the Bible causes truth-decay.","point":"Daily Bible reading is necessary."},{"title":"No Bible, no breakfast","story":"Job valued God's words more than daily bread.","point":"Never miss daily meditation even if you miss a meal."},{"title":"The six-layered sandwich","story":"Reading a chapter from each Bible section daily is as enjoyable as biting into a butter-jam-mayonnaise-cheese-meat sandwich.","point":"Variety makes whole-Bible reading delightful and sustainable."},{"title":"The evangelist's scissors","story":"A famous evangelist's autobiography tells how he sometimes cut passages from a Bible and pasted them into his sermon file.","point":"Rev 22:19 is not about tearing pages but about not habitually leaving out parts of Scripture."},{"title":"Above my iPhone","story":"The author applies Ps 119:127 as 'I love your commandments above my phone, even my iPhone.'","point":"The Word must be valued above our most prized possessions."},{"title":"Witnessing on flights","story":"The author often reads Ps 119:165 with fellow passengers on flights using a Bible app.","point":"Love for the Word overflows into witness."}],"keyVerses":[{"ref":"Josh 1:8","text":"meditate on it day and night... then you will be prosperous and successful","use":"True success comes from meditation on the Word."},{"ref":"Deut 17:19","text":"he shall read in it all the days of his life","use":"Leaders must read daily."},{"ref":"Job 23:12","text":"I have treasured the words of his mouth more than my daily bread","use":"No Bible, no breakfast."},{"ref":"2 Tim 3:16","text":"All Scripture is God-breathed","use":"Read all of it."},{"ref":"Matt 5:18","text":"not an iota, not a dot, will pass from the Law","use":"Read every letter."},{"ref":"Ps 119:163","text":"I hate and abhor falsehood, but I love your law","use":"Love for the Word produces hatred of false teaching."},{"ref":"Ps 119:165","text":"Great peace have those who love your law","use":"Closing promise and witnessing verse."}],"flow":["True success: meditate on the Word (Josh 1:8)","Q1: read daily (kings, psalmist, Bereans, Job)","Q2: read all of it (Paul, Joshua, Jesus, John)","Six-layered sandwich daily reading plan","Q3: choose ESV, VOICE, NLT, NASB","Love the Word, abhor false teaching (Ps 119)"]}]};
window.EXTRA = {"influences":[{"key":"reformation","short":"Reformation","name":"Protestant Reformation & Sola Scriptura","v":"--s-ref","what":"Scripture alone as the final authority; no adding or subtracting; justification by grace through faith; rejection of indulgences, purgatory and the Apocrypha.","how":"The book opens with the 1517 theses that began the Reformation and the reformer's stand that his conscience was captive to the Word of God, calls for a new reformation, and closes with Bible-study disciplines and a 66-book canon.","cites":"Martin Luther, Wycliffe and Tyndale; the Berean example (Acts 17:11); Protestant canon arguments"},{"key":"arminian","short":"Arminian–Wesleyan","name":"Arminian–Wesleyan theology","v":"--s-grace","what":"Grace enables but does not override free will; a believer can fall away; perseverance is conditional on continuing in faith and holiness.","how":"The author sides openly with the Arminian and Wesleyan position: future sins are not forgiven in advance, Hebrews' warnings are real, and a saved person can be lost in hell.","cites":"Arminius and John Wesley; Arminian scholars on apostasy and the Hebrews warning passages"},{"key":"holiness","short":"Holiness","name":"Holiness tradition & progressive sanctification","v":"--s-anti","what":"Salvation must show itself in a holy life; sanctification is a daily, Spirit-enabled process involving real effort and choices.","how":"'Holiness' is one of the book's most repeated words: 30 commands of personal exertion, 'not just obtain but maintain', and progressive versus positional sanctification.","cites":"Evangelical Anglican and Wesleyan holiness writers; devotional writing on 'abiding'"},{"key":"pentecostal","short":"Pentecostal","name":"Classical Pentecostal & charismatic","v":"--s-super","what":"Continuationist: the Spirit still heals and works miracles today, while God remains sovereign; doctrinal statements such as the 16 Fundamental Truths.","how":"Quotes the Assemblies of God statement on sanctification, ministers at Pentecostal youth conferences, prays for healing, and includes 7 steps to receive a miracle, yet rejects 'always heals' teaching.","cites":"Assemblies of God doctrinal statement; a charismatic systematic theologian; Pentecostal New Testament scholars"},{"key":"evangelical","short":"Western evangelical","name":"Western evangelical scholarship & revivalism","v":"--s-grace","what":"British and American evangelicalism: conversion preaching, biblical inerrancy, systematic theology and expository study.","how":"Leans heavily on Western evangelical writers and preachers for quotations, definitions and study methods, and recommends Western systematic theologies.","cites":"Billy Graham, J. C. Ryle, David Pawson, Howard Marshall, Philip Yancey, David Ravenhill, Fee & Stuart, Wayne Grudem, Millard Erickson, Norman Geisler"},{"key":"anticalvin","short":"Anti-Calvinist","name":"Departure from Calvinism","v":"--s-love","what":"Rejects 'once saved, always saved' (perseverance of the saints) and limited atonement, while respecting 'classical' Calvinists who hold that true believers persevere in holiness.","how":"Chapter 20 sets out the Reformed definition of eternal security and argues against it; chapter 14 rejects the 'only rewards lost' reading of 1 Cor 3:15.","cites":"A Reformed theologian's definition of eternal security; Augustine and Calvin (as the view opposed)"},{"key":"traditionalist","short":"Traditional hell","name":"Traditional doctrine of hell","v":"--s-love","what":"Hell is eternal, conscious and final punishment; no second chance after death (the Augustinian view held by most Reformation and evangelical churches).","how":"Argues against annihilationism, hell-to-heaven teaching and The Shack; uses Heb 9:27, Luke 16 and the 'second death' to show judgment is final.","cites":"Jonathan Edwards on the justice of endless punishment; C. S. Lewis on hell as chosen; evangelical rebuttals of annihilationism"},{"key":"penal","short":"Penal substitution","name":"Penal substitutionary atonement","v":"--s-love","what":"Christ took the punishment our sins deserved, bearing God's wrath as our substitute; the 'majority evangelical view'.","how":"Chapter 40 defends penal substitution as the main reason for the cross, and the blood of Jesus is framed as cleansing that requires ongoing repentance.","cites":"The majority evangelical and Reformed view of the cross"},{"key":"discernment","short":"Discernment","name":"Counter-cult & discernment apologetics","v":"--s-misc","what":"Contending for the faith (Jude 3) by naming false teachers and teachings, testing claims and warning believers.","how":"Labels hyper-grace, immortality-now and miracle-money as 'cults' and 'hell-populating' teaching; profiles wolves; answers vaccine/mark-of-the-beast and Apocrypha claims.","cites":"Jude 3, 2 Pet 2 and 1 Tim 1:3; apologetics handbooks"},{"key":"providence","short":"God's sovereignty","name":"Sovereignty of God in suffering","v":"--s-super","what":"A theology of suffering shared by Reformed and evangelical writers: God may heal or not; sickness, plague and death can serve his purposes.","how":"Built through 'perhaps theology', the C-O-R-O-N-A and C-A-N-C-E-R outlines, Job and Paul's thorn, and the Acts pattern of some delivered and some not.","cites":"Billy Graham's illness; testimonies of believers who died; missionary martyr stories"},{"key":"futurist","short":"Futurist","name":"Futurist, 'already but not yet' eschatology","v":"--s-ref","what":"The kingdom is inaugurated but not complete; death remains until Christ returns; end-time prophecy is still largely future. The author stays open on rapture timing and the length of the millennium.","how":"Grounds the case against 'immortality now' in the future resurrection, reads Zephaniah 3 and 2 Peter 3 as future, and discusses feasts, vaccines and the mark of the beast as end-time questions.","cites":"The 'four Ds' already/not-yet scheme; standard futurist readings of Revelation"},{"key":"indian","short":"Indian context","name":"Indian evangelical–Pentecostal context","v":"--s-intro","what":"Written for South Indian churches, answering preachers in Chennai, Hyderabad, Bengaluru and Singapore megachurch influence.","how":"Cricket, Tamil and Telugu films, local news events and conference stories carry the argument; many critiques target specific regional teachers.","cites":"Local conferences, regional news reports, cricket and cinema"}],"chapterInfluences":{"0":["reformation","discernment","evangelical"],"1":["reformation","discernment"],"2":["holiness","arminian","pentecostal","discernment"],"3":["arminian","holiness","traditionalist"],"4":["arminian","holiness","evangelical"],"5":["holiness","arminian","evangelical"],"6":["arminian","traditionalist","holiness"],"7":["traditionalist","holiness","indian"],"8":["holiness","pentecostal","evangelical","indian"],"9":["holiness","arminian"],"10":["holiness","indian"],"11":["arminian","holiness","evangelical"],"12":["holiness","indian"],"13":["holiness","arminian","evangelical"],"14":["arminian","anticalvin","evangelical"],"15":["holiness","discernment"],"16":["holiness","discernment","evangelical"],"17":["holiness","pentecostal"],"18":["arminian","holiness","evangelical"],"19":["holiness","penal","arminian"],"20":["arminian","anticalvin","evangelical","pentecostal"],"21":["discernment","pentecostal","reformation","indian"],"22":["providence","futurist","pentecostal"],"23":["providence","pentecostal","evangelical"],"24":["futurist","providence","evangelical"],"25":["discernment","providence","indian"],"26":["futurist","discernment","traditionalist"],"27":["futurist","discernment","reformation"],"28":["futurist","evangelical","providence"],"29":["futurist","reformation","discernment"],"30":["futurist","traditionalist","penal"],"31":["traditionalist","futurist"],"32":["reformation","evangelical","discernment"],"33":["discernment","futurist","providence","indian"],"34":["providence","pentecostal","discernment"],"35":["pentecostal","providence"],"36":["providence","pentecostal","evangelical"],"37":["traditionalist","evangelical","discernment"],"38":["traditionalist","reformation","discernment","indian"],"39":["traditionalist","penal","discernment"],"40":["penal","evangelical","reformation"],"41":["discernment","reformation"],"42":["futurist","reformation","discernment"],"43":["futurist","discernment"],"44":["reformation","evangelical"],"45":["reformation","evangelical"],"46":["reformation","evangelical"],"47":["reformation","evangelical"]},"balance":[{"name":"Hyper-Grace","left":"Grace","right":"Holiness","v":"--s-grace","text":"Preaches grace and identity while dropping repentance, confession and daily holy living."},{"name":"Hyper-Love","left":"Love","right":"Wrath","v":"--s-love","text":"Preaches God's love while softening or removing his wrath and eternal hell."},{"name":"Hyper-Supernatural","left":"Miracles","right":"Suffering","v":"--s-super","text":"Insists God always heals and that believers need never die, ignoring texts on suffering, sickness and death."},{"name":"Hyper-Israel","left":"Israel","right":"Church","v":"--s-misc","text":"Celebrates feasts and backs modern political Israel, neglecting the epistles and the local church."}],"timeline":[{"when":"Eden","what":"Death enters (Gen 3; Rom 5:12)","v":"--s-love"},{"when":"Cross","what":"Death defeated in principle (Heb 2:14)","v":"--s-grace"},{"when":"Now","what":"Appointed once to die (Heb 9:27)","v":"--s-super"},{"when":"Return","what":"The dead raised, mortal puts on immortality","v":"--s-ref"},{"when":"New Earth","what":"No more death (Rev 21:4)","v":"--s-anti"}],"timelineTitle":"Death and immortality in the book's reading of Scripture","timelineSub":"The author's position across the immortality chapters: believers still die until Christ returns, and immortality is put on at the resurrection.","positions":[{"topic":"Scripture","rejects":"New teachings and extra-biblical claims; picking favourite verses","affirms":"Be 'hyper-biblical': add nothing, subtract nothing, test every teaching daily like the Bereans","ch":[0,1,45,46,47]},{"topic":"Future sins","rejects":"A believer's past, present and future sins are forgiven automatically","affirms":"Forgiveness is provided at the cross but possessed through ongoing repentance and confession (1 John 1:9)","ch":[2,3,4]},{"topic":"Repentance","rejects":"Repentance is only a change of mind; stop preaching it","affirms":"Repentance is turning from sin with deeds that fit it (Acts 26:20)","ch":[2,8,9,10]},{"topic":"Holiness","rejects":"Effort toward holiness is legalism; moral transformation does not matter","affirms":"Progressive sanctification: Spirit-enabled effort and daily holy choices (Heb 12:14)","ch":[5,17,18]},{"topic":"How God sees us","rejects":"The Father only sees Jesus and is permanently pleased whatever we do","affirms":"God is both compassionate Father and consuming fire; he disciplines and calls churches to repent","ch":[2,11,13,15]},{"topic":"Grace","rejects":"Grace as a licence to keep sinning","affirms":"Grace saves and trains us to say no to ungodliness; we respond to it with gratitude and obedience","ch":[6,7,12,16,19]},{"topic":"Security","rejects":"Once saved, always saved; only rewards are lost","affirms":"A saved person can be lost through wilful, unrepentant sin and apostasy","ch":[14,20]},{"topic":"Greater works","rejects":"'Greater works' means bigger miracles or miracle money","affirms":"Greater works refers to the wider reach of gospel work after Pentecost","ch":[21]},{"topic":"Pestilence and miracles","rejects":"Believers are always exempt from plague; God always does the miracle","affirms":"God is sovereign; in Acts and today, some are delivered and some are not","ch":[22,23,25]},{"topic":"Death","rejects":"'Immortality now': believers need never die; death can be befriended or defeated by faith today","affirms":"Death remains the last enemy; believers die until Christ returns, then put on immortality","ch":[24,26,27,28,29,30,31,32,33]},{"topic":"Healing","rejects":"It is always God's will to heal; we command disease and command God","affirms":"We ask in faith and submit to God's will; sickness can remain in faithful believers","ch":[34,35,36]},{"topic":"Hell","rejects":"Annihilation, escape from hell into heaven, and Shack-style theology","affirms":"Hell is eternal, conscious and final; there is no second chance after death","ch":[37,38,39]},{"topic":"The cross","rejects":"Denying that Jesus died to take away our sin as a substitute","affirms":"Jesus bore our sin and God's judgment on the cross","ch":[40]},{"topic":"False teachers","rejects":"Treating wolves as harmless","affirms":"Recognise false teachers by their fruit, doctrine and motives","ch":[41]},{"topic":"Israel and feasts","rejects":"Gentile believers keeping Jewish feasts and dating Christ's return by them","affirms":"Feasts were shadows fulfilled in Christ; no one knows the day","ch":[42]},{"topic":"Mark of the beast","rejects":"Taking a vaccine is taking the beast's mark","affirms":"The mark involves worship and allegiance, not medicine","ch":[43]},{"topic":"Apocrypha","rejects":"Equating the Apocrypha with Scripture","affirms":"Only the 66 books are the inspired Word of God","ch":[44]}]};

function mindMap(){
  var W = 1000, C = 500, narrow = (app.clientWidth || window.innerWidth) < 560;
  var secs = SECTIONS.filter(function(s){ return CH.some(function(c){ return c.section === s.key; }); });
  var n = CH.length, gap = 1.3, slots = n + gap * secs.length, pos = 0, angOf = {}, secAng = {};
  secs.forEach(function(s){ var a0 = pos; CH.filter(function(c){ return c.section === s.key; }).forEach(function(c){ angOf[c.id] = (pos + .5) / slots * Math.PI * 2 - Math.PI / 2; pos++; }); secAng[s.key] = ((a0 + pos) / 2) / slots * Math.PI * 2 - Math.PI / 2; pos += gap; });
  var keys = secs.map(function(s){ return s.key; }), minSep = 0.52;
  for (var it = 0; it < 80; it++) for (var i = 0; i < keys.length; i++) { var a = keys[i], b = keys[(i + 1) % keys.length], d = secAng[b] - secAng[a]; while (d < 0) d += Math.PI * 2; if (keys.length > 1 && d < minSep) { var p = (minSep - d) / 2; secAng[a] -= p; secAng[b] += p; } }
  function P(a, r){ return [C + Math.cos(a) * r, C + Math.sin(a) * r]; }
  var nodeR = narrow ? 23 : 18, fs = narrow ? 26 : 15, hubR = narrow ? 56 : 46, hubFs = narrow ? 21 : 17;
  var edges = "", nodes = "", hubs = "";
  secs.forEach(function(s, i){ var h = P(secAng[s.key], 215);
    edges += '<path class="map-edge draw" style="stroke:var(' + s.v + ');stroke-opacity:.6;stroke-width:3;-webkit-animation-delay:' + i * 90 + 'ms;animation-delay:' + i * 90 + 'ms" d="M' + C + " " + C + " L" + h[0].toFixed(1) + " " + h[1].toFixed(1) + '"/>';
    CH.filter(function(c){ return c.section === s.key; }).forEach(function(c, j){ var q = P(angOf[c.id], 410), m = P((angOf[c.id] + secAng[s.key]) / 2, 330);
      edges += '<path class="map-edge draw" style="stroke:var(' + s.v + ');stroke-opacity:.4;-webkit-animation-delay:' + (450 + j * 25) + 'ms;animation-delay:' + (450 + j * 25) + 'ms" d="M' + h[0].toFixed(1) + " " + h[1].toFixed(1) + " Q" + m[0].toFixed(1) + " " + m[1].toFixed(1) + " " + q[0].toFixed(1) + " " + q[1].toFixed(1) + '"/>';
      nodes += '<g class="map-node" tabindex="0" role="link" aria-label="' + esc(chName(c) + ": " + c.title) + '" data-go="' + c.id + '" data-tip="' + esc(chName(c) + " · " + c.title) + '"><circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + nodeR + '" fill="var(--surface)" stroke="var(' + s.v + ')" stroke-width="3.5"/><text x="' + q[0].toFixed(1) + '" y="' + (q[1] + fs * .36).toFixed(1) + '" text-anchor="middle" font-size="' + fs + '" fill="var(--fg)">' + (c.num === 0 ? "i" : c.num) + "</text></g>"; });
    hubs += '<g class="map-node" tabindex="0" role="link" aria-label="' + esc(s.label) + '" data-go="sec-' + SECTIONS.indexOf(s) + '" data-tip="' + esc(s.label) + '"><circle cx="' + h[0].toFixed(1) + '" cy="' + h[1].toFixed(1) + '" r="' + hubR + '" fill="var(' + s.v + ')"/><text x="' + h[0].toFixed(1) + '" y="' + (h[1] + hubFs * .36).toFixed(1) + '" text-anchor="middle" font-size="' + hubFs + '" fill="var(--surface)">' + s.short + "</text></g>"; });
  var center = ANS ? ["Hyper Biblical", "Answered"] : ["Hyper", "Biblical"];
  return '<div class="mapbox"><svg viewBox="45 45 910 910" role="img" aria-label="Visual map of the sections and chapters">' + edges +
    '<circle cx="' + C + '" cy="' + C + '" r="104" fill="none" stroke="var(--accent)" stroke-opacity=".3" stroke-width="2"/><circle cx="' + C + '" cy="' + C + '" r="92" fill="var(--accent)"/>' +
    '<text x="' + C + '" y="' + (C - 4) + '" text-anchor="middle" font-size="25" font-weight="900" fill="var(--accent-fg)">' + center[0] + '</text><text x="' + C + '" y="' + (C + 25) + '" text-anchor="middle" font-size="25" font-weight="900" fill="var(--accent-fg)">' + center[1] + "</text>" +
    hubs + nodes + '</svg><div class="maptip" id="maptip">Tap a numbered node to open that chapter</div></div>';
}

  function hl(s, w){ var h = esc(s); w.forEach(function(x){ if (x.length > 1) h = h.replace(new RegExp("(" + esc(x).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>"); }); return h; }
  function run(){ var v = inp.value.trim().toLowerCase(); if (v.length < 2) { list.innerHTML = '<p class="muted">Type at least two letters.</p>'; return; } var w = v.split(/\s+/);
    var hits = docs.filter(function(d){ var t = (d.t + " " + d.b).toLowerCase(); return w.every(function(x){ return t.indexOf(x) >= 0; }); }).slice(0, 80);
    list.innerHTML = hits.length ? '<p class="muted">' + hits.length + (hits.length === 80 ? "+" : "") + " matches</p>" + hits.map(function(d){ var i = Math.max(0, d.b.toLowerCase().indexOf(w[0])), st = Math.max(0, i - 90), en = Math.min(d.b.length, i + 200);
      return '<a class="hit" href="#' + d.c.id + '"><small>' + chName(d.c) + " · " + esc(d.c.title) + "</small><b>" + hl(d.t, w) + '</b><div class="muted" style="font-size:.92rem">' + (st > 0 ? "… " : "") + hl(d.b.slice(st, en), w) + (en < d.b.length ? " …" : "") + "</div></a>"; }).join("") : '<p class="muted">Nothing matches “' + esc(inp.value) + "”. Try a single word such as grace, heal or hell.</p>"; }
  inp.addEventListener("input", run); $("#sugg", root).addEventListener("click", function(e){ var b = e.target.closest("[data-q]"); if (b) { inp.value = b.getAttribute("data-q"); run(); } }); try { inp.focus({preventScroll:true}); } catch(e){} }
$("#searchBtn").addEventListener("click", function(){ closeMenus(); go("search"); });

/* ---------- router ---------- */
function filterWire(inputId, itemSel, noneId){ return function(r){ var i = $("#" + inputId, r), none = $("#" + noneId, r); i.addEventListener("input", function(){ var v = i.value.toLowerCase(), shown = 0; $$(itemSel, r).forEach(function(a){ var ok = !v || a.textContent.toLowerCase().indexOf(v) >= 0; a.hidden = !ok; if (ok) shown++; }); if (none) none.hidden = shown > 0; }); }; }
var lastW = window.innerWidth;
function route(){
  var h = (location.hash || "#home").slice(1) || "home", html, wire;
  $$("#nav a").forEach(function(a){ var k = a.getAttribute("data-k"); a.classList.toggle("on", k === h || (!!byId[h] && k === "chapters")); });
  if (byId[h]) { html = vChapter(byId[h]); wire = wireChapter; }
  else if (h === "chapters") { html = vChapters(); wire = filterWire("cq", ".ccard", "cnone"); }
  else if (h === "diagrams") { html = vDiagrams(); wire = wireDiagrams; }
  else if (h === "influences") { html = vInfluences(); wire = wireInfluences; }
  else if (h === "positions" && !ANS) { html = vPositions(); }
  else if (h === "compare" && ANS) { html = vCompare(); }
  else if (h === "lenses" && ANS) { html = vLenses(); wire = wireLenses; }
  else if (h === "questions") { html = vQuestions(); wire = filterWire("qq", ".q", "qnone"); }
  else if (h === "scripture") { html = vScripture(); wire = wireScripture; }
  else if (h === "search") { html = vSearch(); wire = wireSearch; }
  else if (h === "responses" && !ANS) { html = vResponses(); wire = wireResponses; }
  else { h = "home"; html = vHome(); wire = wireMap; }
  app.innerHTML = '<div class="view">' + html + "</div>";
  app.setAttribute("data-view", h);
  if (wire) wire(app);
  paintResponses(app);
  if (pendingScroll) { var id = pendingScroll; pendingScroll = null; setTimeout(function(){ var el = document.getElementById(id); if (el && el.tagName === "DETAILS") el.open = true; scrollToEl(el); if (el && id.indexOf("k-") === 0) { el.classList.add("flash"); setTimeout(function(){ el.classList.remove("flash"); }, 1600); } }, 80); }
  else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
window.addEventListener("resize", function(){ var w = window.innerWidth; if (app.getAttribute("data-view") === "home" && (w < 560) !== (lastW < 560)) { var y = window.pageYOffset; route(); window.scrollTo(0, y); } lastW = w; });
route();
initResponses();
})();

</script>
