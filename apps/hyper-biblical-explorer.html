<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyper Biblical Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap">
<style>
/* Layout: sticky top bar (menu button on phones) + single routed view. Chapter pages are one plain scroll:
   section-colour band, a wrapping jump row, flowchart, outline cards and argument cards. No inner scroll areas. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E7EBF2; --tint:#E3E9FB; --fg:#151D2B; --muted:#5A6577; --line:#D3DAE5;
  --accent:#2D55E0; --accent-fg:#FFFFFF; --accent2:#C98A0B; --glow:rgba(45,85,224,.14);
  --font:"Avenir Next","Avenir","Nunito Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 24px rgba(16,24,40,.07);
  --s-intro:#64748B; --s-ref:#8B5CF6; --s-grace:#2563EB; --s-super:#D97706; --s-love:#DC2626; --s-misc:#0D9488; --s-anti:#16A34A;
  --l-relational:#E11D48; --l-faith:#D97706; --l-immortality:#7C3AED; --l-sonship:#2563EB; --l-postmil:#16A34A; --l-preterist:#0891B2;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C111A; --surface:#141B27; --surface2:#1C2533; --tint:#1B2640; --fg:#E7ECF4; --muted:#9AA6B9; --line:#283346;
  --accent:#7C9BFF; --accent-fg:#0C111A; --accent2:#F2BE4A; --glow:rgba(124,155,255,.16); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  --s-intro:#94A3B8; --s-ref:#A78BFA; --s-grace:#60A5FA; --s-super:#FBBF24; --s-love:#F87171; --s-misc:#2DD4BF; --s-anti:#4ADE80;
  --l-relational:#FB7185; --l-faith:#FBBF24; --l-immortality:#A78BFA; --l-sonship:#60A5FA; --l-postmil:#4ADE80; --l-preterist:#22D3EE;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C111A; --surface:#141B27; --surface2:#1C2533; --tint:#1B2640; --fg:#E7ECF4; --muted:#9AA6B9; --line:#283346;
  --accent:#7C9BFF; --accent-fg:#0C111A; --accent2:#F2BE4A; --glow:rgba(124,155,255,.16); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  --s-intro:#94A3B8; --s-ref:#A78BFA; --s-grace:#60A5FA; --s-super:#FBBF24; --s-love:#F87171; --s-misc:#2DD4BF; --s-anti:#4ADE80;
  --l-relational:#FB7185; --l-faith:#FBBF24; --l-immortality:#A78BFA; --l-sonship:#60A5FA; --l-postmil:#4ADE80; --l-preterist:#22D3EE;
  color-scheme:dark }
/* user-picked colour schemes (beat the host theme) */
:root:root[data-scheme="daylight"]{ --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E7EBF2; --tint:#E3E9FB; --fg:#151D2B; --muted:#5A6577; --line:#D3DAE5; --accent:#2D55E0; --accent-fg:#fff; --accent2:#C98A0B; --glow:rgba(45,85,224,.14); --s-intro:#64748B; --s-ref:#8B5CF6; --s-grace:#2563EB; --s-super:#D97706; --s-love:#DC2626; --s-misc:#0D9488; --s-anti:#16A34A; --l-relational:#E11D48; --l-faith:#D97706; --l-immortality:#7C3AED; --l-sonship:#2563EB; --l-postmil:#16A34A; --l-preterist:#0891B2; color-scheme:light }
:root:root[data-scheme="night"]{ --bg:#0C111A; --surface:#141B27; --surface2:#1C2533; --tint:#1B2640; --fg:#E7ECF4; --muted:#9AA6B9; --line:#283346; --accent:#7C9BFF; --accent-fg:#0C111A; --accent2:#F2BE4A; --glow:rgba(124,155,255,.16); --shadow:0 8px 28px rgba(0,0,0,.4); --s-intro:#94A3B8; --s-ref:#A78BFA; --s-grace:#60A5FA; --s-super:#FBBF24; --s-love:#F87171; --s-misc:#2DD4BF; --s-anti:#4ADE80; --l-relational:#FB7185; --l-faith:#FBBF24; --l-immortality:#A78BFA; --l-sonship:#60A5FA; --l-postmil:#4ADE80; --l-preterist:#22D3EE; color-scheme:dark }
:root:root[data-scheme="ember"]{ --bg:#170F0C; --surface:#221713; --surface2:#2E2019; --tint:#3A2318; --fg:#F6EAE2; --muted:#C7B0A2; --line:#3E2C22; --accent:#FF7A45; --accent-fg:#170F0C; --accent2:#FFC857; --glow:rgba(255,122,69,.16); --shadow:0 8px 28px rgba(0,0,0,.45); --s-intro:#C4B0A3; --s-ref:#F0ABFC; --s-grace:#FDBA74; --s-super:#FDE047; --s-love:#FB7185; --s-misc:#5EEAD4; --s-anti:#A3E635; --l-relational:#FB7185; --l-faith:#FDE047; --l-immortality:#F0ABFC; --l-sonship:#93C5FD; --l-postmil:#A3E635; --l-preterist:#5EEAD4; color-scheme:dark }
:root:root[data-scheme="jade"]{ --bg:#EDF4F0; --surface:#FFFFFF; --surface2:#DCEAE2; --tint:#D6EDE3; --fg:#10251C; --muted:#4D6559; --line:#C5D9CD; --accent:#0F7B55; --accent-fg:#fff; --accent2:#C2410C; --glow:rgba(15,123,85,.14); --s-intro:#57706A; --s-ref:#7C3AED; --s-grace:#0F7B55; --s-super:#B45309; --s-love:#BE123C; --s-misc:#0E7490; --s-anti:#4D7C0F; --l-relational:#BE123C; --l-faith:#B45309; --l-immortality:#7C3AED; --l-sonship:#1D4ED8; --l-postmil:#4D7C0F; --l-preterist:#0E7490; color-scheme:light }
:root:root[data-scheme="royal"]{ --bg:#120D22; --surface:#1B1531; --surface2:#261E42; --tint:#2C2350; --fg:#EEE9FB; --muted:#B0A6CF; --line:#342A56; --accent:#B39DFF; --accent-fg:#120D22; --accent2:#F472B6; --glow:rgba(179,157,255,.16); --shadow:0 8px 28px rgba(0,0,0,.45); --s-intro:#B4ADC9; --s-ref:#F0ABFC; --s-grace:#93C5FD; --s-super:#FCD34D; --s-love:#FDA4AF; --s-misc:#5EEAD4; --s-anti:#86EFAC; --l-relational:#FDA4AF; --l-faith:#FCD34D; --l-immortality:#F0ABFC; --l-sonship:#93C5FD; --l-postmil:#86EFAC; --l-preterist:#5EEAD4; color-scheme:dark }
:root:root[data-scheme="ocean"]{ --bg:#E8F3F7; --surface:#FFFFFF; --surface2:#D5E9F0; --tint:#D0E8F0; --fg:#0A2A36; --muted:#4A6874; --line:#BFDAE4; --accent:#0B6E8A; --accent-fg:#fff; --accent2:#D97706; --glow:rgba(11,110,138,.14); --s-intro:#52707C; --s-ref:#6D28D9; --s-grace:#0B6E8A; --s-super:#C2410C; --s-love:#BE123C; --s-misc:#0F766E; --s-anti:#15803D; --l-relational:#BE123C; --l-faith:#C2410C; --l-immortality:#6D28D9; --l-sonship:#1D4ED8; --l-postmil:#15803D; --l-preterist:#0B6E8A; color-scheme:light }
:root:root[data-scheme="sand"]{ --bg:#EFE9DF; --surface:#FBF8F3; --surface2:#E4DBCC; --tint:#EADCCB; --fg:#2A2118; --muted:#6E604F; --line:#D6CAB6; --accent:#7A3E12; --accent-fg:#fff; --accent2:#2F6F73; --glow:rgba(122,62,18,.12); --s-intro:#7C6F5E; --s-ref:#6B21A8; --s-grace:#7A3E12; --s-super:#A16207; --s-love:#9F1239; --s-misc:#2F6F73; --s-anti:#3F6212; --l-relational:#9F1239; --l-faith:#A16207; --l-immortality:#6B21A8; --l-sonship:#1E40AF; --l-postmil:#3F6212; --l-preterist:#2F6F73; color-scheme:light }
:root:root[data-scheme="mono"]{ --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F1F1F1; --tint:#EDEDED; --fg:#0A0A0A; --muted:#5B5B5B; --line:#DADADA; --accent:#0A0A0A; --accent-fg:#fff; --accent2:#E11D48; --glow:rgba(0,0,0,.07); --s-intro:#737373; --s-ref:#404040; --s-grace:#0A0A0A; --s-super:#525252; --s-love:#E11D48; --s-misc:#404040; --s-anti:#166534; --l-relational:#E11D48; --l-faith:#0A0A0A; --l-immortality:#525252; --l-sonship:#262626; --l-postmil:#166534; --l-preterist:#404040; color-scheme:light }
:root:root[data-scheme="midnight"]{ --bg:#04060C; --surface:#0B1020; --surface2:#121A30; --tint:#0F2236; --fg:#DCE6F7; --muted:#8E9DBB; --line:#1C2742; --accent:#38BDF8; --accent-fg:#04060C; --accent2:#FACC15; --glow:rgba(56,189,248,.16); --shadow:0 8px 28px rgba(0,0,0,.6); --s-intro:#94A3B8; --s-ref:#C4B5FD; --s-grace:#38BDF8; --s-super:#FACC15; --s-love:#FB7185; --s-misc:#2DD4BF; --s-anti:#4ADE80; --l-relational:#FB7185; --l-faith:#FACC15; --l-immortality:#C4B5FD; --l-sonship:#38BDF8; --l-postmil:#4ADE80; --l-preterist:#2DD4BF; color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img,svg{max-width:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;overflow-x:hidden;overflow-wrap:break-word;word-wrap:break-word;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
svg text{font-family:var(--font)}
a{color:var(--accent)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{line-height:1.2;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.pagetitle{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:900;margin:4px 0 8px}
.pagelede{color:var(--muted);max-width:70ch;margin-bottom:18px}

/* top bar */
.top{position:-webkit-sticky;position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{position:relative;display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.05rem;text-decoration:none;color:var(--fg);white-space:nowrap;min-width:0}
.brand .mark{width:30px;height:30px;flex:none}
.brand .tail{font-weight:700;color:var(--muted)}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.nav a{padding:7px 11px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem}
.nav a:hover{background:var(--surface2);color:var(--fg)}
.nav a.on{background:var(--accent);color:var(--accent-fg)}
.tools{display:flex;gap:6px;align-items:center;margin-left:auto}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.88rem}
.ibtn:hover{border-color:var(--accent)}
.ibtn svg{width:18px;height:18px;flex:none}
#menuBtn{display:none}
@media (max-width:1180px){
  #menuBtn{display:inline-flex}
  .nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;flex-wrap:nowrap;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
  .nav.open{display:flex}
  .nav a{font-size:1rem;padding:11px 14px;border-radius:10px}
}
@media (max-width:420px){ .brand .tail{display:none} .ibtn .lbl{display:none} }

/* scheme popover */
.pop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:100%;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;width:330px;max-width:calc(100vw - 32px);z-index:70}
.pop h4{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sw{border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:700}
.sw.on{border-color:var(--accent)}
.sw .chips{display:flex;height:22px;border-radius:6px;overflow:hidden}
.sw .chips i{flex:1}

main{min-height:70vh;padding-top:24px;padding-bottom:70px}
.view{-webkit-animation:viewIn .4s ease both;animation:viewIn .4s ease both}
@-webkit-keyframes viewIn{from{opacity:.2;-webkit-transform:translateY(6px)}to{opacity:1;-webkit-transform:none}}
@keyframes viewIn{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center;padding-bottom:24px}
.hero h1{font-size:clamp(2rem,5.4vw,4rem);font-weight:900;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lede{font-size:1.1rem;color:var(--muted);margin-top:14px;max-width:58ch}
.stats{display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:22px}
.stat b{display:block;font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:800;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
@media (max-width:860px){ .hero{grid-template-columns:minmax(0,1fr)} }

/* mind map */
.mapbox{position:relative;border-radius:24px;background:radial-gradient(circle at 50% 50%,var(--glow),rgba(0,0,0,0) 65%)}
.mapbox svg{width:100%;height:auto;display:block}
.map-edge{fill:none;stroke-width:1.6}
.map-node{cursor:pointer}
.map-node circle{transition:stroke-width .2s}
.map-node:hover circle,.map-node:focus circle{stroke-width:6}
.map-node text{font-weight:800;pointer-events:none}
.maptip{display:block;width:-webkit-fit-content;width:fit-content;max-width:100%;margin:6px auto 0;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:8px 12px;font-size:.9rem;font-weight:700;text-align:center}
.draw{stroke-dasharray:700;stroke-dashoffset:0;-webkit-animation:draw 1.4s ease both;animation:draw 1.4s ease both}
@-webkit-keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}

/* section blocks on home */
.sections{display:grid;gap:28px;margin-top:30px}
.sec-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:7px}
.sec-head h2{font-size:1.3rem;font-weight:900}
.sec-head .count{margin-left:auto;font-size:.8rem;color:var(--muted);font-weight:700;margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);text-decoration:none;color:var(--fg);min-width:0;transition:transform .2s,box-shadow .2s}
.ccard:hover{-webkit-transform:translateY(-2px);transform:translateY(-2px);box-shadow:var(--shadow)}
.ccard .num{font-size:.74rem;font-weight:900;letter-spacing:.1em;color:var(--c);text-transform:uppercase}
.ccard h3{font-size:1.02rem;font-weight:800}
.ccard p{font-size:.9rem;color:var(--muted)}
.ccard .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.75rem;color:var(--muted);font-weight:700;margin-top:auto;padding-top:4px}

/* chapter page */
.band{position:relative;overflow:hidden;border-radius:22px;padding:clamp(18px,4vw,40px);background:var(--tint);border:1px solid var(--line);border-left:6px solid var(--c)}
.band .big{position:absolute;right:20px;top:-6px;font-size:clamp(5rem,14vw,11rem);font-weight:900;color:var(--c);opacity:.13;line-height:1;pointer-events:none;font-variant-numeric:tabular-nums}
.band h1{position:relative;font-size:clamp(1.5rem,3.6vw,2.5rem);font-weight:900;max-width:26ch}
.band .thesis{position:relative;margin-top:14px;font-size:1.06rem;max-width:64ch;font-weight:600}
.band .tlabel{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:900;margin-bottom:4px}
.crumbs{position:relative;display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
@media (max-width:600px){ .band .big{display:none} }
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:800;background:var(--surface);color:var(--fg);border:1px solid var(--line);text-decoration:none;white-space:nowrap}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.jumps{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.jumps a{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:800;color:var(--muted);text-decoration:none}
.jumps a:hover{color:var(--fg);border-color:var(--c)}
.blk{margin-top:36px;scroll-margin-top:90px}
.blk>h2{font-size:1.28rem;font-weight:900;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.blk>h2 .n{font-size:.75rem;font-weight:800;color:var(--muted);background:var(--surface2);border-radius:999px;padding:2px 9px}
.summary{font-size:1.04rem;max-width:72ch}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){ .two{grid-template-columns:minmax(0,1fr)} }
.totop{display:inline-block;margin-top:10px;font-size:.8rem;font-weight:800;color:var(--muted);text-decoration:none}

/* influences strip on chapters */
.infl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ichip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg)}
.ichip .dot{width:12px;height:12px;border-radius:4px;background:var(--ic);flex:none;margin-top:5px}
.ichip b{display:block;font-size:.92rem}
.ichip small{display:block;color:var(--muted);font-size:.82rem;line-height:1.45}

/* flowchart */
.flow{display:flex;flex-direction:column;align-items:stretch;counter-reset:f}
.fnode{position:relative;align-self:flex-start;width:560px;max-width:92%;padding:12px 16px 12px 54px;border-radius:14px;background:var(--surface);border:1.5px solid var(--c);font-weight:700;font-size:.95rem;box-shadow:var(--shadow);-webkit-animation:fin .5s ease both;animation:fin .5s ease both}
.fnode:nth-child(4n+3){align-self:center}
.fnode:nth-child(4n+5){align-self:flex-end}
.fnode::before{counter-increment:f;content:counter(f);position:absolute;left:12px;top:50%;margin-top:-14px;width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--surface);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:900}
.farrow{height:28px;align-self:center;width:2px;background:var(--c);position:relative;opacity:.7}
.farrow::after{content:"";position:absolute;bottom:-2px;left:-5px;border:6px solid transparent;border-top:7px solid var(--c);border-bottom:0}
.fnode.last{background:var(--c);color:var(--surface)}
.fnode.last::before{background:var(--surface);color:var(--c)}
@-webkit-keyframes fin{from{opacity:.15;-webkit-transform:translateY(8px)}to{opacity:1;-webkit-transform:none}}
@keyframes fin{from{opacity:.15;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:640px){ .fnode{align-self:stretch!important;width:auto;max-width:none} }

/* outlines */
.outline{margin-bottom:22px}
.outline h3{font-size:1.02rem;font-weight:900;margin-bottom:10px;color:var(--fg)}
.acro{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.acro span{display:inline-flex;align-items:center;justify-content:center;width:46px;height:52px;border-radius:12px;background:var(--c);color:var(--surface);font-size:1.6rem;font-weight:900;-webkit-animation:fin .45s ease both;animation:fin .45s ease both}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);min-width:0;-webkit-animation:fin .45s ease both;animation:fin .45s ease both}
.tile .L{font-size:2.2rem;font-weight:900;line-height:1;color:var(--c)}
.tile h4{font-size:1rem;font-weight:800}
.tile p{font-size:.9rem}
.olist{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 14px;counter-reset:o}
.olist li{position:relative;padding:10px 12px 10px 46px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.92rem;min-width:0}
.olist li::before{counter-increment:o;content:counter(o);position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:8px;background:var(--c);color:var(--surface);font-weight:900;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.olist li b{display:block}
.refs{display:flex;flex-wrap:wrap;gap:5px}
.ref{font-size:.74rem;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--fg);white-space:nowrap;border:0;cursor:pointer;line-height:1.4}
.ref:hover{background:var(--accent);color:var(--accent-fg)}

/* argument cards */
.args{display:grid;gap:12px}
.arg{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:16px;overflow:hidden}
.arg>summary{display:block;list-style:none;cursor:pointer;padding:14px 16px}
.arg>summary::-webkit-details-marker{display:none}
.arg>summary::marker{content:""}
.arg .sh{display:flex;gap:12px;align-items:flex-start}
.arg .k{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;background:var(--surface2);color:var(--c)}
.arg .tt{flex:1;min-width:0}
.arg h3{font-size:1rem;font-weight:800}
.arg .tgt{font-size:.8rem;color:var(--muted);font-weight:700;margin-top:2px}
.arg .chev{flex:none;color:var(--muted);transition:transform .25s;margin-top:6px}
.arg[open] .chev{-webkit-transform:rotate(180deg);transform:rotate(180deg)}
.arg .body{padding:0 16px 16px;display:grid;gap:12px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){ .vs{grid-template-columns:minmax(0,1fr)} }
.side{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.94rem;min-width:0}
.side.book{background:var(--surface2)}
.side.resp{background:var(--tint);border:1px solid var(--accent)}
.side .lbl{font-size:.7rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.side.resp .lbl{color:var(--accent)}
.lenses{display:flex;gap:5px;flex-wrap:wrap}
.lens{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:800;padding:2px 9px 2px 7px;border-radius:999px;color:var(--fg);background:var(--surface);border:1px solid var(--line)}
.lens::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lc)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chipbtn{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:.8rem;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chipbtn .d{width:8px;height:8px;border-radius:50%;background:var(--lc,var(--accent))}
.chipbtn.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* Q&A */
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:360px){ .qs,.cards,.tiles,.olist,.stories,.verses,.infl{grid-template-columns:minmax(0,1fr)} }
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.q .qq{font-weight:800;font-size:1.02rem;display:flex;gap:10px}
.q .qq i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c,var(--accent));color:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:900;font-style:normal}
.q .ans{font-size:.93rem;border-left:3px solid var(--line);padding-left:12px}
.q .ans.r{border-color:var(--accent)}
.q .ans b{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.q .ans.r b{color:var(--accent)}

/* criticisms */
.crit{display:grid;gap:12px}
.cr{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cr .who{padding:14px;background:var(--surface2);font-weight:800;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.cr .who svg{width:26px;height:26px;color:var(--c)}
.cr .what{padding:14px;display:grid;gap:10px;font-size:.94rem;min-width:0}
.cr blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--c);background:var(--surface2);border-radius:0 8px 8px 0;font-style:italic}
@media (max-width:640px){ .cr{grid-template-columns:minmax(0,1fr)} .cr .who{flex-direction:row;align-items:center} }

/* stories & verses */
.stories,.verses{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.story .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--c)}
.story .ic svg{width:22px;height:22px}
.story h4{font-size:1rem;font-weight:800}
.story p{font-size:.92rem}
.story .pt{font-size:.88rem;font-weight:700;color:var(--fg);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.verse{border-radius:16px;padding:18px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);display:flex;flex-direction:column;gap:8px;min-width:0}
.verse .vr{font-weight:900;color:var(--c);font-size:.92rem}
.verse .vt{font-style:italic;font-size:1.02rem}
.verse small{color:var(--muted);font-size:.86rem}

.overview{border-radius:18px;padding:20px;background:var(--tint);border:1.5px solid var(--accent);font-size:1.02rem}
.pager{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:40px}
.pager a{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--fg);font-weight:800;min-width:0}
.pager a small{display:block;color:var(--muted);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}
.pager a.nx{text-align:right;grid-column:2}
@media (max-width:560px){ .pager{grid-template-columns:minmax(0,1fr)} .pager a.nx{grid-column:1} }

/* diagrams */
.dgrid{display:grid;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,26px);min-width:0}
.panel>h2{font-size:1.25rem;font-weight:900;margin-bottom:4px}
.panel>p.sub{color:var(--muted);margin-bottom:16px;max-width:70ch}
.scales{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.scale{text-align:center;padding:12px;border-radius:16px;background:var(--surface2)}
.scale svg{width:100%;height:auto}
.scale h4{font-weight:900;margin-top:6px}
.scale p{font-size:.88rem;color:var(--muted)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:.86rem;font-weight:700;cursor:pointer;background:none;border:0;padding:3px 0;text-align:left}
.bar .t{height:18px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px;background:var(--accent);-webkit-transform-origin:left;transform-origin:left;-webkit-animation:grow 1s ease both;animation:grow 1s ease both}
@-webkit-keyframes grow{from{-webkit-transform:scaleX(.05)}}
@keyframes grow{from{transform:scaleX(.05)}}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.sectionchart{display:flex;height:44px;border-radius:12px;overflow:hidden;margin:6px 0 12px}
.sectionchart a{display:flex;align-items:center;justify-content:center;color:var(--surface);font-weight:900;font-size:.8rem;text-decoration:none;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.84rem;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* responsive timeline (no sideways scroll) */
.tline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;position:relative}
.tline::before{content:"";position:absolute;left:4%;right:4%;top:15px;height:4px;border-radius:4px;background:var(--line)}
.tline li{position:relative;text-align:center;padding-top:40px;min-width:0}
.tline li::before{content:"";position:absolute;top:5px;left:50%;margin-left:-12px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:4px solid var(--tc)}
.tline b{display:block;color:var(--tc);font-size:1.02rem;font-weight:900}
.tline span{display:block;font-size:.86rem;font-weight:600}
@media (max-width:760px){
  .tline{grid-template-columns:minmax(0,1fr);gap:16px}
  .tline::before{left:13px;right:auto;top:6px;bottom:6px;width:4px;height:auto}
  .tline li{text-align:left;padding:0 0 0 40px}
  .tline li::before{top:3px;left:5px;margin-left:0}
}

/* topic rows (replace wide tables) */
.rows{display:grid;gap:12px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.row .rh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.row .rh h3{font-size:1.08rem;font-weight:900}
.row .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:700px){ .row .cols{grid-template-columns:minmax(0,1fr)} }
.row .col{border-radius:12px;padding:12px 14px;font-size:.93rem;min-width:0}
.row .col.no{background:var(--surface2)}
.row .col.yes{background:var(--tint);border:1px solid var(--accent)}
.row .col b{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.row .col.yes b{color:var(--accent)}
.row .chs{display:flex;flex-wrap:wrap;gap:6px}

/* influences page */
.net{max-width:820px;margin:0 auto}
.net svg{width:100%;height:auto;display:block}
@media (max-width:600px){ .net svg .lab{display:none} }
.icard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ic);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:90px}
.icard h3{font-size:1.12rem;font-weight:900}
.icard .meter{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.icard .meter i{display:block;height:100%;background:var(--ic);border-radius:8px}
.icard dl{margin:0;display:grid;gap:8px;font-size:.93rem}
.icard dt{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.icard dd{margin:0}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media (max-width:360px){ .igrid,.lensgrid{grid-template-columns:minmax(0,1fr)} }

/* lenses (answers app) */
.lensgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.lcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--lc);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:90px}
.lcard h3{font-size:1.15rem;font-weight:900}
.lcard ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.93rem}
.lcard svg{width:100%;height:auto}
.lcard .roots{font-size:.86rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.wheelwrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:760px){ .wheelwrap{grid-template-columns:minmax(0,1fr)} }
.wheel{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.wheel text{font-weight:800}
.wheel .seg{cursor:pointer}

/* search & lists */
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 14px;margin-bottom:16px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;padding:10px 0;color:var(--fg);outline:none}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.hits{display:grid;gap:10px}
.hit{display:block;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);min-width:0}
.hit:hover{border-color:var(--accent)}
.hit small{display:block;color:var(--muted);font-weight:700;font-size:.78rem}
mark{background:var(--accent2);color:var(--bg);border-radius:3px;padding:0 2px}
.bookbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

footer{border-top:1px solid var(--line);padding-top:26px;padding-bottom:26px;color:var(--muted);font-size:.86rem}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{-webkit-animation:none!important;animation:none!important;transition:none!important} }

/* shared reader responses */
.rbox{margin-top:4px;border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.rhead{display:flex;align-items:center;gap:10px}
.rn{font-size:.78rem;font-weight:800;color:var(--muted)}
.rlist{display:grid;gap:8px}
.ritem{position:relative;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pc);overflow:hidden;min-width:0}
.ritem::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:var(--pc);opacity:.07;pointer-events:none}
.ritem .av{position:relative;flex:none;width:30px;height:30px;border-radius:50%;background:var(--pc);object-fit:cover}
.rbody{position:relative;flex:1;min-width:0;display:grid;gap:4px}
.rmeta{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:.8rem;color:var(--muted)}
.rmeta b{color:var(--fg);font-size:.9rem}
.rmeta .you{font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:6px;background:var(--pc);color:var(--surface)}
.rtext{font-size:.94rem;white-space:pre-wrap}
.rctx{font-size:.8rem;font-weight:800;color:var(--fg);text-decoration:none}
.rctx:hover{text-decoration:underline}
.racts{display:flex;gap:12px}
.linkbtn{background:none;border:0;padding:0;font-size:.8rem;font-weight:800;color:var(--muted);cursor:pointer;text-decoration:underline}
.linkbtn:hover{color:var(--fg)}
.rform{display:grid;gap:8px}
.rform textarea{width:100%;min-height:76px;resize:vertical;font:inherit;font-size:16px;line-height:1.5;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.rform textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.rfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.rsend{padding:8px 14px}
.rnote{font-size:.86rem;color:var(--muted)}
.rbadge{flex:none;align-self:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:.75rem;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
.q .rbox{margin-top:auto}
.rsel{font:inherit;font-size:16px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%;min-width:0;flex:1 1 220px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.flash{box-shadow:0 0 0 3px var(--accent)!important;transition:box-shadow .3s}

</style>
</head>

window.DATA = {"chapters":[{"num":0,"section":"Introduction","title":"Is It Even Biblical to Be Hyper-Biblical?","summary":"The author opens with the October 2023 bombing of a Jehovah's Witness convention in Kalamassery, Kerala, by a disaffected former member, and says that while fighting hell-populating false teaching has biblical approval (Jude 3), the right weapon is God's Word rightly interpreted, not bombs. Using the image of hybrid versus local tomatoes, he argues that sound doctrine and false teaching look alike to shallow readers, so believers must be 'Hyper-Biblical'. He traces a biblical 'add not, subtract not' command from Moses (Deut 4:2; 12:32; 29:29) through Proverbs 30:6, Revelation 22:18-19, Jude 3 and Ephesians 4:14, and holds up Jesus (Matt 23:23), the Bereans (Acts 17:11) and the apostles ('as the Scripture says') as Hyper-Biblical models. He defines Hyper-Grace, Hyper-Love, Hyper-Supernaturalism and Hyper-Israel as over-emphasising one portion of Scripture while neglecting others. Finally he reads Revelation 12:15-17 as Satan's flood of false teaching that will end in judgment, and calls readers to choose to be Hyper-Biblical.","thesis":"Because God forbids adding to or subtracting from his Word, believers must be 'Hyper-Biblical', holding all of Scripture, rather than 'hyper' about one favoured portion.","outline":{"acronym":"Models of Being Hyper-Biblical","items":[{"letter":"1","label":"Moses and the Old Testament saints","point":"Moses repeated all of the Law and repeatedly commanded Israel not to add to or subtract from God's commands, and to obey every word.","refs":["Deut 1:3","Deut 4:2","Deut 12:32","Deut 29:29"]},{"letter":"2","label":"The many 'add nots and subtract nots'","point":"Proverbs and Revelation repeat the command; Revelation adds a punishment for adders and subtractors, and 2 Peter 2 sends false teachers who utter false words to destruction.","refs":["Prov 30:6","Rev 22:18-19","2 Pet 2:1-3"]},{"letter":"3","label":"Jude's 'once for all' faith","point":"The faith once for all entrusted to the saints means no new teaching may be added beyond the 66 books of Scripture.","refs":["Jude 3"]},{"letter":"4","label":"Paul's warning against new teaching","point":"Believers must not be tossed by every wind of new teaching; extra-biblical new teachings must be rejected.","refs":["Eph 4:14"]},{"letter":"5","label":"Jesus was Hyper-Biblical","point":"Jesus told the Pharisees to practise the weightier matters without neglecting the others, calling for obedience to all of Scripture.","refs":["Matt 23:23"]},{"letter":"6","label":"The noble Bereans","point":"The Bereans examined the Scriptures daily to test Paul's teaching, and Scripture calls that noble.","refs":["Acts 17:11"]},{"letter":"7","label":"The apostles: 'What does the Scripture say?'","point":"The apostles constantly appealed to 'as the Scripture says' and 'as it is written' (20 times in Paul).","refs":["Rom 4:3","Gal 4:30","Acts 15:15","Rom 9:17","Rom 10:11","Rom 11:2","1 Cor 6:16","1 Tim 5:18","Jas 4:5-6","1 Pet 2:6","Eph 4:8"]},{"letter":"8","label":"Satan is hyper-anti-biblical","point":"Satan floods the world with false teaching through surrendered mouths; holding to the written Word enrages him, and the earth swallowing the flood pictures the judgment of false teachers.","refs":["Rev 12:15-17","Matt 24:10-11","2 Pet 2:1"]}]},"claims":[{"claim":"False teaching must be fought, but with the Word, not violence","detail":"The Kerala convention bomber was enraged by Jehovah's Witness doctrine and responded with explosives, killing eight. The author says fighting hell-populating false teaching has biblical approval (Jude 3), but the right 'bomb' is God's Word rightly interpreted, which is what this book attempts.","refs":["Jude 3"],"target":"Indifference to doctrinal error, and violent responses to it"},{"claim":"Sound doctrine and false teaching look alike to shallow readers","detail":"Like a husband who cannot tell hybrid 'Bangalore' tomatoes from local 'Nattu' tomatoes, a casual Bible reader cannot distinguish truth from hell-populating error. Therefore believers must be 'Hyper-Biblical' rather than 'hyper' about grace, the supernatural, love or Israel.","refs":[],"target":"Casual, shallow Bible reading"},{"claim":"Scripture repeatedly forbids adding to or subtracting from God's Word","detail":"Moses commanded Israel not to add to or take from God's commands and to obey every word (Deut 4:2; 12:32; 29:29), and Proverbs 30:6 and Revelation 22:18-19 repeat it. Revelation adds a penalty, and 2 Peter 2 says false teachers who utter false words face destruction.","refs":["Deut 4:2","Deut 12:32","Deut 29:29","Prov 30:6","Rev 22:18-19","2 Pet 2:1-3"],"target":"Teachers who add extra-biblical ideas or subtract inconvenient texts"},{"claim":"Hyper-Grace adds 'God only sees Jesus' and subtracts holiness","detail":"The author says a Hyper-Grace teacher adds to Scripture by claiming the Father smiles at you even while you live in sin because he only looks at Jesus, and subtracts from it by condemning messages on daily holy living. Believers are the righteousness of God (2 Cor 5:21) but must still live holy lives (2 Cor 7:1).","refs":["2 Cor 5:21","2 Cor 7:1"],"target":"God sees only Jesus, not the believer's sin; holiness preaching is condemned"},{"claim":"Jude and Paul forbid any new teaching beyond Scripture","detail":"Jude 3's 'faith once for all entrusted' means nothing may be added to what the 66 books teach. Paul's warning against every 'wind of new teaching' (Eph 4:14) means extra-biblical assertions must be rejected, and adding to the old teaching is a serious sin.","refs":["Jude 3","Eph 4:14"],"target":"New revelations and novel doctrines"},{"claim":"Hyper-teachers emphasise one portion and neglect the rest","detail":"Using Matthew 23:23, the author defines Hyper-Grace as preaching grace while neglecting holiness; Hyper-Love as preaching love while neglecting wrath and eternal hell (including post-mortem return to heaven and annihilation); Hyper-Supernaturalism as insisting God always heals now and ignoring suffering; and Hyper-Israel as observing ceremonies like Passover, blindly backing political Israel, and prioritising Israel over the local church.","refs":["Matt 23:23"],"target":"Hyper-Grace, Hyper-Love, Hyper-Supernaturalism, Hyper-Israel"},{"claim":"The Bereans and apostles model daily Scripture-testing","detail":"The Bereans examined the Scriptures daily and were called noble (Acts 17:11). The apostles constantly asked 'What does the Scripture say?' and Paul uses 'as it is written' about 20 times, showing they were Hyper-Biblical.","refs":["Acts 17:11","Rom 4:3","Gal 4:30"],"target":"Believers who do not test teaching by Scripture"},{"claim":"Revelation 12's flood is Satan's false teaching, ending in judgment","detail":"The dragon's flood (Rev 12:15) pictures the flood of false teaching through surrendered mouths, as Jesus warned of many false prophets (Matt 24:10-11). The earth swallowing the river (Rev 12:16) pictures the earth swallowing false teachers like Korah, i.e. their hell destination; holding to the written Word enrages Satan (Rev 12:17).","refs":["Rev 12:15-17","Matt 24:10-11","2 Pet 2:1","Num 16:31-33"],"target":"False teachers inspired by Satan"}],"questions":[{"q":"Is it even biblical to be Hyper-Biblical?","answer":"Yes. Moses, Jesus, the Bereans and the apostles were all Hyper-Biblical, so it is biblical and noble to hold to all of Scripture."},{"q":"How did Hyper-Grace preachers become Hyper-Grace preachers?","answer":"By preaching only the grace of God and neglecting Scriptures about believers' responsibilities, such as holy living (Matt 23:23)."},{"q":"How do false teachers add to or subtract from God's Word?","answer":"For example, by adding 'the Father smiles at you even when you live in sin because he only sees Jesus' and subtracting by condemning messages on daily holy living."},{"q":"What would you choose to be: Hyper-Biblical or Hyper-Grace, Hyper-Supernatural, Hyper-Love, Hyper-Israel?","answer":"The author urges readers to choose to be Hyper-Biblical."}],"criticisms":[{"of":"Hyper-Grace false teachers (general)","quote":"God, the Father smiles at you even when you live in sin, as He only looks at the always-holy Jesus, not at you!","critique":"This adds to Scripture, and they subtract from it by condemning any message on daily holy living, even though 2 Corinthians stresses both imputed righteousness and holy living."},{"of":"a Chennai pastor (anonymised)","quote":"","critique":"He suggests that even if people go to hell, they could come back to heaven; the author labels this Hyper-Love."},{"of":"a prominent evangelical leader from Britain (anonymised)","quote":"","critique":"He suggests those who go to hell stop existing the moment they enter it (annihilationism); the author labels this Hyper-Love."},{"of":"an American pastor who runs a 'supernatural' school of ministry (anonymised)","quote":"","critique":"He teaches God must always perform miracles and healings here and now, neglecting texts on suffering and disease."},{"of":"Hyper-Israel believers (general)","quote":"","critique":"They ignore epistles saying ceremonial law no longer binds Gentiles, passionately celebrate Passover, blindly support political Israel and are obsessed with Israel over the local church."}],"illustrations":[{"title":"The bomber at a Jehovah's Witness convention","story":"In October 2023 a man planted IEDs in tiffin boxes at a Jehovah's Witness convention in Kalamassery near Kochi, killing eight including a 12-year-old, because he was enraged by their teaching.","point":"Fighting false teaching is right (Jude 3), but the weapon must be God's Word rightly interpreted, not violence."},{"title":"Hybrid tomatoes versus local tomatoes","story":"A husband unfamiliar with shopping may buy 'Bangalore' hybrid tomatoes when his wife wanted local 'Nattu' tomatoes, because they look alike.","point":"Sound doctrine and false teaching look alike to shallow Bible readers, so we must be Hyper-Biblical."},{"title":"Korah swallowed by the earth","story":"The earth opened and swallowed Korah and his rebellious company; Revelation 12 pictures the earth swallowing the dragon's flood.","point":"Unrepentant false teachers and those who follow them face a hell destination."}],"keyVerses":[{"ref":"Deut 4:2","text":"Do not add to what I command you and do not subtract from it","use":"Foundation of the 'add not, subtract not' principle."},{"ref":"Rev 22:18-19","text":"If anyone adds to them, God will add to him the plagues","use":"Shows a punishment awaits those who add to or subtract from God's Word."},{"ref":"Jude 3","text":"contend for the faith that was once for all entrusted to God's holy people","use":"No new teaching may be added; fighting false teaching has biblical approval."},{"ref":"Eph 4:14","text":"tossed and blown about by every wind of new teaching","use":"New teachings beyond Scripture must be rejected."},{"ref":"Matt 23:23","text":"you should have practiced the latter, without neglecting the former","use":"Jesus called for obedience to all of Scripture; neglecting parts creates 'hyper' errors."},{"ref":"Acts 17:11","text":"examined the Scriptures daily to see if they supported what he said","use":"The Bereans model noble Hyper-Biblical testing."},{"ref":"Rev 12:15-16","text":"the earth helped the woman and opened its mouth to swallow up the river","use":"Satan's flood of false teaching and the judgment of false teachers."}],"flow":["A bomber fought false teaching the wrong way","Truth and error look alike to shallow readers","God repeatedly forbids adding to or subtracting from his Word","Jesus, Bereans and apostles held all of Scripture","'Hyper' errors overemphasise one portion and neglect others","Satan floods the church with false teaching","Choose to be Hyper-Biblical"],"outlines":null},{"num":1,"section":"Reformation","title":"Carrying the Spirit of Reformation Even Now!","summary":"The author retells how Martin Luther nailed 95 theses to the Wittenberg church door on October 31, 1517, provoked by the sale of indulgences by John Tetzel to repay an archbishop's loan used to bribe the Pope. Luther knew Scripture taught forgiveness through faith in Jesus (Acts 10:43), salvation by grace (Eph 2:8), that money cannot redeem (Zeph 1:18; Ps 49:7), and that there is no salvation after death (Heb 9:27; Luke 16:26). Summoned to Worms, Luther refused to recant because his conscience was captive to the Word of God. The author argues that today's Protestant church also practises unbiblical things, including infant baptism, 'accountability to God alone', non-involvement in missions, hyper-grace, 'once saved always saved', and teaching that God always wills to heal. Born on Reformation Day 1974, he sees himself as continuing Luther's crusade against hell-populating false teaching and invites readers to join.","thesis":"Just as Luther opposed unbiblical Catholic practices, believers today must carry the spirit of the Reformation by exposing and countering modern Protestant false teachings with sound doctrine.","outline":{"acronym":"Modern Unbiblical Practices Needing Reform","items":[{"letter":"1","label":"Infant baptism","point":"Listed as an unscriptural practice of the modern Protestant church.","refs":[]},{"letter":"2","label":"'Accountability to God alone' in finances and morals","point":"Leaders refusing human accountability is unbiblical.","refs":[]},{"letter":"3","label":"Non-involvement in missionary work","point":"Churches neglecting missions are not scriptural.","refs":[]},{"letter":"4","label":"Hyper-grace teaching","point":"Offers grace as a license to sin.","refs":[]},{"letter":"5","label":"'Once saved, always saved'","point":"Unconditional eternal security is listed as false teaching.","refs":[]},{"letter":"6","label":"'God's will is always to heal and do miracles'","point":"Listed as an unbiblical teaching.","refs":[]}]},"claims":[{"claim":"Indulgences were permission to sin bought with money","detail":"An archbishop borrowed money to bribe the Pope for three bishoprics, and to repay it indulgences were sold, crudely 'prior permission to sin without losing one's place in heaven'. Tetzel even claimed they could release dead loved ones from purgatory.","refs":[],"target":"Medieval indulgence system"},{"claim":"Salvation is by grace through faith, not money","detail":"Luther knew everyone who believes in Jesus receives forgiveness through his name (Acts 10:43) and salvation is by grace alone (Eph 2:8). Silver and gold cannot save on the day of wrath (Zeph 1:18), and no one can redeem another by paying God (Ps 49:7).","refs":["Acts 10:43","Eph 2:8","Zeph 1:18","Ps 49:7"],"target":"Salvation by payment or works"},{"claim":"There is no chance of salvation after death","detail":"Hebrews 9:27 says man is destined to die once and then face judgment, and in Luke 16:26 Abraham says no one can cross the chasm. Once a person dies and enters eternal torment in hell, there is no way out; so purgatory-release was a lie.","refs":["Heb 9:27","Luke 16:26"],"target":"Purgatory and any post-mortem salvation"},{"claim":"Conscience captive to the Word means refusing to recant","detail":"Summoned to Worms despite danger, Luther said he would go though there were as many devils as roof tiles, and declared he was bound by the texts of the Bible and could not recant. This is the model for believers today.","refs":[],"target":"Compromise with unbiblical authority"},{"claim":"Today's Protestant church needs a new reformation","detail":"Modern Protestants practise unbiblical things: infant baptism, 'accountability to God alone' in finances and morals, neglect of missions, hyper-grace as license to sin, once-saved-always-saved, and teaching that God always wills to heal and do miracles. We must be rooted enough in Scripture to instantly identify and oppose these.","refs":["Jude 3"],"target":"Infant baptism, unaccountability, mission neglect, hyper-grace, OSAS, always-heal teaching"},{"claim":"The best counter to false doctrine is sound doctrine","detail":"The author says the best way to counter unbiblical doctrines is to teach and promote sound biblical doctrine, thus contending for the faith once delivered (Jude 3) and carrying the spirit of reformation today.","refs":["Jude 3"],"target":"Passivity about doctrine"},{"claim":"False teaching is now worse than in Luther's time","detail":"Born on Reformation Day (October 31, 1974), the author sees his life marked by God's Ruhamah (mercy) and aims to revolutionise a Christian world affected by hell-populating false teaching on a greater scale than in Luther's day, inviting readers to join by reading the book.","refs":[],"target":"Modern false teaching"}],"questions":[{"q":"What was the event that spurred Luther to take this extreme step?","answer":"The sale of indulgences, authorised by the Pope to help an archbishop repay a loan used to bribe his way into three bishoprics, and marketed by Tetzel as releasing the dead from purgatory."},{"q":"Would you join this movement to fight false teaching?","answer":"Yes; by even reading this book the reader is taking baby steps to join it."}],"criticisms":[{"of":"the medieval Roman Catholic hierarchy and the indulgence-seller","quote":"They are now in purgatory. But if you buy these indulgences on their behalf they would be promoted to heaven!","critique":"Selling indulgences was unscriptural; forgiveness comes through faith in Christ, salvation is by grace, money cannot redeem, and there is no salvation after death."},{"of":"the modern Protestant church (general)","quote":"","critique":"It practises infant baptism, 'accountability to God alone', neglect of missions, hyper-grace, once-saved-always-saved, and 'God always heals' teaching."}],"illustrations":[{"title":"The 95 Theses on the Wittenberg door","story":"On October 31, 1517, Luther hammered 95 statements against unscriptural Catholic practices onto the Wittenberg church door during its anniversary celebration.","point":"Believers today must likewise publicly confront unbiblical practices."},{"title":"Tetzel's indulgences","story":"Tetzel sold indulgences in German marketplaces to repay an archbishop's loan, claiming they could promote dead relatives from purgatory to heaven.","point":"Salvation cannot be bought and there is no salvation after death."},{"title":"'As many devils as tiles on the roofs'","story":"Warned not to go to Worms, Luther said he would go though there were as many devils as roof tiles, and there refused to recant because his conscience was captive to the Word.","point":"We must be bound by Scripture whatever the cost."},{"title":"Born on Reformation Day","story":"The author was born in Chennai on October 31, 1974, the anniversary of the 95 Theses.","point":"He sees himself as continuing Luther's crusade against false teaching."}],"keyVerses":[{"ref":"Acts 10:43","text":"everyone who believes in Jesus will have their sins forgiven through His name","use":"Forgiveness by faith, not money."},{"ref":"Eph 2:8","text":"by grace you have been saved","use":"Salvation by grace alone."},{"ref":"Zeph 1:18","text":"Your silver and gold will be of no use to you on that day of the Lord's anger","use":"Money cannot save."},{"ref":"Ps 49:7","text":"No one can redeem the life of another by paying a ransom to God","use":"Against indulgences purchased for others."},{"ref":"Heb 9:27","text":"Man is destined to die once and after that face judgment","use":"No salvation after death."},{"ref":"Luke 16:26","text":"no one there can cross over to us","use":"No escape from hell once there."},{"ref":"Jude 3","text":"once for all delivered to the saints","use":"Contending for the faith as Luther did."}],"flow":["Indulgences sold to fund corruption","Luther saw them as plainly unscriptural","He posted 95 theses and refused to recant","Modern Protestants also practise unbiblical things","Counter false doctrine with sound doctrine","Join the author's movement against false teaching"],"outlines":null},{"num":2,"section":"Hyper-Grace","title":"Biblical Analysis of the Highlights of Hyper-Grace","summary":"The author introduces Hyper-Grace as a half-truth that is a full lie, popular in Hyderabad, Chennai, Bangalore, Singapore and worldwide, and analyses it with the acronym G-R-I-P. G is 'Grace Grammar Goof-up': the claim that past, present and future sins are automatically forgiven at salvation, refuted by the incestuous Corinthian 'brother' called evil and by many texts requiring repentance. R is 'Repentance Redefinition or Riddance': reducing repentance to a change of mind without action and rejecting Jesus' pre-cross sayings selectively. I is 'Incessant Identity Insanity': endless preaching on identity in Christ while dismissing progressive sanctification. P is 'Permanently Pleased Pop': the idea that God sees only Jesus' perfection, refuted by Jesus calling the Revelation churches to repent. He concludes by arguing that Zephaniah 3:17 ('God sings over you') refers to the sinless new creation, not to God rejoicing over believers living in sin, and urges readers to rescue those caught in Hyper-Grace's grip.","thesis":"Hyper-Grace, summarised as G-R-I-P, is a dangerous half-truth that denies the need for ongoing repentance and holiness and misuses texts like Zephaniah 3:17.","outline":{"acronym":"G-R-I-P","items":[{"letter":"G","label":"Grace Grammar Goof-up","point":"Hyper-Grace claims past, present and future sins are automatically forgiven at salvation; but Paul called a sexually immoral 'brother' an 'evil person', and cleansing is conditional on repentance (Ravenhill).","refs":["1 Cor 5:1","1 Cor 5:11","1 Cor 5:13","Ezek 18:32","Ezek 33:11","Acts 2:38","Acts 3:19","Acts 5:31","Acts 8:22","Rom 2:4-5","2 Cor 7:10","1 John 1:9"]},{"letter":"R","label":"Repentance Redefinition or Riddance","point":"Hyper-Grace says repentance is only a change of mind with no action, and some no longer preach it; but Paul demanded deeds in keeping with repentance, the damned 'did not repent', and Jesus said repent or perish. Selective rejection of pre-cross sayings is inconsistent; all Scripture is God-breathed.","refs":["Acts 26:20","Rev 9:20-21","Rev 16:9","Rev 16:11","Luke 13:1-5","Rev 21:8","Luke 9:53-55","2 Tim 3:16"]},{"letter":"I","label":"Incessant Identity Insanity","point":"Hyper-Grace constantly preaches identity in Christ and calls holiness preachers 'legalists' or 'mixed-grace'; but Scripture teaches progressive sanctification, chosen by free will and enabled by the Spirit.","refs":["1 Thess 4:3","Rev 22:11","Gal 5:16","Rom 8:13"]},{"letter":"P","label":"Permanently Pleased Pop","point":"Hyper-Grace says the Father never sees your failures, only Jesus; but Jesus told the churches to repent six times, Paul told Timothy to watch his life, and God is both Compassionate Father and Consuming Fire, Master and Bridegroom.","refs":["Rev 2:5","Rev 2:16","Rev 2:21-22","Rev 3:3","Rev 3:19","1 Tim 4:16","Heb 12:5","Heb 12:29","Col 3:24","Jude 4","2 Cor 11:2","Eph 5:27","Eph 2:8-10"]}]},"claims":[{"claim":"Hyper-Grace is a half-truth, and a half-truth is a full lie","detail":"Hyper-Grace is lapped up by unsuspecting believers from Hyderabad to Singapore. The author calls it an unbiblical teaching that is at best a half-truth, and therefore a full lie, describing its teachers as caught in the GRIP of its tenets.","refs":[],"target":"Hyper-Grace as a movement"},{"claim":"Future sins are not automatically forgiven at salvation","detail":"Hyper-Grace says a believer's past, present and future sins are forgiven when he is saved. The author counters that Paul called a 'brother' in an incestuous relationship an 'evil person' to be removed, not 'forgiven' or 'righteous' (1 Cor 5:1,11,13).","refs":["1 Cor 5:1","1 Cor 5:11","1 Cor 5:13"],"target":"Past, present and future sins forgiven at salvation"},{"claim":"Cleansing was provided at the cross but is conditional on repentance","detail":"Quoting David Ravenhill, the author says provision for cleansing was completed at the cross, but the process is conditional upon repentance. He cites Ezek 18:32; 33:11; Acts 2:38; 3:19; 5:31; 8:22; Rom 2:4-5; 2 Cor 7:10; 1 John 1:9.","refs":["Ezek 18:32","Ezek 33:11","Acts 2:38","Acts 3:19","Acts 5:31","Acts 8:22","Rom 2:4-5","2 Cor 7:10","1 John 1:9"],"target":"Repentance unnecessary for forgiveness"},{"claim":"Repentance includes action, not merely a change of mind","detail":"Hyper-Grace says repentance merely means a change of mind, and some no longer preach repentance. But Paul preached that Gentiles should repent, turn to God and perform deeds in keeping with repentance (Acts 26:20); the condemned 'did not repent' (Rev 9:20-21; 16:9,11); and Jesus said repent or perish (Luke 13:1-5).","refs":["Acts 26:20","Rev 9:20-21","Rev 16:9","Rev 16:11","Luke 13:1-5","Rev 21:8"],"target":"Repentance redefined as mere change of mind"},{"claim":"Accept all of Jesus' words, not just favourable pre-cross sayings","detail":"Hyper-Grace teachers reject Jesus' pre-cross commands (like repent or perish) as belonging to the old covenant, yet happily quote pre-cross sayings like Luke 9:53-55 where Jesus rebukes James and John for wanting to call down fire. They must accept all or none, since all Scripture is God-breathed (2 Tim 3:16).","refs":["Luke 9:53-55","2 Tim 3:16"],"target":"Selective dismissal of Jesus' pre-cross teaching"},{"claim":"Identity preaching must not displace progressive sanctification","detail":"Hyper-Grace sermons constantly start with 'who you are in Christ' and call holiness preachers 'hypocritical legalists' or 'mixed-grace preachers'. The author cites 1 Thess 4:3, the Assemblies of God doctrine of progressive sanctification, and Revelation 22:11 ('let the holy go on being made holy') as proof that holiness is progressive.","refs":["1 Thess 4:3","Rev 22:11"],"target":"Identity-only preaching that dismisses progressive sanctification"},{"claim":"We choose holiness by free will, enabled by the Spirit","detail":"Believers choose to live holy with their free will, empowered by the Spirit (Gal 5:16; Rom 8:13). Therefore there is nothing to boast about except being enabled by grace.","refs":["Gal 5:16","Rom 8:13"],"target":"Holiness as passive or automatic"},{"claim":"God does see believers' sins: Jesus told the churches to repent","detail":"Hyper-Grace says the Father doesn't see your failures, only Jesus' perfection. But post-cross Jesus told the Revelation churches 'Repent!' six times (Rev 2:5,16,21-22; 3:3,19), and Paul told Timothy to watch his life and doctrine to save himself (1 Tim 4:16).","refs":["Rev 2:5","Rev 2:16","Rev 2:21-22","Rev 3:3","Rev 3:19","1 Tim 4:16"],"target":"God sees only Jesus' perfection, never our failures"},{"claim":"God is both Compassionate Father and Consuming Fire","detail":"Hebrews 12 presents God as a Compassionate Father (v5) and Consuming Fire (v29). He is also a Master to be obeyed (Col 3:24; Jude 4) and a purity-expecting Bridegroom (2 Cor 11:2; Eph 5:27); we are saved by grace for good works (Eph 2:8-10). Exalting one image at the expense of others is a hell-risking blunder.","refs":["Heb 12:5","Heb 12:29","Col 3:24","Jude 4","Gal 6:17","1 Thess 1:6-8","2 Cor 11:2","Eph 5:27","Eph 2:8-10"],"target":"God as only a doting Father"},{"claim":"Zephaniah 3:17 does not mean God sings over us while we sin","detail":"Hyper-Grace worship leaders quote Zeph 3:17 to imply God sings over us even if we live in sin. But the chapter begins with 'woe' and a list of sins (3:1-4), and speaks of a time after final judgment (3:8,15), when sin is removed (3:11,13) and God lives among his people (3:15), which the author places in the New Heaven and New Earth after Revelation 19-20 and 2 Peter 3:10.","refs":["Zeph 3:17","Zeph 3:1-4","Zeph 3:8","Zeph 3:11","Zeph 3:13","Zeph 3:15","Rev 19","Rev 20","Rev 21:3","Rev 21:27","2 Pet 3:10"],"target":"Using Zephaniah 3:17 to say God rejoices over believers in sin"},{"claim":"Believers must rescue those in Hyper-Grace's grip","detail":"The author calls readers to rescue friends caught in the GRIP of Hyper-Grace before it is too late, going boldly to places where it is taught and charging people not to teach contrary doctrine (1 Tim 1:3).","refs":["1 Tim 1:3"],"target":"Passivity towards Hyper-Grace churches"}],"questions":[{"q":"'God sings over me, even when I sin!' Really?","answer":"No. Zephaniah 3:17 describes the sinless new creation after the final judgment, after a call to repent of sin in Zeph 3:1-4; it cannot be used to say God rejoices over people who live in sin."},{"q":"If God only watches Jesus and not our sin, why would Paul tell Timothy to watch his life and doctrine closely?","answer":"Because God does see and care about our day-to-day sins, and perseverance in life and doctrine is necessary to save ourselves and our hearers (1 Tim 4:16)."},{"q":"If God sees only Jesus' perfection, why didn't Jesus say to the Revelation churches, 'Rejoice! I do not see your sin'?","answer":"Because he did see their sin even after the cross and called them to repent six times."}],"criticisms":[{"of":"Hyper-Grace teachers (general)","quote":"I don't preach on repentance (turning from sin), anymore!","critique":"They redefine repentance as merely changing one's mind with no action, abandoning Jesus' and Paul's clear calls to repent."},{"of":"Hyper-Grace teachers (general)","quote":"Today, I will tell you who you are in Christ - your identity in Christ!","critique":"They incessantly preach identity while calling holiness preachers 'hypocritical legalists' or 'mixed-grace preachers' and neglecting progressive sanctification."},{"of":"Hyper-Grace teachers (general)","quote":"God, your loving father, doesn't see you in your failures and shortcomings; He sees you in Jesus' perfection and loveliness, always.","critique":"This 'Permanently Pleased Pop' image exalts one image of God at the expense of others like Master, Bridegroom and Consuming Fire."},{"of":"Hyper-Grace leaning worship leaders","quote":"God is always singing in joy over you, even if you live in sin!","critique":"They misuse Zeph 3:17, ignoring the chapter's context of repentance and the post-judgment sinless new creation."}],"illustrations":[{"title":"A half-truth is a full lie","story":"The author cites the saying that a half-truth is a full lie.","point":"Hyper-Grace's partial truth makes it wholly deceptive."},{"title":"God's two 'CFs'","story":"Hebrews 12 calls God both a Compassionate Father (v5) and a Consuming Fire (v29).","point":"We must not exalt one image of God at the expense of the other."}],"keyVerses":[{"ref":"1 Cor 5:11","text":"anyone who bears the name of brother if he is guilty of sexual immorality","use":"A sinning believer was not considered forgiven but an 'evil person'."},{"ref":"Acts 26:20","text":"performing deeds in keeping with their repentance","use":"Repentance involves action, not just a change of mind."},{"ref":"Luke 13:3","text":"unless you repent, you will all likewise perish","use":"Repent or perish in hell."},{"ref":"Rev 22:11","text":"let the holy go on being made holy","use":"Progressive sanctification."},{"ref":"1 Tim 4:16","text":"Watch your life and doctrine closely","use":"God does care about believers' daily conduct."},{"ref":"Heb 12:29","text":"our God is a consuming fire","use":"Balances God as Compassionate Father."},{"ref":"Zeph 3:17","text":"he will rejoice over you with singing","use":"Refers to the sinless new creation, not God rejoicing over sin."},{"ref":"1 Tim 1:3","text":"charge certain persons not to teach any different doctrine","use":"Go and confront Hyper-Grace teaching."}],"flow":["Hyper-Grace is a deceptive half-truth","G: future sins are not auto-forgiven","R: repentance requires turning and deeds","I: identity must not replace progressive sanctification","P: God sees sin and calls churches to repent","Zephaniah 3:17 is about the sinless new creation","Rescue people from Hyper-Grace's grip"],"outlines":null},{"num":3,"section":"Hyper-Grace","title":"A Believer's Future Sins: Are They Automatically Forgiven?","summary":"Starting from a minister's suicide and hypothetical scenarios like a believing couple's planned one-night stand or porn-watching, the author challenges the claim that a believer's future sins are automatically forgiven. He answers with the acronym S-I-N-N-E-D: the Saviour's sayings on conditional forgiveness (Matt 6:14-15), the Intimate friend John's instruction to keep confessing (1 John 1:9), and the examples of Isaiah, Jeremiah, Ezra and David, all forgiven only after confession. He then rebuts Hyper-Grace use of Hebrews 10:10 (positional versus progressive sanctification in 10:14; the warning of 10:26-27; the cleansing of 10:22) and Hebrews 7:25 (only those who keep coming). With Philip Yancey he warns that planned sin changes us and may lead to no return, citing Judas, Ananias and Sapphira, Herod and the distinction between sin that leads to death and sin that does not. He concludes that God has made the provision for forgiveness, but we must take possession of it through repentance and confession, illustrated by Jim Bakker's and Steve Smith's public confessions.","thesis":"A believer's future sins are provided for at the cross but are not automatically forgiven; forgiveness is possessed only through ongoing repentance and confession.","outline":{"acronym":"S-I-N-N-E-D","items":[{"letter":"S","label":"Saviour's Sayings","point":"Jesus said the Father will not forgive those who will not forgive others, so future forgiveness is conditional.","refs":["Matt 6:14-15"]},{"letter":"I","label":"Instructions from the Intimate Friend","point":"John taught that 'if' we keep confessing, Jesus keeps cleansing (present continuous); this was written to believers, contrary to a Singapore pastor's claim.","refs":["1 John 1:9","1 John 5:13"]},{"letter":"N","label":"Nabi's (prophet's) example: Isaiah","point":"Isaiah, a believer, was atoned for only after he confessed he was a man of unclean lips; OT saints were saved looking forward to the Lamb slain before creation.","refs":["Isa 6:3","Isa 6:5-7","Rev 13:8","Gen 15:6","Isa 53","Gal 3:8"]},{"letter":"N","label":"Another Nabi's example: Jeremiah","point":"Jeremiah called God a deceptive brook and God called him to repent; Ephraim repented after straying; forgiveness responded to repentance.","refs":["Jer 15:18-19","Jer 31:19"]},{"letter":"E","label":"Ezra's confession","point":"Ezra confessed the people's intermarriage sin and the people followed; sins were not automatically forgiven.","refs":["Ezra 9:1-15","Ezra 10:1-5"]},{"letter":"D","label":"David's example","point":"David was forgiven after confessing 'I have sinned' following Nathan's parable; Paul uses David's Psalm 32 confession for NT believers.","refs":["2 Sam 12:13","Ps 32:5","Rom 4:5-8","Rom 12:1"]}]},"claims":[{"claim":"Auto-forgiveness of future sins leads to horrendous implications","detail":"After a minister's suicide, believers claimed he would surely go to heaven because future sins are forgiven. The author argues that if this were true a believing unmarried couple could plan a one-night stand after a prayer meeting, or watch porn without any battle of conscience.","refs":[],"target":"Future sins already forgiven"},{"claim":"Jesus said unforgiving people will not be forgiven","detail":"Matt 6:14-15 says if you do not forgive others, the Father will not forgive you. If we stubbornly refuse to forgive until death, the Father could withhold his forgiveness, so future sins are not automatically forgiven.","refs":["Matt 6:14-15"],"target":"Future sins already forgiven"},{"claim":"1 John 1:9 calls believers to keep confessing to keep being cleansed","detail":"John taught that 'if' we confess, Jesus forgives and cleanses; unconfessed sins remain unforgiven. In Greek both confessing and cleansing are present continuous. The letter was written to believers (1 John 5:13), so a Singapore pastor's claim that 1:9 is not for believers is anti-biblical.","refs":["1 John 1:9","1 John 5:13"],"target":"1 John 1:9 not written for believers"},{"claim":"Isaiah was atoned for only after confessing","detail":"Isaiah, a believer, saw God's holiness and confessed he was a man of unclean lips; only then did the seraph touch his lips and declare his sin atoned (Isa 6:5-7). OT saints were saved looking forward to the Lamb slain before creation (Rev 13:8), so atonement was not automatic.","refs":["Isa 6:3","Isa 6:5-7","Rev 13:8","Gen 15:6","Isa 53","Gal 3:8"],"target":"Forgiveness without confession"},{"claim":"Jeremiah and Ephraim were restored after repenting","detail":"When Jeremiah called God a deceptive brook, God said 'If you repent, I will restore you' (Jer 15:19). Jeremiah later recorded Ephraim's repentance: 'After I strayed, I repented' (Jer 31:19). Forgiveness of the backslidden was God's response to repentance, not automatic.","refs":["Jer 15:18-19","Jer 31:19"],"target":"Forgiveness without repentance"},{"claim":"Ezra's confession shows sins were not automatically forgiven","detail":"Ezra, as leader, owned and confessed the people's sin of marrying unbelievers with a repentant heart (Ezra 9:1-15), and the people followed (Ezra 10:1-5). Their sins were not automatically forgiven.","refs":["Ezra 9:1-15","Ezra 10:1-5"],"target":"Forgiveness without confession"},{"claim":"David was forgiven after confession, and Paul applies it to us","detail":"After Nathan's parable David confessed 'I have sinned' and was immediately forgiven (2 Sam 12:13; Ps 32:5). Paul uses Psalm 32 to show NT believers can be forgiven by confession without 'works', which in context means animal sacrifices (Rom 4:5-8; Rom 12:1).","refs":["2 Sam 12:13","Ps 32:5","Rom 4:5-8","Rom 12:1"],"target":"Forgiveness without confession"},{"claim":"Hebrews 10:10 is positional; 10:14 shows progressive sanctification","detail":"Hyper-Grace uses Heb 10:10 ('sanctified once for all') to say we are forgiven forever. But Heb 10:14 says he perfected 'those being sanctified', present continuous, i.e. progressive sanctification. So 'forgiven forever' applies only to those who keep taking part in the purifying process (MSG), and the point is that Christ's sacrifice is unrepeatable, not that future sins are auto-forgiven.","refs":["Heb 10:10","Heb 10:14"],"target":"Heb 10:10 proves future sins forgiven"},{"claim":"Hebrews 10:26-27: deliberate sin leads to fiery judgment","detail":"Right after 10:10 the writer warns that if we go on sinning deliberately after receiving the truth, no sacrifice remains, only a fearful expectation of judgment and a fury of fire. Deliberate unrepented sin by a believer will not be forgiven but will get them 'fried' in eternal hell.","refs":["Heb 10:26-27","Heb 10:31"],"target":"Deliberate sin is covered automatically"},{"claim":"Hebrews 10:22: like the high priest, cleanse before approaching God","detail":"Heb 10:19,22 tells us to have hearts sprinkled clean from an evil conscience before entering God's presence. As the high priest sacrificed for his own sin first (Lev 16:3-4), believers must ask for cleansing through Jesus' blood; Aaron's sons died entering improperly (Lev 10:1-2), and Ananias and Sapphira died, so deliberate unconfessed sin risks death and hell.","refs":["Heb 10:19","Heb 10:22","Lev 16:3-4","Lev 10:1-2","Acts 5:1-9","Heb 10:31"],"target":"Approaching God without cleansing"},{"claim":"Hebrews 7:25 saves only those who keep coming to God","detail":"Heb 7:25 says Christ saves 'those who come to God through him'. 'Come' means continually approaching (the OJB uses 'approaching'), so only those who keep short accounts, repent immediately and pursue holiness are forever saved; otherwise the writer would not say 'without holiness no one will see the Lord' (Heb 12:14).","refs":["Heb 7:25","Heb 12:14"],"target":"Heb 7:25 proves eternal forgiveness"},{"claim":"Planned sin changes us and may lead to no return, like Judas","detail":"Quoting Philip Yancey, the author says God can forgive the planned sin, but the act of rebellion changes us and there is no guarantee we will come back. Judas may have planned to return after betrayal but never did; it was a 'sin leading to death' (1 John 5:17), and he was hell-bound (John 17:12).","refs":["John 13:27","1 John 5:16-17","Rev 20:14","Rev 21:8","John 17:12"],"target":"Planning sin assuming automatic forgiveness"},{"claim":"God may strike down people in the act of sin, even post-cross","detail":"Israel's young men died with sinful food in their mouths (Ps 78:30-31). Ananias and Sapphira died in planned deception despite Jesus' intercession, after many chances (Acts 5:1-9), and Herod was struck down (Acts 12:21-23). Even a natural death in stubborn sin is catastrophic, since there is no salvation after death (Heb 9:27).","refs":["Ps 78:30-31","Acts 5:1-9","Heb 7:25","Acts 12:21-23","Heb 9:27"],"target":"No danger in deliberate sin for believers"},{"claim":"Sin not leading to death versus sin leading to death","detail":"When we sin, it is God's mercy we are not consumed (Lam 3:22), and we must immediately repent and confess (1 John 1:9); this is 'sin not leading to death'. But lazing in deliberate sin, and dying in it, can become 'sin leading to death', i.e. second death in hell (1 John 5:16; Rev 21:8).","refs":["Lam 3:22","1 John 1:9","1 John 3:9","1 John 5:16-17","Rev 21:8"],"target":"All sin is equally covered"},{"claim":"Those using grace as license are 'already condemned' (Jude 4)","detail":"Those who stubbornly say future sins need no confession are on their way to hell, as Jude 4 shows: grace is used like a credit card for sensuality, and such people are 'already condemned'. Yet if they change their opinion God would forgive them.","refs":["Jude 4"],"target":"Grace used as license for sexual sin"},{"claim":"Provision is made at the cross, but possession requires confession","detail":"Proverbs 28:13 says whoever confesses and forsakes sins obtains mercy. God has made the PROVISION for forgiveness of future sins, but we must take POSSESSION of it through genuine repentance, confession and asking the blood to cleanse us.","refs":["Prov 28:13"],"target":"Automatic possession of forgiveness"}],"questions":[{"q":"Even though he committed suicide, would he definitely go to heaven because a believer's future sins are forgiven?","answer":"The author rejects this reasoning as horrendous, implying that future sins are not automatically forgiven and that such deaths cannot be assumed to end in heaven."},{"q":"Is it true and biblical that a believer's future sins are forgiven the moment they commit them?","answer":"No. S-I-N-N-E-D shows that forgiveness depends on confession and repentance; Christ provided it, but it is not automatic."},{"q":"Will God forgive the sins that I am planning to commit?","answer":"Quoting Philip Yancey: of course he can, but the act of rebellion changes you and there is no guarantee you will come back or want forgiveness later."},{"q":"What if we die suddenly, while in stubborn sin?","answer":"We may be doomed to hell automatically, as with Israel's young men, Ananias and Sapphira, and Herod, because there is no salvation after death (Heb 9:27)."},{"q":"Did Jesus' intercession fail for Ananias and Sapphira?","answer":"Jesus was praying for them (Heb 7:25), but he will not violate free will; after many chances God finished them off when they planned to deceive."}],"criticisms":[{"of":"Hyper-Grace false Gospel teachers (general)","quote":"A believer's future sins are forgiven.","critique":"They constantly claim future sins are forgiven the moment they are committed, which the S-I-N-N-E-D texts refute and which leads to horrendous implications."},{"of":"a Singapore Hyper-Grace megachurch pastor (anonymised)","quote":"","critique":"He says the confession-of-sin call of 1 John 1:9 was not written for believers; the author calls this anti-biblical because 1 John 5:13 shows the letter i
