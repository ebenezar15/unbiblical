<script>
window.MODE = "book";
window.DATA = {"chapters":[{"num":7,"section":"Hyper-Grace","title":"The Hyderabad Disha Rapists' Punishment and Its Connection to a Hyper-Grace Cult's Claim","summary":"The author opens with the 2019 Hyderabad rape-murder of a young veterinarian (called 'Disha'), whose four accused were killed by police days later in a widely celebrated 'encounter'. He uses it to stress again that God's judgment does not stop after the Cross. Hell is a far greater punishment than a police encounter for unrepentant Christ-rejecters, and Jesus warned that believers who persist in 'raping-in-the-mind' (lust, Matt 5:28-29), such as choosing OTT shows for their obscenity, face the same punishment. Quoting Heb 12:25, he argues New Covenant believers will be judged more severely than those under Moses. Punishment is cancelled only for those who keep abiding in Christ (Rom 8:1; John 15). Otherwise it is 'stored up' (Rom 2:4-5) for Judgment Day (Rev 20:15) or sometimes carried out earlier, as with Ananias and Sapphira, Herod, careless communion-takers and Jezebel.","thesis":"God's punishment did not end at the Cross: unrepentant sin, including a believer's persistent lust, stores up wrath that will be executed at judgment or even before it.","outline":{"acronym":"OTT","items":[{"letter":"O","label":"Obscenity","point":"Believers who choose streaming shows for obscene content are feeding lust, which Jesus treats as adultery of the heart.","refs":["Matt 5:28-29"]},{"letter":"T","label":"Titillation","point":"Watching for sexual titillation is 'raping-in-the-mind', a sin that brings the same hell-punishment if persisted in.","refs":["Matt 5:28-29"]},{"letter":"T","label":"Topless bits","point":"Picking shows for nudity shows lust driving choices; the call is self-reflection and repentance.","refs":["Heb 12:25"]}]},"claims":[{"claim":"Hell is far worse than the swift police 'justice' given to the rapists","detail":"The rapists of the Disha case were reportedly shot four days after the crime, and many celebrated it as swift justice. The author argues that hell, the punishment for stubbornly unrepentant Christ-rejecters, is much more severe than any police encounter.","refs":["Rev 20:15"],"target":"The idea that judgment has ended since the Cross"},{"claim":"Believers persisting in lust face the same punishment as the rapists","detail":"Jesus said lust is adultery in the heart and warned that it is better to lose an eye than for the whole body to go to hell (Matt 5:28-29). So believers who stubbornly indulge 'mental rape', for example by picking OTT shows for obscenity, titillation and nudity, are headed for the same hell as the rapists.","refs":["Matt 5:28-29"],"target":"Believers' sins carry no eternal consequence"},{"claim":"New Covenant believers will be punished more severely than Old Covenant Israel","detail":"Citing Heb 12:25 (NLT), the author says that if Israel did not escape when they refused Moses, we will certainly not escape if we reject the One who speaks from heaven. This should lead to self-reflection and repentance, and it refutes the claim that punishment stopped at the Cross.","refs":["Heb 12:25"],"target":"Punishment stopped under the New Covenant"},{"claim":"No condemnation applies only to those who continually abide in Christ","detail":"Rom 8:1 and John 15 show that punishment is lifted only for those who continuously remain in Christ. Those who do not abide are not exempt.","refs":["Rom 8:1","John 15:1-6"],"target":"Unconditional no-condemnation for all believers"},{"claim":"Punishment is being stored up for the Day of Judgment","detail":"Rom 2:4-5 speaks of storing up wrath for the day of wrath. The author says punishment is stored for execution on Judgment Day (Rev 20:15), or before it if God chooses.","refs":["Rom 2:4-5","Rev 20:15"],"target":"No future judgment for believers"},{"claim":"God sometimes executes punishment before Judgment Day","detail":"God in his sovereignty punished people before the final day: Ananias and Sapphira (Acts 5), Herod (Acts 12), careless communion-takers (1 Cor 11) and Jezebel and her companions (Rev 2).","refs":["Acts 5:1-11","Acts 12:23","1 Cor 11:29-32","Rev 2:20-23"],"target":"God never judges believers in this age"}],"questions":[{"q":"Are you enjoying OTT shows for their obscenity, titillation and topless bits?","answer":"If lust drives our entertainment choices, we are committing 'raping-in-the-mind', which Jesus warned leads to hell. We must repent."},{"q":"Did you know that New Covenant believers will be punished more severely than those under the law of Moses?","answer":"Yes. Heb 12:25 says that if Israel did not escape when they rejected Moses, we will certainly not escape if we reject the One speaking from heaven."},{"q":"Stored punishment? Can God punish before the Day of Judgment?","answer":"Yes. God stores up wrath (Rom 2:4-5) for the final day, but he may act earlier, as in Acts 5, Acts 12, 1 Cor 11 and Rev 2."}],"criticisms":[{"of":"Hyper-Grace teachers generally","quote":"","critique":"They teach that under the New Covenant punishment has stopped altogether because of the Cross. The author says Hebrews and Romans show judgment continues for the unrepentant."}],"illustrations":[{"title":"The Disha rape-murder and police encounter","story":"In November 2019 a 26-year-old vet in Hyderabad was lured by truck workers who had deliberately punctured her tyre, then raped, smothered and burned. On December 6 police shot the four accused dead, and many celebrated it as 'swift justice'.","point":"Hell is a far greater punishment than any human justice, and believers who persist in lust face the same judgment."},{"title":"OTT acronym","story":"Streaming platforms like Amazon Prime, Netflix and Hotstar carry shows chosen for 'O' obscenity, 'T' titillation and 'T' topless bits.","point":"Choosing entertainment driven by lust is mental adultery that calls for repentance."}],"keyVerses":[{"ref":"Matt 5:28-29","text":"Anyone who looks at a woman lustfully has already committed adultery with her in his heart","use":"Lust is 'raping-in-the-mind' and leads to hell if persisted in"},{"ref":"Heb 12:25","text":"We will certainly not escape if we reject the One who speaks to us from heaven","use":"New Covenant believers face more severe judgment"},{"ref":"Rom 8:1","text":"There is now no condemnation for those who are in Christ Jesus","use":"No condemnation only for those who keep abiding"},{"ref":"Rom 2:4-5","text":"You are storing up wrath for yourself on the day of wrath","use":"Punishment is stored for later execution"},{"ref":"Rev 20:15","text":"Anyone not found written in the book of life was thrown into the lake of fire","use":"Stored punishment executed on Judgment Day"}],"flow":["Disha case: rapists killed in swift police encounter","Hell is a far greater punishment than that","Jesus: persistent lust leads to the same hell","Heb 12:25: New Covenant judgment is more severe","No condemnation only for those abiding in Christ","Wrath is stored for Judgment Day or earlier","Examples: Ananias, Herod, Corinth, Jezebel"]},{"num":8,"section":"Hyper-Grace","title":"Should We Repent from Preaching on Repentance as Hyper-Grace Preachers Want Us To?","summary":"The author answers a New Zealand-based Hyper-Grace blogger who wrote an article giving three reasons why he does not preach repentance. He tells of a 2012 national Pentecostal youth conference: he preached from Proverbs 7 and 1,700 youth responded to his altar call, then a later speaker said believers need not repent because of 2 Cor 5:21 and that the Spirit does not convict believers. The author answers that 2 Corinthians itself calls believers to repent (2 Cor 7:10; 12:21; 6:1). James 4:4 shows the Spirit convicts worldly believers, five of the seven churches in Revelation were told to repent, and Jesus, Philip and Paul combined grace with calls to repent. The incestuous man of 1 Cor 5 was called 'evil', excommunicated, repented, and was restored (2 Cor 2:5-8). The author also argues Hyper-Grace is self-defeating, since its followers call him to repent of attacking it. He closes with approving quotes from Billy Graham on repentance, hell and sin.","thesis":"Repentance must keep being preached to believers, because Scripture repeatedly calls the righteous in Christ to turn from sin, and the Holy Spirit does convict them.","outline":null,"claims":[{"claim":"2 Cor 5:21 does not cancel calls to repent in the same letter","detail":"The same letter that calls believers 'the righteousness of God' demands godly sorrow leading to repentance (2 Cor 7:10) and grieves over unrepentant sexual sin (2 Cor 12:21). Read with 2 Cor 6:1, the message is that God's grace must enable believers to overcome sin, or they have received grace in vain.","refs":["2 Cor 5:21","2 Cor 6:1","2 Cor 7:10","2 Cor 12:21"],"target":"No repentance needed because believers are always righteous"},{"claim":"The Holy Spirit does convict believers of sin","detail":"John 16:8 says the Spirit convicts the world, but that does not mean he does not convict believers. James, written to believers, calls the worldly 'adulterous people' and enemies of God (Jas 4:4), so the Spirit convicts worldly believers.","refs":["John 16:8","Jas 4:4"],"target":"The Spirit never convicts believers of sin"},{"claim":"Jesus told five of seven churches in Revelation to repent","detail":"Jesus called Ephesus, Pergamum, Thyatira, Sardis and Laodicea to repent (Rev 2:5,16,21-22; 3:3,19). So grace must be preached along with repentance.","refs":["Rev 2:5","Rev 2:16","Rev 2:21-22","Rev 3:3","Rev 3:19"],"target":"No repentance preaching to churches"},{"claim":"Jesus combined grace and a call to repent in John 5","detail":"Jesus healed the man invalid for 38 years and later told him to stop sinning or something worse might happen (John 5:14). In one chapter he showed grace and called for repentance, and so must we.","refs":["John 5:5-9","John 5:14"],"target":"Grace without a call to holiness"},{"claim":"Philip preached grace and called Simon the Sorcerer to repent","detail":"Philip preached the good news to Simon (Acts 8:12), yet when Simon tried to buy God's gift he was told to repent (Acts 8:21-23). The early church preached both.","refs":["Acts 8:12","Acts 8:21-23"],"target":"Grace preaching that never calls for repentance"},{"claim":"Paul called the incestuous Corinthian an 'evil person', not righteous","detail":"The Corinthians were arrogant about a man sleeping with his (step)mother. Paul called him evil (1 Cor 5:13) and ordered him excommunicated so that he might be saved in the day of the Lord (1 Cor 5:5). If Paul were Hyper-Grace he would have called him righteous.","refs":["1 Cor 5:1-2","1 Cor 5:5-6","1 Cor 5:13"],"target":"Sinning believers still called righteous"},{"claim":"The disciplined man repented and was restored (2 Cor 2:5-8)","detail":"Following scholars, the author identifies the man in 2 Cor 2 with the man of 1 Cor 5. He repented through 'godly grief' (2 Cor 7:10), but 'hyper-discipline' folk would not receive him, so Paul urged forgiveness, comfort and reaffirmed love. He was therefore saved.","refs":["2 Cor 2:5-8","2 Cor 7:10"],"target":"Repentance is unnecessary for believers"},{"claim":"Hyper-Grace is philosophically self-defeating","detail":"Hyper-Grace proponents say there is no need to preach repentance since God sees believers as righteous, yet they comment on the author's social media urging him to repent of attacking Hyper-Grace. By calling him to change, they contradict their own claim that he remains God's righteousness no matter what.","refs":["2 Cor 5:21"],"target":"Hyper-Grace's 'no need to repent' stance"},{"claim":"Preachers like Billy Graham boldly preached repentance and hell","detail":"The author admires Billy Graham, who did not water down the gospel. He quotes Graham: repent immediately when you fail, since sin breaks fellowship; no one spoke about hell more than Jesus; Gal 5:19-21 is the most serious warning to those who sin that grace may abound; take sin seriously and fight its power.","refs":["Gal 5:19-21"],"target":"Pulpits silent on repentance and hell"}],"questions":[{"q":"Should we repent from preaching on repentance, as Hyper-Grace preachers want us to?","answer":"Of course not. The Bible repeatedly calls believers to repent, and the incestuous Corinthian shows repentance leads to salvation."},{"q":"Does not the Holy Spirit convict believers of sin?","answer":"He does. James 4:4 rebukes worldly believers, so the Spirit convicts believers who become worldly."}],"criticisms":[{"of":"A New Zealand-based Hyper-Grace blogger (author of five pro-Hyper-Grace books, on a 'top 100 Christian blogs' list)","quote":"Three Reasons Why I Don't Preach On Repentance ('Turn from Sin')","critique":"The author calls this totally anti-biblical, since Scripture repeatedly calls believers to repent."},{"of":"An American preacher of Indian origin at a 2012 national Pentecostal youth conference","quote":"There is no need to repent because according to 2 Corinthians 5:21 all believers are always the righteousness of God; the Holy Spirit does not convict believers of sin.","critique":"After 1,700 youth had responded to an altar call, he effectively told them repentance was unnecessary, 'poisoning' them with 'hell-populating poison'. This incident motivated the author to write the book."},{"of":"Hyper-Grace proponents commenting on the author's social media","quote":"","critique":"They urge him to repent of attacking Hyper-Grace, contradicting their own 'always righteous' philosophy."},{"of":"Modern pulpits generally","quote":"","critique":"Pulpits rarely mention 'repent' or 'hell' any more."}],"illustrations":[{"title":"The 2012 national youth conference","story":"The author preached from Proverbs 7 on the young man and the married seductress, and youth came forward confessing sins. That evening another preacher told them that repentance was unnecessary.","point":"Hyper-Grace undermines genuine repentance, and this incident drove the author to write the book."},{"title":"The man who slept with his mother","story":"The Corinthian church boasted about a man living with his stepmother. Paul ordered him excommunicated, and the man later repented and was restored.","point":"Discipline aims at repentance and salvation, and sinning believers are not called 'righteous'."},{"title":"Hyper-Discipline","story":"Some in Corinth would not receive back the repentant man, and Paul had to urge forgiveness and comfort.","point":"Repentance must be met with restoration and love."},{"title":"Social-media critics","story":"Hyper-Grace followers comment urging the author to stop attacking Hyper-Grace.","point":"They preach repentance to him, contradicting their own theology."},{"title":"Billy Graham's photo in a hostel room","story":"The author kept Billy Graham's picture in his engineering college hostel in the 1990s and still draws inspiration from him.","point":"A great evangelist preached repentance and hell without watering down the gospel."}],"keyVerses":[{"ref":"2 Cor 6:1","text":"We urge you not to receive God's grace in vain","use":"Read with 5:21: the righteous must use grace to overcome sin"},{"ref":"2 Cor 7:10","text":"Godly sorrow brings repentance that leads to salvation","use":"Repentance is required of believers"},{"ref":"2 Cor 12:21","text":"Many who have sinned earlier and have not repented of the impurity","use":"Paul grieved over unrepentant believers"},{"ref":"Jas 4:4","text":"You adulterous people... friendship with the world means enmity against God","use":"The Spirit convicts worldly believers"},{"ref":"John 5:14","text":"Stop sinning or something worse may happen to you","use":"Jesus joined grace with a call to repent"},{"ref":"1 Cor 5:13","text":"Expel the wicked person from among you","use":"Sinning believers are called evil, not righteous"},{"ref":"2 Cor 2:5-8","text":"Turn to forgive and comfort him... reaffirm your love for him","use":"The repentant man was restored and saved"},{"ref":"Gal 5:19-21","text":"Those who practise such things shall not inherit the kingdom of God","use":"Serious warning to those who sin that grace may abound"}],"flow":["Blogger refuses to preach repentance","Youth conference: preacher cancels repentance call","2 Cor 5:21 must be read with 6:1, 7:10, 12:21","Spirit convicts worldly believers (Jas 4:4)","Jesus and apostles combined grace with repentance","Corinthian sinner called evil, disciplined, repented, restored","Hyper-Grace contradicts itself by calling author to repent","Billy Graham quotes affirm repentance and hell"]},{"num":9,"section":"Hyper-Grace","title":"The Famous Bishop and the Candlesticks Story and the Flawed Hyper-Grace False Teaching","summary":"The author retells 'The Bishop's Candlesticks': a generous bishop takes in a hardened convict, who then steals his treasured silver candlesticks. When police bring the man back, the bishop says he gave them freely, adds them as a gift, blesses him and helps him escape, and the convict is reformed. The author says this story shows true biblical grace against Hyper-Grace. Because Jesus took our punishment, gratitude makes us turn from sin daily, and grace teaches us to say no to ungodliness (Titus 2:12). Habitual sin shows a lack of gratitude for the Cross and marks a person as one who will not 'endure to the end' and so will not be saved (Matt 24:13).","thesis":"True grace, like the bishop's mercy to the convict, produces grateful transformation, and those who keep living in sin show they do not value the Cross and will not be saved.","outline":null,"claims":[{"claim":"The Bishop's Candlesticks illustrates true grace, not Hyper-Grace","detail":"The bishop's undeserved mercy toward the convict reformed him. Likewise the Cross, where Jesus took our punishment, moves the grateful believer to turn away from sin day by day.","refs":["Titus 2:12"],"target":"Grace that does not transform"},{"claim":"Gratitude for the Cross leads to daily turning from sin","detail":"Because Jesus took our punishment, we turn away from sin out of genuine gratitude day by day. Grace, symbolised by the Cross, teaches us to say no to ungodliness and worldly passions.","refs":["Titus 2:11-12"],"target":"Grace as licence"},{"claim":"Habitual sin shows ingratitude and failure to endure, so no salvation","detail":"Living in habitual sin shows we are not truly grateful for the Cross and that we are among those who do not endure to the end. Jesus said such people will not be saved (Matt 24:13), and Hyper-Grace teachers who say otherwise are leading people to a shock on Judgment Day.","refs":["Matt 24:13"],"target":"Eternal security regardless of lifestyle"}],"questions":[{"q":"If we live in habitual sin, are we truly grateful for the Cross?","answer":"No. Habitual sin shows a lack of gratitude and puts us among those who will not endure and will not be saved."}],"criticisms":[{"of":"Hyper-Grace teachers generally","quote":"","critique":"They tell people that those living in habitual sin will still be saved, and their followers will be shocked on the Final Judgment Day."}],"illustrations":[{"title":"The Bishop and the Candlesticks","story":"A kind bishop feeds and shelters a rough convict who steals his mother's silver candlesticks. When police bring him back, the bishop says they were a gift, gives them to him, blesses him and shows him a way to Paris, and the convict is reformed.","point":"True grace leads the grateful recipient to turn from his old sinful ways."}],"keyVerses":[{"ref":"Titus 2:12","text":"It teaches us to say 'No' to ungodliness and worldly passions","use":"Grace transforms and empowers us to reject sin"},{"ref":"Matt 24:13","text":"The one who endures to the end will be saved","use":"Those in habitual sin do not endure and will not be saved"}],"flow":["Story: bishop shows grace to a convict","Grace reforms the convict","Christ took our punishment on the Cross","Gratitude leads to daily turning from sin","Grace teaches us to say no (Titus 2:12)","Habitual sin shows ingratitude, failure to endure"]},{"num":10,"section":"Hyper-Grace","title":"When Pakistan Beat India in an ICC World Cup Game Finally and What It's Got to Do with the Hyper-Grace False Teaching","summary":"The author recalls Pakistan's first-ever World Cup win over India (T20 World Cup, Dubai, 24 October 2021), which MS Dhoni had predicted would come someday, since 'you win some and you lose some'. Similarly, the Bible does not say believers will win over sin every time (2 Chron 6:36; Prov 20:9; Eccl 7:20; 1 John 1:8; Jas 3:2). This does not permit deliberately planning sin, remaining in sin or making sin a habit (Rom 6:1,15; Titus 2:11-12; 1 John 3:6; 5:18). Grace is not a licence for immorality (Jude 4).","thesis":"Believers will sometimes fail, but this truth may never be twisted into permission to plan, remain in or habitually practise sin.","outline":null,"claims":[{"claim":"Scripture admits believers will not win over sin every time","detail":"Like a cricket team that wins some and loses some, believers will stumble. 'There is no one who does not sin' (2 Chron 6:36); no one can claim a pure heart (Prov 20:9); there is no righteous man who never sins (Eccl 7:20); claiming sinlessness is self-deception (1 John 1:8); we all stumble in many ways (Jas 3:2).","refs":["2 Chron 6:36","Prov 20:9","Eccl 7:20","1 John 1:8","Jas 3:2"],"target":"Sinless perfection or despair over failure"},{"claim":"Our failures do not permit planning sin, remaining in it or making it a habit","detail":"No Bible teaching can be subtly twisted to allow deliberately planning sin, choosing to remain in sin or making sin a habit (Rom 6:1,15; Titus 2:11-12; 1 John 3:6; 5:18).","refs":["Rom 6:1","Rom 6:15","Titus 2:11-12","1 John 3:6","1 John 5:18"],"target":"Grace used to excuse deliberate sin"},{"claim":"Grace is not a licence for immoral living","detail":"Jude 4 warns against those who turn the grace of God into a licence for immorality.","refs":["Jude 4"],"target":"Antinomian use of grace"}],"questions":[{"q":"Does the Bible indicate the believer will win over sin every single time?","answer":"No. Scripture says all stumble, but this cannot be used to plan sin or remain in it."}],"criticisms":[{"of":"Cultic Hyper-Grace teaching (generally)","quote":"","critique":"It twists biblical admissions of human weakness into permission to deliberately plan sin, remain in it or make it a habit."}],"illustrations":[{"title":"Pakistan beat India in a World Cup","story":"After 12 straight World Cup losses, Pakistan beat India in the 2021 T20 World Cup in Dubai. MS Dhoni had predicted it, saying you win some and lose some.","point":"Believers too will not win over sin every time, but that is no excuse to plan sin."}],"keyVerses":[{"ref":"Eccl 7:20","text":"There is no righteous man on earth who does good and never sins","use":"Believers will sometimes fail"},{"ref":"1 John 1:8","text":"If we claim to be without sin, we deceive ourselves","use":"No sinless perfection"},{"ref":"Jas 3:2","text":"We all stumble in many ways","use":"Universal stumbling"},{"ref":"Rom 6:1","text":"Shall we go on sinning so that grace may increase?","use":"No licence to remain in sin"},{"ref":"Jude 4","text":"Change the grace of our God into a licence for immorality","use":"Grace is not licence"}],"flow":["Pakistan finally beats India; you win some, lose some","Believers too will not beat sin every time","Many verses admit universal stumbling","But no planning sin or remaining in it","Grace is not a licence (Jude 4)"]},{"num":11,"section":"Hyper-Grace","title":"The Oft-Repeated Movie Dialogue 'All Is Well' and Hyper-Grace Theology","summary":"Hyper-Grace teachers repeat 1 John 4:17 ('as He is, so are we in this world') the way iconic dialogues are repeated in films like '3 Idiots' and 'DDLJ'. They use it to claim God sees sinning believers as he sees Christ, so they can never be condemned. The author quotes a Singapore megachurch pastor's devotional saying God does not judge us by today's performance and believers need not fear judgment. After setting the context of 1 John (a letter answering proto-gnostics who denied the reality of sin), he gives five reasons the interpretation is wrong. These are the Parousia reason (1 John 3:2-3), the plural-pronoun 'we' reason (1 John 1:6; 2:3,28; 3:12,24; 5:18), the 'perfect' reason (love is perfected by keeping his word, 1 John 2:5), the present-continuous tense reason, and the 'pack' reason. The last covers John's Gospel (Judas, John 15:6), 2 John 8-9, 3 John 11 and Revelation (2:11; 21:27; 22:15). He concludes that 'as He is, so are we' refers to those who abide, overcome and persist.","thesis":"1 John 4:17 does not mean God ignores believers' sin; read in the context of all John's writings, it describes believers who continually abide in Christ and reject sin.","outline":{"acronym":"5 P's","items":[{"letter":"P","label":"The Parousia Reason","point":"We are not yet fully like Christ; we will be when he appears, so those with this hope purify themselves now. This is 'already but not yet'.","refs":["1 John 3:2","1 John 3:3"]},{"letter":"P","label":"The Plural Personal Pronoun Reason","point":"Every 'we' in 1 John calls for obedience: walking in light, keeping commands, abiding to avoid shame at his coming, not being like Cain, and not continuing in sin.","refs":["1 John 1:6","1 John 2:3","1 John 2:28","1 John 3:12","1 John 3:24","1 John 5:18"]},{"letter":"P","label":"The 'Perfect' Reason","point":"Boldness in judgment comes from perfected love, and love is perfected in whoever keeps his word, not in those who 'kick' the commands.","refs":["1 John 4:16-17","1 John 2:5"]},{"letter":"P","label":"The Present-Continuous Tense Reason","point":"John's present tenses (goes on believing, is having the Son) show that faith and abiding must continue; the 'if' of 1 John 2:24 refutes once-saved-always-saved.","refs":["1 John 5:5","1 John 5:11-12","1 John 2:24","1 John 4:2"]},{"letter":"P","label":"The 'Pack' Reason","point":"All of John's writings (Gospel, 2 John, 3 John, Revelation) demand continual abiding and overcoming as a condition for heaven.","refs":["John 17:12","John 15:6","2 John 8-9","3 John 11","Rev 2:11","Rev 21:27","Rev 22:15"]}]},"claims":[{"claim":"Hyper-Grace misuses 1 John 4:17 to say God never condemns sinning believers","detail":"Hyper-Grace teachers say that because 'as He is, so are we', God sees believers as he sees Christ no matter how much they sin. As he would never condemn Christ, he will never condemn them, and they need not fear judgment.","refs":["1 John 4:17"],"target":"Believers immune from judgment whatever their conduct"},{"claim":"1 John was written against proto-gnostics who denied the reality of sin","detail":"Drawing on a New Testament scholar, the author says John wrote to congregations shaken by false teachers (possibly proto-gnostics who said bodily sin did not matter) who denied the reality of sin (1:8,10) and claimed special knowledge (2:20,27). These teachers had left (2:19), and John wrote to reassure believers (5:13).","refs":["1 John 1:8","1 John 1:10","1 John 2:19","1 John 2:20","1 John 2:27","1 John 5:13"],"target":"Context-free reading of 1 John 4:17"},{"claim":"Parousia reason: we are not yet fully like Christ until he appears","detail":"1 John 3:2 says we will be like him when he appears, so we are 'already' but 'not yet' like him. 1 John 3:3 calls those with this hope to purify themselves. So 1 John 4:17 does not open a window to live in sin.","refs":["1 John 3:2","1 John 3:3"],"target":"Present full likeness excusing sin"},{"claim":"Plural pronoun reason: every 'we' in 1 John demands obedience","detail":"The 'we' of 4:17 must agree with the other 'we' passages: claiming fellowship while walking in darkness is a lie (1:6), we know him if we keep his commands (2:3), whoever keeps his commands abides (3:24, cf. John 14:15,21), and so on.","refs":["1 John 1:6","1 John 2:3","1 John 3:24","John 14:15","John 14:21"],"target":"Righteousness disconnected from obedience"},{"claim":"Without abiding, believers will shrink in shame at Christ's coming","detail":"1 John 2:28 calls us to abide so that we may have confidence and not shrink in shame at his coming. If we keep sinning, he reserves the right to abandon us when he returns.","refs":["1 John 2:28"],"target":"No accountability at Christ's return"},{"claim":"'Don't be like Cain' shows righteousness involves turning from sin","detail":"1 John 3:12 says we should not be like Cain, who murdered his brother. If righteousness had nothing to do with sin, such examples would be needless, so Hyper-Grace is unbiblical.","refs":["1 John 3:12"],"target":"Righteousness unrelated to conduct"},{"claim":"1 John 5:18: the one born of God does not keep on sinning","detail":"The climax of the 'we' passages is 1 John 5:18: whoever is born of God does not keep on sinning (does not make a practice of it). This flatly rejects the idea that sin does not matter to God.","refs":["1 John 5:18"],"target":"Sin doesn't matter to God"},{"claim":"Love is perfected in those who keep his word (1 John 2:5)","detail":"Boldness on Judgment Day comes from perfected love (4:17), and 2:5 says love is perfected in whoever keeps his word. So the boldness belongs to obedient abiders, not to those who keep 'kicking' the commands.","refs":["1 John 4:17","1 John 2:5","1 John 4:16"],"target":"Boldness in judgment for wilful sinners"},{"claim":"John's present-continuous tenses demand continual faith and abiding","detail":"Quoting a British Bible teacher, the author argues that John's present tenses ('goes on overcoming', 'goes on believing', 'is having the Son', 1 John 5:5,11-12) and the 'if' of 2:24 show that initial faith is not enough and must continue throughout life, refuting 'once saved, always saved'. Another scholar notes that 4:2's 'has come in the flesh' answers Gnostics.","refs":["1 John 5:5","1 John 5:11-12","1 John 2:24","1 John 4:2"],"target":"Once saved, always saved"},{"claim":"Hyper-Grace teachers mirror the Gnostics' denial","detail":"Gnostics denied Christ's continuing incarnation, while Hyper-Grace teachers deny the need for daily abiding, continual faith and steady rejection of besetting sin.","refs":["1 John 4:2"],"target":"Hyper-Grace as modern Gnosticism"},{"claim":"John's Gospel: Judas was lost; unfruitful branches are burned","detail":"Judas, whose name was written in heaven (Luke 10:20), was lost (John 17:12). Branches that do not abide are cut off and thrown into the fire, symbolising loss of salvation and hell (John 15:6).","refs":["Luke 10:20","John 17:12","John 15:6"],"target":"Impossibility of losing salvation"},{"claim":"2 John 8-9: not abiding means losing God, not just rewards","detail":"2 John 8-9 warns not to lose what was worked for, and says whoever does not abide in Christ's teaching does not have God. The corollary is that non-abiders do not have the Father and the Son and are on the wide road to hell.","refs":["2 John 8","2 John 9"],"target":"Only rewards are at stake"},{"claim":"3 John 11: one who does evil has not seen God","detail":"Diotrephes, who loved pre-eminence and rejected others, is the evil one not to be imitated. Whoever does evil has not seen God. So whoever lives stubbornly in sin is not even a believer.","refs":["3 John 9-11"],"target":"Sin-condoning grace"},{"claim":"Revelation: only overcomers escape the second death","detail":"Revelation calls believers to endure (3:10) and overcome (2:11). The corollary of 2:11 is that non-overcomers will be hurt by the second death, which is hell (20:14; 21:8). Those who love and practise falsehood and keep doing what is shameful will be excluded (21:27; 22:15).","refs":["Rev 3:10","Rev 2:11","Rev 20:14","Rev 21:8","Rev 21:27","Rev 22:15"],"target":"No danger for unrepentant believers"},{"claim":"'As He is, so are we' means as abiding, overcoming, persisting believers","detail":"Read in the light of all John's writings, 1 John 4:17 means: as He is, so are we, those who are abiding, overcoming and persisting. The author closes with a devotional definition of abiding: making Christ our supreme object, centre and circumference, our all in all.","refs":["1 John 4:17"],"target":"Unconditional reading of 1 John 4:17"}],"questions":[{"q":"How do we respond to the claim that God judges by Jesus, not by our daily performance?","answer":"By reading 1 John 4:17 in context: five reasons show it does not excuse sin."},{"q":"Is 1 John 4:17 in effect saying 'our sins don't matter to God'?","answer":"No. Unless John taught that elsewhere in the letter, which he does not, the verse cannot mean it; 1 John 5:18 flatly rejects it."},{"q":"Would you be ashamed on the day of Jesus' return?","answer":"If we do not abide and keep shamelessly sinning, we will be ashamed and he may abandon us."},{"q":"How is 'love perfected' so that we may have boldness in the Day of Judgment?","answer":"By keeping his word (1 John 2:5); those who keep 'kicking' the commands do not have perfected love."}],"criticisms":[{"of":"A Singapore megachurch pastor (in a devotional book)","quote":"It is wonderful to know that God does not measure and judge you based on your performance today. Instead, he looks at Jesus, and as Jesus is, that is how He sees you... As new covenant believers we do not have to fear the day of judgement... because as he is, so are we in this world!","critique":"The author calls this a cultic, sin-excusing twist of 1 John 4:17 and refutes it with five reasons from the context of John's writings."},{"of":"Hyper-Grace proponents generally","quote":"","critique":"They repeat 'As He is, so are we in this world' like parrots repeating movie dialogue, twisting Scripture out of desperation and calling obedience negative 'performance'."},{"of":"Hyper-Grace teachers as modern Gnostics","quote":"","critique":"Like the Gnostics who denied the continuing reality of Christ's incarnation, they deny the need for daily abiding, continual faith and rejection of besetting sin."}],"illustrations":[{"title":"'All is well' and 'DDLJ' dialogues","story":"The line 'All is well' recurs in the 2009 film '3 Idiots' (remade in Tamil as 'Nanban'), and 'small, small mistakes in big, big countries' recurs in 'Dilwale Dulhania Le Jayenge' (1995).","point":"Hyper-Grace teachers repeat 1 John 4:17 like parrots, as if all is well and small sins should be ignored."},{"title":"Abiding defined","story":"A devotional writer defines abiding as having Christ as our supreme object, our centre and circumference, our all in all.","point":"Abiding means wholehearted devotion to Christ."}],"keyVerses":[{"ref":"1 John 4:17","text":"As He is, so are we in this world","use":"Refers to abiding, overcoming believers, not sin-excusing"},{"ref":"1 John 3:2-3","text":"When he appears we shall be like him... all who have this hope purify themselves","use":"Already but not yet like Christ; call to holiness"},{"ref":"1 John 1:6","text":"If we say we have fellowship with him while we walk in darkness, we lie","use":"Fellowship requires forsaking sin"},{"ref":"1 John 2:28","text":"Abide in him, so that when he appears we may have confidence and not shrink from him in shame","use":"Non-abiders will be ashamed"},{"ref":"1 John 5:18","text":"Everyone who has been born of God does not keep on sinning","use":"Climactic rejection of Hyper-Grace"},{"ref":"1 John 2:5","text":"Whoever keeps His word, in him truly the love of God is perfected","use":"Perfected love requires obedience"},{"ref":"1 John 2:24","text":"If it does, you also will remain in the Son and in the Father","use":"Conditional abiding refutes once-saved-always-saved"},{"ref":"John 15:6","text":"Thrown away like a branch... thrown into the fire","use":"Loss of salvation and hell"},{"ref":"2 John 9","text":"Everyone who goes on ahead and does not abide in the teaching of Christ, does not have God","use":"Non-abiders lose the Father and Son"},{"ref":"Rev 2:11","text":"He who overcomes will not be hurt by the second death","use":"Only overcomers reach heaven"}],"flow":["Hyper-Grace repeats 1 John 4:17 like movie dialogue","Singapore pastor: God judges by Jesus, not performance","Context: John answering proto-gnostics","Reasons 1-3: Parousia, 'we' passages, perfected love","Reason 4: present-continuous tense demands continuing faith","Reason 5: all John's writings demand abiding","Conclusion: 'we' means abiding, overcoming believers"]},{"num":12,"section":"Hyper-Grace","title":"How Do We Respond to Grace Shown to Us? Can We Respond Like Rohit Did in the 2019 ODI World Cup?","summary":"Subtitled as a response to the Hyper-Grace attack on the non-ceremonial moral laws of the Old Testament, this chapter uses cricket to show how grace should be answered. Rohit Sharma, dropped on 9 by Tamim Iqbal against Bangladesh in 2019, went on to a century, as he had after earlier drops, and Kohli and Patidar made big scores after being dropped in IPL 2024. Like them, believers saved by grace (Eph 2:4, 8-10) should respond with grateful good works. The author distinguishes 'good works' of holiness and ministry, which we must do, from 'works of the law', the animal sacrifices and ceremonial laws made obsolete by Christ (Heb 8:13). The moral, non-ceremonial laws (e.g. against adultery, restated in Heb 13:4) still bind believers, who obey them out of gratitude and not to earn salvation, and those who do not should doubt they are saved (1 John 2:3-5). Shivam Dube, dropped by Siraj in a match 45 crore people watched, wasted his reprieve, which pictures believers who refuse holiness after being saved.","thesis":"Grace received should be answered with grateful good works of holiness, including obedience to the Old Testament's non-ceremonial moral laws; only the ceremonial 'works of the law' are set aside.","outline":null,"claims":[{"claim":"Grace shown should be answered with grateful good works","detail":"As Rohit, Kohli and Patidar repaid dropped catches with big scores, believers saved by grace should show gratitude through good works. God was 'rich in mercy' to us (Eph 2:4), so we must be 'full of mercy' (Jas 3:17). Salvation is by grace through faith for good works prepared beforehand (Eph 2:8-10).","refs":["Eph 2:4","Jas 3:17","Eph 2:8-10"],"target":"Grace with no response of good works"},{"claim":"Good works of holiness differ from 'works of the law'","detail":"Hyper-Grace confuses believers by implying they should not be concerned about works because they are saved by grace. But the New Testament distinguishes good works of holiness and ministry, which we must do out of gratitude, from works of the law, which are animal sacrifices and ceremonial laws made obsolete by Christ's perfect sacrifice (Heb 8:13). Neither can save.","refs":["Heb 8:13","Titus 3:4-8","Titus 2:11-12","Rom 6:4"],"target":"Rejection of all 'works'"},{"claim":"The non-ceremonial moral laws of the Old Testament still bind believers","detail":"Hebrews itself says God will judge the sexually immoral and adulterers (Heb 13:4), restating 'Do not commit adultery'. So the moral laws still bind us. We obey them because we are saved, out of gratitude, not to earn salvation.","refs":["Heb 13:4","Lev 11:45","1 Thess 4:3-5"],"target":"The moral law is irrelevant to believers"},{"claim":"Those who don't do good works of holiness should doubt their salvation","detail":"If we stubbornly refuse to obey these moral laws that call us to personal holiness, we must doubt whether we were saved in the first place (1 John 2:3-5).","refs":["1 John 2:3-5"],"target":"Assurance without holiness"},{"claim":"Refusing holiness after being saved is like Dube wasting his reprieve","detail":"Shivam Dube, dropped by Siraj in a decisive game, was out soon after for 7 off 15. Believers who refuse to walk in holiness, believing Hyper-Grace lies, are like Dube. We should be like Rohit, Kohli and Patidar, responding with persistent holiness.","refs":["Titus 2:11-12"],"target":"Wasting grace through unholy living"}],"questions":[{"q":"Do we respond with gratitude to the grace shown to us by exhibiting good works?","answer":"We must, like the cricketers who capitalised on their reprieves. We are saved by grace for good works (Eph 2:8-10)."},{"q":"The non-ceremonial moral laws of the Old Testament: are we to obey them?","answer":"Yes. Only ceremonial laws and sacrifices are obsolete. The moral laws (like 'do not commit adultery', Heb 13:4) bind believers out of gratitude."}],"criticisms":[{"of":"Cunning preachers of the Hyper-Grace movement","quote":"","critique":"They wage an unwarranted tirade against good works and works of the law and confuse believers into thinking they need not be concerned about works because they are saved by grace."}],"illustrations":[{"title":"Rohit Sharma dropped on 9","story":"In the 2019 World Cup against Bangladesh, Tamim Iqbal dropped an easy catch off Rohit, who went on to his fourth century of the tournament. He had also scored 122, 57 and 104 after earlier drops.","point":"When shown grace, respond with gratitude by 'accumulating runs' of good works."},{"title":"'Even my mother-in-law could have caught that one!'","story":"The author's favourite commentary line for a dropped easy catch.","point":"A humorous lead into undeserved reprieves (grace)."},{"title":"Kohli and Patidar dropped in IPL 2024","story":"Against Punjab Kings in Dharamshala, Kohli, dropped on 0 and 10, made 92 off 47, and Patidar, dropped twice, made 55 off 23.","point":"Grateful recipients of grace make it count."},{"title":"Shivam Dube wastes his reprieve","story":"In a must-win RCB vs CSK game watched by 45 crore people online, Siraj dropped a towering catch off Dube, who was out seven balls later for 7 off 15.","point":"Believers who refuse holiness after being saved waste grace."}],"keyVerses":[{"ref":"Eph 2:8-10","text":"By grace you have been saved through faith... created in Christ Jesus for good works","use":"Saved by grace in order to do good works"},{"ref":"Eph 2:4","text":"God, being rich in mercy","use":"Mercy received should make us merciful"},{"ref":"Jas 3:17","text":"Full of mercy and good fruits","use":"Respond to mercy with mercy"},{"ref":"Heb 8:13","text":"He has made the first one obsolete","use":"Ceremonial laws and sacrifices are set aside"},{"ref":"Heb 13:4","text":"God will judge the sexually immoral and adulterers","use":"Moral law still binding"},{"ref":"1 John 2:3-5","text":"By this we know that we have come to know him, if we keep his commandments","use":"Those without holiness should doubt salvation"}],"flow":["Dropped cricketers repay grace with runs","Believers saved by grace for good works","Hyper-Grace attacks good works","Good works differ from works of the law","Moral laws still bind, obeyed from gratitude","No holiness, then doubt salvation","Don't be like Dube who wasted his reprieve"]},{"num":13,"section":"Hyper-Grace","title":"The Imagery of God as a Father in the Bible Supports Hyper-Grace Cult?","summary":"Hyper-Grace teachers argue from the father image that one can never stop being God's child even if stubborn in sin until death. The author answers through a set of 'P' headings. Hosea pictures God both as a tender Father (Hos 11) and as a devouring lion, leopard and bear (Hos 13). God is not like earthly fathers (Ps 50:21): he is the Holy Father who disciplines for holiness (Heb 12). Under 'The Plan' (Heb 2:10, bringing many sons to glory), 'The Pain' (Exod 4: God's firstborn son; Christ suffered to make us sons, John 1:12) and 'The Pairing' (the Father image paired with Rock, Eagle and Consuming Fire; Deut 32; Heb 12; Isa 63), he shows privilege comes with responsibility: fruitfulness (Jer 31:9, Ephraim), holiness, kind speech, care for the needy and reverent fear (Jas 1:27; 3:9; 1 Pet 1:2,17). Under 'The Peril', Hosea 11:5 and Rom 11:22 show that spurning the Father's love brings judgment and being cut off, and Rev 14:4 and 21:7-8 tie having God as Father to conquering sin. 'The Parenting' calls fathers to discipline children like God, unlike David and Eli. The chapter ends with a Pune case in which a minor driving a Porsche killed two people, as a warning against 'yes-parenting'.","thesis":"God's fatherhood does not guarantee that stubbornly sinning people remain his children; the Bible pairs his fatherly love with holiness, discipline and judgment.","outline":{"acronym":"The P's of God's Fatherhood","items":[{"letter":"P","label":"The Plan","point":"God's eternal plan was to bring many sons to glory alongside his eternal Son, which brings joy to the Father and to us.","refs":["Heb 2:10"]},{"letter":"P","label":"The Pain","point":"From Exodus 4 God calls Israel his firstborn son; to make slaves of sin his children, Christ suffered and died, and we become children by repentance and faith.","refs":["Exod 4:22-23","John 1:12"]},{"letter":"P","label":"The Pairing","point":"The Father image must be paired with others such as Rock, Eagle and Consuming Fire; the transcendent God is also our doting Father; privilege comes with responsibilities of fruitfulness, holiness, kind speech, care for the poor and reverent fear.","refs":["Deut 32:4-6","Deut 32:11","Heb 12:5-6","Heb 12:29","Eccl 7:18","Isa 63:15-16","Jer 31:9","John 17:11","Jas 3:9","Jas 1:27","1 Pet 1:2","1 Pet 1:17"]},{"letter":"P","label":"The Peril","point":"Spurning the Father's love brings judgment (Assyria), the Father becomes like a bear or lion, and believers can be 'cut off'; only conquerors have God as Father.","refs":["Hos 11:1-5","Hos 13:7-9","Rom 11:22","Rev 14:1","Rev 14:4","Rev 21:7-8"]},{"letter":"P","label":"The Parenting","point":"Fathers should imitate God by lovingly disciplining children toward holiness, unlike David with Amnon and Eli with his sons, and avoid 'yes-parenting'.","refs":["Eph 5:1","Heb 12:7-10","1 Sam 2:12-25","1 Sam 3:13"]}]},"claims":[{"claim":"Hyper-Grace: you can never stop being God's child, even stubborn in sin","detail":"Hyper-Grace teachers use the father image to say a person cannot stop being God's child even if stubborn in sin until death or Christ's return. They argue that just as you do not stop being your earthly father's son by rebelling, you remain God's son and will never go to hell.","refs":["Hos 11:1-4"],"target":"Unbreakable sonship regardless of sin"},{"claim":"Hosea shows God as loving Father and as attacking wild beast","detail":"Hosea 11 pictures God teaching Israel to walk, bending down to feed them and longing to give another chance (11:1-4, 8-9). Because Israel held on to sin, the same God became like a lion, leopard and bear (13:7-8). We must embrace both images.","refs":["Hos 11:1-4","Hos 11:8-9","Hos 13:7-8"],"target":"God only as gentle Father"},{"claim":"God the Father is not like earthly fathers","detail":"God says, 'You thought I was like you' (Ps 50:21). He is the Holy Father (John 17:11) who disciplines us so we become holy, without which no one will see the Lord (Heb 12:5-6,14).","refs":["Ps 50:21","John 17:11","Heb 12:5-6","Heb 12:14"],"target":"Father imagery modelled on permissive human fathers"},{"claim":"Both Testaments present God as Father and as consuming fire","detail":"It is wrong to think the Old Testament shows God as consuming fire and the New Testament as loving Father, a belief spread by Hyper-Grace among those who do not read the Bible thoroughly. God is not the Father of popular worship songs. He is pleased with those who walk in holiness like Enoch (Heb 11:5) and not pleased with those who flirt with sin (1 Cor 10:5), and he expects immediate repentance (Rom 2:4-5).","refs":["Heb 11:5","1 Cor 10:5","Rom 2:4-5","Acts 20:27"],"target":"Old Testament wrath vs New Testament love dichotomy"},{"claim":"God created us to bring many sons to glory (The Plan)","detail":"God's eternal plan was to be a Father. Having enjoyed fellowship with his Eternal Son, he wanted more fully human sons and daughters, which brings him and us joy. The Son suffered on the Cross to bring many sons to glory (Heb 2:10).","refs":["Heb 2:10"],"target":"(Positive teaching)"},{"claim":"God made slaves of sin his sons through Christ's pain (The Pain)","detail":"One of the first presentations of God as Father is Exodus 4, where Israel is God's son, freed from Pharaoh. In the same way God sent Christ to suffer to make sin's slaves his children, and we become sons and daughters when we repent and believe (John 1:12).","refs":["Exod 4:21-23","John 1:12"],"target":"(Positive teaching)"},{"claim":"Father imagery must be paired with Rock, Eagle and Consuming Fire (The Pairing)","detail":"Deut 32 calls God Father (32:5-6) but also Rock (32:4,15,30) and Eagle (32:11). Heb 12 presents a compassionate Father (vv 5-6) and a consuming fire. Those who say God is only a loving Father are wrong. We must hold both (Eccl 7:18). Isaiah 63:15-16 pairs the God who looks down from heaven with 'our Father'.","refs":["Deut 32:4-6","Deut 32:11","Deut 32:15","Deut 32:30","Heb 12:5-6","Heb 12:29","Eccl 7:18","Isa 63:15-16"],"target":"God as only a loving Father"},{"claim":"Having God as Father brings responsibilities: fruitfulness, holiness, love and fear","detail":"Jer 31:9 calls Ephraim ('doubly fruitful') God's firstborn, so we must be fruitful and holy as children of the Holy Father (John 17:11). James ties calling God Father to speaking kindly (Jas 3:9) and caring for orphans and widows (Jas 1:27). Peter links it to sanctification and obedience (1 Pet 1:2) and reverent fear before a Father who judges impartially (1 Pet 1:17).","refs":["Jer 31:9","John 17:11","Jas 3:9","Jas 1:27","1 Pet 1:2","1 Pet 1:17"],"target":"Privilege without responsibility"},{"claim":"Spurning the Father's love brings judgment and being 'cut off' (The Peril)","detail":"Right after Hosea's tender father passage, Hosea 11:5 announces Assyria's rule because Israel refused to return, fulfilled in 722 BC. Rom 11:22 warns that if we spurn God's kindness we may be cut off. Hosea 13:8-9 shows the Father as an angry bear-lion who can ultimately send rebels to hell.","refs":["Hos 11:5","Rom 11:22","Hos 13:8-9"],"target":"Spurning God's love carries no peril"},{"claim":"Those with God as Father follow the Lamb and conquer sin","detail":"Those with the Father's name (Rev 14:1) follow the Lamb wherever he goes (14:4), meaning obedience in all areas. Rev 21:7-8 shows those for whom God is Father are conquerors who have turned from sexual immorality, murder, sorcery, idolatry and lying.","refs":["Rev 14:1","Rev 14:4","Rev 21:7-8"],"target":"Sonship without overcoming"},{"claim":"Fathers must discipline children as God does, not like David or Eli (The Parenting)","detail":"We are to imitate God (Eph 5:1), who disciplines his children in love to share his holiness (Heb 12:7-10). Fathers must discipline their children, including physical correction, when they fall into sins like porn, affairs or gadget addiction. They should not look away as David did when Amnon raped Tamar, or rebuke too late as Eli did (1 Sam 2:12-25; 3:13).","refs":["Eph 5:1","Heb 12:7-10","1 Sam 2:12-25","1 Sam 3:13"],"target":"Permissive parenting"}],"questions":[{"q":"Can Hyper-Grace teachers say you never stop being God's child even if stubborn in sin till death?","answer":"No. The Bible pairs fatherly love with judgment, discipline and the peril of being cut off."},{"q":"The big question: why did God create us?","answer":"To be a Father to us, adding fully human sons and daughters to the fellowship he enjoyed with his eternal Son (Heb 2:10)."},{"q":"Do you see God as only a loving Father and nothing else?","answer":"We must not. Scripture also calls him Rock, Eagle and Consuming Fire, and we must hold all these images."},{"q":"Will God the Father stop being our Father when we are stubbornly in sin?","answer":"Hosea 11:5 and 13, and Rom 11:22, show that spurning his love leads to judgment, being cut off and ultimately hell."},{"q":"Conquering sexual sin and keeping God as our Father: what is the connection?","answer":"Those for whom God is Father follow the Lamb and conquer, turning from hell-populating sins (Rev 14:4; 21:7-8)."},{"q":"Are you a yes-parent?","answer":"The Pune Porsche crash shows the grave perils of indulgent parenting; we must parent like our holy heavenly Father."}],"criticisms":[{"of":"Hyper-Grace cult teachers","quote":"Do you stop becoming your earthly father's son, if you rebel against him? You don't. In the same way the Heavenly Father will never stop loving you even if you walk away from him... You will never go to hell! You still remain His Son!","critique":"They compare God with earthly fathers. Hosea 11:5, Hosea 13 and Rom 11:22 show that spurning the Father's love brings judgment."},{"of":"Hyper-Grace worship songs and sermons (popular on YouTube)","quote":"","critique":"They paint God as a 'Good, Good Father' in a way that ignores the full counsel of God (Acts 20:27) and his displeasure with sin."},{"of":"Those who teach an Old Testament fire / New Testament Father split","quote":"","critique":"This belief comes from Hyper-Grace influence on people who do not read the Bible comprehensively."},{"of":"King David, Priest Eli, and a prominent Pune builder (yes-parenting)","quote":"","critique":"David ignored Amnon's rape of Tamar, Eli rebuked his sons too late, and a Pune father let his drunk minor son drive a Porsche that killed two people."}],"illustrations":[{"title":"Fathers teaching toddlers to walk","story":"Loving dads hold their kids' hands to teach them to walk and bend down to feed them, as God did with Israel (Hos 11).","point":"God is a tender Father."},{"title":"Bear robbed of her cubs","story":"Hosea 13 pictures God as a bear robbed of her cubs and a devouring lion against rebellious Israel.","point":"The same loving Father becomes a judge if his love is spurned."},{"title":"Ephraim means doubly fruitful","story":"God calls Ephraim his firstborn (Jer 31:9), and the name means 'doubly fruitful'.","point":"The privilege of sonship carries the responsibility to be fruitful and holy."},{"title":"David, Amnon and Eli","story":"David looked the other way when Amnon raped Tamar, and Eli warned his sons but never truly rebuked them.","point":"Fathers must discipline their children as God does."},{"title":"The Pune Porsche crash","story":"In 2024 a builder's allegedly drunk 17-year-old son, given a credit card and the car keys with his father's approval, drove a Porsche at about 200 km/h and killed two young techies.","point":"'Yes-parenting' has grave perils, so parent like the holy heavenly Father."}],"keyVerses":[{"ref":"Hos 11:1-4","text":"When Israel was a child, I loved him... I bent down to feed them","use":"God as tender Father"},{"ref":"Hos 11:5","text":"Assyria will be their king because they refused to return to me","use":"Spurning fatherly love brings judgment"},{"ref":"Hos 13:7-9","text":"I will fall upon them like a bear robbed of her cubs","use":"Same God becomes a judging beast"},{"ref":"Ps 50:21","text":"You thought I was altogether like you","use":"God is not like earthly fathers"},{"ref":"Heb 12:5-6","text":"The Lord disciplines the one he loves","use":"The Holy Father disciplines for holiness"},{"ref":"Heb 2:10","text":"In bringing many sons to glory","use":"God's plan to be our Father"},{"ref":"Deut 32:5-6","text":"Is He not your Father, who bought you?","use":"Father image paired with Rock and Eagle"},{"ref":"Eccl 7:18","text":"It is good to grasp the one and not let go of the other","use":"Hold both images of God"},{"ref":"1 Pet 1:17","text":"If you call on him as Father who judges impartially... conduct yourselves with fear","use":"Privilege brings reverent fear"},{"ref":"Rom 11:22","text":"Otherwise you also will be cut off","use":"Peril of spurning God's kindness"},{"ref":"Rev 21:7-8","text":"The one who conquers... I will be his God and he will be my son","use":"Only conquerors have God as Father"}],"flow":["Hyper-Grace: you always remain God's child","Hosea: loving Father and attacking beast","God is the Holy Father, unlike earthly fathers","Plan and Pain: sons brought to glory through Christ","Pairing: Father with Rock, Eagle, Fire; privilege with duty","Peril: spurning love brings judgment, being cut off","Parenting: discipline like God, not David or Eli"]}]};
window.EXTRA = {"balance":[{"name":"Hyper-Grace","left":"Grace","right":"Holiness","v":"--s-grace","text":"Preaches grace and identity while dropping repentance, confession and daily holy living."},{"name":"Hyper-Love","left":"Love","right":"Wrath","v":"--s-love","text":"Preaches God's love while softening or removing his wrath and eternal hell."},{"name":"Hyper-Supernatural","left":"Miracles","right":"Suffering","v":"--s-super","text":"Insists God always heals and that believers need never die, ignoring texts on suffering, sickness and death."},{"name":"Hyper-Israel","left":"Israel","right":"Church","v":"--s-misc","text":"Celebrates feasts and backs modern political Israel, neglecting the epistles and the local church."}],"timeline":[{"when":"Eden","what":"Death enters (Gen 3; Rom 5:12)","v":"--s-love"},{"when":"Cross","what":"Death defeated in principle (Heb 2:14)","v":"--s-grace"},{"when":"Now","what":"Appointed once to die (Heb 9:27)","v":"--s-super"},{"when":"Return","what":"The dead raised, mortal puts on immortality","v":"--s-ref"},{"when":"New Earth","what":"No more death (Rev 21:4)","v":"--s-anti"}],"timelineTitle":"Death and immortality in the book's reading of Scripture","timelineSub":"The author's position across the immortality chapters: believers still die until Christ returns, and immortality is put on at the resurrection.","positions":[{"topic":"Scripture","rejects":"New teachings and extra-biblical claims; picking favourite verses","affirms":"Be 'hyper-biblical': add nothing, subtract nothing, test every teaching daily like the Bereans","ch":[0,1,45,46,47]},{"topic":"Future sins","rejects":"A believer's past, present and future sins are forgiven automatically","affirms":"Forgiveness is provided at the cross but possessed through ongoing repentance and confession (1 John 1:9)","ch":[2,3,4]},{"topic":"Repentance","rejects":"Repentance is only a change of mind; stop preaching it","affirms":"Repentance is turning from sin with deeds that fit it (Acts 26:20)","ch":[2,8,9,10]},{"topic":"Holiness","rejects":"Effort toward holiness is legalism; moral transformation does not matter","affirms":"Progressive sanctification: Spirit-enabled effort and daily holy choices (Heb 12:14)","ch":[5,17,18]},{"topic":"How God sees us","rejects":"The Father only sees Jesus and is permanently pleased whatever we do","affirms":"God is both compassionate Father and consuming fire; he disciplines and calls churches to repent","ch":[2,11,13,15]},{"topic":"Grace","rejects":"Grace as a licence to keep sinning","affirms":"Grace saves and trains us to say no to ungodliness; we respond to it with gratitude and obedience","ch":[6,7,12,16,19]},{"topic":"Security","rejects":"Once saved, always saved; only rewards are lost","affirms":"A saved person can be lost through wilful, unrepentant sin and apostasy","ch":[14,20]},{"topic":"Greater works","rejects":"'Greater works' means bigger miracles or miracle money","affirms":"Greater works refers to the wider reach of gospel work after Pentecost","ch":[21]},{"topic":"Pestilence and miracles","rejects":"Believers are always exempt from plague; God always does the miracle","affirms":"God is sovereign; in Acts and today, some are delivered and some are not","ch":[22,23,25]},{"topic":"Death","rejects":"'Immortality now': believers need never die; death can be befriended or defeated by faith today","affirms":"Death remains the last enemy; believers die until Christ returns, then put on immortality","ch":[24,26,27,28,29,30,31,32,33]},{"topic":"Healing","rejects":"It is always God's will to heal; we command disease and command God","affirms":"We ask in faith and submit to God's will; sickness can remain in faithful believers","ch":[34,35,36]},{"topic":"Hell","rejects":"Annihilation, escape from hell into heaven, and Shack-style theology","affirms":"Hell is eternal, conscious and final; there is no second chance after death","ch":[37,38,39]},{"topic":"The cross","rejects":"Denying that Jesus died to take away our sin as a substitute","affirms":"Jesus bore our sin and God's judgment on the cross","ch":[40]},{"topic":"False teachers","rejects":"Treating wolves as harmless","affirms":"Recognise false teachers by their fruit, doctrine and motives","ch":[41]},{"topic":"Israel and feasts","rejects":"Gentile believers keeping Jewish feasts and dating Christ's return by them","affirms":"Feasts were shadows fulfilled in Christ; no one knows the day","ch":[42]},{"topic":"Mark of the beast","rejects":"Taking a vaccine is taking the beast's mark","affirms":"The mark involves worship and allegiance, not medicine","ch":[43]},{"topic":"Apocrypha","rejects":"Equating the Apocrypha with Scripture","affirms":"Only the 66 books are the inspired Word of God","ch":[44]}]};

];

  c.outlinesAll = (c.outlines && c.outlines.length ? c.outlines : (c.outline ? [c.outline] : [])).filter(o => o && o.items && o.items.length); });
const byId = Object.fromEntries(CH.map(c => [c.id, c]));
const chName = c => c.num === 0 ? "Introduction" : "Chapter " + c.num;
