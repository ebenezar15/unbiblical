h","Reason 5: all John's writings demand abiding","Conclusion: 'we' means abiding, overcoming believers"]},{"num":12,"section":"Hyper-Grace","title":"How Do We Respond to Grace Shown to Us? Can We Respond Like Rohit Did in the 2019 ODI World Cup?","summary":"Subtitled as a response to the Hyper-Grace attack on the non-ceremonial moral laws of the Old Testament, this chapter uses cricket to show how grace should be answered. Rohit Sharma, dropped on 9 by Tamim Iqbal against Bangladesh in 2019, went on to a century, as he had after earlier drops, and Kohli and Patidar made big scores after being dropped in IPL 2024. Like them, believers saved by grace (Eph 2:4, 8-10) should respond with grateful good works. The author distinguishes 'good works' of holiness and ministry, which we must do, from 'works of the law', the animal sacrifices and ceremonial laws made obsolete by Christ (Heb 8:13). The moral, non-ceremonial laws (e.g. against adultery, restated in Heb 13:4) still bind believers, who obey them out of gratitude and not to earn salvation, and those who do not should doubt they are saved (1 John 2:3-5). Shivam Dube, dropped by Siraj in a match 45 crore people watched, wasted his reprieve, which pictures believers who refuse holiness after being saved.","thesis":"Grace received should be answered with grateful good works of holiness, including obedience to the Old Testament's non-ceremonial moral laws; only the ceremonial 'works of the law' are set aside.","outline":null,"claims":[{"claim":"Grace shown should be answered with grateful good works","detail":"As Rohit, Kohli and Patidar repaid dropped catches with big scores, believers saved by grace should show gratitude through good works. God was 'rich in mercy' to us (Eph 2:4), so we must be 'full of mercy' (Jas 3:17). Salvation is by grace through faith for good works prepared beforehand (Eph 2:8-10).","refs":["Eph 2:4","Jas 3:17","Eph 2:8-10"],"target":"Grace with no response of good works"},{"claim":"Good works of holiness differ from 'works of the law'","detail":"Hyper-Grace confuses believers by implying they should not be concerned about works because they are saved by grace. But the New Testament distinguishes good works of holiness and ministry, which we must do out of gratitude, from works of the law, which are animal sacrifices and ceremonial laws made obsolete by Christ's perfect sacrifice (Heb 8:13). Neither can save.","refs":["Heb 8:13","Titus 3:4-8","Titus 2:11-12","Rom 6:4"],"target":"Rejection of all 'works'"},{"claim":"The non-ceremonial moral laws of the Old Testament still bind believers","detail":"Hebrews itself says God will judge the sexually immoral and adulterers (Heb 13:4), restating 'Do not commit adultery'. So the moral laws still bind us. We obey them because we are saved, out of gratitude, not to earn salvation.","refs":["Heb 13:4","Lev 11:45","1 Thess 4:3-5"],"target":"The moral law is irrelevant to believers"},{"claim":"Those who don't do good works of holiness should doubt their salvation","detail":"If we stubbornly refuse to obey these moral laws that call us to personal holiness, we must doubt whether we were saved in the first place (1 John 2:3-5).","refs":["1 John 2:3-5"],"target":"Assurance without holiness"},{"claim":"Refusing holiness after being saved is like Dube wasting his reprieve","detail":"Shivam Dube, dropped by Siraj in a decisive game, was out soon after for 7 off 15. Believers who refuse to walk in holiness, believing Hyper-Grace lies, are like Dube. We should be like Rohit, Kohli and Patidar, responding with persistent holiness.","refs":["Titus 2:11-12"],"target":"Wasting grace through unholy living"}],"questions":[{"q":"Do we respond with gratitude to the grace shown to us by exhibiting good works?","answer":"We must, like the cricketers who capitalised on their reprieves. We are saved by grace for good works (Eph 2:8-10)."},{"q":"The non-ceremonial moral laws of the Old Testament: are we to obey them?","answer":"Yes. Only ceremonial laws and sacrifices are obsolete. The moral laws (like 'do not commit adultery', Heb 13:4) bind believers out of gratitude."}],"criticisms":[{"of":"Cunning preachers of the Hyper-Grace movement","quote":"","critique":"They wage an unwarranted tirade against good works and works of the law and confuse believers into thinking they need not be concerned about works because they are saved by grace."}],"illustrations":[{"title":"Rohit Sharma dropped on 9","story":"In the 2019 World Cup against Bangladesh, Tamim Iqbal dropped an easy catch off Rohit, who went on to his fourth century of the tournament. He had also scored 122, 57 and 104 after earlier drops.","point":"When shown grace, respond with gratitude by 'accumulating runs' of good works."},{"title":"'Even my mother-in-law could have caught that one!'","story":"The author's favourite commentary line for a dropped easy catch.","point":"A humorous lead into undeserved reprieves (grace)."},{"title":"Kohli and Patidar dropped in IPL 2024","story":"Against Punjab Kings in Dharamshala, Kohli, dropped on 0 and 10, made 92 off 47, and Patidar, dropped twice, made 55 off 23.","point":"Grateful recipients of grace make it count."},{"title":"Shivam Dube wastes his reprieve","story":"In a must-win RCB vs CSK game watched by 45 crore people online, Siraj dropped a towering catch off Dube, who was out seven balls later for 7 off 15.","point":"Believers who refuse holiness after being saved waste grace."}],"keyVerses":[{"ref":"Eph 2:8-10","text":"By grace you have been saved through faith... created in Christ Jesus for good works","use":"Saved by grace in order to do good works"},{"ref":"Eph 2:4","text":"God, being rich in mercy","use":"Mercy received should make us merciful"},{"ref":"Jas 3:17","text":"Full of mercy and good fruits","use":"Respond to mercy with mercy"},{"ref":"Heb 8:13","text":"He has made the first one obsolete","use":"Ceremonial laws and sacrifices are set aside"},{"ref":"Heb 13:4","text":"God will judge the sexually immoral and adulterers","use":"Moral law still binding"},{"ref":"1 John 2:3-5","text":"By this we know that we have come to know him, if we keep his commandments","use":"Those without holiness should doubt salvation"}],"flow":["Dropped cricketers repay grace with runs","Believers saved by grace for good works","Hyper-Grace attacks good works","Good works differ from works of the law","Moral laws still bind, obeyed from gratitude","No holiness, then doubt salvation","Don't be like Dube who wasted his reprieve"]},{"num":13,"section":"Hyper-Grace","title":"The Imagery of God as a Father in the Bible Supports Hyper-Grace Cult?","summary":"Hyper-Grace teachers argue from the father image that one can never stop being God's child even if stubborn in sin until death. The author answers through a set of 'P' headings. Hosea pictures God both as a tender Father (Hos 11) and as a devouring lion, leopard and bear (Hos 13). God is not like earthly fathers (Ps 50:21): he is the Holy Father who disciplines for holiness (Heb 12). Under 'The Plan' (Heb 2:10, bringing many sons to glory), 'The Pain' (Exod 4: God's firstborn son; Christ suffered to make us sons, John 1:12) and 'The Pairing' (the Father image paired with Rock, Eagle and Consuming Fire; Deut 32; Heb 12; Isa 63), he shows privilege comes with responsibility: fruitfulness (Jer 31:9, Ephraim), holiness, kind speech, care for the needy and reverent fear (Jas 1:27; 3:9; 1 Pet 1:2,17). Under 'The Peril', Hosea 11:5 and Rom 11:22 show that spurning the Father's love brings judgment and being cut off, and Rev 14:4 and 21:7-8 tie having God as Father to conquering sin. 'The Parenting' calls fathers to discipline children like God, unlike David and Eli. The chapter ends with a Pune case in which a minor driving a Porsche killed two people, as a warning against 'yes-parenting'.","thesis":"God's fatherhood does not guarantee that stubbornly sinning people remain his children; the Bible pairs his fatherly love with holiness, discipline and judgment.","outline":{"acronym":"The P's of God's Fatherhood","items":[{"letter":"P","label":"The Plan","point":"God's eternal plan was to bring many sons to glory alongside his eternal Son, which brings joy to the Father and to us.","refs":["Heb 2:10"]},{"letter":"P","label":"The Pain","point":"From Exodus 4 God calls Israel his firstborn son; to make slaves of sin his children, Christ suffered and died, and we become children by repentance and faith.","refs":["Exod 4:22-23","John 1:12"]},{"letter":"P","label":"The Pairing","point":"The Father image must be paired with others such as Rock, Eagle and Consuming Fire; the transcendent God is also our doting Father; privilege comes with responsibilities of fruitfulness, holiness, kind speech, care for the poor and reverent fear.","refs":["Deut 32:4-6","Deut 32:11","Heb 12:5-6","Heb 12:29","Eccl 7:18","Isa 63:15-16","Jer 31:9","John 17:11","Jas 3:9","Jas 1:27","1 Pet 1:2","1 Pet 1:17"]},{"letter":"P","label":"The Peril","point":"Spurning the Father's love brings judgment (Assyria), the Father becomes like a bear or lion, and believers can be 'cut off'; only conquerors have God as Father.","refs":["Hos 11:1-5","Hos 13:7-9","Rom 11:22","Rev 14:1","Rev 14:4","Rev 21:7-8"]},{"letter":"P","label":"The Parenting","point":"Fathers should imitate God by lovingly disciplining children toward holiness, unlike David with Amnon and Eli with his sons, and avoid 'yes-parenting'.","refs":["Eph 5:1","Heb 12:7-10","1 Sam 2:12-25","1 Sam 3:13"]}]},"claims":[{"claim":"Hyper-Grace: you can never stop being God's child, even stubborn in sin","detail":"Hyper-Grace teachers use the father image to say a person cannot stop being God's child even if stubborn in sin until death or Christ's return. They argue that just as you do not stop being your earthly father's son by rebelling, you remain God's son and will never go to hell.","refs":["Hos 11:1-4"],"target":"Unbreakable sonship regardless of sin"},{"claim":"Hosea shows God as loving Father and as attacking wild beast","detail":"Hosea 11 pictures God teaching Israel to walk, bending down to feed them and longing to give another chance (11:1-4, 8-9). Because Israel held on to sin, the same God became like a lion, leopard and bear (13:7-8). We must embrace both images.","refs":["Hos 11:1-4","Hos 11:8-9","Hos 13:7-8"],"target":"God only as gentle Father"},{"claim":"God the Father is not like earthly fathers","detail":"God says, 'You thought I was like you' (Ps 50:21). He is the Holy Father (John 17:11) who disciplines us so we become holy, without which no one will see the Lord (Heb 12:5-6,14).","refs":["Ps 50:21","John 17:11","Heb 12:5-6","Heb 12:14"],"target":"Father imagery modelled on permissive human fathers"},{"claim":"Both Testaments present God as Father and as consuming fire","detail":"It is wrong to think the Old Testament shows God as consuming fire and the New Testament as loving Father, a belief spread by Hyper-Grace among those who do not read the Bible thoroughly. God is not the Father of popular worship songs. He is pleased with those who walk in holiness like Enoch (Heb 11:5) and not pleased with those who flirt with sin (1 Cor 10:5), and he expects immediate repentance (Rom 2:4-5).","refs":["Heb 11:5","1 Cor 10:5","Rom 2:4-5","Acts 20:27"],"target":"Old Testament wrath vs New Testament love dichotomy"},{"claim":"God created us to bring many sons to glory (The Plan)","detail":"God's eternal plan was to be a Father. Having enjoyed fellowship with his Eternal Son, he wanted more fully human sons and daughters, which brings him and us joy. The Son suffered on the Cross to bring many sons to glory (Heb 2:10).","refs":["Heb 2:10"],"target":"(Positive teaching)"},{"claim":"God made slaves of sin his sons through Christ's pain (The Pain)","detail":"One of the first presentations of God as Father is Exodus 4, where Israel is God's son, freed from Pharaoh. In the same way God sent Christ to suffer to make sin's slaves his children, and we become sons and daughters when we repent and believe (John 1:12).","refs":["Exod 4:21-23","John 1:12"],"target":"(Positive teaching)"},{"claim":"Father imagery must be paired with Rock, Eagle and Consuming Fire (The Pairing)","detail":"Deut 32 calls God Father (32:5-6) but also Rock (32:4,15,30) and Eagle (32:11). Heb 12 presents a compassionate Father (vv 5-6) and a consuming fire. Those who say God is only a loving Father are wrong. We must hold both (Eccl 7:18). Isaiah 63:15-16 pairs the God who looks down from heaven with 'our Father'.","refs":["Deut 32:4-6","Deut 32:11","Deut 32:15","Deut 32:30","Heb 12:5-6","Heb 12:29","Eccl 7:18","Isa 63:15-16"],"target":"God as only a loving Father"},{"claim":"Having God as Father brings responsibilities: fruitfulness, holiness, love and fear","detail":"Jer 31:9 calls Ephraim ('doubly fruitful') God's firstborn, so we must be fruitful and holy as children of the Holy Father (John 17:11). James ties calling God Father to speaking kindly (Jas 3:9) and caring for orphans and widows (Jas 1:27). Peter links it to sanctification and obedience (1 Pet 1:2) and reverent fear before a Father who judges impartially (1 Pet 1:17).","refs":["Jer 31:9","John 17:11","Jas 3:9","Jas 1:27","1 Pet 1:2","1 Pet 1:17"],"target":"Privilege without responsibility"},{"claim":"Spurning the Father's love brings judgment and being 'cut off' (The Peril)","detail":"Right after Hosea's tender father passage, Hosea 11:5 announces Assyria's rule because Israel refused to return, fulfilled in 722 BC. Rom 11:22 warns that if we spurn God's kindness we may be cut off. Hosea 13:8-9 shows the Father as an angry bear-lion who can ultimately send rebels to hell.","refs":["Hos 11:5","Rom 11:22","Hos 13:8-9"],"target":"Spurning God's love carries no peril"},{"claim":"Those with God as Father follow the Lamb and conquer sin","detail":"Those with the Father's name (Rev 14:1) follow the Lamb wherever he goes (14:4), meaning obedience in all areas. Rev 21:7-8 shows those for whom God is Father are conquerors who have turned from sexual immorality, murder, sorcery, idolatry and lying.","refs":["Rev 14:1","Rev 14:4","Rev 21:7-8"],"target":"Sonship without overcoming"},{"claim":"Fathers must discipline children as God does, not like David or Eli (The Parenting)","detail":"We are to imitate God (Eph 5:1), who disciplines his children in love to share his holiness (Heb 12:7-10). Fathers must discipline their children, including physical correction, when they fall into sins like porn, affairs or gadget addiction. They should not look away as David did when Amnon raped Tamar, or rebuke too late as Eli did (1 Sam 2:12-25; 3:13).","refs":["Eph 5:1","Heb 12:7-10","1 Sam 2:12-25","1 Sam 3:13"],"target":"Permissive parenting"}],"questions":[{"q":"Can Hyper-Grace teachers say you never stop being God's child even if stubborn in sin till death?","answer":"No. The Bible pairs fatherly love with judgment, discipline and the peril of being cut off."},{"q":"The big question: why did God create us?","answer":"To be a Father to us, adding fully human sons and daughters to the fellowship he enjoyed with his eternal Son (Heb 2:10)."},{"q":"Do you see God as only a loving Father and nothing else?","answer":"We must not. Scripture also calls him Rock, Eagle and Consuming Fire, and we must hold all these images."},{"q":"Will God the Father stop being our Father when we are stubbornly in sin?","answer":"Hosea 11:5 and 13, and Rom 11:22, show that spurning his love leads to judgment, being cut off and ultimately hell."},{"q":"Conquering sexual sin and keeping God as our Father: what is the connection?","answer":"Those for whom God is Father follow the Lamb and conquer, turning from hell-populating sins (Rev 14:4; 21:7-8)."},{"q":"Are you a yes-parent?","answer":"The Pune Porsche crash shows the grave perils of indulgent parenting; we must parent like our holy heavenly Father."}],"criticisms":[{"of":"Hyper-Grace cult teachers","quote":"Do you stop becoming your earthly father's son, if you rebel against him? You don't. In the same way the Heavenly Father will never stop loving you even if you walk away from him... You will never go to hell! You still remain His Son!","critique":"They compare God with earthly fathers. Hosea 11:5, Hosea 13 and Rom 11:22 show that spurning the Father's love brings judgment."},{"of":"Hyper-Grace worship songs and sermons (popular on YouTube)","quote":"","critique":"They present God as a 'good, good Father' (in the words of a popular worship song) in a way that ignores the full counsel of God (Acts 20:27) and his displeasure with sin."},{"of":"Those who teach an Old Testament fire / New Testament Father split","quote":"","critique":"This belief comes from Hyper-Grace influence on people who do not read the Bible comprehensively."},{"of":"King David, Priest Eli, and a prominent Pune builder (yes-parenting)","quote":"","critique":"David ignored Amnon's rape of Tamar, Eli rebuked his sons too late, and a Pune father let his drunk minor son drive a Porsche that killed two people."}],"illustrations":[{"title":"Fathers teaching toddlers to walk","story":"Loving dads hold their kids' hands to teach them to walk and bend down to feed them, as God did with Israel (Hos 11).","point":"God is a tender Father."},{"title":"Bear robbed of her cubs","story":"Hosea 13 pictures God as a bear robbed of her cubs and a devouring lion against rebellious Israel.","point":"The same loving Father becomes a judge if his love is spurned."},{"title":"Ephraim means doubly fruitful","story":"God calls Ephraim his firstborn (Jer 31:9), and the name means 'doubly fruitful'.","point":"The privilege of sonship carries the responsibility to be fruitful and holy."},{"title":"David, Amnon and Eli","story":"David looked the other way when Amnon raped Tamar, and Eli warned his sons but never truly rebuked them.","point":"Fathers must discipline their children as God does."},{"title":"The Pune Porsche crash","story":"In 2024 a builder's allegedly drunk 17-year-old son, given a credit card and the car keys with his father's approval, drove a Porsche at about 200 km/h and killed two young techies.","point":"'Yes-parenting' has grave perils, so parent like the holy heavenly Father."}],"keyVerses":[{"ref":"Hos 11:1-4","text":"When Israel was a child, I loved him... I bent down to feed them","use":"God as tender Father"},{"ref":"Hos 11:5","text":"Assyria will be their king because they refused to return to me","use":"Spurning fatherly love brings judgment"},{"ref":"Hos 13:7-9","text":"I will fall upon them like a bear robbed of her cubs","use":"Same God becomes a judging beast"},{"ref":"Ps 50:21","text":"You thought I was altogether like you","use":"God is not like earthly fathers"},{"ref":"Heb 12:5-6","text":"The Lord disciplines the one he loves","use":"The Holy Father disciplines for holiness"},{"ref":"Heb 2:10","text":"In bringing many sons to glory","use":"God's plan to be our Father"},{"ref":"Deut 32:5-6","text":"Is He not your Father, who bought you?","use":"Father image paired with Rock and Eagle"},{"ref":"Eccl 7:18","text":"It is good to grasp the one and not let go of the other","use":"Hold both images of God"},{"ref":"1 Pet 1:17","text":"If you call on him as Father who judges impartially... conduct yourselves with fear","use":"Privilege brings reverent fear"},{"ref":"Rom 11:22","text":"Otherwise you also will be cut off","use":"Peril of spurning God's kindness"},{"ref":"Rev 21:7-8","text":"The one who conquers... I will be his God and he will be my son","use":"Only conquerors have God as Father"}],"flow":["Hyper-Grace: you always remain God's child","Hosea: loving Father and attacking beast","God is the Holy Father, unlike earthly fathers","Plan and Pain: sons brought to glory through Christ","Pairing: Father with Rock, Eagle, Fire; privilege with duty","Peril: spurning love brings judgment, being cut off","Parenting: discipline like God, not David or Eli"]},{"num":14,"section":"Hyper-Grace","title":"Only Reward Loss, but Place in Heaven Safe! Does 1 Corinthians 3:15 Teach That?","summary":"The author rejects the claim that there is no judgment for believers, saying such teachers appeal to 'itching ears' (2 Tim 4:3-4) and that all must stand before Christ's judgment seat (Rom 14:10). He says 1 Cor 3:13-15 judges the quality of a believer's ministry and service, not his sins. Quoting a British Bible teacher, he notes that the very next verses warn that whoever destroys God's temple will be destroyed (1 Cor 3:16-17): we may get away with poor service, but not with sin. The rest of 1 Corinthians confirms this. The unrighteous will not inherit the kingdom (6:9-11), Paul feared disqualification (9:27), and chapter 10 warns of destruction for stubborn sin. He accuses Hyper-Grace teachers of replacing the Bible with MBA marketing principles of pleasing the customer.","thesis":"1 Corinthians 3:15 concerns the testing of believers' service, not a guarantee that believers stubborn in sin lose only rewards; persistent sin can cost a believer heaven itself.","outline":{"acronym":"Three passages Paul would not have written","items":[{"letter":"1","label":"1 Cor 6:9-11","point":"Hell for believers stubborn in sin: the unrighteous will not inherit the kingdom.","refs":["1 Cor 6:9-11"]},{"letter":"2","label":"1 Cor 9:27","point":"Hell for preachers stubborn in sin: Paul feared being disqualified.","refs":["1 Cor 9:27"]},{"letter":"3","label":"1 Cor 10","point":"The God who destroyed his stubborn Old Testament people will not hesitate to send New Testament people doing the same to hell.","refs":["1 Cor 10:5-11"]}]},"claims":[{"claim":"Believers will be judged; 'no judgment for believers' is itching-ears teaching","detail":"Teachers who say there is no judgment for believers follow what pleases people, as predicted in 2 Tim 4:3-4. Rom 14:10 says we must all appear before the judgment seat.","refs":["2 Tim 4:3-4","Rom 14:10"],"target":"No judgment for believers"},{"claim":"1 Cor 3:13-15 judges ministry quality, not sins","detail":"Paul teaches that we will be rewarded according to the quality of our ministry. Following a British Bible teacher, the author says what is burned up is what a man has built in ministry, pioneering or maintenance. Some work survives like gold, silver and precious stones, and some burns like wood, hay and stubble, yet the servant himself survives.","refs":["1 Cor 3:13-15","1 Cor 3:6-12"],"target":"Stubborn sinners only lose rewards"},{"claim":"1 Cor 3:16-17: God will destroy whoever destroys his temple","detail":"The next verses show 3:15 is not about sin: 'If anyone destroys God's temple, God will destroy him' (3:16-17). The sin here is dividing the church into factions, and Paul applies the same charge to sexual immorality (6:18-19). We may get away with poor service, but we will not get away with sin.","refs":["1 Cor 3:16-17","1 Cor 6:18-19"],"target":"Sin carries no eternal risk for believers"},{"claim":"1 Cor 6:9-11: the unrighteous will not inherit the kingdom","detail":"If 3:15 excused sinning believers, Paul would not have written in the same book that the sexually immoral, idolaters, adulterers and men who practise homosexuality will not inherit the kingdom (6:9-11).","refs":["1 Cor 6:9-11"],"target":"Sin-excusing reading of 3:15"},{"claim":"1 Cor 9:27: Paul feared being disqualified from heaven","detail":"Paul disciplined his body 'lest after preaching to others I myself should be disqualified' (9:27). He had a healthy fear that yielding to bodily desires (like porn or immorality) would disqualify him from heaven.","refs":["1 Cor 9:27"],"target":"Only rewards at stake for believers"},{"claim":"1 Cor 10 warns believers they can be destroyed for stubborn sin","detail":"1 Corinthians 10 warns New Testament believers that they could be 'destroyed' (go to hell) if they indulge stubborn sin (vv 9-11). The God who destroyed his stubborn Old Testament people will do the same to New Testament people after giving enough chances.","refs":["1 Cor 10:5-11"],"target":"No eternal peril for believers"},{"claim":"Hyper-Grace has replaced the Bible with MBA marketing principles","detail":"Hyper-Grace teachers have lowered biblical standards to attract crowds, treating 'the customer is god' marketing principles as their Bible. For the author, the Bible is the final court of appeal.","refs":["2 Tim 4:3-4"],"target":"Crowd-pleasing compromise"}],"questions":[{"q":"Does 1 Corinthians 3:15 teach only reward loss, with one's place in heaven safe?","answer":"No. It concerns the quality of ministry, and the rest of the letter shows that stubborn sin can cost a believer heaven."},{"q":"Have you read the rest of 1 Corinthians?","answer":"Read 6:9-11, 9:27 and chapter 10, which warn of hell for believers and preachers stubborn in sin."}],"criticisms":[{"of":"Heretic, 'hell-populating' Bible teachers who say there is no judgment for believers","quote":"There is no judgment for believers!","critique":"Their final court of appeal is not the Bible but whatever sounds like music to people's ears, as predicted in 2 Tim 4:3-4."},{"of":"Hyper-Grace cult folks (crowd-attracting)","quote":"","critique":"They lower and flout biblical standards in a fleshly way to attract crowds, treating MBA marketing principles as their Bible."}],"illustrations":[{"title":"MBA marketing textbooks replacing the Bible","story":"The marketing maxim 'always please the customer, as your customer is your god' is pictured as Hyper-Grace's real Bible.","point":"Crowd-pleasing has replaced Scripture as the final authority."},{"title":"Gold, silver, stones vs wood, hay, stubble","story":"Divine fire tests ministry: some work survives and some burns up.","point":"What is judged in 1 Cor 3 is service, not sins."}],"keyVerses":[{"ref":"2 Tim 4:3-4","text":"Having itching ears they will accumulate for themselves teachers to suit their own passions","use":"Predicted rise of false grace teachers"},{"ref":"Rom 14:10","text":"We all must appear before the judgment seat","use":"Believers will be judged"},{"ref":"1 Cor 3:13-15","text":"He will suffer loss, but yet will be saved, even though only as one escaping through the flames","use":"About ministry quality, not sins"},{"ref":"1 Cor 3:16-17","text":"If anyone destroys God's temple, God will destroy him","use":"We won't get away with sin"},{"ref":"1 Cor 6:9","text":"The unrighteous will not inherit the kingdom of God","use":"Hell for believers stubborn in sin"},{"ref":"1 Cor 9:27","text":"Lest after preaching to others I myself should be disqualified","use":"Paul feared losing heaven"},{"ref":"1 Cor 10:9-11","text":"Were destroyed... written for our admonition","use":"God will destroy stubbornly sinning New Testament believers"}],"flow":["'No judgment for believers' suits itching ears","All will stand before the judgment seat","1 Cor 3:13-15 judges service, not sins","3:16-17: temple-destroyers will be destroyed","Rest of letter: 6:9, 9:27, chapter 10","Paul would not have written these if believers were safe"]},{"num":15,"section":"Hyper-Grace","title":"Jesus Loves Sinners but Only Condemns the Self-Righteous! Is This Popular Defense of Hyper-Grace Biblical?","summary":"Originally a reply to a comment on one of the author's YouTube videos, this chapter rejects the claim that Jesus condemns only the self-righteous. Jesus warned that stubborn sin takes anyone to hell, not just Pharisees and hypocrites. He told the man he healed, 'Don't return to a sinning life or something worse might happen' (John 5:14), expecting gratitude to show itself in holy living. Grace enables us to say no to any sin (Titus 2:11-12). Self-righteousness is a sin like porn, drunkenness, foul language, pride, lying, stealing and adultery. Hebrews warns that we cannot receive grace while keeping bitterness (Heb 12:15), and that those strengthened by grace must keep the marriage bed pure or face judgment (Heb 13:4,9). The 'something worse' is hell, eternal conscious torment (Rev 14:9-11; 20:10; 21:8).","thesis":"Jesus does not single out only the self-righteous for condemnation: stubborn sin of any kind leads anyone to hell, and grace received must lead to holy living.","outline":null,"claims":[{"claim":"Stubborn sin takes anyone to hell, not only the self-righteous","detail":"The idea that Jesus loves sinners and condemns only the self-righteous is a popular perception spread by Hyper-Grace pastors. Scripture as a whole shows Jesus warned that stubborn sin takes anyone to hell, not just Pharisees and hypocrites.","refs":["John 5:14"],"target":"Only the self-righteous are condemned"},{"claim":"Jesus demanded holy living from the man he healed (John 5:14)","detail":"The healed man received grace he did not deserve. Jesus expected and demanded that he show gratitude by living a holy, temptation-beating life: 'Don't return to a sinning life or something worse might happen' (John 5:14, MSG). Grace received must lead to holy living.","refs":["John 5:14"],"target":"Grace without a demand for holiness"},{"claim":"Grace enables saying 'no' to any sin, including self-righteousness","detail":"Grateful believers say no to ungodliness and worldly passions (Titus 2:11-12). Self-righteousness, hypocrisy and a Pharisaic attitude are sins just like porn-watching, drunkenness, foul language, pride, lying, stealing and adultery. Neither Jesus nor the Bible separates them.","refs":["Titus 2:11-12"],"target":"Self-righteousness as the only serious sin"},{"claim":"We cannot obtain grace and maintain bitterness (Heb 12:15)","detail":"Hebrews warns that we cannot 'obtain' the grace of God and 'maintain' bitterness toward people we have relationship problems with (Heb 12:15).","refs":["Heb 12:15"],"target":"Grace coexisting with unrepented bitterness"},{"claim":"Those strengthened by grace must keep the marriage bed pure","detail":"Hebrews says hearts are 'strengthened by grace' (13:9), and the same writer says to keep the marriage bed undefiled, enabled by grace, lest we fall into God's judgment of the sexually immoral and adulterers (13:4).","refs":["Heb 13:9","Heb 13:4"],"target":"Sexual sin without consequence"},{"claim":"The 'something worse' is eternal conscious torment in hell","detail":"The 'something worse' Jesus warned of in John 5:14, which can happen to those who love to remain in stubborn sin, is life in hell, a place of eternal, ever-conscious torment (Rev 20:10; 14:9; 21:8).","refs":["John 5:14","Rev 20:10","Rev 14:9-11","Rev 21:8"],"target":"Denial of eternal punishment"}],"questions":[{"q":"Is the popular defense 'Jesus loves sinners but only condemns the self-righteous' biblical?","answer":"No. Jesus warned that stubborn sin takes anyone to hell, and Scripture does not distinguish self-righteousness from other sins."},{"q":"What is the 'something worse' Jesus spoke of in John 5:14?","answer":"Life in hell, a place of eternal, ever-conscious torment."}],"criticisms":[{"of":"Cultic Hyper-Grace pastors/teachers (and a YouTube commenter echoing them)","quote":"Jesus loves sinners! But only condemns the self-righteous!","critique":"This is a popular perception that tells people, in effect, not to worry about sin as long as they are not self-righteous, and it will lead them to hell."}],"illustrations":[{"title":"The healed paralytic's warning","story":"After healing the man invalid for 38 years, Jesus told him in the temple, 'You look wonderful! You're well! Don't return to a sinning life or something worse might happen.'","point":"Grace received must lead to holy living."}],"keyVerses":[{"ref":"John 5:14","text":"Don't return to a sinning life or something worse might happen","use":"Grace demands holy living"},{"ref":"Titus 2:11-12","text":"Say 'no' to ungodliness and worldly passions","use":"Grace enables saying no to any sin"},{"ref":"Heb 12:15","text":"See that no one fails to obtain the grace of God; that no root of bitterness springs up","use":"Cannot obtain grace and maintain bitterness"},{"ref":"Heb 13:4","text":"God will judge the sexually immoral and adulterers","use":"Grace-strengthened believers must stay pure"},{"ref":"Heb 13:9","text":"It is good for the heart to be strengthened by grace","use":"Grace enables purity"},{"ref":"Rev 21:8","text":"Their portion will be in the lake that burns with fire","use":"Eternal conscious torment"}],"flow":["Claim: Jesus condemns only the self-righteous","Jesus warned the healed man about sin","Grace received must lead to holiness","Self-righteousness is one sin among many","Hebrews: no bitterness, keep marriage pure","Stubborn sinners face eternal torment"]},{"num":16,"section":"Hyper-Grace","title":"I Am the Righteousness of God! How the Hyper-Grace Cult Twists This Bible Phrase","summary":"The author affirms confessing 'I am the righteousness of God' (2 Cor 5:21) to resist temptation: 'so I will not lie, watch porn or swear.' Since chapter divisions are not inspired, 2 Cor 5:21 must be read with 2 Cor 6:1, which warns against receiving grace in vain (compare Titus 2:11-12; Rom 3:8; 6:1-2,15). We must use God's abundant grace to overcome temptation. But Hyper-Grace teachers tell people to keep saying 'I am the righteousness of God' even after giving in, as the preacher at the 2012 youth conference did after the author's Proverbs 7 altar call. The Bible calls stubbornly sinning believers 'adulterers' (Jas 4:4) and 'wicked' (1 Cor 5:13), not God's righteousness or God's children. When we sin we must confess and repent immediately (1 John 1:7-9) or wrath builds (Rom 2:4-5), because hell is for the unforgiven.","thesis":"'I am the righteousness of God' is a weapon for resisting temptation, read with 2 Cor 6:1, not a slogan to keep repeating after falling into unrepented sin.","outline":null,"claims":[{"claim":"Confess 'I am the righteousness of God' to overcome temptation","detail":"When the devil brings temptation, say 'I am the righteousness of God; so I will not lie, watch porn or use foul words.' This confession, based on 2 Cor 5:21, helps overcome temptation.","refs":["2 Cor 5:21"],"target":"(Positive teaching on right use)"},{"claim":"2 Cor 5:21 and 6:1 form one unit: don't receive grace in vain","detail":"Chapter divisions are not inspired. The verse after 2 Cor 5:21 is 6:1, which warns against receiving grace in vain (compare Titus 2:11-12; Rom 3:8; 6:1-2,15). If we do not use grace to overcome temptation, we receive it in vain. Read together, the verses show grace gives victory over temptation such as porn or foul language.","refs":["2 Cor 5:21","2 Cor 6:1","Titus 2:11-12","Rom 3:8","Rom 6:1-2","Rom 6:15"],"target":"Context-free use of 2 Cor 5:21"},{"claim":"Hyper-Grace wrongly says to keep confessing righteousness after falling","detail":"Hyper-Grace teachers tell believers to keep saying 'I am the righteousness of God' even after losing to temptation. If we fall, we should not 'foolishly' keep saying it.","refs":["2 Cor 5:21"],"target":"Confessing righteousness while in unrepented sin"},{"claim":"The youth conference preacher used 2 Cor 5:21 to cancel repentance","detail":"After the author's Proverbs 7 message and altar call at the 2012 conference with 1,700 youth, an American Indian Hyper-Grace pastor quoted 2 Cor 5:21 to imply that no one needed to repent of any sin. Such 'wolves in sheep's clothing' twist Scripture to keep youth comfortable in sin.","refs":["2 Cor 5:21","Prov 7"],"target":"Using righteousness to dismiss repentance"},{"claim":"Stubbornly sinning believers are called 'adulterers' and 'wicked', not righteous","detail":"The Bible calls believers stubborn in sin 'adulterers' (Jas 4:4) and called the Corinthian who slept with his mother 'wicked' (1 Cor 5:13), not 'the righteousness of God'. It does not call stubborn sinners 'children of God'.","refs":["Jas 4:4","1 Cor 5:13"],"target":"Sinning believers still the righteousness of God"},{"claim":"Sinning believers must immediately confess, or wrath builds up","detail":"When we sin we must repent and confess immediately, lest God's wrath keep building against us (1 John 1:7-9; Rom 2:4-5). Hyper-Grace says there is no need to confess, which is false, dangerous, hell-leading theology, because hell is for unforgiven people.","refs":["1 John 1:7-9","Rom 2:4-5"],"target":"No need to confess sins"}],"questions":[{"q":"What is the verse found right after 2 Corinthians 5:21?","answer":"2 Corinthians 6:1, which warns against receiving God's grace in vain. The two verses form one unit."},{"q":"Should we keep saying 'I am the righteousness of God' after we fall into temptation?","answer":"No. It is foolish. We must repent and confess immediately, lest wrath build up."}],"criticisms":[{"of":"Hyper-Grace 'heretic, hell-populating false teachers'","quote":"","critique":"They tell believers to keep saying 'I am the righteousness of God' even after losing to temptation and teach that there is no need to repent or confess sins."},{"of":"An American preacher of Indian origin at a 2012 national youth conference","quote":"","critique":"He quoted 2 Cor 5:21 after the author's altar call, implying no one needed to repent. He is described as a 'wolf in sheep's clothing' twisting Scripture to keep youth comfortable in sin."}],"illustrations":[{"title":"After preaching on the naughty boy and the flirty aunty","story":"At the 2012 youth conference, the author's Proverbs 7 message led many to repent of sins including sexual immorality, and then a Hyper-Grace pastor quoted 2 Cor 5:21 to imply no repentance was needed.","point":"Hyper-Grace twists Scripture to keep youth comfortable in sin."},{"title":"Chapter divisions not inspired","story":"2 Corinthians 5 has only 21 verses, so the next verse is 6:1.","point":"Read 5:21 with 6:1 as one unit."}],"keyVerses":[{"ref":"2 Cor 5:21","text":"That in him we might become the righteousness of God","use":"A confession to resist temptation"},{"ref":"2 Cor 6:1","text":"Not to receive God's grace in vain","use":"Use grace to overcome temptation"},{"ref":"Jas 4:4","text":"You adulterous people","use":"Stubbornly sinning believers called adulterers"},{"ref":"1 Cor 5:13","text":"Expel the wicked person","use":"Sinning believer called wicked, not righteous"},{"ref":"1 John 1:7-9","text":"If we confess our sins, he is faithful and just to forgive","use":"Must confess immediately when we sin"},{"ref":"Rom 2:4-5","text":"Storing up wrath","use":"Unconfessed sin builds wrath"}],"flow":["Confess 'I am God's righteousness' against temptation","Read 2 Cor 5:21 with 6:1","Use grace, don't receive it in vain","Hyper-Grace: keep confessing it after falling","Youth conference example of twisted 5:21","Bible calls sinners adulterers, wicked","Confess immediately; hell is for the unforgiven"]},{"num":17,"section":"Hyper-Grace","title":"We Should Not Bother About Our Moral Transformation as Hyper-Grace Cult Pastors Tell Us? The Answer Starting with a Rohit Sharma Story","summary":"The author opens with cricketer Rohit Sharma's turnaround from a 13-run ODI series in 2012 to topping the run charts at the 2019 World Cup, and uses it to invite readers to the far greater transformation Jesus brings (2 Cor 5:17; 1 Sam 10:6). He tells his own story of freezing on a school stage and later, filled with the Spirit, preaching on hell to about 500 people as a 16-year-old. He then attacks the hyper-grace slogan that 'God is after heart transformation and not behaviour modification', quoted from a Singapore megachurch pastor and repeated by a Chennai pastor. Though no one is saved by behaviour modification, he argues, the New Testament demands it of the saved: the Corinthians' former lives (1 Cor 6:9-11), 'quit stealing' (Eph 4:28), newness of life (Rom 6:4), the sexual-ethics requirement of Acts 15 and 21, and Heb 13:4. Heart transformation and obedience cannot be separated (Rom 6:17). He ends by calling hyper-grace teachers 'pillow distributors' who let believers sleep comfortably in sin.","thesis":"Believers are not saved by behaviour modification, but genuine salvation always calls for and produces moral behaviour change, and heart change and obedience cannot be separated.","outline":null,"claims":[{"claim":"Jesus transforms lives more completely than any sporting turnaround","detail":"Rohit Sharma went from being mocked for scoring 13 runs in five ODIs to scoring five centuries in one World Cup. The author uses this to say that anyone tired of their old life needs Jesus, because in Christ one becomes a new creation (2 Cor 5:17) and the Spirit changes a person into 'another man' (1 Sam 10:6).","refs":["2 Cor 5:17","1 Sam 10:6"],"target":"A Christianity without real life change"},{"claim":"The author's own Spirit-filling turned stage fright into bold preaching","detail":"As a schoolboy he fluffed his lines in a drama because some pretty girls were in the audience, and he told the Lord he would never go on stage. After being filled with the Spirit he preached on hell without notes to about 500 students and teachers on that same stage, and a girl fainted. He presents this as a miraculous transformation through the Cross and the Spirit.","refs":["1 Sam 10:6"],"target":"Denial of real Spirit-empowered change"},{"claim":"Hyper-grace pastors say believers needn't bother with moral transformation","detail":"The author quotes a Singapore megachurch pastor's 2010 social-media post, 'God is after heart transformation and not behaviour modification. Only the grace of God can do that in our lives,' and says a Chennai pastor repeats it word for word. He claims that under this influence young believers keep playing music for erotic secular songs and keep having sex outside marriage without much thought.","refs":[],"target":"'Heart transformation, not behaviour modification'"},{"claim":"The New Testament demands behaviour change in those already saved","detail":"The author says we are not saved by behaviour modification, but the New Testament calls for it in the saved. The Corinthians had been sexually immoral, idolaters, thieves and drunkards ('such were some of you', 1 Cor 6:9-11), and the gospel changed their behaviour. You could even call that behaviour modification.","refs":["1 Cor 6:9-11"],"target":"No need for behaviour modification"},{"claim":"Paul's 'quit stealing' command proves practical behaviour change is required","detail":"Eph 4:28 tells the thief to stop stealing, work with his hands, and give to those in need. The author says hyper-grace pastors would not dare claim there is no need for behaviour modification if they read their Bibles properly, and that they preach half-truths to Bible-illiterate audiences. Rom 6:4 adds that the baptised walk in newness of life.","refs":["Eph 4:28","Rom 6:4"],"target":"Grace teachers ignore practical commands"},{"claim":"The early church required sexual moral change of Gentile believers","detail":"Luke records three times (Acts 15:20, 15:29, 21:25) that Gentile believers were expected to abstain from sexual immorality. Heb 13:4 says the marriage bed must be undefiled, because God will judge the sexually immoral and adulterous.","refs":["Acts 15:20","Acts 15:29","Acts 21:25","Heb 13:4"],"target":"Sexual sin treated lightly"},{"claim":"Heart transformation and behaviour modification (obedience) cannot be divorced","detail":"Behaviour modification can be called obedience, and Scripture is full of calls to obey. Paul speaks of obedience 'from the heart' (Rom 6:17). The author says hyper-grace teachers invent a distinction the Bible does not support in order to excuse sin, and that their main agenda is to keep believers comfortable in sinful living.","refs":["Rom 6:17"],"target":"A heart/behaviour distinction used to excuse sin"},{"claim":"Hyper-grace teachers practise 'pillow distribution', letting believers sleep in sin","detail":"At a 2014 hyper-grace awareness conference in Chennai before about 800 church leaders, the author said hyper-grace teachers place the pillow of hyper-grace on modern believers' beds so they can sleep comfortably in sin without being disturbed into repentance.","refs":[],"target":"Grace preaching as a sedative"}],"questions":[{"q":"Do you want your life to be transformed completely? Are you tired of your old life?","answer":"Then you need Jesus. A living daily relationship with him and being filled with the Spirit will transform your life (2 Cor 5:17; 1 Sam 10:6)."},{"q":"Would you give your life to Jesus and stay filled with the Holy Spirit?","answer":"If you do, your life will never be the same."},{"q":"Do hyper-grace pastors even read their Bibles properly?","answer":"The author doubts it. If they did, they would not say believers need no behaviour modification. He thinks they preach half-truths that please Bible-illiterate audiences."}],"criticisms":[{"of":"a Singapore megachurch pastor (anonymised)","quote":"God is after heart transformation and not behaviour modification. Only the grace of God can do that in our lives.","critique":"The author says this invents a distinction the Bible does not make (Rom 6:17), that it excuses sin, and that it ignores the New Testament's many commands to change behaviour."},{"of":"a Chennai pastor (anonymised)","quote":"God is after heart transformation and not behaviour modification.","critique":"The author says he repeats the Singapore pastor's slogan verbatim and spreads the same poison."},{"of":"Hyper-grace teachers in general","quote":"","critique":"The author accuses them of 'pillow distribution', of preaching half-truths to Bible-illiterate audiences, and of having a main agenda of keeping believers comfortable in sin."},{"of":"Young believers influenced by the hyper-grace message","quote":"","critique":"Some keep playing music for erotic secular songs and keep having sex outside marriage regularly without much thought."}],"illustrations":[{"title":"Rohit Sharma's U-turn","story":"Mocked in 2012 after scoring 13 runs in five ODI innings against Sri Lanka, Rohit Sharma topped the 2019 World Cup run charts with five centuries. He credited his family and his focus on the present.","point":"If a cricketer can be transformed like that, Jesus can transform a life completely."},{"title":"Maggi and Rohit troll tweets","story":"Joke tweets said you cook Maggi by adding masala and waiting until Rohit gets out, and that his legs and the stumps don't move unless hit by a ball.","point":"They show how low he had sunk, which makes the later transformation more striking."},{"title":"Pretty girls and the forgotten drama line","story":"The author froze on his school stage, vowed never to go on stage, then after being filled with the Spirit preached on hell for ten minutes to 500 people at 16, and a girl fainted.","point":"The Spirit transforms the fearful into bold witnesses."},{"title":"Pillow distribution","story":"At a 2014 conference in Chennai the author said hyper-grace teachers put pillows on believers' beds.","point":"Hyper-grace lulls believers to sleep in sin and keeps them from repentance."}],"keyVerses":[{"ref":"2 Cor 5:17","text":"If anyone is in Christ, he is a new creation. The old has gone, the new has come!","use":"Jesus brings total transformation."},{"ref":"1 Sam 10:6","text":"The Spirit of the Lord will come upon you mightily... and be changed into another man","use":"Spirit-filling changes a person."},{"ref":"1 Cor 6:11","text":"And that is what some of you were","use":"The Corinthians' behaviour was modified after conversion."},{"ref":"Eph 4:28","text":"If you are a thief, quit stealing","use":"Practical behaviour change is commanded."},{"ref":"Rom 6:4","text":"we too might walk in newness of life","use":"Baptism leads to a changed walk."},{"ref":"Heb 13:4","text":"God will judge the sexually immoral and adulterous","use":"Sexual behaviour must change in believers."},{"ref":"Rom 6:17","text":"obedience from the heart","use":"Heart change and behaviour change are inseparable."}],"flow":["Rohit Sharma's dramatic cricket transformation","Jesus offers far greater transformation (2 Cor 5:17)","Author's own Spirit-filled change from fear to boldness","Hyper-grace says heart change, not behaviour modification","NT commands behaviour change in the saved","Obedience from the heart unites both (Rom 6:17)","Hyper-grace is 'pillow distribution' for sinners"]},{"num":18,"section":"Hyper-Grace","title":"Salvation by Grace, Sanctification by Works: A Response to the Hyper-Grace Camp's Accusation","summary":"The author answers the hyper-grace charge that his camp teaches 'salvation by grace, sanctification by works'. Using a pattern in Philippians of putting the other person first (Jesus and sinners, Timothy and the Philippians, Epaphroditus and Paul), he argues that in Phil 2:12-13 the second element, God working in us, is the more important, so 'work out your salvation with fear and trembling' is a God-powered work and God gets the glory. Reading the letter in one sitting brings us to its closing grace benediction (Phil 4:23), which frames every command as grace-enabled. Col 1:29 and 1 Cor 15:10 likewise pair God's enabling grace with human choice to work hard. The fruit of working out salvation (Phil 2:14-18) is no grumbling, no copying a crooked generation, holding fast the word, being poured out for the gospel and rejoicing. Its reward 'in the day of Christ' shows that holiness is as important as forgiveness for inheriting eternal life. The chapter ends with a call to unity that still allows confronting destructive teaching, and the author describes 'belling the cat' by naming false teachers as Paul did.","thesis":"Working out our salvation with fear and trembling is not salvation or sanctification by works but a grace-enabled, God-powered work, though holiness remains necessary for inheriting eternal life.","outline":{"acronym":"Three examples of putting the other person first (Philippians)","items":[{"letter":"1","label":"Jesus and sinners","point":"Jesus put sinners ahead of himself and died for them on the Cross.","refs":["Phil 2:6-10"]},{"letter":"2","label":"Timothy and the church at Philippi","point":"Timothy put the Philippians' welfare before his own.","refs":["Phil 2:19-24"]},{"letter":"3","label":"Epaphroditus and Paul","point":"Epaphroditus put Paul's life ahead of his own.","refs":["Phil 2:25-30"]}]},"outlines":[{"acronym":"Fruit of working out salvation: things we will not do","items":[{"letter":"1","label":"Not grumble","point":"We will not grumble.","refs":["Phil 2:14"]},{"letter":"2","label":"Not question authorities unfairly","point":"We will not unfairly question the authorities God has placed over us.","refs":["Phil 2:14"]},{"letter":"3","label":"Not copy the crooked generation","point":"We will not imitate the porn-watching, bisexuality-embracing, bad-language-using generation around us.","refs":["Phil 2:15"]}]},{"acronym":"Fruit of working out salvation: things we will do","items":[{"letter":"1","label":"Hold fast the Word of Life","point":"We will be diligent in Bible study.","refs":["Phil 2:16"]},{"letter":"2","label":"Pour out our lives for the Gospel","point":"We will be ready to give our lives, as Jim Elliot and John Allen Chau were.","refs":["Phil 2:17"]},{"letter":"3","label":"Rejoice with fellow believers","point":"Our joy will depend on Him, not on happenings; Paul wrote from prison.","refs":["Phil 2:18","Phil 1:7"]}]}],"claims":[{"claim":"Philippians repeatedly shows the second party being more important than the first","detail":"Philippians gives three examples of putting the other first: Jesus and sinners (2:6-10), Timothy and the church (2:19-24), Epaphroditus and Paul (2:25-30). The author applies this pattern to 2:12-13. 'Work out your salvation' is the first element, and 'God who works in you' is the second and more important one. So the glory goes to God and not to us.","refs":["Phil 2:6-10","Phil 2:19-24","Phil 2:25-30","Phil 2:12-13"],"target":"Accusation that the author's camp teaches sanctification by works"},{"claim":"Read the epistle in one sitting: Phil 4:23 frames everything as grace","detail":"Letters should be read in one sitting, the way the author's fiancée read his marriage-proposal letter in 1999. If we read Philippians to the end, we reach 'The grace of the Lord Jesus be with your spirit' (4:23). So everything Paul commands, including working out salvation, must be done by the Lord's enabling grace and not by self-effort.","refs":["Phil 4:23","Phil 2:12"],"target":"Philippians read as a call to self-effort"},{"claim":"God's enabling grace is coupled with human choice to work hard","detail":"Paul strenuously contends 'with all the energy Christ so powerfully works in me' (Col 1:29), and 'I worked harder than all of them, yet not I, but the grace of God that was with me' (1 Cor 15:10). So when a believer works out salvation, it is the grace of God within him that works. Salvation is by grace (Eph 2:8-9) and enabling grace makes obedience possible.","refs":["Col 1:29","1 Cor 15:10","Eph 2:8-9"],"target":"Grace versus effort as opposites"},{"claim":"Working out salvation produces specific fruit (Phil 2:14-18)","detail":"Those who work out their salvation will not grumble, will not unfairly question God-given authority, and will not copy the crooked generation that watches porn, embraces bisexuality and uses bad language. They will hold fast the Word of Life, be ready to pour out their lives like Jim Elliot and John Allen Chau, and rejoice in Him whatever their circumstances, as Paul did in prison.","refs":["Phil 2:14-18","Phil 1:7"],"target":"Grace without visible fruit"},{"claim":"Holiness is as important as forgiveness to inherit eternal life","detail":"The reward for working out salvation is that 'in the day of Christ' (the final judgment) we will make our spiritual mentors proud (Phil 2:16). The author concludes that holiness is as important as forgiveness to inherit eternal life on that day. Salvation is by grace (Eph 2:8-9) but always produces good works (Eph 2:10). Those works do not save, but the truly saved will produce them.","refs":["Phil 2:16","Eph 2:8-10"],"target":"Forgiveness without holiness"},{"claim":"Phil 2:12-13 does not teach salvation by works","detail":"Read in context, the work involved is not self-work but God-powered work, so Philippians 2:12-13 cannot be used to accuse the author's camp of teaching salvation or sanctification by works. Quoting a commentator, he says Christians are recipients of God's initiatives of motivation and empowerment.","refs":["Phil 2:12-13"],"target":"'Salvation by grace, sanctification by works' accusation"},{"claim":"Unity matters, but someone must 'bell the cat' against destructive teaching","detail":"Phil 2:1-2 and 2:14 call for unity and against grumbling at church leadership. Even so, when a church acts in a way that harms the kingdom, believers must act. When a visiting preacher said the Holy Spirit does not convict believers of sin, the author and his wife raised it with the pastor who invited him. At the 2014 Chennai conference the presenters agreed to name hyper-grace teachers, following Paul's example (1 Tim 1:19-20; 2 Tim 2:17).","refs":["Phil 2:1-2","Phil 2:14","1 Tim 1:19-20","2 Tim 2:17"],"target":"Silence about false teaching; 'the Spirit does not convict believers'"}],"questions":[{"q":"Do you guys teach salvation by grace but sanctification by works?","answer":"No. Working out salvation is enabled and powered by God's grace (Phil 2:13; 1 Cor 15:10), so God gets the glory. But genuine salvation always produces good works, and holiness is necessary on the day of Christ."},{"q":"What is the outcome of working out our salvation with fear and trembling?","answer":"No grumbling, no unfair questioning of authority, no copying the crooked generation. Instead, holding fast the Word, being poured out for the gospel, and rejoicing with other believers (Phil 2:14-18)."},{"q":"What is the reward for working out our salvation?","answer":"In the day of Christ we will make our spiritual mentors proud (Phil 2:16), which shows that holiness is as important as forgiveness to inherit eternal life."},{"q":"What is the connection between Christ's humiliation and exaltation (Phil 2:5-11) and the call to stop grumbling (2:14)?","answer":"Phil 2:1-2 gives the clue: it is a call to unity, because some Philippians were arrogantly grumbling against church leadership."}],"criticisms":[{"of":"The hyper-grace camp (anonymised)","quote":"Salvation by grace; sanctification by works - you guys teach this.","critique":"The author rejects the accusation. Phil 2:12-13 is a God-powered work and gives God the glory, so his camp does not teach sanctification by works."},{"of":"A visiting preacher (anonymised)","quote":"The Holy Spirit does not convict believers of sin.","critique":"The author and his wife confronted the pastor who invited him, regarding the claim as kingdom-destroying."},{"of":"Hyper-grace false teachers named at the 2014 Chennai conference (anonymised)","quote":"","critique":"The presenters agreed to name them publicly, following Paul's example in 1 Tim 1:19-20 and 2 Tim 2:17."}],"illustrations":[{"title":"The marriage-proposal letter (1999)","story":"As a Bible college student the author wrote a long letter proposing marriage, and his future wife read all of it in one sitting.","point":"Epistles should be read in one sitting, which brings us to Phil 4:23's grace benediction framing every command."},{"title":"Jim Elliot and John Allen Chau","story":"Missionaries who were ready to pour out their lives for the gospel.","point":"They model Phil 2:17, being poured out as a drink offering."},{"title":"Belling the cat","story":"The author and his wife challenged a visiting preacher's teaching and agreed to name hyper-grace teachers at a 2014 conference, which made them unpopular.","point":"Someone has to have the courage to confront hell-populating false teaching."}],"keyVerses":[{"ref":"Phil 2:12","text":"work out your salvation with fear and trembling","use":"The key text, interpreted as grace-enabled work."},{"ref":"Phil 2:13","text":"for it is God who works in you, both to will and to work for his good pleasure","use":"God's work is the more important element."},{"ref":"Phil 4:23","text":"The grace of the Lord Jesus be with your spirit","use":"The closing benediction frames all commands as grace-enabled."},{"ref":"Col 1:29","text":"with all the energy Christ so powerfully works in me","use":"Human effort powered by Christ."},{"ref":"1 Cor 15:10","text":"I worked harder than all of them - yet not I, but the grace of God that was with me","use":"Grace and human choice coupled."},{"ref":"Eph 2:10","text":"created in Christ Jesus for good works","use":"Salvation by grace always results in good works."},{"ref":"Phil 2:16","text":"in the day of Christ","use":"Holiness matters at the final judgment."}],"flow":["Hyper-grace accuses: 'sanctification by works'","Philippians pattern: the second party matters more","Phil 2:13: God's work outweighs ours","Read whole letter: grace benediction frames commands","Col 1:29 and 1 Cor 15:10 couple grace and effort","Fruit: no grumbling, holding the Word, joy","Reward: holiness matters on the day of Christ","Unity, yet bell the cat against false teaching"]},{"num":19,"section":"Hyper-Grace","title":"The Blood of Jesus Is No Excuse to Continue in Wanton Sin","summary":"The author counters the hyper-grace idea that it does not matter whether believers live holy lives, because the Father sees only the blood of Jesus when he looks at them. If besetting sin could not be overcome, Scripture would not command us to lay it aside (Heb 12:1). The Cross does more than purify (1 John 1:7). It gives power over habitual sin, so we can 'wallop' and 'crush' it (1 Pet 2:24; Gal 5:24; Gal 6:14). He then sets out four 'P's linking the blood of Christ to victory: Peace (sin destroys the peace Christ bought), Preciousness (being redeemed at great cost, illustrated by Hosea buying back his wife), Profaning (deliberate sin profanes the blood of the covenant, Heb 10:26-29), and Persecution (the blood of the Lamb gives courage to resist sin even when it brings persecution, Rev 12:11; Heb 12:4). Keeping these connected to the Cross makes habitual sin (1 John 3:6) a thing of the past.","thesis":"The blood of Jesus does not excuse continued sin but cleanses us and empowers us to overcome besetting sin.","outline":{"acronym":"Four P's: the blood of Christ and victory over besetting sin","items":[{"letter":"P","label":"Peace","point":"Christ's punishment brought us peace. Choosing sin first costs us that peace, and knowing this should deter us from erotic web series or online affairs.","refs":["Isa 53:5","Rom 5:1"]},{"letter":"P","label":"Preciousness","point":"We were redeemed with Christ's precious blood, which makes returning to old sins atrocious. Like Hosea's redeemed wife, we must stop our former ways and glorify God in our bodies.","refs":["1 Pet 1:18-19","Hos 3:2-3","1 Cor 6:20"]},{"letter":"P","label":"Profaning","point":"Deliberately going on in sin after receiving the truth profanes the blood of the covenant and deserves worse punishment.","refs":["Heb 10:26","Heb 10:29"]},{"letter":"P","label":"Persecution","point":"Overcomers conquered by the blood of the Lamb and did not love their lives to the death. Christ's boldness gives courage to say no to sin despite opposition.","refs":["Rev 12:9-11","John 18:4-6","Heb 12:4"]}]},"claims":[{"claim":"Scripture commands overcoming besetting sin, so it must be possible","detail":"If it were impossible to overcome besetting sin, the Bible would not tell us to lay it aside. Heb 12:1 does exactly that: lay aside every weight and the sin that so easily besets us, and run the race with patience.","refs":["Heb 12:1"],"target":"Resignation to besetting sin"},{"claim":"The Cross gives power over sin, not just purification","detail":"The blood of Jesus cleanses us from all sin (1 John 1:7), but some are satisfied with cleansing alone. The Cross does more than purify: it gives power, so we can wallop sin and crush its grip. Christ bore our sins 'that we might die to sin and live to righteousness' (1 Pet 2:24). Those who belong to Christ have crucified the flesh (Gal 5:24), and through the Cross the world has been crucified to Paul (Gal 6:14).","refs":["1 John 1:7","1 Pet 2:24","Gal 5:24","Gal 6:14"],"target":"Cross as cleansing only"},{"claim":"Hyper-grace lie: God sees the blood, so overcoming sin doesn't matter","detail":"The author says hyper-grace effectively teaches that God looks at the blood of Jesus when he looks at believers, so it does not matter whether they overcome sin. He says only someone stone-blind or under cultic hell-populating teaching could miss the link between the Cross and victory over sin.","refs":[],"target":"'When the Father looks at us, He sees the Blood of Jesus'"},{"claim":"Peace: sin first destroys the peace Christ's punishment bought","detail":"'The punishment that brought us peace was upon Him' (Isa 53:5), and 'we have peace with God because of what Jesus Christ our Lord has done' (Rom 5:1). When a believer sins, the first result is loss of peace. Knowing this should deter us from erotic web series or online affairs, because our peace would 'go for a six'. We should overcome temptation by tapping the Spirit's power.","refs":["Isa 53:5","Rom 5:1"],"target":"Indifference to sin's effects"},{"claim":"Preciousness: Christ's costly blood makes returning to sin atrocious","detail":"We were ransomed not with silver or gold but with the precious blood of Christ (1 Pet 1:18-19). Seeing how precious it is shows how atrocious it is to keep returning to porn, drunkenness or abusive language. Being bought with a price, we must glorify God in our bodies (1 Cor 6:20) and stay away from habits like porn-linked masturbation, drugs, alcohol and sex outside marriage.","refs":["1 Pet 1:18-19","1 Cor 6:20"],"target":"Cheapened grace"},{"claim":"Hosea's redeemed wife had to stop prostitution; so must the redeemed","detail":"Hosea bought back his wife from the red-light district for 15 shekels of silver, barley and wine, a large sum when a slave cost 30 shekels (Exod 21:32; Zech 11:12). He then told her not to go back to prostitution (Hos 3:3). Having been bought with Christ's far more precious blood, we too must make efforts to overcome sin.","refs":["Hos 3:2-3","Exod 21:32","Zech 11:12","1 Cor 6:20"],"target":"Redemption with no change of life"},{"claim":"Profaning: deliberate continued sin profanes the covenant blood","detail":"Heb 10:29 warns of worse punishment for anyone who has spurned the Son of God, profaned the blood of the covenant by which he was sanctified, and outraged the Spirit of grace. Heb 10:26 says this happens when we deliberately keep on sinning after receiving the truth. So when tempted by a profane web series on a streaming service, we should tell ourselves we will not profane Jesus' blood.","refs":["Heb 10:26","Heb 10:29"],"target":"Wilful sin without consequence"},{"claim":"Persecution: the Lamb's blood gives courage to resist sin to death","detail":"Overcomers conquered the devil 'by the blood of the Lamb and by the word of their testimony, for they loved not their lives even unto death' (Rev 12:11). Jesus boldly faced the arrest party, and his 'I am he' threw them to the ground (John 18:4-6). His blood gives courage to say no to sin despite persecution from government or employer, so the complaint of Heb 12:4 ('not yet resisted to the point of shedding blood') will not apply to us.","refs":["Rev 12:9-11","John 18:4-6","Heb 12:4"],"target":"Compromising with sin to escape opposition"},{"claim":"Connect the four P's to the Cross and habitual sin will end","detail":"If believers keep connecting Peace, Preciousness, Profaning and Persecution with the Cross, the habitual sin that Scripture warns against (1 John 3:6) will be a thing of the past.","refs":["1 John 3:6"],"target":"Habitual sin as normal Christianity"}],"questions":[{"q":"Does the Cross cleanse us from sin?","answer":"Of course (1 John 1:7). But it does more than purify; it gives power to wallop and crush besetting sin."},{"q":"When do we profane the blood of Christ?","answer":"When we deliberately keep on sinning after receiving the knowledge of the truth (Heb 10:26), for example by watching a profane web series."},{"q":"Is it possible to beat besetting sin?","answer":"Yes, through the blood of Jesus and the Spirit's empowerment."}],"criticisms":[{"of":"Hyper-grace teachers (anonymised)","quote":"It does not matter if we lived holy lives or not, because, when the Father looks at us, believers, He sees the Blood of Jesus and He is perfectly pleased with what he sees!","critique":"The author calls this a brazen lie that ignores Scripture's clear link between the Cross and victory over besetting sin."},{"of":"Hyper-grace teaching labelled 'cultic' and 'hell-populating'","quote":"","critique":"The author says one must be stone-blind or under its influence to miss the link between the Cross and victory over sin."}],"illustrations":[{"title":"The erotic web series temptation","story":"A believer is tempted to watch a web series full of erotic scenes on a streaming service, or to start an online affair.","point":"Sin would cost us our peace and profane Christ's blood, so we should overcome it in the Spirit's power."},{"title":"Peace going for a six","story":"A cricket image: wanton sin sends our serenity flying out of the ground like a six.","point":"Losing peace should deter us from sin."},{"title":"Hosea redeems his wife from the red-light area","story":"Hosea paid 15 shekels of silver plus barley and wine, a great price, then told her not to return to prostitution (Hos 3:2-3).","point":"Bought with Christ's far more precious blood, we must stop our old sins."},{"title":"The price of a kidney","story":"Today buying a kidney costs a fortune, so imagine the price of a whole person.","point":"This shows how great Hosea's and Christ's redemption prices were."},{"title":"'I am he' and the arrest party","story":"Jesus boldly stepped forward to the Roman arrest party, and his words threw them to the ground (John 18:4-6).","point":"Christ's boldness and blood give us courage to resist sin despite persecution."}],"keyVerses":[{"ref":"Heb 12:1","text":"lay aside every weight, and the sin which doth so easily beset us","use":"Overcoming besetting sin is commanded, so it is possible."},{"ref":"1 John 1:7","text":"the blood of Jesus his son cleanses us from all sin","use":"The Cross purifies, but does more."},{"ref":"1 Pet 2:24","text":"that we might die to sin and live to righteousness","use":"The Cross aims at victory over sin."},{"ref":"Gal 5:24","text":"Those who belong to Jesus have crucified the flesh","use":"Cross-based victory over passions."},{"ref":"Isa 53:5","text":"the punishment that brought us peace was upon Him","use":"P1: Peace."},{"ref":"1 Pet 1:18-19","text":"ransomed... with the precious blood of Christ","use":"P2: Preciousness."},{"ref":"Heb 10:29","text":"profaned the blood of the covenant","use":"P3: Profaning."},{"ref":"Rev 12:11","text":"they have conquered him by the blood of the Lamb","use":"P4: Persecution."},{"ref":"1 John 3:6","text":"No one who abides in him keeps on sinning","use":"Habitual sin can become a thing of the past."}],"flow":["Hyper-grace: Father sees blood, holiness irrelevant","Heb 12:1 commands laying aside besetting sin","Cross cleanses and also empowers victory","Peace: sin forfeits Christ-bought peace","Preciousness: costly blood, like Hosea's ransom","Profaning: wilful sin profanes covenant blood","Persecution: Lamb's blood gives courage to resist","Four P's end habitual sin (1 John 3:6)"]},{"num":20,"section":"Hyper-Grace","title":"Can a Saved Person Ever Be Lost in Hell?","summary":"Originally a term paper the author wrote in Bible college, this chapter argues against eternal security ('once saved, always saved'), which he links to hyper-Calvinism and hyper-grace, and teaches that a believer who wilfully and stubbornly lives in unrepentant sin until death or the Second Coming will be lost. He opens with Lance Armstrong being stripped of his titles, sets out the Reformed and Arminian positions with a brief history (Augustine, Calvin, Arminius, Wesley), and then presents scriptural, theological and philosophical evidence. From the Old Testament he traces the 'if' conditions through Cain and the Abrahamic, Sinaitic and Davidic covenants and the prophets (citing a claim of 63 'if' texts). From the New Testament he gives three kinds of evidence: exhortations to continue, warnings against apostasy (especially Hebrews), and actual cases of apostasy (Demas, the false teachers of 2 Pet 2, Ananias and Sapphira, Simon the Sorcerer, Judas). He answers proof texts for eternal security: John 17, John 10:28, John 5:24, the Spirit's seal and guarantee, Rom 8:9 and John 14:16. He says the Spirit can finally leave a stubborn believer, after which repentance is impossible. Theologically, he says classical Calvinists and Arminians mean much the same in different words, defends faith as non-meritorious and rejects limited atonement. Philosophically, he argues that God overriding free will would be evil. He closes with practical implications (self-examination, Jude 21 and 24, Bunyan's 'way to hell even from the gates of heaven'), 2 Tim 2:12 and an appeal to backsliders to repent.","thesis":"Salvation is conditional on continuing faith and obedience, so a genuinely saved person who stubbornly lives in unrepentant sin until death or Christ's return can lose salvation and go to hell.","outlines":[{"acronym":"Old Testament 'if' conditions","items":[{"letter":"1","label":"Conditional from the beginning","point":"God's 'if' to Cain; Cain refused and left the Lord's presence.","refs":["Gen 4:7","Gen 4:16","Heb 11:4","1 John 3:12","Jude 11"]},{"letter":"2","label":"Abrahamic covenant","point":"Abraham's 'As for you' balances God's 'As for me'; faith needs the obedience of faith.","refs":["Gen 17:4","Gen 17:9","Rom 1:5"]},{"letter":"3","label":"Sinaitic covenant","point":"Punctuated by 'if' clauses; the curses outnumber the blessings.","refs":["Lev 26:3-13"]},{"letter":"4","label":"Davidic covenant","point":"Solomon's kingdom lasts forever 'if he continues to obey'.","refs":["1 Chr 28:6-7"]},{"letter":"5","label":"The prophets","point":"Isaiah, Azariah, Jeremiah's temple sermon, Ezekiel and Malachi all use 'if'.","refs":["Isa 1:19-20","2 Chr 7:14","Jer 7:6-7","Ezek 18:21","Mal 2:2"]},{"letter":"6","label":"The New Testament seconds it","point":"'If you do these things, you will never stumble.'","refs":["2 Pet 1:10"]}]},{"acronym":"New Testament evidence (three types)","items":[{"letter":"1","label":"Exhortations to continue in the faith","point":"These would be ludicrous if falling away were impossible.","refs":["Matt 10:22","John 8:31","John 15:5-6","1 Cor 16:13","Heb 3:14","Rev 2:10","Rev 3:11"]},{"letter":"2","label":"Warnings against apostasy","point":"Be on guard lest you fall from your secure position; the Hebrews warnings.","refs":["2 Pet 3:17-18","Heb 6:4-8"]},{"letter":"3","label":"Cases of actual apostasy","point":"Those who believe for a while, faith shipwrecked, Demas, false teachers, names removed, Ananias, Sapphira, Simon.","refs":["Luke 8:13","Matt 24:10-12","1 Tim 1:19","2 Tim 4:10","2 Pet 2:20-22","Rev 22:19","Acts 5:1-11","Acts 8:13-24"]}]},{"acronym":"Conditions for perseverance (from a charismatic systematic theologian)","items":[{"letter":"a","label":"Our abiding","point":"Remaining in the word and in Christ.","refs":["1 John 2:24-25","Heb 2:1-3","John 15:3-7"]},{"letter":"b","label":"Our continuing","point":"Continuing in the faith, stable and steadfast.","refs":["Col 1:21-23","Rom 11:11-22","1 Tim 4:16"]},{"letter":"c","label":"Our enduring","point":"Enduring to the end.","refs":["2 Tim 2:10-12","Heb 10:34-39","Matt 24:12-13"]},{"letter":"d","label":"Our firmness","point":"Holding firm our confidence; confirming our calling.","refs":["Heb 3:1-6","2 Pet 1:5-11","2 Pet 2:1-21"]},{"letter":"e","label":"Our faithfulness","point":"Being faithful unto death; returning to first love.","refs":["Rev 2:10","Rev 2:4-5","Heb 6:4-8"]}]},{"acronym":"Hebrews' warning passages (summarised by an evangelical commentator)","items":[{"letter":"1","label":"Pay attention, lest you drift away","point":"","refs":["Heb 2:1-4"]},{"letter":"2","label":"Do not harden your heart, lest you fail","point":"","refs":["Heb 3:1-19"]},{"letter":"3","label":"Fear not, lest you fall short","point":"","refs":["Heb 4:1-13"]},{"letter":"4","label":"Press on, lest you fall away","point":"","refs":["Heb 5:11-6:12"]},{"letter":"5","label":"Hold fast, lest you die","point":"","refs":["Heb 10:19-39"]},{"letter":"6","label":"Be careful, lest you fall short","point":"","refs":["Heb 12:1-17"]}]}],"claims":[{"claim":"Like Armstrong's stripped titles, wilful sin can forfeit salvation","detail":"Lance Armstrong lost his seven Tour de France titles, and possibly the Legion d'Honneur, after admitting he doped. The author asks: if a sportsman can lose titles won by wilful fraud, are we right to say that we will lose our salvation if we wilfully live in sin?","refs":[],"target":"Once saved, always saved"},{"claim":"Eternal security is a core salvation question needing agreement in truth","detail":"Whether a saved person can be lost has divided Christians for centuries. Peripheral doctrines can be overlooked, but this one concerns salvation itself, so believers must work towards agreement based on truth. The author first wrote the chapter as a 25-year-old in his Master of Divinity programme and has updated it until May 2024.","refs":[],"target":"Treating security as a side issue"},{"claim":"The Reformed definition versus warnings that believers can be damned","detail":"The author quotes a Reformed theologian's definition: everyone the Father chose, called, justified and adopted will certainly persevere and never be finally lost. He sets against it an evangelical New Testament scholar who warns that believers can backslide and be damned if they do not persevere.","refs":[],"target":"Reformed perseverance doctrine"},{"claim":"History: Augustine and Calvin versus Arminius and Wesley","detail":"Augustine was among the first to teach unconditional salvation. Calvin taught that the saints will persevere and their free will plays no part. Arminius held that a saved person can go to hell by rebelling, and the book says he challenged Wesley about certainty of salvation. Wesley agreed with Arminius in effect: God gives sufficient grace to persevere, but it is up to us to receive it, and we can choose against God and be lost at any time.","refs":[],"target":"Unconditional perseverance"},{"claim":"Like a President denying mercy, unrepentant believers get no heaven","detail":"Former Indian President Pranab Mukherjee rejected a record number of mercy petitions, including those of Ajmal Kasab, Afzal Guru and associates of Veerappan, which upheld the principle of no mercy for callous crimes. In the same way, some Bible scholars teach that there is no heaven for believers who deliberately live in sin without repenting until death or Christ's return. The author lists Reformed scholars who held eternal security and a newer group of scholars who warn of falling away, using Scripture, philosophy and logic.","refs":[],"target":"Mercy for unrepentant believers"},{"claim":"Salvation was conditional from the beginning: God's 'if' to Cain","detail":"God told Cain, 'it will be accepted if you respond the right way; but if you refuse... watch out!' (Gen 4:7). Cain ignored the condition, was rejected and left the Lord's presence (Gen 4:16). The New Testament warns against 'the way of Cain' (Heb 11:4; 1 John 3:12; Jude 11).","refs":["Gen 4:7","Gen 4:16","Heb 11:4","1 John 3:12","Jude 11"],"target":"Unconditional salvation"},{"claim":"The Abrahamic covenant was conditional: 'As for you' balances 'As for me'","detail":"Quoting a study Bible note, the author says Abraham's 'As for you' (Gen 17:9) balances God's 'As for me' (Gen 17:4). Abraham's faith had to be accompanied by 'the obedience that comes from faith' (Rom 1:5).","refs":["Gen 17:4","Gen 17:9","Rom 1:5"],"target":"Unconditional covenant"},{"claim":"The Sinai covenant had 'if' clauses and more curses than blessings","detail":"Before God concluded the Sinai covenant it was full of 'if' clauses, and the list of curses for disobedience is usually much longer than the blessings for obedience (Lev 26:3-13).","refs":["Lev 26:3-13"],"target":"Unconditional covenant"},{"claim":"The Davidic covenant had an unmistakable 'if' about Solomon","detail":"God said of Solomon, 'if he continues to obey my commands and regulations as he does now, I will make his kingdom last forever' (1 Chr 28:6-7). The 'if' cannot be missed.","refs":["1 Chr 28:6-7"],"target":"Unconditional covenant"},{"claim":"The prophets repeatedly preached the 'if' condition","detail":"Isaiah: 'If you will only obey me... But if you keep turning away... you will be destroyed' (Isa 1:19-20). The author attributes the famous 'if' of 2 Chr 7:14 to the prophet Azariah's words to Asa. Jeremiah's temple sermon: if you stop oppressing, murdering and worshipping idols, I will let you stay in the land (Jer 7:6-7). Ezekiel: if the wicked turn, they will live. Malachi: 'if you do not listen... I will curse your blessings' (Mal 2:2).","refs":["Isa 1:19-20","2 Chr 7:14","2 Chr 15:2","Jer 7:6-7","Ezek 18:21","Mal 2:2"],"target":"Unconditional salvation"},{"claim":"The New Testament seconds the 'if': confirm your calling (2 Pet 1:10)","detail":"'Make every effort to confirm your calling and election. For if you do these things, you will never stumble' (2 Pet 1:10). The New Testament agrees with the Old Testament's 'if' teaching instead of contradicting it. The author adds Kipling's poem 'If' and a writer's count of 63 'if' texts in the Old Testament, which he says unanimously support
