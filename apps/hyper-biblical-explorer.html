6 to say God always heals immediately, but the word 'pray' means requesting God, refuting the claim that we must never pray for healing but only command it. Saying 'be healed in Jesus' name' itself submits to his will. Read with James 4's submission to God's will, James 5 means God answers a righteous person's prayer if it is his will.","refs":["Jas 5:16","Jas 4:13-15"],"target":"Commanding instead of praying"},{"claim":"Isaiah 45:11 KJV is a mistranslation; we must not command God","detail":"Hyper-supernatural pastors use the KJ21 rendering 'concerning the work of my hands command ye me' to teach commanding God. This is a rare wrong translation; the ESV and NLT render it as a rebuke: 'Do you give me orders about the work of my hands?' We must not command God but surrender to his will.","refs":["Isa 45:11"],"target":"Commanding God in prayer"},{"claim":"Don't pray for what Scripture forbids; God may grant it in wrath","detail":"Praying to marry an unbeliever contradicts 1 Cor 7:39. God sometimes gives what people selfishly ask, in exasperation and wrath, not for their blessing: quail with a wasting disease (Ps 106:15; Ps 78:29-31), and King Saul given in anger (Acts 13:21; Hos 13:11).","refs":["1 Cor 7:39","Ps 106:15","Ps 78:29-31","Acts 13:21","Hos 13:11"],"target":"Selfish, anti-Bible prayers"},{"claim":"Bible heroes submitted to God's will even when prayers failed","detail":"David worshipped after his child died despite fasting (2 Sam 12:15-20); the three Hebrews said 'but if not' (Dan 3:16-18); Esther said 'if I perish, I perish' (Esth 4:15-16); Habakkuk rejoiced amid crop failure (Hab 3:17-18). They refute the claim that God does miracles at our beck and call.","refs":["2 Sam 12:15-20","Dan 3:16-18","Esth 4:15-16","Hab 3:17-18"],"target":"Miracles at our beck and call"},{"claim":"'Perhaps' theology: even salvation rests on God's sovereign will","detail":"God is sovereign (Dan 4:35). Zephaniah 2:3's 'perhaps you will be sheltered' shows even salvation from the Lord's anger depends on his sovereign will. God has repeatedly said it is his will to save (Ezek 18:32; 33:11; 1 Tim 2:4; 2 Pet 3:9), but there are no such repeated statements about healing. Jonathan, Zedekiah, Amos and Peter to Simon also used 'perhaps'.","refs":["Dan 4:35","Zeph 2:3","Ezek 18:32","Ezek 33:11","1 Tim 2:4","2 Pet 3:9","1 Sam 14:6","Jer 21:2","Amos 5:15","Acts 8:22"],"target":"Certainty of healing on command"},{"claim":"Believers are not little gods; Psalm 82:6 is misread","detail":"A Madurai pastor teaches believers are gods from Ps 82:6 and John 10:34. But there is only one God in Trinity (Titus 2:13; Acts 5:3-5); Ps 82 shows that if other gods existed they are under the judgment of Israel's God. Herod, struck down for accepting divine praise (Acts 12:21-23), shows humans are not gods. Believers should remain in their 'Crete' and 'Ephesus' to fight false teaching (Titus 1:5-9; 1 Tim 1:3).","refs":["Ps 82:6","John 10:34","Titus 2:13","Acts 5:3-5","Acts 12:21-23","Titus 1:5-9","1 Tim 1:3"],"target":"'Little gods' teaching"},{"claim":"Exodus 4:16 and 7:1 make Moses God's mouthpiece, not a god","detail":"Exodus 20:3, Deut 6:4 and Isa 43:10 affirm one God; clear passages take precedence. 'You shall be as God to them' (Exod 4:16) means Moses was God's mouthpiece, and Exod 7:1 means he was God's ambassador to Pharaoh. God uniquely inspired Moses; the canon is closed (2 Tim 3:16; Jude 3). We are Christ's ambassadors (2 Cor 5:20), but not gods.","refs":["Exod 4:16","Exod 7:1","Exod 20:3","Deut 6:4","Isa 43:10","2 Tim 3:16","Jude 3","2 Cor 5:20"],"target":"'Little gods' from Exodus"}],"questions":[{"q":"Can we command disease to go?","answer":"Only in the name of Jesus, meaning in his authority; the miracle will happen at the time he decides, not always at once."},{"q":"Can we command God in prayer?","answer":"No; Isa 45:11 in accurate translations rebukes giving God orders; we must surrender to his will."},{"q":"Did Jesus envision a disease-free, death-free life for his followers?","answer":"No; Matt 10:28 concedes death by persecution, so pray for healing but know disease and death may still come."},{"q":"What about moving mountains via prayer? Isn't 'name it and claim it' biblical?","answer":"We must use the whole counsel of God; John's later writings clarify that God answers only according to his will."},{"q":"Does James 5:16 teach that God always heals immediately?","answer":"No; it teaches praying, not commanding, and that God answers a righteous person's prayer if it is his will."},{"q":"Did Prophet Isaiah ask us to command God in prayer?","answer":"No; the KJ21 rendering of Isa 45:11 is a mistranslation; ESV and NLT show it is a rebuke."},{"q":"Would my son ask me for drugs, alcohol or porn?","answer":"No, knowing his father; likewise we ask Jesus only for what his Word approves, saying 'see your convenience'."},{"q":"Are we little gods who can command a miracle?","answer":"No; Ps 82:6, John 10:34, Exod 4:16 and 7:1 do not teach this; there is one God, and Herod was struck down for claiming divinity."}],"criticisms":[{"of":"hyper-supernaturalism leaders (anonymised)","quote":"I command... I decree...","critique":"They teach commanding disease to go and even commanding God to act as we want at that time (described as Dominion Theology)."},{"of":"believers influenced by hyper-supernaturalism (anonymised)","quote":"","critique":"Unlike Epaphras, they wrestle against God's will while they pray."},{"of":"those embracing the hyper-supernatural 'name it and claim it' teaching (anonymised)","quote":"Jesus says in at least four places, 'Ask anything with faith and you will get it'; so what is wrong in believing 'name it and claim it'?","critique":"They formulate doctrine from four Matthew passages while neglecting the whole counsel, especially John's clarifications."},{"of":"hyper-supernatural pastors who say never pray for healing, only command (anonymised)","quote":"We must never pray for healing! We must just command healing to happen!","critique":"James 5:16 says to pray, which means requesting God."},{"of":"hyper-supernatural pastors using the KJV of Isaiah 45:11 (anonymised)","quote":"Concerning the work of my hands command ye me.","critique":"A rare mistranslation used to teach commanding God."},{"of":"a Madurai pastor teaching that believers are gods (anonymised)","quote":"You are gods, sons of the Most High (Ps 82:6).","critique":"Psalm 82:6 does not teach that believers are gods; there is only one God, and Herod's death shows humans claiming divinity are judged."}],"illustrations":[{"title":"The Nutty Putty cave tragedy","story":"In November 2009 a believer named John Edward Jones went headfirst into a narrow 'birth canal' in Utah's Nutty Putty cave and was stuck upside down for 27 hours; rescue failed and despite prayers he died and his body was left in the cave.","point":"Earnest prayers for miracles are not always answered as we wish."},{"title":"The son who asks for an iPhone","story":"The author's son, knowing his Bible-honouring father, would never ask for drugs or porn, and would ask for an iPhone with 'see your convenience'.","point":"Asking in Jesus' name means asking what he approves, leaving timing and answer to him."},{"title":"Jesus hit a four","story":"Using a cricket analogy, Jesus 'hit a four' by praying for the Father's will four times (Matt 6:10; 26:39, 42, 44).","point":"Jesus repeatedly modelled praying according to God's will."},{"title":"Remain in your Crete and Ephesus","story":"Like Titus in Crete and Timothy in Ephesus, believers should stay in their cities (Chennai, Bangalore, Noida, Pune) and fight false teaching.","point":"Hold to sound doctrine and push back error where you are."},{"title":"Herod struck down","story":"Herod accepted praise as 'the voice of a god' and was struck by an angel (Acts 12:21-23).","point":"Humans are not little gods."}],"keyVerses":[{"ref":"Jas 4:15","text":"If it is the Lord's will, we will live and do this or that","use":"All plans and prayers submitted to God's will."},{"ref":"Matt 26:39","text":"Not as I will, but as you will","use":"Jesus' model of submission."},{"ref":"Heb 2:4","text":"gifts of the Holy Spirit distributed according to his will","use":"Miracles happen whenever God chooses."},{"ref":"Luke 23:8","text":"hoping to see some miracle performed by Him","use":"Jesus does not do miracles on demand."},{"ref":"Acts 3:6-7","text":"rise up and walk... immediately his feet and ankles were made strong","use":"Instant healing when it is God's will."},{"ref":"Luke 17:14","text":"as they went they were cleansed","use":"Healing during the journey."},{"ref":"Phil 3:20-21","text":"transform our lowly body to be like his glorious body","use":"Healing in eternity."},{"ref":"1 John 5:14","text":"if we ask anything according to his will, he hears us","use":"Prayer answered only according to his will."},{"ref":"Isa 45:11","text":"Do you give me orders about the work of my hands?","use":"We must not command God."},{"ref":"Zeph 2:3","text":"perhaps you will be sheltered","use":"'Perhaps' theology of submission."},{"ref":"Ps 106:15","text":"he gave them what they asked for, but sent a wasting disease","use":"God may grant selfish prayers in wrath."},{"ref":"Ps 82:6","text":"You are gods","use":"Does not teach believers are gods."}],"flow":["Nutty Putty: earnest prayers, yet death","Scripture requires asking according to God's will","Miracles occur whenever God chooses (Heb 2:4)","God heals instantly, on the journey, or in eternity","Matthew's 'ask anything' read through John's will-texts","James 5:16 and Isa 45:11 refute commanding","Bible saints and 'perhaps' theology model surrender","Believers are not little gods"]},{"num":35,"section":"Hyper-Supernaturalism","title":"Are You Desperate for a Miracle?","summary":"Written by the author's wife, this chapter offers a balanced, practical study of how to receive miracles, explicitly to guard against the Hyper-Supernaturalism claim that 'God will always do miracles, here and now.' Drawing on a study of the 36 recorded miracles of Jesus in the Gospels, she sets out seven guidelines: surrender your life to Jesus (including repentance), simply obey the Scriptures, surrender to the Father's will, pray a submissive prayer of faith, sow into the kingdom of God, persist with Jesus until the miracle arrives, and quietly keep serving God without fussing over the miracle. She stresses that none of these guarantee a miracle; they are guidelines for receiving one if it is God's will. Personal testimonies (hostel fees provided, a baby declared heartless but found alive, missing book paragraphs that appeared in print, a ministry house given without asking) illustrate that God still works miracles, while Paul's thorn and Trophimus show that sometimes God says no.","thesis":"God still does miracles, but they come according to His sovereign will, received through repentance, obedience, humble submissive prayer, generosity and persistence, never as a guaranteed entitlement.","outline":{"acronym":"7 Steps to Receive a Miracle","items":[{"letter":"1","label":"Surrender Your Life to Jesus","point":"Jesus turns tasteless, colourless lives into wine (John 2); some miracles require first repenting of sin, as with the paralytic whose sins were forgiven before he walked; true repentance is the biggest miracle.","refs":["John 2:1-11","Mark 2:5","John 9:1-3"]},{"letter":"2","label":"Simply Obey the Scriptures","point":"Peter the fisherman obeyed the Carpenter's instruction instantly and got a boat-sinking catch; obey the Bible over church tradition (e.g. believer's baptism by immersion) and over worldly wisdom (MBA textbooks).","refs":["Luke 5:4-6"]},{"letter":"3","label":"Surrender to the Will of the Father","point":"The leper knelt and prayed 'If you are willing'; God is no hotel waiter at our beck and call; Paul's thorn, Trophimus left sick and Jesus in Gethsemane show we must submit to God's will.","refs":["Mark 1:40-41","2 Cor 12:9","2 Tim 4:20","Luke 22:42"]},{"letter":"4","label":"Say a Submissive Prayer of Faith","point":"Two 'big-shots', Jairus (the Bishop) and the centurion (the Boss), prayed the humblest prayers and received miracles; God is under no compulsion to heal or even save us; all is grace.","refs":["Mark 5:22-23","Matt 8:8","Matt 8:13","Rev 3:20"]},{"letter":"5","label":"Sow into the Kingdom of God","point":"The boy gave his whole lunch after being fed spiritually and saw 5000 fed; Mary splashed costly perfume and saw Lazarus raised; miracles cannot be bought, but love for God involves giving time, talent and treasure.","refs":["John 6:8-9","1 Cor 9:11","John 11:2","John 11:32-44"]},{"letter":"6","label":"Stick with Jesus Till the Miracle Arrives","point":"The Syrophoenician woman, called a 'dog', humbly persisted and her daughter was delivered; don't quit your relationship with Jesus when the miracle delays.","refs":["Mark 7:27-28","2 Pet 2:22","Luke 18:1"]},{"letter":"7","label":"Sail with Jesus Silently Without Thinking Too Much of the Miracle","point":"Some people never asked yet Jesus intervened, like the widow of Nain; keep serving God without complaining and He may surprise you; but He did not raise every dead person, e.g. John the Baptist.","refs":["Luke 7:11-15","Mark 5:25-29","Luke 13:11-13","John 5:1-9","John 9:1-41"]}]},"claims":[{"claim":"God still does miracles today; His name is 'Wonderful'","detail":"The author's wife affirms she truly believes in miracles, citing her own experiences and Isaiah 9:6, where Jesus' first title is 'Wonderful'. Her God does wonders, and the 36 Gospel miracles teach us how to expect them.","refs":["Isa 9:6"],"target":"Cessationist or sceptical denial of present-day miracles"},{"claim":"None of the steps guarantee a miracle; they depend on God's will","detail":"At the outset she cautions that the seven lessons are guidelines, not guarantees. Miracles come from Jesus' presence 'if it were His will' at any given point in time; this is precisely what guards against Hyper-Supernaturalism's 'God will always do miracles here and now'.","refs":[],"target":"Hyper-Supernaturalism: 'God will always do miracles, here and now!'"},{"claim":"Some miracles require prior repentance from the sin behind the sickness","detail":"Not all diseases are caused by sin (John 9), but some are. She believes the paralytic repented before being lowered through the roof, which is why Jesus first said 'your sins are forgiven' (Mark 2:5), getting to the root of a sin-caused sickness. Repentance from secret sin is the greatest miracle and often leads to lesser miracles like healing and financial breakthrough.","refs":["John 9:1-3","Mark 2:5"],"target":"Seeking miracles while continuing in secret sin"},{"claim":"Instant obedience to Scripture over tradition brings us closer to miracles","detail":"Peter the seasoned fisherman obeyed a Carpenter's fishing advice without questions and got a net-breaking catch (Luke 5:4-6). Likewise we must obey the Bible instantly, throwing out traditions like infant sprinkling in favour of believer's baptism by immersion, and rejecting MBA-style bossing in favour of servant leadership.","refs":["Luke 5:4-6"],"target":"Church tradition and worldly wisdom overriding Scripture"},{"claim":"We must submit to God's will; God is no hotel waiter","detail":"The leper knelt and said 'If you are willing', and his submission moved Jesus to heal (Mark 1:40-41). We cannot dictate terms or twist God's arm; we are not customers and God is not a waiter at our beck and call.","refs":["Mark 1:40-41"],"target":"Commanding/demanding miracles as if God were obligated"},{"claim":"Paul's thorn and Trophimus show God sometimes says no","detail":"Paul repeatedly asked for the thorn's removal and was told 'My grace is sufficient' (2 Cor 12:9); Paul left Trophimus sick at Miletus (2 Tim 4:20), perhaps after praying night and day. Like Jesus in Gethsemane ('not as I will'), we must surrender in our Gethsemane/Golgotha situations.","refs":["2 Cor 12:9","2 Tim 4:20","Luke 22:42","Isa 55:8-9"],"target":"Belief that every prayer for a miracle will be granted"},{"claim":"Humble, submissive prayers of 'big-shots' received miracles","detail":"Jairus, a synagogue leader ('the Bishop'), humbled himself to come to the rebel teacher, and his daughter was raised; the Roman centurion ('the Boss') said 'I do not deserve to have you under my roof' and his servant was healed that hour. God is under no compulsion to save or heal us; all is by grace, and humble desperate faith moves Him.","refs":["Mark 5:22-23","Matt 8:5-13","Rev 3:20"],"target":"Proud, presumptuous or bragging prayer"},{"claim":"Sowing generously into the kingdom precedes miracles","detail":"The boy who gave his lunch after being fed spiritually (like paying a bill for 'spiritual biryani') saw 5000 fed; we must materially support those who bless us spiritually (1 Cor 9:11). Stinginess toward God's servants may explain a delayed miracle; Mary's extravagant perfume preceded Lazarus being raised. Miracles cannot be bought, but love for God involves giving.","refs":["John 6:8-9","1 Cor 9:11","John 11:2","John 11:32-44"],"target":"Stingy, calculated giving to God's servants"},{"claim":"Persistence and humility, like the Syrophoenician woman's, bring the miracle","detail":"Jesus effectively called her a 'dog' and, she suggests, accurately so, since Jesus knew her inner life and she was perhaps a backslider returning to her vomit (2 Pet 2:22). Yet she persisted, accepted she lived a dog's life, and her daughter was delivered. Don't quit when the miracle delays.","refs":["Mark 7:27-28","2 Pet 2:22","John 4:18"],"target":"Giving up on Jesus when miracles delay"},{"claim":"Jesus sometimes intervenes uninvited, but not in every case","detail":"No one asked Jesus to raise the widow of Nain's son, yet he disrupted the funeral and gave him back to his mother, as he gave John to his own mother. But Jesus did not interrupt every funeral or raise John the Baptist. So keep serving God without complaining, and He may surprise you at the most unexpected time.","refs":["Luke 7:11-15","John 19:26-27","Matt 14:10-13"],"target":"Treating miracles as automatic or demanded"},{"claim":"Long-standing problems can be solved in one encounter with Jesus","detail":"A 12-year issue (the bleeding woman), an 18-year bent back, a 38-year sickness at Bethesda, and life-long blindness were all healed instantly by Jesus. So don't give up, whatever the age of the problem.","refs":["Mark 5:25-29","Luke 13:11-13","John 5:1-9","John 9:1-41"],"target":"Despair over chronic, long-term problems"}],"questions":[{"q":"Are you desperate for a miracle?","answer":"Then learn from Jesus' 36 recorded miracles the seven guidelines for receiving one, remembering they are not guarantees but depend on His will."},{"q":"Are all diseases caused by sin?","answer":"No; John 9 shows not all are, but some miracles (like the paralytic in Mark 2) required repenting of the sin behind the sickness."},{"q":"Do you also want to repent from the secret sin you may be practising?","answer":"You must; Jesus' blood cleanses every sin, and true repentance is the greatest miracle, often leading to smaller miracles."},{"q":"Would a seasoned fisherman listen to a carpenter on fishing?","answer":"Unlikely, but Peter did, obeying Jesus instantly, and received a boat-sinking catch; we must likewise obey the Bible instantly."},{"q":"Would you surrender to your Father's will in your Gethsemane/Golgotha situations?","answer":"Yes, imitate Jesus who prayed 'not as I will but your will be done'; God's ways are higher than ours."},{"q":"Why have you not yet received your long-awaited miracle?","answer":"Perhaps you have been stingy in giving to God's servants who blessed you spiritually; sow generously, though miracles cannot be bought."},{"q":"Are you thinking of quitting your relationship with Jesus because the miracle has not arrived?","answer":"Don't give up; persist in humble prayer like the Syrophoenician woman; at the end of the road a miracle waits, according to God's will."}],"criticisms":[{"of":"Hyper-Supernaturalism teaching","quote":"God will always do miracles, here and now!","critique":"This doctrine ignores Scripture where God sovereignly declines to do miracles (Paul's thorn, Trophimus) and turns God into a waiter at our beck and call."},{"of":"Church traditions such as infant baptism by sprinkling","quote":"","critique":"She urges readers to throw tradition into the trashcan and obey the Bible's plain teaching of believer's baptism by immersion, as part of obeying Scripture to draw near to a miracle."},{"of":"MBA textbook leadership wisdom","quote":"","critique":"Bestselling business texts teach bossing and manipulating people to reach the top, whereas the Bible teaches servant leadership as true greatness."}],"illustrations":[{"title":"Eindhiran's reel miracles","story":"The 2010 Rajinikanth film Eindhiran/Robot features 'miracle moments' like talking to mosquitoes and multiplying into a million robots.","point":"Those were made-up reel miracles; the chapter is about experiencing real miracles in life."},{"title":"Hostel fees provided","story":"In the 1990s, between jobs and unwilling to burden missionary parents or borrow, she prayed, and a lady visited saying God told her to give money, exactly the hostel fee.","point":"Jesus does real miracles of provision for those who pray."},{"title":"Water into wine","story":"Jesus' first miracle turned colourless, tasteless water into tasty, aromatic wine.","point":"Let Jesus touch your tasteless, colourless life and it will become full of purpose."},{"title":"Fisherman listening to a carpenter","story":"Peter, after toiling all night, obeyed Jesus' instruction to let down nets and received a boat-sinking, net-breaking catch.","point":"Obey the written Word instantly to move closer to your miracle."},{"title":"God is no hotel waiter","story":"Praying for miracles is compared to ordering in a hotel where God plays the waiter.","point":"We cannot dictate terms or twist God's arm; we must submit to His will."},{"title":"The miracle baby","story":"In 2007 a doctor said their unborn baby had no heartbeat and suggested abortion; after praying 'let Your will be done', another scan centre in Hyderabad found the baby alive, and a healthy girl was born that November.","point":"God did a miracle when they submitted to His will in prayer and refused abortion."},{"title":"The Bishop and the Boss","story":"Jairus the synagogue leader and the Roman centurion, two 'big-shots', prayed humble prayers and received miracles.","point":"Jesus responds to humble, desperate faith rather than bragging prayers."},{"title":"The finger of God in a printing press","story":"After a PDF of one of the author's books showed missing final paragraphs on page 43 and it had already gone to print, the couple prayed humbly; next day the printer read the page and all the paragraphs were present.","point":"The God who wrote the Ten Commandments with His finger still works miracles in response to humble prayer."},{"title":"Spiritual biryani in the Jesus Hotel","story":"The boy with five loaves and two fish is imagined thinking he must pay for the spiritual meal he received by giving all his lunch.","point":"Support God's servants who bless you spiritually; generous sowing preceded the multiplication."},{"title":"Mary's splashed perfume","story":"Mary splashed costly perfume on Jesus' feet rather than measuring it; Jesus raised her brother Lazarus.","point":"Give extravagantly, not calculatingly, out of love for God."},{"title":"The boy who rang the doorbell","story":"A quote likens much praying to a boy who rings a doorbell and leaves before the door opens.","point":"Persist in prayer for miracles."},{"title":"The funeral disrupter","story":"Jesus interrupted the funeral at Nain and gave the raised son back to his widowed mother, though no one asked.","point":"Keep serving God without complaining; He may intervene unexpectedly, though not always (John the Baptist was not raised)."},{"title":"The triplex ministry house","story":"In Hyderabad she admired a large house near the main road and wished it were a ministry base, without praying; within days they met its owner at church and he rented it to them, hosting youth, prayer events and outreach for six years.","point":"God sometimes grants miracles we never even asked for."},{"title":"Problems 12, 18, 38 years old","story":"The bleeding woman (12 years), the bent woman (18 years), the Bethesda man (38 years) and the man born blind were all healed in one encounter.","point":"However old your problem, don't give up."}],"keyVerses":[{"ref":"Isa 9:6","text":"his name shall be called Wonderful","use":"Our God's very name declares He does wonders and miracles."},{"ref":"Mark 2:5","text":"My son, your sins are forgiven","use":"Some miracles require prior repentance from the sin behind the sickness."},{"ref":"Luke 5:5","text":"at your word I will let down the nets","use":"Instant obedience to God's Word precedes miraculous blessing."},{"ref":"Mark 1:40","text":"If you are willing, you can make me clean","use":"Model of submission to God's will in praying for miracles."},{"ref":"2 Cor 12:9","text":"My grace is sufficient for you","use":"God sometimes leaves the problem and gives grace instead."},{"ref":"2 Tim 4:20","text":"Trophimus I left sick at Miletus","use":"Not every prayer for healing is granted."},{"ref":"Matt 8:8","text":"Lord, I do not deserve to have you come under my roof","use":"Humble prayer of a 'big-shot' that received a miracle."},{"ref":"1 Cor 9:11","text":"If we have sown spiritual things among you, is it too much if we reap material things?","use":"Support God's servants who bless you spiritually."},{"ref":"Mark 7:28","text":"even the dogs under the table eat the children's crumbs","use":"Persistence and humility in prayer brings the miracle."},{"ref":"Luke 7:15","text":"Jesus gave him back to his mother","use":"Jesus may intervene uninvited for those who quietly serve."}],"flow":["Reel miracles are fake; real miracles still happen","God's name is Wonderful; 36 Gospel miracles teach lessons","Steps are guidelines, not guarantees; God's will decides","Repent, obey Scripture and submit to the Father's will","Pray humbly and sow generously into God's kingdom","Persist with Jesus; keep serving silently","God may act unasked, but not always"]},{"num":36,"section":"Hyper-Supernaturalism","title":"What the Bible Teaches About Disease and Sickness: The C-A-N-C-E-R Outline","summary":"The author argues that a 'cancer' in the Body of Christ is a wrong understanding of sickness and disease, specifically the Hyper-Supernaturalism claim that 'God will always heal you, here and now.' Using the acronym C-A-N-C-E-R, he teaches that disease sometimes comes from the devil but is also at times God-allowed or even God-sent as a call to repentance (Elymas, Jezebel), though we must never tell a sick person their illness is due to a particular sin. Total annulment of disease awaits the new heaven and earth; now we receive only 'first-fruits', partial healing according to God's will, as cases like Trophimus, Epaphroditus, Timothy and Paul show. Church elders should pray for the sick, sickness can serve God's purposes (displaying His works, keeping Paul humble, spreading the gospel), and we must pray relentlessly, with deliverance coming instantly, later, or in eternity.","thesis":"Scripture teaches a balanced view of sickness: healing is available now when it is God's will, but not guaranteed, since perfect health comes only in the new creation and God sometimes allows or uses sickness for His purposes.","outline":{"acronym":"C-A-N-C-E-R","items":[{"letter":"C","label":"Creation of Disease and Sickness","point":"The devil is a source of sickness (Acts 10:38, Luke 13:16), but God also uses or sends disease to call people to repentance (Elymas blinded; Jezebel thrown on a sickbed). Yet only Spirit-directed Bible authors and Jesus could link a specific sickness to a specific sin; we must not, as Job's friends did.","refs":["Acts 10:38","Luke 13:16","Acts 13:9-11","Rev 2:20-23","Job 4:7","Job 8:4","Job 42:7"]},{"letter":"A","label":"Annulment of Disease","point":"All disease is annulled only in the new heaven and earth (future tense of Rev 21:4); we 'await' the redemption of our bodies and enjoy only first-fruits now; even those raised from the dead died again; our tent-body will be destroyed.","refs":["Rev 21:4","Rom 8:23","2 Cor 5:1"]},{"letter":"N","label":"Now, Even Now, We Can Be Healed If It Is God's Will","point":"Scripture urges us to seek healing now (Matt 10:8); the author's wife's lifelong wheezing ended after prayer; but healing does not happen in every case (Trophimus, Epaphroditus, Timothy, Paul).","refs":["Matt 10:8","2 Tim 4:20","Phil 2:25-27","1 Tim 5:23","2 Cor 12:7-10"]},{"letter":"C","label":"Church Elders Are God's Instruments for Healing","point":"James 5:14-15 instructs elders to pray and anoint; yet James 4:14 shows life is a mist, so some will be healed and others will die.","refs":["Jas 5:14-15","Jas 4:14"]},{"letter":"E","label":"Explanations for Why Sickness Comes","point":"Sickness can display God's works (John 9:1-3), sanctify (Acts 13, Rev 2), keep one from conceit (2 Cor 12:7), open doors for the gospel (Gal 4:13), and lead people to faith (John 11:45).","refs":["John 9:1-3","2 Cor 12:7","Gal 4:13","Job 1","John 11:45"]},{"letter":"R","label":"Relentless in Prayer for the Sick","point":"Always pray and do not give up (Luke 18:1); deliverance may come instantly (Acts 8:7), with delay (Luke 17:14), or in eternity (Rev 21:4).","refs":["Luke 18:1","Acts 8:7","Luke 17:14","Rev 21:4"]}]},"claims":[{"claim":"The devil is a source of sickness","detail":"Peter preached that Jesus healed all who were oppressed by the devil (Acts 10:38), echoing Jesus' description of the bent woman as one whom Satan bound for 18 years (Luke 13:16).","refs":["Acts 10:38","Luke 13:16"],"target":"None (affirmation of shared ground)"},{"claim":"God sometimes sends or uses disease to call people to repentance","detail":"Paul, filled with the Spirit, pronounced blindness on Elymas for opposing the gospel (Acts 13:9-11), and Jesus himself said he would throw Jezebel onto a sickbed to deter her from leading people into immorality (Rev 2:20-23). As baffling as it sounds, disease is at times a tool in God's hands to make us fall at His feet in repentance.","refs":["Acts 13:9-11","Rev 2:20-23"],"target":"Belief that God never has anything to do with sickness"},{"claim":"Never tell a sick person their disease is due to a particular sin","detail":"Only Spirit-directed Bible authors and Jesus could make such a link. Job's friends used the formula 'if you suffer you must have sinned' and were rebuked by God (Job 4:7, 8:4, 42:7). Only at the judgment will we know why disease came; our call is simply to pray for the sick.","refs":["Acts 13:9-11","Rev 2:20-23","Job 4:7","Job 8:4","Job 42:7"],"target":"Blaming the sick for their sickness"},{"claim":"Total annulment of disease comes only in the new heaven and earth","detail":"Revelation 21:4 uses future tense: no more death or pain. Romans 8:23 says we 'await' the redemption of our bodies, enjoying only 'first-fruits' now, meaning partial, reversible healing case by case. Even those raised from the dead later died, and Paul calls our body a tent to be destroyed (2 Cor 5:1).","refs":["Rev 21:4","Rom 8:23","2 Cor 5:1"],"target":"Hyper-Supernaturalism: 'God will always heal you here and now'"},{"claim":"Healing now is available and commanded, if it is God's will","detail":"Scripture is full of exhortations to seek healing now; Jesus commanded his disciples to heal the sick, raise the dead, cleanse lepers and drive out demons (Matt 10:8). The author's wife's lifelong wheezing ended permanently after her professor and student leaders prayed.","refs":["Matt 10:8"],"target":"Cessationism / passivity about healing"},{"claim":"Healing does not happen in every case we pray for","detail":"Paul left Trophimus sick (2 Tim 4:20); Epaphroditus' healing was delayed until near death (Phil 2:25-27); Timothy had 'frequent illnesses' despite surely being prayed for (1 Tim 5:23); and Paul's thorn, perhaps a nagging disease, remained after three prayers (2 Cor 12:7-10).","refs":["2 Tim 4:20","Phil 2:25-27","1 Tim 5:23","2 Cor 12:7-10"],"target":"Belief that healing always happens"},{"claim":"Church elders must pray for the sick, but healing is not guaranteed","detail":"James instructs the sick to call elders to pray and anoint with oil; the prayer of faith will make them well (Jas 5:14-15). But the same James says life is a vanishing mist (Jas 4:14), implying some will be healed while others pass away.","refs":["Jas 5:14-15","Jas 4:14"],"target":"Belief that the prayer of faith always heals"},{"claim":"There is a purpose of God in every sickness","detail":"The man was born blind to display God's works (John 9:1-3); sickness had a sanctifying effect (Acts 13, Rev 2); Paul's thorn was 'given' to keep him from conceit (2 Cor 12:7); Paul's illness led him to preach in Galatia (Gal 4:13); Lazarus' death led many to believe (John 11:45). A sick person in hospital fulfils God's purpose by sharing the gospel.","refs":["John 9:1-3","2 Cor 12:7","Gal 4:13","Job 1","John 11:45"],"target":"Belief that sickness has no place in God's purposes"},{"claim":"Be relentless in prayer; deliverance comes instantly, later or in eternity","detail":"Jesus taught always to pray and not give up (Luke 18:1). Deliverance may come instantly (Acts 8:7), with delay (Luke 17:14, the lepers healed as they went), or on the other side of eternity (Rev 21:4). Believers should embrace all the Bible teaches on healing instead of being selective.","refs":["Luke 18:1","Acts 8:7","Luke 17:14","Rev 21:4"],"target":"Selective teaching on healing"}],"questions":[{"q":"Will God always heal you here and now?","answer":"No; that is the Hyper-Supernaturalism error. Healing can happen now if it is God's will, but total annulment of disease is only in the new heaven and earth."},{"q":"Would Jesus really throw someone onto a sickbed?","answer":"Yes, Revelation 2:22 records Jesus saying he would throw Jezebel onto a sickbed unless she repented; disease is at times a tool to bring repentance."},{"q":"Should we tell a sick person they are sick because of a particular sin?","answer":"Never; only Spirit-directed Bible authors and Jesus had that right; we should simply pray for the sick, as Job's friends were rebuked."},{"q":"Does healing happen in each case we pray for?","answer":"Absolutely not; Trophimus, Epaphroditus, Timothy and Paul himself show that healing was delayed or did not happen."},{"q":"Why does sickness come?","answer":"The devil causes it, God sometimes allows or sends it to bring repentance, display His works, humble us, or spread the gospel."}],"criticisms":[{"of":"Hyper-Supernaturalism teachers","quote":"God will always heal you, here and now!","critique":"This is a 'cancer' in the Body of Christ, a wrong, selective understanding that ignores Scriptures on God-allowed sickness, delayed healing and future annulment of disease."},{"of":"Job's friends' formula (as described by a devotional writer)","quote":"Who, being innocent, has ever perished?","critique":"Job's friends assumed suffering meant sin and were rebuked by God; we must not presume to know why someone is sick."}],"illustrations":[{"title":"Cancer in the Body of Christ","story":"The author describes a wrong understanding of sickness as a 'cancer' in the church and uses C-A-N-C-E-R as the outline.","point":"Wrong teaching on healing spreads and harms the church."},{"title":"Wheezing gone after a professor prayed","story":"The author's wife suffered severe wheezing from childhood, once hospitalised as an engineering student; after her professor and Christian student leaders prayed, she never had another bout in over 25 years.","point":"God can and does heal now in response to prayer."},{"title":"Trophimus left at Miletus","story":"Paul left a valued team member sick and moved on.","point":"Healing does not happen in every case we pray for."},{"title":"Job's comforters","story":"A devotional writer recounts Job's friends insisting his losses proved his sin, and God rebuking them.","point":"Never tell a sick person their sickness is due to their particular sin."},{"title":"Preaching from a sickbed","story":"Paul's illness led him to preach in Galatia; a hospital patient today can share the gospel with staff and fellow patients.","point":"Sickness can become a blessing in disguise for gospel purposes."},{"title":"Lazarus' death","story":"If Lazarus had not died, Jesus could not have raised him, and many believed because of it.","point":"When healing happens in response to prayer, people come to Jesus."}],"keyVerses":[{"ref":"Acts 10:38","text":"healing all who were oppressed by the devil","use":"The devil is a source of sickness."},{"ref":"Rev 2:22","text":"I will throw her onto a sickbed","use":"God at times uses sickness to bring repentance."},{"ref":"Rev 21:4","text":"death shall be no more, neither shall there be mourning, nor crying, nor pain","use":"Future tense: complete annulment of disease only in the new creation."},{"ref":"Rom 8:23","text":"we wait eagerly for adoption, the redemption of our bodies","use":"We have first-fruits now; full healing later."},{"ref":"Matt 10:8","text":"Heal the sick, raise the dead","use":"We are to seek healing here and now."},{"ref":"Jas 5:14-15","text":"the prayer offered in faith will make the sick person well","use":"Elders are God's instruments for healing."},{"ref":"Jas 4:14","text":"You are a mist that appears for a little while","use":"Some will not be healed and will die."},{"ref":"John 9:3","text":"that the works of God might be displayed in him","use":"God has a purpose in each sickness."},{"ref":"Gal 4:13","text":"it was because of an illness that I first preached the gospel to you","use":"Sickness can be a blessing in disguise."},{"ref":"Luke 18:1","text":"always pray and not give up","use":"Be relentless in prayer for the sick."}],"flow":["Wrong healing doctrine is a cancer in the church","Sickness comes from the devil, sometimes allowed by God","Never link someone's sickness to their particular sin","Perfect health only in the new creation","Healing now possible if God wills, not always","Elders pray; sickness can serve God's purposes","Pray relentlessly: instant, delayed or eternal answer"]},{"num":37,"section":"Hyper-Love","title":"Will Those Who Land in Hell Stop Existing, as an Elderly English Bible Scholar Suggested?","summary":"Opening the Hyper-Love section, the author responds to an elderly British evangelical statesman who found eternal conscious torment emotionally intolerable and concluded that the language of destruction and fire points to annihilation (conditional immortality). Using the acronym F-I-R-E, he argues: the Fire imagery is called 'eternal' and Matt 25:46 pairs eternal punishment with eternal life; 'ing' words (weeping, gnashing, suffering) and the rich man in Luke 16 show ongoing conscious torment; the Immortality-for-believers-only argument fails since Adam and Eve and the rich man kept existing after 'death'; Rest is missing for hell-dwellers, whose smoke of torment rises forever (Rev 14:9-11); and Everything Scripture says must be embraced however disturbing, including correct Exegesis of 'destruction', which in Scripture often implies continued existence. He adds that even a single sin against an infinite God merits infinite judgment, that God's temporal judgments on 'small' sins anticipate hell, that sinners choose hell by their free will, and that annihilationists add to Revelation and will face judgment.","thesis":"Hell is eternal conscious torment, not annihilation; the Bible's fire, 'ing', rest and destruction language, rightly exegeted, demands this, however emotionally disturbing.","outline":{"acronym":"F-I-R-E","items":[{"letter":"F","label":"Fire Imagery for Hell","point":"The Bible calls hell's fire 'eternal' (Matt 18:8, 25:41, Jude 7); Matt 25:46 uses the same 'eternal' for life and punishment, so if life is eternal, so is torment.","refs":["Matt 18:8","Matt 25:41","Jude 7","Matt 25:46"]},{"letter":"I","label":"'ING' Words and the Immortality Fallacy","point":"Ongoing actions (weeping, gnashing, suffering) in Matt 13:42 and Luke 16:24 show continuous torment; the rich man kept existing; the claim that immortality is given only to believers (2 Tim 1:10) fails, since Adam and Eve kept existing after spiritual death, so those in the 'second death' will too (Rev 21:8, 22:15).","refs":["Matt 13:42","Luke 16:24-26","2 Tim 1:10","Gen 3","Rev 21:7-8","Rev 22:15"]},{"letter":"R","label":"Rest Missing for Hell-Dwellers","point":"The smoke of their torment rises forever and there is no rest day or night (Rev 14:9-11); smoke requires something still burning.","refs":["Rev 14:9-11"]},{"letter":"E","label":"Everything Scripture Says We Embrace / Exegesis","point":"Eternal destruction away from the Lord's presence (2 Thess 1:7-9) means ongoing destruction, like the undying worm (Mark 9:48); a single sin against an infinite God merits infinite punishment; temporal judgments anticipate hell; sinners choose hell; and 'destruction' words (ruined wineskins, lost coin/son/sheep, the beast's destruction) do not mean cessation.","refs":["2 Thess 1:7-9","Isa 66:24","Mark 9:45-48","2 Tim 3:16","Matt 9:17","Luke 15","Rev 17:8","Rev 19:20","Rev 20:10"]}]},"claims":[{"claim":"Emotions must not override Scripture on hell","detail":"The British scholar himself admitted emotions are unreliable but still concluded for annihilation. The author insists we must embrace everything Scripture says about eternal destiny, however emotionally disturbing, since all Scripture is God-breathed (2 Tim 3:16).","refs":["2 Tim 3:16"],"target":"Emotion-driven rejection of eternal conscious torment"},{"claim":"Hell's fire is called 'eternal', so it keeps burning","detail":"Matt 18:8, Matt 25:41 and Jude 7 attach 'eternal' to fire. This fire torments not only the devil and his angels but humans who followed him.","refs":["Matt 18:8","Matt 25:41","Jude 7"],"target":"Annihilationism: fire consumes and ends existence"},{"claim":"Matt 25:46: eternal punishment parallels eternal life","detail":"Jesus attaches the same word 'eternal' to punishment and to life in Matt 25:46. If eternal life is literally forever, eternal punishment must mean non-stop, everlasting torment; otherwise heaven also would not be eternal.","refs":["Matt 25:46"],"target":"Annihilationism"},{"claim":"'ING' words show hell's torment is ongoing","detail":"Matt 13:42 speaks of a fiery furnace with 'weeping and gnashing of teeth', two ongoing actions. Luke 16:24 has the rich man 'suffering' in the fire, showing continuing torment.","refs":["Matt 13:42","Luke 16:24"],"target":"Annihilationism"},{"claim":"The rich man in Luke 16 refutes cessation of existence at death","detail":"The rich man was in torment in Hades, conscious, talking with Abraham as the fire tormented him; Jesus did not say he stopped existing, and a great gulf prevents crossing (Luke 16:24-26). A systematic theologian notes this story refutes the idea that unbelievers cease to exist at death.","refs":["Luke 16:19-31"],"target":"Annihilationism / soul sleep"},{"claim":"Immortality is not only for believers; the 'second death' doesn't end existence","detail":"Annihilationists say immortality was lost at the fall and restored through the gospel, citing 2 Tim 1:10. But Adam and Eve did not stop existing after spiritual death, so those in the 'second death' (Rev 21:8) will not stop existing either; Rev 22:15 says the wicked 'are' outside.","refs":["2 Tim 1:10","Gen 3","Rev 21:7-8","Rev 22:15","Luke 16"],"target":"Conditional immortality"},{"claim":"Smoke of torment rising forever proves eternal torment","detail":"Revelation 14:9-11 says the smoke of their torment rises forever and they have no rest day or night. As a theologian argues, there can be no smoke without something burning, and the lake of fire would not continue with nothing to burn. Only a wishful-thinking fool could believe annihilation.","refs":["Rev 14:9-11"],"target":"Annihilationist claim that only the smoke, not the punishment, is everlasting"},{"claim":"Eternal destruction away from God's presence means endless ongoing destruction","detail":"2 Thess 1:7-9 speaks of the penalty of eternal destruction away from the Lord's presence. Just as those in His presence live forever, those banished will also live forever; destruction is ongoing, like the undying worm of Isa 66:24 quoted in Mark 9:48 feasting forever on ever-alive bodies.","refs":["2 Thess 1:7-9","Isa 66:24","Mark 9:45-48"],"target":"Annihilationism"},{"claim":"A single sin against an infinite God merits infinite judgment","detail":"Contra the British scholar's appeal to judgment 'according to what they have done' (Rev 20:12), God's temporal judgments on 'little' sins (Lot's wife, Nadab and Abihu, the Sabbath stick-gatherer, Ananias and Sapphira) anticipate everlasting anguish. Sin is against an infinite God (Acts 5:4), so it deserves infinite punishment.","refs":["Rev 20:12","Gen 19:26","Num 3:4","Num 15:32-36","Acts 5:4"],"target":"Proportional/finite punishment argument"},{"claim":"When Scripture defies logic, faith takes precedence over reasoning","detail":"A Canadian theologian said endless torment 'does not make sense'; but Christ's love 'surpasses knowledge' (Eph 3:19) and God's peace 'transcends understanding' (Phil 4:7), yet both exist. God's thoughts are higher than ours (Isa 55:8).","refs":["Eph 3:19","Phil 4:7","Isa 55:8"],"target":"Rejecting doctrines that seem illogical"},{"claim":"Sinners choose hell by their own free will; God cannot be blamed","detail":"Christ-rejectors know their destination (2 Thess 1:7-8) and deliberately choose sin, refusing the remedy, so hell becomes their own choice. A famous Christian writer said all in hell choose it: some say to God 'Thy will be done' and to others God says 'Thy will be done'.","refs":["2 Thess 1:7-8"],"target":"Charge that eternal hell makes God unjust"},{"claim":"'Destruction' in Scripture does not mean cessation of existence","detail":"Annihilationists use the 'vocabulary of destruction' (1 Thess 5:3, 2 Thess 1:9, 2 Pet 3:9). But the same word describes ruined wineskins (Matt 9:17) and the lost coin, son and sheep (Luke 15), which did not cease to exist. The beast goes to 'destruction' (Rev 17:8) yet is thrown alive into the lake of fire and is still there a thousand years later, tormented forever (Rev 19:20, 20:10).","refs":["1 Thess 5:3","2 Thess 1:9","2 Pet 3:9","Matt 9:17","Luke 15","Rev 17:8","Rev 19:20","Rev 20:10"],"target":"Annihilationist exegesis of destruction texts"},{"claim":"Annihilationists go beyond Revelation 22 and will be judged","detail":"Rev 21:3-4 says no more death or pain, yet four verses later the wicked are in the lake of fire (Rev 21:8), and Rev 22:14-15 shows them still existing. Annihilationists imagine a post-Revelation 22 scenario, adding to the prophecy (Rev 22:18), and God's judgment will come on them for broadcasting this hell-populating teaching.","refs":["Rev 21:3-4","Rev 21:8","Rev 22:14-15","Rev 22:18"],"target":"Annihilationist teachers"}],"questions":[{"q":"Will those who land in hell stop existing, as an elderly English Bible scholar suggested?","answer":"No; the F-I-R-E outline shows hell involves eternal conscious torment, not annihilation."},{"q":"How should we respond to the Hyper-Love teaching that God is so loving he will destroy those in hell so they need not endure torment forever?","answer":"We 'fire' this hell-populating false teaching using the acronym F-I-R-E."},{"q":"Do Christ-rejecting humans stop existing after their death?","answer":"No; the rich man in Luke 16 was conscious, talking and suffering in Hades."},{"q":"Did Adam and Eve stop existing after spiritual death came to them?","answer":"No, so neither will those who experience the second death stop existing after entering the lake of fire."},{"q":"How can there be smoke without something burning?","answer":"There cannot; the forever-rising smoke of Rev 14:11 shows the torment is endless."},{"q":"Christ's love surpasses knowledge; does that mean it does not exist?","answer":"No; likewise the endless torment doctrine is true even if it seems not to 'make sense' to human logic."},{"q":"Does Rev 21:3-4's 'no more death' imply the annihilation of the wicked?","answer":"Far from it; four verses later the wicked are in the lake of fire (Rev 21:8), and they still exist in Rev 22:15."}],"criticisms":[{"of":"an elderly British evangelical scholar","quote":"Emotionally, I find the concept intolerable and do not understand how people can live with it without either cauterizing their feelings or cracking under the strain... So both the language of destruction and the imagery of fire seem to point to annihilation.","critique":"Though he acknowledged emotions are unreliable, he concluded for annihilation; the author calls this a Hyper-Love, hell-populating false teaching contrary to the plain meaning of Scripture."},{"of":"pro-annihilation teachers/scholars (on 2 Tim 1:10)","quote":"Mankind is mortal; this ability to be immortal was taken away when the fall happened; however, belief in the Gospel brought back immortality.","critique":"The argument only works if unbelievers cease to exist at death, which Luke 16 and the existence of Adam and Eve after spiritual death disprove."},{"of":"pro-annihilation teachers on Rev 14:11","quote":"","critique":"They contend the smoke, not the punishment, is everlasting, but there cannot be smoke without something burning."},{"of":"a controversial Canadian theologian, once a strong evangelical","quote":"does not make sense... A God of love will not torture people forever for sins done in a finite life","critique":"He leaned on his logical faculties rather than God's Word; following a critic's response, the author argues that Christ's love and God's peace also surpass understanding, yet they are real."},{"of":"the British scholar's argument from Rev 20:12","quote":"","critique":"He argued punishment must be proportional to the length of a life of sin; the author counters with the severity of God's temporal judgments on 'little' sins and the infinite-offence argument."},{"of":"annihilationist teachers generally","quote":"","critique":"They go beyond Revelation 22, adding to the prophecy, and are 'hell-populating' false teachers who will face God's judgment; only a 'wishful-thinking fool' would believe them."}],"illustrations":[{"title":"Firing the false teaching","story":"The author uses the acronym F-I-R-E to 'fire' annihilationism.","point":"Wordplay on hell's fire to refute the idea that fire ends existence."},{"title":"The rich man in the flames","story":"In Luke 16 the rich man talks with Abraham while suffering in fire, unable to cross the great gulf.","point":"Unbelievers continue existing consciously after death."},{"title":"Adam and Eve after death","story":"Adam and Eve experienced spiritual death yet kept existing.","point":"The second death likewise does not end existence."},{"title":"Smoke needs a fire","story":"A theologian asks how smoke can rise forever if nothing is burning.","point":"Rev 14:11's eternal smoke means eternal torment."},{"title":"The undying worms","story":"Isaiah 66:24 quoted in Mark 9:48 pictures worms feasting endlessly.","point":"Eternal destruction is an endless process on ever-alive bodies."},{"title":"Lot's wife, Nadab and Abihu, the stick-gatherer, Ananias and Sapphira","story":"Each received sudden death for what we would call little sins.","point":"God's temporal judgments anticipate eternal punishment; any sin against an infinite God deserves infinite judgment."},{"title":"Thy will be done","story":"A famous Christian writer said there are those who say to God 'Thy will be done' and those to whom God says 'Thy will be done'.","point":"People in hell chose it; God cannot be blamed."},{"title":"Ruined wineskins and lost coins","story":"The same word for destruction describes ruined wineskins and the lost coin, sheep and son, which still exist.","point":"Destruction does not mean annihilation."},{"title":"The beast's destruction","story":"The beast goes to destruction yet is thrown alive into the lake of fire and is still there a thousand years later.","point":"Destruction means eternal punishment, not cessation."}],"keyVerses":[{"ref":"Matt 25:46","text":"these will go away into eternal punishment, but the righteous into eternal life","use":"Same 'eternal' for both, so torment is as endless as life."},{"ref":"Jude 7","text":"undergoing a punishment of eternal fire","use":"Hell's fire is eternal."},{"ref":"Matt 13:42","text":"there will be weeping and gnashing of teeth","use":"Ongoing actions show ongoing torment."},{"ref":"Luke 16:24","text":"I am suffering in this fire","use":"Conscious torment after death."},{"ref":"2 Tim 1:10","text":"brought life and immortality to light through the gospel","use":"Annihilationists' proof text, which the author rebuts."},{"ref":"Rev 22:15","text":"Outside are the dogs and sorcerers","use":"The wicked continue to exist after entering the lake of fire."},{"ref":"Rev 14:11","text":"the smoke of their torment rises forever and ever; there is no rest day or night","use":"No rest and eternal smoke prove eternal torment."},{"ref":"2 Thess 1:9","text":"the penalty of eternal destruction, away from the presence of the Lord","use":"Ongoing destruction of ever-alive individuals."},{"ref":"Mark 9:48","text":"where their worm does not die and the fire is not quenched","use":"Endless destruction process in hell."},{"ref":"Rev 20:10","text":"tormented day and night forever and ever","use":"The beast's 'destruction' is eternal torment."},{"ref":"Isa 55:8","text":"my thoughts are not your thoughts","use":"Faith precedes human logic."}],"flow":["British scholar proposes annihilation despite admitting emotions mislead","F: eternal fire; Matt 25:46 parallels eternal life","I: ongoing 'ing' words; rich man keeps existing","I: immortality-for-believers-only argument fails","R: no rest; smoke of torment rises forever","E: embrace all Scripture; infinite sin, infinite punishment","E: 'destruction' rightly exegeted means ongoing existence","Annihilationists go beyond Revelation and face judgment"]},{"num":38,"section":"Hyper-Love","title":"Is the Hell to Heaven Teaching Which a Chennai Pastor Preaches, Biblical?","summary":"The author responds to a Chennai-based Hyper-Grace pastor who, at a Hyderabad seminar, combined Revelation 21:25 (heaven's gates never shut) and 22:17 ('the Spirit and the bride say Come') to teach that those in the lake of fire could still respond and enter heaven. Using the acronym H-E-L-L he argues: His (Jesus') teaching in Luke 16 shows a fixed chasm and ongoing agony, and Jesus repeatedly taught eternal fire and endless weeping; the Epistles (2 Thess 1:9, Heb 6:2, Jude 7) prefix 'eternal' to judgment, and Paul's not using 'Gehenna' merely reflects his Gentile audience; a Long look at Revelation shows the lake of fire's torment is forever, the open gates reflect the absence of night and evil, and the 'come' of Rev 22:17 is the church's present Spirit-empowered witness (like Acts 1:8), before the Second Coming; and the Locking of one's choice by God (Pharaoh, Manasseh, Judas, Pharisees, the devil, Romans 1) shows God freezes stubborn choices even before death. He also rebuts the pastor's use of Psalm 96 to make judgment day joyful for all and Psalm 139:8 to claim hell is in God and is like the irritating fire of unwelcome love.","thesis":"There is no second chance after death: Jesus, the epistles and Revelation teach that hell is eternal and inescapable, and the 'come' of Revelation 22:17 is the church's present-day gospel invitation, not an offer to those in hell.","outline":{"acronym":"H-E-L-L","items":[{"letter":"H","label":"His (Jesus') Teaching on Hell to Heaven","point":"In Luke 16 the rich man is refused even a drop of water, Abraham says 'you ARE in agony', and a great chasm prevents crossing; Jesus never mentions any post-death opportunity, and he taught eternal fire (Matt 25:41), unquenchable fire and undying worm (Mark 9:43-48) and weeping and gnashing of teeth four times in Matthew.","refs":["Luke 16:21-26","Matt 25:41","Mark 9:43-48","Matt 8:12","Matt 22:13","Matt 24:51","Matt 25:30"]},{"letter":"E","label":"Epistles Teaching on Hell to Heaven","point":"Paul taught eternal destruction (2 Thess 1:9); not using 'Gehenna' reflects his Gentile audience, while James (to Jews) used it (Jas 3:6) and Peter used 'Tartarus' (2 Pet 2:4); Hebrews speaks of 'eternal judgment' (Heb 6:2), unlike the 'fleeting' pleasures of sin (Heb 11:25); Jude speaks of Sodom's eternal fire (Jude 7).","refs":["2 Thess 1:8-9","Jas 3:6","2 Pet 2:4","Heb 6:2","Heb 11:25","Jude 7"]},{"letter":"L","label":"Long Look at the Book of Revelation","point":"Read all 22 chapters: torment forever with no relief (Rev 14:10-11), beast and false prophet still there after 1000 years (Rev 20:10), one lake of fire (Rev 21:8); open gates mean no night or evil (Rev 21:25, 27); names 'are written' now; the 'come' of Rev 22:17 is before the Second Coming, the church's witness like Acts 1:8; those outside are there 'for good' (Rev 22:14-15).","refs":["Rev 14:10-11","Rev 20:10","Rev 21:8","Rev 21:25-27","Rev 22:6-17","Rev 1:19","Acts 1:8","2 Cor 11:2"]},{"letter":"L","label":"Locking of One's Choice by God","point":"After ample chances God 'locks' a stubborn choice even before death: Pharaoh's heart hardened from the sixth plague, Manasseh unpardoned, Judas told 'do quickly', Pharisees sentenced to hell, the devil and his angels, Jude's grace-perverters, Romans 1's 'God gave them up', and Gen 6:3; so why would God give those in hell another chance?","refs":["Exod 9:12","Exod 8:32","Isa 46:10","2 Kgs 24:4","John 13:27","Matt 23:33","Matt 25:41","Jude 4","Rom 1:24","Rom 1:26","Rom 1:28","Gen 6:3"]}]},"claims":[{"claim":"Luke 16 shows no one can cross from hell to heaven","detail":"The rich man in Hades asked only for a drop of water from Lazarus, a reversal of Lazarus once eating his crumbs, and was refused. Abraham said a great chasm is fixed so none can cross (Luke 16:26). Jesus could have mentioned an ongoing 'come' invitation but did not, because no chances are given after death.","refs":["Luke 16:21-26","Rev 20:14","John 14:2"],"target":"Hell-to-heaven (post-mortem salvation) teaching"},{"claim":"'You ARE in agony' shows punishment is ongoing forever","detail":"Abraham told the rich man 'You are in agony' (Luke 16:25), not 'you were', showing punishment for Christ-rejectors is an ongoing, never-ending process in the afterlife.","refs":["Luke 16:25"],"target":"Hell-to-heaven teaching"},{"claim":"Jesus repeatedly taught hell is eternal and inescapable","detail":"Jesus spoke of 'eternal fire' (Matt 25:41), the fire that never goes out and worms that do not die (Mark 9:43-48) using Gehenna three times; as a theologian summarises, temporary deprivations are worth avoiding eternal torment. He used 'weeping and gnashing of teeth' four times in Matthew and never added 'until you say I'm coming'.","refs":["Matt 25:41","Mark 9:43-48","Matt 8:12","Matt 22:13","Matt 24:51","Matt 25:30"],"target":"Hell-to-heaven teaching"},{"claim":"Paul taught eternal destruction, even without the word 'Gehenna'","detail":"The Chennai pastor says Paul never used 'Gehenna' in 14 epistles, so we needn't either. But Jesus used Gehenna (a Jerusalem garbage dump, like Chennai's Kodungaiyur or Perungudi dumpyards) because he ministered to Jews; James, writing to Jews, used it (Jas 3:6); Paul, apostle to Gentiles, used other language yet taught eternal destruction (2 Thess 1:9); Peter used Tartarus (2 Pet 2:4).","refs":["2 Thess 1:9","Jas 3:6","Acts 9:15","2 Pet 2:4","Matt 28:19-20"],"target":"Argument from Paul's silence on Gehenna"},{"claim":"Hebrews' 'eternal judgment' means people stay in hell forever","detail":"Hebrews 6:2 joins 'eternal' with 'judgment'. If hell were temporary, it would be called 'short-lived', 'fleeting', 'temporary' or 'passing' judgment, the words various translations use for the pleasures of sin in Heb 11:25.","refs":["Heb 6:2","Heb 11:25"],"target":"Hell-to-heaven teaching"},{"claim":"Jude teaches Sodom's eternal punishment","detail":"Jude 7 speaks of 'eternal' fire for the stubborn-till-death people of Sodom and Gomorrah. They will never hear a 'come' from heaven; Sodom is doomed forever.","refs":["Jude 7"],"target":"Hell-to-heaven teaching"},{"claim":"Revelation read in full shows torment forever with no escape","detail":"Rev 14:10-11: smoke of torment forever, no relief day or night. As a dispensational scholar notes, the beast and false prophet are still in the lake after a thousand years (Rev 19:20, 20:10). The lake of fire in Rev 21:8, after people have entered heaven, is the same single lake with continuous torment; there is no escape route.","refs":["Rev 14:10-11","Rev 19:20","Rev 20:10","Rev 20:11-15","Rev 21:3-4","Rev 21:8"],"target":"Hell-to-heaven teaching"},{"claim":"Open gates mean no night and no evil, not ongoing entry from hell","detail":"Rev 21:25's gates are never shut 'for there will be no night there'; on sinful earth you lock doors at night, but in heaven evil is eliminated. Rev 21:27 says only those whose names 'are written' in the Lamb's book enter; this requires repentance and faith while on earth, not names that 'will be written' later.","refs":["Rev 21:25","Rev 21:27"],"target":"Use of Rev 21:25 for post-mortem salvation"},{"claim":"The 'come' of Rev 22:17 is for now, before the Second Coming","detail":"Rev 22:6-7, 12 and 16 ('I am coming soon', 'what must soon take place') show John is returning to the present, as in Rev 1:19, addressing believers awaiting Christ's return. The Spirit and the Bride (the church, 2 Cor 11:2) say 'come' now; Rev 22:17 cannot be lived out after the Second Coming.","refs":["Rev 22:6-7","Rev 22:12","Rev 22:16-17","Rev 1:19","2 Cor 11:2"],"target":"Use of Rev 22:17 as an invitation to those in hell"},{"claim":"Those outside the city are there 'for good'","detail":"Rev 22:14-15 contrasts those who wash their robes and enter with the dogs and sorcerers outside. A popular paraphrase renders it: the tree of life is theirs 'for good', but outside 'for good' are the filthy. So the 'come' of v.17 cannot be directed to them.","refs":["Rev 22:14-15"],"target":"Hell-to-heaven teaching"},{"claim":"Rev 22:17 says what Acts 1:8 says: Spirit-empowered witness now","detail":"Rev 22:16 calls the visions a 'testimony for the churches'; the church, empowered by the Spirit, broadcasts the gospel's 'come' before Jesus returns, just as Acts 1:8 commands. 'He who has an ear' (Rev 2-3) refers to any believer who listens until death or Christ's return; anyone not yet saved should come to Jesus the Living Water now.","refs":["Rev 22:16-17","Acts 1:8","2 Cor 11:2","Rev 2:7","Rev 3:22","John 4:14","Matt 11:28"],"target":"Hell-to-heaven teaching"},{"claim":"God locks the stubborn's choice even before death","detail":"Pharaoh repeatedly hardened his heart until, from the sixth plague (Exod 9:12), God hardened it permanently. Similarly Manasseh (2 Kgs 24:4), Judas (John 13:27), the Pharisees (Matt 23:33), the devil and his angels (Matt 25:41), Jude's grace-abusers (Jude 4), Romans 1's 'God gave them up', and Gen 6:3 show God freezes free will after enough chances. So why would He give those in hell another chance?","refs":["Exod 9:12","Exod 8:32","Exod 4:21","Isa 46:10","2 Kgs 24:4","John 13:27","Matt 23:33","Matt 25:41","Jude 4","Rom 1:24-28","Gen 6:3"],"target":"Hell-to-heaven teaching"},{"claim":"Psalm 96's joyful judgment day applies only to the saved","detail":"Hyper-Love pastors quote Psalm 96 (when God comes to judge, be glad, rejoice, exult, sing for joy) to say judgment need not be feared. But the Psalm speaks of Gentiles who worship and tremble (Ps 96:8-9), i.e. saved people at Christ's return; for unbelievers the day of the Lamb's wrath will be terrifying (Rev 6:15-17, Rev 1:7). Psalm 2:12 and 7:12-13 show judgment for those who refuse to kiss the Son.","refs":["Ps 96:8-13","1 Cor 1:2","1 Cor 1:7","1 Thess 3:13","1 Thess 4:16-18","Rev 1:7","Rev 6:15-17","Ps 2:12","Ps 7:12-13","Acts 20:27"],"target":"Teaching that God's judgment is harmless for everyone"},{"claim":"Hell is not 'in God' or an 'irritating fire' of unwanted love","detail":"The Chennai pastor cites Ps 139:8 to say hell is in God, likening hell's fire to the irritation a wife feels when unwelcome love is pressed on her; hell's fire does not torment. The author replies: no doctrine from one stray Old Testament verse; 2 Thess 1:9 says hell is away from the Lord's presence; no one in Scripture enjoys hell; the rich man was in torment, not complaining of love; the devil, beast and false prophet are tormented forever (Rev 20:10); God does not love Satan; after judgment free will is frozen in heaven and hell (Matt 25:41, 46; Heb 6:2; Jude 13).","refs":["Ps 139:8","2 Thess 1:9","Luke 16:23","Rev 20:10","Rev 20:14","Rev 14:11","Matt 25:41","Matt 25:46","Heb 6:2","Jude 13"],"target":"Teaching that hell is in God's presence and the fire is His love"},{"claim":"Hyper-Love teachers 'gag God' and serve Satan","detail":"Quoting a respected evangelical scholar, the author says such teachers gag God by silencing the severity of His warnings. The hell-to-heaven doctrine is 'a lie straight from hell'; its proponents make hell look 'cute' and are faithful servants of their real boss, Satan; the book aims to stem this rot.","refs":["Acts 20:27"],"target":"Hyper-Love / relational gospel teachers"}],"questions":[{"q":"Is the hell to heaven teaching which a Chennai pastor preaches biblical?","answer":"No; the H-E-L-L outline shows Jesus, the epistles and Revelation teach hell is eternal and inescapable, and God locks stubborn choices."},{"q":"Can those in the lake of fire, responding to the 'come' of the Spirit and Bride, move from hell to heaven?","answer":"No; Rev 22:17's 'come' is the church's invitation now, before the Second Coming, not after."},{"q":"If Paul never used 'Gehenna', why should we?","answer":"Paul taught eternal destruction without the word because Gehenna was a Jewish image; his Gentile audience would not have grasped it, just as Hyderabadis wouldn't grasp Chennai's dumpyards."},{"q":"Do heaven's never-shut gates (Rev 21:25) mean people can keep entering from hell?","answer":"No; gates are open because there is no night and evil is eliminated; only those whose names are already written enter."},{"q":"Why would God give those in hell another chance when He locks stubborn choices even before death?","answer":"He would not; Pharaoh, Manasseh, Judas and others show God freezes free will after enough chances."},{"q":"Is judgment day a time for everyone to be glad, as Psalm 96 says?","answer":"Only for the saved who worship and tremble; for unbelievers it is terrifying (Rev 6:15-17)."},{"q":"Is hell in God, making it enjoyable?","answer":"No; one cannot build doctrine on one OT verse; hell is away from the Lord's presence, no one enjoys it, and its inhabitants are tormented forever."}],"criticisms":[{"of":"a Chennai-based Hyper-Grace pastor (relational/Trinitarian gospel preacher)","quote":"","critique":"At a Hyderabad seminar he combined Rev 21:25 and 22:17 to teach that those in the lake of fire can respond to the 'come' and enter heaven; the author calls this 'a lie straight from hell', creative Scripture-twisting to make hell look harmless."},{"of":"the Chennai pastor on Paul and Gehenna","quote":"Paul did not ever use the word, 'Gehenna' in all his 14 epistles. If Paul can present the Gospel without using the word 'Gehenna', why can't we also do that?","critique":"Paul used different vocabulary for a Gentile audience but still taught eternal destruction (2 Thess 1:9); Peter used Tartarus; the reality of hell is not in doubt."},{"of":"Hyper-Love pastors using Psalm 96","quote":"","critique":"They teach that judgment day is a time to be glad and rejoice for everyone, but the Psalm describes worshipping Gentiles, i.e., the saved, while unbelievers will be terrified."},{"of":"the Chennai pastor on Psalm 139:8","quote":"It is like the irritating fire your wife feels when you try to make love to her without her permission, when she is in a bad mood; When God, in hell, tries to shower his stubborn love upon hell-dwellers, they would feel that it is like an irritating fire! (paraphrased by the author as 'in effect')","critique":"Doctrine cannot be built on one Old Testament verse; 2 Thess 1:9 says hell is away from God's presence; no one in the Bible enjoys hell; the rich man was tormented; God does not love Satan; choices are frozen eternally."},{"of":"the Chennai pastor's 'twisted Trinitarian gospel'","quote":"","critique":"The author labels him a Hyper-Grace cult leader whose mission is to make hell look harmless and decent, taking people to hell."}],"illustrations":[{"title":"Reversal of the crumbs","story":"On earth Lazarus ate whatever fell from the rich man's table; in Hades the rich man begged for a drop of water from Lazarus' finger and was refused.","point":"Those in hell cannot receive relief or cross into heaven."},{"title":"Kodungaiyur and Perungudi dumpyards","story":"Jesus' Jewish hearers connected with Gehenna, Jerusalem's burning dump, as Chennai residents would connect with their local dumpyards, but a Hyderabadi would not.","point":"Paul used different words for hell because his audience was Gentile."},{"title":"The Endhiran dumpyard","story":"A movie reviewer recalled the scene in Endhiran where the dismantled robot is dumped in a Chennai dumpyard, yet reconstructs itself.","point":"A bridge to discussing Gehenna, the dumpyard Jesus spoke of."},{"title":"Fleeting pleasures vs eternal judgment","story":"Different translations call sin's pleasures 'short-lived', 'fleeting', 'temporary' and 'passing' (Heb 11:25), yet Hebrews calls judgment 'eternal' (Heb 6:2).","point":"If judgment were temporary, Hebrews would have used such words."},{"title":"Locking doors only on earth","story":"On sinful earth we lock doors at night; heaven has no night and no evil, so gates stay open.","point":"Open gates do not imply a way out of hell."},{"title":"Kaun Banega Crorepati 'lock'","story":"Borrowing the quiz show host's term for locking an answer, God 'locks' a person's stubborn choice after ample chances.","point":"God freezes free will of the stubborn, even before death."},{"title":"Pharaoh's hardened heart","story":"Pharaoh hardened his own heart through five plagues; from the sixth, God hardened it.","point":"After enough chances God makes a stubborn choice permanent."},{"title":"'For good'","story":"A paraphrase renders Rev 22:14-15 as the tree of life theirs 'for good' and outside 'for good' are the filthy.","point":"The fate of those outside is final."},{"title":"Gagging God","story":"A respected evangelical scholar describes such teachers as gagging God by silencing the severity of His warnings.","point":"Hyper-Love minimises the awful, just punishment awaiting the unredeemed."}],"keyVerses":[{"ref":"Rev 21:25","text":"its gates will never be closed","use":"The pastor's proof text; the author explains it as reflecting no night and no evil."},{"ref":"Rev 22:17","text":"The Spirit and the bride say, Come","use":"The church's present-day gospel invitation, not an offer to those in hell."},{"ref":"Luke 16:26","text":"between us and you there is a great chasm fixed","use":"No crossing from hell to heaven."},{"ref":"Luke 16:25","text":"you are in agony","use":"Punishment is ongoing in the afterlife."},{"ref":"Mark 9:48","text":"where their worm does not die and the fire is not quenched","use":"No one can escape hell."},{"ref":"2 Thess 1:9","text":"the penalty of eternal destruction, away from the presence of the Lord","use":"Paul taught eternal punishment."},{"ref":"Heb 6:2","text":"eternal judgment","use":"Judgment is permanent, unlike sin's fleeting pleasures."},{"ref":"Jude 7","text":"a punishment of eternal fire","use":"Sodom is doomed forever."},{"ref":"Rev 20:10","text":"tormented day and night forever and ever","use":"Lake of fire torment never ends."},{"ref":"Rev 21:27","text":"only those whose names are written in the Lamb's book of life","use":"Qualification must be met while on earth."},{"ref":"Acts 1:8","text":"you will receive power... and you will be my witnesses","use":"Parallel to Rev 22:17's Spirit-empowered witness."},{"ref":"Exod 9:12","text":"the LORD hardened the heart of Pharaoh","use":"God locks stubborn choices."},{"ref":"Ps 139:8","text":"if I make my bed in Sheol, you are there","use":"The pastor's text for hell in God; the author rejects building doctrine on it."}],"flow":["Chennai pastor teaches hell-to-heaven from Rev 21:25, 22:17","H: Jesus' Luke 16 shows a fixed chasm","E: Epistles prefix 'eternal' to judgment","L: Revelation's lake of fire torment is forever","Rev 22:17 'come' is present gospel witness","L: God locks stubborn choices, even before death","Psalm 96 and 139:8 misused to make hell harmless"]},{"num":39,"section":"Hyper-Love","title":"Why We Must Give the Hellish Shack Movie Theology a Whack!","summary":"The author uses the acronym W-H-A-C-K to rebut the theology of the movie/novel The Shack and the related 'Trinitarian Gospel', which he renames the 'Twisted Trinitarian Gospel' or 'Hopeful Universalism False Gospel'. He argues that The Shack compromises the Way (Jesus as only Saviour and the need for repentance), Holiness (God's wrath as a call to holy living and the call to imitate Jesus), Hell (God does punish sin, even after the Cross), the Atonement (only the incarnate Son has scars and shed blood), the Creator-creation divide (the Trinity is not 'submitted' to humans) and Konfession (forgiveness requires repentance and confession). He rebuts proof-texts used for universalism (1 Tim 4:10, John 12:32, Phil 2:10) by reading their context, and links this teaching to the Hyper-Grace cult. He closes by warning against a Chennai pastor who teaches that 'all are in Christ' and that dead non-Christian relatives are already saved, insisting that the gospel must be heard and believed.","thesis":"The Shack's 'Trinitarian Gospel' is a hell-populating hopeful universalism that compromises the Way, Holiness, Hell, Atonement, the Creator-creature divide and Confession, and must be rejected.","outline":{"acronym":"W-H-A-C-K","items":[{"letter":"W","label":"The Shack Compromises the WAY","point":"Repentance and the uniqueness of Jesus are compromised: The Shack's Jesus is the 'best' way, not the only way, and he 'joins' people of all religions rather than calling them to repent and come to him.","refs":["John 14:6","Acts 4:12","Matt 11:28","Matt 16:24","Luke 19:5-9","Luke 13:1-5","1 Tim 4:10","1 Tim 2:5"]},{"letter":"H","label":"The Shack Compromises HOLINESS","point":"By saying God does not need to punish sin and that Jesus' life is not an example to copy, The Shack removes the New Testament link between God's coming wrath and the call to holy living, and the obligation to walk as Jesus walked.","refs":["Col 3:5-9","1 Pet 3:10-11","1 Cor 10:1-11","Jude 7","Rom 8:29","1 Cor 11:1","1 Pet 2:21","1 John 2:6"]},{"letter":"H","label":"The Shack Compromises the Doctrine of HELL","point":"The Shack calls belief in God sentencing anyone to hell a fallacy, but God says he punishes sin in both Testaments, and after the Cross there is 'severer punishment' and 'everlasting destruction' for those who disobey the gospel.","refs":["Ex 32:34","Lev 26:18","Heb 10:29","2 Thess 1:8-9","Heb 12:29"]},{"letter":"A","label":"The Shack Compromises the A-TONEMENT","point":"The Shack gives the Father scars in his wrists and says 'we three' became human; but God is spirit, only the Word became flesh, and only Jesus shed blood for us.","refs":["John 4:24","Luke 24:39","John 1:1","John 1:14","Rom 3:25","Eph 2:13","Heb 9:14","1 Pet 1:19","Rev 1:5"]},{"letter":"C","label":"The Shack Compromises the C-REATION-CREATOR Divide","point":"The Shack's Jesus says the Trinity is 'submitted to you' (humans) in the same way they submit to each other, erasing the distinction between the holy Creator and sinful creatures; and The Shack teaches the whole world will be saved, contrary to the wheat-and-tares parable.","refs":["Rom 3:4","Matt 13:30"]},{"letter":"K","label":"The Shack Compromises the K-ONFESSION Teaching","point":"The Shack teaches that all are already forgiven without asking, so neither believers nor unbelievers need to confess sins; but Scripture commands all to repent, and repentance leads to confession and turning from sin.","refs":["Acts 17:30-31","1 John 1:8-10","Rom 2:4-5","2 Tim 2:19","1 John 3:9"]}]},"claims":[{"claim":"Jesus is the only way, not merely the 'best' way","detail":"In The Shack Jesus says 'I'm not a Christian', that his followers come from every religious and political system, and that he is 'the best way' to relate to the Father and Spirit. The author calls this a terrible heresy that contradicts Jesus' claim to be THE way, truth and life and Peter's statement that salvation is found in no other name.","refs":["John 14:6","Acts 4:12"],"target":"Jesus as the 'best' rather than the only way; religious pluralism"},{"claim":"Jesus seeks sinners but saves only after repentance","detail":"It is one thing to say Jesus seeks us, but another to say he wants to 'join us', as The Shack proclaims. Jesus invited all to come to him and bear the cross. He sought Zacchaeus, but announced salvation only after Zacchaeus showed repentance, and he twice warned 'unless you repent you too will perish', which ultimately means eternal hell.","refs":["Matt 11:28","Matt 16:24","Matt 19:14","Luke 19:5-9","Luke 13:1-5","2 Thess 2:9-10","Rev 21:7-8"],"target":"Jesus 'joining' people in their transformation without repentance"},{"claim":"1 Tim 4:10 teaches common grace, not universal salvation","detail":"The Shack's author cites 'the Savior of all men, especially of those who believe' to argue Jesus is the best way. The author says this refers to common grace: sun and rain on all, 'in him we live and move', a temporal grace that does not exempt anyone from judgment. Paul in the same Acts 17 sermon warns of judgment, and the same letter teaches one mediator, coming judgment, and that only repentant, humble rich people reach heaven.","refs":["1 Tim 4:10","Matt 5:45","Acts 17:28","Acts 17:30-31","Heb 9:27","1 Tim 2:5","1 Tim 5:24","1 Tim 6:17-20"],"target":"Universal salvation drawn from 1 Tim 4:10"},{"claim":"The Shack makes Jesus a liar about being forsaken","detail":"Papa in The Shack says 'regardless of what He felt at that moment, I never left him' regarding Jesus' cry 'My God, why have you forsaken me?'. The author argues this makes the One who is the Truth either a liar or emotionally unstable, laying a foundation for a cult by attacking Jesus' very character.","refs":["Matt 27:46"],"target":"The Father never forsook Jesus on the cross"},{"claim":"Exalting the Father while minimizing Jesus is unacceptable","detail":"Quoting James De Young, a former friend of The Shack's author, the author says The Shack de-emphasizes Jesus because he is exclusive (the only way), overemphasizing the fatherhood of God. In the New Testament Jesus is preeminent, the one we go to for truth and comfort. The same is true of the Hyper-Grace teaching.","refs":["Col 1:18"],"target":"Overemphasis on God's fatherhood at Jesus' expense"},{"claim":"'Sin is its own punishment' denies wrath as a holiness call","detail":"Papa says, 'I don't need to punish p
