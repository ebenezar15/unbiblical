eople for sin. Sin is its own punishment... it's my joy to cure it.' The author says this means 'don't worry about sin' and inspires unholy living. The New Testament, written to believers, ties the coming wrath of God to a call to put sin to death and live holy.","refs":["Col 3:5-9","1 Pet 3:10-11","1 Cor 10:1-11","Jude 7"],"target":"No divine punishment for sin"},{"claim":"Believers must imitate Jesus; 'don't copy Jesus' is rubbish","detail":"The Shack's Jesus says his life 'was not meant to be an example to copy'. The author calls this absolute rubbish: God predestined us to be conformed to his Son's image, Paul said follow me as I follow Christ, Peter said Christ left an example, and John says we 'ought' to walk as he walked. Imitating Jesus is an obligation, not an option.","refs":["Rom 8:29","1 Cor 11:1","1 Pet 2:21","1 John 2:6"],"target":"Jesus' life not an example to copy"},{"claim":"God does punish sin, even after the Cross","detail":"The Shack calls God sentencing anyone to hell a 'fallacy'. But God told Moses he would punish Israel's sin and threatened sevenfold punishment. After the Cross, Hebrews speaks of 'severer punishment' for those who trample the Son of God, and Paul speaks of 'everlasting punishment' for disobeying the gospel. God remains a Consuming Fire as well as a Compassionate Father.","refs":["Ex 32:34","Lev 26:18","Heb 10:29","2 Thess 1:8-9","Heb 12:29"],"target":"Denial that God punishes anyone"},{"claim":"The Father has no scars; only the Son became flesh","detail":"Mack sees scars on Papa's wrists and Papa says 'we three' became human. The author answers that God is spirit, a spirit has no body (Luke 24:39), and only the Word became flesh. Only Jesus had a body to shed blood; the Bible speaks of 'the blood of Christ' at least eight times but never of the blood of the Father or Spirit.","refs":["John 4:24","Luke 24:39","John 1:1","John 1:14","Rom 3:25","1 Cor 10:16","Eph 2:13","Heb 9:11","Heb 9:14","1 Pet 1:2","1 Pet 1:19","Rev 1:5"],"target":"The Father bearing crucifixion scars"},{"claim":"The Trinity is not submitted to created humans","detail":"The Shack's Jesus says the Father, Son and Spirit are mutually submitted, and 'we are submitted to you in the same way'. The author says this erases the Creator-creation divide: God is holy and every man a sinner, 'Let God be true and every man a liar.'","refs":["Rom 3:4"],"target":"God submitted to humans"},{"claim":"Not all will be saved: the tares are burned","detail":"Jesus' parable of the wheat and tares shows tares do not become wheat at the end; they are gathered and burned. So some will be saved and others lost. The Shack's author, in a 2017 book, openly believes all will be saved, and The Shack's Papa says 'the whole world' will be saved. Like the Jehovah's Witnesses, this begins with a wrong doctrine of God and fuels a cult.","refs":["Matt 13:30"],"target":"Universal salvation"},{"claim":"Forgiveness without repentance or confession is anti-Scriptural","detail":"Papa says 'in Jesus, I have forgiven all humans... but only some choose relationship', and the movie shows the serial killer forgiven without asking and Mack's unrepentant father in heaven. The author says this hugs the Hyper-Grace teaching of a Singapore megachurch pastor, only extended to unbelievers too. Scripture commands all to repent; realization of sin leads to repentance and confession; unrepentance stores up wrath.","refs":["Acts 17:30-31","1 John 1:8-10","Rom 2:4-5","2 Tim 2:19","1 John 3:9"],"target":"Universal forgiveness without confession"},{"claim":"Read around 'proof-texts': John 12:32 and Phil 2:10","detail":"The Shack's author says 'draw' in John 12:32 means 'drag', so all will be saved even if they do not believe. But fourteen verses later Jesus says those who believe will not remain in darkness (12:46), implying unbelievers go to outer darkness. Likewise 'every knee shall bow' (Phil 2:10) is followed by a 'crooked and depraved generation' (2:15). Reading above and below such verses shows the Bible does not teach universalism.","refs":["John 12:32","John 12:46","Matt 22:13","Phil 2:10","Phil 2:15","2 Pet 3:16"],"target":"Universalist proof-texts"},{"claim":"'All are in Christ' empties 'if anyone is in Christ'","detail":"A Chennai pastor said, 'We cannot say only few are in Christ... All are in Christ.' The author asks why the Bible then says 'if anyone is in Christ'. All have sinned and the wages of sin is death, leading to the second death in the lake of fire; redemption and no condemnation are only for those in Christ, in a living daily relationship.","refs":["2 Cor 5:17","Rom 3:23","Rom 6:23","Rev 21:8","Eph 1:7-8","Rom 8:1"],"target":"All humanity already in Christ"},{"claim":"Hopeful universalism is refuted by the narrow gate","detail":"Hopeful universalism says, 'we hope God will save everyone'. The author cites Jesus' words that the gate to destruction is wide and few find life, Paul's description of the unsaved as 'children of wrath', and 2 Thess 1:7-10's eternal punishment for those who do not know God or obey the gospel.","refs":["Matt 7:13-14","Eph 2:3","2 Thess 1:7-10"],"target":"Hopeful universalism"},{"claim":"Pagans who never heard are not already saved","detail":"The Chennai pastor told of a listener comforted that her dead non-Christian parents were already saved. The author replies that apostolic preaching against idols caused riots in Ephesus, idols are nothing, and people believe only through hearing preached gospel. Those who reject general revelation are without excuse, but those like Cornelius who respond to creation and conscience are given the gospel through missionaries.","refs":["Acts 19:26-28","1 Cor 12:2","1 Cor 8:4","John 17:20","Rom 10:14","Rom 1:19-20","Rom 2:14-15","Acts 10"],"target":"Dead non-believers already saved"}],"questions":[{"q":"Is Jesus the only way to God, or just the best way?","answer":"The author insists Jesus is the only way; calling him the 'best' way is a terrible heresy contradicting John 14:6 and Acts 4:12."},{"q":"Does 1 Timothy 4:10 teach that all are already saved?","answer":"No. It speaks of common grace God gives to all, which is temporal; the same letter teaches one mediator and coming judgment."},{"q":"Did the Father forsake Jesus on the Cross?","answer":"Yes; saying the Father never left him, as The Shack and hyper-love teachers do, makes Jesus a liar."},{"q":"Does God punish anyone for sin after the Cross?","answer":"Yes. Hebrews 10:29 and 2 Thessalonians 1:8-9 speak of severer and everlasting punishment after the Cross; God is a Consuming Fire."},{"q":"Are all people already in Christ?","answer":"No. 'If anyone is in Christ' would be meaningless; only those in a living relationship with Jesus escape condemnation."},{"q":"Are my dead non-Christian parents already saved?","answer":"The author says no; the gospel must be heard and believed, though God gives the gospel to those who respond to general revelation, like Cornelius."},{"q":"Does John 12:32 mean Jesus will drag everyone to salvation?","answer":"No. John 12:46 shows only believers leave darkness; unbelievers go to outer darkness."}],"criticisms":[{"of":"The Canadian author of the novel behind The Shack movie","quote":"The Gospel is that Jesus has already included you into His life... without your vote... Are you suggesting that everyone is saved? That is exactly what I am saying!","critique":"He is a heretic who teaches universal salvation, pluralism (Jesus as the 'best' way), no punishment for sin, no need to copy Jesus, a scarred Father, and a Trinity submitted to humans, fuelling a new cult."},{"of":"The 'Trinitarian Gospel' camp (called 'Twisted Trinitarian Gospel' / 'Hopeful Universalism False Gospel')","quote":"","critique":"It twists elements of the Trinity to teach all are saved even though they don't know it, twisting Scripture to destruction (2 Pet 3:16)."},{"of":"A Chennai Hyper-Grace cum Hyper-Supernaturalism cum Hyper-Love pastor","quote":"We cannot say, only few are in Christ and others are not in Christ! All are in Christ (already).","critique":"He teaches hell-populating hopeful universalism, contradicting 2 Cor 5:17 and Rom 8:1, and assures people that their dead non-Christian parents are already saved."},{"of":"A Singapore megachurch pastor's Hyper-Grace teaching","quote":"","critique":"The Shack theology 'hugs' Hyper-Grace: Hyper-Grace says believers need not confess to be forgiven; The Shack extends it to unbelievers."}],"illustrations":[{"title":"The Shack's plot","story":"Mack's young daughter Missy is abducted and murdered; in 'the Great Sadness' he receives a letter from God inviting him to the shack where her bloody dress was found, and converses there with the Trinity.","point":"The popular story is the vehicle through which a twisted gospel is spread."},{"title":"The Lady-killer forgiven","story":"In the movie the serial killer who killed Mack's daughter is forgiven by the Trinity although he never asked.","point":"The Shack teaches forgiveness without repentance or confession."},{"title":"Mack's alcoholic father in heaven","story":"Mack's stubborn, unrepentant alcoholic father is shown in heaven.","point":"The Shack places the unrepentant in heaven, contrary to Scripture."},{"title":"Cults start with a wrong doctrine of God","story":"Just as the Jehovah's Witnesses begin by denying that Jesus is God, The Shack begins with a distorted Trinity.","point":"Error about God's nature lays the foundation of a cult."},{"title":"Riot in Ephesus","story":"Paul's preaching that handmade gods are no gods threatened the idol trade and caused a riot (Acts 19:26-28).","point":"The apostles did not treat other religions as already saving; people of every faith must hear of Jesus."},{"title":"Cornelius","story":"Cornelius responded well to God's general revelation and God sent Peter with the gospel (Acts 10).","point":"God rewards those who respond to general revelation with access to the gospel."}],"keyVerses":[{"ref":"John 14:6","text":"I am the way, the truth, and the life","use":"Jesus is THE way, not the best way."},{"ref":"Acts 4:12","text":"Salvation is found in no one else","use":"Refutes The Shack's pluralism."},{"ref":"1 Tim 4:10","text":"the Savior of all men, and especially of those who believe","use":"Explained as common grace, not universal salvation."},{"ref":"Col 3:5-6","text":"Because of these, the wrath of God is coming","use":"Wrath linked to a holiness call for believers."},{"ref":"1 John 2:6","text":"whoever says he abides in him ought to walk in the same way","use":"Imitating Jesus is an obligation."},{"ref":"Heb 10:29","text":"How much severer punishment...","use":"Punishment continues after the Cross."},{"ref":"Matt 13:30","text":"First gather up the tares... to burn them","use":"Not all will be saved."},{"ref":"John 12:46","text":"no one who believes in me should stay in darkness","use":"Context refuting a universalist reading of John 12:32."},{"ref":"Matt 7:13-14","text":"the gate is wide... that leads to destruction","use":"Only a few will find life."},{"ref":"Rom 10:14","text":"how can they hear without someone preaching","use":"People must hear the gospel to be saved."}],"flow":["The Shack spreads a Twisted Trinitarian Gospel","W: Jesus only way; repentance required","H: Wrath calls to holiness; copy Jesus","H: God punishes sin; hell is real","A, C: Only the Son incarnate; Creator above creatures","K: Forgiveness requires repentance and confession","Context refutes universalist proof-texts","Beware Chennai pastor's 'all are in Christ' teaching"]},{"num":40,"section":"Hyper-Love","title":"A Biblical Response to the Attempt by Hyper-Love False Teachers to Crucify the Main Reason Why Jesus Was Crucified for Us: To Take Away Our Sin!","summary":"The author responds to the hyper-love / twisted Trinitarian gospel camp, including a Chennai pastor, who he says want to delete 'sin' from Christian preaching and claim Jesus died only to affirm us as God's children. He rejects the charge from The Shack's theologian that penal substitution amounts to 'cosmic child abuse' and shows that Isaiah, Paul, Peter, John and the writer of Hebrews all link Christ's death to our sins. He criticises a popular single-translator paraphrase for inserting 'not even the worst sins' into Romans 8:35, arguing that the verse lists sufferings and that Isaiah 59:2 says sin separates. He grants that Jesus died to make us sons too ('Forgiven' and 'Not Forsaken'), but insists sin is the prime reason, that denying the Father's forsaking makes Jesus a liar, and that Jesus never became a sinner (against a Madurai pastor's reading of 2 Cor 5:21).","thesis":"Every major Bible writer presents Jesus' death as a penal substitution for our sins, so the hyper-love attempt to remove sin as the main reason for the Cross is a lie.","outlines":[{"acronym":"Bible writers who link the Cross to sin","items":[{"letter":"1","label":"Prophet Isaiah","point":"The Suffering Servant was pierced for our transgressions and crushed for our iniquities; the Lord laid on him the iniquity of us all. The New Testament identifies Christ as this Servant.","refs":["Isa 53:5","Isa 53:6","Matt 8:17","Acts 8:26-40"]},{"letter":"2","label":"Apostle Paul","point":"Christ died for our sins as of first importance, was delivered over for our sins, and in him we have redemption through his blood, the forgiveness of sins; he came to save sinners.","refs":["1 Cor 15:3","Rom 4:25","Eph 1:7","1 Tim 1:15","2 Cor 5:21"]},{"letter":"3","label":"Apostle Peter","point":"He himself bore our sins in his body on the tree.","refs":["1 Pet 2:24"]},{"letter":"4","label":"Apostle John","point":"He is the atoning sacrifice for our sins; the Good Shepherd lays down his life for straying sheep.","refs":["1 John 2:2","John 10:11","John 10:15","Isa 53:6"]},{"letter":"5","label":"The writer to the Hebrews","point":"He died as a ransom to set them free from sins, echoing Jesus' own ransom saying.","refs":["Heb 9:15","Mark 10:45","Luke 23:34"]}]},{"acronym":"Two reasons Jesus died","items":[{"letter":"F","label":"FORGIVEN ('sin' reason)","point":"Jesus died so he could offer forgiveness to sinners ('Father, forgive them').","refs":["Luke 23:34"]},{"letter":"N","label":"NOT FORSAKEN ('son' reason)","point":"Jesus voluntarily chose to be forsaken by the Father so he could adopt us into his family.","refs":["Matt 27:46"]}]}],"claims":[{"claim":"Hyper-love teachers want to delete 'sin' from Christian preaching","detail":"The author says this camp hates any mention of sin because it makes people uncomfortable, fulfilling Paul's prediction of teachers who tell itching ears what they want to hear. They effectively say 'Jesus' death was only to affirm you as His child; sin has nothing to do with it.'","refs":["2 Tim 4:3"],"target":"Sin removed from the meaning of the Cross"},{"claim":"The 'cosmic child abuse' charge dismisses penal substitution","detail":"The Shack's theologian alleges that if Jesus died for our sins, it would amount to 'cosmic child abuse', dismissing the majority evangelical view that Jesus died as a substitute to save sinners. The author calls such teachers liars on the road to hell who crucify the main reason Jesus was crucified.","refs":[],"target":"Rejection of penal substitution"},{"claim":"Isaiah: the Servant was pierced for our transgressions","detail":"Isaiah 53:5 says he was pierced for our transgressions and crushed for our iniquities, and Matthew 8:17 and Acts 8:26-40 clearly present Christ as this Suffering Servant.","refs":["Isa 53:5","Matt 8:17","Acts 8:26-40"],"target":"Sin not the reason for the Cross"},{"claim":"Paul repeatedly says Christ died for our sins","detail":"Paul says 'Christ died for our sins' was of first importance (1 Cor 15:3), that Jesus was delivered over for our sins (Rom 4:25), and in Ephesians, redemption through his blood, the forgiveness of sins (Eph 1:7).","refs":["1 Cor 15:3","Rom 4:25","Eph 1:7"],"target":"Cross with no relation to sin"},{"claim":"A popular paraphrase wrongly adds 'worst sins' to Romans 8:35","detail":"The author says a popular single-translator paraphrase, though a blessing, inserts 'not even the worst sins listed in Scripture' into Romans 8:35. Other translations show the list contains only sufferings. The same translator does list sins correctly in Psalm 19:12-13. Isaiah 59:2 teaches that sin separates us from God, ultimately for unrepentant believers who store up wrath (Rom 2:5) and end in hell.","refs":["Rom 8:35","Ps 19:12-13","Isa 59:2","Rom 2:5"],"target":"Sin cannot separate a believer from God"},{"claim":"Ephesians 1:5 sonship must not eclipse 1:7's sin-reason","detail":"The Chennai pastor's 'Triune Dance' message uses the paraphrase of Ephesians 1 and focuses on sonship in verse 5 while missing 'forgiveness of sins' in verse 7. Paul did not treat sin as okay: he told thieves to steal no more and linked Christ's sacrificial love to sexual purity.","refs":["Eph 1:5","Eph 1:7","Eph 4:28","Eph 5:2-3"],"target":"Sonship without sin in Ephesians 1"},{"claim":"Grace given before time does not cancel 'Christ came to save sinners'","detail":"The Chennai pastor quotes 2 Timothy 1:9, grace given 'before the beginning of time', to say grace has nothing to do with sin. The author agrees grace preceded sin but says Paul's earlier statement in 1 Timothy 1:15 is crystal clear: Christ came to save sinners.","refs":["2 Tim 1:9","1 Tim 1:15"],"target":"Grace unrelated to sin"},{"claim":"Peter: he bore our sins in his body on the tree","detail":"1 Peter 2:24 says he himself bore our sins in his body on the tree, so that we might die to sin and live to righteousness.","refs":["1 Pet 2:24"],"target":"Cross unrelated to sin"},{"claim":"John: Jesus is the atoning sacrifice for our sins","detail":"1 John 2:2 calls Jesus the atoning sacrifice for our sins, and John 10 pictures the Good Shepherd laying down his life for wayward sheep, echoing Isaiah 53:6: all we like sheep have gone astray and the Lord laid on him the iniquity of us all.","refs":["1 John 2:2","John 10:11","John 10:15","Isa 53:6"],"target":"Cross unrelated to sin"},{"claim":"Hebrews: Jesus died as a ransom from sins","detail":"Hebrews 9:15 says he died as a ransom to set them free from sins, using Jesus' own ransom imagery (Mark 10:45). The author adds that 'Father, forgive them' (Luke 23:34) shows the prime reason he died: to offer forgiveness to sinners.","refs":["Heb 9:15","Mark 10:45","Luke 23:34"],"target":"Cross unrelated to sin"},{"claim":"Embrace both reasons: Forgiven (sin) and Not Forsaken (son)","detail":"The author does not deny that Jesus died to make us God's children. 'My God, why have you forsaken me?' shows he voluntarily chose to be abandoned by the Father so he could adopt us. We should embrace both the forgiven and not-forsaken reasons and not emphasize one at the cost of the other.","refs":["Luke 23:34","Matt 27:46"],"target":"One-sided emphasis"},{"claim":"Denying the Father forsook Jesus makes Jesus a liar","detail":"Many hyper-love teachers say the Father did NOT forsake Jesus on the cross, which in effect calls Jesus a liar because he said the opposite. Calling Jesus a liar will bring punishment; they do it to make their doctrine sound good.","refs":["Matt 27:46"],"target":"The Father never forsook the Son"},{"claim":"Jesus never became a sinner, contrary to a Madurai pastor","detail":"Paul says God made him to be sin who knew no sin so we might become God's righteousness (2 Cor 5:21). A Madurai hyper-grace pastor uses this verse to teach that Jesus became a sinner on the cross, but the Bible says Jesus never became a sinner or sinned (1 John 3:5).","refs":["2 Cor 5:21","1 John 3:5"],"target":"Jesus became a sinner on the cross"}],"questions":[{"q":"Did Jesus die because of our sins?","answer":"Yes. Every major Bible writer (Isaiah, Paul, Peter, John, Hebrews) presents Jesus dying as a substitute for sinners."},{"q":"Am I saying Jesus never died to make us God's children?","answer":"No. He chose to be forsaken so he could adopt us; we must embrace both the 'Forgiven' and 'Not Forsaken' reasons."},{"q":"Does sin separate a believer from God?","answer":"Yes. Isaiah 59:2 teaches sin separates; Romans 8:35 lists sufferings, not sins, and unrepentant believers storing up wrath will ultimately land in hell."},{"q":"Did Jesus become a sinner on the cross?","answer":"No. 2 Corinthians 5:21 does not mean that; Jesus never sinned or became a sinner (1 John 3:5)."},{"q":"Did the Father forsake Jesus on the cross?","answer":"Yes; denying it makes Jesus a liar in effect."}],"criticisms":[{"of":"The hyper-love / twisted Trinitarian gospel camp","quote":"Jesus' death was to only affirm you as His child. Sin has nothing to do with it!","critique":"They hate the mention of sin, want itching ears tickled, and are liars on the road to hell, crucifying the main reason Jesus was crucified."},{"of":"The theologian of The Shack movie fame","quote":"If Jesus died on the cross for our sins it would amount to 'cosmic child abuse'.","critique":"He summarily dismisses the majority evangelical view of penal substitution."},{"of":"A Chennai Hyper-Grace / twisted Trinitarian gospel pastor ('Triune Dance' message)","quote":"","critique":"He uses a paraphrase of Ephesians 1 and 2 Timothy 1:9 to teach sin is not the major reason Jesus went to the cross, focusing on sonship in Eph 1:5 while missing forgiveness in Eph 1:7."},{"of":"The creator of a popular single-translator contemporary paraphrase","quote":"...not even the worst sins listed in Scripture (Rom 8:35, paraphrase)","critique":"He inserted words not in the text, turning a list of sufferings into a teaching that sin cannot separate a believer from God, though he lists sins correctly in Psalm 19."},{"of":"A Madurai-based hyper-grace pastor","quote":"","critique":"He uses 2 Corinthians 5:21 to teach that Jesus became a sinner on the cross, which is unscriptural (1 John 3:5)."}],"illustrations":[{"title":"Itching ears","story":"Paul predicted a time when people would surround themselves with teachers who approve their lifestyles (2 Tim 4:3).","point":"Hyper-love teachers delete sin because it makes hearers uncomfortable."},{"title":"Two lists compared: Psalm 19 vs Romans 8:35","story":"The paraphrase correctly lists only sins in Psalm 19:12-13 but inserts sin into Romans 8:35's list of sufferings.","point":"The insertion is a goof-up that suggests sin does not separate from God."},{"title":"The unknown author of Hebrews","story":"Hebrews may have been written by Priscilla, Apollos, Barnabas or someone else, but the Spirit-led author is clear that Jesus died as a ransom.","point":"Whoever wrote it, the sin-substitution message is unmistakable."}],"keyVerses":[{"ref":"Isa 53:5","text":"He was pierced for our transgressions","use":"Prophetic proof of substitution."},{"ref":"1 Cor 15:3","text":"Christ died for our sins in accordance with the Scriptures","use":"Sin as the first-importance reason for the cross."},{"ref":"Eph 1:7","text":"redemption through his blood, the forgiveness of sins","use":"Answers sonship-only reading of Ephesians 1."},{"ref":"Isa 59:2","text":"your iniquities have made a separation","use":"Sin separates from God."},{"ref":"1 Pet 2:24","text":"He himself bore our sins in his body on the tree","use":"Peter on substitution."},{"ref":"1 John 2:2","text":"He is the atoning sacrifice for our sins","use":"John on substitution."},{"ref":"Heb 9:15","text":"died as a ransom to set them free from the sins","use":"Hebrews on ransom."},{"ref":"2 Cor 5:21","text":"he made him to be sin who knew no sin","use":"Exchange, but Jesus never became a sinner."}],"flow":["Hyper-love camp removes sin from the Cross","'Cosmic child abuse' charge rejects penal substitution","Isaiah, Paul, Peter, John, Hebrews link Cross to sin","Paraphrase error on Rom 8:35 corrected","Eph 1:5 sonship balanced by Eph 1:7 forgiveness","Both reasons: Forgiven and Not Forsaken","Jesus forsaken truly; never became a sinner"]},{"num":41,"section":"Miscellaneous","title":"Don't Mistake Wolves for Labradors! The Characteristics of Hell-Populating False Teachers Explained","summary":"Opening the Miscellaneous section, the author draws from 2 Peter 2 the marks of false teachers so believers do not mistake 'wolves' for friendly 'Labradors' and support their ministries. False teachers are secretive (claiming to be mainstream while being cultic), bring destructive heresies leading to hell unless they repent, excuse sin and use grace as a licence, and are driven by greed. He applies this to preachers of Hyper-Grace and 'immortality on earth', those who preach love without wrath, those who offer hope of moving from hell to heaven, and those who say Jesus will not return until a generation believes in immortality. Peter calls them 'accursed children', writing mainly to warn the believers who follow them.","thesis":"Believers must recognise false teachers by the marks given in 2 Peter 2 and stop supporting them, because their destructive heresies lead to hell.","outlines":[{"acronym":"Characteristics of false teachers (2 Pet 2)","items":[{"letter":"1","label":"Secretive","point":"They present themselves as mainstream while being cultic; popular opinion, not the Bible, is their final court of appeal; some even say 'the Bible is not the Word of God'.","refs":["2 Pet 2:1","Matt 7:15"]},{"letter":"2","label":"Destructive heresies","point":"Unless they repent they head to hell and take their followers with them; Peter promises hell for unrepentant false teachers.","refs":["2 Pet 2:1","2 Pet 3:9","2 Pet 2:4"]},{"letter":"3","label":"A theology that excuses sin","point":"Eyes full of adultery, enticing unsteady souls; they use grace as a licence for immorality ('the grace of God is ALWAYS there').","refs":["2 Pet 2:14","Jude 4"]},{"letter":"4","label":"Greed","point":"Motivated by love of money, they preach a God of love but not his wrath lest people stop giving or leave.","refs":["2 Pet 2:14"]},{"letter":"5","label":"Hell-to-heaven hope","point":"They mention hell but promise one can go from hell to heaven, tickling ears.","refs":[]},{"letter":"6","label":"Delayed return","point":"They say Jesus will not return until a generation believes in immortality on earth, so in effect people can live in sin.","refs":[]}]}],"claims":[{"claim":"False teachers will arise and must be identified","detail":"2 Peter 2:1 says false teachers will secretly bring in destructive heresies, even denying the Master who bought them. The 'man of God' you hear on Sundays, if he teaches Hyper-Grace, immortality on earth and similar salvation-affecting teaching, is a false teacher.","refs":["2 Pet 2:1"],"target":"Hyper-Grace and immortality-on-earth preachers"},{"claim":"False teachers are secretive, claiming to be mainstream","detail":"They want to appear part of mainstream Christianity while being cultic and vehemently deny it, because popular opinion rather than the Bible is their final court of appeal; some say 'The Bible is not the Word of God.' They are wolves who look like Labradors, and believers pamper them by attending and supporting.","refs":["2 Pet 2:1","Matt 7:15"],"target":"Teachers who appear orthodox"},{"claim":"Destructive heresies lead teachers and followers to hell","detail":"Unless they repent (2 Pet 3:9), false teachers are heading for hell and taking their blind followers with them; just three verses later Peter promises hell for them (2 Pet 2:4).","refs":["2 Pet 2:1","2 Pet 3:9","2 Pet 2:4"],"target":"Unrepentant false teachers"},{"claim":"False teachers excuse sin and use grace as licence","detail":"2 Peter 2:14 describes eyes full of adultery, insatiable for sin, enticing unsteady souls. Such teachers construct a theology that excuses sin, saying 'after all, the grace of God is ALWAYS there', using grace as a licence for immorality as Jude 4 says.","refs":["2 Pet 2:14","Jude 4"],"target":"Grace as licence"},{"claim":"Greed drives false teachers to hide God's wrath","detail":"They twist God's Word out of love for money, preaching a God of love but not his wrath, lest hearers be offended and stop giving or leave their church.","refs":["2 Pet 2:14"],"target":"Love-without-wrath preaching"},{"claim":"Hope of hell-to-heaven transfer tickles ears","detail":"False teachers will mention hell but give hope that one can come from hell to heaven, so that people feel good.","refs":[],"target":"Post-mortem salvation"},{"claim":"'Jesus won't return until immortality is believed' licenses sin","detail":"Some teach that Jesus will not return until a generation believes in immortality on earth. Since that is unlikely, Jesus won't come back soon, and people in effect can live in sin.","refs":[],"target":"Immortality-generation teaching on the Second Coming"},{"claim":"Peter called them 'accursed children' to warn their followers","detail":"Peter called these teachers 'accursed children' (2 Pet 2:14), knowing they were hell-headed. He wrote primarily not to warn the false teachers but the believers who follow them without a second thought.","refs":["2 Pet 2:14"],"target":"Uncritical followers of false teachers"}],"questions":[{"q":"Is the 'man of God' I listen to every Sunday a false teacher?","answer":"If he teaches Hyper-Grace, immortality on earth or similar salvation-affecting false teaching, he is."},{"q":"Why do false teachers hide God's wrath?","answer":"Out of greed, so hearers are not offended and keep giving and attending."}],"criticisms":[{"of":"Hyper-Grace and 'immortality on earth' preachers","quote":"After all, the grace of God is ALWAYS there.","critique":"They are secretive, cultic wolves who excuse sin, use grace as licence and teach destructive heresies."},{"of":"Teachers who say the Bible is not the Word of God","quote":"The Bible is not the Word of God.","critique":"Popular opinion, not Scripture, is their final court of appeal."},{"of":"Teachers offering hope of hell-to-heaven","quote":"","critique":"They tickle ears by promising escape from hell."},{"of":"Teachers who say Jesus won't return until a generation believes in immortality","quote":"","critique":"This in effect postpones the Second Coming indefinitely and lets people live in sin."}],"illustrations":[{"title":"Wolves mistaken for Labradors","story":"Wolves have a deceptive appearance; we can mistake them for friendly Labradors and pamper them by attending their churches and supporting their ministries.","point":"Believers must not be fooled by the friendly appearance of false teachers."}],"keyVerses":[{"ref":"2 Pet 2:1","text":"there will be false teachers among you, who will secretly bring in destructive heresies","use":"Defines false teachers as secretive and destructive."},{"ref":"Matt 7:15","text":"false prophets... wolves","use":"Wolf imagery for false teachers."},{"ref":"2 Pet 2:14","text":"eyes full of adultery... hearts trained in greed. Accursed children!","use":"Sin-excusing, greed and Peter's verdict."},{"ref":"Jude 4","text":"turn the grace of our God into licentiousness","use":"Grace used as licence."}],"flow":["Appreciate true teachers, beware false ones","2 Pet 2:1: secretive, destructive heresies","Wolves look like Labradors; stop supporting them","They excuse sin and use grace as licence","Greed: love without wrath, hell-to-heaven hope","Peter warns followers: 'accursed children'"]},{"num":42,"section":"Miscellaneous","title":"Should We Celebrate Jewish Feasts Mentioned in the Bible and Expect That Jesus Would Return During One Such Celebration?","summary":"The author says New Testament Christians need not celebrate Jewish feasts; it is a matter of free will, and celebrating them as a means of salvation insults Christ's finished work. Gentile believers are already spiritually circumcised and may eat pork; forbidding foods is a mark of false teachers. He warns against Hyper-Jewish groups who claim Jesus will return around a particular Jewish feast, because the Bible says seven times he comes as a thief, compares his coming to sudden labour pains, and says no one but the Father knows the day. Saved believers, however, keep the moral law (repeated in the New Testament) out of gratitude, empowered by grace and the Spirit.","thesis":"Jewish feasts are optional for Christians, cannot save, and give no basis for predicting the date of Jesus' return, though saved believers obey God's moral law by grace.","outline":null,"claims":[{"claim":"Celebrating Jewish feasts is optional for Christians","detail":"New Testament Christians do not need to celebrate Jewish feasts; it is left to free will (Rom 14:5-6).","refs":["Rom 14:5-6"],"target":"Mandatory feast observance"},{"claim":"Keeping feasts to be saved insults Christ's finished work","detail":"Celebrating Jewish feasts thinking the act will save us is an insult to Jesus' finished work on the Cross (Gal 4:10).","refs":["Gal 4:10"],"target":"Feast-keeping for salvation"},{"claim":"Gentile believers are spiritually circumcised","detail":"When Gentiles trust Jesus they are already spiritually circumcised (Col 2:11) and need no physical circumcision. Just as circumcision removes the foreskin, salvation and Spirit-powered intimacy with Jesus give power to 'remove' sinful addictions.","refs":["Col 2:11"],"target":"Circumcision requirement"},{"claim":"Christians can eat pork; food bans mark false teachers","detail":"No matter what hyper-Jewish false teachers say, believers may eat pork, because Paul says those who command abstinence from foods God created are hypocritical liars (1 Tim 4:2-3).","refs":["1 Tim 4:2-3"],"target":"Hyper-Jewish food laws"},{"claim":"No one can predict Jesus' return on a Jewish feast","detail":"Some Hyper-Jewish groups claim 'Jesus will come around this Jewish feast' to coax believers into feast-keeping. But the Bible says seven times he comes as a thief in the night, uses the image of sudden labour pains, and twice says no one but the Father knows the day.","refs":["Matt 24:43","Luke 12:39","1 Thess 5:2","1 Thess 5:4","2 Pet 3:10","Rev 3:3","Rev 16:15","Matt 24:36","Mark 13:32"],"target":"Date-setting by Jewish feasts"},{"claim":"Saved believers obey the moral law out of gratitude","detail":"The New Testament repeats the moral commandments (Heb 13:4 on adultery, Eph 4:28 on stealing, Col 3:9 on lying). Keeping the moral law does not save us, but truly saved people follow it by grace and the Spirit. Rev 22:13-14: Jesus is the Alpha and Omega of salvation, but we must wear what he freely gives, using his power to live holy, to enter heaven.","refs":["Heb 13:4","Eph 4:28","Col 3:9","Rev 22:13-14"],"target":"Antinomianism"}],"questions":[{"q":"Should we celebrate Jewish feasts as New Testament Christians?","answer":"It is not compulsory but left to free will; celebrating them to be saved insults the finished work of Christ."},{"q":"Will Jesus return during a Jewish feast?","answer":"No one can know; he comes as a thief, suddenly, and only the Father knows the day."},{"q":"Can Christians eat pork?","answer":"Yes; forbidding foods God created is the teaching of hypocritical liars (1 Tim 4:2-3)."}],"criticisms":[{"of":"Hyper-Jewish groups","quote":"Jesus will come around this Jewish feast.","critique":"They use date predictions to coax believers into feast-keeping and impose food laws and circumcision, contrary to the finished work of Christ."}],"illustrations":[{"title":"Circumcision as removal of addictions","story":"As physical circumcision removes the foreskin, Spirit-powered intimacy with Jesus removes sinful addictions.","point":"Spiritual circumcision has practical power for holy living."},{"title":"A pregnant woman's labour","story":"We cannot know the exact time a pregnant mother will give birth.","point":"Likewise no one can know the exact time of Jesus' return."},{"title":"Wearing what Jesus gives","story":"Jesus gives us robes freely, but we must wear them to enter (Rev 22:13-14).","point":"We must use his power to live holy."}],"keyVerses":[{"ref":"Rom 14:5-6","text":"One person esteems one day as better than another","use":"Feast-keeping is optional."},{"ref":"Gal 4:10","text":"You observe days and months and seasons","use":"Feast-keeping for salvation insults Christ's work."},{"ref":"Col 2:11","text":"circumcised with a circumcision made without hands","use":"Gentiles need no physical circumcision."},{"ref":"1 Tim 4:3","text":"require abstinence from foods","use":"Food bans are false teaching."},{"ref":"Matt 24:36","text":"of that day and hour no one knows","use":"No date-setting."}],"flow":["Jewish feasts optional; free will","Feast-keeping to be saved insults Christ","Gentiles spiritually circumcised; may eat pork","Hyper-Jewish date-setting rejected","Jesus comes as thief; only Father knows","Saved believers keep moral law by grace"]},{"num":43,"section":"Miscellaneous","title":"Take the Vaccine, and You Take the Beast's (Antichrist's) Mark?","summary":"The author rejects the claim that the Covid vaccine is the mark of the beast, including the numerology that adds the letters of 'Corona' to 66 plus six letters. Using four 'S' headings, he argues from the Setting (Revelation was written to seven real churches in Asia Minor tempted by the Roman imperial cult under Nero or Domitian, popularly called 'beasts'), the Symbolism of 666 (Nero Caesar in Hebrew letters), the Shopping-Selling ban (coins and markets tied to emperor worship; a call to endure), and the Sealing of the saved (the 144,000 and the forehead marks of Rev 7 and Ezekiel 9 are symbolic). The mark of the beast therefore means letting anti-biblical policies of rulers or bosses shape your thinking (forehead) and actions (hands), and the call is never to compromise faith under pressure. He concludes that believers should take the vaccine unless it comes with a demand to worship a ruler.","thesis":"Read in its first-century context and symbolism, the mark of the beast refers to compromising with emperor-worship, not to receiving a vaccine, so Christians should take the Corona vaccine.","outline":{"acronym":"S-S-S-S","items":[{"letter":"S","label":"The SETTING of the Book of Revelation","point":"Revelation was written to seven actual churches in Asia Minor facing the Roman imperial cult; Nero and Domitian were popularly called 'beasts', and readers knew whom John meant.","refs":["Rev 1:4","Rev 1:11","1 Cor 5"]},{"letter":"S","label":"The SYMBOLISM of the Beast's Number (666)","point":"'Nero Caesar' in Hebrew letters totals 666; John used code language his readers understood to avoid trouble with the persecuting emperor.","refs":["Rev 13:18"]},{"letter":"S","label":"The SHOPPING-SELLING ban","point":"Coins bore Caesar's god-like image and markets were controlled by the emperor cult; refusing worship meant economic exclusion. Revelation calls believers to endure and not join the cult, as Hebrews did.","refs":["Rev 13:17","Rev 2:10","Rev 14:9-10","Heb 10:34"]},{"letter":"S","label":"The SEALING of the saved","point":"The 144,000 (12 x 12 x 1000) symbolises the redeemed from Old and New Testaments in large numbers, like Rev 5:9; Ezekiel 9's forehead mark is symbolic too, so the beast's mark is also symbolic.","refs":["Rev 7:2-8","Rev 5:9","Ezek 9:3-4","Ezek 9:10-11","Rev 13:16","Rev 20:4"]}]},"claims":[{"claim":"Corona numerology linking the vaccine to 666 does not hold","detail":"Because the mark is received on the forehead and hand (Rev 13:16-17, 14:9, 20:4) and the vaccine is given in the arm, some argue that C-O-R-O-N-A equals 66 with six letters, hence 666. The author asks whether this holds water and concludes it violates sound interpretation.","refs":["Rev 13:11","Rev 13:16-17","Rev 14:9","Rev 20:4"],"target":"Vaccine as mark of the beast"},{"claim":"Revelation must be read in its first-century setting","detail":"Every New Testament letter has a context; Corinthians addressed a man sleeping with his father's wife. Revelation was written to seven specific churches in Asia Minor tempted by the Roman imperial cult (Rev 1:4,11). As we read Corinthians in context, we must read Revelation in context.","refs":["1 Cor 5","Rev 1:4","Rev 1:11"],"target":"Context-less futurist reading"},{"claim":"Nero and Domitian were whispered of as 'beasts'","detail":"Scholars date Revelation to Nero or Domitian. One killed his own mother and Christians; the other flattered a steward and killed him the next day. Their erratic behaviour earned them the whispered title 'beasts', so original readers instantly knew who was meant, as a cricket fan knows 'The Wall' is Rahul Dravid.","refs":[],"target":"Futurist identification of the beast"},{"claim":"666 encoded 'Nero Caesar' in Hebrew letters","detail":"Hebrews and Greeks assigned numbers to letters; 'Nero Caesar' in Hebrew letters totals 666. John used this code, with 'the beast', so that believers would not get into trouble for possessing a letter naming the persecuting emperor.","refs":["Rev 13:18"],"target":"666 as a future code"},{"claim":"The buy-sell ban was about the emperor cult and markets","detail":"Coins bore Caesar's image conformed to deities (an AD 89/90 Ephesian coin shows Domitian as Zeus), and a huge imperial statue stood in Ephesus. Refusing to worship Caesar meant losing market access and being accused of sedition. Revelation called believers to endure (Rev 2:10), warning that stubborn Caesar-worship leads to burning sulphur (Rev 14:9-10), as Hebrews urged joyful acceptance of property loss (Heb 10:34).","refs":["Rev 13:17","Rev 2:10","Rev 14:9-10","Heb 10:34"],"target":"Literal future buy-sell mark"},{"claim":"The 144,000 and sealing are symbolic","detail":"The 144,000 sealed from Israel's tribes (Rev 7:2-8) is 12 x 12 x 1000: Old and New Testament saints saved in great numbers by the blood of Jesus, which is what Rev 5:9 says directly. If that sealing is symbolic, the mark of the beast can be too.","refs":["Rev 7:2-8","Rev 5:9"],"target":"Literal sealing and marks"},{"claim":"Mark on head and hand means letting evil policies shape thinking and action","detail":"Symbolically, if you allow the anti-biblical, anti-Jesus policies of your political ruler or workplace boss to shape your mind, you receive the mark on your head; if they shape your actions, on your hands.","refs":["Rev 13:16","Rev 14:9","Rev 20:4"],"target":"Literal physical mark"},{"claim":"Ezekiel 9's forehead mark is also symbolic","detail":"In Ezekiel 9 a man in linen marks the foreheads of those who grieve over Jerusalem's abominations, and they are spared judgment. Those today who turn from popular sins like porn, pride and foul language, enabled by grace and cleansed by the blood, are spiritually 'marked' and saved from coming wrath and hell.","refs":["Ezek 9:3-4","Ezek 9:10-11"],"target":"Literal marks"},{"claim":"The real message: never compromise faith under pressure","detail":"The message woven around this symbolism is the Bible's constant call: even if it costs your life, do not compromise your faith under political or peer pressure (Heb 12:4, Acts 20:24, 21:13). The mark has to do with rejecting compromise with sin promoted by celebrities, false teachers and the powerful.","refs":["Heb 12:4","Acts 20:24","Acts 21:13"],"target":"Fear-driven literalism"},{"claim":"Christians should take the Corona vaccine","detail":"Unless a nurse says you must agree to worship the Prime Minister or President to receive the vaccine, you need not refuse it. Since nowhere in the world is that happening, everyone should be vaccinated rather than letting bizarre interpretation prevent it.","refs":[],"target":"Vaccine refusal on prophetic grounds"}],"questions":[{"q":"If I take the vaccine, do I take the beast's mark?","answer":"No. In its context the mark refers to compromise with emperor worship, not an injection."},{"q":"Does 'Corona' add up to 666?","answer":"The numerology (66 plus six letters) violates sound interpretation; 666 decoded Nero Caesar in Hebrew letters."},{"q":"When should a believer refuse a vaccine?","answer":"Only if receiving it required agreeing to worship a ruler, which is not happening anywhere."},{"q":"Are the 144,000 a literal number?","answer":"No, they symbolise the redeemed of both Testaments in large numbers (12 x 12 x 1000)."}],"criticisms":[{"of":"Well-meaning believers who equate the Corona vaccine with the mark","quote":"Corona has something to do with 666, the mark of the Antichrist!","critique":"Their interpretation ignores Revelation's setting and symbolism and violates sound interpretation principles, keeping people from vaccination."}],"illustrations":[{"title":"Which Shah Rukh Khan?","story":"When someone says 'Shah Rukh Khan' we ask whether they mean the Bollywood star and IPL team owner or the big-hitting IPL player from Tamil Nadu.","point":"Context-seeking is natural; Scripture must be read in context or its meaning is assassinated."},{"title":"'The Wall' and 'Muscles from Brussels'","story":"A cricket fan knows 'The Wall' means Rahul Dravid; an action-film fan knows 'Muscles from Brussels' means Jean-Claude Van Damme.","point":"Original readers instantly knew 'the beast' meant the emperor."},{"title":"Domitian as Zeus on an Ephesian coin","story":"In AD 89/90 Ephesus issued a coin conforming Domitian to Zeus, and he dedicated an eight-metre imperial statue (from a cultural backgrounds study Bible).","point":"The buy-sell ban reflected the emperor cult's control of markets."},{"title":"The vaccination queue","story":"If a nurse said you must agree to worship the Prime Minister or President to be vaccinated, you could refuse; but no one is doing that.","point":"Take the vaccine; the mark is about worship, not medicine."},{"title":"The Corinthian context","story":"Paul wrote 1 Corinthians partly to deal with a believer sleeping with his father's wife (1 Cor 5).","point":"Every letter, including Revelation, has a concrete setting."}],"keyVerses":[{"ref":"Rev 13:16-17","text":"no one could buy or sell unless he had the mark","use":"Explained as the emperor cult's market control."},{"ref":"Rev 1:4","text":"John to the seven churches that are in Asia","use":"Establishes the original setting."},{"ref":"Rev 2:10","text":"Be faithful until death","use":"Revelation's call to endurance."},{"ref":"Rev 7:2-8","text":"144,000 sealed","use":"Symbolic numbers mean the mark is symbolic."},{"ref":"Ezek 9:4","text":"put a mark on the foreheads of those who grieve","use":"Precedent for a symbolic forehead mark."},{"ref":"Heb 10:34","text":"you joyfully accepted the plundering of your property","use":"Parallel situation of persecution."}],"flow":["Claim: Corona vaccine equals 666 mark","Setting: churches facing Roman imperial cult","Symbolism: 666 equals Nero Caesar","Shopping ban: markets tied to emperor worship","Sealing: 144,000 and forehead marks symbolic","Mark means compromising faith under pressure","Conclusion: take the vaccine"]},{"num":44,"section":"Miscellaneous","title":"Should We Equate Apocrypha to the Word of God as Roman Catholics Do?","summary":"The author argues the Apocrypha, added to the Roman Catholic Bible, is not the inspired Word of God; otherwise one could also accept the additions of hyper-grace, hyper-supernatural and hyper-love preachers. He lists fifteen apocryphal books, noting the Douay version omits the Prayer of Manasseh. Drawing on a Christian apologetics handbook, he gives five reasons: opposition from respected scholars like Athanasius and Jerome (who made the Vulgate without them), very late inclusion at the Council of Trent in 1546, inclusion as a reaction to Martin Luther's questions so as to support practices like prayer for the dead (2 Macc 12:45-46, Tobit 12:9), an in-text admission that no prophets were active (1 Macc 9:27), and the fact that New Testament allusions to apocryphal or pagan works (Heb 11:35, Jude 14, Acts 17:28) do not make them inspired. He concludes that the 66 books are God's Word and the final authority.","thesis":"The Apocrypha is uninspired and was never part of the original canon, so believers must keep their focus on the 66 books as the final authority.","outlines":[{"acronym":"The Apocryphal books","items":[{"letter":"1","label":"The Wisdom of Solomon","point":"Apocryphal book.","refs":[]},{"letter":"2","label":"Ecclesiasticus","point":"Apocryphal book.","refs":[]},{"letter":"3","label":"Tobit","point":"Apocryphal book.","refs":[]},{"letter":"4","label":"Judith","point":"Apocryphal book.","refs":[]},{"letter":"5","label":"1 Esdras","point":"Apocryphal book.","refs":[]},{"letter":"6","label":"1 Maccabees","point":"Apocryphal book.","refs":[]},{"letter":"7","label":"2 Maccabees","point":"Apocryphal book.","refs":[]},{"letter":"8","label":"Baruch","point":"Apocryphal book.","refs":[]},{"letter":"9","label":"Letter of Jeremiah","point":"Apocryphal book.","refs":[]},{"letter":"10","label":"2 Esdras","point":"Apocryphal book.","refs":[]},{"letter":"11","label":"Additions to Esther","point":"Apocryphal book.","refs":[]},{"letter":"12","label":"Prayer of Azariah","point":"Apocryphal book.","refs":[]},{"letter":"13","label":"Susanna","point":"Apocryphal book.","refs":[]},{"letter":"14","label":"Bel and the Dragon","point":"Apocryphal book.","refs":[]},{"letter":"15","label":"Prayer of Manasseh","point":"Apocryphal book; not included in the Douay version used by Roman Catholics.","refs":[]}]},{"acronym":"Reasons not to equate the Apocrypha with God's Word","items":[{"letter":"1","label":"Vehement opposition","point":"Athanasius and Jerome (described in the book as respected scholars) did not include the Apocrypha; Jerome made the Latin Vulgate without them.","refs":[]},{"letter":"2","label":"Very late inclusion","point":"The Council of Trent added them to the Roman Catholic Bible only in 1546: 'too late!'","refs":[]},{"letter":"3","label":"Reaction to Martin Luther's questions","point":"About 29 years after Luther challenged prayer for the dead and works-salvation, Rome canonised books that support them (2 Macc 12:45-46, Tobit 12:9), adding to God's Word against Scripture's warnings.","refs":["Rev 22:18-19","Prov 30:6","Deut 4:2","Deut 12:32"]},{"letter":"4","label":"In-text 'not inspired' declaration","point":"1 Maccabees 9:27 says no prophets were active in that period, so these books cannot claim prophetic inspiration.","refs":[]},{"letter":"5","label":"Pagan literature quotation","point":"Heb 11:35 alludes to Maccabean events and Jude 14 quotes 1 Enoch, but Paul quoted pagan poets too (Acts 17:28); citation does not equal inspiration.","refs":["Heb 11:35","Jude 14","Acts 17:28"]}]}],"claims":[{"claim":"If Apocrypha is God's Word, any human addition could be","detail":"If man-added, uninspired books inserted into the Roman Catholic Bible are God's Word, then we could also believe the unbiblical additions of hyper-grace, hyper-supernatural and hyper-love preachers, who add to the Bible and delete inconvenient truths.","refs":[],"target":"Expanded canon; additions to Scripture"},{"claim":"Respected ancient scholars excluded the Apocrypha","detail":"Citing a Christian apologetics handbook, the author says Athanasius and Jerome, described as respected scholars, never included the apocryphal books, and Jerome made the Latin Vulgate without them.","refs":[],"target":"Apocrypha's canonical status"},{"claim":"The Council of Trent added them too late, in 1546","detail":"The occasion was the Council of Trent, the year 1546, the deed adding the apocryphal books to the Roman Catholic Bible; the author comments, 'That's too late!'","refs":[],"target":"Late canonisation"},{"claim":"Apocrypha canonised to support prayer for the dead","detail":"Luther challenged practices like prayer for the dead and works-salvation; about 29 years later the Apocrypha, which supports them (2 Macc 12:45-46, Tobit 12:9), was included as a reaction. Adding to God's Word breaks the commands of Rev 22:18-19, Prov 30:6, Deut 4:2 and 12:32, and brings severe punishment.","refs":["Rev 22:18-19","Prov 30:6","Deut 4:2","Deut 12:32"],"target":"Extra-biblical practices supported by Apocrypha"},{"claim":"1 Maccabees admits no prophets were active","detail":"Verses like 1 Maccabees 9:27 state that no prophets operated in the intertestamental period when these books were written. Without prophets there is no question of divine inspiration, so the Apocrypha declares itself uninspired.","refs":[],"target":"Inspiration of the Apocrypha"},{"claim":"New Testament allusions do not make a book inspired","detail":"Some argue that Heb 11:35 alludes to the Maccabean martyrs (2 Macc 6-7) and Jude 14 quotes 1 Enoch. The author replies that Paul quoted pagan poets in Acts 17:28, and no one says pagan poets were inspired. Citation is not canonisation.","refs":["Heb 11:35","Jude 14","Acts 17:28"],"target":"Inspiration by New Testament citation"},{"claim":"Keep focus on the 66 books as final authority","detail":"For these and many reasons the Apocrypha was never part of the original Bible. Stepping outside the 66 books is stepping out of God's Word, which is the final court of appeal for belief and behaviour (2 Tim 3:16-17).","refs":["2 Tim 3:16-17","Rom 4:3"],"target":"Expanded canon"}],"questions":[{"q":"Should we equate the Apocrypha to the Word of God as Roman Catholics do?","answer":"No: it was opposed by respected scholars, added late at Trent as a reaction to Luther, admits no prophets were active, and New Testament allusions do not make it inspired."}],"criticisms":[{"of":"The Roman Catholic canon defined at the Council of Trent","quote":"","critique":"It added uninspired, man-made books in 1546 to support extra-biblical practices like prayer for the dead, violating commands not to add to God's Word."},{"of":"Hyper-grace, hyper-supernatural and hyper-love preachers","quote":"","critique":"Like the Apocrypha's defenders, they add to the Bible and delete inconvenient truths."}],"illustrations":[{"title":"The Council of Trent, 1546","story":"Some 29 years after Martin Luther's challenges, the Council of Trent included the Apocrypha in the Roman Catholic canon.","point":"The inclusion was late and reactionary."},{"title":"Paul quoting pagan poets","story":"In Athens Paul quoted secular poets (Acts 17:28).","point":"Quoting a text does not make it inspired."}],"keyVerses":[{"ref":"Rev 22:18-19","text":"If anyone adds to them, God will add to him the plagues","use":"Warning against adding to Scripture."},{"ref":"Deut 4:2","text":"You shall not add to the word","use":"Old Testament warning against additions."},{"ref":"Prov 30:6","text":"Do not add to his words","use":"Same warning."},{"ref":"2 Tim 3:16-17","text":"All Scripture is God-breathed","use":"The 66 books are the final authority."}],"flow":["If Apocrypha is God's Word, additions become acceptable","List of fifteen apocryphal books","Ancient scholars excluded them","Trent added them late, reacting to Luther","Apocrypha admits no prophets; citation is not inspiration","Stay with the 66 books as final authority"]},{"num":45,"section":"Antidote","title":"The Biblical Antidote Against Any False Teaching","summary":"Opening the final section, the author recalls Paul's three years in Ephesus and his warning that 'savage wolves will come', not 'may come', and Jesus' prediction of many false prophets before his return. The one antidote is the Word of God: Paul committed the Ephesian elders 'to God and the word of his grace' (Acts 20:32). He illustrates this with the prison confession of a fallen American televangelist who, after studying all of Jesus' words, admitted 'I was wrong' about the prosperity gospel. He concludes, using a newspaper's advice on spotting counterfeit currency, that the surest way to detect false teaching is to know the genuine note: the Bible, read fully and reflectively.","thesis":"The only antidote against false teaching is deep, thorough study of the Word of God.","outline":null,"claims":[{"claim":"False teachers will certainly come until Jesus returns","detail":"Paul said 'savage wolves will come' among the Ephesians after his departure (Acts 20:29), not 'may come'. Jesus called false prophets wolves in sheep's clothing (Matt 7:15) and predicted many before his return (Matt 24:24). The author sees the damage of hyper-grace, hyper-supernatural and hyper-love teachers in today's church.","refs":["Acts 20:29","Matt 7:15","Matt 24:24","Acts 20:31"],"target":"Complacency about false teaching"},{"claim":"The only antidote is the Word of His grace","detail":"Paul commended the Ephesian elders 'to God and the Word of His Grace, which is able to build you up and give you the inheritance among all those who are sanctified' (Acts 20:32). There is only one antidote to false teaching: the Word of God.","refs":["Acts 20:32"],"target":"Neglect of Scripture"},{"claim":"A fallen televangelist's prison Bible study exposed his error","detail":"The founder of a large American ministry was convicted of fraud in 1989 and spent five years in prison. There he studied all Jesus' words and concluded Jesus had nothing good to say about money; he confessed in his book that he had preached a false prosperity gospel, even telling people not to pray 'your will be done' for health or wealth. The author salutes his rare honesty.","refs":["James 4:15"],"target":"Prosperity gospel"},{"claim":"Those who skip deep study slip into false teaching","detail":"The televangelist's confession shows that deep Scripture study and escape from false teaching go together; those who do not take time to study the Scriptures are the ones who slip into error.","refs":[],"target":"Biblical shallowness"},{"claim":"Know the genuine note to spot the fake","detail":"A financial newspaper said the easiest way to detect a fake currency note is to compare it with a genuine one. Likewise, the surest way to detect false teaching is to know the Bible well, reading all of it with reflection and understanding.","refs":[],"target":"Inability to discern"}],"questions":[{"q":"What is the antidote against the damaging influence of false teachers?","answer":"There is only one: the Word of God, the 'word of his grace' (Acts 20:32)."},{"q":"What is the connection between the Word of God and false teaching?","answer":"Deep study of Scripture and escape from false teaching go together, as a fallen televangelist's prison confession shows."}],"criticisms":[{"of":"The prosperity gospel (as confessed by a fallen American televangelist)","quote":"Don't pray, 'God, your will be done', when you are praying for health or wealth.","critique":"It is an imposter gospel that teaches the opposite of Jesus on money; the author praises the preacher's honest repudiation of it after prison Bible study."},{"of":"Hyper-grace, hyper-supernatural and hyper-love teachers","quote":"","critique":"They are the savage wolves damaging today's church."}],"illustrations":[{"title":"A fallen televangelist's 'I Was Wrong'","story":"The founder of a large American TV ministry, convicted of fraud in 1989, studied all of Jesus' words in prison and confessed in his book, 'I was wrong', renouncing the prosperity message.","point":"Deep Scripture study rescues from false teaching; neglect of it leads into error."},{"title":"Spotting fake currency","story":"The Economic Times advised that the easiest way to check a fake note is to compare it with a genuine one.","point":"Knowing the Bible thoroughly is the surest way to detect false teaching."},{"title":"Paul's three years in Ephesus","story":"Paul's longest settled ministry was in Ephesus (Acts 20:31), where he warned the elders that wolves would come.","point":"Even the most fruitful church needs the Word as its defence."}],"keyVerses":[{"ref":"Acts 20:29","text":"savage wolves will come in among you, not sparing the flock","use":"False teachers certainly will come."},{"ref":"Acts 20:32","text":"I commend you to God and to the word of his grace","use":"The Word is the only antidote."},{"ref":"Matt 24:24","text":"false christs and false prophets will arise","use":"Many false teachers before Christ's return."},{"ref":"James 4:15","text":"If the Lord wills, we shall live and do this or that","use":"Quoted in the televangelist's confession against presumption."}],"flow":["Paul: savage wolves will come","Jesus predicted many false prophets","Antidote: the Word of His grace","Fallen televangelist's prison confession","Deep study rescues from false teaching","Know the genuine note to spot fakes"]},{"num":46,"section":"Antidote","title":"Ready to Shun and Shake Off Biblical Illiteracy So That False Teaching Will Be Held at Bay?","summary":"The author notes that Bible translation by Wycliffe and Tyndale drove literacy in England and that missionaries in India, for example among the Khasis, taught reading so people could read the Bible. Yet today's Christians are becoming biblically illiterate ('Sodom and Gomorrah? Are they sisters?'), giving false teachers a field day. Using the acronym T-H-E-O-L-O-G-Y, he presents Titus' Bible-strong elders, the non-head-nodding Bereans, Ephesian elders committed to the Word of grace, Nineveh's 120,000 morally confused people, Hosea's lack of knowledge, India's online millions, the ongoing circle of teachers in 2 Timothy 2:2, and Amos' predicted famine of the Word. He urges lay people to study systematic theology, sharing how he began studying theology as an engineering student and leading hostel Bible studies.","thesis":"Christians must shake off biblical illiteracy through systematic study of the Word so that false teaching is kept at bay.","outline":{"acronym":"T-H-E-O-L-O-G-Y","items":[{"letter":"T","label":"Titus Being Called To Pick Bible-Strong Elders","point":"Elders must hold firmly to the trustworthy Word so they can teach sound doctrine and rebuke those who contradict it.","refs":["Titus 1:4","Titus 1:9"]},{"letter":"H","label":"Head-nodders, the Bereans Weren't","point":"The Bereans received the Word eagerly but examined the Scriptures daily to check whether Paul and Silas' teaching was true, and were called noble.","refs":["Acts 17:11"]},{"letter":"E","label":"Ephesian Elders Called To Commit Themselves To The Word of Grace","point":"Paul's antidote for the coming wolf-attack was commitment to the Word of his grace.","refs":["Acts 20:29","Acts 20:32"]},{"letter":"O","label":"One Hundred Twenty Thousand People That God Talked About","point":"Nineveh's 120,000 did not know right from left because they lacked God's written laws; India, about 10,000 times larger, gives us a bigger missionary motivation to grasp and share the Word.","refs":["Jonah 4:11"]},{"letter":"L","label":"Lack of Knowledge Which Hosea Writes About","point":"God's people are destroyed for lack of knowledge; rejecting knowledge brings God's rejection.","refs":["Hos 4:6"]},{"letter":"O","label":"Online Millions and the Opportunity for Evangelism","point":"India's 550 million internet users (2020) call Bible teachers to use modern media, and online Bible training programmes equip those called to preach.","refs":[]},{"letter":"G","label":"Going On Circle","point":"Paul envisions an ever-widening circle of faithful teachers who teach others.","refs":["2 Tim 2:2"]},{"letter":"Y","label":"Yahweh's Prediction","point":"Amos predicted a famine of hearing God's Word; in the short time left we must become Bible literate and teach our generation.","refs":["Amos 8:12"]}]},"claims":[{"claim":"Bible translation historically produced literacy","detail":"Wycliffe's and Tyndale's English translations led to even shopkeepers becoming literate; 'literacy in England is directly attributable to the Bible.' In India, evangelists taught reading so converts could read the Bible; among the Khasis missionaries taught 'You cannot be a Christian without reading the Bible!'","refs":[],"target":"Neglect of literacy and Scripture"},{"claim":"Today's Christians are becoming biblically illiterate","detail":"Christians who brought literacy so people could read the Bible are fast becoming Bible illiterates, asking things like 'Sodom and Gomorrah? Are they sisters?' False teachers have a field day because most Christians are biblically illiterate.","refs":[],"target":"Biblical illiteracy"},{"claim":"Elders must be Bible-strong to refute error (Titus)","detail":"Paul told Titus, his 'son', to appoint elders who hold firm to the trustworthy Word so they can instruct in sound doctrine and rebuke those who contradict it.","refs":["Titus 1:4","Titus 1:9"],"target":"Weak church leadership"},{"claim":"Be like the Bereans, not head-nodders","detail":"The Bereans received the Word eagerly yet examined the Scriptures daily to see if Paul and Silas' teaching was true; they were more noble than those in Thessalonica.","refs":["Acts 17:11"],"target":"Uncritical listening"},{"claim":"Commit to the Word of His grace against wolves","detail":"Paul's longest stay was in Ephesus; in his farewell he warned of fierce wolves and gave the antidote: commitment to 'the Word of His Grace' (Acts 20:29,32).","refs":["Acts 20:29","Acts 20:32"],"target":"Vulnerability to wolves"},{"claim":"Nineveh's 120,000 call us to share the Word","detail":"God's last question to Jonah concerns 120,000 people who did not know right from wrong because they lacked God's written laws. India's population is about 10,000 times Nineveh's, giving us a bigger motivation to grasp and share the Word.","refs":["Jonah 4:11"],"target":"Missionary apathy"},{"claim":"God's people are destroyed for lack of knowledge","detail":"Hosea 4:6 records one of God's most painful cries: 'My people are destroyed from lack of knowledge'; rejecting knowledge brings rejection.","refs":["Hos 4:6"],"target":"Neglect of knowledge"},{"claim":"Online millions present an evangelism opportunity","detail":"India had 550 million internet users in 2020. This beckons Bible teachers to teach via media like Zoom, and fully online Bible training programmes from reputable colleges equip those called to preach.","refs":[],"target":"Missing digital opportunity"},{"claim":"Multiply teachers in an ever-widening circle","detail":"Paul tells Timothy to entrust what he heard to faithful people who will teach others also (2 Tim 2:2), an ever-increasing circle of Bible teachers.","refs":["2 Tim 2:2"],"target":"Lack of teacher multiplication"},{"claim":"Amos predicted a famine of hearing God's Word","detail":"Amos 8:12 predicts a famine of hearing God's Word, so in the short time available we must become Bible literate and teach our generation.","refs":["Amos 8:12"],"target":"Neglect of Scripture"},{"claim":"Lay people can study systematic theology themselves","detail":"Lay people can equip themselves by self-study, using good systematic theology books by authors such as Wayne Grudem and Millard J. Erickson. The author began studying a renewal theology textbook as an engineering student and led Bible studies on the doctrine of God in his hostel, which became training for a nationwide teaching ministry. God has grand plans for those who study his Word.","refs":[],"target":"Lay disengagement from theology"}],"questions":[{"q":"Are you ready to shun and shake off biblical illiteracy so that false teaching will be held at bay?","answer":"The author urges every believer to study the Word systematically, using the T-H-E-O-L-O-G-Y outline as motivation."},{"q":"Sodom and Gomorrah? Are they sisters?","answer":"This illustrates how biblically illiterate today's generation has become, giving false teachers a field day."},{"q":"Shouldn't I show concern for the great city of Nineveh?","answer":"God's question to Jonah calls us to bring God's Word to the morally confused multitudes of India."}],"criticisms":[{"of":"Biblically illiterate modern Christians","quote":"Sodom and Gomorrah? Are they sisters?","critique":"Their ignorance lets false teachers have a field day."}],"illustrations":[{"title":"Wycliffe, Tyndale and English literacy","story":"English Bible translations paved the way for even shopkeepers to become literate; 'Literacy in England is directly attributable to the Bible' (Washington Post, 2014).","point":"Christians once drove literacy for the sake of the Bible."},{"title":"The Khasis of Northeast India","story":"Missionaries taught 'You cannot be a Christian without reading the Bible!', so conversion and literacy went together.","point":"Bible reading was essential to Christian identity."},{"title":"'Are they sisters?'","story":"A biblically illiterate generation asks whether Sodom and Gomorrah were sisters.","point":"Today's Christians are becoming biblically illiterate."},{"title":"The author's engineering-hostel Bible study","story":"As a B.Tech student in Allahabad he studied a systematic theology volume and led Bible studies on the doctrine of God in the men's hostel.","point":"Lay self-study can be the training ground for God's plans."},{"title":"India is 10,000 times Nineveh","story":"India's population is about 10,000 times Nineveh's 120,000.","point":"We have greater motivation than Jonah to share God's Word."}],"keyVerses":[{"ref":"Titus 1:9","text":"hold firm to the trustworthy word as taught","use":"Elders must be Bible-strong."},{"ref":"Acts 17:11","text":"examining the Scriptures daily","use":"Bereans as model of discernment."},{"ref":"Jonah 4:11","text":"more than one hundred twenty thousand people who do not know right from wrong","use":"Missionary call."},{"ref":"Hos 4:6","text":"My people are destroyed from lack of knowledge","use":"Danger of biblical ignorance."},{"ref":"2 Tim 2:2","text":"entrust to faithful men who will be able to teach others","use":"Multiplying teachers."},{"ref":"Amos 8:12","text":"famine of hearing the words of the LORD","use":"Urgency to become Bible literate."}],"flow":["Bible translation once produced literacy","Today's Christians are biblically illiterate","False teachers exploit illiteracy","T-H-E-O-L-O-G-Y outline for Bible literacy","Mission to India's millions, online and offline","Lay people should study systematic theology"]},{"num":47,"section":"Antidote","title":"Wishing You Smashing Year(s) of Non-Stop Deep Scripture Study: A Habit That Will Help You Steer Clear of Hell-Populating False Teaching!","summary":"In the closing chapter the author urges readers to make reading the whole Bible every year a lifelong habit, citing Joshua 1:8 for true prosperity and Psalm 119 for wisdom and light. He answers three questions: whether the Bible teaches daily reading (yes: kings reading the Law daily, believers as a royal priesthood, the psalmist praising seven times a day, the Bereans, Job valuing God's words above daily bread), whether we should read all of it (yes: 'all Scripture', Paul quoting from all sections, Joshua reading every word, not one iota passing away, John's warning about taking away words), and which version to use (ESV, VOICE and NLT are his picks, plus NASB). He recommends a 'six-layered sandwich' plan of reading a chapter from each section daily, and closes with Psalm 119's eleven declarations of love for God's Word, saying that loving the Word leads to abhorring false teaching.","thesis":"Daily, whole-Bible reading driven by love for God's Word is the lifelong habit that keeps believers clear of false teaching.","outlines":[{"acronym":"Three questions about Bible reading","items":[{"letter":"1","label":"Does the Bible teach us to read it daily?","point":"Yes: 'Leaders to be readers' (kings read daily, Deut 17:18-20; believers are royal priests, 1 Pet 2:9); 'Seven times a day' (Ps 119:164); 'Tooth-decay vs truth-decay' (Bereans, Acts 17:11); 'No Bible, no breakfast' (Job 23:12, 31:1); 'Not a job but his joy'.","refs":["Deut 17:18-20","1 Pet 2:9","Ps 119:164","Acts 17:11","Job 23:12","Job 31:1"]},{"letter":"2","label":"Does the Bible teach us to read all of it?","point":"Yes: 'Read all of it' (2 Tim 3:16; Paul quotes Law, Poetry and Prophets in Rom 10:18-20); 'Every word, read' (Josh 8:33-35); 'Not a single i' (Matt 5:18); 'John's warning' (Rev 22:19).","refs":["2 Tim 3:16","Rom 10:18-20","Josh 8:33-35","Matt 5:18","Rev 22:19"]},{"letter":"3","label":"Which version should I read?","point":"ESV for word-for-word, VOICE (team-translated) for contemporary language, NLT for balance; NASB (especially 1977) is very accurate; use online Bible sites and apps; a Chennai Christian bookstore offers good value.","refs":[]}]},{"acronym":"Six-layered sandwich reading plan (sections as listed)","items":[{"letter":"1","label":"Old Testament History (Genesis to Esther)","point":"Read one chapter a day.","refs":[]},{"letter":"2","label":"Old Testament Poetry (Job to Song of Songs)","point":"Read one chapter a day.","refs":[]},{"letter":"3","label":"Old Testament Prophets (Isaiah to Malachi)","point":"Read one chapter a day.","refs":[]},{"letter":"4","label":"New Testament History (Matthew to Acts)","point":"Read one chapter a day.","refs":[]},{"letter":"5","label":"New Testament Letters (Romans to Revelation)","point":"Read one chapter a day; the plan yields the whole Bible once and the New Testament twice a year. Three chapters morning and three at night; highlight one verse per chapter in a new colour; catch up at weekends. (The book calls it six-layered but names these five sections.)","refs":[]}]},{"acronym":"Psalm 119's eleven declarations of love for the Word","items":[{"letter":"1","label":"Ps 119:47","point":"I find my delight in your commands, which I love.","refs":["Ps 119:47"]},{"letter":"2","label":"Ps 119:48","point":"I lift up my hands toward your commands, which I love.","refs":["Ps 119:48"]},{"letter":"3","label":"Ps 119:68 (as cited; the wording is Ps 119:167)","point":"My soul keeps your testimonies; I love them exceedingly.","refs":["Ps 119:167"]},{"letter":"4","label":"Ps 119:97","point":"Oh how I love your law; it is my meditation all day.","refs":["Ps 119:97"]},{"letter":"5","label":"Ps 119:113","point":"I hate the double-minded, but I love your law.","refs":["Ps 119:113"]},{"letter":"6","label":"Ps 119:119","point":"You discard the wicked like dross; therefore I love your testimonies.","refs":["Ps 119:119"]},{"letter":"7","label":"Ps 119:127","point":"I love your commandments above gold, above fine gold (the author adds: above my phone, even my iPhone).","refs":["Ps 119:127"]},{"letter":"8","label":"Ps 119:140","point":"Your promise is well tried, and your servant loves it.","refs":["Ps 119:140"]},{"letter":"9","label":"Ps 119:159","point":"Consider how I love your precepts; give me life according to your steadfast love.","refs":["Ps 119:159"]},{"letter":"10","label":"Ps 119:163","point":"I hate and abhor falsehood, but I love your law (the author: my love for the Word leads me to abhor Hyper-Grace, Hyper-Supernaturalism, Hyper-Love).","refs":["Ps 119:163"]},{"letter":"11","label":"Ps 119:165","point":"Great peace have those who love your law; nothing can make them stumble (a verse he shares with fellow passengers on flights).","refs":["Ps 119:165"]}]}],"claims":[{"claim":"Meditating on the Word brings true prosperity and success","detail":"Everyone hopes for a prosperous and successful new year; Joshua 1:8 says meditating on the Book of the Law day and night makes us prosperous and successful in God's eyes. Psalm 119 says the Word makes us wiser than enemies and teachers and lights our path.","refs":["Josh 1:8","Ps 119:98","Ps 119:99","Ps 119:105"],"target":"Neglect of daily meditation"},{"claim":"Leaders must be daily readers, and all believers are kings","detail":"Israel's kings were to keep a copy of the Law and read it daily (Deut 17:18-20). Believers are 'a royal priesthood' (1 Pet 2:9), little kings in God's eyes, so we must read his Word daily.","refs":["Deut 17:18-20","1 Pet 2:9"],"target":"Irregular Bible reading"},{"claim":"The psalmist's praise seven times a day implies daily reading","detail":"The psalmist praised God for his righteous laws seven times a day (Ps 119:164), which implies he read a section of his Bible at least once a day.","refs":["Ps 119:164"],"target":"Irregular Bible reading"},{"claim":"Avoid truth-decay as you avoid tooth-decay","detail":"The Bereans examined Scripture daily and were called noble (Acts 17:11). The further we are from the Bible, the further from truth; skipping brushing causes tooth-decay, but skipping Bible study causes truth-decay.","refs":["Acts 17:11"],"target":"Neglect of daily study"},{"claim":"No Bible, no breakfast: Job treasured God's words","detail":"Job treasured God's words more than his daily bread (Job 23:12), so we should never miss daily Bible meditation even if we miss a meal. This diet made Job holy, so he made a covenant with his eyes (Job 31:1). For Job meditation was not a job but a joy, not a chore but an encore.","refs":["Job 23:12","Job 31:1"],"target":"Neglect of Scripture"},{"claim":"All Scripture is God-breathed, so read all of it","detail":"2 Tim 3:16 says 'all' Scripture is God-breathed, so we must read all 66 books. Paul must have read his whole Old Testament, since in Romans 10:18-20 he quotes from the Law, Poetry and Prophets within three verses.","refs":["2 Tim 3:16","Rom 10:18-20"],"target":"Selective Bible reading"},{"claim":"Joshua read every word, blessings and curses","detail":"Joshua read both blessings and curses, and there was not a word of all Moses commanded that he did not read before all Israel, including women, children and sojourners (Josh 8:33-35). We too must read every word.","refs":["Josh 8:33-35"],"target":"Skipping difficult passages"},{"claim":"Not one iota will pass away, so miss nothing","detail":"Jesus said not a dot or iota will pass from the Law until all is accomplished (Matt 5:18), quoted in many versions. This motivates the author to read without missing even a single 'i'.","refs":["Matt 5:18"],"target":"Careless reading"},{"claim":"Rev 22:19 warns against habitually skipping parts of Scripture","detail":"John warned that whoever takes away words from this prophecy loses his share in the tree of life. A famous evangelist cut passages from Bibles to paste in sermon files, which the author does not consider wrong. Rather, John means we must not stubbornly leave out sections of Scripture, even hard books like Revelation, over our lifetime.","refs":["Rev 22:19"],"target":"Ignoring difficult books"},{"claim":"Use the six-layered sandwich plan to read the whole Bible yearly","detail":"The author's practice is to read one chapter a day from each section (OT history, poetry, prophets, NT history, letters), giving the whole Bible once and the New Testament twice a year. Read three chapters morning and three at night, highlight one verse per chapter in a fresh colour, and catch up at weekends. Variety keeps interest alive.","refs":[],"target":"Unstructured reading"},{"claim":"Choose a reliable version: ESV, VOICE, NLT, NASB","detail":"For literal accuracy use the ESV; for contemporary language the VOICE (team-translated, so safer than a one-person paraphrase); for balance the NLT. The NASB, especially 1977, is highly accurate. Use online Bible sites and apps, and a Chennai Christian bookstore for good value. Reading a new version makes reading fresh.","refs":[],"target":"Single-translator paraphrases"},{"claim":"Love for the Word produces hatred of false teaching","detail":"The ultimate purpose of the book is to invite readers to fall in love with God's Word; loving it means automatically hating false teaching. Psalm 119 declares love for God's Word eleven times; 119:163, 'I hate and abhor falsehood but I love your law', leads the author to abhor Hyper-Grace, Hyper-Supernaturalism and Hyper-Love.","refs":["Ps 119:47","Ps 119:97","Ps 119:163","Ps 119:165"],"target":"Hyper-Grace, Hyper-Supernaturalism, Hyper-Love"}],"questions":[{"q":"Does the Bible teach us that we should read it daily?","answer":"Yes: Deut 17:18-20, Ps 119:164, Acts 17:11 and Job 23:12 together teach daily reading."},{"q":"Does the Bible teach that we should read all 66 books?","answer":"Yes: all Scripture is God-breathed; Paul, Joshua, Jesus and John motivate us to rea
