s for believers."},{"of":"Hyper-Grace teachers (general) on Hebrews","quote":"","critique":"They use Heb 10:10 and 7:25 to teach believers are forgiven forever, ignoring Heb 10:14, 10:22, 10:26-27 and 12:14."},{"of":"some Hyper-Grace believers","quote":"I will commit this sexual sin and get back to God once I get my fill of pleasure... after all, God is gracious.","critique":"They use grace like a credit card for sensuality and are 'already condemned' (Jude 4)."}],"illustrations":[{"title":"A minister's suicide","story":"A man of God took his life after years of ministry, and some believers said he would definitely go to heaven since future sins are forgiven.","point":"The author treats this as an example of the dangerous implications of auto-forgiveness."},{"title":"The planned one-night stand and porn","story":"If future sins are auto-forgiven, a believing unmarried couple could plan a one-night stand in a car after a half-night prayer, or watch porn without a battle of conscience.","point":"Auto-forgiveness logically licenses planned sin."},{"title":"Holy, Holy, Holy vs holey, holey, holey","story":"Isaiah realised God is 'Holy, Holy, Holy' while he was 'holey, holey, holey', full of sins and holes.","point":"Confession of sin precedes atonement."},{"title":"Nathan's 'mutton biryani' parable","story":"Nathan confronted David with the story of a rich man who took a poor man's lamb to cook for a guest, which the author calls the mutton biryani preparation parable.","point":"David confessed and was then forgiven."},{"title":"Aaron's sons in the Holy of Holies","story":"Nadab and Abihu entered God's presence improperly and fell dead.","point":"Believers who approach God with unconfessed deliberate sin face danger."},{"title":"Jim Bakker's 'I Was Wrong'","story":"The televangelist lost his empire, freedom and marriage and later wrote an autobiography titled I Was Wrong confessing his errors.","point":"An unforgettable illustration that believers must confess sin to God."},{"title":"Steve Smith and the sandpaper scandal","story":"In the 2018 Cape Town Test, Cameron Bancroft tampered with the ball with sandpaper; captain Steve Smith admitted it, was banned, and tearfully took full responsibility.","point":"If even possible unbelievers confess their blunders, believers must confess sin to God."}],"keyVerses":[{"ref":"Matt 6:14-15","text":"if you do not forgive others their trespasses, neither will your Father forgive your trespasses","use":"Future forgiveness is conditional."},{"ref":"1 John 1:9","text":"If we confess our sins, he is faithful and just to forgive us","use":"Believers must keep confessing to be cleansed."},{"ref":"Isa 6:7","text":"your guilt is taken away, and your sin atoned for","use":"Atonement came after confession."},{"ref":"Ps 32:5","text":"I will confess my transgressions to the Lord, and you forgave","use":"David forgiven after confession."},{"ref":"Heb 10:14","text":"He has perfected for all time those being sanctified","use":"Progressive sanctification qualifies 10:10."},{"ref":"Heb 10:26-27","text":"if we go on sinning deliberately... a fearful expectation of judgment","use":"Deliberate unrepented sin leads to hell."},{"ref":"Heb 7:25","text":"He is always able to save those who come to God through Him","use":"Only those who keep coming are saved."},{"ref":"1 John 5:16-17","text":"There is sin that leads to death","use":"Persistent unrepented sin leads to hell."},{"ref":"Prov 28:13","text":"he who confesses and forsakes them will obtain mercy","use":"Possession of forgiveness requires confession."}],"flow":["Auto-forgiveness would license planned sin","S-I-N-N-E-D: forgiveness follows confession throughout Scripture","Heb 10:10 is positional; 10:14 progressive","Heb 10:26-27 warns deliberate sinners of fire","Heb 7:25 saves those who keep coming","Planned sin may lead to no return","Provision is made; possession requires confession"],"outlines":null},{"num":4,"section":"Hyper-Grace","title":"Will God Forgive the Sin I Am Planning to Commit? For Example, the Porn-Surfing Session I Am Planning to Have?","summary":"The chapter responds to a Singapore megachurch pastor's statement that grace is cheapened if forgiveness after salvation depends on confession, since God's forgiveness is not in instalments. The author distinguishes positional sanctification (the white robe given, Rev 6:11) from practical sanctification (choosing to wear white, Rev 7:13; 1 John 3:6), illustrated by the wedding guest without a garment who is cast into outer darkness (Matt 22:11-13) and by Amos 3:2's privilege-with-responsibility. Contrasting Romans 2:5 and Revelation 2:5, he insists God will not forgive sin we refuse to repent of. He compares Judas, whom he regards as once saved, who never returned, with Peter, who wept and repented, and warns that persistent deliberate sin can bring us to a point of no return (Heb 10:26-27; 1 Cor 9:27). He then lists seven consequences of sexual sin from his earlier book, ending in hell (Rev 21:8), encourages holy fear (Exod 20:20), and cites Bill Clinton, Shane Warne, Tiger Woods and Tim Paine as cautionary examples.","thesis":"God will forgive a planned sin only if we truly repent, which is never guaranteed, so believers must refuse deliberate sin and pursue practical sanctification.","outline":{"acronym":"Seven Consequences of Sexual Sin","items":[{"letter":"1","label":"The LORD will leave you and you won't know it","point":"As happened to Samson on Delilah's lap.","refs":["Judg 16:20"]},{"letter":"2","label":"You can never be a leader who influences for good","point":"Joseph became a prince among his brothers while Reuben lost his firstborn position; David had to go silent when his son raped his daughter.","refs":["Gen 49:4","Gen 49:26","2 Sam 13:21-22"]},{"letter":"3","label":"Violence could become commonplace in your family","point":"David's sons Amnon, Absalom and Adonijah died violently.","refs":["2 Sam 13:23-38","2 Sam 18:9-18","1 Kgs 2:13-46"]},{"letter":"4","label":"You would give birth to spiritual enemies","point":"Lot's incest produced Moab and Ammon, Israel's bitter enemies.","refs":["Gen 19:30-36"]},{"letter":"5","label":"Advantages gained through sexual sin melt away","point":"David's child by Bathsheba died despite his pleas.","refs":["2 Sam 12:14"]},{"letter":"6","label":"God's name will be blasphemed","point":"Paul says God's name is blasphemed among the Gentiles because of hypocrisy.","refs":["Rom 2:22","Rom 2:24"]},{"letter":"7","label":"Persistence in sexual sin leads to hell","point":"The sexually immoral will be in the lake of fire; L-U-S-T leads to H-E-L-L.","refs":["Rev 21:8"]}]},"claims":[{"claim":"Forgiveness of future sins does not license planned porn sessions","detail":"A Singapore megachurch pastor said grace is cheapened if forgiveness after salvation depends on confession, since forgiveness is not given in instalments. The author argues this implies future sins are already forgiven and asks whether a believer can then plan a porn session without worry.","refs":[],"target":"Forgiveness not in instalments"},{"claim":"Positional sanctification must translate into practical sanctification","detail":"Revelation 6:11 shows believers 'given a white robe' (positional), but Revelation 7:13 shows people 'clothed in white' who chose to wear it (practical). Genuine repentance should produce daily victory over sin (1 John 3:6), with God helping and us actively cooperating through Scripture, fleeing temptation, prayer and accountability.","refs":["Rev 6:11","Rev 7:13","1 John 3:6"],"target":"Positional holiness without practical holiness"},{"claim":"The guest without a wedding garment ends in hell","detail":"Wanting positional privileges without practical responsibility is like the guest who refused the provided wedding garment (Matt 22:11-12). God has given us everything to live holy (Eph 1:3; Rom 8:13), so on the final day we will have no excuse; the holiness-refusing believer is bound and cast into outer darkness, i.e. hell (Matt 22:13).","refs":["Matt 22:11-13","Eph 1:3","Rom 8:13"],"target":"Privilege without responsibility"},{"claim":"Privilege brings responsibility and punishment (Amos 3:2)","detail":"Amos 3:2 says 'You only have I chosen... therefore I will punish you for all your sins', combining privilege and responsibility. God punished Israel, and also believers among Gentiles, for not responding responsibly to great privileges.","refs":["Amos 3:2"],"target":"Privilege without accountability"},{"claim":"God will not forgive sin we refuse to repent of (Rom 2:5 / Rev 2:5)","detail":"God will not forgive sin we refuse to acknowledge or repent of (Luke 13:1-5). Refusing to repent stores up wrath (Rom 2:5), and Revelation 2:5 warns of judgment on church believers who refuse to repent.","refs":["Luke 13:1-5","Rom 2:5","Rev 2:5"],"target":"Jesus has already forgiven the sin you plan"},{"claim":"Judas, though saved, never came back after wanton sin","detail":"Jesus will forgive planned sin only if you come in true repentance, which is not guaranteed. Judas was saved, his name written in heaven (Luke 10:20), but greed grew as he stole from the moneybag (John 12:6). He may have planned to return after the betrayal, like someone planning to confess after porn or gossip, but he ended his life and went to hell (John 17:12).","refs":["Luke 10:20","John 12:6","John 17:12"],"target":"Planned sin is safe because grace will forgive"},{"claim":"Peter wept and repented, and Jesus let him weep","detail":"Unlike Judas, Peter repented genuinely, wept bitterly, and took a U-turn (Matt 26:75). Jesus never told him not to weep because sin was already taken care of; it is better to weep over sin now than at Christ's return (Rev 1:7; Luke 23:28).","refs":["Matt 26:75","Rev 1:7","Luke 23:28","Luke 13:1-5"],"target":"No need for sorrow over sin"},{"claim":"Repeated deliberate sin can bring a point of no return","detail":"If we keep committing deliberate sin without repentance, like Judas we may reach a point where we never feel like returning, and then only fearful judgment and raging fire remain (Heb 10:26-27). Like Paul, we must buffet our bodies so as not to be disqualified (1 Cor 9:27).","refs":["Heb 10:26-27","1 Cor 9:27"],"target":"Deliberate sin is harmless"},{"claim":"Sexual sin carries seven lethal consequences, ending in hell","detail":"From his earlier book the author lists: God leaves you unaware (Samson); loss of leadership (Reuben vs Joseph; David silenced); family violence (David's sons); spiritual enemies (Moab and Ammon); lost advantages (David's child died); God's name blasphemed (Rom 2:24); and finally hell for persistent sexual sin (Rev 21:8): L-U-S-T leads to H-E-L-L.","refs":["Judg 16:20","Gen 49:4","Gen 49:26","2 Sam 13:21-22","2 Sam 13:23-38","2 Sam 18:9-18","1 Kgs 2:13-46","Gen 19:30-36","2 Sam 12:14","Rom 2:22-24","Rev 21:8"],"target":"Consequence-free sexual sin"},{"claim":"Holy fear of God helps beat sexual temptation","detail":"The consequences are meant to make us shudder, since holy fear is a biblical way to beat temptation. After the Ten Commandments, Moses said the fear of God would keep them from sinning (Exod 20:14,20); count the cost before yielding.","refs":["Exod 20:14","Exod 20:20"],"target":"Fearless approach to temptation"}],"questions":[{"q":"Will God forgive the sin I am planning to commit, for example a planned porn-surfing session?","answer":"He will, provided you come to him in true repentance, but there is no guarantee you will ever do that, as Judas shows."},{"q":"Can a believer plan future sins as they are 'already forgiven'?","answer":"No; the Bible says God will not forgive sin we refuse to acknowledge or repent of, and refusing to repent stores up wrath."},{"q":"Do these adverse outcomes of sexual sin make you shudder?","answer":"They are meant to; holy fear of God is a biblical way to beat sexual temptation (Exod 20:20)."},{"q":"Are you mighty pleased that you watch porn less than another believer?","answer":"This question appears in chapter 5; here the author urges readers not to settle for deliberate, callous sin but to win over it with God's help."}],"criticisms":[{"of":"a Singapore megachurch Hyper-Grace pastor (anonymised)","quote":"His grace is cheapened when you think that He has only forgiven you of your sins up to the time you got saved, and after that point, you have to depend on your confession of sins to be forgiven. God's forgiveness is not given in instalments.","critique":"This implies future sins are already forgiven and would allow a believer to plan sin such as a porn session without worry."},{"of":"those who say 'Jesus has already forgiven the sin you are planning to commit'","quote":"Jesus has already forgiven the sin you are planning to commit.","critique":"The author says not to be deceived by this; God will not forgive sin we refuse to repent of (Luke 13:1-5; Rom 2:5; Rev 2:5)."}],"illustrations":[{"title":"White robes given and worn","story":"Revelation shows believers 'given a white robe' (6:11) and others 'clothed in white' who chose to wear it (7:13).","point":"Positional sanctification must become practical sanctification."},{"title":"The guest without a wedding garment","story":"A wedding guest who refused the provided garment was bound and thrown into outer darkness.","point":"Believers who refuse daily holiness end in hell."},{"title":"Judas versus Peter","story":"Judas planned his betrayal and never returned, ending his life; Peter wept bitterly and turned back.","point":"Repentance after sin is not guaranteed; return like Peter."},{"title":"Samson on Delilah's lap","story":"Samson did not know the LORD had left him.","point":"Sexual sin can cost God's presence unnoticed."},{"title":"Bill Clinton and Mount Rushmore","story":"A 1998 newspaper said Clinton lost the chance to have his face on Mount Rushmore and a Nobel Prize due to his affair.","point":"Even secular stories show sexual sin's deadly cost."},{"title":"Shane Warne, Tiger Woods and Tim Paine","story":"Warne lost the Australian captaincy over phone-sex scandals, Woods lost sponsors, and Paine lost the Test captaincy over a sexting scandal.","point":"The list of those ruined by sexual sin is endless; your name need not be on it."},{"title":"L-U-S-T and H-E-L-L","story":"A four-letter sin leads to a four-letter place.","point":"Persistent sexual sin ends in hell."}],"keyVerses":[{"ref":"Rev 6:11","text":"given a white robe","use":"Positional sanctification."},{"ref":"Rev 7:13","text":"clothed in white","use":"Practical sanctification chosen by believers."},{"ref":"1 John 3:6","text":"No one who lives in Him makes a practice of sin","use":"Practical holiness."},{"ref":"Matt 22:12-13","text":"bind him hand and foot and cast him into the outer darkness","use":"Holiness-refusing believers go to hell."},{"ref":"Amos 3:2","text":"You only have I chosen... therefore I will punish you for all your sins","use":"Privilege brings responsibility."},{"ref":"Rom 2:5","text":"storing up wrath for yourself","use":"Refusing repentance leads to hell."},{"ref":"1 Cor 9:27","text":"I myself will not be disqualified for the prize","use":"Believers must war against sin to avoid disqualification."},{"ref":"Exod 20:20","text":"The fear of God will be with you to keep you from sinning","use":"Holy fear beats temptation."},{"ref":"Rev 21:8","text":"the sexually immoral - their place will be the fiery lake","use":"Persistent sexual sin leads to hell."}],"flow":["Hyper-Grace says forgiveness is not in instalments","Positional holiness must become practical holiness","Refusing the garment leads to outer darkness","Unrepented sin stores up wrath","Judas never returned; Peter repented","Sexual sin brings seven lethal consequences","Holy fear helps defeat temptation"],"outlines":null},{"num":5,"section":"Hyper-Grace","title":"'Taking Efforts for Holiness Is Wrong' — Are Hyper-Grace Preachers Right When They Say That?","summary":"The author quotes a New Zealand-based blogger ('every spiritual blessing comes through Christ... All is grace') and a Singapore megachurch pastor ('we need not more laws but a greater revelation of Jesus'; 'when God sees you, he sees Jesus') and summarises their message as 'holiness is effortless'. He distinguishes 'gifted holiness', received instantly at repentance like the dying thief, from 'guarded holiness', maintained by Spirit-enabled effort every moment (Heb 12:14; Heb 13:4-5; Eph 4:1-3). He argues believers must not only 'obtain' but 'maintain' holiness (1 Pet 2:11; Rom 7:23; Eph 6:12), citing J.C. Ryle and listing 30 New Testament commands calling for active personal exertion, and calls for an A (Abide) to Z (Zeal) commitment. From Revelation 22:12-14 he presents Jesus as the Alpha and Omega of our holiness, and from Matthew 22 says holiness-refusing believers end in hell. He closes with Rohit Sharma's anger at getting out on 140 against Pakistan in 2019 as a model of refusing 'salvation-satisfaction-stagnation'.","thesis":"Holiness is both gifted at conversion and guarded by daily Spirit-enabled effort, so Hyper-Grace's claim that effort for holiness is wrong is unbiblical.","outline":null,"claims":[{"claim":"Hyper-Grace says holiness is effortless: rest, don't run","detail":"From quotes by a New Zealand blogger and a Singapore pastor, the author summarises Hyper-Grace as: go to bed when it comes to sanctification, no battle; rest, no need to run; relax, no need to flex. Holiness, for them, is effortless.","refs":[],"target":"Effortless holiness"},{"claim":"Gifted holiness is received instantly, like the dying thief","detail":"Gifted holiness is given free when we repent and trust Jesus. The dying thief received it instantly after expressing repentance and faith (Luke 23:39-43), as Fanny Crosby's hymn says: the vilest offender who truly believes, that moment receives a pardon.","refs":["Luke 23:39-43"],"target":"None (common ground)"},{"claim":"Guarded holiness requires Spirit-enabled effort every moment","detail":"We guard our given holiness by Spirit-enabled effort every second. Hebrews talks of gifted holiness (9:14; 10:10; 13:12) and guarded holiness: 'make every effort... to be holy; without holiness no one will see the Lord' (12:14), and keep marriage undefiled and be free from love of money (13:4-5).","refs":["Heb 12:14","Heb 9:14","Heb 10:10","Heb 13:12","Heb 13:4-5"],"target":"No effort needed for holiness"},{"claim":"Ephesians teaches both gifted and lived-out holiness","detail":"The New Zealand blogger used Eph 1:3 to say all blessing is in Christ, none in response to obedience. The author says Eph 1:3 is gifted holiness, but Ephesians also calls for guarded holiness: 'live a life worthy... make every effort to keep the unity' (Eph 4:1-3), which requires God-enabled effort.","refs":["Eph 1:3","Eph 4:1-3"],"target":"All blessing in Christ, none in response to obedience"},{"claim":"Holiness must be not only obtained but maintained through warfare","detail":"Sanctification is obtained as a gift but must be maintained through grace-enabled daily effort, as shown by passions that 'wage war against your soul' (1 Pet 2:11), the law of sin 'waging war' (Rom 7:23) and our fight against spiritual forces (Eph 6:12).","refs":["1 Pet 2:11","Rom 7:23","Eph 6:12"],"target":"No spiritual battle for the believer"},{"claim":"The New Testament has 30 commands calling for active personal exertion","detail":"Citing J.C. Ryle's observation that 25-30 epistle passages call believers to active exertion, the author lists 30, including endure, persevere, toil, deny ungodliness, flee lusts, fight the good fight, strive against sin, put on armour, put to death the earthly members, and get rid of anger.","refs":["Heb 12:7","1 Tim 4:16","Col 1:29","Phil 3:13-14","Titus 2:12","Titus 3:14","1 Thess 4:3","Rom 13:12","2 Tim 2:22","1 Cor 16:13","1 Cor 9:26","1 Tim 6:12","2 Tim 4:5","1 Pet 5:8","1 Pet 2:19","Heb 3:13","Heb 10:35","Heb 12:1","Heb 12:4","1 Tim 6:17","1 Tim 1:19","Jas 4:7","Eph 4:27","Jas 1:27","Gal 5:1","Jude 21","Eph 6:10-11","Col 3:5","Col 3:8"],"target":"Holiness without effort"},{"claim":"Sanctification calls for an A (Abide) to Z (Zeal) commitment","detail":"The author calls for an A-to-Z commitment to ongoing sanctification: A for Abide (1 John 2:28) and Z for Zeal (Rom 12:11; Titus 2:14).","refs":["1 John 2:28","Rom 12:11","Titus 2:14"],"target":"Passive Christianity"},{"claim":"Jesus is the Alpha and Omega of our holiness (Rev 22:12-14)","detail":"Revelation 22:12 (repayment for deeds) and 22:14 (blessed are those who wash their robes) call for holiness, while 22:13 reveals Jesus, the Alpha and Omega, as the enabler: Alpha because we become holy when we come to him in repentance, Omega because he empowers us to endure in holiness until death or his return.","refs":["Rev 22:12-14"],"target":"Holiness without endurance"},{"claim":"Holiness-refusing believers end up in hell (Matt 22:13)","detail":"The wedding guest without a proper garment is like a believer who received the gift of holiness at salvation but refused the free garment of daily holiness to enjoy sin; he ended in the place of weeping and gnashing of teeth, which is hell.","refs":["Matt 22:12-13"],"target":"Believers who refuse daily holiness are still safe"},{"claim":"Don't settle for 'salvation-satisfaction-stagnation'","detail":"Like Rohit Sharma, angry at himself after scoring 140, believers should feel genuine regret over sin (2 Cor 7:10) and strive to add virtues (2 Pet 1:5-8) and be transformed from glory to glory (2 Cor 3:18), not be satisfied with watching porn only monthly compared to a friend weekly, or worrying less than a spouse.","refs":["2 Cor 7:10","2 Pet 1:5-8","2 Cor 3:18"],"target":"Complacent Christianity"}],"questions":[{"q":"'Taking efforts for holiness is wrong': are Hyper-Grace preachers right when they say that?","answer":"No. The Bible teaches both gifted holiness and guarded holiness that requires Spirit-enabled effort."},{"q":"Holiness, according to them, is effortless. Really?","answer":"No; holiness must be guarded every moment with Spirit-enabled effort."},{"q":"Where do holiness-refusing believers land up in?","answer":"In hell, like the wedding guest cast into the place of weeping and gnashing of teeth (Matt 22:13)."},{"q":"Do we seek to grow in our Christian life the way Rohit Sharma sought to outdo himself?","answer":"We should; genuine regret over sin and continual Christ-like growth (2 Pet 1:5-8; 2 Cor 3:18) should mark us."},{"q":"Are you mighty pleased that you watch porn only once a month while your friend watches weekly?","answer":"That is comparative complacency; we should aim at total victory and ongoing transformation."}],"criticisms":[{"of":"a New Zealand-based Hyper-Grace blogger (anonymised)","quote":"Ephesians 1:3 tells us that every spiritual blessing comes to us through Christ. There are no extra blessings that come to us separately from Christ and in response to our obedience. All is grace.","critique":"Eph 1:3 describes gifted holiness only; Ephesians also commands guarded, lived-out holiness requiring effort (Eph 4:1-3)."},{"of":"a Singapore megachurch Hyper-Grace pastor (anonymised)","quote":"What we need today are not more laws to govern believers. What we need is a greater revelation and appreciation of Jesus and everything that He has done for us!","critique":"The author sees this as part of a message that sanctification needs no effort."},{"of":"a Singapore megachurch Hyper-Grace pastor (anonymised)","quote":"When God sees you today, He sees Jesus... In God's eyes, you are (already) righteous, you are favored, you are blessed, and you are healed. You are freed from all sin, all pangs of guilt, all forms of condemnation, and every bondage of addiction!","critique":"This makes holiness effortless: go to bed, rest and relax about sanctification."}],"illustrations":[{"title":"The dying thief","story":"The thief on the cross rebuked his mocking companion, acknowledged Jesus' innocence and was promised paradise that day.","point":"Gifted holiness is received instantly upon repentance and faith."},{"title":"Fanny Crosby's hymn","story":"To God Be the Glory: 'The vilest offender who truly believes, that moment from Jesus a pardon receives.'","point":"Gifted holiness is instant."},{"title":"Obtain and maintain","story":"Holiness is obtained as a gift and must be maintained with daily effort.","point":"Both gift and effort are needed."},{"title":"A-to-Z commitment","story":"A for Abide, Z for Zeal.","point":"Sanctification demands wholehearted commitment."},{"title":"Rohit Sharma livid at 140","story":"In the 16 June 2019 World Cup match against Pakistan at Manchester, Rohit Sharma scored 140 off 113 balls but was furious with himself for getting out to a needless shot with 11 overs left; India won by 89 runs.","point":"Believers should never settle for 'salvation-satisfaction-stagnation' but pursue ongoing growth."}],"keyVerses":[{"ref":"Luke 23:43","text":"Today you will be with me in paradise","use":"Gifted holiness received instantly."},{"ref":"Heb 12:14","text":"Make every effort to live in peace with everyone and to be holy","use":"Guarded holiness requires effort."},{"ref":"Eph 4:1-3","text":"live a life worthy of the calling... make every effort","use":"Ephesians commands lived-out holiness."},{"ref":"1 Pet 2:11","text":"passions of the flesh, which wage war against your soul","use":"Holiness must be maintained through warfare."},{"ref":"Heb 12:4","text":"Striving against sin... to the point of death","use":"One of 30 exertion commands."},{"ref":"Rev 22:13-14","text":"I am the Alpha and the Omega... Blessed are those who wash their robes","use":"Jesus enables holiness from start to finish."},{"ref":"2 Pet 1:5-8","text":"make every effort to add to your faith virtue","use":"Continual growth in character."},{"ref":"2 Cor 3:18","text":"being transformed... from one degree of glory to another","use":"Ongoing transformation."}],"flow":["Hyper-Grace says holiness is effortless","Gifted holiness is received instantly at conversion","Guarded holiness requires Spirit-enabled effort","Ephesians and Hebrews teach both kinds","Thirty NT commands demand active exertion","Jesus is Alpha and Omega of holiness","Refusing holiness leads to hell; never stagnate"],"outlines":[{"acronym":"Gifted vs Guarded Holiness","items":[{"letter":"1","label":"Gifted holiness","point":"Given free when we repent and trust Jesus, as with the dying thief; taught in Heb 9:14, 10:10, 13:12 and Eph 1:3.","refs":["Luke 23:39-43","Heb 9:14","Heb 10:10","Heb 13:12","Eph 1:3"]},{"letter":"2","label":"Guarded holiness","point":"Maintained by Spirit-enabled effort every moment; taught in Heb 12:14, 13:4-5 and Eph 4:1-3.","refs":["Heb 12:14","Heb 13:4-5","Eph 4:1-3"]}]},{"acronym":"Not Just Obtain, But Maintain","items":[{"letter":"1","label":"Abstain from fleshly passions","point":"Passions wage war against the soul.","refs":["1 Pet 2:11"]},{"letter":"2","label":"The law of sin wages war","point":"Sin wars against the mind.","refs":["Rom 7:23"]},{"letter":"3","label":"We fight spiritual forces","point":"Our battle is against unseen evil powers.","refs":["Eph 6:12"]}]},{"acronym":"30 Commands of Active Personal Exertion","items":[{"letter":"1","label":"Endure","point":"Endure hardship as discipline.","refs":["Heb 12:7"]},{"letter":"2","label":"Persevere","point":"Persevere in life and doctrine.","refs":["1 Tim 4:16"]},{"letter":"3","label":"Toil and struggle with Christ's strength","point":"Labour using the strength Christ supplies.","refs":["Col 1:29"]},{"letter":"4","label":"Don't look back","point":"Forget what is behind.","refs":["Phil 3:13"]},{"letter":"5","label":"Deny ungodliness","point":"Renounce worldly passions.","refs":["Titus 2:12"]},{"letter":"6","label":"Devote yourselves to good works","point":"Learn to devote to good works.","refs":["Titus 3:14"]},{"letter":"7","label":"Make a clean cut with sexual immorality","point":"Abstain from sexual immorality.","refs":["1 Thess 4:3"]},{"letter":"8","label":"Stop behaving as people in the dark","point":"Cast off works of darkness.","refs":["Rom 13:12"]},{"letter":"9","label":"Run from youthful lusts","point":"Flee what stimulates lust.","refs":["2 Tim 2:22"]},{"letter":"10","label":"Keep your eyes open for spiritual danger","point":"Be watchful.","refs":["1 Cor 16:13"]},{"letter":"11","label":"Do not run aimlessly","point":"Run with purpose.","refs":["1 Cor 9:26"]},{"letter":"12","label":"Press on","point":"Press towards the goal.","refs":["Phil 3:14"]},{"letter":"13","label":"Fight the good fight","point":"Fight the good fight of faith.","refs":["1 Tim 6:12"]},{"letter":"14","label":"Be sober-minded","point":"Be sober in all things.","refs":["2 Tim 4:5"]},{"letter":"15","label":"Be watchful","point":"Watch against the adversary.","refs":["1 Pet 5:8"]},{"letter":"16","label":"Endure grief, suffering wrongfully","point":"Bear unjust suffering.","refs":["1 Pet 2:19"]},{"letter":"17","label":"Exhort one another daily","point":"Encourage one another every day.","refs":["Heb 3:13"]},{"letter":"18","label":"Do not throw away your confidence","point":"Hold on to confidence.","refs":["Heb 10:35"]},{"letter":"19","label":"Put aside every impediment","point":"Lay aside sin that hampers.","refs":["Heb 12:1"]},{"letter":"20","label":"Strive against sin","point":"Strive to the point of death.","refs":["Heb 12:4"]},{"letter":"21","label":"Do not be conceited","point":"Do not be arrogant.","refs":["1 Tim 6:17"]},{"letter":"22","label":"Hold on to faith and good conscience","point":"Keep faith and conscience.","refs":["1 Tim 1:19"]},{"letter":"23","label":"Submit yourself","point":"Submit to God.","refs":["Jas 4:7"]},{"letter":"24","label":"Don't give the devil a chance","point":"Give no foothold to the devil.","refs":["Eph 4:27"]},{"letter":"25","label":"Remain uncorrupted by the world","point":"Keep unstained from the world.","refs":["Jas 1:27"]},{"letter":"26","label":"Stand firm against slavery's yoke","point":"Do not submit again to slavery.","refs":["Gal 5:1"]},{"letter":"27","label":"Maintain yourself in God's love","point":"Keep yourselves in God's love.","refs":["Jude 21"]},{"letter":"28","label":"Build up strength in the Lord","point":"Be strong in the Lord.","refs":["Eph 6:10"]},{"letter":"29","label":"Put on the full armour","point":"Put on God's armour.","refs":["Eph 6:11"]},{"letter":"30","label":"Put to death evil longings; get rid of anger","point":"Mortify earthly members and put off anger and similar sins.","refs":["Col 3:5","Col 3:8"]}]},{"acronym":"A to Z Commitment","items":[{"letter":"A","label":"Abide","point":"Abide in him.","refs":["1 John 2:28"]},{"letter":"Z","label":"Zeal","point":"Do not be slothful in zeal; be zealous for good works.","refs":["Rom 12:11","Titus 2:14"]}]}]},{"num":6,"section":"Hyper-Grace","title":"No Judgment of God, Post the Cross of Jesus, as Hyper-Grace Cultists Allege?","summary":"The author addresses the Hyper-Grace claim, popular with social-media-influenced South Indian youth and reinforced by worship songs that mock the fear of God, that believers need not fear God or coming judgment after the cross. Using Ananias and Sapphira, he argues fear came on the 'church' (Acts 5:5,11) and that they were believers like Barnabas, rejecting the Hyper-Grace claim that they were unbelievers and a Chennai pastor's claim that Peter killed Sapphira. He lists post-cross judgments: Herod struck by an angel (Acts 12:23), sickness and death for unworthy communion (1 Cor 11:29-30), Jesus' threat against Jezebel and her children (Rev 2:20-23), Elymas' blindness (Acts 13:5-11) and 'God will destroy' temple-destroyers (1 Cor 3:16-17). God is both Compassionate Father and Consuming Fire (Heb 12; Rom 11:22) and can 'prepone' judgment, though only apostles had authority to pronounce such judgments; today we preach the judgment of hell. He notes suffering is not always due to sin (John 9), urges believers to remain in Christ (John 15; Rom 8:1), and calls for rescuing those dragged toward hell (Jude 23).","thesis":"God still judges, even believers, after the cross, and can bring judgment forward, so Christians must keep a healthy fear of God and remain in Christ.","outline":null,"claims":[{"claim":"Hyper-Grace removes fear of God, so youth take sin lightly","detail":"Hyper-Grace teaches believers need not fear God or coming judgment because of the cross, and many worship songs mildly mock healthy fear of God. Influenced by this, Google-generation believers excuse sin.","refs":[],"target":"No need for fear of God after the cross"},{"claim":"Fear fell on the church after Ananias and Sapphira","detail":"Acts 5:5 and 5:11 say great fear came on the church, which would not be stated if believers need not fear God. Hebrews 12 presents God as both disciplining Father (v7) and consuming fire to be reverenced (v28-29).","refs":["Acts 5:5","Acts 5:11","Heb 12:7","Heb 12:28-29"],"target":"Believers need no fear of God"},{"claim":"God's kindness and sternness must both be considered (Rom 11:22)","detail":"Paul tells Roman believers to consider the kindness and sternness of God: sternness to those who fell, kindness to you, provided you continue in his kindness; otherwise you will be cut off (Rom 11:22). We must not cherry-pick God's characteristics.","refs":["Rom 11:22"],"target":"God is only kind"},{"claim":"Ananias and Sapphira were believers, like Barnabas","detail":"Hyper-Grace teachers claim Ananias and Sapphira were not believers so their fate cannot befall post-cross believers. The author says the uninspired chapter division between Acts 4 and 5 hides that they are contrasted with Barnabas, a believer and apostle (Acts 14:14); and if they weren't part of the church, fear would not have gripped the whole church.","refs":["Acts 4:36-37","Acts 5:1-11","Acts 14:14"],"target":"Ananias and Sapphira were unbelievers"},{"claim":"God may 'prepone' judgment even in the post-cross era","detail":"This God, who may choose to bring forward the day of judgment on select occasions even after the cross, as with Ananias and Sapphira, needs to be feared. Luke repeats 'fear' (Acts 5:5,11) to call today's believers to holy fear.","refs":["Acts 5:5","Acts 5:11"],"target":"No temporal judgments after the cross"},{"claim":"Peter did not kill Sapphira; God judged her","detail":"A Chennai Hyper-Grace pastor claims Peter killed Sapphira by his words of condemnation (Acts 5:9-10). The author calls this bizarre, Hyper-Grace-lens interpretation; God brought the deaths to instil holy fear, as Luke indicates (Acts 5:5,11).","refs":["Acts 5:9-10","Acts 5:5","Acts 5:11"],"target":"Peter, not God, caused Sapphira's death"},{"claim":"Herod was struck by an angel after the cross","detail":"The angel of the Lord struck proud Herod, who was eaten by worms and died (Acts 12:20-23), reminding him he was a worm before God. This happened after Jesus' death, resurrection, ascension and intercession, so did the angel insult the finished work of the cross?","refs":["Acts 12:20-23"],"target":"No judgment after the cross"},{"claim":"Unworthy communion brings judgment of sickness and death","detail":"Taking communion unworthily brings judgment (1 Cor 11:29), which can include weakness, sickness and death (1 Cor 11:30). This is a post-cross scenario.","refs":["1 Cor 11:29-30"],"target":"No judgment after the cross"},{"claim":"Jesus threatened 'Jezebel' and her children with sickness and death","detail":"Post-cross Jesus promised a sickbed, great tribulation and death for the sexual immorality-encouraging false prophetess 'Jezebel' (who could be called a hyper-grace false pastor) and her followers in Thyatira (Rev 2:20-23). Did Jesus insult his own finished work?","refs":["Rev 2:20-23"],"target":"No judgment after the cross"},{"claim":"Paul pronounced blindness on Elymas","detail":"God used Paul to pronounce temporary blindness on Elymas (Bar-Jesus), a Jewish false prophet and magician who tried to stop a proconsul from believing (Acts 13:5-11), another post-cross judgment.","refs":["Acts 13:5-11"],"target":"No judgment after the cross"},{"claim":"God will destroy those who destroy his temple (1 Cor 3:16-17)","detail":"Paul wrote to New Covenant believers that God will destroy anyone who destroys God's temple; these believers argued for the right to visit prostitutes. So did God insult Jesus' finished work?","refs":["1 Cor 3:16-17"],"target":"No judgment after the cross"},{"claim":"Only apostles could pronounce present judgments; we preach hell","detail":"Only the New Testament apostles had authority to be instruments of such temporal judgment; believers today cannot pronounce judgment on people. The only judgment we should talk about is hell for those who reject the Lamb (Rev 20:15; 21:7-8). Yet God still reserves the right to prepone judgment, and all such cases will be known on the final day (Rom 2:16).","refs":["Rev 20:15","Rev 21:7-8","Rom 2:16"],"target":"Believers pronouncing judgment / no judgment at all"},{"claim":"Paul preached coming judgment after the cross","detail":"Hyper-Grace says God is no longer angry or punishing after the cross. But Paul preached about 'the judgment to come' to Felix after the cross (Acts 24:24-25); he would have skipped it if he believed the Hyper-Grace gospel.","refs":["Acts 24:24-25"],"target":"God is not angry at sin after the cross"},{"claim":"God gives many chances, then may judge (Gen 6:3)","detail":"Jesus prayed for Ananias and Sapphira at God's right hand, yet when they lied they dropped dead. 'My Spirit shall not always strive with man' (Gen 6:3): after striving with this New Covenant couple, God judged them.","refs":["Gen 6:3","Acts 5:1-11"],"target":"Jesus' intercession guarantees no judgment"},{"claim":"Suffering isn't always from sin, but God may punish the stubborn","detail":"Suffering, sickness and death are not always due to sin (John 9), but God may allow them as punishment after giving enough chances, and only God knows how many. A stubborn sinner can face judgment even after the cross.","refs":["John 9:1-3"],"target":"No divine judgment through suffering"},{"claim":"Remain in Christ: no condemnation for those who ARE in him","detail":"Believers must remain in Christ and his love, a theme in John 15 six times. Romans 8:1 says no condemnation for those who ARE in Christ, not those who once were (David Pawson's point).","refs":["John 15:4-10","Rom 8:1"],"target":"Once in Christ, always safe regardless"},{"claim":"We must rescue those Hyper-Grace teachers drag toward hell","detail":"Hyper-Grace teachers are going to hell if they do not repent and taking people with them. Jude 23 calls us to pursue those singed by God's wrath and rescue them from hell's fire; this book is that attempt.","refs":["Jude 23"],"target":"Silence about Hyper-Grace"}],"questions":[{"q":"Is there no judgment of God post the cross of Jesus, as Hyper-Grace cultists allege?","answer":"There is; Ananias and Sapphira, Herod, the Corinthian communion, Jezebel, Elymas and 1 Cor 3:16-17 all show post-cross judgment."},{"q":"Did the angel of the Lord who struck down Herod insult the finished work of the cross?","answer":"The author poses this to show Hyper-Grace logic fails: post-cross judgment happened, so judgment does not insult the cross."},{"q":"Did God insult Jesus' finished work by warning he would destroy those who destroy his temple?","answer":"No; 1 Cor 3:16-17 shows God judges even New Covenant believers."},{"q":"Did post-cross Jesus insult his own finished work by threatening Jezebel?","answer":"No; Revelation 2 shows Jesus judging unrepentant false teachers after the cross."},{"q":"Were Ananias and Sapphira believers?","answer":"Yes; contextually linked with Barnabas, part of the church, and their deaths made fear grip the church."},{"q":"Why did Paul preach about coming judgment after the cross?","answer":"Because judgment remains real; he would have skipped it if he believed Hyper-Grace."}],"criticisms":[{"of":"Hyper-Grace cult false teachers (general)","quote":"You won't see God as an angry/punishing God anymore after the Cross... God is not fuming at sin now...","critique":"The author calls this 'unbiblical rubbish', citing Paul's preaching of coming judgment and multiple post-cross judgments."},{"of":"Hyper-Grace teachers (general)","quote":"","critique":"They claim Ananias and Sapphira were not believers so their fate cannot befall post-cross believers."},{"of":"a Chennai-based Hyper-Grace pastor (anonymised)","quote":"","critique":"He claims Peter killed Sapphira by his words of condemnation (Acts 5:9-10), which the author calls a bizarre interpretation through a Hyper-Grace lens."},{"of":"popular worship songs","quote":"","critique":"There is an overdose of popular worship songs that mildly mock even healthy fear of God, leading youth to take sin lightly."},{"of":"'Jezebel' of Thyatira (likened by the author to a hyper-grace false pastor)","quote":"","critique":"She encouraged sexual immorality and was threatened by Jesus with sickbed, tribulation and death of her children."}],"illustrations":[{"title":"Ananias and Sapphira","story":"A couple in the early church lied to the Holy Spirit about their gift and fell dead, and great fear came on the church.","point":"God judges even believers after the cross; he must be feared."},{"title":"The unhelpful chapter division","story":"The uninspired break between Acts 4 and 5 separates the Barnabas story from Ananias and Sapphira.","point":"Read together, they show Ananias and Sapphira were believers like Barnabas."},{"title":"Herod eaten by worms","story":"An angel struck down Herod for accepting worship, and he was eaten by worms.","point":"God reminded Herod he was a worm; post-cross judgment is real."},{"title":"Elymas blinded","story":"Paul pronounced blindness on the magician Elymas, who opposed the proconsul's faith.","point":"God's judgment through apostles after the cross."}],"keyVerses":[{"ref":"Acts 5:11","text":"Great fear seized the whole church","use":"Believers must have healthy fear of God."},{"ref":"Heb 12:28-29","text":"with reverence and awe... for our God is a consuming fire","use":"God is Compassionate Father and Consuming Fire."},{"ref":"Rom 11:22","text":"Consider therefore the kindness and sternness of God","use":"Do not cherry-pick God's characteristics."},{"ref":"Acts 12:23","text":"an angel of the Lord struck him down","use":"Post-cross judgment."},{"ref":"1 Cor 11:29-30","text":"many among you are weak and ill, and some have died","use":"Judgment on unworthy communion."},{"ref":"Rev 2:22-23","text":"I will throw her onto a sickbed... I will strike her children dead","use":"Jesus judges after the cross."},{"ref":"1 Cor 3:17","text":"If anyone destroys God's temple, God will destroy him","use":"Judgment on New Covenant believers."},{"ref":"Gen 6:3","text":"My Spirit shall not always strive with man","use":"God gives chances then judges."},{"ref":"Rom 8:1","text":"no condemnation for those who are in Christ Jesus","use":"Only those who remain in Christ are free from condemnation."},{"ref":"Jude 23","text":"snatching them out of the fire","use":"Rescue those led astray by Hyper-Grace."}],"flow":["Hyper-Grace removes fear of God and judgment","Ananias and Sapphira were believers judged by God","Herod, Corinthians, Jezebel, Elymas show post-cross judgment","God is both Father and Consuming Fire","God may prepone judgment; we preach hell","Remain in Christ to avoid condemnation","Rescue people from Hyper-Grace's path to hell"],"outlines":null},{"num":7,"section":"Hyper-Grace","title":"The Hyderabad Disha Rapists' Punishment and Its Connection to a Hyper-Grace Cult's Claim","summary":"The author opens with the 2019 Hyderabad rape-murder of a young veterinarian (called 'Disha'), whose four accused were killed by police days later in a widely celebrated 'encounter'. He uses it to stress again that God's judgment does not stop after the Cross. Hell is a far greater punishment than a police encounter for unrepentant Christ-rejecters, and Jesus warned that believers who persist in 'raping-in-the-mind' (lust, Matt 5:28-29), such as choosing OTT shows for their obscenity, face the same punishment. Quoting Heb 12:25, he argues New Covenant believers will be judged more severely than those under Moses. Punishment is cancelled only for those who keep abiding in Christ (Rom 8:1; John 15). Otherwise it is 'stored up' (Rom 2:4-5) for Judgment Day (Rev 20:15) or sometimes carried out earlier, as with Ananias and Sapphira, Herod, careless communion-takers and Jezebel.","thesis":"God's punishment did not end at the Cross: unrepentant sin, including a believer's persistent lust, stores up wrath that will be executed at judgment or even before it.","outline":{"acronym":"OTT","items":[{"letter":"O","label":"Obscenity","point":"Believers who choose streaming shows for obscene content are feeding lust, which Jesus treats as adultery of the heart.","refs":["Matt 5:28-29"]},{"letter":"T","label":"Titillation","point":"Watching for sexual titillation is 'raping-in-the-mind', a sin that brings the same hell-punishment if persisted in.","refs":["Matt 5:28-29"]},{"letter":"T","label":"Topless bits","point":"Picking shows for nudity shows lust driving choices; the call is self-reflection and repentance.","refs":["Heb 12:25"]}]},"claims":[{"claim":"Hell is far worse than the swift police 'justice' given to the rapists","detail":"The rapists of the Disha case were reportedly shot four days after the crime, and many celebrated it as swift justice. The author argues that hell, the punishment for stubbornly unrepentant Christ-rejecters, is much more severe than any police encounter.","refs":["Rev 20:15"],"target":"The idea that judgment has ended since the Cross"},{"claim":"Believers persisting in lust face the same punishment as the rapists","detail":"Jesus said lust is adultery in the heart and warned that it is better to lose an eye than for the whole body to go to hell (Matt 5:28-29). So believers who stubbornly indulge 'mental rape', for example by picking OTT shows for obscenity, titillation and nudity, are headed for the same hell as the rapists.","refs":["Matt 5:28-29"],"target":"Believers' sins carry no eternal consequence"},{"claim":"New Covenant believers will be punished more severely than Old Covenant Israel","detail":"Citing Heb 12:25 (NLT), the author says that if Israel did not escape when they refused Moses, we will certainly not escape if we reject the One who speaks from heaven. This should lead to self-reflection and repentance, and it refutes the claim that punishment stopped at the Cross.","refs":["Heb 12:25"],"target":"Punishment stopped under the New Covenant"},{"claim":"No condemnation applies only to those who continually abide in Christ","detail":"Rom 8:1 and John 15 show that punishment is lifted only for those who continuously remain in Christ. Those who do not abide are not exempt.","refs":["Rom 8:1","John 15:1-6"],"target":"Unconditional no-condemnation for all believers"},{"claim":"Punishment is being stored up for the Day of Judgment","detail":"Rom 2:4-5 speaks of storing up wrath for the day of wrath. The author says punishment is stored for execution on Judgment Day (Rev 20:15), or before it if God chooses.","refs":["Rom 2:4-5","Rev 20:15"],"target":"No future judgment for believers"},{"claim":"God sometimes executes punishment before Judgment Day","detail":"God in his sovereignty punished people before the final day: Ananias and Sapphira (Acts 5), Herod (Acts 12), careless communion-takers (1 Cor 11) and Jezebel and her companions (Rev 2).","refs":["Acts 5:1-11","Acts 12:23","1 Cor 11:29-32","Rev 2:20-23"],"target":"God never judges believers in this age"}],"questions":[{"q":"Are you enjoying OTT shows for their obscenity, titillation and topless bits?","answer":"If lust drives our entertainment choices, we are committing 'raping-in-the-mind', which Jesus warned leads to hell. We must repent."},{"q":"Did you know that New Covenant believers will be punished more severely than those under the law of Moses?","answer":"Yes. Heb 12:25 says that if Israel did not escape when they rejected Moses, we will certainly not escape if we reject the One speaking from heaven."},{"q":"Stored punishment? Can God punish before the Day of Judgment?","answer":"Yes. God stores up wrath (Rom 2:4-5) for the final day, but he may act earlier, as in Acts 5, Acts 12, 1 Cor 11 and Rev 2."}],"criticisms":[{"of":"Hyper-Grace teachers generally","quote":"","critique":"They teach that under the New Covenant punishment has stopped altogether because of the Cross. The author says Hebrews and Romans show judgment continues for the unrepentant."}],"illustrations":[{"title":"The Disha rape-murder and police encounter","story":"In November 2019 a 26-year-old vet in Hyderabad was lured by truck workers who had deliberately punctured her tyre, then raped, smothered and burned. On December 6 police shot the four accused dead, and many celebrated it as 'swift justice'.","point":"Hell is a far greater punishment than any human justice, and believers who persist in lust face the same judgment."},{"title":"OTT acronym","story":"Streaming platforms like Amazon Prime, Netflix and Hotstar carry shows chosen for 'O' obscenity, 'T' titillation and 'T' topless bits.","point":"Choosing entertainment driven by lust is mental adultery that calls for repentance."}],"keyVerses":[{"ref":"Matt 5:28-29","text":"Anyone who looks at a woman lustfully has already committed adultery with her in his heart","use":"Lust is 'raping-in-the-mind' and leads to hell if persisted in"},{"ref":"Heb 12:25","text":"We will certainly not escape if we reject the One who speaks to us from heaven","use":"New Covenant believers face more severe judgment"},{"ref":"Rom 8:1","text":"There is now no condemnation for those who are in Christ Jesus","use":"No condemnation only for those who keep abiding"},{"ref":"Rom 2:4-5","text":"You are storing up wrath for yourself on the day of wrath","use":"Punishment is stored for later execution"},{"ref":"Rev 20:15","text":"Anyone not found written in the book of life was thrown into the lake of fire","use":"Stored punishment executed on Judgment Day"}],"flow":["Disha case: rapists killed in swift police encounter","Hell is a far greater punishment than that","Jesus: persistent lust leads to the same hell","Heb 12:25: New Covenant judgment is more severe","No condemnation only for those abiding in Christ","Wrath is stored for Judgment Day or earlier","Examples: Ananias, Herod, Corinth, Jezebel"]},{"num":8,"section":"Hyper-Grace","title":"Should We Repent from Preaching on Repentance as Hyper-Grace Preachers Want Us To?","summary":"The author answers a New Zealand-based Hyper-Grace blogger who wrote an article giving three reasons why he does not preach repentance. He tells of a 2012 national Pentecostal youth conference: he preached from Proverbs 7 and 1,700 youth responded to his altar call, then a later speaker said believers need not repent because of 2 Cor 5:21 and that the Spirit does not convict believers. The author answers that 2 Corinthians itself calls believers to repent (2 Cor 7:10; 12:21; 6:1). James 4:4 shows the Spirit convicts worldly believers, five of the seven churches in Revelation were told to repent, and Jesus, Philip and Paul combined grace with calls to repent. The incestuous man of 1 Cor 5 was called 'evil', excommunicated, repented, and was restored (2 Cor 2:5-8). The author also argues Hyper-Grace is self-defeating, since its followers call him to repent of attacking it. He closes with approving quotes from Billy Graham on repentance, hell and sin.","thesis":"Repentance must keep being preached to believers, because Scripture repeatedly calls the righteous in Christ to turn from sin, and the Holy Spirit does convict them.","outline":null,"claims":[{"claim":"2 Cor 5:21 does not cancel calls to repent in the same letter","detail":"The same letter that calls believers 'the righteousness of God' demands godly sorrow leading to repentance (2 Cor 7:10) and grieves over unrepentant sexual sin (2 Cor 12:21). Read with 2 Cor 6:1, the message is that God's grace must enable believers to overcome sin, or they have received grace in vain.","refs":["2 Cor 5:21","2 Cor 6:1","2 Cor 7:10","2 Cor 12:21"],"target":"No repentance needed because believers are always righteous"},{"claim":"The Holy Spirit does convict believers of sin","detail":"John 16:8 says the Spirit convicts the world, but that does not mean he does not convict believers. James, written to believers, calls the worldly 'adulterous people' and enemies of God (Jas 4:4), so the Spirit convicts worldly believers.","refs":["John 16:8","Jas 4:4"],"target":"The Spirit never convicts believers of sin"},{"claim":"Jesus told five of seven churches in Revelation to repent","detail":"Jesus called Ephesus, Pergamum, Thyatira, Sardis and Laodicea to repent (Rev 2:5,16,21-22; 3:3,19). So grace must be preached along with repentance.","refs":["Rev 2:5","Rev 2:16","Rev 2:21-22","Rev 3:3","Rev 3:19"],"target":"No repentance preaching to churches"},{"claim":"Jesus combined grace and a call to repent in John 5","detail":"Jesus healed the man invalid for 38 years and later told him to stop sinning or something worse might happen (John 5:14). In one chapter he showed grace and called for repentance, and so must we.","refs":["John 5:5-9","John 5:14"],"target":"Grace without a call to holiness"},{"claim":"Philip preached grace and called Simon the Sorcerer to repent","detail":"Philip preached the good news to Simon (Acts 8:12), yet when Simon tried to buy God's gift he was told to repent (Acts 8:21-23). The early church preached both.","refs":["Acts 8:12","Acts 8:21-23"],"target":"Grace preaching that never calls for repentance"},{"claim":"Paul called the incestuous Corinthian an 'evil person', not righteous","detail":"The Corinthians were arrogant about a man sleeping with his (step)mother. Paul called him evil (1 Cor 5:13) and ordered him excommunicated so that he might be saved in the day of the Lord (1 Cor 5:5). If Paul were Hyper-Grace he would have called him righteous.","refs":["1 Cor 5:1-2","1 Cor 5:5-6","1 Cor 5:13"],"target":"Sinning believers still called righteous"},{"claim":"The disciplined man repented and was restored (2 Cor 2:5-8)","detail":"Following scholars, the author identifies the man in 2 Cor 2 with the man of 1 Cor 5. He repented through 'godly grief' (2 Cor 7:10), but 'hyper-discipline' folk would not receive him, so Paul urged forgiveness, comfort and reaffirmed love. He was therefore saved.","refs":["2 Cor 2:5-8","2 Cor 7:10"],"target":"Repentance is unnecessary for believers"},{"claim":"Hyper-Grace is philosophically self-defeating","detail":"Hyper-Grace proponents say there is no need to preach repentance since God sees believers as righteous, yet they comment on the author's social media urging him to repent of attacking Hyper-Grace. By calling him to change, they contradict their own claim that he remains God's righteousness no matter what.","refs":["2 Cor 5:21"],"target":"Hyper-Grace's 'no need to repent' stance"},{"claim":"Preachers like Billy Graham boldly preached repentance and hell","detail":"The author admires Billy Graham, who did not water down the gospel. He quotes Graham: repent immediately when you fail, since sin breaks fellowship; no one spoke about hell more than Jesus; Gal 5:19-21 is the most serious warning to those who sin that grace may abound; take sin seriously and fight its power.","refs":["Gal 5:19-21"],"target":"Pulpits silent on repentance and hell"}],"questions":[{"q":"Should we repent from preaching on repentance, as Hyper-Grace preachers want us to?","answer":"Of course not. The Bible repeatedly calls believers to repent, and the incestuous Corinthian shows repentance leads to salvation."},{"q":"Does not the Holy Spirit convict believers of sin?","answer":"He does. James 4:4 rebukes worldly believers, so the Spirit convicts believers who become worldly."}],"criticisms":[{"of":"A New Zealand-based Hyper-Grace blogger (author of five pro-Hyper-Grace books, on a 'top 100 Christian blogs' list)","quote":"Three Reasons Why I Don't Preach On Repentance ('Turn from Sin')","critique":"The author calls this totally anti-biblical, since Scripture repeatedly calls believers to repent."},{"of":"An American preacher of Indian origin at a 2012 national Pentecostal youth conference","quote":"There is no need to repent because according to 2 Corinthians 5:21 all believers are always the righteousness of God; the Holy Spirit does not convict believers of sin.","critique":"After 1,700 youth had responded to an altar call, he effectively told them repentance was unnecessary, 'poisoning' them with 'hell-populating poison'. This incident motivated the author to write the book."},{"of":"Hyper-Grace proponents commenting on the author's social media","quote":"","critique":"They urge him to repent of attacking Hyper-Grace, contradicting their own 'always righteous' philosophy."},{"of":"Modern pulpits generally","quote":"","critique":"Pulpits rarely mention 'repent' or 'hell' any more."}],"illustrations":[{"title":"The 2012 national youth conference","story":"The author preached from Proverbs 7 on the young man and the married seductress, and youth came forward confessing sins. That evening another preacher told them that repentance was unnecessary.","point":"Hyper-Grace undermines genuine repentance, and this incident drove the author to write the book."},{"title":"The man who slept with his mother","story":"The Corinthian church boasted about a man living with his stepmother. Paul ordered him excommunicated, and the man later repented and was restored.","point":"Discipline aims at repentance and salvation, and sinning believers are not called 'righteous'."},{"title":"Hyper-Discipline","story":"Some in Corinth would not receive back the repentant man, and Paul had to urge forgiveness and comfort.","point":"Repentance must be met with restoration and love."},{"title":"Social-media critics","story":"Hyper-Grace followers comment urging the author to stop attacking Hyper-Grace.","point":"They preach repentance to him, contradicting their own theology."},{"title":"Billy Graham's photo in a hostel room","story":"The author kept Billy Graham's picture in his engineering college hostel in the 1990s and still draws inspiration from him.","point":"A great evangelist preached repentance and hell without watering down the gospel."}],"keyVerses":[{"ref":"2 Cor 6:1","text":"We urge you not to receive God's grace in vain","use":"Read with 5:21: the righteous must use grace to overcome sin"},{"ref":"2 Cor 7:10","text":"Godly sorrow brings repentance that leads to salvation","use":"Repentance is required of believers"},{"ref":"2 Cor 12:21","text":"Many who have sinned earlier and have not repented of the impurity","use":"Paul grieved over unrepentant believers"},{"ref":"Jas 4:4","text":"You adulterous people... friendship with the world means enmity against God","use":"The Spirit convicts worldly believers"},{"ref":"John 5:14","text":"Stop sinning or something worse may happen to you","use":"Jesus joined grace with a call to repent"},{"ref":"1 Cor 5:13","text":"Expel the wicked person from among you","use":"Sinning believers are called evil, not righteous"},{"ref":"2 Cor 2:5-8","text":"Turn to forgive and comfort him... reaffirm your love for him","use":"The repentant man was restored and saved"},{"ref":"Gal 5:19-21","text":"Those who practise such things shall not inherit the kingdom of God","use":"Serious warning to those who sin that grace may abound"}],"flow":["Blogger refuses to preach repentance","Youth conference: preacher cancels repentance call","2 Cor 5:21 must be read with 6:1, 7:10, 12:21","Spirit convicts worldly believers (Jas 4:4)","Jesus and apostles combined grace with repentance","Corinthian sinner called evil, disciplined, repented, restored","Hyper-Grace contradicts itself by calling author to repent","Billy Graham quotes affirm repentance and hell"]},{"num":9,"section":"Hyper-Grace","title":"The Famous Bishop and the Candlesticks Story and the Flawed Hyper-Grace False Teaching","summary":"The author retells 'The Bishop's Candlesticks': a generous bishop takes in a hardened convict, who then steals his treasured silver candlesticks. When police bring the man back, the bishop says he gave them freely, adds them as a gift, blesses him and helps him escape, and the convict is reformed. The author says this story shows true biblical grace against Hyper-Grace. Because Jesus took our punishment, gratitude makes us turn from sin daily, and grace teaches us to say no to ungodliness (Titus 2:12). Habitual sin shows a lack of gratitude for the Cross and marks a person as one who will not 'endure to the end' and so will not be saved (Matt 24:13).","thesis":"True grace, like the bishop's mercy to the convict, produces grateful transformation, and those who keep living in sin show they do not value the Cross and will not be saved.","outline":null,"claims":[{"claim":"The Bishop's Candlesticks illustrates true grace, not Hyper-Grace","detail":"The bishop's undeserved mercy toward the convict reformed him. Likewise the Cross, where Jesus took our punishment, moves the grateful believer to turn away from sin day by day.","refs":["Titus 2:12"],"target":"Grace that does not transform"},{"claim":"Gratitude for the Cross leads to daily turning from sin","detail":"Because Jesus took our punishment, we turn away from sin out of genuine gratitude day by day. Grace, symbolised by the Cross, teaches us to say no to ungodliness and worldly passions.","refs":["Titus 2:11-12"],"target":"Grace as licence"},{"claim":"Habitual sin shows ingratitude and failure to endure, so no salvation","detail":"Living in habitual sin shows we are not truly grateful for the Cross and that we are among those who do not endure to the end. Jesus said such people will not be saved (Matt 24:13), and Hyper-Grace teachers who say otherwise are leading people to a shock on Judgment Day.","refs":["Matt 24:13"],"target":"Eternal security regardless of lifestyle"}],"questions":[{"q":"If we live in habitual sin, are we truly grateful for the Cross?","answer":"No. Habitual sin shows a lack of gratitude and puts us among those who will not endure and will not be saved."}],"criticisms":[{"of":"Hyper-Grace teachers generally","quote":"","critique":"They tell people that those living in habitual sin will still be saved, and their followers will be shocked on the Final Judgment Day."}],"illustrations":[{"title":"The Bishop and the Candlesticks","story":"A kind bishop feeds and shelters a rough convict who steals his mother's silver candlesticks. When police bring him back, the bishop says they were a gift, gives them to him, blesses him and shows him a way to Paris, and the convict is reformed.","point":"True grace leads the grateful recipient to turn from his old sinful ways."}],"keyVerses":[{"ref":"Titus 2:12","text":"It teaches us to say 'No' to ungodliness and worldly passions","use":"Grace transforms and empowers us to reject sin"},{"ref":"Matt 24:13","text":"The one who endures to the end will be saved","use":"Those in habitual sin do not endure and will not be saved"}],"flow":["Story: bishop shows grace to a convict","Grace reforms the convict","Christ took our punishment on the Cross","Gratitude leads to daily turning from sin","Grace teaches us to say no (Titus 2:12)","Habitual sin shows ingratitude, failure to endure"]},{"num":10,"section":"Hyper-Grace","title":"When Pakistan Beat India in an ICC World Cup Game Finally and What It's Got to Do with the Hyper-Grace False Teaching","summary":"The author recalls Pakistan's first-ever World Cup win over India (T20 World Cup, Dubai, 24 October 2021), which MS Dhoni had predicted would come someday, since 'you win some and you lose some'. Similarly, the Bible does not say believers will win over sin every time (2 Chron 6:36; Prov 20:9; Eccl 7:20; 1 John 1:8; Jas 3:2). This does not permit deliberately planning sin, remaining in sin or making sin a habit (Rom 6:1,15; Titus 2:11-12; 1 John 3:6; 5:18). Grace is not a licence for immorality (Jude 4).","thesis":"Believers will sometimes fail, but this truth may never be twisted into permission to plan, remain in or habitually practise sin.","outline":null,"claims":[{"claim":"Scripture admits believers will not win over sin every time","detail":"Like a cricket team that wins some and loses some, believers will stumble. 'There is no one who does not sin' (2 Chron 6:36); no one can claim a pure heart (Prov 20:9); there is no righteous man who never sins (Eccl 7:20); claiming sinlessness is self-deception (1 John 1:8); we all stumble in many ways (Jas 3:2).","refs":["2 Chron 6:36","Prov 20:9","Eccl 7:20","1 John 1:8","Jas 3:2"],"target":"Sinless perfection or despair over failure"},{"claim":"Our failures do not permit planning sin, remaining in it or making it a habit","detail":"No Bible teaching can be subtly twisted to allow deliberately planning sin, choosing to remain in sin or making sin a habit (Rom 6:1,15; Titus 2:11-12; 1 John 3:6; 5:18).","refs":["Rom 6:1","Rom 6:15","Titus 2:11-12","1 John 3:6","1 John 5:18"],"target":"Grace used to excuse deliberate sin"},{"claim":"Grace is not a licence for immoral living","detail":"Jude 4 warns against those who turn the grace of God into a licence for immorality.","refs":["Jude 4"],"target":"Antinomian use of grace"}],"questions":[{"q":"Does the Bible indicate the believer will win over sin every single time?","answer":"No. Scripture says all stumble, but this cannot be used to plan sin or remain in it."}],"criticisms":[{"of":"Cultic Hyper-Grace teaching (generally)","quote":"","critique":"It twists biblical admissions of human weakness into permission to deliberately plan sin, remain in it or make it a habit."}],"illustrations":[{"title":"Pakistan beat India in a World Cup","story":"After 12 straight World Cup losses, Pakistan beat India in the 2021 T20 World Cup in Dubai. MS Dhoni had predicted it, saying you win some and lose some.","point":"Believers too will not win over sin every time, but that is no excuse to plan sin."}],"keyVerses":[{"ref":"Eccl 7:20","text":"There is no righteous man on earth who does good and never sins","use":"Believers will sometimes fail"},{"ref":"1 John 1:8","text":"If we claim to be without sin, we deceive ourselves","use":"No sinless perfection"},{"ref":"Jas 3:2","text":"We all stumble in many ways","use":"Universal stumbling"},{"ref":"Rom 6:1","text":"Shall we go on sinning so that grace may increase?","use":"No licence to remain in sin"},{"ref":"Jude 4","text":"Change the grace of our God into a licence for immorality","use":"Grace is not licence"}],"flow":["Pakistan finally beats India; you win some, lose some","Believers too will not beat sin every time","Many verses admit universal stumbling","But no planning sin or remaining in it","Grace is not a licence (Jude 4)"]},{"num":11,"section":"Hyper-Grace","title":"The Oft-Repeated Movie Dialogue 'All Is Well' and Hyper-Grace Theology","summary":"Hyper-Grace teachers repeat 1 John 4:17 ('as He is, so are we in this world') the way iconic dialogues are repeated in films like '3 Idiots' and 'DDLJ'. They use it to claim God sees sinning believers as he sees Christ, so they can never be condemned. The author quotes a Singapore megachurch pastor's devotional saying God does not judge us by today's performance and believers need not fear judgment. After setting the context of 1 John (a letter answering proto-gnostics who denied the reality of sin), he gives five reasons the interpretation is wrong. These are the Parousia reason (1 John 3:2-3), the plural-pronoun 'we' reason (1 John 1:6; 2:3,28; 3:12,24; 5:18), the 'perfect' reason (love is perfected by keeping his word, 1 John 2:5), the present-continuous tense reason, and the 'pack' reason. The last covers John's Gospel (Judas, John 15:6), 2 John 8-9, 3 John 11 and Revelation (2:11; 21:27; 22:15). He concludes that 'as He is, so are we' refers to those who abide, overcome and persist.","thesis":"1 John 4:17 does not mean God ignores believers' sin; read in the context of all John's writings, it describes believers who continually abide in Christ and reject sin.","outline":{"acronym":"5 P's","items":[{"letter":"P","label":"The Parousia Reason","point":"We are not yet fully like Christ; we will be when he appears, so those with this hope purify themselves now. This is 'already but not yet'.","refs":["1 John 3:2","1 John 3:3"]},{"letter":"P","label":"The Plural Personal Pronoun Reason","point":"Every 'we' in 1 John calls for obedience: walking in light, keeping commands, abiding to avoid shame at his coming, not being like Cain, and not continuing in sin.","refs":["1 John 1:6","1 John 2:3","1 John 2:28","1 John 3:12","1 John 3:24","1 John 5:18"]},{"letter":"P","label":"The 'Perfect' Reason","point":"Boldness in judgment comes from perfected love, and love is perfected in whoever keeps his word, not in those who 'kick' the commands.","refs":["1 John 4:16-17","1 John 2:5"]},{"letter":"P","label":"The Present-Continuous Tense Reason","point":"John's present tenses (goes on believing, is having the Son) show that faith and abiding must continue; the 'if' of 1 John 2:24 refutes once-saved-always-saved.","refs":["1 John 5:5","1 John 5:11-12","1 John 2:24","1 John 4:2"]},{"letter":"P","label":"The 'Pack' Reason","point":"All of John's writings (Gospel, 2 John, 3 John, Revelation) demand continual abiding and overcoming as a condition for heaven.","refs":["John 17:12","John 15:6","2 John 8-9","3 John 11","Rev 2:11","Rev 21:27","Rev 22:15"]}]},"claims":[{"claim":"Hyper-Grace misuses 1 John 4:17 to say God never condemns sinning believers","detail":"Hyper-Grace teachers say that because 'as He is, so are we', God sees believers as he sees Christ no matter how much they sin. As he would never condemn Christ, he will never condemn them, and they need not fear judgment.","refs":["1 John 4:17"],"target":"Believers immune from judgment whatever their conduct"},{"claim":"1 John was written against proto-gnostics who denied the reality of sin","detail":"Drawing on a New Testament scholar, the author says John wrote to congregations shaken by false teachers (possibly proto-gnostics who said bodily sin did not matter) who denied the reality of sin (1:8,10) and claimed special knowledge (2:20,27). These teachers had left (2:19), and John wrote to reassure believers (5:13).","refs":["1 John 1:8","1 John 1:10","1 John 2:19","1 John 2:20","1 John 2:27","1 John 5:13"],"target":"Context-free reading of 1 John 4:17"},{"claim":"Parousia reason: we are not yet fully like Christ until he appears","detail":"1 John 3:2 says we will be like him when he appears, so we are 'already' but 'not yet' like him. 1 John 3:3 calls those with this hope to purify themselves. So 1 John 4:17 does not open a window to live in sin.","refs":["1 John 3:2","1 John 3:3"],"target":"Present full likeness excusing sin"},{"claim":"Plural pronoun reason: every 'we' in 1 John demands obedience","detail":"The 'we' of 4:17 must agree with the other 'we' passages: claiming fellowship while walking in darkness is a lie (1:6), we know him if we keep his commands (2:3), whoever keeps his commands abides (3:24, cf. John 14:15,21), and so on.","refs":["1 John 1:6","1 John 2:3","1 John 3:24","John 14:15","John 14:21"],"target":"Righteousness disconnected from obedience"},{"claim":"Without abiding, believers will shrink in shame at Christ's coming","detail":"1 John 2:28 calls us to abide so that we may have confidence and not shrink in shame at his coming. If we keep sinning, he reserves the right to abandon us when he returns.","refs":["1 John 2:28"],"target":"No accountability at Christ's return"},{"claim":"'Don't be like Cain' shows righteousness involves turning from sin","detail":"1 John 3:12 says we should not be like Cain, who murdered his brother. If righteousness had nothing to do with sin, such examples would be needless, so Hyper-Grace is unbiblical.","refs":["1 John 3:12"],"target":"Righteousness unrelated to conduct"},{"claim":"1 John 5:18: the one born of God does not keep on sinning","detail":"The climax of the 'we' passages is 1 John 5:18: whoever is born of God does not keep on sinning (does not make a practice of it). This flatly rejects the idea that sin does not matter to God.","refs":["1 John 5:18"],"target":"Sin doesn't matter to God"},{"claim":"Love is perfected in those who keep his word (1 John 2:5)","detail":"Boldness on Judgment Day comes from perfected love (4:17), and 2:5 says love is perfected in whoever keeps his word. So the boldness belongs to obedient abiders, not to those who keep 'kicking' the commands.","refs":["1 John 4:17","1 John 2:5","1 John 4:16"],"target":"Boldness in judgment for wilful sinners"},{"claim":"John's present-continuous tenses demand continual faith and abiding","detail":"Quoting a British Bible teacher, the author argues that John's present tenses ('goes on overcoming', 'goes on believing', 'is having the Son', 1 John 5:5,11-12) and the 'if' of 2:24 show that initial faith is not enough and must continue throughout life, refuting 'once saved, always saved'. Another scholar notes that 4:2's 'has come in the flesh' answers Gnostics.","refs":["1 John 5:5","1 John 5:11-12","1 John 2:24","1 John 4:2"],"target":"Once saved, always saved"},{"claim":"Hyper-Grace teachers mirror the Gnostics' denial","detail":"Gnostics denied Christ's continuing incarnation, while Hyper-Grace teachers deny the need for daily abiding, continual faith and steady rejection of besetting sin.","refs":["1 John 4:2"],"target":"Hyper-Grace as modern Gnosticism"},{"claim":"John's Gospel: Judas was lost; unfruitful branches are burned","detail":"Judas, whose name was written in heaven (Luke 10:20), was lost (John 17:12). Branches that do not abide are cut off and thrown into the fire, symbolising loss of salvation and hell (John 15:6).","refs":["Luke 10:20","John 17:12","John 15:6"],"target":"Impossibility of losing salvation"},{"claim":"2 John 8-9: not abiding means losing God, not just rewards","detail":"2 John 8-9 warns not to lose what was worked for, and says whoever does not abide in Christ's teaching does not have God. The corollary is that non-abiders do not have the Father and the Son and are on the wide road to hell.","refs":["2 John 8","2 John 9"],"target":"Only rewards are at stake"},{"claim":"3 John 11: one who does evil has not seen God","detail":"Diotrephes, who loved pre-eminence and rejected others, is the evil one not to be imitated. Whoever does evil has not seen God. So whoever lives stubbornly in sin is not even a believer.","refs":["3 John 9-11"],"target":"Sin-condoning grace"},{"claim":"Revelation: only overcomers escape the second death","detail":"Revelation calls believers to endure (3:10) and overcome (2:11). The corollary of 2:11 is that non-overcomers will be hurt by the second death, which is hell (20:14; 21:8). Those who love and practise falsehood and keep doing what is shameful will be excluded (21:27; 22:15).","refs":["Rev 3:10","Rev 2:11","Rev 20:14","Rev 21:8","Rev 21:27","Rev 22:15"],"target":"No danger for unrepentant believers"},{"claim":"'As He is, so are we' means as abiding, overcoming, persisting believers","detail":"Read in the light of all John's writings, 1 John 4:17 means: as He is, so are we, those who are abiding, overcoming and persisting. The author closes with a devotional definition of abiding: making Christ our supreme object, centre and circumference, our all in all.","refs":["1 John 4:17"],"target":"Unconditional reading of 1 John 4:17"}],"questions":[{"q":"How do we respond to the claim that God judges by Jesus, not by our daily performance?","answer":"By reading 1 John 4:17 in context: five reasons show it does not excuse sin."},{"q":"Is 1 John 4:17 in effect saying 'our sins don't matter to God'?","answer":"No. Unless John taught that elsewhere in the letter, which he does not, the verse cannot mean it; 1 John 5:18 flatly rejects it."},{"q":"Would you be ashamed on the day of Jesus' return?","answer":"If we do not abide and keep shamelessly sinning, we will be ashamed and he may abandon us."},{"q":"How is 'love perfected' so that we may have boldness in the Day of Judgment?","answer":"By keeping his word (1 John 2:5); those who keep 'kicking' the commands do not have perfected love."}],"criticisms":[{"of":"A Singapore megachurch pastor (in a devotional book)","quote":"It is wonderful to know that God does not measure and judge you based on your performance today. Instead, he looks at Jesus, and as Jesus is, that is how He sees you... As new covenant believers we do not have to fear the day of judgement... because as he is, so are we in this world!","critique":"The author calls this a cultic, sin-excusing twist of 1 John 4:17 and refutes it with five reasons from the context of John's writings."},{"of":"Hyper-Grace proponents generally","quote":"","critique":"They repeat 'As He is, so are we in this world' like parrots repeating movie dialogue, twisting Scripture out of desperation and calling obedience negative 'performance'."},{"of":"Hyper-Grace teachers as modern Gnostics","quote":"","critique":"Like the Gnostics who denied the continuing reality of Christ's incarnation, they deny the need for daily abiding, continual faith and rejection of besetting sin."}],"illustrations":[{"title":"'All is well' and 'DDLJ' dialogues","story":"The line 'All is well' recurs in the 2009 film '3 Idiots' (remade in Tamil as 'Nanban'), and 'small, small mistakes in big, big countries' recurs in 'Dilwale Dulhania Le Jayenge' (1995).","point":"Hyper-Grace teachers repeat 1 John 4:17 like parrots, as if all is well and small sins should be ignored."},{"title":"Abiding defined","story":"A devotional writer defines abiding as having Christ as our supreme object, our centre and circumference, our all in all.","point":"Abiding means wholehearted devotion to Christ."}],"keyVerses":[{"ref":"1 John 4:17","text":"As He is, so are we in this world","use":"Refers to abiding, overcoming believers, not sin-excusing"},{"ref":"1 John 3:2-3","text":"When he appears we shall be like him... all who have this hope purify themselves","use":"Already but not yet like Christ; call to holiness"},{"ref":"1 John 1:6","text":"If we say we have fellowship with him while we walk in darkness, we lie","use":"Fellowship requires forsaking sin"},{"ref":"1 John 2:28","text":"Abide in him, so that when he appears we may have confidence and not shrink from him in shame","use":"Non-abiders will be ashamed"},{"ref":"1 John 5:18","text":"Everyone who has been born of God does not keep on sinning","use":"Climactic rejection of Hyper-Grace"},{"ref":"1 John 2:5","text":"Whoever keeps His word, in him truly the love of God is perfected","use":"Perfected love requires obedience"},{"ref":"1 John 2:24","text":"If it does, you also will remain in the Son and in the Father","use":"Conditional abiding refutes once-saved-always-saved"},{"ref":"John 15:6","text":"Thrown away like a branch... thrown into the fire","use":"Loss of salvation and hell"},{"ref":"2 John 9","text":"Everyone who goes on ahead and does not abide in the teaching of Christ, does not have God","use":"Non-abiders lose the Father and Son"},{"ref":"Rev 2:11","text":"He who overcomes will not be hurt by the second death","use":"Only overcomers reach heaven"}],"flow":["Hyper-Grace repeats 1 John 4:17 like movie dialogue","Singapore pastor: God judges by Jesus, not performance","Context: John answering proto-gnostics","Reasons 1-3: Parousia, 'we' passages, perfected love","Reason 4: present-continuous tense demands continuing fait
