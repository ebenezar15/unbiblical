es believers: Hebrews 11-12 show believers dying","detail":"The cult says Heb 9:27 only says 'appointed for man', not 'for believers', so it cannot be used against them. (Two leaders of large Indian Pentecostal denominations had used the verse against the cult.) The author answers from Heb 11:36-40, where faithful believers were sawn in two and killed, and v.40 joins New Testament believers ('us') with Old Testament saints as one group saved by Christ (John 5:39; Acts 10:43; 1 Pet 1:11; Rev 13:8). Heb 12:4 also rebukes backsliding Jewish believers for not resisting to the point of death, so the writer did not mean 9:27 for unbelievers only.","refs":["Heb 9:27","Heb 11:36-40","Heb 12:4","Heb 10:34","John 5:39","Acts 10:43","1 Pet 1:11","Rev 13:8"],"target":"Heb 9:27 applies only to unbelievers"},{"claim":"2 Tim 1:10 read in context (1:8-10 and 4:6) is not immortality on earth","detail":"Social-media opponents most often answer with 2 Tim 1:10. Read the two verses before it: Paul is in prison and may be killed, but he is effectively immortal because he will be raised when Jesus returns. In 2 Tim 4:6, shown in several translations, he says he is about to die; he could not have taught immortality now in 1:10. Like a 1970s American sex cult that twisted Acts 2:44 ('everything in common') to justify spouse-sharing despite Acts' three warnings against sexual sin (Acts 15:20, 29; 21:25), the cult tears 2 Tim 1:10 from context.","refs":["2 Tim 1:8-10","2 Tim 4:6","Acts 2:44","Acts 15:20","Acts 15:29","Acts 21:25"],"target":"2 Tim 1:10 as immortality now"},{"claim":"Paul could not speak of his imminent death if he taught immortality now","detail":"Had Paul taught immortality before Christ's return in 2 Tim 1:10, he would have said in 4:6, 'Even though I am close to death, I will keep escaping it and still be around in 2024!' Instead he says he is about to die, so 2 Tim 1:10's announcement does not teach immortality on earth.","refs":["2 Tim 1:10","2 Tim 4:6"],"target":"Immortality now"},{"claim":"Romans 2:7: one verse cannot make a doctrine","detail":"The Chennai pastor asks, 'If immortality now is impossible, why does Paul say seek immortality?' The author answers that a doctrine cannot rest on one verse. Just as 'firstborn of all creation' (Col 1:15) does not make Jesus a creature, as a non-Trinitarian sect claims, since clear texts like Titus 2:13 affirm his deity, so clear texts like Rom 14:8 show believers can die.","refs":["Rom 2:7","Col 1:15","Titus 2:13","Rom 14:8"],"target":"Rom 2:7 as proof of immortality now"},{"claim":"Seek the Giver, not the gift; glory, honour and immortality come later","detail":"Imagining Paul's explanation, the author says Rom 2:7 means seeking glory, honour and immortality by seeking God, who alone has them (1 Tim 1:17; Isa 42:8; Rev 7:12; Matt 6:33). God will share them in the future: glory 'that will be revealed' (Rom 8:18), glorious bodies at Christ's return (Phil 3:20-21), honour in his 'well done' (Matt 25:23), and immortality at his coming (1 Thess 4:16-17; 1 Cor 15:50-52), after death or the Second Coming. False teachers divert us to seek gifts out of context.","refs":["Rom 2:7","1 Tim 1:17","Isa 42:8","Rev 7:12","Matt 6:33","Rom 8:18","Phil 3:20-21","Matt 25:23","1 Thess 4:16-17","1 Cor 15:50-52"],"target":"Seeking immortality as a gift now"},{"claim":"Wield the Bible-sword responsibly or land in hell","detail":"The Bible is sharper than a two-edged sword (Eph 6:17; Heb 4:12) and must be wielded responsibly. Hyper-Grace, Hyper-Love and Hyper-Supernaturalism teachers take verses out of context, which will land them and those they influence in hell and make earthly life a living hell. The author prays that a remnant will be rescued and that a small army of faithful Bible teachers will proclaim truth even when it is unpopular, and hear 'well done'.","refs":["Eph 6:17","Heb 4:12","2 Tim 2:15","Matt 25:23"],"target":"Hyper-Grace, Hyper-Love and Hyper-Supernaturalism teachers"}],"questions":[{"q":"Do 1 Corinthians 15:23-26 teach that believers need not die now?","answer":"No. 'At his coming' shows that death, the last enemy, is destroyed by Jesus only at his return."},{"q":"Are the 'feet' of 1 Cor 15:25 the church?","answer":"No. They are the literal feet of the returning Jesus; reading them as the church is a bizarre 'wrong combination'."},{"q":"What is the 'trumpet' of 1 Corinthians 15:52?","answer":"The trumpet of the Second Coming (1 Thess 4:16), not immortality preaching; even the Sinai trumpet (Heb 12:19) was not sounded by humans."},{"q":"Does 2 Corinthians 5:14 ('all died') mean believers will not die again?","answer":"No. Verse 15 shows the life given is spiritual, unselfish living for Christ, which may even mean laying down our lives."},{"q":"Does Hebrews 9:27 apply only to unbelievers?","answer":"No. Hebrews 11:36-40 and 12:4 show the same writer assumed believers can die; v.40 joins Old and New Testament believers."},{"q":"Does 2 Timothy 1:10 teach immortality now?","answer":"No. In context (1:8-10) Paul expects to be killed and raised later, and he says he is about to die (4:6)."},{"q":"If immortality now is impossible, why does Paul say 'seek immortality' (Rom 2:7)?","answer":"One verse cannot make a doctrine; seek God, the giver of glory, honour and immortality, which he will give after death or at Christ's return."},{"q":"Will immortality come before the rapture or Second Coming in any eschatology?","answer":"No; whatever school one belongs to, immortality for believers does not happen before Christ returns."}],"criticisms":[{"of":"Four popular South Indian preachers billed for an April 2020 Chennai no-death conference: a Chennai pastor, a Madurai pastor, a popular Christian YouTube singer, and a Kerala 'prophet' (anonymised)","quote":"","critique":"They were to teach physical death cancellation; Covid cancelled the conference, but such teachings continue."},{"of":"A Chennai pastor (anonymised)","quote":"And so the church, you and I, will destroy death (moving on the next verse). That is, church believers need not die.","critique":"He reads the 'feet' of 1 Cor 15:25 as the church, a bizarre 'wrong combination' ignoring the context of vv.23-24; he also misuses Rom 2:7 ('why does Paul say seek immortality?')."},{"of":"A Madurai pastor (anonymised)","quote":"Yes, Hebrews 9:27 says man is destined to die once and after that face judgement. But I have already died when Jesus died for me according to 2 Corinthians 5:14. So I will not have to die again! I am already immortal now!","critique":"Ignores 2 Cor 5:15, which shows the life given is spiritual; Paul elsewhere affirms believers can die."},{"of":"The no-physical-death cult on Hebrews 9:27","quote":"It is only appointed for MAN to die once... this verse cannot be used to teach that death can come to BELIEVERS.","critique":"The same writer speaks twice of believers dying (Heb 11:36-40; 12:4)."},{"of":"Immortality-now commenters on social media (anonymised)","quote":"There you have it - in 2 Timothy 1:10. That verse says that the gospel brought immortality to us!","critique":"They ignore context (2 Tim 1:8-10; 4:6)."},{"of":"A 1970s American cult (anonymised) that used Acts 2:44 to justify sexual sharing","quote":"The early church believers lived together and even shared husbands and wives between themselves.","critique":"A classic out-of-context abuse, since Acts warns against sexual immorality three times."},{"of":"A non-Trinitarian sect on Colossians 1:15","quote":"","critique":"Wrongly says 'firstborn of all creation' makes Jesus a created being; clear texts like Titus 2:13 show his deity."},{"of":"The Hyper-Grace / Hyper-Love / Hyper-Supernaturalism teachers collectively","quote":"","critique":"They wield the Bible-sword without sense, taking verses out of context, which lands them and their followers in hell and makes earthly life a living hell."}],"illustrations":[{"title":"Sam's Good Samaritan","story":"A Sunday School boy retells the Good Samaritan by mixing in thorns, the queen of Sheba, Absalom's hair, Elijah's ravens, Delilah, the flood, John the Baptist's diet, Jezebel and 'seventy times seven'.","point":"As Christians lose the Bible narrative, they can't see such confusion, and cults like death cancellation thrive."},{"title":"Judas hanged himself; go and do likewise","story":"A man opens the Bible at random to Matt 27:5, Luke 10:37 and John 13:27 and combines them.","point":"Wrongly combining out-of-context verses can 'justify' even suicide; the 'feet' interpretation is this error."},{"title":"Wrong combination and terrorism","story":"Combining Matt 10:11 ('look for people in a city') with Deut 13:15 ('kill the residents with the sword').","point":"Context-free combining yields dangerous conclusions the Bible never teaches."},{"title":"Daily apocalyptic reading during lockdown","story":"The author read the Revelation chapter matching the date, then Daniel 7-12 from the 23rd, like others who read five Psalms or one Proverbs chapter daily.","point":"Regular reading of end-times chapters clarifies last-days events."},{"title":"Martyred missionaries","story":"A young missionary killed in the Andaman Islands in 2018 and five missionaries killed in Ecuador in 1956 died sharing the gospel; one said, 'He is no fool who gives what he cannot keep to gain what he cannot lose.'","point":"The life Christ gives is to be spent for others, even unto death."},{"title":"Hire a pastor to crucify you?","story":"If Gal 5:24's 'crucified the flesh' were literal, we would need to arrange for a pastor to nail us to a cross.","point":"Just as laughable is reading Christ's life-giving death as literal no-death; the meaning is spiritual."},{"title":"Still around in 2024","story":"The author imagines Paul saying, 'I will forever keep escaping death and meet you physical-death-cancellation pastors in 2024!'","point":"Paul said the opposite: he was about to die."},{"title":"Paul explains Romans 2:7","story":"In a 'Bible-soaked imagination', the author has Paul explain that glory, honour and immortality belong to God and will be shared in the future.","point":"Seek the Giver, not the gift."}],"keyVerses":[{"ref":"1 Cor 15:23","text":"then at his coming those who belong to Christ","use":"Death is destroyed only at Christ's return."},{"ref":"1 Cor 15:26","text":"The last enemy to be destroyed is death","use":"Jesus, not believers, destroys death at his coming."},{"ref":"Dan 7:13-14","text":"one like a son of man, coming with the clouds of heaven... an everlasting dominion","use":"Second Coming precedes everlasting life."},{"ref":"Matt 25:46","text":"the righteous into eternal life","use":"Eternal life follows the return and judgment."},{"ref":"1 Thess 4:16-17","text":"the trumpet of God... so we will always be with the Lord","use":"Return first, then immortality; also defines the 'trumpet'."},{"ref":"1 Cor 15:52-53","text":"at the last trumpet... this mortal body must put on immortality","use":"Immortality comes at the Second Coming trumpet."},{"ref":"2 Cor 5:15","text":"that those who live might no longer live for themselves","use":"The life from Christ's death is spiritual and unselfish."},{"ref":"Gal 2:20","text":"the life I now live in the flesh I live by faith","use":"The crucified-with-Christ life is spiritual."},{"ref":"2 Tim 4:6","text":"the time of my departure has come","use":"Paul expected to die, so 2 Tim 1:10 is not immortality now."},{"ref":"Rom 2:7","text":"to those who... seek glory, honor and immortality, he will give eternal life","use":"Seek the Giver; the gift is future."},{"ref":"1 Cor 11:1","text":"Follow my example, as I follow the example of Christ","use":"Doctrine must follow the apostles."}],"flow":["Shallow Bible reading breeds death-cancellation teaching","1 Cor 15:23-26: death destroyed at Christ's coming","'Feet' are Jesus', not the church; avoid wrong combination","Daniel 7, Matthew 25, 1 Thess 4, Revelation agree","Trumpet means Second Coming, not immortality preaching","2 Cor 5:14 and Galatians: the life is spiritual","Heb 9:27, 2 Tim 1:10, Rom 2:7 read in context","Wield the Bible-sword responsibly; pray for a remnant"],"outline":{"acronym":"D-E-A-T-H","items":[{"letter":"D","label":"Direct teaching","point":"Both Testaments directly and repeatedly teach that all people, believers included, will die unless Jesus returns first, so immortality now is unbiblical.","refs":["Deut 31:29","Josh 23:14","Deut 32:39"]},{"letter":"E","label":"Examples in Bible and church history","point":"Biblical and historical examples show that faithful believers die, often suddenly or as martyrs, so immortality on earth before Christ's return is impossible, and death is a blessed promotion for those who abide in Christ.","refs":["Jas 4:14","Num 35:25","John 21:19"]},{"letter":"A","label":"Announcement of immortality","point":"Every biblical announcement of immortality, read in context and with Scripture interpreting Scripture, places believers' immortality after Christ's return, so the immortality-now cult's proof texts are misinterpreted.","refs":["1 Cor 15:23","1 Cor 15:26","Dan 7:13-14"]},{"letter":"T","label":"Three kinds of death","point":"The Bible speaks of three kinds of death, and Christ's promise that believers 'will never die' refers to spiritual and eternal death, not to the cancellation of physical death.","refs":["Heb 2:15","Ps 90:12","Amos 4:12"]},{"letter":"H","label":"Heaven and hell: only there is there no death","point":"Death ends only in the new heaven and earth (and in hell, where none can die), which come after Christ's return and judgment, so death cannot be cancelled before then.","refs":["Rev 21:4","2 Pet 3:10","2 Pet 3:8-9"]}]}},{"num":30,"section":"Hyper-Supernaturalism","title":"For Three Kinds of Death, the Bible Mentions","summary":"Continuing the D-E-A-T-H acronym against the 'no-death for believers' teaching, the author takes up the letter T: the Bible speaks of a Triple Death, namely spiritual, physical and eternal death. He opens with a string of 2020 suicides to show that fame and riches cannot free anyone from the fear of death, and argues from Heb 2:15 that Christ frees us from the fear of death, not from death itself. Using word illustrations ('spring', 'date') he insists that the word 'death' must be read in context, and he traces spiritual death (Gen 2:17, Luke 15:24, Matt 8:22, Eph 2:1-3), physical death (including a warning against suicide through the story of Ahithophel) and eternal death, the 'second death' of everlasting conscious torment in the lake of fire (Rev 20:6,14; 21:8). He concludes that John 11:25-26 promises freedom from spiritual and eternal death, not physical death, and ends with a call to repentance and a prayer of commitment.","thesis":"The Bible speaks of three kinds of death, and Christ's promise that believers 'will never die' refers to spiritual and eternal death, not to the cancellation of physical death.","outlines":[{"acronym":"Three Kinds of Death","items":[{"letter":"1","label":"Spiritual Death","point":"All are born spiritually dead through original sin; living in sin is spiritual deadness; recognising this is the first step of salvation, and only Jesus raises the spiritually dead.","refs":["Gen 2:17","Luke 15:24","Matt 8:21-22","Eph 2:1-3","Ps 51:5","Rom 5:12"]},{"letter":"2","label":"Physical Death","point":"Many Bible characters died physically; be ready for it but never commit suicide, which usurps God's sole right to take life.","refs":["Gen 5:5","2 Sam 17:23","1 Sam 2:6","Acts 3:15"]},{"letter":"3","label":"Eternal Death","point":"The second death is everlasting conscious torment in the lake of fire; faith in the first resurrection (Jesus' resurrection) delivers from it.","refs":["Rev 20:6","Rev 20:14","Rev 21:8","Mark 9:47-48"]}]}],"claims":[{"claim":"Christ frees believers from the fear of death, not from death","detail":"Hebrews 2:15 says Jesus frees those held in slavery by the fear of death. The writer does not say a relationship with Jesus saves us from death here and now, only from its fear. Suicides of famous and wealthy people show that only Jesus can deliver from that fear.","refs":["Heb 2:15"],"target":"No-death-for-believers teaching"},{"claim":"Churches should preach on death because the Bible mentions it 459 times","detail":"The word 'death' occurs 459 times in the ESV. If churches emphasised what the Bible emphasises, and if preachers told people what they must hear rather than what they want to hear, believers would regularly hear sermons on death outside funerals. A half-truth is a full lie.","refs":[],"target":"Preaching that avoids the topic of death"},{"claim":"Scripture calls us to be conscious of our mortality","detail":"Ecclesiastes 7:1 says the day of death is better than the day of birth because after death we live in God's presence (Phil 1:23). Psalm 90:12 teaches us to number our days. This sharply contrasts with the Chennai and Madurai teachers who in effect say we must come to a consciousness that we can become immortal now.","refs":["Eccl 7:1","Ps 90:12","Phil 1:23"],"target":"'Become conscious of your immortality' teaching"},{"claim":"Prepare to meet God by death or by the Second Coming","detail":"Amos 4:12 commands us to prepare to meet our God. There are two possibilities: we go to meet him when we die, or he comes to meet us at his Second Coming. We must be ready for both, an any-second death or an any-second return.","refs":["Amos 4:12"],"target":"Teaching that removes readiness for death"},{"claim":"Paul was content with living or dying for the Lord","detail":"There is nothing new in the New Testament; Jesus was in shadow in the Old and substance in the New. Romans 14:8 shows Paul was okay with both options: living for Jesus until the Second Coming, or dying and living with Jesus forever.","refs":["Rom 14:8"],"target":"Claim that believers need never die"},{"claim":"Death has different meanings depending on context","detail":"Just as 'spring' and 'date' carry different meanings, the word 'death' in the Bible means three different things according to context. When cult pastors quote John 11:25-26 to say 'believe in Jesus and you won't die', believers should ask what kind of death the passage speaks about.","refs":["John 11:25-26"],"target":"Literal reading of John 11:25-26"},{"claim":"Adam died spiritually the day he ate, physically centuries later","detail":"God warned Adam that in the day he ate he would surely die (Gen 2:17). Adam and Eve died spiritually that day, died physically later (Gen 5:5, at 930), and if not abiding in Yahweh would die eternally, which is living in hell forever (Rev 21:7-8).","refs":["Gen 2:16-17","Gen 5:5","Rev 21:7-8"],"target":"Single-meaning view of death"},{"claim":"The prodigal was spiritually dead through sinful living","detail":"The father's words 'this son of mine was dead and is alive again' (Luke 15:24) refer to spiritual death, equivalent to the son's utter sinfulness in wild living and, as the brother claimed, prostitutes. Any sin, such as porn or sex outside marriage, results in spiritual death, and all are born spiritually dead through original sin.","refs":["Luke 15:24","Luke 15:30","Ps 51:5","Jer 13:23","Rom 5:12","Rom 5:19"],"target":"Denial of spiritual death through sin"},{"claim":"'Let the dead bury their dead' means the spiritually dead","detail":"In Matt 8:21-22 the disciple's father was alive; the man was giving a lame excuse to postpone following Jesus until his father eventually died. Jesus meant the spiritually dead would bury him. It is a call against procrastination, though not a ban on funerals (Eccl 7:2).","refs":["Matt 8:21-22","Rev 14:4","Eccl 7:2"],"target":"Procrastination in discipleship"},{"claim":"Recognising spiritual death is the first step of salvation","detail":"Ephesians 2:1-3 says we were dead in offences and sins, indulging the desires of flesh and mind, by nature children of wrath and headed for hell. Prayerlessness and pride are also sin (1 Sam 12:23). Other religions talk about bad people becoming good; Christianity alone talks about dead people becoming alive.","refs":["Eph 2:1-3","1 Sam 12:23"],"target":"Gospel without awareness of sin"},{"claim":"Check the context before believing death-cancellation proof-texts","detail":"In Exodus 10:17 Pharaoh asks Moses to remove 'this death', meaning the piercing pain of the locust plague, not literal death. So whenever physical-death cancellation pastors quote a verse to prove believers need not die, one should ask what 'death' means in that context.","refs":["Exod 10:17"],"target":"Proof-texting by death-cancellation pastors"},{"claim":"Suicide is sin; it is jumping from the frying pan into the furnace","detail":"Jesus is the Author of Life (Acts 3:15) and only he has the right to finish a life, not oneself or a doctor administering euthanasia. Suicide usurps God's exclusive right to take life (1 Sam 2:6). Rest for suicidal restlessness comes only by repenting and coming to Jesus (Matt 11:28); rejecting Jesus and committing suicide leads to hell.","refs":["Acts 3:15","1 Sam 2:6","Matt 11:28"],"target":"Suicide and euthanasia as escape"},{"claim":"Ahithophel's suicide shows sin and failure leave people empty","detail":"Ahithophel, David's counsellor and likely Bathsheba's grandfather, nursed a grudge after David's sin, advised Absalom to sleep with David's concubines publicly, and hanged himself when his later advice was spurned (2 Sam 17:23). His evil counsel left him empty; better to have 'put his house in order' by trusting the coming Messiah. Those facing job loss should trust the God who knows the end from the beginning (Isa 46:10).","refs":["2 Sam 17:23","2 Sam 15:12","2 Sam 11:3","2 Sam 23:34","2 Sam 16:21-22","2 Sam 17:14","Isa 46:10"],"target":"Despair over professional failure"},{"claim":"Eternal death is the second death: everlasting conscious torment","detail":"Revelation 20:6 says the second death has no power over those in the first resurrection. Faith in Jesus' death and resurrection (the first resurrection, since all others raised died again) delivers from the second death, which is everlasting torment in the lake of fire (Rev 20:14; 21:8). Hell punishment is forever; its occupants never die or cease to exist.","refs":["Rev 20:6","Rev 20:14","Rev 21:8","Rev 20:10","Mark 9:47-48"],"target":"Annihilationism / temporary hell"},{"claim":"Death and Hades thrown into the lake means death itself dies","detail":"When people enter the lake of fire, their ability to die dies, because there is no escape there by death (Rev 20:10, 14). Hades is already a place of torment (Luke 16:23), and all its occupants, unbelievers and backslidden believers, will be transferred to the lake of fire. Until then physical death remains on earth.","refs":["Rev 20:10","Rev 20:14","Rev 20:15","Luke 16:23","Isa 66:24","Mark 9:47-48"],"target":"Physical death cancelled before the end"},{"claim":"Crossing from hell to heaven is a lie","detail":"The Chennai cult group that teaches believers need not die also teaches people can cross from hell to heaven. They are speaking lies, and those who believe them could burn forever. The author speaks straight out of love, like a doctor telling a cancer patient the truth.","refs":["Rev 20:15"],"target":"Post-mortem salvation / hell-to-heaven"},{"claim":"Unrepented sins, not only denying Jesus, can send to hell","detail":"False teachers say the only sin that takes us to hell is publicly denying Jesus, but Rev 21:8, written for believers, lists many sins. Stubbornly remaining in sin can take a person to hell. We will not be perfect this side of eternity (Phil 3:20-21, 1 John 3:2) but must strive towards perfection (Matt 5:48). Jezebel, who made others comfortable in sexual sin, faced Jesus' punishment (Rev 2:20-23).","refs":["Rev 21:8","Phil 3:20-21","1 John 3:2","Matt 5:48","Rev 2:20-23"],"target":"Only public denial of Jesus leads to hell"},{"claim":"John 11:25-26 promises no spiritual or eternal death","detail":"John 11:25-26 means believers will not die spiritually or eternally. In the next chapter (John 12:24) Jesus, using figurative language of a wheat kernel, calls himself and his disciples to readiness for death; he could not then have taught there was no death. If Jesus' coming is delayed, physical death may come.","refs":["John 11:25-26","John 12:24"],"target":"Immortality on earth from John 11"},{"claim":"Do not fear those who kill the body","detail":"Matthew 10:28 says do not fear those who kill the body but cannot kill the soul. So believers should not fear a virus or persecutors; the worst they can do is kill us, which is an out-of-turn promotion to heaven. Readers are urged to repent (Luke 13:1-5), believe (John 1:12) and pray a prayer of commitment.","refs":["Matt 10:28","Luke 13:1-5","John 1:12"],"target":"Fear of death and disease"}],"questions":[{"q":"When was the last time you heard a sermon on death when the occasion was not a funeral?","answer":"Probably rarely; yet the Bible speaks of death 459 times, so a church preaching the full truth would preach on it."},{"q":"What did God mean when he told Adam, 'You will certainly die'?","answer":"He meant primarily spiritual death, which happened the day Adam ate; physical death followed at 930 years, and eternal death awaits those not abiding in God."},{"q":"When the father of the prodigal said 'this son of mine was dead', what did he mean?","answer":"Not literal death but spiritual deadness equal to the son's sinful wild living."},{"q":"What did Jesus mean by 'let the dead bury their own dead'?","answer":"The spiritually dead unsaved relatives would bury the father whenever he died; the disciple's request was a lame excuse to procrastinate following Jesus."},{"q":"Why is Jesus' resurrection called the first resurrection?","answer":"Because everyone else raised (Lazarus, Jairus' daughter, the widow's son) died again, while Jesus rose never to die again."},{"q":"What does 'death and Hades were thrown into the lake of fire' mean?","answer":"In the lake of fire people lose the ability to die, living in torment forever; all in Hades will be transferred there after judgment."},{"q":"So, what does Jesus mean by 'everyone who lives and believes in me will never die'?","answer":"That believers will not die spiritually or eternally; physical death may still come if Jesus' return is delayed."},{"q":"Would you make a commitment to Jesus at the end of this chapter without procrastination?","answer":"Yes; repent of sin, put your faith in the crucified and risen Jesus, and pray a prayer of commitment."}],"criticisms":[{"of":"four young preachers planning an 'immortality on earth' conference in Chennai (anonymised)","quote":"If you believe in Jesus, you can choose not to die!","critique":"Their teaching that believers can choose not to die is a false teaching against which the D-E-A-T-H acronym sounds a bugle; the pandemic cancelled their April 2020 event."},{"of":"false pastors from Chennai and Madurai (anonymised)","quote":"We must come to a consciousness that we can become immortal now.","critique":"This directly contradicts Psalm 90:12, which calls us to be ever-conscious of our mortality."},{"of":"a Chennai cult group teaching both no-death and hell-to-heaven crossing (anonymised)","quote":"","critique":"Teaching that people can cross over from hell to heaven is a lie that could send followers to burn forever; the author calls for prayer for their repentance."},{"of":"false teachers who say only public denial of Jesus sends a believer to hell (anonymised)","quote":"","critique":"Revelation 21:8 shows many sins, stubbornly unrepented, lead to hell; teaching that makes people comfortable in sin is like Jezebel's (Rev 2:20-23)."}],"illustrations":[{"title":"The Iruttu Kadai alva shop owner","story":"The 80-year-old owner of a famous dimly-lit sweet shop in Tirunelveli hanged himself within an hour of testing positive for Covid-19 in June 2020.","point":"Disease can make people die, and the fear of death grips even the successful."},{"title":"Celebrity suicides of 2020","story":"Actor Sushant Singh Rajput (34), TV actress Preksha Mehta (25) who left a note about dead dreams, and 16-year-old social media star Siya Kakkar with 2 million followers all ended their lives.","point":"Riches and fame cannot free people; only Jesus frees from slavery to the fear of death (Heb 2:15)."},{"title":"Three meanings of 'spring'","story":"Spring can mean a water source, a season, or a coil of wire.","point":"Words carry different meanings by context; so does 'death' in the Bible."},{"title":"Meanings of 'date'","story":"Date can be a fruit, a romantic outing, a calendar day, or even a Japanese tennis player's surname.","point":"Ask what a word means in its context before accepting a proof-text."},{"title":"Ahithophel's house in order","story":"David's counsellor, likely Bathsheba's grandfather, nursed a grudge, advised Absalom to sleep with David's concubines publicly, and hanged himself when his advice was rejected.","point":"Sin and professional failure leave people empty; trust God rather than ending your life."},{"title":"Absalom as an early porn star","story":"Absalom's public act on the palace roof, on Ahithophel's advice, is likened to porn production, which angered God.","point":"Porn-watching and production anger God and leave people empty; repent and receive cleansing."},{"title":"'You will never make it in ministry'","story":"In 2005 a Christian leader angered by the author's resignation told him he would never make it in ministry; the author started a ministry in 2006 that has since preached in 20 Indian states and seven nations.","point":"The God who knows the end from the beginning can open a better way after a professional setback."},{"title":"A donkey carrying God's Word","story":"The author tells himself God created him to be a donkey carrying God's Word to the Google Generation until his last breath or Jesus' return.","point":"As long as we have breath, fulfil God's call rather than ending life."},{"title":"The truthful cancer doctor","story":"You would love a doctor who tells you that you have cancer and starts treatment.","point":"The author speaks bluntly about hell out of love."},{"title":"The raised who died again","story":"Lazarus, the little girl and the widow's son were raised but died again.","point":"Jesus' resurrection is the first resurrection with no death after it."}],"keyVerses":[{"ref":"Heb 2:15","text":"free those who all their lives were held in slavery by the fear of death","use":"Jesus frees from the fear of death, not from death itself."},{"ref":"Ps 90:12","text":"teach us to number our days","use":"Believers must be conscious of mortality, not immortality."},{"ref":"Amos 4:12","text":"prepare to meet your God","use":"Be ready for any-second death or any-second return."},{"ref":"Rom 14:8","text":"whether we live or whether we die, we are the Lord's","use":"Paul was content to live or die."},{"ref":"Gen 2:17","text":"when you eat from it you will certainly die","use":"Spiritual death came that day; physical death later."},{"ref":"Luke 15:24","text":"this son of mine was dead and is alive again","use":"Spiritual death through sin."},{"ref":"Matt 8:22","text":"let the dead bury their own dead","use":"Spiritual death; call against procrastination."},{"ref":"Eph 2:1-3","text":"you were dead in your offenses and sins... children of wrath","use":"Recognising spiritual death is the first step of salvation."},{"ref":"Rev 20:6","text":"over such the second death has no power","use":"Faith in Jesus' resurrection saves from eternal death."},{"ref":"Rev 21:8","text":"consigned to the fiery lake of burning sulphur. This is the second death","use":"Eternal conscious punishment for unrepentant sinners, including believers."},{"ref":"John 11:25-26","text":"everyone who lives and believes in Me will never die","use":"Means no spiritual or eternal death."},{"ref":"Matt 10:28","text":"Do not be afraid of those who kill the body","use":"Death is an out-of-turn promotion to heaven."}],"flow":["Suicides show the universal grip of the fear of death","Christ frees from fear of death, not death itself","Bible stresses mortality; preach on death","Words like 'death' carry multiple meanings by context","Spiritual death: Adam, prodigal, 'let the dead bury'","Physical death: be ready, but never commit suicide","Eternal death: second death, everlasting torment","John 11:25-26 means no spiritual or eternal death"],"outline":{"acronym":"D-E-A-T-H","items":[{"letter":"D","label":"Direct teaching","point":"Both Testaments directly and repeatedly teach that all people, believers included, will die unless Jesus returns first, so immortality now is unbiblical.","refs":["Deut 31:29","Josh 23:14","Deut 32:39"]},{"letter":"E","label":"Examples in Bible and church history","point":"Biblical and historical examples show that faithful believers die, often suddenly or as martyrs, so immortality on earth before Christ's return is impossible, and death is a blessed promotion for those who abide in Christ.","refs":["Jas 4:14","Num 35:25","John 21:19"]},{"letter":"A","label":"Announcement of immortality","point":"Every biblical announcement of immortality, read in context and with Scripture interpreting Scripture, places believers' immortality after Christ's return, so the immortality-now cult's proof texts are misinterpreted.","refs":["1 Cor 15:23","1 Cor 15:26","Dan 7:13-14"]},{"letter":"T","label":"Three kinds of death","point":"The Bible speaks of three kinds of death, and Christ's promise that believers 'will never die' refers to spiritual and eternal death, not to the cancellation of physical death.","refs":["Heb 2:15","Ps 90:12","Amos 4:12"]},{"letter":"H","label":"Heaven and hell: only there is there no death","point":"Death ends only in the new heaven and earth (and in hell, where none can die), which come after Christ's return and judgment, so death cannot be cancelled before then.","refs":["Rev 21:4","2 Pet 3:10","2 Pet 3:8-9"]}]}},{"num":31,"section":"Hyper-Supernaturalism","title":"H-eaven and H-ell, Only There, There Is No Death","summary":"In the final letter of the D-E-A-T-H acronym, the author argues that only in heaven (the new heaven and new earth) and in hell is there no more death. From Rev 21:1-4 and 2 Pet 3 he establishes a chronology: Christ's public return (Rev 19), the Day of Judgment (Rev 20), then the new creation where death, mourning and pain end (Rev 21). Death-cancellation teachers, like a proverbial cashew nut, want to jump to the third event while skipping the return and judgment. The any-second return of Jesus is a motivation for holy living, and believers living in stubborn sin when they die or when Jesus returns will not enter heaven (Mark 13, Matt 25). He then argues that Isa 65:20 does not teach immortality on earth but symbolically describes eternal life in the new heavens and earth, and notes that a literal millennium rests on a single passage and so need not be doctrine.","thesis":"Death ends only in the new heaven and earth (and in hell, where none can die), which come after Christ's return and judgment, so death cannot be cancelled before then.","outline":{"acronym":"D-E-A-T-H","items":[{"letter":"D","label":"Direct teaching","point":"Both Testaments directly and repeatedly teach that all people, believers included, will die unless Jesus returns first, so immortality now is unbiblical.","refs":["Deut 31:29","Josh 23:14","Deut 32:39"]},{"letter":"E","label":"Examples in Bible and church history","point":"Biblical and historical examples show that faithful believers die, often suddenly or as martyrs, so immortality on earth before Christ's return is impossible, and death is a blessed promotion for those who abide in Christ.","refs":["Jas 4:14","Num 35:25","John 21:19"]},{"letter":"A","label":"Announcement of immortality","point":"Every biblical announcement of immortality, read in context and with Scripture interpreting Scripture, places believers' immortality after Christ's return, so the immortality-now cult's proof texts are misinterpreted.","refs":["1 Cor 15:23","1 Cor 15:26","Dan 7:13-14"]},{"letter":"T","label":"Three kinds of death","point":"The Bible speaks of three kinds of death, and Christ's promise that believers 'will never die' refers to spiritual and eternal death, not to the cancellation of physical death.","refs":["Heb 2:15","Ps 90:12","Amos 4:12"]},{"letter":"H","label":"Heaven and hell: only there is there no death","point":"Death ends only in the new heaven and earth (and in hell, where none can die), which come after Christ's return and judgment, so death cannot be cancelled before then.","refs":["Rev 21:4","2 Pet 3:10","2 Pet 3:8-9"]}]},"claims":[{"claim":"Death ends only when the new heaven and earth appear","detail":"Revelation 21:1-4 is the clearest New Testament passage on the end of death, and it happens when the new heaven and earth appear, marked by God's literal presence among his people. Only then will death, mourning, crying and pain cease.","refs":["Rev 21:1-4"],"target":"Death cancellation before the eternal state"},{"claim":"2 Peter 3 shows the new creation follows Christ's return","detail":"2 Peter 3 says the much-scoffed Day of the Lord will come like a thief, the heavens will disappear and the elements burn, and then comes the new heaven and earth (2 Pet 3:3-4, 10, 13). It is an abridged version of Revelation 19-21. Thus the new heavens and earth are created only after the Second Coming.","refs":["2 Pet 3:3-4","2 Pet 3:10","2 Pet 3:13","Rev 19-21"],"target":"Defeating death before the Second Coming"},{"claim":"Chronology: return, judgment, then new creation without death","detail":"The order is the public return of Jesus (Rev 19), the Day of Judgment (Rev 20), and the new heaven and earth without pain and death (Rev 21). Mourning, pain, crying and death will remain in our lives until then; any talk of defeating or cancelling death before Jesus' return is an impossibility.","refs":["Rev 19","Rev 20","Rev 21"],"target":"Death-cancellation now"},{"claim":"Death-cancellers jump like a cashew nut past return and judgment","detail":"Those embracing the death-cancellation teaching do not want to see the return of Jesus and the Day of Judgment, which are unpleasant topics for them. Like a proverbial cashew nut, they want to jump ahead to the third event, the cancellation of death. They are in error.","refs":[],"target":"Over-realised eschatology"},{"claim":"Be ready for the any-second return; no option of remaining in sin","detail":"2 Peter 3:8-9 means Jesus could return before you finish a sentence or after a thousand years. If we are stubborn in sin, such as porn-watching or pride, when he returns unexpectedly, we could go into an eternity without Jesus, as Mark 13:35-36 warns.","refs":["2 Pet 3:8-9","Mark 13:35-36"],"target":"Comfort in sin"},{"claim":"A believer living in stubborn sin will not go to heaven","detail":"In the Parable of the Ten Virgins the drowsy and procrastinating hear 'I do not know you' (Matt 25:5, 10, 12). Whoever said the Bible cushions stubborn sin without eternal consequence did not read Mark 13 and Matthew 25. A believer in stubborn sin who dies suddenly or meets Jesus' return will not go to heaven.","refs":["Matt 25:1-13","Mark 13:35-36"],"target":"Eternal security / hyper-grace cushion for sin"},{"claim":"Since the earth will be destroyed, don't be attached to it","detail":"If the earth is to be destroyed as 2 Peter 3 says, we should not be like the rich fool of Luke 12 obsessed with bigger barns. We should sing with the hymn-writer, 'This world is not my home, I'm just a-passing through', and mean it.","refs":["2 Pet 3:10","Luke 12:16-21"],"target":"Materialism"},{"claim":"The hope of Christ's return motivates daily holiness","detail":"Because we look for a new heaven and earth where righteousness dwells (2 Pet 3:13), we must strive for righteousness now. Peter urges abstaining from fleshly lusts (1 Pet 2:11) and holy, godly conduct since everything will be destroyed (2 Pet 3:11).","refs":["2 Pet 3:11","2 Pet 3:13","1 Pet 2:11"],"target":"Lax living"},{"claim":"Isaiah 65:20 does not teach immortality on earth","detail":"Some say Isa 65:20 teaches immortality on earth. But reading the preceding verses (Isa 65:17-19) shows this happens when God creates the new heavens and earth, which cannot come before Jesus' return. The phrase 'rejoice forever' indicates God's forever rule through Christ, which Daniel 7:13-14 shows is established after the Son of Man comes.","refs":["Isa 65:17-20","Dan 7:13-14"],"target":"Immortality on earth from Isa 65:20"},{"claim":"Read the Bible in context as we read everything else","detail":"Just as someone in Kodambakkam asks whether 'KVB' means a bank or a biryani shop, or an American asks which 'Washington' is meant, we must ask context-placing questions of every Bible text. Otherwise we may get a meaning that never entered the inspired human author's mind.","refs":[],"target":"Out-of-context proof-texting"},{"claim":"Isaiah 65:20's 'death' is destroyed on entering the new creation","detail":"Revelation 20:14 throws death and Hades into the lake of fire, so the dead unbelievers in Hades will live forever there. By corollary, dead believers in Paradise, like the dying thief, will be forever alive in the new heavens and earth. So the 'death' of Isa 65:20 is a death destroyed upon entering the new creation, where the last enemy is defeated (1 Cor 15:23, 26; Rev 21:4; Isa 65:25).","refs":["Rev 20:14","Luke 16:23-24","Luke 23:43","1 Cor 15:23","1 Cor 15:26","Isa 65:25","Rev 21:4"],"target":"Literal reading of Isa 65:20"},{"claim":"No doctrine of a literal millennium from one passage","detail":"The thousand-year rule appears only in Revelation 20. Scripture requires two or three witnesses to establish a matter (Deut 19:15, Matt 18:16, 2 Cor 13:1; cf. Isa 34:16), so with one witness we need not make a literal thousand-year rule a doctrine. What it symbolises is beyond this chapter.","refs":["Rev 20:1-6","Deut 19:15","Matt 18:16","2 Cor 13:1","Isa 34:16"],"target":"Literal premillennialism"}],"questions":[{"q":"Will a believer living in stubborn sin, when he dies suddenly or when Jesus comes, make it to heaven?","answer":"No; Mark 13 and Matthew 25 show such a believer will hear 'I do not know you' and will not go to heaven."},{"q":"Does Isaiah 65:20 teach immortality on earth?","answer":"No; read in context (Isa 65:17-19) it describes the new heavens and earth after Jesus' return, symbolically depicting eternal life."},{"q":"Isaiah 65:20 seems to talk about death; will there be death in the new heaven life after the Second Coming?","answer":"No; that 'death' is the death destroyed when believers from Paradise enter the new creation, just as Hades' occupants enter the lake of fire."},{"q":"So, is there no literal thousand-year rule?","answer":"It appears in only one passage (Rev 20), and doctrine needs two or three witnesses, so we need not make a literal millennium a doctrine."},{"q":"When you hear 'KVB' or 'Washington', what do you ask?","answer":"Context-placing questions; we must ask the same of every Bible text."}],"criticisms":[{"of":"physical-death cancellation advocates (anonymised)","quote":"","critique":"Like a proverbial cashew nut, they want to jump to immortality while skipping the return of Jesus and the Day of Judgment, which are unpleasant topics to them."},{"of":"those who teach that the Bible cushions stubborn sin (anonymised)","quote":"","critique":"They have not read Mark 13 and Matthew 25, which show stubborn sinners will be shut out."},{"of":"people who use Isaiah 65:20 to teach immortality on earth (anonymised)","quote":"","critique":"They ignore the context of Isa 65:17-19, which places this reality in the new heavens and earth after Christ's return."}],"illustrations":[{"title":"The proverbial cashew nut","story":"Like a cashew nut that sits outside and ahead of its fruit, the death-cancellers jump ahead.","point":"They skip Christ's return and judgment to grab the final event, the end of death."},{"title":"KVB in Kodambakkam","story":"In Chennai's Kodambakkam, 'KVB' could mean a bank or a biryani shop, so locals naturally ask which.","point":"Ask context-placing questions of every Bible text."},{"title":"Which Washington?","story":"In the USA, 'Washington' could be the state, the capital, the first president or a Hollywood actor.","point":"Without context, meaning is lost."},{"title":"'This world is not my home' hymn","story":"The author quotes the hymn about passing through this world with treasures laid up beyond the blue.","point":"Do not be attached to an earth that will be destroyed."},{"title":"The rich man's bigger barns","story":"The rich fool of Luke 12 obsessed over storing his goods.","point":"Do not be attached to earthly possessions."}],"keyVerses":[{"ref":"Rev 21:4","text":"there will no longer be any death","use":"Death ends only in the new heaven and earth."},{"ref":"2 Pet 3:10","text":"the earth and its works will be laid bare","use":"The present creation is destroyed at Christ's return before the new creation."},{"ref":"2 Pet 3:8-9","text":"with the Lord one day is like a thousand years","use":"Jesus can return at any second."},{"ref":"Mark 13:35-36","text":"he may arrive without notice and find you sleeping","use":"Stubborn sinners may be caught unprepared."},{"ref":"Matt 25:12","text":"I do not know you","use":"Drowsy, procrastinating believers excluded."},{"ref":"2 Pet 3:11","text":"what kind of people ought you to be?","use":"Return as motivation for holiness."},{"ref":"Isa 65:20","text":"the young man shall die a hundred years old","use":"Not immortality on earth; symbolic of eternal life in new creation."},{"ref":"Dan 7:13-14","text":"His dominion is an everlasting dominion","use":"Forever rule after the Son of Man comes."},{"ref":"1 Cor 15:26","text":"the last enemy to be destroyed is death","use":"Death defeated only in the new creation."},{"ref":"Deut 19:15","text":"two or three witnesses","use":"No doctrine from the single millennium passage."}],"flow":["Rev 21:1-4: death ends in new heaven and earth","New creation comes only after Christ's return (2 Pet 3)","Chronology: return, judgment, then no death","Death-cancellers skip ahead like a cashew nut","Any-second return demands holiness, not stubborn sin","Isa 65:20 read in context points to new creation","Its 'death' is destroyed on entering new creation","Literal millennium rests on one witness only"],"outlines":[]},{"num":32,"section":"Hyper-Supernaturalism","title":"How Sound Bible Interpretation Principles Sound Their Bugle Against Immortality Now Teaching","summary":"The author offers simple examples of sound interpretation to refute 'immortality on earth' proof-texts. If John 11:26 must mean no physical death, then for consistency John 8:12 should mean no physical darkness and John 4:14 no physical thirst. Hebrews 2:14-15 frees from the fear of death, as Hebrews itself affirms appointed death and possible martyrdom (Heb 9:27, 12:4); Romans 2:7's 'seeking immortality' cannot mean believers need not die, given Rom 14:8. John 6:50-51 is full of metaphors; taking 'not die' literally would require literally eating Jesus' flesh. Finally, Lazarus died again, Jesus foretold Peter's death (John 21:18-19), John denied Jesus said he would not die (John 21:22), and Matt 6:27 assumes all will die.","thesis":"Consistent, context-sensitive interpretation shows that every text used for 'immortality now' refers to spiritual life or freedom from fear, not to the cancellation of physical death.","outlines":[{"acronym":"Misused Proof-texts Corrected","items":[{"letter":"1","label":"John 11:26 vs John 8:12 and 4:14","point":"Light and thirst are read spiritually; consistency demands the same for 'never die'.","refs":["John 11:26","John 8:12","John 4:14"]},{"letter":"2","label":"Hebrews 2:14-15","point":"Freedom from the fear of death, since Hebrews teaches appointed death and martyrdom.","refs":["Heb 2:14-15","Heb 9:27","Heb 12:4"]},{"letter":"3","label":"Romans 2:7","point":"Seeking immortality does not mean not dying; Paul expects death in Rom 14:8.","refs":["Rom 2:7","Rom 14:8"]},{"letter":"4","label":"John 6:50-51","point":"Metaphorical bread language; literal 'not die' requires literal flesh-eating.","refs":["John 6:50-51","Rev 3:20"]},{"letter":"5","label":"John 11:25-26 and the Lazarus test","point":"Lazarus died again; Peter's death foretold; John's not promised immunity.","refs":["John 11:25-26","John 21:18-19","John 21:22","Matt 6:27"]}]}],"claims":[{"claim":"Consistency: 'never die' should be read like light and thirst","detail":"If John 11:26 means believers will not experience physical death, then John 8:12 should mean believers will never be in physical darkness, so they should not switch off lights at night. But these preachers instinctively read the light of John 8:12 and the thirst of John 4:14 spiritually. Why the double standard only with John 11:26?","refs":["John 11:26","John 8:12","John 4:14"],"target":"Literal reading of John 11:26"},{"claim":"Hebrews 2:14-15 frees from fear of death, not death itself","detail":"Hebrews teaches that people are destined to die once (Heb 9:27) and calls believers to possible martyrdom (Heb 12:4). So assigning Hebrews 2:14-15 a meaning of death-freedom, which its own writer did not assign, is a clear case of wrong interpretation.","refs":["Heb 2:14-15","Heb 9:27","Heb 12:4"],"target":"Death-freedom from Heb 2:14-15"},{"claim":"Romans 2:7 'seeking immortality' does not mean believers need not die","detail":"Immortality-on-earth pastors quote Rom 2:7 about seeking immortality. But the idea that believers need not die never entered Paul's mind; in the same letter he says 'whether we live or die, we are the Lord's' (Rom 14:8).","refs":["Rom 2:7","Rom 14:8"],"target":"Immortality from Rom 2:7"},{"claim":"John 6:50-51 is metaphor; literal 'not die' means literal flesh-eating","detail":"If 'will not die' in John 6:50-51 is literal, then eating Jesus' flesh must be too. The passage is loaded with metaphors: Jesus is bread because he satisfies the soul's hunger; eating implies intimacy, as in Rev 3:20. The Christian life is like dinner dates with Jesus.","refs":["John 6:50-51","Rev 3:20"],"target":"Immortality from John 6:50-51"},{"claim":"Lazarus died again, so 'never die' cannot mean no physical death","detail":"Lazarus believed in Jesus yet died; Jesus raised him, and he later died again, which is why no one has met him in 2024. He will rise to meet Jesus in the clouds (1 Thess 4:16-17). So John 11:25-26 cannot mean believers escape physical death.","refs":["John 11:25-26","1 Thess 4:16-17"],"target":"Immortality from John 11:25-26"},{"claim":"Jesus foretold Peter's death, so believers can die","detail":"If Jesus promised immortality on earth, why would he foretell the death of Peter, who certainly believed in him (John 21:18-19)? The prediction indicated the kind of death by which Peter would glorify God.","refs":["John 21:18-19"],"target":"Immortality on earth for believers"},{"claim":"John admits Jesus never said John would not die","detail":"If believing in Jesus cancelled physical death, why would the Gospel writer clarify that Jesus never said John would not die (John 21:22-23)?","refs":["John 21:22-23"],"target":"Immortality on earth for believers"},{"claim":"Matthew 6:27 assumes all will die if Jesus delays","detail":"'Can any one of you by worrying add a single hour to your life?' (Matt 6:27). By saying this Jesus showed he knew all would eventually die should his return be delayed.","refs":["Matt 6:27"],"target":"Immortality now teaching"}],"questions":[{"q":"If John 11:26 means no physical death, should believers stop switching off their lights at night because of John 8:12?","answer":"Obviously not; they instinctively read light and thirst spiritually, so they must read 'never die' the same way."},{"q":"Why this double standard only with John 11:26?","answer":"There should be consistency in Bible interpretation; it is a double standard."},{"q":"Will we eat the flesh of Jesus literally?","answer":"No; the passage is metaphorical, so 'not die' in John 6:50-51 is not literal either."},{"q":"Why have we not met the alive-again Lazarus in 2024?","answer":"Because he died again and was buried; he will rise at Christ's coming (1 Thess 4:16-17)."},{"q":"Why would Jesus foretell Peter's death and John clarify he never promised John would not die?","answer":"Because believing in Jesus does not cancel physical death."}],"criticisms":[{"of":"'Immortality on Earth' cult pastors (anonymised)","quote":"Believe in Jesus and you won't die.","critique":"They read John 11:26 literally while reading John 8:12 and 4:14 spiritually, a double standard and inconsistent interpretation."},{"of":"'no physical-death for Jesus-believers' teachers (anonymised)","quote":"","critique":"They assign Heb 2:14-15, Rom 2:7 and John 6:50-51 meanings their authors never intended."}],"illustrations":[{"title":"Don't switch off your lights","story":"If 'never die' were literal, John 8:12 would mean believers should never sleep in the dark.","point":"Consistency in interpretation exposes the double standard."},{"title":"Dinner dates with Jesus","story":"The eating imagery of John 6 and Rev 3:20 is like going for dinner dates with Jesus.","point":"Eating language means intimate fellowship, not literal consumption."},{"title":"The alive-again Lazarus in 2024","story":"If physical death were cancelled for believers, we would have met the resurrected Lazarus by June 2024.","point":"Lazarus, a believer, died again."}],"keyVerses":[{"ref":"John 8:12","text":"whoever follows me will never walk in darkness","use":"Read spiritually; so should John 11:26."},{"ref":"John 4:14","text":"will never thirst","use":"Spiritual thirst, consistency test."},{"ref":"Heb 9:27","text":"people are destined to die once","use":"Hebrews affirms appointed death."},{"ref":"Heb 12:4","text":"not resisted to the point of shedding your blood","use":"Hebrews envisions martyrdom."},{"ref":"Rom 2:7","text":"seek glory, honour and immortality","use":"Misused; Paul did not teach believers need not die."},{"ref":"John 6:50-51","text":"one may eat of it and not die","use":"Metaphorical passage."},{"ref":"John 21:18-19","text":"the kind of death by which Peter would glorify God","use":"Jesus foretold a believer's death."},{"ref":"Matt 6:27","text":"add a single hour to your life","use":"Jesus assumed all would die."}],"flow":["Literal 'never die' clashes with spiritual light and thirst","Hebrews frees from fear, yet affirms death","Romans 2:7 read against Romans 14:8","John 6 metaphors cannot be selectively literal","Lazarus, a believer, died again","Peter's death foretold; John not promised immunity","All die if Jesus' return is delayed"]},{"num":33,"section":"Hyper-Supernaturalism","title":"My Response to What an Immortality Now Chennai Pastor Said When a Young Believer from His Own Church Died","summary":"The author responds to the 2021 death of a prominent young believer in a Chennai 'immortality now' church. Instead of repenting, the senior pastor explained the death using Mark 12:26-27 (God of the living) and Eph 3:14-16 (one family in heaven and earth) and expounded Matt 10:8 without praying for the young man's resurrection; the author calls this wicked convenience and a cunning switch to the traditional view. He describes how he would have handled the funeral: praying for resurrection if it were God's will, sharing how his unborn daughter's heartbeat was restored in 2007, then citing Acts 13:36 and Matt 14:6-12. He catalogues biblical warnings against empty words (Eph 5:6; 1 Tim 1:3-6; 6:4-5; 6:20-21), alleges a profit motive (1 Tim 6:10; 2 Pet 2:3), urges believers not to attend such churches (2 John 10-11), cites Rom 14:8-9 as the plainest refutation, and points to the pastor's spectacles and an Rs 15 lakh air-conditioning appeal as signs of inconsistency.","thesis":"A pastor who teaches immortality now yet comforts mourners with traditional teaching when his own member dies exposes his doctrine as empty, deceptive talk that must be repented of and avoided.","outlines":[{"acronym":"Four Warnings Against Empty Words","items":[{"letter":"1","label":"Ephesians 5:6","point":"Let no one deceive you with empty words; God's wrath comes because of these things.","refs":["Eph 5:6"]},{"letter":"2","label":"1 Timothy 1:3-6","point":"False teachers are marked by meaningless talk and vain discussion.","refs":["1 Tim 1:3-6"]},{"letter":"3","label":"1 Timothy 6:4-5","point":"Doctrinal novelty incompatible with sound teaching comes from conceited people seeking profit; 'quarrels about words'.","refs":["1 Tim 6:4-5"]},{"letter":"4","label":"1 Timothy 6:20-21","point":"Avoid irreverent babble and falsely called knowledge; linked with love of money (1 Tim 6:10).","refs":["1 Tim 6:20-21","1 Tim 6:10"]}]},{"acronym":"How the Author Would Conduct the Funeral","items":[{"letter":"1","label":"Pray for resurrection","point":"Pray openly that the dead be raised if it is God's will in this case, sharing the testimony of his unborn daughter's restored heartbeat.","refs":["Matt 10:8"]},{"letter":"2","label":"Acts 13:36","point":"If not raised, say the person did God's will in his generation and has been received by Jesus.","refs":["Acts 13:36"]},{"letter":"3","label":"Matthew 14:6-12","point":"Jesus did not raise John the Baptist; he had completed his assignment. Praise God for the life.","refs":["Matt 14:6-12"]}]}],"claims":[{"claim":"This book is a watchdog bark against hell-populating teaching","detail":"Four young preachers planned an April 2020 resort event to teach that believers need not die; one wanted to be the first to live at least 200 years, believing the Bible guarantees long life. The pandemic scuttled it, but such teachings continue worldwide, and this book raises a red flag.","refs":[],"target":"Immortality now / 200-year lifespan teaching"},{"claim":"God makes no compromise with lies, even for a demonstration","detail":"The author, exasperated, prayed that God would let him join an immortality-now church and then die so its members would stop believing the teaching. God would not allow it because he makes no compromise with lies, and neither should we.","refs":[],"target":"Immortality now churches"},{"claim":"A member's death should have prompted public repentance","detail":"When a prominent young church member died in 2021, the author hoped the senior pastor would say they had been wrong to teach that believers need not die and would embrace the right teaching. Instead the pastor kept asserting that believers need not die if they choose.","refs":[],"target":"A Chennai immortality-now pastor"},{"claim":"Using Mark 12:26-27 at the funeral was wicked convenience","detail":"The pastor said that just as God called himself the God of the living though Abraham, Isaac and Jacob were dead, the dead brother is alive in God's eyes and rejoicing in God's presence. It is cunning to switch to the traditional view of dead believers after teaching believers won't die; he would have earned respect by repenting.","refs":["Mark 12:26-27","Luke 16"],"target":"A Chennai pastor's funeral explanation"},{"claim":"He quoted Matthew 10:8 but did not pray for resurrection","detail":"The pastor expounded Matt 10:8 ('raise the dead') but did not pray for the dead young man to rise during the livestream. The author says he himself would have prayed for resurrection with open acknowledgement that it depends on God's will, would have shared how God restored his unborn daughter's heartbeat in April 2007, and then, if no resurrection, would cite Acts 13:36 and Matt 14:6-12.","refs":["Matt 10:8","Acts 13:36","Matt 14:6-12"],"target":"Teaching without demonstration"},{"claim":"Citing Ephesians 3:14-16 at the funeral was cunning inconsistency","detail":"The pastor said that since the Father has one family in heaven and on earth, it does not matter whether we are alive or dead, and that the young believer was dancing in God's presence. The author asks why he does not preach to the living that it does matter, and why he continues teaching death-cancellation; as long as believers are ready to be fooled, such pastors will fool them.","refs":["Eph 3:14-16"],"target":"A Chennai pastor's funeral message"},{"claim":"Scripture warns at least four times against empty words","detail":"Eph 5:6 warns that empty words bring God's wrath. 1 Tim 1:3-6 marks false teachers by meaningless talk and vain discussion. Teaching immortality, not raising a dead member, and then saying traditional funeral words shows such teaching is empty talk. 1 Tim 6:4-5 (Phillips) calls doctrinal novelty the work of 'a conceited idiot' seeking profit, and 1 Tim 6:20-21 warns against irreverent babble.","refs":["Eph 5:6","1 Tim 1:3-6","1 Tim 6:4-5","1 Tim 6:20-21"],"target":"Immortality now teaching as empty words"},{"claim":"The pastor's teaching is a mere quarrel about words","detail":"Believers in other churches die and believers in his church die, and he says the same things at funerals as everyone else, yet continues teaching immortality on earth. That is 'quarrels about words' (1 Tim 6:4), fruitless and useless.","refs":["1 Tim 6:4"],"target":"Immortality now teaching"},{"claim":"False teachers twist Scripture for quick money and crowds","detail":"The author believes such teachers reason that building a sound church of 500 tithing people takes time, so they shortcut with ear-pleasing teachings: hyper-grace ('God looks only at Jesus') and hyper-supernaturalism ('you won't die, so no urgency to repent'). 1 Tim 6:10 and 2 Pet 2:3 show greed drives false teachers. Someone must bell the cat.","refs":["1 Tim 6:10","2 Pet 2:3","2 Tim 4:3"],"target":"Motives of hyper-grace and hyper-supernatural teachers"},{"claim":"Jesus-like preaching asks 'if you die tonight, where will you spend eternity?'","detail":"Preachers of old preached, 'Tonight if you die where will you spend eternity?' That is Jesus-like, as Luke 12:20 ('this very night your life will be demanded') and Luke 17:32 ('remember Lot's wife') show. Modern preachers avoid it for fear of losing offerings and say, 'Why bother about dying tonight when believers never die?'","refs":["Luke 12:20","Luke 17:32","2 Pet 2:3"],"target":"Modern preachers avoiding death-urgency"},{"claim":"Do not attend, volunteer at or fund false-teaching churches","detail":"2 John 10-11 says not to receive or welcome those who do not bring the teaching of Christ; the house churches of the day met in homes. Welcoming and supporting such a pastor means sharing his judgement and even landing in hell with him. The author writes so that the pastor and readers will repent and reach heaven.","refs":["2 John 10-11"],"target":"Supporting immortality now churches"},{"claim":"Romans 14:8-9 is the most direct refutation; Bible neglect fuels error","detail":"Rom 14:8 says whether we live or die we are the Lord's, and Rom 14:9 says Christ died and lived again to be Lord of both dead and living, showing believers can die even after the cross. This is obvious to any casual reader; the generation's Bible neglect lets false teachers flourish, so we must repent of Bible neglect.","refs":["Rom 14:8-9"],"target":"Immortality on earth teaching"},{"claim":"The pastor wearing glasses is hypocrisy","detail":"On 7 May 2024, at the launch of his Malayalam 'immortality now' book, the pastor explained his glasses by saying he makes God's Word, not his experience, the standard. The author calls this bluffing: if he truly believed his gospel he would not wear glasses. Jesus warned against hypocrites (Matt 23:3, 33), though the author wants him to repent rather than practise his error.","refs":["Matt 23:3","Matt 23:33"],"target":"A Chennai pastor's inconsistency"},{"claim":"Silence has allowed false teachings to mushroom","detail":"The 'prophet' who released the pastor's book is a well-known 'miracle-money' preacher, yet on 13 April 2024 the pastor appealed for Rs 15 lakh from members for church air-conditioning. Why not have the miracle-money prophet produce it instantly? The church's stony silence has let such teaching mushroom; we must speak up.","refs":[],"target":"Miracle-money and immortality preachers"}],"questions":[{"q":"How did the Chennai pastor explain the death of a young believer in his church?","answer":"From Mark 12:26-27 (God of the living) and Eph 3:14-16 (one family in heaven and earth), saying the young man is alive and dancing in God's presence."},{"q":"Why does the pastor not preach to the living that it does matter whether you are dead or alive?","answer":"Because he continues his death-cancellation teaching to fool willing believers."},{"q":"What should a pastor do if he teaches immortality on earth and a member dies?","answer":"Either give a good explanation or publicly repent of the false teaching; not offer vain talk."},{"q":"If the pastor believed his gospel, why does he wear glasses?","answer":"He is bluffing; the glasses show he does not practise what he preaches."},{"q":"Why not have the miracle-money prophet raise the Rs 15 lakh instantly?","answer":"The question exposes the inconsistency of miracle-money preachers."},{"q":"Do we need a book like this?","answer":"Not if this generation read the Bible; Rom 14:8 makes it obvious that there is no immortality on earth before Jesus returns."}],"criticisms":[{"of":"four popular young preachers in Chennai (anonymised)","quote":"If you believed in Jesus, you don't have to die!","critique":"They planned to teach this at an East Coast Road resort in April 2020; the teaching is unbiblical and cultic and spreads worldwide."},{"of":"a young preacher who wants to live 200 years (anonymised)","quote":"","critique":"He believes the Bible guarantees long life to those who take it seriously."},{"of":"a Chennai 'immortality now' senior pastor (anonymised)","quote":"The brother who died amidst us, though he is dead, is seen as being alive in God's eyes; he is rejoicing in God's presence now.","critique":"A wickedly convenient, cunning switch to the traditional view after teaching that believers need not die; he should have repented."},{"of":"the same Chennai pastor, on Matthew 10:8 (anonymised)","quote":"","critique":"He expounded 'raise the dead' at the funeral but did not pray for the young man's resurrection."},{"of":"the same Chennai pastor, on Ephesians 3:14-16 (anonymised)","quote":"It did not matter if we were alive or dead; we all belong to one big family; he is dancing in God's presence.","critique":"Another cunning switch to traditional comfort while continuing to teach death-cancellation to the living."},{"of":"the same Chennai pastor at his book launch (anonymised)","quote":"I do not make my own experience the standard; I make God's Word the standard, and it teaches immortality now and healing now.","critique":"He is bluffing; wearing glasses shows he does not practise what he preaches, like the hypocrites of Matt 23."},{"of":"a well-known 'miracle-money' prophet who released the pastor's book (anonymised)","quote":"","critique":"If miracle-money is real, why does the pastor appeal for Rs 15 lakh for church air-conditioning?"},{"of":"modern young preachers and pastors (anonymised)","quote":"Why bother about dying tonight when those who believe in Jesus will never die!","critique":"They avoid 'if you die tonight' preaching for fear of losing offerings, driven by greed (2 Pet 2:3)."}],"illustrations":[{"title":"'Lord, send death to me'","story":"The author prayed in exasperation that he might join an immortality-now church and die so its members would abandon the teaching.","point":"God makes no compromise with lies, and neither should we."},{"title":"His unborn daughter's restored heartbeat","story":"In April 2007 doctors found no heartbeat and advised abortion; after prayer, a second scan before Good Friday service found the heartbeat restored, and she was born healthy in November 2007.","point":"God can raise the dead when it is his will, so the author would pray for resurrection at the funeral."},{"title":"'Tonight if you die'","story":"Evangelists of old preached, 'Tonight if you die where will you spend your eternity?'","point":"This Jesus-like urgency is abandoned by modern preachers for financial reasons."},{"title":"The glasses at the book launch","story":"At a May 2024 book release the pastor explained his glasses by saying God's Word, not his experience, is the standard.","point":"He does not practise what he preaches."},{"title":"The Rs 15 lakh air-conditioner appeal","story":"In April 2024 the pastor asked members for Rs 15 lakh for centralised AC though his book's releaser is a miracle-money prophet.","point":"Exposes inconsistency; silence has let such teachings mushroom."},{"title":"Belling the cat","story":"Someone must bell the cat by red-flagging these teachers.","point":"The author writes to speak up where others are silent."}],"keyVerses":[{"ref":"Mark 12:26-27","text":"He is not the God of the dead, but of the living","use":"Misused by the pastor to explain a death."},{"ref":"Matt 10:8","text":"raise the dead","use":"The pastor expounded but did not practise it."},{"ref":"Acts 13:36","text":"after David had done the will of God in his own generation, he died","use":"Funeral comfort: finished assignment."},{"ref":"Matt 14:6-12","text":"John the Baptist's death reported to Jesus","use":"Jesus did not raise John; his assignment was complete."},{"ref":"Eph 5:6","text":"Let no one deceive you with empty words","use":"Warning against empty teaching."},{"ref":"1 Tim 6:4-5","text":"quarrels about words... hope to make some profit","use":"False teaching linked with profit."},{"ref":"2 Pet 2:3","text":"Those false teachers only want your money","use":"Greed motive."},{"ref":"2 John 10-11","text":"do not take them into your house","use":"Do not attend or support such churches."},{"ref":"Rom 14:9","text":"Lord both of the dead and of the living","use":"Believers die even after the cross."}],"flow":["Immortality-now conference planned; book barks as watchdog","Young believer dies in an immortality-now church","Pastor cites Mark 12 and Eph 3 instead of repenting","Author's model funeral: pray, then Acts 13:36","Four biblical warnings against empty words","Greed motive alleged; avoid such churches","Rom 14:8-9 refutes; Bible neglect fuels error","Glasses and AC appeal show inconsistency"]},{"num":34,"section":"Hyper-Supernaturalism","title":"Can We Command Disease to Go? Can We Command God in Prayer?","summary":"Opening with the 2009 death of a caver trapped in Utah's Nutty Putty cave despite earnest prayers, the author challenges hyper-supernatural teaching that we must command disease to go and even command God ('I command', 'I decree'), which he associates with Dominion Theology. He argues that Scripture by teaching and example requires asking according to God's will (Jas 4:13-15; Matt 26:39; Rom 1:9-10; 15:31-32; Col 4:12; Heb 2:4; Luke 23:8) and that God heals in three ways: instantly, during the journey, or in eternity. He answers proof-texts: Matt 10:8, the mountain-moving and 'ask anything' sayings (read through John 14:13; 15:16; 1 John 5:14 as the whole counsel), James 5:16 and the KJV of Isa 45:11. He warns against praying for things contrary to Scripture, since God may grant them in wrath, presents God's-will-submitting examples, develops a 'perhaps' theology from Zeph 2:3 and others, and rejects the 'little gods' teaching from Ps 82:6, John 10:34 and Exod 4:16; 7:1.","thesis":"Healing and miracles happen only according to God's sovereign will and timing, so believers must pray in submission rather than command disease or God.","outlines":[{"acronym":"Three Ways God Heals","items":[{"letter":"1","label":"Instantly","point":"The lame man was healed immediately (Acts 3:6-7), yet James was beheaded despite likely prayers (Acts 12:2); instant healing happens if it is God's will.","refs":["Acts 3:6-7","Acts 12:2"]},{"letter":"2","label":"In the Journey","point":"The ten lepers were cleansed as they went (Luke 17:12-14); God works in different time-frames.","refs":["Luke 17:12-14"]},{"letter":"3","label":"In Eternity","point":"Total redemption of our bodies awaits Christ's return (Rom 8:21-25; Phil 3:20-21); some diseases are healed only in eternity.","refs":["Rom 8:21-25","Phil 3:20-21"]}]},{"acronym":"John's Three Occasions on Asking in Prayer","items":[{"letter":"1","label":"John 14:13","point":"Asking in Jesus' name means with his permission, not violating Scripture, for the Father's glory, receiving what he wills when he chooses.","refs":["John 14:13"]},{"letter":"2","label":"John 15:16","point":"Adds the condition of being a fruit-bearing believer; still asking in his name according to his will.","refs":["John 15:16"]},{"letter":"3","label":"1 John 5:14","point":"Plainly states God hears if we ask according to his will.","refs":["1 John 5:14"]}]},{"acronym":"The Four That Jesus Hit (praying God's will)","items":[{"letter":"1","label":"Model prayer","point":"Your will be done on earth as in heaven.","refs":["Matt 6:10"]},{"letter":"2","label":"Gethsemane first prayer","point":"Not as I will, but as you will.","refs":["Matt 26:39"]},{"letter":"3","label":"Gethsemane second prayer","point":"May your will be done.","refs":["Matt 26:42"]},{"letter":"4","label":"Gethsemane third prayer","point":"Saying the same thing again.","refs":["Matt 26:44"]}]},{"acronym":"God's-Will-Saluting Characters","items":[{"letter":"1","label":"David","point":"Worshipped after his child died and his request was refused.","refs":["2 Sam 12:15-20"]},{"letter":"2","label":"Shadrach, Meshach and Abednego","point":"'But if not', they would still not bow.","refs":["Dan 3:16-18"]},{"letter":"3","label":"Esther","point":"'If I perish, I perish.'","refs":["Esth 4:15-16"]},{"letter":"4","label":"Habakkuk","point":"Rejoiced in the Lord despite agricultural disaster.","refs":["Hab 3:17-18"]}]},{"acronym":"'Perhaps' Theology","items":[{"letter":"1","label":"Zephaniah","point":"'Perhaps you will be sheltered on the day of the Lord's anger.'","refs":["Zeph 2:3"]},{"letter":"2","label":"Jonathan","point":"'Perhaps the Lord will act on our behalf.'","refs":["1 Sam 14:6"]},{"letter":"3","label":"King Zedekiah","point":"'Perhaps the Lord will perform wonders for us.'","refs":["Jer 21:2"]},{"letter":"4","label":"Amos","point":"'Perhaps the Lord God Almighty will have mercy.'","refs":["Amos 5:15"]},{"letter":"5","label":"Peter to Simon","point":"'Pray God if perhaps the thought of your heart may be forgiven.'","refs":["Acts 8:22"]}]}],"claims":[{"claim":"Hyper-supernatural leaders wrongly teach commanding disease and even God","detail":"Hyper-supernaturalism leaders say we must command disease to go, and some say we must command God to do what we want at that time, using phrases like 'I command' and 'I decree'; the author calls this Dominion Theology. Scripture by direct teaching and example says we must ask according to God's will.","refs":[],"target":"Commanding disease / decreeing"},{"claim":"James and Jesus teach submitting plans and prayers to God's will","detail":"James 4:13-15 says we should say, 'If it is the Lord's will, we will live and do this or that.' Jesus in Gethsemane was the premier example: 'Not as I will, but as you will' (Matt 26:39).","refs":["Jas 4:13-15","Matt 26:39"],"target":"Prayer without submission"},{"claim":"Paul submitted even church visits to God's will","detail":"Paul, who told us to follow him as he followed Christ (1 Cor 11:1), prayed to visit Rome 'by God's will' (Rom 1:9-10) and repeated this in Rom 15:31-32. Even simple travel plans were submitted to God's will.","refs":["1 Cor 11:1","Rom 1:9-10","Rom 15:31-32"],"target":"Prayer without submission"},{"claim":"Epaphras prayed within all the will of God","detail":"Paul commended Epaphras for struggling in prayer that believers would stand mature and fully assured in all the will of God (Col 4:12). He wrestled for others but never against God's will, unlike believers influenced by hyper-supernaturalism.","refs":["Col 4:12"],"target":"Wrestling against God's will in prayer"},{"claim":"Hebrews 2:4: miracles happen according to God's will","detail":"Hebrews 2:4 says God bore witness with signs and miracles and gifts of the Spirit distributed according to his will; the NLT says 'whenever he chose'. Miracles do not happen at our whims or command.","refs":["Heb 2:4"],"target":"Miracles on command"},{"claim":"Jesus refused Herod's demand for a miracle","detail":"Herod hoped to see Jesus perform a miracle (Luke 23:8), but Jesus did none, because he does not do miracles at our whims, timetable or demands, only when it is his will.","refs":["Luke 23:8"],"target":"Miracles on demand"},{"claim":"God heals in three ways: instantly, on the journey, or in eternity","detail":"God heals instantly (Acts 3:6-7), though James was beheaded despite likely prayer (Acts 12:2); during the journey, as with the ten lepers (Luke 17:12-14); and in eternity, when our bodies are redeemed at Christ's return (Rom 8:21-25; Phil 3:20-21). So 'in Jesus' name' means in his authority and his timing.","refs":["Acts 3:6-7","Acts 12:2","Luke 17:12-14","Rom 8:21-25","Phil 3:20-21"],"target":"Healing must always be instant"},{"claim":"Matthew 10:8 did not envision a disease-free, death-free life","detail":"Jesus commanded disciples to heal the sick and raise the dead (Matt 10:8), but in the same sermon he said not to fear those who kill the body (Matt 10:28), conceding persecution-death. His point: pray for healing and resurrection, but know disease may remain and death may come; one day your body will live disease-free.","refs":["Matt 10:8","Matt 10:28"],"target":"Matt 10:8 as guaranteed healing"},{"claim":"Mountain-moving promises must be read with the whole counsel","detail":"Hyper-supernaturalists cite Matt 21:21-22, 17:20, 7:7 and 18:19 for 'name it and claim it'. But Jesus pronounced woe on leaders who neglected the whole counsel (Matt 23:23), and Paul declared the whole counsel of God (Acts 20:27). John, writing later as the senior apostle, clarified these apparently controversial statements.","refs":["Matt 21:21-22","Matt 17:20","Matt 7:7","Matt 18:19","Matt 23:23","Acts 20:27"],"target":"Name it and claim it"},{"claim":"Asking in Jesus' name means asking with his permission","detail":"John 14:13 means God will do what is asked in Jesus' name for the Father's glory; 'in my name' means with Jesus' permission, not violating Scripture, understanding he will give what he wills when he chooses. Just as the author's son would never ask him for drugs or porn, and would sign off a request for an iPhone with 'see your convenience', we ask only what Jesus approves and say 'not my will but yours'.","refs":["John 14:13"],"target":"'Ask anything' as blank cheque"},{"claim":"John 15:16 adds fruitfulness as a condition","detail":"John 15:16 says Jesus chose us to bear lasting fruit so that whatever we ask in his name the Father will give. It does not say whatever a fruitful believer asks God will give, but be fruitful and ask in his name with his permission.","refs":["John 15:16"],"target":"'Ask anything' as blank cheque"},{"claim":"1 John 5:14 plainly says God answers according to his will","detail":"1 John 5:14 says if we ask anything according to his will he hears us. This blows away doubts about John 14:13 and 15:16. Jesus prayed 'your will be done' four times (Matt 6:10; 26:39, 42, 44), hitting a 'four' in cricket terms. God answers prayer only according to his sovereign will.","refs":["1 John 5:14","Matt 6:10","Matt 26:39","Matt 26:42","Matt 26:44","Acts 20:27"],"target":"Name it and claim it"},{"claim":"James 5:16 teaches praying, not commanding, and not always healing","detail":"Some use James 5:1
