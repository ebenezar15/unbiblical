r must rehearse identification with Jesus' death, burial and resurrection, saying his old self is buried and he is spiritually risen, to overcome sinful habits.","refs":["1 Cor 15:17","Rom 6:3-4"],"target":"Victory over sin apart from union with Christ"},{"claim":"Paul repeatedly assumes believers die in 1 Corinthians 15","detail":"Paul speaks of those 'fallen asleep in Christ' (v. 18), Christ as firstfruits of the dead (v. 20), all dying in Adam (v. 22), facing death daily (vv. 30-32) and sown seed dying (v. 36), five times assuming believer deaths before discussing immortality. Death was common in the early church, and Paul did not believe in immortality on earth.","refs":["1 Cor 15:18","1 Cor 15:20","1 Cor 15:22","1 Cor 15:32","1 Cor 15:36"],"target":"Paul taught immortality on earth"},{"claim":"Dead believers rise only at Christ's coming","detail":"Verse 23 says Christ is the firstfruits and believers rise 'at his coming'. John 5:29, 1 Thess 4:16-17 and Dan 12:2 likewise place the resurrection at the end. Instead of saying believers will not die, the Bible says that though they die, they will be raised.","refs":["1 Cor 15:23","John 5:29","1 Thess 4:16-17","Dan 12:2"],"target":"Resurrection/immortality before the Second Coming"},{"claim":"Heaven and hell are the only places with no death","detail":"After Christ returns he reigns and his enemies are subdued (1 Cor 15:24-25; Rev 20:9-10). The last enemy, death, is defeated in the New Heaven and Earth (Rev 21:4). People in hell will not die but be tormented forever (Rev 20:10), and those in heaven will praise God forever; so death will continue on this earth until Jesus returns.","refs":["1 Cor 15:24-26","Rev 20:9-10","Rev 21:4"],"target":"Death defeated on this present earth"},{"claim":"Baptism for the dead shows belief in resurrection, not post-mortem salvation","detail":"Some ignorant people in Corinth baptised the dead hoping to save them for heaven. Their practice was wrong because there is no chance of salvation after death (Heb 9:27), but their belief in the resurrection was right, which was Paul's point in 1 Cor 15:29.","refs":["1 Cor 15:29","Heb 9:27"],"target":"Salvation after death"},{"claim":"The 'beasts at Ephesus' may be false teachers","detail":"In 1 Cor 15:30-32 Paul faced death daily, fighting 'beasts at Ephesus', likely false teachers, since he habitually compared them to animals (Phil 3:2). Without resurrection he would only eat and drink; because there is resurrection, he chose risky ministry.","refs":["1 Cor 15:30-32","Phil 3:2"],"target":"A risk-free, comfortable faith"},{"claim":"What you believe about resurrection shapes your behaviour","detail":"Paul warns against close association with resurrection-deniers (1 Cor 15:33-34) because their belief that death ends existence, with no resurrection or hell, led them to drunken indulgence.","refs":["1 Cor 15:32-34"],"target":"Belief has no effect on conduct"},{"claim":"Paul's word pictures show bodies decline and die before resurrection","detail":"Paul calls the present body sown in dishonour and weakness, images of fading beauty and failing health, until it is raised imperishable (1 Cor 15:42-43). Elsewhere he says our outer nature is wasting away (2 Cor 4:16) and our tent will be taken down (2 Cor 5:1).","refs":["1 Cor 15:42-43","2 Cor 4:16","2 Cor 5:1"],"target":"Bodies that never decline"},{"claim":"Immortality-on-earth teachers twist the latter half of the chapter","detail":"They ignore the five references to believer deaths and latch onto the end of 1 Cor 15, taking the text out of context. This is hell-populating false teaching because, as 1 Cor 15:32-34 warns, wrong beliefs about death and resurrection lead to sinful behaviour that, unrepented, leads to hell.","refs":["1 Cor 15:32-34"],"target":"Selective use of 1 Corinthians 15"},{"claim":"The 'last trumpet' is the Second Coming, not a new generation's preaching","detail":"1 Cor 15:50-54 says believers alive at the last trumpet will be changed, which happens at Christ's coming (1 Thess 4:16-17; 1 Cor 15:23). Cult pastors claim the trumpet is a new generation's preaching that we can be immortal now, quoting an irrelevant Old Testament verse; but the dead have not been raised by their preaching. All the dead will be raised and judged at the Great White Throne (Rev 20:13-15), even those lost at sea, while those in Christ receive immortal bodies (Phil 3:20-21) after Christ's noisy public return (Rev 19:6).","refs":["1 Cor 15:50-54","1 Cor 15:52","1 Thess 4:16-17","Rev 20:13-15","Phil 3:20-21","Rev 19:6","Rom 8:1"],"target":"The trumpet as a present-day preaching movement"},{"claim":"Jesus will return without waiting for an immortal generation","detail":"Readers must choose between cult pastors who say Jesus will never return unless a generation arises that believes it will not die physically, and the plain teaching that Jesus will return and only then usher in immortality.","refs":["1 Thess 4:16-17"],"target":"Christ's return conditioned on an immortal generation"},{"claim":"Death is swallowed up at the trumpet; sin gives death its sting","detail":"After the trumpet, death is swallowed up and no longer wins (1 Cor 15:54-55); there is no death in heaven or hell. Verse 56 means death came through Adam's sin, which we repeat, and the law empowers sin when people try to obey without relationship with Christ (Rom 5:20; 7:7-11). So life without Christ heads to a hopeless grave and hell and to deepening lawlessness.","refs":["1 Cor 15:54-56","1 Cor 15:44-49","Rom 5:20","Rom 7:7-11"],"target":"Death without reference to sin and law"},{"claim":"Through relationship with Christ we have victory; fight false teachers","detail":"Verse 57 turns from despair: through a daily relationship with Jesus we gain victory over sin and power to obey the law. Verse 58 calls believers to be steadfast, abounding in the Lord's work, which for Paul included risking his life and fighting beast-like false teachers; this book is the author's way of doing so.","refs":["1 Cor 15:57-58","1 Cor 15:30-32"],"target":"Passivity toward false teaching"}],"questions":[{"q":"Are we making the 'last enemy' a friend if we expect to die should Jesus' coming tarry?","answer":"No; the whole of 1 Corinthians 15 assumes believers will die and places immortality at the Second Coming."},{"q":"Why is Paul upset as he writes 1 Corinthians 15?","answer":"Because some in Corinth claimed there is no resurrection of the dead."},{"q":"How is death swallowed up?","answer":"After the trumpet at the Second Coming, death no longer wins over anyone; there is no death in heaven or in hell."},{"q":"What choice will you make?","answer":"Either believe cultic pastors who say Jesus will not return until a generation believes it will not die, or the plain teaching that Jesus returns and then ushers in immortality."}],"criticisms":[{"of":"'Immortality on Earth' cult preachers and pastors","quote":"the last enemy to be destroyed is death","critique":"They proof-text 1 Cor 15:26 to say believers need not die and that expecting death befriends an enemy, ignoring the chapter's context."},{"of":"false teachers who teach immortality on earth","quote":"","critique":"They selectively latch onto the latter half of 1 Cor 15, twisting Scripture into hell-populating teaching that leads to indulgent behaviour."},{"of":"cult pastors who reinterpret the trumpet of 1 Cor 15:52","quote":"unless a generation rises up which believes that we will be immortal and won't die a physical death, JESUS WILL NEVER RETURN!","critique":"The trumpet is the Second Coming at which the dead are raised; the dead have not risen through their preaching, and they quote an irrelevant Old Testament verse."}],"illustrations":[{"title":"Malaysian Airlines MH370 and a burial at sea","story":"Even those lost at sea, like MH370's passengers or a terrorist leader buried at sea, will be raised and judged (Rev 20:13).","point":"Every dead person will be resurrected at the final judgment."},{"title":"Philippian 'dogs'","story":"Paul called false teachers in Philippi 'dogs' (Phil 3:2).","point":"Paul habitually compared false teachers to animals, so the 'beasts at Ephesus' may be false teachers."}],"keyVerses":[{"ref":"1 Cor 15:26","text":"The last enemy to be destroyed is death","use":"Proof-text of immortality preachers; read in context, death is destroyed at Christ's coming."},{"ref":"1 Cor 15:18","text":"those who have fallen asleep in Christ","use":"First of five times Paul assumes believers die."},{"ref":"1 Cor 15:22","text":"as in Adam all die, so in Christ all will be made alive","use":"All believers die if Jesus tarries, and will rise."},{"ref":"1 Cor 15:23","text":"Christ the firstfruits; then at his coming those who belong to him","use":"Resurrection follows the Second Coming."},{"ref":"1 Cor 15:52","text":"the trumpet will sound, the dead will be raised imperishable","use":"The trumpet is the Second Coming, not a new generation's preaching."},{"ref":"1 Cor 15:56","text":"The sting of death is sin, and the power of sin is the law","use":"Life without Christ heads to the grave and deepening lawlessness."},{"ref":"1 Cor 15:58","text":"be steadfast, immovable, always abounding in the work of the Lord","use":"Call to labour, including fighting false teachers."},{"ref":"Heb 9:27","text":"destined to die once, and after that to face judgment","use":"No salvation after death; baptism for the dead is wrong."}],"flow":["Immortality preachers proof-text 1 Cor 15:26","Read the whole chapter in context","Paul assumes believers die five times","Resurrection follows the Second Coming","Death fully defeated only in heaven and hell","Trumpet means Second Coming, not new preaching","Sin and law give death its sting","Be steadfast and fight false teachers"]},{"num":25,"section":"Hyper-Supernaturalism","title":"Getting Carried Away: Virat Kohli and Modern-Day Hyper-Supernaturalism Affected Believers","summary":"The author uses Virat Kohli's dismissal in the 2018 Edgbaston Test, playing across the line when patience would have won, and India's narrow 31-run loss, to illustrate believers getting 'carried away' by strange teachings (Heb 13:9). Paul confronted the Corinthians' 'over-realized eschatology', claiming now what belongs to the age to come (1 Cor 4:8), seen in their refusal of sex within marriage because there is no sex in heaven (1 Cor 7:1-5). A modern example is a Chennai pastor teaching from 1 Cor 15:26 that Jesus will not return until a generation becomes immortal, contradicting Heb 9:27 and the trumpet of 1 Cor 15:52 and 1 Thess 4:16-17. The teaching was made famous by a South African preacher who himself died. The author argues it is popular because people avoid the question 'Where will you go if you died tonight?', and that such destructive heresy (2 Pet 2:1) can cost eternal life.","thesis":"Immortality-now teaching is an over-realized eschatology, a getting 'carried away' that claims now what Scripture reserves for Christ's return, with eternal loss at stake.","outline":null,"claims":[{"claim":"Believers must not be carried away by strange teachings","detail":"Like Kohli playing across the line when patience would have won the Test, believers can get carried away. Hebrews 13:9 warns against being carried away by all kinds of strange teachings, and some popular teachings today fall into that category.","refs":["Heb 13:9"],"target":"Excitement-driven doctrine"},{"claim":"The Corinthians had an over-realized eschatology","detail":"Paul's ironic 'Already you have all you want... you have begun to reign' (1 Cor 4:8) shows the Corinthians claimed now the blessings reserved for heaven. Paul told them to judge nothing before the time, until the Lord comes (1 Cor 4:5). Going overboard in salvation-affecting doctrine can land people in hell.","refs":["1 Cor 4:8","1 Cor 4:5"],"target":"Claiming future blessings now"},{"claim":"Over-realized eschatology led Corinthians to refuse sex in marriage","detail":"Believing they were already like angels in heaven where there is no sex, Corinthians said 'it is good for a man not to touch a woman' (1 Cor 7:1), and Paul had to urge married couples to come together (1 Cor 7:2-5). A noted New Testament scholar explains they thought themselves spiritual, needing neither sex now nor a body in the future.","refs":["1 Cor 7:1-5","1 Cor 15:1-58"],"target":"Spiritualising away bodily life"},{"claim":"A Chennai pastor's 'immortal generation' teaching is heresy","detail":"A Chennai pastor teaches from 1 Cor 15:26 that Jesus will never return until a generation beats death and becomes immortal. The author calls this heresy, citing Heb 9:27 and noting that the same chapter places the change to immortal bodies at the last trumpet (1 Cor 15:52), which 1 Thess 4:16-17 identifies with Christ's return; living and resurrected believers receive immortal bodies together then, not before.","refs":["1 Cor 15:26","Heb 9:27","1 Cor 15:52","1 Thess 4:16-17","1 Cor 15:54-56"],"target":"Immortality must precede Christ's return"},{"claim":"The South African originator died after preaching no-death","detail":"The teaching was made famous by a South African preacher who died after preaching that believers will not die. A preacher friend said only if such teachers die will their followers get sense; the author does not wish that, and doubts they would repent anyway, so he writes to stem the tide of new followers.","refs":[],"target":"Immortality-now teaching"},{"claim":"Such teachings are popular because people avoid facing death","detail":"This generation dislikes the unpopular, biblical question 'Where will you go if you died tonight?' (Luke 12:20; 17:32), so cult teachers effectively say 'Why worry about death? You will not die at all!'","refs":["Luke 12:20","Luke 17:32"],"target":"Avoidance of death and judgment"},{"claim":"Going overboard means loss of eternal life","detail":"As Kohli's rashness cost India the Test, going overboard in doctrine means loss of eternal life and hell; 2 Pet 2:1 warns of destructive heresies, and this is one of them. Believers should escape strange teachings and embrace sound doctrine.","refs":["2 Pet 2:1"],"target":"Doctrinal excess"}],"questions":[{"q":"Why did Kohli play across the line when India needed him at the crease?","answer":"He possibly got carried away by Hardik Pandya's boundaries and tried to finish quickly, when 150 overs remained and patience would have won."},{"q":"Will Jesus return only after a generation becomes immortal?","answer":"No; death is defeated and believers become immortal only when Jesus returns at the trumpet (1 Cor 15:52; 1 Thess 4:16-17)."},{"q":"Why are such teachings popular in the first place?","answer":"Because this generation avoids the unpopular question 'Where will you go if you died tonight?', and cult teachers say you will not die at all."}],"criticisms":[{"of":"a Chennai-based pastor","quote":"until a generation of believers beats death here and now... only then Jesus will come back to the earth","critique":"A heresy contradicting Heb 9:27 and 1 Cor 15:52, which place immortality at Christ's return."},{"of":"a South African preacher who made the teaching famous","quote":"You will not die on this earth here and now, if you believe in Jesus!","critique":"He died after preaching this very thing."},{"of":"followers of immortality-now teachers (via a preacher friend's remark)","quote":"Only if the guys who teach these bizarre things die, only then their senseless followers will get some sense!","critique":"The author does not wish their deaths but doubts they would repent; he writes to stop others from following."},{"of":"the Corinthian believers (over-realized eschatology)","quote":"It is good for a man not to have sexual relations with a woman","critique":"Thinking themselves already like angels, they refused sex inside marriage; Paul corrected them."}],"illustrations":[{"title":"Kohli plays across the line at Edgbaston 2018","story":"With India within reach of victory in the first Test of 2018, Kohli, perhaps carried away by Hardik Pandya's boundaries, played across the line to a Ben Stokes in-cutter and was out lbw; India lost by 31 runs.","point":"Getting carried away leads to loss; believers must not be carried away by strange teachings (Heb 13:9)."},{"title":"No ODI or T20 chase","story":"It was Day 4 of a 5-day Test with potentially 150 overs left to score about 50 runs; there was no need to hurry.","point":"There was no compulsion to play across the line, just as there is no need to grab now what is reserved for later."},{"title":"Hardik switches off","story":"After Kohli's dismissal, Hardik Pandya stopped attacking and India fell 31 runs short.","point":"Other players share responsibility; a whole team's approach matters."},{"title":"Corinthians refusing marital sex","story":"Believing they were already in heaven-like angelic existence, some Corinthians abstained from sex even in marriage.","point":"Over-realized eschatology produces error; Paul told them to wait until the Lord comes."}],"keyVerses":[{"ref":"Heb 13:9","text":"Do not be carried away by all kinds of strange teachings","use":"Warning against excess like immortality-now teaching."},{"ref":"1 Cor 4:8","text":"Already you have all you want! Already you have become rich! You have begun to reign","use":"Paul's irony against over-realized eschatology."},{"ref":"1 Cor 7:1","text":"It is good for a man not to have sexual relations with a woman","use":"Example of over-realized eschatology."},{"ref":"1 Cor 4:5","text":"judge nothing before the appointed time; wait until the Lord comes","use":"Some things happen only on the final day."},{"ref":"Heb 9:27","text":"Man is destined to die once and after that face judgment","use":"Refutes immortality-now teaching."},{"ref":"1 Cor 15:52","text":"the trumpet will sound, the dead will be raised imperishable, and the mortal will put on immortality","use":"Immortality comes at Christ's return."},{"ref":"2 Pet 2:1","text":"destructive heresies","use":"Immortality-now teaching is one of them."}],"flow":["Kohli got carried away and India lost","Hebrews warns against being carried away","Corinth had an over-realized eschatology","They even refused sex in marriage","Immortality-now is a modern over-realized eschatology","Trumpet and Heb 9:27 place immortality at return","Popular because people avoid facing death","Going overboard risks eternal loss"]},{"num":26,"section":"Hyper-Supernaturalism","title":"Does the Bible Teach Immortality on Earth?","summary":"The author asks whether John 11:25-26 ('anyone who is alive and believes in me will never die') teaches 'immortality on earth' as cult pastors from South Africa, Sri Lanka and South India teach. He answers with four points (God's Character, the list in Romans 8, Paul's words to Corinth, and the Couple of other kinds of death), arguing that only God is immortal (1 Tim 6:16) and that the Bible speaks of spiritual, physical and eternal ('second') death. Jesus' promise means believers will be raised from spiritual death and kept from eternal death (hell), which Jesus himself endured on the Cross for us. He piles up counter-examples (John the Baptist, James, Epaphroditus, the grain of wheat) and rebuts the cult's use of Heb 9:23-28, 2 Cor 5:15, Rom 6:3, Ps 110:1 and 2 Tim 4:7. He concludes that physical death will end only after the Second Coming (Rev 21:4), and that the teaching slackens holiness by removing the fear of sudden death, so that its real motive is to comfort young people in their sin.","thesis":"John 11:25-26 promises freedom from eternal death, not physical immortality before the Second Coming, because only God is immortal and believers still die until Christ returns.","outlines":[{"acronym":"C-C-C-C (four answers)","items":[{"letter":"C","label":"God's Character","point":"Only God is immortal (1 Tim 6:16); Paul, who interpreted Christ faithfully, could not have read John 11:25-26 as immortality now. We must interpret Jesus as the apostle did.","refs":["1 Tim 6:16","John 11:25-26"]},{"letter":"C","label":"The famous Chapter (Romans 8)","point":"Paul lists 'death' among the things that cannot separate believers from Christ; he would not have listed it if believers could not die.","refs":["Rom 8:38"]},{"letter":"C","label":"What Paul wrote to Corinth","point":"Paul said a 'sentence of death' hung over the apostles; a sentence is something sure to come.","refs":["1 Cor 4:9","2 Cor 1:9"]},{"letter":"C","label":"A Couple more kinds of death","point":"Besides physical death the Bible speaks of spiritual death and eternal (second) death; John 11:26 refers to these.","refs":["Gen 2:17","Luke 15:32","Rev 21:8"]}]},{"acronym":"Three kinds of death","items":[{"letter":"1","label":"Spiritual death","point":"Adam and Eve did not die physically the day they ate, but died spiritually; the prodigal was 'dead' while partying; sinners are 'dead in sin'.","refs":["Gen 2:17","Luke 15:13","Luke 15:32","Eph 2:1"]},{"letter":"2","label":"Physical death","point":"Adam lived 930 years and died; death is 'the way of all the earth' for Joshua and David.","refs":["Gen 5:5","Josh 23:14","1 Kgs 2:2"]},{"letter":"3","label":"Eternal death","point":"The 'second death', the lake of fire, which John (author of John 11) means by death.","refs":["Rev 21:8"]}]}],"claims":[{"claim":"Only God is immortal, so John 11:25-26 cannot teach immortality now","detail":"Paul wrote that God 'alone is immortal' (1 Tim 6:16), probably after knowing Jesus' words in John 11. Since only God has immortality, Jesus' words cannot mean believers escape physical death before the Second Coming. We must interpret Christ the way the apostle interpreted Christ, not according to our whims.","refs":["1 Tim 6:16","John 11:25-26","1 Cor 11:1"],"target":"Immortality now / physical death cancellation"},{"claim":"Romans 8:38 lists death among things that cannot separate us","detail":"Paul included 'death' in his list of things that cannot separate a believer who abides in Christ from Christ. If he believed physical death was cancelled, he would not have put death on the list.","refs":["Rom 8:38"],"target":"No-death-for-believers teaching"},{"claim":"Paul spoke of a 'sentence of death' hanging over the apostles","detail":"In 1 Cor 4:9 (and 2 Cor 1:9) Paul acknowledged that the apostles were like men sentenced to death. A 'sentence' implies something sure to come, so death is sure to come for a believer.","refs":["1 Cor 4:9","2 Cor 1:9"],"target":"Physical death cancellation"},{"claim":"'Never die' in John 11:26 means no eternal death","detail":"The Bible uses 'death' in three senses: spiritual, physical and eternal. John, the author of John 11, elsewhere calls hell the 'second death' (Rev 21:8). So the message of John 11:25-26 is simply that those who keep believing in Jesus are raised from spiritual death and kept from eternal death.","refs":["John 11:25-26","Rev 21:8","Gen 2:17","Eph 2:1"],"target":"Literal reading of John 11:26"},{"claim":"On the Cross Jesus endured 'second death' for us","detail":"Jesus' cry 'My God, why have you forsaken me' shows he experienced the hell of separation from his Father, and his 'I thirst' echoes the rich man in hell (Luke 16:24). He endured ultimate death so we need not go to hell (Rom 5:8-9; 1 Thess 1:10).","refs":["Matt 27:46","John 19:28","Luke 16:24","Rom 5:8-9","1 Thess 1:10","Rev 21:8"],"target":"Physical-death-cancellation reading of the atonement"},{"claim":"Jesus could have raised John the Baptist but did not","detail":"When told of John's beheading, Jesus withdrew to a solitary place instead of raising him as he raised the widow's son, Jairus' daughter and Lazarus. If death were never God's will, Jesus would have raised him; instead Jesus knew God sets a duration for each life.","refs":["Matt 14:12-13","Luke 7:11-15","Matt 9:25","John 11:43-44"],"target":"Death is never God's will"},{"claim":"James' martyrdom and Epaphroditus' near-death refute the doctrine","detail":"If death were cancelled for New Covenant believers, why did Jesus allow James to be killed (Acts 12) and why did Paul commend Epaphroditus for risking his life and almost dying (Phil 2)? A believer could never be at 'risk' of death if death were cancelled.","refs":["Acts 12:1-2","Phil 2:25-30"],"target":"No death for New Covenant believers"},{"claim":"'We died with Christ' (2 Cor 5:15; Rom 6:3) does not cancel physical death","detail":"The cult argues from Heb 9:23-28, 2 Cor 5:15 and baptism (Rom 6:3) that since we died and rose with Christ, who will never die again, believers need not die. But the writer of Hebrews called for faithfulness unto death (Heb 12:4), and Paul spoke of the sentence of death over him (2 Cor 1:9); neither believed in physical death cancellation.","refs":["Heb 9:23-28","2 Cor 5:15","Rom 6:3","Heb 12:4","2 Cor 1:9"],"target":"Inclusion in Christ's death means believers need not die"},{"claim":"Jesus' 'grain of wheat' calls disciples to be martyrdom-ready","detail":"If Jesus meant physical death cancellation in John 11, he would not have used the grain of wheat image in John 12:24 to call his disciples to be ready for martyrdom. Cancelling physical death here and now was never part of Jesus' plan.","refs":["John 12:24-25"],"target":"No-death-for-believers teaching"},{"claim":"Paul did not die because he 'gave God permission'","detail":"Some cult pastors say Paul kept beating death (storms, Malta) and only died because he chose to, saying 'I have finished the race' (2 Tim 4:7); a Chennai pastor likens this to Jesus laying down his life (John 10:18). The author calls this blasphemy that makes Paul like God; only God controls life's duration, as Hezekiah knew when he wept for an extension, and Jesus is the 'author of life' (Acts 3:15). He dares them to say 'I don't give permission, so I will never die', noting that the South African originator of the teaching died.","refs":["2 Tim 4:7","John 10:18","Isa 38:1-5","Acts 3:15","1 Tim 6:16"],"target":"Believers die only by choosing to"},{"claim":"Physical death ends only after the Second Coming (Rev 21:4)","detail":"Jesus will stop physical death one day, but only after his return on the white horse (Rev 19). Revelation 21:4's 'no more death' follows that return.","refs":["Rev 21:4","Rev 19:11"],"target":"Immortality before the Second Coming"},{"claim":"'Jesus won't return until a generation beats death' slackens holiness","detail":"A Chennai pastor says Jesus sits at the Father's right hand until the church, his body and feet, makes death his footstool, so Jesus will not return until a generation beats death. The author says this violates the four 'thief in the night' texts that Jesus can come anytime, and gives youth time to live in sin without fear of being 'left behind'. He therefore calls these 'doctrines of demons'.","refs":["Ps 110:1","1 Cor 15:25-26","Matt 24:43","1 Thess 5:2","1 Thess 5:4","Rev 16:15","1 Tim 4:1"],"target":"A generation must defeat death before Christ returns"},{"claim":"It is Jesus, not believers, who defeats the last enemy","detail":"1 Cor 15:25 says 'He' must reign until 'He' has put all enemies under his feet; it speaks of Jesus, not the church, defeating death. Romans 2:7 says God 'will give' eternal life to those who seek immortality, so immortal life is only in future eternity.","refs":["1 Cor 15:25-26","Ps 110:1","Heb 2:8","Rom 2:7"],"target":"The church defeats death"},{"claim":"Removing death removes fear of God and licenses youth to sin","detail":"The cult's agenda targets youth: if there is no death, there is no fear of sudden judgment, since after death comes only judgment and no second chance (Heb 9:27). Removing death from the equation removes the fear of God and gives license to sin; we must not share in their wicked work (2 John 10-11).","refs":["Heb 9:27","2 John 10-11"],"target":"Immortality teaching aimed at youth"},{"claim":"The real motive is to comfort people in their sin","detail":"Both the Chennai and Madurai pastors admit they may die anytime, yet keep preaching immortality 'as it is in the Word'. Since it is not in the Word, the author concludes their real reason is to comfort young people in sin, and urges them to preach like Jesus: 'Tonight your life will be demanded' (Luke 12:20) and 'Remember Lot's wife' (Luke 17:32).","refs":["Luke 12:20","Luke 17:32"],"target":"Immortality preachers' motives"},{"claim":"'Choose life' did not mean the end of physical death","detail":"A Madurai cult pastor ends immortality sermons quoting 'choose life' (Deut 30:19), but ignores Josh 23:14 and 1 Kgs 2:2, where Joshua and David call death 'the way of all the earth'. Joshua heard Moses say 'choose life', and still knew he would die physically.","refs":["Deut 30:19","Josh 23:14","1 Kgs 2:2"],"target":"Deut 30:19 as immortality proof"}],"questions":[{"q":"Does John 11:25-26 teach immortality on earth?","answer":"No. Only God is immortal (1 Tim 6:16); the passage promises resurrection from spiritual death and protection from eternal death (hell) for those who keep believing."},{"q":"What did Jesus mean by the word 'die' in John 11:26?","answer":"Eternal death, the 'second death' of Rev 21:8, which John uses elsewhere; believers in Christ will never go to hell."},{"q":"Why don't they quote verses such as Joshua 23:14 and 1 Kings 2:2?","answer":"Because those verses show that even Yahweh's followers expected death as 'the way of all the earth'; quoting 'choose life' alone is selective."},{"q":"If there is no death for believers, why did Jesus allow James to die and why was Epaphroditus at risk?","answer":"Because the apostles never believed in immortality on earth; real risk of death presupposes that death has not been cancelled."},{"q":"Did Paul die because he gave permission to God to take him?","answer":"No; only God controls the length of life (Acts 3:15). Claiming Paul had Jesus' authority to lay down his life (John 10:18) makes a man into God."},{"q":"When will physical death be cancelled?","answer":"After the Second Coming (Rev 19), when Rev 21:4's 'no more death' is fulfilled."}],"criticisms":[{"of":"Cult pastors from South Africa, Sri Lanka and South India teaching immortality on earth (anonymised)","quote":"","critique":"They misinterpret John 11:25-26 against the rest of Scripture, contradicting Paul's teaching that only God is immortal."},{"of":"A Madurai pastor (anonymised)","quote":"Since we were buried with Christ when we got water baptized (see Rom. 6:3), we will not have to die again!","critique":"He twists baptism and Christ's death to cancel physical death; he also quotes 'choose life' while ignoring Josh 23:14 and 1 Kgs 2:2."},{"of":"A Chennai pastor (anonymised)","quote":"Jesus is sitting right now at the right hand of the father. His body and legs are the church. And the church should make all enemies the footstool!","critique":"Makes Paul like Jesus in laying down his life (John 10:18), which the author calls blasphemy; reads 'He' in 1 Cor 15:25 as believers; and claims Jesus cannot return until a generation beats death, contradicting the 'thief in the night' texts."},{"of":"The South African originator of the no-death teaching (anonymised)","quote":"","critique":"He died, which the author offers as proof that the teaching is false."},{"of":"The Chennai and Madurai pastors' admission that they may die","quote":"They may die anytime but they will still preach immortality 'as it is in the Word of God'.","critique":"Since it is not in the Word, the author says their real motive is to comfort young people in their sin."}],"illustrations":[{"title":"The prodigal: life of the party, yet dead","story":"The prodigal son partied hard in 'reckless living', the 'life of the party' in today's language, yet his father called him 'dead' until he returned.","point":"Spiritual death can exist in a physically living person; 'death' in Scripture is not always physical."},{"title":"Living hell and literal hell","story":"The author tells youth that Jesus saves them from their 'living hell' (finding that you never found in sin what you entered sin to find) and from literal hell.","point":"John 11's 'never die' is about deliverance from spiritual and eternal death."},{"title":"The dare","story":"The author dares the false teachers to declare openly, 'I do not give permission for God to take my life, so I will never die.'","point":"If Jesus' coming tarries they will die regardless; only God controls life's length."},{"title":"The grain of wheat","story":"Jesus' image of a grain of wheat falling into the ground and dying (John 12:24).","point":"Pun: there is 'no grain of truth' in the no-death teaching; disciples must be martyrdom-ready."}],"keyVerses":[{"ref":"John 11:25-26","text":"anyone who is alive and believes in me will never die at all","use":"The cult's proof text, reinterpreted as freedom from eternal death."},{"ref":"1 Tim 6:16","text":"He alone is immortal","use":"Only God has immortality, so believers cannot claim it now."},{"ref":"Rom 8:38","text":"neither death nor life... will be able to separate us","use":"Paul includes death as something believers face."},{"ref":"Rev 21:8","text":"the lake that burns with fire and sulphur, which is the second death","use":"John's meaning of death is eternal death."},{"ref":"Rev 21:4","text":"death shall be no more","use":"Death ends only after the Second Coming."},{"ref":"Heb 9:27","text":"it is appointed for man to die once, and after that comes judgment","use":"No second chance after death; removing death removes fear of judgment."}],"flow":["Cult pastors claim John 11:25-26 means believers never die","Only God is immortal (1 Tim 6:16)","Paul lists death in Rom 8; apostles under death sentence","Bible has three deaths: spiritual, physical, eternal","John 11 means no eternal death; Jesus bore second death","Examples: John the Baptist, James, Epaphroditus, grain of wheat","Death ends only after Second Coming (Rev 21:4)","Teaching slackens holiness and comforts people in sin"]},{"num":27,"section":"Hyper-Supernaturalism","title":"'D' for Direct Teaching Found in the Bible Against the Immortality Cult","summary":"Responding to a much-publicised April 2020 Chennai conference on how believers need not die, the author launches a Bible study series using the acronym D-E-A-T-H to counter the 'no-death-for-believers' cult. 'D' stands for Direct teaching: he surveys Scriptures anyone could find by searching 'death' on Bible websites. These include Moses ('after my death', Deut 31:29; Ps 90:10), Joshua and David ('the way of all the earth'), God's sovereignty over death (Deut 32:39; 1 Sam 2:6), Ruth 1:17, Job's laments on life's brevity, Hebrews 9:27, and Ecclesiastes 3:11 and 8:8. From the New Testament he cites Romans 8:38-39, Romans 14:8-9, 1 Timothy 6:15-16, the 'tent' of 2 Corinthians 5:1-2, and Paul's 'departure' in 2 Timothy 4:6, which shows that 2 Timothy 1:10's immortality comes with the full gospel, including the Second Coming. He argues that 'choose life' was understood spiritually by Joshua, that there is nothing 'new' in the New Testament contradicting the Old, and that preachers should boldly warn that anyone could die anytime.","thesis":"Both Testaments directly and repeatedly teach that all people, believers included, will die unless Jesus returns first, so immortality now is unbiblical.","outlines":[{"acronym":"Direct passages surveyed","items":[{"letter":"1","label":"Moses","point":"'After my death' (Deut 31:29) and seventy or eighty years (Ps 90:10).","refs":["Deut 31:29","Ps 90:10"]},{"letter":"2","label":"Joshua","point":"'I am going the way of all the earth'; he understood 'choose life' spiritually.","refs":["Josh 23:14","Deut 30:15-19"]},{"letter":"3","label":"David","point":"'I go the way of all the earth.'","refs":["1 Kgs 2:2","1 Kgs 2:10"]},{"letter":"4","label":"Song of Moses and Hannah","point":"God alone puts to death and gives life.","refs":["Deut 32:39","1 Sam 2:6"]},{"letter":"5","label":"Ruth","point":"'Where you die, I will die... if anything but death separates you and me.'","refs":["Ruth 1:17"]},{"letter":"6","label":"Job","point":"Life is brief and its limits are fixed by God.","refs":["Job 7:6","Job 9:25-26","Job 14:1-7"]},{"letter":"7","label":"Hebrews","point":"Appointed for man to die once; it restates Job 14:1.","refs":["Heb 9:27"]},{"letter":"8","label":"Ecclesiastes","point":"Eternity is in the heart, not the body; no one has power over the day of death.","refs":["Eccl 3:11","Eccl 8:8"]},{"letter":"9","label":"Paul","point":"Romans 8:38-39, Romans 14:8-9, 1 Tim 6:15-16, the tent of 2 Cor 5:1-2, and the departure of 2 Tim 4:6.","refs":["Rom 8:38-39","Rom 14:8-9","1 Tim 6:15-16","2 Cor 5:1-2","2 Tim 4:6"]}]}],"claims":[{"claim":"You do not need a preacher; search 'death' and see for yourself","detail":"Searching the word 'death' on Bible websites lets any reader find the direct passages against immortality now. The author says readers might do a better job than he does.","refs":[],"target":"Immortality now"},{"claim":"Moses spoke matter-of-factly of 'after my death'","detail":"In Deut 31:29 Moses says 'after my death you will act corruptly'. He had no fancies of immortality and spoke of his death normally.","refs":["Deut 31:29"],"target":"Immortality now"},{"claim":"Joshua chose life yet expected death; 'life' was spiritual","detail":"Joshua heard Moses' 'choose life' (Deut 30:15-19), obeyed and entered the land, yet said 'I am going the way of all the earth' (Josh 23:14). So he understood the promised 'life' spiritually, knowing he would have eternal life but would die physically, as all have since Adam's fall, even those who lived over 900 years.","refs":["Deut 30:15-19","Josh 23:14","Gen 5:5"],"target":"Deut 30:19 as an immortality text"},{"claim":"There is nothing 'new' in the New Testament; both call to love","detail":"Against those who say 'the Old Testament says one thing, the New another; we are New Covenant ministers', the author argues that God is not confused. What he said in shadow in the Old he says directly in the New, and both call us to a love relationship, not a 'Law' relationship (Deut 30:16; 6:5 and many others).","refs":["Deut 30:16","Deut 6:5","Deut 13:3","Deut 30:6","Deut 30:20","Josh 22:5","Josh 23:11","Neh 1:5","Isa 56:6","Jer 2:2"],"target":"New Covenant ministers who set the Old Testament aside"},{"claim":"David also called death 'the way of all the earth'","detail":"Before he died (1 Kgs 2:10), David told Solomon 'I go the way of all the earth' (1 Kgs 2:2), a classic Old Testament phrase for the inevitability of death. Two outstanding leaders, Joshua and David, both use it.","refs":["1 Kgs 2:2","1 Kgs 2:10"],"target":"Immortality now"},{"claim":"God alone kills and makes alive (Deut 32:39; 1 Sam 2:6)","detail":"The Song of Moses says 'I put to death and give life'. God can let a person live a certain length of time and then take life, allow suffering and remove it. He is absolutely sovereign over when we die. Hannah echoed this: the Lord who put Samuel in her barren womb can also take away life, so none of us can think we are immortal.","refs":["Deut 32:39","1 Sam 2:6"],"target":"Believers controlling their own death"},{"claim":"Ruth 1:17 assumes death comes for all, even the godly","detail":"Ruth vowed that only death would separate her from Naomi, assuming both would die. Her husband, a Yahweh-worshipper, had died, and nothing in Ruth's theology suggested worshipping Yahweh prevents death. Faith in the living God is not a guarantee against death.","refs":["Ruth 1:17"],"target":"Faith as a guarantee against death"},{"claim":"Job teaches that life is brief and its limits fixed by God","detail":"Job 7:6, 9:25-26 and 14:1-7 use Spirit-given word pictures (a needle's thread, a runner, paper boats, eagles, a fading bloom, a passing cloud's shade) to teach that death comes to all and can come soon, and that God fixes the number of a person's months.","refs":["Job 7:6","Job 9:25-26","Job 14:1-7"],"target":"Immortality now"},{"claim":"Even 116 or 122 years is brief compared to eternity","detail":"Citing reports of the oldest living person (116) and the oldest verified person ever (122 years, 164 days), the author notes that even such lives are short compared to eternity after death.","refs":["Job 14:1"],"target":"Hope of earthly immortality"},{"claim":"Hebrews 9:27 restates Job 14:1 on the inevitability of death","detail":"'It is appointed for man to die once, and after that comes judgment' applies to all, believers and unbelievers. Just as Heb 13:4 restates the commandment against adultery in the writer's own style, Heb 9:27 restates passages like Job 14:1. So both Testaments directly teach that we cannot be immortal now.","refs":["Heb 9:27","Heb 13:4","Exod 20:14","Job 14:1"],"target":"Immortality now"},{"claim":"God put eternity in man's heart, not his body","detail":"Eccl 3:11 says God put eternity into man's heart, his soul, not his earthly body. The body dies but the soul lives forever, which the same writer confirms: 'No man has power to retain the spirit, or power over the day of death' (Eccl 8:8).","refs":["Eccl 3:11","Eccl 8:8"],"target":"Bodily immortality now"},{"claim":"Preachers must boldly say 'You could die anytime'","detail":"Bible-believing preachers should not fear to say: 'You could die anytime; your soul lives forever and will be reunited with the body on judgment day; depending on what you do with Jesus you will go to eternal heaven or eternal hell.'","refs":[],"target":"Preaching that avoids death and judgment"},{"claim":"Moses' Psalm 90 expects seventy or eighty years","detail":"Psalm 90:10, written by Moses, says we can expect seventy or eighty years and then our time is up. Throughout the Bible, unless one acts blind, life is full of trouble and we should expect to die should Jesus tarry.","refs":["Ps 90:10"],"target":"Immortality now"},{"claim":"Romans 8:38-39 and 14:8-9: 'we could die' yet belong to the Lord","detail":"Paul, who wrote 'seek immortality' (Rom 2:7), did not believe in immortality on earth, or he would not have listed death in Rom 8:38-39. Romans 14:8-9 says 'whether we live or die, we are the Lord's', and Christ is Lord of the dead and the living.","refs":["Rom 8:38-39","Rom 14:8-9","Rom 2:7"],"target":"Immortality now"},{"claim":"Claiming immortality before the Second Coming is blasphemy (1 Tim 6:15-16)","detail":"Paul says God 'alone has immortality'. To claim it for ourselves before the Second Coming is nothing short of blasphemy.","refs":["1 Tim 6:15-16"],"target":"Believers claiming immortality now"},{"claim":"Paul's 'tent' imagery makes a dent in the no-death teaching","detail":"In 2 Cor 5:1-2 Paul compares believers' bodies to tents that may be destroyed, but promises an eternal house in heaven. He means: don't worry if your body dies on earth; you will go to heaven. Believers groan to get to heaven, not to live long on earth.","refs":["2 Cor 5:1-2"],"target":"Immortality now"},{"claim":"2 Timothy 1:10's immortality comes through the full gospel, at Christ's return","detail":"The writer of 2 Tim 1:10 ('abolished death and brought immortality to light') expected to die soon: 'the time of my departure has come' (2 Tim 4:6). So immortality comes through the full gospel, which includes the Second Coming, when Jesus gives the gift of immortality to waiting believers (1 Cor 15:52-54).","refs":["2 Tim 1:10","2 Tim 4:6","1 Cor 15:52-54"],"target":"2 Tim 1:10 as proof of immortality now"}],"questions":[{"q":"Did Moses believe he was immortal?","answer":"No. He spoke plainly of 'after my death' (Deut 31:29) and wrote of seventy or eighty years (Ps 90:10)."},{"q":"Did Joshua understand 'choose life' to mean he would never die?","answer":"No. He chose life and obeyed, yet called death 'the way of all the earth'; he understood the promised life spiritually."},{"q":"When Paul wrote 'seek immortality' (Rom 2:7), what did he mean?","answer":"Not immortality now; otherwise he would not list death in Rom 8:38-39 or say 'whether we live or die' (Rom 14:8)."},{"q":"What does 2 Timothy 1:10 mean?","answer":"Immortality comes through the full gospel, which includes the Second Coming, when Jesus gives immortality to waiting believers (1 Cor 15:52-54); Paul himself expected to die (2 Tim 4:6)."}],"criticisms":[{"of":"Organisers and speakers of an April 2020 Chennai conference on believers not dying (anonymised)","quote":"If you believe in Jesus, you don't have to die - you can be immortal, here and now.","critique":"A few preachers worldwide teach this; friends asked the author to respond, which he does via a Bible study using D-E-A-T-H."},{"of":"Those who say 'the Old Testament says one thing, the New Testament another; we are New Covenant ministers' (anonymised)","quote":"Old Testament says something. New Testament says something else. We are New Testament covenant ministers.","critique":"There is nothing 'new' in the New Testament; God is not confused, and both Testaments call to a love relationship."},{"of":"Cultic false pastors who quote 2 Tim 1:10 (anonymised)","quote":"","critique":"They use 'abolished death and brought immortality to light' though its writer expected death."}],"illustrations":[{"title":"Bible websites anyone can search","story":"The author says anyone can search 'death' on Bible websites and find these passages, perhaps doing a better job than he did.","point":"The direct teaching against immortality now is plain and accessible."},{"title":"As sure as growing bald","story":"The author jokes that as surely as he is growing bald, Ruth 1:17 is an anti-immortality passage.","point":"The passage's meaning is plain fact."},{"title":"The world's oldest people","story":"A science magazine article (January 2024) reports the oldest living person at 116 and the oldest verified person ever at 122 years, 164 days.","point":"Even the longest lives are brief compared to eternity, as Job said."},{"title":"Wedding card verse","story":"Eccl 3:11 'He has made everything beautiful in its time' is a favourite of Indian Christian wedding card designers, who overlook 'eternity in man's heart'.","point":"Eternity is placed in the heart/soul, not the body."},{"title":"Writing at 3:04 am","story":"The author notes he is typing these lines at 3:04 am, staying up to write articles for the Kingdom.","point":"A personal aside leading into the train story."},{"title":"Oversleeping at Itarsi Junction","story":"As a B.Tech student travelling from Chennai to Allahabad, he broke the journey at Itarsi, slept, and woke at 4 am to find his 3:30 am train had departed.","point":"Introduces Paul's 'time of my departure' (2 Tim 4:6): believers may depart (die) should Jesus tarry."}],"keyVerses":[{"ref":"Deut 31:29","text":"after my death you will behave very corruptly","use":"Moses expected to die."},{"ref":"Josh 23:14","text":"this day I am going the way of all the earth","use":"Death is universal even for the obedient."},{"ref":"Deut 32:39","text":"it is I who put to death and give life","use":"God alone controls when we die."},{"ref":"Ruth 1:17","text":"if anything but death separates you and me","use":"Death comes for all, even the faithful."},{"ref":"Job 14:5","text":"a person's life is fixed... You set a limit","use":"God fixes the length of life."},{"ref":"Heb 9:27","text":"it is appointed for man to die once","use":"The New Testament restates the inevitability of death for all."},{"ref":"Ps 90:10","text":"seventy years, or maybe eighty... Suddenly our time is up","use":"Moses directly teaches mortality."},{"ref":"2 Tim 4:6","text":"the time of my departure has come","use":"Paul, writer of 2 Tim 1:10, expected to die."},{"ref":"2 Cor 5:1","text":"if the earthly tent we live in is destroyed","use":"Believers' bodies may die."}],"flow":["April 2020 Chennai conference prompts D-E-A-T-H study","Moses, Joshua, David all expected death","God alone gives and takes life (Deut 32, Hannah)","Ruth and Job: death comes to all, soon","Hebrews 9:27 restates Old Testament mortality","Ecclesiastes: eternity in the heart, not the body","Paul: Rom 8, Rom 14, 1 Tim 6, tent, departure","2 Tim 1:10 immortality comes at Second Coming"],"outline":{"acronym":"D-E-A-T-H","items":[{"letter":"D","label":"Direct teaching","point":"Both Testaments directly and repeatedly teach that all people, believers included, will die unless Jesus returns first, so immortality now is unbiblical.","refs":["Deut 31:29","Josh 23:14","Deut 32:39"]},{"letter":"E","label":"Examples in Bible and church history","point":"Biblical and historical examples show that faithful believers die, often suddenly or as martyrs, so immortality on earth before Christ's return is impossible, and death is a blessed promotion for those who abide in Christ.","refs":["Jas 4:14","Num 35:25","John 21:19"]},{"letter":"A","label":"Announcement of immortality","point":"Every biblical announcement of immortality, read in context and with Scripture interpreting Scripture, places believers' immortality after Christ's return, so the immortality-now cult's proof texts are misinterpreted.","refs":["1 Cor 15:23","1 Cor 15:26","Dan 7:13-14"]},{"letter":"T","label":"Three kinds of death","point":"The Bible speaks of three kinds of death, and Christ's promise that believers 'will never die' refers to spiritual and eternal death, not to the cancellation of physical death.","refs":["Heb 2:15","Ps 90:12","Amos 4:12"]},{"letter":"H","label":"Heaven and hell: only there is there no death","point":"Death ends only in the new heaven and earth (and in hell, where none can die), which come after Christ's return and judgment, so death cannot be cancelled before then.","refs":["Rev 21:4","2 Pet 3:10","2 Pet 3:8-9"]}]}},{"num":28,"section":"Hyper-Supernaturalism","title":"'E' for Examples Found in the Bible and Church History Against the Immortality Now Cult","summary":"Under 'E' of D-E-A-T-H the author gathers examples against immortality now. He opens with James 4:13-15's warning against presumptuous predictions, then cites the expected death of the high priest (Num 35:25), Uriah's sudden death, Paul's readiness to die (Acts 21:13), Jesus' prediction of Peter's death (John 21:18-19), and the martyrs of Hebrews 11:37-39. He adds John the Baptist, whom Jesus chose not to raise because his purpose was finished (Acts 13:36), James killed after the Cross (Acts 12:1-2), and Antipas, the 'faithful witness' of Rev 2:13. He answers the appeal to Enoch and Elijah (if they were on earth we could meet them), notes that a young member of the leading immortality church died, and rebuts the Madurai pastor's claim that immortality preachers dying is like holiness preachers sinning. He analyses the teaching's appeal as avoiding 'anytime death' evangelism (Luke 17:32; Luke 12:20), and concludes that death is precious and blessed for saints (Ps 116:15; Rev 14:13), an 'out-of-turn promotion' into Christ's presence, while urging constant abiding (John 15).","thesis":"Biblical and historical examples show that faithful believers die, often suddenly or as martyrs, so immortality on earth before Christ's return is impossible, and death is a blessed promotion for those who abide in Christ.","outlines":[{"acronym":"Eight-section Bible reading plan","items":[{"letter":"1","label":"Law","point":"Genesis to Deuteronomy.","refs":[]},{"letter":"2","label":"History","point":"Joshua to Esther.","refs":[]},{"letter":"3","label":"Poetry","point":"Job to Song of Songs.","refs":[]},{"letter":"4","label":"Prophets","point":"Isaiah to Malachi.","refs":[]},{"letter":"5","label":"Gospels","point":"Matthew to John.","refs":[]},{"letter":"6","label":"Acts","point":"The book of Acts.","refs":[]},{"letter":"7","label":"Epistles","point":"Romans to Jude.","refs":[]},{"letter":"8","label":"New Testament prophecy","point":"Revelation.","refs":[]}]}],"claims":[{"claim":"James 4 forbids predictions; the cult predicts years ahead","detail":"James 4:13-15 shows the folly of predicting even a year ahead, since life is a mist. The immortality cult, with followers in South Africa, Sri Lanka, Chennai and Madurai, audaciously predicts that believers will never die. We should instead say 'if the Lord wills, we will live'.","refs":["Jas 4:13-15"],"target":"Immortality-now predictions"},{"claim":"The high priest's death in Numbers 35 shows servants of God die normally","detail":"The manslayer stays in the city of refuge until the death of the anointed high priest (Num 35:25). By example, Scripture teaches that believers and servants of God die under normal circumstances.","refs":["Num 35:25"],"target":"Immortality on earth"},{"claim":"Uriah's sudden death shows the righteous can die suddenly","detail":"Faithful Uriah the Hittite, righteous though not sinless, obeyed David's order and died in battle (2 Sam 11:24). His tragic death shows that believers in the living God can face death, even sudden death.","refs":["2 Sam 11:24"],"target":"Immortality on earth"},{"claim":"Paul spoke openly of his possible death (Acts 21:13)","detail":"Paul had many close shaves with death and said he was ready to die in Jerusalem for Jesus' name (Acts 21:13). If he believed in immortality on earth he would not speak of his possible death.","refs":["Acts 21:13"],"target":"Immortality on earth"},{"claim":"Jesus predicted Peter's death and its manner","detail":"In John 21:18-19 Jesus foretold that Peter, when old, would stretch out his hands, indicating 'the kind of death by which he would glorify God'; scholars agree this was crucifixion, traditionally upside down.","refs":["John 21:18-19"],"target":"Immortality on earth"},{"claim":"Enoch and Elijah are not examples of immortality on earth","detail":"False teachers selectively cite Enoch (Gen 5:24) and Elijah (2 Kgs 2:11-12) while ignoring Joshua and David. Enoch and Elijah would only be examples if they still lived on this earth, which is what the cult claims believers will do. We cannot meet them now; we will meet them on the other side if we die, if Jesus returns, or if God gives us an extraordinary exit like theirs.","refs":["Gen 5:24","2 Kgs 2:11-12","Josh 23:14","1 Kgs 2:2"],"target":"Enoch and Elijah as proof of immortality now"},{"claim":"Hebrews 11's martyrs had faith and still died","detail":"Hebrews 11:37-39 lists believers commended for their faith who were stoned, sawn in two (probably Isaiah), killed by the sword, and sewn into sheepskins and goatskins that shrank into a slow, crushing death. Their faith did not make them immortal; you can have faith that you will be immortal, but that faith will not make you immortal.","refs":["Heb 11:37-39"],"target":"Faith for immortality"},{"claim":"Jesus spoiled funerals only of his choice; John the Baptist's purpose was done","detail":"Jesus raised Lazarus, the widow's son and a little girl, but when told of John the Baptist's death he withdrew (Matt 14:12-13). If it were his absolute will to raise all the dead he met, he would have raised John. John's task was done, and like David, who 'served God's purpose in his own generation, fell asleep' (Acts 13:36), people are taken once their purpose is fulfilled.","refs":["Matt 14:12-13","John 11","Luke 7:11-15","Acts 13:36"],"target":"Death is never God's will"},{"claim":"James was martyred after the Cross, with no 'strange exception' noted","detail":"Herod killed James, brother of John, with the sword (Acts 12:1-2), after Christ's death and resurrection. Luke never adds 'believers don't die, but strangely James did'. For Luke the deaths of James and Stephen (Acts 7) were normal as Jesus' coming was delayed, so immortality on earth is a new heresy invented by modern pastors.","refs":["Acts 12:1-2","Acts 7:59-60","Mark 3:17"],"target":"Immortality on earth"},{"claim":"Paul's narrow escapes do not mean he believed in immortality","detail":"Just because Paul narrowly escaped several deaths does not mean he believed in immortality on earth; otherwise he would not write that even death cannot separate us from Christ's love (Rom 8:35-40).","refs":["Rom 8:35-40","2 Cor 11:23-27"],"target":"Paul's escapes as proof of immortality"},{"claim":"Antipas, a faithful witness killed, shares Jesus' own title","detail":"Reading the Bible by sections led the author to Rev 2:13, where Jesus calls Antipas 'my faithful witness, who was killed among you', sharing his own title (Rev 1:5) with a martyr. If dying believers have Jesus' appreciation, the cult teachers who say 'believers should not die' are anti-Jesus.","refs":["Rev 2:13","Rev 1:5"],"target":"Believers should not die"},{"claim":"A young member of the leading immortality church died","detail":"A relatively young believer in the premier immortality-teaching church died, yet the Chennai pastor continued teaching immortality on earth, which the author finds terrible.","refs":[],"target":"Chennai immortality church"},{"claim":"The 'holiness preachers also sin' defence fails","detail":"The Madurai pastor defended the Chennai pastor: 'Those who preach holiness sin, so those who preach immortality can die.' The author answers that sound holiness preachers never teach sinless perfection (1 John 1:8; Jas 3:2). They teach fighting sin till death (Heb 12:4) and immediate repentance (Rom 2:4-5), as the Corinthian offender repented and was restored (2 Cor 2:7-8). Sinlessness comes only when Christ appears (1 John 3:2), so the analogy is shallow.","refs":["1 John 1:8","Jas 3:2","Heb 12:4","Rom 2:4-5","1 Cor 5:1","2 Cor 2:7-8","1 John 3:2"],"target":"Madurai pastor's analogy"},{"claim":"The teaching thrives because people dislike 'anytime death' evangelism","detail":"Biblical evangelists warn of death at any time, which is not music to listeners' ears, so teachings like immortality now arise. Jesus preached 'Remember Lot's wife' (Luke 17:32), meaning you can die taking one last look at sin, such as a porn site. If immortality is true, one cannot ask 'If you die tonight, where will you go?' (Luke 12:20), nor warn that only those who abide in Christ minute by minute reach heaven, since Romans 8:1 speaks of those who ARE in Christ, not those who once were.","refs":["Luke 17:32","Luke 12:20","Rom 8:1","2 Tim 4:3"],"target":"Immortality teaching as escape from evangelistic warning"},{"claim":"Death of saints is precious and blessed, a way into Christ's presence","detail":"'Precious in the sight of the Lord is the death of his saints' (Ps 116:15), and 'blessed are the dead who die in the Lord' (Rev 14:13), the New Testament repeating the Old. At death the saint is with Christ, 'far better' (Phil 1:23). Immortality pastors needlessly oppose a Bible-mentioned means of entering Christ's presence.","refs":["Ps 116:15","Rev 14:13","Phil 1:23"],"target":"Opposition to death"},{"claim":"John 15 commands constant abiding, with no breaks for sin","detail":"John 15 says 'abide' six times (vv. 4-11): no short breaks to commit sin. Should his coming be delayed, we will all die, but death is not a tragedy for the believer; it is an out-of-turn promotion into God's literal presence.","refs":["John 15:4-11"],"target":"Taking breaks to sin"}],"questions":[{"q":"Can we make predictions about the coming year?","answer":"No. James 4:13-15 says life is a mist, so predicting years of no-death is insane and unbiblical."},{"q":"Are we able to meet Enoch and Elijah today?","answer":"No. They are not on earth, so they are not examples of immortality on earth; we will meet them in eternity."},{"q":"If those who preach holiness can sin, can those who preach immortality die?","answer":"The analogy fails: sound holiness preachers never claim sinless perfection, which comes only at Christ's appearing."},{"q":"Why is immortality on earth being preached?","answer":"Because hearers dislike evangelistic warnings about anytime death (Luke 17:32; Luke 12:20), so they welcome teachers who say 'you won't have to die'."},{"q":"Why is the death of saints precious to God?","answer":"Because at death the saint goes to be with Christ, far better, like Adam and Eve with God before the Fall (Phil 1:23)."}],"criticisms":[{"of":"The 'Immortality Now' movement with followers in South Africa, Sri Lanka, Chennai and Madurai (anonymised)","quote":"","critique":"They audaciously predict that believers will never die, defying James 4:13-15."},{"of":"Immortality-now teachers who quote Enoch and Elijah (anonymised)","quote":"","critique":"Called 'heretic, hell-populating false teachers', they quote Gen 5:24 and 2 Kgs 2:11 selectively while ignoring Joshua and David."},{"of":"A Chennai pastor (anonymised)","quote":"","critique":"He kept teaching immortality on earth after a relatively young member of his church died."},{"of":"A Madurai pastor (anonymised)","quote":"Those who preach holiness, don't they sin? So, why not those who preach immortality experience death in their ranks!","critique":"A shallow, stupid argument, since sound holiness preachers do not claim sinless perfection."},{"of":"The modern 'cultic preachers' in Chennai and Madurai (anonymised)","quote":"","critique":"They invented a strange new heresy that the apostles never taught; the teaching is 'clearly stupid' and believers in it are not in their right sense."}],"illustrations":[{"title":"Hit by a vehicle in Secunderabad","story":"Rushing across a road with a printout of one of his books, the author was hit by a vehicle and fell; another speeding vehicle could have killed him.","point":"Death can come suddenly to anyone, believers included."},{"title":"Sheepskins and goatskins","story":"Victims sewn into animal skins suffered a slow, bone-crushing death as the skins shrank in the weather.","point":"Faithful believers commended in Hebrews 11 died painful deaths; faith did not make them immortal."},{"title":"Isaiah sawn in two","story":"Scholars say the one 'sawn in two' (Heb 11:37) was the prophet Isaiah.","point":"Even great prophets of faith were martyred."},{"title":"Peter crucified upside down","story":"Jesus' words in John 21:18-19 accurately predicted the manner of Peter's death.","point":"Jesus himself foretold a disciple's death."},{"title":"Jesus the funeral-spoiler of his choice","story":"Jesus raised Lazarus, the widow's son and Jairus' daughter, but chose not to raise John the Baptist.","point":"Jesus did not raise everyone; people die when God's purpose for them is fulfilled."},{"title":"The lockdown Bible reading plan","story":"During lockdown the author and his wife read one chapter daily from each of eight sections of the Bible; on day two, Revelation 2 led them to Antipas.","point":"Reading across the whole Bible helps one avoid false teaching."},{"title":"Lot's wife and one last look","story":"Jesus said 'Remember Lot's wife', who became a pillar of salt when she looked back; the author applies it to one last look at a porn site.","point":"Sudden death can come while flirting with sin, so repent now."},{"title":"Out-of-turn promotion","story":"The author describes death for the believer as an out-of-turn promotion into God's literal presence.","point":"Death is not a tragedy for those who abide in Christ."}],"keyVerses":[{"ref":"Jas 4:14","text":"What is your life? You are a mist that appears for a little while and then vanishes.","use":"Against predicting no-death years ahead."},{"ref":"Num 35:25","text":"until the death of the high priest","use":"Servants of God expected to die normally."},{"ref":"John 21:19","text":"the kind of death by which Peter would glorify God","use":"Jesus predicted a disciple's death."},{"ref":"Heb 11:37-39","text":"sawn in two, killed by the sword... commended for their faith","use":"Faith does not exempt from death."},{"ref":"Acts 13:36","text":"when David had served God's purpose in his own generation, he fell asleep","use":"People die when their purpose is fulfilled."},{"ref":"Rev 2:13","text":"Antipas my faithful witness, who was killed among you","use":"Jesus honours martyrs with his own title."},{"ref":"Ps 116:15","text":"Precious in the sight of the Lord is the death of his saints","use":"Death is a way into God's presence."},{"ref":"Rev 14:13","text":"Blessed are the dead who die in the Lord","use":"New Testament echo of Ps 116:15."}],"flow":["James 4: no one can predict even next year","Old Testament examples: high priest, Uriah","New Testament examples: Paul, Peter, James, Stephen","Enoch and Elijah not living on earth now","Hebrews 11 martyrs had faith yet died","John the Baptist not raised; Antipas honoured","Holiness-preacher analogy rebutted; motive analysed","Death of saints precious; abide in Christ"],"outline":{"acronym":"D-E-A-T-H","items":[{"letter":"D","label":"Direct teaching","point":"Both Testaments directly and repeatedly teach that all people, believers included, will die unless Jesus returns first, so immortality now is unbiblical.","refs":["Deut 31:29","Josh 23:14","Deut 32:39"]},{"letter":"E","label":"Examples in Bible and church history","point":"Biblical and historical examples show that faithful believers die, often suddenly or as martyrs, so immortality on earth before Christ's return is impossible, and death is a blessed promotion for those who abide in Christ.","refs":["Jas 4:14","Num 35:25","John 21:19"]},{"letter":"A","label":"Announcement of immortality","point":"Every biblical announcement of immortality, read in context and with Scripture interpreting Scripture, places believers' immortality after Christ's return, so the immortality-now cult's proof texts are misinterpreted.","refs":["1 Cor 15:23","1 Cor 15:26","Dan 7:13-14"]},{"letter":"T","label":"Three kinds of death","point":"The Bible speaks of three kinds of death, and Christ's promise that believers 'will never die' refers to spiritual and eternal death, not to the cancellation of physical death.","refs":["Heb 2:15","Ps 90:12","Amos 4:12"]},{"letter":"H","label":"Heaven and hell: only there is there no death","point":"Death ends only in the new heaven and earth (and in hell, where none can die), which come after Christ's return and judgment, so death cannot be cancelled before then.","refs":["Rev 21:4","2 Pet 3:10","2 Pet 3:8-9"]}]}},{"num":29,"section":"Hyper-Supernaturalism","title":"'A' for Announcement of Immortality in the Bible and Countering the 'Immortality Now' Cult's Wrong Interpretation of These","summary":"Under 'A' of D-E-A-T-H the author examines the Bible's 'announcements' of immortality that the cult uses as proof texts and offers their correct interpretation. He notes that a planned April 2020 Chennai conference of four popular South Indian preachers was cancelled by Covid, and blames such teachings on shallow, context-ignorant Bible reading, illustrated by a mixed-up Good Samaritan story and by the 'wrong combination' errors (Judas, terrorism). He argues that 1 Cor 15:23-26, Daniel 7, Matthew 25, 1 Thessalonians 4 and Revelation 19-22 all teach the same order: Christ returns first, and only then comes immortality, whatever one's view of the rapture. 'Feet' in 1 Cor 15:25 are Jesus' literal feet, and the 'trumpet' of 1 Cor 15:52 is the Second Coming trumpet of 1 Thess 4:16, not human preaching. He insists that doctrine must rest on repeated apostolic teaching, listing eleven texts commanding us to follow the apostles. He then refutes the cult's use of 2 Cor 5:14 (the life given is spiritual, per v.15, Gal 2:20 and 5:24), its claim that Heb 9:27 excludes believers (Heb 11:36-40 and 12:4 show believers die), 2 Tim 1:10 (read with 1:8-10 and 4:6), and Rom 2:7 (seek the Giver, not the gift; one verse cannot make a doctrine). He closes by urging readers to wield the Bible-sword responsibly and prays for a remnant of faithful teachers.","thesis":"Every biblical announcement of immortality, read in context and with Scripture interpreting Scripture, places believers' immortality after Christ's return, so the immortality-now cult's proof texts are misinterpreted.","outlines":[{"acronym":"Jesus returns first, only thereafter immortality","items":[{"letter":"1","label":"1 Corinthians 15","point":"'At his coming'; then the end; death destroyed last.","refs":["1 Cor 15:23-26"]},{"letter":"2","label":"Daniel 7","point":"The Son of Man comes with the clouds, then an everlasting kingdom for the saints.","refs":["Dan 7:13-14","Dan 7:22","Dan 7:27","Dan 12:2"]},{"letter":"3","label":"Matthew 25","point":"The Son of Man comes, judges, then the righteous go into eternal life.","refs":["Matt 25:31-32","Matt 25:46"]},{"letter":"4","label":"1 Thessalonians 4","point":"The Lord descends, the dead rise, then we are with the Lord forever.","refs":["1 Thess 4:13-17"]},{"letter":"5","label":"Revelation","point":"The white-horse rider returns, then they reign forever and ever.","refs":["Rev 19:11","Rev 22:5"]}]},{"acronym":"Follow the apostles (11 texts)","items":[{"letter":"1","label":"Devoted to the apostles' teaching","point":"","refs":["Acts 2:42"]},{"letter":"2","label":"Imitate me","point":"","refs":["1 Cor 4:16"]},{"letter":"3","label":"Follow me as I follow Christ","point":"","refs":["1 Cor 11:1"]},{"letter":"4","label":"Maintain the traditions","point":"","refs":["1 Cor 11:2"]},{"letter":"5","label":"Follow our pattern","point":"","refs":["Phil 3:17"]},{"letter":"6","label":"Practise what you learned from me","point":"","refs":["Phil 4:9"]},{"letter":"7","label":"Imitators of us and of the Lord","point":"","refs":["1 Thess 1:6"]},{"letter":"8","label":"Imitators of the churches in Judea","point":"","refs":["1 Thess 2:14"]},{"letter":"9","label":"An example to imitate","point":"","refs":["2 Thess 3:9"]},{"letter":"10","label":"Imitate those who inherit by faith and patience","point":"","refs":["Heb 6:12"]},{"letter":"11","label":"Imitate your leaders' faith","point":"Conclusion: if the apostles do not endorse a teaching, neither should we.","refs":["Heb 13:7"]}]},{"acronym":"Four times Paul said he could die","items":[{"letter":"1","label":"Acts 20:24","point":"I do not cling to my life; I only want to finish my race.","refs":["Acts 20:24"]},{"letter":"2","label":"Acts 21:13","point":"Ready to die for the name of Jesus.","refs":["Acts 21:13"]},{"letter":"3","label":"Romans 8:35","point":"Not even death can separate us.","refs":["Rom 8:35"]},{"letter":"4","label":"2 Timothy 4:6","point":"Poured out as a drink offering; the time of departure has come.","refs":["2 Tim 4:6"]}]}],"claims":[{"claim":"Shallow, context-ignorant Bible reading breeds death-cancellation cults","detail":"Retelling a preacher's joke of a Sunday School boy who mixed up a dozen stories into the 'Good Samaritan', the author warns that soon Christians won't see what's funny because they don't know the Bible narrative. Teachings like physical death cancellation thrive on this ignorance, which is why he ends the book with a chapter on reading the Bible.","refs":["Luke 10:30-37"],"target":"Biblical illiteracy behind immortality teaching"},{"claim":"James died after the resurrection with no 'exception' noted","detail":"Acts 12 records James' martyrdom after Jesus died, rose and began interceding at God's right hand, yet nowhere does Scripture say 'believers are not supposed to die, but somehow James died'.","refs":["Acts 12:1-2","Rom 8:34"],"target":"No death for believers"},{"claim":"1 Cor 15:23-26: death is destroyed 'at his coming'","detail":"The 'no death' camp quotes 1 Cor 15:23-26, but the phrase 'at his coming' shows that only after Jesus returns is the last enemy, death, destroyed. Verse 24's destruction of every rule and authority has clearly not happened yet.","refs":["1 Cor 15:23-26"],"target":"Death defeated now by believers"},{"claim":"The 'feet' of 1 Cor 15:25 are Jesus' literal feet, not the church","detail":"A Chennai pastor says the 'feet' are the church, since the church is Christ's body, so the church will destroy death and believers need not die. The author says the context (vv. 23-24) shows these are the literal feet of the returning Judge who obliterates his enemies; this is a bizarre interpretation that disregards context.","refs":["1 Cor 15:23-25","Col 1:18"],"target":"Church as Christ's feet destroying death"},{"claim":"'Wrong combination' interpretation can justify suicide or terror","detail":"Combining 'Judas hanged himself' (Matt 27:5), 'go and do likewise' (Luke 10:37) and 'what you do, do quickly' (John 13:27) can 'defend' suicide. Combining Matt 10:11 with Deut 13:15 can 'support' terrorism. The Chennai pastor's combining of 1 Cor 15:25 with the body of Christ is this kind of error. We must rightly handle the word (2 Tim 2:15), and suicide is never an option because Jesus is the author of life (Acts 3:15).","refs":["Matt 27:5","Luke 10:37","John 13:27","Matt 10:11","Deut 13:15","2 Tim 2:15","Acts 3:15"],"target":"Chennai pastor's verse-combining"},{"claim":"When the plain meaning makes sense, seek no other meaning","detail":"1 Cor 15:23-26 plainly says Jesus reigns and Jesus destroys death, at his return. A cardinal rule of interpretation is that when the plain sense makes sense, we must not look for another; hell-populating false teachers break it.","refs":["1 Cor 15:23-26"],"target":"Allegorising 1 Cor 15"},{"claim":"Reading apocalyptic chapters daily clarifies the end times","detail":"During the Covid lockdown the author read the Revelation chapter matching the date, switching to Daniel 7-12 from the 23rd, alongside habits like five Psalms, one Proverbs or one Acts chapter a day. This deepened his understanding of the last days of world history.","refs":["Rev 1:3","Dan 7-12"],"target":"Neglect of apocalyptic Scripture"},{"claim":"Daniel 7: the Son of Man comes, then the everlasting kingdom","detail":"Daniel 7:13-14 shows one like a son of man coming with the clouds and receiving an everlasting dominion; verses 22 and 27 give the saints the kingdom. This is the Second Coming (compare 1 Thess 4:16-17), predicted before the first; Daniel 12:2 adds the resurrection and judgment. So Jesus returns first and only then is there everlasting life.","refs":["Dan 7:13-14","Dan 7:22","Dan 7:27","Dan 12:2","1 Thess 4:16-17"],"target":"Immortality before Christ's return"},{"claim":"Matthew 25: return, judgment, then eternal life","detail":"Matt 25:31-32 describes the Son of Man coming in glory to separate sheep from goats; verse 46 then sends the righteous into eternal life. The order is the same as Daniel 7 and 1 Cor 15, so believers cannot have literal eternal life before Christ returns.","refs":["Matt 25:31-32","Matt 25:46"],"target":"Eternal life before the Second Coming"},{"claim":"1 Thessalonians 4: return first, then 'with the Lord forever'","detail":"1 Thess 4:16-17: the Lord descends, the dead in Christ rise, the living are caught up, and so we will be with the Lord forever. Whether one holds a secret rapture or a single public coming, immortality does not happen before the rapture or the Second Coming, whatever one's eschatology.","refs":["1 Thess 4:16-17"],"target":"Immortality before the Second Coming"},{"claim":"The cult says Jesus won't return until a no-death generation rises","detail":"Worse, the no-death group believes Jesus will not return until a generation rises in the universal church believing they will not die, based on twisting 1 Cor 15:52. But 1 Thess 4 says Jesus comes first, and only then are believers with the Lord forever.","refs":["1 Cor 15:52","1 Thess 4:16-17"],"target":"A no-death generation must precede Christ's return"},{"claim":"Doctrine needs repeated apostolic teaching; follow the apostles (11 texts)","detail":"We have a doctrine only when the Bible repeatedly speaks of a matter in different places, especially in the epistles; one stray reference cannot make a doctrine. At least eleven times we are told to follow the apostles' teaching and example (Acts 2:42 to Heb 13:7). The apostles did not endorse immortality on earth before Christ returns, so neither should we.","refs":["Acts 2:42","1 Cor 4:16","1 Cor 11:1","1 Cor 11:2","Phil 3:17","Phil 4:9","1 Thess 1:6","1 Thess 2:14","2 Thess 3:9","Heb 6:12","Heb 13:7"],"target":"Doctrine from isolated verses"},{"claim":"1 Thessalonians 4:13-14 assumes believers die and will keep dying","detail":"Paul writes about those who 'sleep in death' so the Thessalonians will not grieve like those without hope (1 Thess 4:13). Believers have died and will continue to die if Jesus' return is delayed; God will bring them with Jesus (v.14), and those still alive will be made immortal when they meet him (vv.16-17).","refs":["1 Thess 4:13-17"],"target":"No death for believers"},{"claim":"Revelation: the white-horse rider returns, then 'reign forever'","detail":"Revelation 19:11 describes Jesus returning on a white horse; only after that do believers 'reign forever and ever' (Rev 22:5). Before his return there is no 'forever and ever' life for believers; they may have to die.","refs":["Rev 19:11","Rev 22:5"],"target":"Immortality before the Second Coming"},{"claim":"1 Cor 15:50-55: the 'trumpet' is the Second Coming trumpet, not immortality preaching","detail":"The cult says the 'trumpet' of 1 Cor 15:52 is their preaching of immortality now. But Paul uses 'trumpet' only once elsewhere, in 1 Thess 4:16, where it accompanies Christ's return. Interpreting Paul with Paul, the trumpet announces the Second Coming, when living believers become immortal and death is defeated. Heb 12:19's trumpet refers to Sinai (Exod 19:13-19), sounded, according to a medieval Jewish commentator, by an angel and not humans, so even that cross-reference shows the trumpet is not human preaching.","refs":["1 Cor 15:50-55","1 Thess 4:16","Heb 12:19","Exod 19:13","Exod 19:16","Exod 19:19"],"target":"Trumpet as present-day immortality preaching"},{"claim":"2 Cor 5:14's 'all died' gives spiritual life of unselfish living (v.15)","detail":"The Madurai pastor says: Heb 9:27 says man dies once, but I already died when Jesus died for me (2 Cor 5:14), so I won't die again. The very next verse shows the life given is spiritual, so that we no longer live for ourselves (2 Cor 5:15). Living for others may even require laying down our lives (1 John 3:16), as missionaries martyred in the Andamans (2018) and Ecuador (1956) did.","refs":["2 Cor 5:14-15","Heb 9:27","1 John 3:16"],"target":"Inclusion in Christ's death cancels physical death"},{"claim":"Gal 2:20 and 5:24 show the 'life' and 'crucifixion' are spiritual","detail":"Paul could have said in Gal 2:20, 'I died with Christ, so I am immortal', but he speaks of a spiritual life lived by faith. If we literally live after being spiritually crucified, we can literally die after living Christ's spiritual life. Gal 5:24's 'crucified the flesh' must be spiritual, or we would need a pastor to nail us to a cross; equally laughable is 'Jesus died so we never die'. The spiritual message is to crucify desires like porn, rage and oversleeping.","refs":["Gal 2:20","Gal 5:24"],"target":"Literalising union with Christ's death and life"},{"claim":"The Corinthian letters themselves affirm the possibility of death","detail":"Paul could not have taught immortality in 2 Cor 5:14 because the same letters speak of carrying in the body the death of Jesus and being given over to death for Jesus' sake (2 Cor 4:8-12), and of the earthly tent being destroyed (2 Cor 5:1). The apostles ministered with a 'death may come, I don't care' attitude, knowing death meant promotion, as a martyred missionary to Ecuador said: 'He is no fool who gives what he cannot keep to gain what he cannot lose.'","refs":["2 Cor 4:8-12","2 Cor 5:1"],"target":"Immortality from 2 Cor 5:14"},{"claim":"Four times Paul said he could die (Acts 20:24; 21:13; Rom 8:35; 2 Tim 4:6)","detail":"Quoting a modern version, the author lists four statements where Paul said he did not mind dying for the gospel. So to use any of Paul's words to teach immortality on earth is a travesty, since Paul never thought he could be immortal here and now.","refs":["Acts 20:24","Acts 21:13","Rom 8:35","2 Tim 4:6"],"target":"Using Paul to teach immortality now"},{"claim":"Heb 9:27 includ
