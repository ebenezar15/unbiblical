<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hyper Biblical Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;0,6..12,900;1,6..12,400&display=swap">
<style>
/* Layout: sticky top bar + single routed view; chapter pages are long scrolls with a section-colour band,
   flowchart, flip-tile outlines and argument cards. Colour schemes swap the whole token set. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E7EBF2; --fg:#151D2B; --muted:#5A6577; --line:#D3DAE5;
  --accent:#2D55E0; --accent-fg:#FFFFFF; --accent2:#C98A0B; --glow:rgba(45,85,224,.14);
  --good:#15803D; --bad:#B42318;
  --font:"Avenir Next","Avenir","Nunito Sans","Segoe UI",system-ui,sans-serif;
  --font-display:"Avenir Next","Avenir","Nunito Sans","Segoe UI",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 24px rgba(16,24,40,.07);
  --s-intro:#64748B; --s-ref:#8B5CF6; --s-grace:#2563EB; --s-super:#D97706; --s-love:#DC2626; --s-misc:#0D9488; --s-anti:#16A34A;
  --l-relational:#E11D48; --l-faith:#D97706; --l-immortality:#7C3AED; --l-sonship:#2563EB; --l-postmil:#16A34A; --l-preterist:#0891B2;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C111A; --surface:#141B27; --surface2:#1C2533; --fg:#E7ECF4; --muted:#93A0B4; --line:#283346;
  --accent:#7C9BFF; --accent-fg:#0C111A; --accent2:#F2BE4A; --glow:rgba(124,155,255,.16);
  --good:#4ADE80; --bad:#F87171; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  --s-intro:#94A3B8; --s-ref:#A78BFA; --s-grace:#60A5FA; --s-super:#FBBF24; --s-love:#F87171; --s-misc:#2DD4BF; --s-anti:#4ADE80;
  --l-relational:#FB7185; --l-faith:#FBBF24; --l-immortality:#A78BFA; --l-sonship:#60A5FA; --l-postmil:#4ADE80; --l-preterist:#22D3EE;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C111A; --surface:#141B27; --surface2:#1C2533; --fg:#E7ECF4; --muted:#93A0B4; --line:#283346;
  --accent:#7C9BFF; --accent-fg:#0C111A; --accent2:#F2BE4A; --glow:rgba(124,155,255,.16);
  --good:#4ADE80; --bad:#F87171; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  --s-intro:#94A3B8; --s-ref:#A78BFA; --s-grace:#60A5FA; --s-super:#FBBF24; --s-love:#F87171; --s-misc:#2DD4BF; --s-anti:#4ADE80;
  --l-relational:#FB7185; --l-faith:#FBBF24; --l-immortality:#A78BFA; --l-sonship:#60A5FA; --l-postmil:#4ADE80; --l-preterist:#22D3EE;
  color-scheme:dark }
/* user-picked colour schemes (beat the host theme) */
:root:root[data-scheme="daylight"]{ --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E7EBF2; --fg:#151D2B; --muted:#5A6577; --line:#D3DAE5; --accent:#2D55E0; --accent-fg:#fff; --accent2:#C98A0B; --glow:rgba(45,85,224,.14); --good:#15803D; --bad:#B42318; --s-intro:#64748B; --s-ref:#8B5CF6; --s-grace:#2563EB; --s-super:#D97706; --s-love:#DC2626; --s-misc:#0D9488; --s-anti:#16A34A; --l-relational:#E11D48; --l-faith:#D97706; --l-immortality:#7C3AED; --l-sonship:#2563EB; --l-postmil:#16A34A; --l-preterist:#0891B2; color-scheme:light }
:root:root[data-scheme="night"]{ --bg:#0C111A; --surface:#141B27; --surface2:#1C2533; --fg:#E7ECF4; --muted:#93A0B4; --line:#283346; --accent:#7C9BFF; --accent-fg:#0C111A; --accent2:#F2BE4A; --glow:rgba(124,155,255,.16); --good:#4ADE80; --bad:#F87171; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); --s-intro:#94A3B8; --s-ref:#A78BFA; --s-grace:#60A5FA; --s-super:#FBBF24; --s-love:#F87171; --s-misc:#2DD4BF; --s-anti:#4ADE80; --l-relational:#FB7185; --l-faith:#FBBF24; --l-immortality:#A78BFA; --l-sonship:#60A5FA; --l-postmil:#4ADE80; --l-preterist:#22D3EE; color-scheme:dark }
:root:root[data-scheme="ember"]{ --bg:#170F0C; --surface:#221713; --surface2:#2E2019; --fg:#F6EAE2; --muted:#BFA799; --line:#3E2C22; --accent:#FF7A45; --accent-fg:#170F0C; --accent2:#FFC857; --glow:rgba(255,122,69,.16); --good:#86EFAC; --bad:#FCA5A5; --shadow:0 8px 28px rgba(0,0,0,.45); --s-intro:#C4B0A3; --s-ref:#F0ABFC; --s-grace:#FDBA74; --s-super:#FDE047; --s-love:#FB7185; --s-misc:#5EEAD4; --s-anti:#A3E635; --l-relational:#FB7185; --l-faith:#FDE047; --l-immortality:#F0ABFC; --l-sonship:#93C5FD; --l-postmil:#A3E635; --l-preterist:#5EEAD4; color-scheme:dark }
:root:root[data-scheme="jade"]{ --bg:#EDF4F0; --surface:#FFFFFF; --surface2:#DCEAE2; --fg:#10251C; --muted:#4D6559; --line:#C5D9CD; --accent:#0F7B55; --accent-fg:#fff; --accent2:#C2410C; --glow:rgba(15,123,85,.14); --good:#15803D; --bad:#B91C1C; --s-intro:#57706A; --s-ref:#7C3AED; --s-grace:#0F7B55; --s-super:#B45309; --s-love:#BE123C; --s-misc:#0E7490; --s-anti:#4D7C0F; --l-relational:#BE123C; --l-faith:#B45309; --l-immortality:#7C3AED; --l-sonship:#1D4ED8; --l-postmil:#4D7C0F; --l-preterist:#0E7490; color-scheme:light }
:root:root[data-scheme="royal"]{ --bg:#120D22; --surface:#1B1531; --surface2:#261E42; --fg:#EEE9FB; --muted:#A99FC8; --line:#342A56; --accent:#B39DFF; --accent-fg:#120D22; --accent2:#F472B6; --glow:rgba(179,157,255,.16); --good:#86EFAC; --bad:#FDA4AF; --shadow:0 8px 28px rgba(0,0,0,.45); --s-intro:#B4ADC9; --s-ref:#F0ABFC; --s-grace:#93C5FD; --s-super:#FCD34D; --s-love:#FDA4AF; --s-misc:#5EEAD4; --s-anti:#86EFAC; --l-relational:#FDA4AF; --l-faith:#FCD34D; --l-immortality:#F0ABFC; --l-sonship:#93C5FD; --l-postmil:#86EFAC; --l-preterist:#5EEAD4; color-scheme:dark }
:root:root[data-scheme="ocean"]{ --bg:#E8F3F7; --surface:#FFFFFF; --surface2:#D5E9F0; --fg:#0A2A36; --muted:#4A6874; --line:#BFDAE4; --accent:#0B6E8A; --accent-fg:#fff; --accent2:#D97706; --glow:rgba(11,110,138,.14); --good:#15803D; --bad:#B91C1C; --s-intro:#52707C; --s-ref:#6D28D9; --s-grace:#0B6E8A; --s-super:#C2410C; --s-love:#BE123C; --s-misc:#0F766E; --s-anti:#15803D; --l-relational:#BE123C; --l-faith:#C2410C; --l-immortality:#6D28D9; --l-sonship:#1D4ED8; --l-postmil:#15803D; --l-preterist:#0B6E8A; color-scheme:light }
:root:root[data-scheme="sand"]{ --bg:#EFE9DF; --surface:#FBF8F3; --surface2:#E4DBCC; --fg:#2A2118; --muted:#6E604F; --line:#D6CAB6; --accent:#7A3E12; --accent-fg:#fff; --accent2:#2F6F73; --glow:rgba(122,62,18,.12); --good:#3F6212; --bad:#9F1239; --s-intro:#7C6F5E; --s-ref:#6B21A8; --s-grace:#7A3E12; --s-super:#A16207; --s-love:#9F1239; --s-misc:#2F6F73; --s-anti:#3F6212; --l-relational:#9F1239; --l-faith:#A16207; --l-immortality:#6B21A8; --l-sonship:#1E40AF; --l-postmil:#3F6212; --l-preterist:#2F6F73; color-scheme:light }
:root:root[data-scheme="mono"]{ --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F1F1F1; --fg:#0A0A0A; --muted:#5B5B5B; --line:#DADADA; --accent:#0A0A0A; --accent-fg:#fff; --accent2:#E11D48; --glow:rgba(0,0,0,.07); --good:#166534; --bad:#BE123C; --s-intro:#737373; --s-ref:#404040; --s-grace:#0A0A0A; --s-super:#525252; --s-love:#E11D48; --s-misc:#404040; --s-anti:#166534; --l-relational:#E11D48; --l-faith:#0A0A0A; --l-immortality:#525252; --l-sonship:#262626; --l-postmil:#166534; --l-preterist:#404040; color-scheme:light }
:root:root[data-scheme="midnight"]{ --bg:#04060C; --surface:#0B1020; --surface2:#121A30; --fg:#DCE6F7; --muted:#8696B5; --line:#1C2742; --accent:#38BDF8; --accent-fg:#04060C; --accent2:#FACC15; --glow:rgba(56,189,248,.16); --good:#4ADE80; --bad:#FB7185; --shadow:0 8px 28px rgba(0,0,0,.6); --s-intro:#94A3B8; --s-ref:#C4B5FD; --s-grace:#38BDF8; --s-super:#FACC15; --s-love:#FB7185; --s-misc:#2DD4BF; --s-anti:#4ADE80; --l-relational:#FB7185; --l-faith:#FACC15; --l-immortality:#C4B5FD; --l-sonship:#38BDF8; --l-postmil:#4ADE80; --l-preterist:#2DD4BF; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;transition:background .35s,color .35s;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.18;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.05rem;text-decoration:none;color:var(--fg);letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:30px;height:30px;flex:none}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.nav a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem;transition:background .2s,color .2s}
.nav a:hover{background:var(--surface2);color:var(--fg)}
.nav a.on{background:var(--accent);color:var(--accent-fg)}
.tools{display:flex;gap:6px;align-items:center}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.88rem}
.ibtn:hover{border-color:var(--accent)}
.ibtn svg{width:18px;height:18px}
@media (max-width:760px){ .nav{order:3;flex-basis:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none} .nav a{white-space:nowrap} .brand span.long{display:none} }

/* scheme popover */
.pop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;width:min(330px,calc(100vw - 32px));z-index:70}
.pop h4{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:700}
.sw.on{border-color:var(--accent)}
.sw .chips{display:flex;height:22px;border-radius:6px;overflow:hidden}
.sw .chips i{flex:1}

/* views */
main{min-height:70vh;padding-block:28px 80px}
.view{animation:viewIn .45s ease both}
@keyframes viewIn{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:10px 26px}
.hero h1{font-size:clamp(2.1rem,5.4vw,4rem);font-weight:900;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lede{font-size:1.12rem;color:var(--muted);margin-top:14px;max-width:58ch}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:22px}
.stat b{display:block;font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:800;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:hover{transform:translateY(-1px)}
@media (max-width:860px){ .hero{grid-template-columns:1fr} }

/* mind map */
.mapbox{position:relative;background:radial-gradient(circle at 50% 50%,var(--glow),transparent 65%);border-radius:24px}
.mapbox svg{width:100%;height:auto;display:block;max-width:100%}
.map-edge{fill:none;stroke:var(--line);stroke-width:1.6}
.map-edge.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.map-node{cursor:pointer;transition:transform .2s}
.map-node circle{transition:r .2s,stroke-width .2s}
.map-node:hover circle,.map-node:focus circle{stroke-width:5}
.map-node text{font-family:var(--font);font-weight:800;pointer-events:none}
.maptip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:8px 12px;font-size:.88rem;font-weight:700;max-width:90%;text-align:center;pointer-events:none;transition:opacity .2s}
.pulse{animation:pulse 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.06)}}

/* section blocks on home */
.sections{display:grid;gap:26px;margin-top:30px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sec-dot{width:14px;height:14px;border-radius:50%;flex:none}
.sec-head h2{font-size:1.35rem;font-weight:900}
.sec-head .count{margin-left:auto;font-size:.8rem;color:var(--muted);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden;min-width:0}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--c)}
.ccard .num{font-size:.74rem;font-weight:900;letter-spacing:.1em;color:var(--c);text-transform:uppercase}
.ccard h3{font-size:1.02rem;font-weight:800}
.ccard p{font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ccard .meta{display:flex;gap:10px;font-size:.74rem;color:var(--muted);font-weight:700;margin-top:auto}
.ccard::after{content:"";position:absolute;right:-30px;top:-30px;width:80px;height:80px;border-radius:50%;background:var(--c);opacity:.08;transition:transform .3s}
.ccard:hover::after{transform:scale(1.6)}

/* chapter page */
.band{border-radius:22px;padding:clamp(20px,4vw,40px);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));position:relative;overflow:hidden}
.band .big{position:absolute;right:clamp(8px,3vw,32px);top:-10px;font-size:clamp(6rem,16vw,12rem);font-weight:900;color:var(--c);opacity:.12;line-height:1;pointer-events:none;font-variant-numeric:tabular-nums}
.band h1{font-size:clamp(1.6rem,3.6vw,2.6rem);font-weight:900;max-width:24ch;position:relative}
.band .thesis{margin-top:14px;font-size:1.1rem;max-width:62ch;position:relative;font-weight:600}
.band .thesis::before{content:"Thesis";display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:900;margin-bottom:4px}
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;position:relative}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:800;background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:var(--c,var(--accent));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 35%,transparent);text-decoration:none;white-space:nowrap}
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:20;display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin:14px 0 4px;background:var(--bg);scrollbar-width:none}
@media (max-width:760px){.subnav{top:calc(env(safe-area-inset-top,0px) + 100px)}}
.subnav a{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:800;color:var(--muted);text-decoration:none}
.subnav a:hover{color:var(--fg);border-color:var(--c)}
.blk{margin-top:34px;scroll-margin-top:150px}
.blk>h2{font-size:1.3rem;font-weight:900;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.blk>h2 .n{font-size:.75rem;font-weight:800;color:var(--muted);background:var(--surface2);border-radius:999px;padding:2px 9px}
.summary{font-size:1.06rem;max-width:72ch}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}

/* flowchart */
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;counter-reset:f}
.fnode{position:relative;align-self:flex-start;max-width:min(560px,92%);padding:12px 16px 12px 52px;border-radius:14px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--line));font-weight:700;font-size:.95rem;box-shadow:var(--shadow);animation:fin .5s ease both;animation-delay:calc(var(--i) * 110ms)}
.fnode:nth-child(4n+3){align-self:center}
.fnode:nth-child(4n+5){align-self:flex-end}
.fnode::before{counter-increment:f;content:counter(f);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--bg);display:grid;place-items:center;font-size:.8rem;font-weight:900}
.farrow{height:30px;align-self:center;width:2px;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 30%,transparent));position:relative;animation:fin .4s ease both;animation-delay:calc(var(--i) * 110ms + 60ms)}
.farrow::after{content:"";position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top:7px solid var(--c);border-bottom:0}
.fnode.last{background:var(--c);color:var(--bg);border-color:var(--c)}
.fnode.last::before{background:var(--bg);color:var(--c)}
@keyframes fin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:640px){.fnode{align-self:stretch!important;max-width:none}}

/* outline tiles */
.acro{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:baseline}
.acro .word{font-size:clamp(1.8rem,5vw,3rem);font-weight:900;letter-spacing:.06em;color:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{perspective:1000px;min-height:190px;cursor:pointer;border:0;padding:0;background:none;text-align:left}
.tile .in{position:relative;width:100%;height:100%;min-height:190px;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.tile.flip .in{transform:rotateY(180deg)}
.tile .f,.tile .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.tile .f{background:var(--surface);border:1.5px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.tile .f .L{font-size:3.2rem;font-weight:900;line-height:1;color:var(--c)}
.tile .f h4{font-size:1rem;font-weight:800}
.tile .f small{margin-top:auto;font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tile .b{background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1.5px solid var(--c);transform:rotateY(180deg);font-size:.88rem}
.refs{display:flex;flex-wrap:wrap;gap:5px}
.ref{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--fg);white-space:nowrap;border:0;cursor:pointer}
.ref:hover{background:var(--accent);color:var(--accent-fg)}

/* argument cards */
.args{display:grid;gap:12px}
.arg{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .2s}
.arg[open]{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.arg summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.arg summary::-webkit-details-marker{display:none}
.arg .k{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:.85rem;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.arg h3{font-size:1rem;font-weight:800}
.arg .tgt{font-size:.78rem;color:var(--muted);font-weight:700;margin-top:2px}
.arg .chev{transition:transform .25s;color:var(--muted)}
.arg[open] .chev{transform:rotate(180deg)}
.arg .body{padding:0 16px 16px;display:grid;gap:12px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.vs{grid-template-columns:1fr}}
.side{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.93rem}
.side.book{background:var(--surface2)}
.side.resp{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.side .lbl{font-size:.7rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.side.resp .lbl{color:var(--accent)}
.lenses{display:flex;gap:5px;flex-wrap:wrap}
.lens{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px;color:var(--lc);background:color-mix(in srgb,var(--lc) 14%,transparent);border:1px solid color-mix(in srgb,var(--lc) 35%,transparent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chipbtn{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:.8rem;cursor:pointer;color:var(--muted)}
.chipbtn.on{background:var(--lc,var(--accent));border-color:var(--lc,var(--accent));color:var(--bg)}

/* Q&A */
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q .qq{font-weight:800;font-size:1.02rem;display:flex;gap:10px}
.q .qq::before{content:"?";flex:none;width:28px;height:28px;border-radius:50%;background:var(--c,var(--accent));color:var(--bg);display:grid;place-items:center;font-weight:900}
.q .ans{font-size:.92rem;border-left:3px solid var(--line);padding-left:12px}
.q .ans.r{border-color:var(--accent)}
.q .ans b{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.q .ans.r b{color:var(--accent)}
.reveal{align-self:flex-start;font-size:.8rem;font-weight:800;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}

/* criticisms */
.crit{display:grid;gap:12px}
.cr{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cr .who{padding:14px;background:color-mix(in srgb,var(--c) 10%,var(--surface2));font-weight:800;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.cr .who svg{width:26px;height:26px;color:var(--c)}
.cr .what{padding:14px;display:grid;gap:10px;font-size:.93rem}
.cr blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--c);background:var(--surface2);border-radius:0 8px 8px 0;font-style:italic}
@media (max-width:640px){.cr{grid-template-columns:1fr}}

/* stories */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative}
.story .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.story .ic svg{width:22px;height:22px}
.story h4{font-size:1rem;font-weight:800}
.story p{font-size:.9rem}
.story .pt{font-size:.85rem;font-weight:700;color:var(--c);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}

/* verses */
.verses{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.verse{border-radius:16px;padding:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 12%,var(--surface)),var(--surface));border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.verse .vr{font-weight:900;color:var(--c);font-size:.9rem}
.verse q{font-style:italic;font-size:1.02rem;quotes:"\201C" "\201D"}
.verse small{color:var(--muted);font-size:.84rem}

.overview{border-radius:18px;padding:20px;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--accent) 40%,var(--line));font-size:1.02rem}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1;min-width:220px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--fg);font-weight:800}
.pager a small{display:block;color:var(--muted);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}
.pager a.nx{text-align:right}

/* diagrams view */
.dgrid{display:grid;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,26px);min-width:0}
.panel>h2{font-size:1.3rem;font-weight:900;margin-bottom:4px}
.panel>p.sub{color:var(--muted);margin-bottom:16px;max-width:70ch}
.scales{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.scale{text-align:center;padding:10px;border-radius:16px;background:var(--surface2)}
.scale svg{width:100%;height:auto;max-width:100%}
.scale .beam{transform-origin:120px 62px;transform-box:view-box;animation:tilt 4s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(-7deg)}}
.scale h4{font-weight:900;margin-top:6px}
.scale p{font-size:.85rem;color:var(--muted)}
.hscroll{overflow-x:auto;max-width:100%}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:.85rem;font-weight:700;cursor:pointer;background:none;border:0;padding:2px 0;text-align:left}
.bar .t{height:18px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent2)));transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms)}
@keyframes grow{from{transform:scaleX(0)}}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar:hover .t i{filter:brightness(1.15)}
.matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;min-width:640px}
.matrix th,.matrix td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.matrix th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--surface)}
.matrix td:first-child{font-weight:900}
.matrix tr:hover td{background:var(--surface2)}
.sectionchart{display:flex;height:42px;border-radius:12px;overflow:hidden;margin:6px 0 10px}
.sectionchart a{display:grid;place-items:center;color:var(--bg);font-weight:900;font-size:.8rem;text-decoration:none;transition:flex .3s;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* scriptures/questions list */
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 14px;margin-bottom:16px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;padding:10px 0;color:var(--fg);outline:none}
.search svg{width:18px;height:18px;color:var(--muted)}
.hits{display:grid;gap:10px}
.hit{display:block;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg)}
.hit:hover{border-color:var(--accent)}
.hit small{display:block;color:var(--muted);font-weight:700;font-size:.76rem}
mark{background:color-mix(in srgb,var(--accent2) 40%,transparent);color:inherit;border-radius:3px}

/* lens wheel & primers (answers app) */
.lensgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.lcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--lc);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lcard h3{font-size:1.15rem;font-weight:900;color:var(--lc)}
.lcard ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.92rem}
.lcard svg{width:100%;height:auto;max-width:100%}
.wheel text{font-family:var(--font);font-weight:800}
.spin{animation:spin 60s linear infinite;transform-origin:200px 200px;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.wheel .seg{cursor:pointer;transition:opacity .2s}
.wheel .seg:hover{opacity:.85}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:90;box-shadow:var(--shadow)}
footer{border-top:1px solid var(--line);padding-block:26px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
