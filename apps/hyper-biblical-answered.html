:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E7EBF2; --fg:#151D2B; --muted:#5A6577; --line:#D3DAE5;
  --accent:#2D55E0; --accent-fg:#FFFFFF; --accent2:#C98A0B; --glow:rgba(45,85,224,.14);

  --font-display:"Avenir Next","Avenir","Nunito Sans","Segoe UI",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 24px rgba(16,24,40,.07);
  --s-intro:#64748B; --s-ref:#8B5CF6; --s-grace:#2563EB; --s-super:#D97706; --s-love:#DC2626; --s-misc:#0D9488; --s-anti:#16A34A;

}

  --l-relational:#FB7185; --l-faith:#FBBF24; --l-immortality:#A78BFA; --l-sonship:#60A5FA; --l-postmil:#4ADE80; --l-preterist:#22D3EE;
  color-scheme:dark }}

  --bg:#0C111A; --surface:#141B27; --surface2:#1C2533; --fg:#E7ECF4; --muted:#93A0B4; --line:#283346;

:root:root[data-scheme="royal"]{ --bg:#120D22; --surface:#1B1531; --surface2:#261E42; --fg:#EEE9FB; --muted:#A99FC8; --line:#342A56; --accent:#B39DFF; --accent-fg:#120D22; --accent2:#F472B6; --glow:rgba(179,157,255,.16); --good:#86EFAC; --bad:#FDA4AF; --shadow:0 8px 28px rgba(0,0,0,.45); --s-intro:#B4ADC9; --s-ref:#F0ABFC; --s-grace:#93C5FD; --s-super:#FCD34D; --s-love:#FDA4AF; --s-misc:#5EEAD4; --s-anti:#86EFAC; --l-relational:#FDA4AF; --l-faith:#FCD34D; --l-immortality:#F0ABFC; --l-sonship:#93C5FD; --l-postmil:#86EFAC; --l-preterist:#5EEAD4; color-scheme:dark }

:root:root[data-scheme="mono"]{ --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F1F1F1; --fg:#0A0A0A; --muted:#5B5B5B; --line:#DADADA; --accent:#0A0A0A; --accent-fg:#fff; --accent2:#E11D48; --glow:rgba(0,0,0,.07); --good:#166534; --bad:#BE123C; --s-intro:#737373; --s-ref:#404040; --s-grace:#0A0A0A; --s-super:#525252; --s-love:#E11D48; --s-misc:#404040; --s-anti:#166534; --l-relational:#E11D48; --l-faith:#0A0A0A; --l-immortality:#525252; --l-sonship:#262626; --l-postmil:#166534; --l-preterist:#404040; color-scheme:light }

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;transition:background .35s,color .35s;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.18;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.05rem;text-decoration:none;color:var(--fg);letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:30px;height:30px;flex:none}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.nav a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem;transition:background .2s,color .2s}
.nav a:hover{background:var(--surface2);color:var(--fg)}
.nav a.on{background:var(--accent);color:var(--accent-fg)}
.tools{display:flex;gap:6px;align-items:center}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.88rem}
.ibtn:hover{border-color:var(--accent)}
.ibtn svg{width:18px;height:18px}
@media (max-width:760px){ .nav{order:3;flex-basis:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none} .nav a{white-space:nowrap} .brand span.long{display:none} }

/* scheme popover */
.pop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;width:min(330px,calc(100vw - 32px));z-index:70}
.pop h4{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:700}
.sw.on{border-color:var(--accent)}
.sw .chips{display:flex;height:22px;border-radius:6px;overflow:hidden}
.sw .chips i{flex:1}

/* views */
main{min-height:70vh;padding-block:28px 80px}
.view{animation:viewIn .45s ease both}
@keyframes viewIn{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:10px 26px}
.hero h1{font-size:clamp(2.1rem,5.4vw,4rem);font-weight:900;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lede{font-size:1.12rem;color:var(--muted);margin-top:14px;max-width:58ch}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:22px}
.stat b{display:block;font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:800;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:hover{transform:translateY(-1px)}
@media (max-width:860px){ .hero{grid-template-columns:1fr} }

/* mind map */
.mapbox{position:relative;background:radial-gradient(circle at 50% 50%,var(--glow),transparent 65%);border-radius:24px}
.mapbox svg{width:100%;height:auto;display:block;max-width:100%}
.map-edge{fill:none;stroke:var(--line);stroke-width:1.6}
.map-edge.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.map-node{cursor:pointer;transition:transform .2s}
.map-node circle{transition:r .2s,stroke-width .2s}
.map-node:hover circle,.map-node:focus circle{stroke-width:5}
.map-node text{font-family:var(--font);font-weight:800;pointer-events:none}
.maptip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:8px 12px;font-size:.88rem;font-weight:700;max-width:90%;text-align:center;pointer-events:none;transition:opacity .2s}
.pulse{animation:pulse 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.06)}}

/* section blocks on home */
.sections{display:grid;gap:26px;margin-top:30px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sec-dot{width:14px;height:14px;border-radius:50%;flex:none}
.sec-head h2{font-size:1.35rem;font-weight:900}
.sec-head .count{margin-left:auto;font-size:.8rem;color:var(--muted);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden;min-width:0}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--c)}
.ccard .num{font-size:.74rem;font-weight:900;letter-spacing:.1em;color:var(--c);text-transform:uppercase}
.ccard h3{font-size:1.02rem;font-weight:800}
.ccard p{font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ccard .meta{display:flex;gap:10px;font-size:.74rem;color:var(--muted);font-weight:700;margin-top:auto}
.ccard::after{content:"";position:absolute;right:-30px;top:-30px;width:80px;height:80px;border-radius:50%;background:var(--c);opacity:.08;transition:transform .3s}
.ccard:hover::after{transform:scale(1.6)}

/* chapter page */
.band{border-radius:22px;padding:clamp(20px,4vw,40px);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));position:relative;overflow:hidden}
.band .big{position:absolute;right:clamp(8px,3vw,32px);top:-10px;font-size:clamp(6rem,16vw,12rem);font-weight:900;color:var(--c);opacity:.12;line-height:1;pointer-events:none;font-variant-numeric:tabular-nums}
.band h1{font-size:clamp(1.6rem,3.6vw,2.6rem);font-weight:900;max-width:24ch;position:relative}
.band .thesis{margin-top:14px;font-size:1.1rem;max-width:62ch;position:relative;font-weight:600}
.band .thesis::before{content:"Thesis";display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:900;margin-bottom:4px}
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;position:relative}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:800;background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:var(--c,var(--accent));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 35%,transparent);text-decoration:none;white-space:nowrap}
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:20;display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin:14px 0 4px;background:var(--bg);scrollbar-width:none}
@media (max-width:760px){.subnav{top:calc(env(safe-area-inset-top,0px) + 100px)}}
.subnav a{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:800;color:var(--muted);text-decoration:none}
.subnav a:hover{color:var(--fg);border-color:var(--c)}
.blk{margin-top:34px;scroll-margin-top:150px}
.blk>h2{font-size:1.3rem;font-weight:900;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.blk>h2 .n{font-size:.75rem;font-weight:800;color:var(--muted);background:var(--surface2);border-radius:999px;padding:2px 9px}
.summary{font-size:1.06rem;max-width:72ch}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}

/* flowchart */
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;counter-reset:f}
.fnode{position:relative;align-self:flex-start;max-width:min(560px,92%);padding:12px 16px 12px 52px;border-radius:14px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--line));font-weight:700;font-size:.95rem;box-shadow:var(--shadow);animation:fin .5s ease both;animation-delay:calc(var(--i) * 110ms)}
.fnode:nth-child(4n+3){align-self:center}
.fnode:nth-child(4n+5){align-self:flex-end}
.fnode::before{counter-increment:f;content:counter(f);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--bg);display:grid;place-items:center;font-size:.8rem;font-weight:900}
.farrow{height:30px;align-self:center;width:2px;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 30%,transparent));position:relative;animation:fin .4s ease both;animation-delay:calc(var(--i) * 110ms + 60ms)}
.farrow::after{content:"";position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top:7px solid var(--c);border-bottom:0}
.fnode.last{background:var(--c);color:var(--bg);border-color:var(--c)}
.fnode.last::before{background:var(--bg);color:var(--c)}
@keyframes fin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:640px){.fnode{align-self:stretch!important;max-width:none}}

/* outline tiles */
.acro{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:baseline}
.acro .word{font-size:clamp(1.8rem,5vw,3rem);font-weight:900;letter-spacing:.06em;color:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{perspective:1000px;min-height:190px;cursor:pointer;border:0;padding:0;background:none;text-align:left}
.tile .in{position:relative;width:100%;height:100%;min-height:190px;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.tile.flip .in{transform:rotateY(180deg)}
.tile .f,.tile .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.tile .f{background:var(--surface);border:1.5px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.tile .f .L{font-size:3.2rem;font-weight:900;line-height:1;color:var(--c)}
.tile .f h4{font-size:1rem;font-weight:800}
.tile .f small{margin-top:auto;font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tile .b{background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1.5px solid var(--c);transform:rotateY(180deg);font-size:.88rem}
.refs{display:flex;flex-wrap:wrap;gap:5px}
.ref{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--fg);white-space:nowrap;border:0;cursor:pointer}
.ref:hover{background:var(--accent);color:var(--accent-fg)}

/* argument cards */
.args{display:grid;gap:12px}
.arg{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .2s}
.arg[open]{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.arg summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.arg summary::-webkit-details-marker{display:none}
.arg .k{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:.85rem;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.arg h3{font-size:1rem;font-weight:800}
.arg .tgt{font-size:.78rem;color:var(--muted);font-weight:700;margin-top:2px}
.arg .chev{transition:transform .25s;color:var(--muted)}
.arg[open] .chev{transform:rotate(180deg)}
.arg .body{padding:0 16px 16px;display:grid;gap:12px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.vs{grid-template-columns:1fr}}
.side{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.93rem}
.side.book{background:var(--surface2)}
.side.resp{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.side .lbl{font-size:.7rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.side.resp .lbl{color:var(--accent)}
.lenses{display:flex;gap:5px;flex-wrap:wrap}
.lens{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px;color:var(--lc);background:color-mix(in srgb,var(--lc) 14%,transparent);border:1px solid color-mix(in srgb,var(--lc) 35%,transparent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chipbtn{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:.8rem;cursor:pointer;color:var(--muted)}
.chipbtn.on{background:var(--lc,var(--accent));border-color:var(--lc,var(--accent));color:var(--bg)}

/* Q&A */
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q .qq{font-weight:800;font-size:1.02rem;display:flex;gap:10px}
.q .qq::before{content:"?";flex:none;width:28px;height:28px;border-radius:50%;background:var(--c,var(--accent));color:var(--bg);display:grid;place-items:center;font-weight:900}
.q .ans{font-size:.92rem;border-left:3px solid var(--line);padding-left:12px}
.q .ans.r{border-color:var(--accent)}
.q .ans b{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.q .ans.r b{color:var(--accent)}
.reveal{align-self:flex-start;font-size:.8rem;font-weight:800;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}

/* criticisms */
.crit{display:grid;gap:12px}
.cr{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cr .who{padding:14px;background:color-mix(in srgb,var(--c) 10%,var(--surface2));font-weight:800;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.cr .who svg{width:26px;height:26px;color:var(--c)}
.cr .what{padding:14px;display:grid;gap:10px;font-size:.93rem}
.cr blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--c);background:var(--surface2);border-radius:0 8px 8px 0;font-style:italic}
@media (max-width:640px){.cr{grid-template-columns:1fr}}

/* stories */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative}
.story .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.story .ic svg{width:22px;height:22px}
.story h4{font-size:1rem;font-weight:800}
.story p{font-size:.9rem}
.story .pt{font-size:.85rem;font-weight:700;color:var(--c);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}

/* verses */
.verses{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.verse{border-radius:16px;padding:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 12%,var(--surface)),var(--surface));border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.verse .vr{font-weight:900;color:var(--c);font-size:.9rem}
.verse q{font-style:italic;font-size:1.02rem;quotes:"\201C" "\201D"}
.verse small{color:var(--muted);font-size:.84rem}

.overview{border-radius:18px;padding:20px;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--accent) 40%,var(--line));font-size:1.02rem}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1;min-width:220px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--fg);font-weight:800}
.pager a small{display:block;color:var(--muted);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}
.pager a.nx{text-align:right}

/* diagrams view */
.dgrid{display:grid;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,26px);min-width:0}
.panel>h2{font-size:1.3rem;font-weight:900;margin-bottom:4px}
.panel>p.sub{color:var(--muted);margin-bottom:16px;max-width:70ch}
.scales{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.scale{text-align:center;padding:10px;border-radius:16px;background:var(--surface2)}
.scale svg{width:100%;height:auto;max-width:100%}
.scale .beam{transform-origin:120px 62px;transform-box:view-box;animation:tilt 4s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(-7deg)}}
.scale h4{font-weight:900;margin-top:6px}
.scale p{font-size:.85rem;color:var(--muted)}
.hscroll{overflow-x:auto;max-width:100%}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:.85rem;font-weight:700;cursor:pointer;background:none;border:0;padding:2px 0;text-align:left}
.bar .t{height:18px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent2)));transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms)}
@keyframes grow{from{transform:scaleX(0)}}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar:hover .t i{filter:brightness(1.15)}
.matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;min-width:640px}
.matrix th,.matrix td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.matrix th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--surface)}
.matrix td:first-child{font-weight:900}
.matrix tr:hover td{background:var(--surface2)}
.sectionchart{display:flex;height:42px;border-radius:12px;overflow:hidden;margin:6px 0 10px}
.sectionchart a{display:grid;place-items:center;color:var(--bg);font-weight:900;font-size:.8rem;text-decoration:none;transition:flex .3s;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* scriptures/questions list */
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 14px;margin-bottom:16px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;padding:10px 0;color:var(--fg);outline:none}
.search svg{width:18px;height:18px;color:var(--muted)}
.hits{display:grid;gap:10px}
.hit{display:block;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg)}
.hit:hover{border-color:var(--accent)}
.hit small{display:block;color:var(--muted);font-weight:700;font-size:.76rem}
mark{background:color-mix(in srgb,var(--accent2) 40%,transparent);color:inherit;border-radius:3px}

/* lens wheel & primers (answers app) */
.lensgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.lcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--lc);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lcard h3{font-size:1.15rem;font-weight:900;color:var(--lc)}
.lcard ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.92rem}
.lcard svg{width:100%;height:auto;max-width:100%}
.wheel text{font-family:var(--font);font-weight:800}
.spin{animation:spin 60s linear infinite;transform-origin:200px 200px;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.wheel .seg{cursor:pointer;transition:opacity .2s}
.wheel .seg:hover{opacity:.85}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:90;box-shadow:var(--shadow)}
footer{border-top:1px solid var(--line);padding-block:26px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

      <button class="ibtn" id="schemeBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-1.2-1-1.4-1-2.5 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4-4-7.3-9-7.3Z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/></svg><span>Colours</span></button>

<script>
window.MODE = "answer";
window.DATA = {"chapters":[{"num":7,"section":"Hyper-Grace","title":"The Hyderabad Disha Rapists' Punishment and Its Connection to a Hyper-Grace Cult's Claim","summary":"The author opens with the 2019 Hyderabad rape-murder of a young veterinarian (called 'Disha'), whose four accused were killed by police days later in a widely celebrated 'encounter'. He uses it to stress again that God's judgment does not stop after the Cross. Hell is a far greater punishment than a police encounter for unrepentant Christ-rejecters, and Jesus warned that believers who persist in 'raping-in-the-mind' (lust, Matt 5:28-29), such as choosing OTT shows for their obscenity, face the same punishment. Quoting Heb 12:25, he argues New Covenant believers will be judged more severely than those under Moses. Punishment is cancelled only for those who keep abiding in Christ (Rom 8:1; John 15). Otherwise it is 'stored up' (Rom 2:4-5) for Judgment Day (Rev 20:15) or sometimes carried out earlier, as with Ananias and Sapphira, Herod, careless communion-takers and Jezebel.","thesis":"God's punishment did not end at the Cross: unrepentant sin, including a believer's persistent lust, stores up wrath that will be executed at judgment or even before it.","outline":{"acronym":"OTT","items":[{"letter":"O","label":"Obscenity","point":"Believers who choose streaming shows for obscene content are feeding lust, which Jesus treats as adultery of the heart.","refs":["Matt 5:28-29"]},{"letter":"T","label":"Titillation","point":"Watching for sexual titillation is 'raping-in-the-mind', a sin that brings the same hell-punishment if persisted in.","refs":["Matt 5:28-29"]},{"letter":"T","label":"Topless bits","point":"Picking shows for nudity shows lust driving choices; the call is self-reflection and repentance.","refs":["Heb 12:25"]}]},"claims":[{"claim":"Hell is far worse than the swift police 'justice' given to the rapists","detail":"The rapists of the Disha case were reportedly shot four days after the crime, and many celebrated it as swift justice. The author argues that hell, the punishment for stubbornly unrepentant Christ-rejecters, is much more severe than any police encounter.","refs":["Rev 20:15"],"target":"The idea that judgment has ended since the Cross","response":{"text":"Anyone who feels horror and grief at what was done to this young woman shares something of God's own heart. God's wrath is not cold. It is his burning love set against everything that destroys his beloved creatures, and he cannot be indifferent to violence like this. Where the relational gospel view differs is in how God answers evil. Scripture shows him defeating it at its root, not simply out-punishing human vengeance. At the Cross Christ 'condemned sin in the flesh' (Rom 8:3) and took the full weight of humanity's darkness into himself. The 'swift justice' crowds celebrated was an extrajudicial killing, and comparing God's judgment to it risks drawing God in the image of our anger. His judgment sets things right (Ps 96:13). The fire that awaits evil is the holy love of God (Heb 12:29), which will burn away everything false.","lenses":["relational"],"refs":["Rom 8:3","Ps 96:13","Heb 12:29"]}},{"claim":"Believers persisting in lust face the same punishment as the rapists","detail":"Jesus said lust is adultery in the heart and warned that it is better to lose an eye than for the whole body to go to hell (Matt 5:28-29). So believers who stubbornly indulge 'mental rape', for example by picking OTT shows for obscenity, titillation and nudity, are headed for the same hell as the rapists.","refs":["Matt 5:28-29"],"target":"Believers' sins carry no eternal consequence","response":{"text":"Jesus' words on lust are a serious call to purity of heart, and both sides agree that pornography and lustful entertainment harm people and dishonour them. But in Matt 5:29 Jesus speaks of Gehenna, the Valley of Hinnom outside Jerusalem. To his hearers it recalled Jeremiah's warnings (Jer 7:31-34), and within a generation it became the scene of Jerusalem's destruction. His point is that inner lust is as deadly as outward adultery, which levels the ground so that no one can boast. It does not set up a scale on which a struggling disciple equals a murderer. A son or daughter who struggles is disciplined by the Father as a beloved child (Heb 12:6) and not disowned. Freedom from lust comes from knowing our identity in Christ (Rom 6:11), and fear of hell does not produce it.","lenses":["preterist","sonship","relational"],"refs":["Jer 7:31-34","Heb 12:6","Rom 6:11"]}},{"claim":"New Covenant believers will be punished more severely than Old Covenant Israel","detail":"Citing Heb 12:25 (NLT), the author says that if Israel did not escape when they refused Moses, we will certainly not escape if we reject the One who speaks from heaven. This should lead to self-reflection and repentance, and it refutes the claim that punishment stopped at the Cross.","refs":["Heb 12:25"],"target":"Punishment stopped under the New Covenant","response":{"text":"Heb 12:25 is written to Hebrew Christians who were tempted to go back to temple sacrifices. It sits inside a contrast between Sinai and Zion, the old covenant and the new (Heb 12:18-24). The 'shaking' that follows (Heb 12:26-27) is the removal of the old order, which the writer says is 'ready to vanish away' (Heb 8:13). That happened when the temple fell in AD 70. The warning is serious: anyone who turns from Christ back to the shadows loses the only true refuge. But it is a warning against rejecting the Son, not against believers who stumble. The same chapter calls them sons whom the Father disciplines in love (Heb 12:7-10) and says they have come to 'Jesus, the mediator of a new covenant' whose blood 'speaks a better word' than Abel's (Heb 12:24).","lenses":["preterist","sonship"],"refs":["Heb 12:18-24","Heb 12:26-27","Heb 8:13","Heb 12:24"]}},{"claim":"No condemnation applies only to those who continually abide in Christ","detail":"Rom 8:1 and John 15 show that punishment is lifted only for those who continuously remain in Christ. Those who do not abide are not exempt.","refs":["Rom 8:1","John 15:1-6"],"target":"Unconditional no-condemnation for all believers","response":{"text":"Abiding matters greatly, and Jesus' vine imagery is precious. But Rom 8:1 rests on what God has done, not on how well we perform at abiding: 'in Christ' is where God placed us (1 Cor 1:30). Paul goes straight on to say that 'God did what the law could not do' (Rom 8:3), and he ends the chapter by saying that nothing can separate us from God's love (Rom 8:38-39). In John 15 the branch does not make itself part of the vine. Jesus says, 'You are already clean' (John 15:3), and 'abide' means resting in a union that already exists. In the relational gospel view, abiding is waking up to and enjoying that union, not a condition we have to keep meeting to avoid wrath. Holiness grows from that rest.","lenses":["relational","sonship"],"refs":["1 Cor 1:30","Rom 8:3","Rom 8:38-39","John 15:3"]}},{"claim":"Punishment is being stored up for the Day of Judgment","detail":"Rom 2:4-5 speaks of storing up wrath for the day of wrath. The author says punishment is stored for execution on Judgment Day (Rev 20:15), or before it if God chooses.","refs":["Rom 2:4-5","Rev 20:15"],"target":"No future judgment for believers","response":{"text":"Rom 2 is addressed to the person who judges others while doing the same things (Rom 2:1-3). Paul's aim is to show that Jew and Gentile alike stand in need, which leads to his announcement of God's righteousness revealed in Christ (Rom 3:21-26). Even in Rom 2:4 God's kindness, not his threat, is what 'leads you to repentance'. Repentance (metanoia) is a change of mind about who God is. Wrath is real, but in Scripture it is God's love standing against the self-destruction we choose (Rom 1:24, 'God gave them up'). The final judgment is still future, and it will be carried out by Jesus, the one who died for the world (John 5:22). Believers have a judge who is also their advocate (1 John 2:1-2), so they need not live in fear of a stockpile of wrath.","lenses":["relational","preterist"],"refs":["Rom 2:1-3","Rom 3:21-26","Rom 1:24","John 5:22","1 John 2:1-2"]}},{"claim":"God sometimes executes punishment before Judgment Day","detail":"God in his sovereignty punished people before the final day: Ananias and Sapphira (Acts 5), Herod (Acts 12), careless communion-takers (1 Cor 11) and Jezebel and her companions (Rev 2).","refs":["Acts 5:1-11","Acts 12:23","1 Cor 11:29-32","Rev 2:20-23"],"target":"God never judges believers in this age","response":{"text":"These are sobering passages, and they show that God takes the integrity of his people seriously. Read closely, though, they do not support the idea of ongoing threats over believers. Herod was a persecuting king, not a believer. Paul says the Corinthian judgment was so that 'we will not be condemned along with the world' (1 Cor 11:32). It was a father's discipline that protected them from final ruin, not a sign of rejection. In Rev 2 Jesus gave Jezebel 'time to repent' (Rev 2:21), which shows patient love. Acts 5 is a unique moment at the founding of the church, and Scripture does not present it as a pattern. The God shown in these texts disciplines as a Father (Heb 12:10), always for our good, 'that we may share his holiness'.","lenses":["sonship","relational"],"refs":["1 Cor 11:32","Rev 2:21","Heb 12:10"]}}],"questions":[{"q":"Are you enjoying OTT shows for their obscenity, titillation and topless bits?","answer":"If lust drives our entertainment choices, we are committing 'raping-in-the-mind', which Jesus warned leads to hell. We must repent.","response":"It is a good question to ask ourselves, because what we feed on shapes us. The answer, though, is not fear of being treated like a murderer. It is remembering who we are: those who have been 'washed' and are temples of the Spirit (1 Cor 6:11,19). A beloved son learns to turn away from what cheapens him because he knows his worth, and grace trains us to say no (Titus 2:11-12)."},{"q":"Did you know that New Covenant believers will be punished more severely than those under the law of Moses?","answer":"Yes. Heb 12:25 says that if Israel did not escape when they rejected Moses, we will certainly not escape if we reject the One speaking from heaven.","response":"Hebrews warns against rejecting Christ and going back to the old temple system, and that system fell in AD 70. The 'greater' accountability belongs to people who turn away from the Son. It does not mean God becomes harsher toward his children. The same chapter says we have come to a 'better word' than Abel's blood (Heb 12:24): the blood of Jesus speaks mercy, not vengeance."},{"q":"Stored punishment? Can God punish before the Day of Judgment?","answer":"Yes. God stores up wrath (Rom 2:4-5) for the final day, but he may act earlier, as in Acts 5, Acts 12, 1 Cor 11 and Rev 2.","response":"God does act in history, but Scripture presents his discipline of his children as correction 'so that we will not be condemned' (1 Cor 11:32). His kindness is meant to lead us to repentance (Rom 2:4). It is not a countdown to destruction."}],"criticisms":[{"of":"Hyper-Grace teachers generally","quote":"","critique":"They teach that under the New Covenant punishment has stopped altogether because of the Cross. The author says Hebrews and Romans show judgment continues for the unrepentant.","response":"Most grace teachers do not deny that sin has consequences or that there will be a final judgment. Their point is that the punishment our sin deserved fell on Christ, and that God now relates to his children as a Father, not as a prosecutor. Scripture says 'there is no fear in love' (1 John 4:18), and believers can have 'confidence for the day of judgment' (1 John 4:17). The real disagreement is over whether the Cross dealt with sin completely, not whether sin matters."}],"illustrations":[{"title":"The Disha rape-murder and police encounter","story":"In November 2019 a 26-year-old vet in Hyderabad was lured by truck workers who had deliberately punctured her tyre, then raped, smothered and burned. On December 6 police shot the four accused dead, and many celebrated it as 'swift justice'.","point":"Hell is a far greater punishment than any human justice, and believers who persist in lust face the same judgment."},{"title":"OTT acronym","story":"Streaming platforms like Amazon Prime, Netflix and Hotstar carry shows chosen for 'O' obscenity, 'T' titillation and 'T' topless bits.","point":"Choosing entertainment driven by lust is mental adultery that calls for repentance."}],"keyVerses":[{"ref":"Matt 5:28-29","text":"Anyone who looks at a woman lustfully has already committed adultery with her in his heart","use":"Lust is 'raping-in-the-mind' and leads to hell if persisted in"},{"ref":"Heb 12:25","text":"We will certainly not escape if we reject the One who speaks to us from heaven","use":"New Covenant believers face more severe judgment"},{"ref":"Rom 8:1","text":"There is now no condemnation for those who are in Christ Jesus","use":"No condemnation only for those who keep abiding"},{"ref":"Rom 2:4-5","text":"You are storing up wrath for yourself on the day of wrath","use":"Punishment is stored for later execution"},{"ref":"Rev 20:15","text":"Anyone not found written in the book of life was thrown into the lake of fire","use":"Stored punishment executed on Judgment Day"}],"flow":["Disha case: rapists killed in swift police encounter","Hell is a far greater punishment than that","Jesus: persistent lust leads to the same hell","Heb 12:25: New Covenant judgment is more severe","No condemnation only for those abiding in Christ","Wrath is stored for Judgment Day or earlier","Examples: Ananias, Herod, Corinth, Jezebel"],"responseOverview":"App 2: The chapter rightly feels the moral horror of violent crime and rightly calls believers to take lust seriously. But it draws God's justice in the image of a police 'encounter' that was itself extrajudicial and only reportedly 'swift'. It then puts a struggling believer on the same eternal footing as unrepentant rapists. The relational gospel view sees God's wrath as love opposing what destroys us. It holds that the Cross dealt with sin at its root (Rom 8:3) and that freedom from lust grows out of identity and union with Christ (Rom 6:11). Threat does not produce it. Read in context, Heb 12:25 warns against abandoning Christ for the passing temple order, which was 'shaken' in AD 70. The examples of earlier judgment are mostly cases of fatherly discipline 'so that we will not be condemned' (1 Cor 11:32). The author misreads grace teachers when he says they deny that sin matters. They locate the punishment for sin in Christ and call believers to holiness as sons, not as defendants waiting for a verdict."},{"num":8,"section":"Hyper-Grace","title":"Should We Repent from Preaching on Repentance as Hyper-Grace Preachers Want Us To?","summary":"The author answers a New Zealand-based Hyper-Grace blogger who wrote an article giving three reasons why he does not preach repentance. He tells of a 2012 national Pentecostal youth conference: he preached from Proverbs 7 and 1,700 youth responded to his altar call, then a later speaker said believers need not repent because of 2 Cor 5:21 and that the Spirit does not convict believers. The author answers that 2 Corinthians itself calls believers to repent (2 Cor 7:10; 12:21; 6:1). James 4:4 shows the Spirit convicts worldly believers, five of the seven churches in Revelation were told to repent, and Jesus, Philip and Paul combined grace with calls to repent. The incestuous man of 1 Cor 5 was called 'evil', excommunicated, repented, and was restored (2 Cor 2:5-8). The author also argues Hyper-Grace is self-defeating, since its followers call him to repent of attacking it. He closes with approving quotes from Billy Graham on repentance, hell and sin.","thesis":"Repentance must keep being preached to believers, because Scripture repeatedly calls the righteous in Christ to turn from sin, and the Holy Spirit does convict them.","outline":null,"claims":[{"claim":"2 Cor 5:21 does not cancel calls to repent in the same letter","detail":"The same letter that calls believers 'the righteousness of God' demands godly sorrow leading to repentance (2 Cor 7:10) and grieves over unrepentant sexual sin (2 Cor 12:21). Read with 2 Cor 6:1, the message is that God's grace must enable believers to overcome sin, or they have received grace in vain.","refs":["2 Cor 5:21","2 Cor 6:1","2 Cor 7:10","2 Cor 12:21"],"target":"No repentance needed because believers are always righteous","response":{"text":"Both sides agree that 2 Corinthians calls believers to change. The question is what grounds that call. In 2 Cor 5:14-19 Paul says 'one died for all, therefore all died', and that God was 'reconciling the world to himself, not counting their trespasses against them'. His appeal 'be reconciled to God' (5:20) and his urging not to receive grace in vain (6:1) invite people to live out what God has already made true. They are not conditions for keeping righteousness. 'Godly sorrow' in 2 Cor 7:10 leads to metanoia, a change of mind, and Paul says it is 'without regret'. So repentance is welcome in the relational view. It is the believer's ongoing turning toward the truth about who God is and who we are in Christ. It does not repair a status that has been lost.","lenses":["relational","sonship"],"refs":["2 Cor 5:14-19","2 Cor 5:20","2 Cor 7:10"]}},{"claim":"The Holy Spirit does convict believers of sin","detail":"John 16:8 says the Spirit convicts the world, but that does not mean he does not convict believers. James, written to believers, calls the worldly 'adulterous people' and enemies of God (Jas 4:4), so the Spirit convicts worldly believers.","refs":["John 16:8","Jas 4:4"],"target":"The Spirit never convicts believers of sin","response":{"text":"The Spirit certainly stirs believers when they wander. The faith perspective would describe how he does it. In John 16:8-11 he convicts the world 'of sin, because they do not believe in me' and 'of righteousness, because I go to the Father'. Toward believers his main work is to convince us of righteousness, reminding us who we are (Rom 8:16, 'the Spirit bears witness that we are children of God'). When we act out of character, the Spirit's correction feels like a Father saying 'that is not you', not like a condemning verdict. Jas 4:4 is a strong rebuke, but James immediately says 'he gives more grace' and promises 'draw near to God and he will draw near to you' (Jas 4:6-8). Conviction that leads to shame and fear is not the Spirit's voice (Rom 8:15).","lenses":["faith","sonship"],"refs":["John 16:8-11","Rom 8:16","Jas 4:6-8","Rom 8:15"]}},{"claim":"Jesus told five of seven churches in Revelation to repent","detail":"Jesus called Ephesus, Pergamum, Thyatira, Sardis and Laodicea to repent (Rev 2:5,16,21-22; 3:3,19). So grace must be preached along with repentance.","refs":["Rev 2:5","Rev 2:16","Rev 2:21-22","Rev 3:3","Rev 3:19"],"target":"No repentance preaching to churches","response":{"text":"These letters are a real call for churches to change direction, and pastors should feel free to speak like this. Two things put them in context. First, the letters address first-century churches facing events 'that must soon take place' (Rev 1:1), and the 'coming' to remove a lampstand (Rev 2:5) is a historical visitation on a congregation, not a threat of hell for individual Christians. Second, the call to Laodicea begins 'Those whom I love, I reprove and discipline' (Rev 3:19), followed by Christ knocking to share a meal (3:20). The repentance Jesus asks of churches is an invitation back into fellowship with him. Preaching repentance that way, as a turning toward his love, fits the gospel of grace.","lenses":["preterist","relational","sonship"],"refs":["Rev 1:1","Rev 3:19-20"]}},{"claim":"Jesus combined grace and a call to repent in John 5","detail":"Jesus healed the man invalid for 38 years and later told him to stop sinning or something worse might happen (John 5:14). In one chapter he showed grace and called for repentance, and so must we.","refs":["John 5:5-9","John 5:14"],"target":"Grace without a call to holiness","response":{"text":"John 5 shows the right order: Jesus healed first, without asking for repentance or even faith, since the man did not know who he was (5:13). Grace came first. The warning came afterward, from a friend who had already shown him favour. The 'something worse' is unspecified and need not mean hell. In the Gospels, sin's destructive results in this life are real. The faith perspective notes that healing was given freely, as it was to 'all who came' (Matt 8:16). The relational view adds that the call to 'sin no more' is the natural response to grace already received. Preaching like Jesus means leading with the Father's goodness and then inviting people to live in it.","lenses":["faith","relational"],"refs":["John 5:13","Matt 8:16"]}},{"claim":"Philip preached grace and called Simon the Sorcerer to repent","detail":"Philip preached the good news to Simon (Acts 8:12), yet when Simon tried to buy God's gift he was told to repent (Acts 8:21-23). The early church preached both.","refs":["Acts 8:12","Acts 8:21-23"],"target":"Grace preaching that never calls for repentance","response":{"text":"It was actually Peter, not Philip, who rebuked Simon (Acts 8:20). Either way the example is a good one. Simon was still 'in the gall of bitterness' (8:23). He was trying to use God's power as a commodity, which shows he had not yet changed his mind about who God is. Repentance in the relational sense is exactly this: giving up a transactional picture of God in which gifts can be bought or earned, and receiving him as the giver. That is also why grace preachers resist preaching that turns repentance into a payment made to stay forgiven. It would repeat Simon's mistake in another form.","lenses":["relational"],"refs":["Acts 8:20","Acts 8:23"]}},{"claim":"Paul called the incestuous Corinthian an 'evil person', not righteous","detail":"The Corinthians were arrogant about a man sleeping with his (step)mother. Paul called him evil (1 Cor 5:13) and ordered him excommunicated so that he might be saved in the day of the Lord (1 Cor 5:5). If Paul were Hyper-Grace he would have called him righteous.","refs":["1 Cor 5:1-2","1 Cor 5:5-6","1 Cor 5:13"],"target":"Sinning believers still called righteous","response":{"text":"Paul takes this sin seriously, and so should we. But look at his goal: 'so that his spirit may be saved in the day of the Lord' (1 Cor 5:5). Even the severest church discipline aims at salvation. In 5:13 Paul quotes the Deuteronomy formula 'purge the evil person', a phrase about community discipline, and it is not a ruling on the man's standing before God. In the same letter Paul calls the deeply flawed Corinthians 'sanctified in Christ Jesus' (1 Cor 1:2), and he roots his ethic in identity: 'you were washed... you are not your own' (6:11,19). The relational view agrees with Paul that a person's behaviour can contradict who they are in Christ, and that loving discipline confronts that contradiction to restore them.","lenses":["relational","sonship"],"refs":["1 Cor 5:5","1 Cor 1:2","1 Cor 6:11","1 Cor 6:19"]}},{"claim":"The disciplined man repented and was restored (2 Cor 2:5-8)","detail":"Following scholars, the author identifies the man in 2 Cor 2 with the man of 1 Cor 5. He repented through 'godly grief' (2 Cor 7:10), but 'hyper-discipline' folk would not receive him, so Paul urged forgiveness, comfort and reaffirmed love. He was therefore saved.","refs":["2 Cor 2:5-8","2 Cor 7:10"],"target":"Repentance is unnecessary for believers","response":{"text":"This is a lovely example of restoration, and the author's warning against 'hyper-discipline' is wise. Many scholars question whether 2 Cor 2 refers to the same man, but the principle holds either way. Paul's pastoral instinct leaned toward comfort, so that the man would not be 'overwhelmed by excessive sorrow'. The sonship view sees here how the Father treats his children: discipline is never disowning. The prodigal is met with a robe and a ring before he finishes his speech (Luke 15:20-22). Restoration, not punishment, is the goal of every loving rebuke (Gal 6:1).","lenses":["sonship","relational"],"refs":["Luke 15:20-22","Gal 6:1"]}},{"claim":"Hyper-Grace is philosophically self-defeating","detail":"Hyper-Grace proponents say there is no need to preach repentance since God sees believers as righteous, yet they comment on the author's social media urging him to repent of attacking Hyper-Grace. By calling him to change, they contradict their own claim that he remains God's righteousness no matter what.","refs":["2 Cor 5:21"],"target":"Hyper-Grace's 'no need to repent' stance","response":{"text":"The argument only works against a caricature. Grace teachers do not say 'no one should ever change their mind or conduct'. They say a believer's standing before God does not depend on repenting enough. Inviting a brother to rethink a teaching (metanoia, literally 'change of mind') is fully consistent with believing he is righteous in Christ. Paul did exactly this with the Galatians, whom he still called 'brothers' (Gal 1:11; 6:1). Correcting someone's views assumes he is family, not that he is lost. So these online appeals do not show a contradiction. Both sides want each other to see the truth more clearly, which is why respectful dialogue matters.","lenses":["relational","sonship"],"refs":["Gal 1:11","Gal 6:1"]}},{"claim":"Preachers like Billy Graham boldly preached repentance and hell","detail":"The author admires Billy Graham, who did not water down the gospel. He quotes Graham: repent immediately when you fail, since sin breaks fellowship; no one spoke about hell more than Jesus; Gal 5:19-21 is the most serious warning to those who sin that grace may abound; take sin seriously and fight its power.","refs":["Gal 5:19-21"],"target":"Pulpits silent on repentance and hell","response":{"text":"Many grace believers also honour the evangelist's courage and integrity. They would note his own distinction: sin breaks fellowship, the enjoyment of relationship, not sonship. That is the relational view exactly. Gal 5:19-21 describes 'works of the flesh' that are incompatible with the kingdom life. But Paul's answer in the same passage is 'walk by the Spirit' (5:16) and the fruit of the Spirit (5:22-23), not anxious vigilance. Jesus did speak often about Gehenna, and in its historical setting those warnings pointed to the coming ruin of Jerusalem (Matt 23:33-36). Taking sin seriously means taking its destructive power seriously and taking the Spirit's power to free us more seriously still.","lenses":["relational","preterist"],"refs":["Gal 5:16","Gal 5:22-23","Matt 23:33-36"]}}],"questions":[{"q":"Should we repent from preaching on repentance, as Hyper-Grace preachers want us to?","answer":"Of course not. The Bible repeatedly calls believers to repent, and the incestuous Corinthian shows repentance leads to salvation.","response":"Keep preaching repentance, but preach it as the Bible defines it: metanoia, a change of mind toward God's goodness. God's kindness leads us there (Rom 2:4). Repentance is how we take hold of grace, not a way of earning it."},{"q":"Does not the Holy Spirit convict believers of sin?","answer":"He does. James 4:4 rebukes worldly believers, so the Spirit convicts believers who become worldly.","response":"Yes. The Spirit corrects us as a loving Father would. But his chief witness to believers is about our sonship (Rom 8:16) and righteousness (John 16:10), so his correction never feels like rejection."}],"criticisms":[{"of":"A New Zealand-based Hyper-Grace blogger (author of five pro-Hyper-Grace books, on a 'top 100 Christian blogs' list)","quote":"Three Reasons Why I Don't Preach On Repentance ('Turn from Sin')","critique":"The author calls this totally anti-biblical, since Scripture repeatedly calls believers to repent.","response":"The blogger's point concerns the definition of repentance. The New Testament word means a change of mind, and the grace view preaches it as turning to Christ in faith, after which transformation follows. Defining repentance as 'turning from sin' can make it a work that precedes grace. Many grace writers still call people to forsake sin. They place it as the fruit of repentance rather than its definition (Matt 3:8)."},{"of":"An American preacher of Indian origin at a 2012 national Pentecostal youth conference","quote":"There is no need to repent because according to 2 Corinthians 5:21 all believers are always the righteousness of God; the Holy Spirit does not convict believers of sin.","critique":"After 1,700 youth had responded to an altar call, he effectively told them repentance was unnecessary, 'poisoning' them with 'hell-populating poison'. This incident motivated the author to write the book.","response":"Contradicting another speaker's altar call at the same event was pastorally unwise. But his underlying point, that believers' righteousness rests on Christ (2 Cor 5:21), is apostolic truth. The better answer is to teach both together: you are righteous, so walk in it (Eph 4:1, 24). Young people are set free by knowing their identity, which gives repentance a joyful home rather than a fearful one."},{"of":"Hyper-Grace proponents commenting on the author's social media","quote":"","critique":"They urge him to repent of attacking Hyper-Grace, contradicting their own 'always righteous' philosophy.","response":"Asking someone to reconsider a doctrinal view does not deny that he belongs to God. It assumes he is family. Correction among brothers is part of grace, not a contradiction of it (Gal 6:1)."},{"of":"Modern pulpits generally","quote":"","critique":"Pulpits rarely mention 'repent' or 'hell' any more.","response":"Many churches have rightly turned away from fear-based preaching. The answer is not to bring back terror but to preach the full beauty of God's love and the real harm sin causes. Love itself opposes sin (Rom 12:9)."}],"illustrations":[{"title":"The 2012 national youth conference","story":"The author preached from Proverbs 7 on the young man and the married seductress, and youth came forward confessing sins. That evening another preacher told them that repentance was unnecessary.","point":"Hyper-Grace undermines genuine repentance, and this incident drove the author to write the book."},{"title":"The man who slept with his mother","story":"The Corinthian church boasted about a man living with his stepmother. Paul ordered him excommunicated, and the man later repented and was restored.","point":"Discipline aims at repentance and salvation, and sinning believers are not called 'righteous'."},{"title":"Hyper-Discipline","story":"Some in Corinth would not receive back the repentant man, and Paul had to urge forgiveness and comfort.","point":"Repentance must be met with restoration and love."},{"title":"Social-media critics","story":"Hyper-Grace followers comment urging the author to stop attacking Hyper-Grace.","point":"They preach repentance to him, contradicting their own theology."},{"title":"Billy Graham's photo in a hostel room","story":"The author kept Billy Graham's picture in his engineering college hostel in the 1990s and still draws inspiration from him.","point":"A great evangelist preached repentance and hell without watering down the gospel."}],"keyVerses":[{"ref":"2 Cor 6:1","text":"We urge you not to receive God's grace in vain","use":"Read with 5:21: the righteous must use grace to overcome sin"},{"ref":"2 Cor 7:10","text":"Godly sorrow brings repentance that leads to salvation","use":"Repentance is required of believers"},{"ref":"2 Cor 12:21","text":"Many who have sinned earlier and have not repented of the impurity","use":"Paul grieved over unrepentant believers"},{"ref":"Jas 4:4","text":"You adulterous people... friendship with the world means enmity against God","use":"The Spirit convicts worldly believers"},{"ref":"John 5:14","text":"Stop sinning or something worse may happen to you","use":"Jesus joined grace with a call to repent"},{"ref":"1 Cor 5:13","text":"Expel the wicked person from among you","use":"Sinning believers are called evil, not righteous"},{"ref":"2 Cor 2:5-8","text":"Turn to forgive and comfort him... reaffirm your love for him","use":"The repentant man was restored and saved"},{"ref":"Gal 5:19-21","text":"Those who practise such things shall not inherit the kingdom of God","use":"Serious warning to those who sin that grace may abound"}],"flow":["Blogger refuses to preach repentance","Youth conference: preacher cancels repentance call","2 Cor 5:21 must be read with 6:1, 7:10, 12:21","Spirit convicts worldly believers (Jas 4:4)","Jesus and apostles combined grace with repentance","Corinthian sinner called evil, disciplined, repented, restored","Hyper-Grace contradicts itself by calling author to repent","Billy Graham quotes affirm repentance and hell"],"responseOverview":"App 2: The chapter is right that repentance belongs in Christian preaching. Paul, James and Jesus all call believers to turn and change. Its main misreading is to assume grace teachers reject repentance altogether. Most redefine it biblically as metanoia, a change of mind about God and ourselves, and see moral change as its fruit, not a condition for staying righteous. The relational gospel view reads 2 Cor 5:21 and 6:1 together, as the author does, but in the light of 5:14-19: God has already reconciled the world in Christ, and the appeal is to live in what is true. The incestuous man, the Laodicean church and the healed invalid all show discipline and warning in the service of restoration and fellowship. The 'self-defeating' argument fails because calling a brother to change his mind assumes family relationship rather than denying it. Preach repentance boldly, as the joyful turning of sons and daughters toward their Father's goodness."},{"num":9,"section":"Hyper-Grace","title":"The Famous Bishop and the Candlesticks Story and the Flawed Hyper-Grace False Teaching","summary":"The author retells 'The Bishop's Candlesticks': a generous bishop takes in a hardened convict, who then steals his treasured silver candlesticks. When police bring the man back, the bishop says he gave them freely, adds them as a gift, blesses him and helps him escape, and the convict is reformed. The author says this story shows true biblical grace against Hyper-Grace. Because Jesus took our punishment, gratitude makes us turn from sin daily, and grace teaches us to say no to ungodliness (Titus 2:12). Habitual sin shows a lack of gratitude for the Cross and marks a person as one who will not 'endure to the end' and so will not be saved (Matt 24:13).","thesis":"True grace, like the bishop's mercy to the convict, produces grateful transformation, and those who keep living in sin show they do not value the Cross and will not be saved.","outline":null,"claims":[{"claim":"The Bishop's Candlesticks illustrates true grace, not Hyper-Grace","detail":"The bishop's undeserved mercy toward the convict reformed him. Likewise the Cross, where Jesus took our punishment, moves the grateful believer to turn away from sin day by day.","refs":["Titus 2:12"],"target":"Grace that does not transform","response":{"text":"This story is a wonderful picture of grace, and grace teachers love it too. Notice what happened: the bishop did not make his mercy conditional on the convict's future behaviour. He gave it fully before any change, and that undeserved gift transformed the man. This is exactly the relational gospel's point. God's love in Christ came to us 'while we were still sinners' (Rom 5:8), and grace that is unconditional and complete is what changes the heart. If the bishop had added, 'and if you steal again, the police will have you', the story would lose its power. Titus 2:11-12 says grace itself is the teacher. Transformation follows from grace received, not from the threat of losing it.","lenses":["relational"],"refs":["Rom 5:8","Titus 2:11-12"]}},{"claim":"Gratitude for the Cross leads to daily turning from sin","detail":"Because Jesus took our punishment, we turn away from sin out of genuine gratitude day by day. Grace, symbolised by the Cross, teaches us to say no to ungodliness and worldly passions.","refs":["Titus 2:11-12"],"target":"Grace as licence","response":{"text":"Both sides agree here. A heart that has seen the Cross responds with love and change. The relational view would only add that the Cross does more than earn our gratitude. It includes us. 'One died for all, therefore all died' (2 Cor 5:14), and our old self was crucified with him (Rom 6:6). Daily turning from sin is not only a debt of thanks we try to repay. It is the expression of a new life that is really ours in union with Christ (Gal 2:20). Gratitude is beautiful, but union is the deeper root. When believers know they died and rose with Christ, saying 'no' to sin becomes saying 'yes' to who they truly are.","lenses":["relational","sonship"],"refs":["2 Cor 5:14","Rom 6:6","Gal 2:20"]}},{"claim":"Habitual sin shows ingratitude and failure to endure, so no salvation","detail":"Living in habitual sin shows we are not truly grateful for the Cross and that we are among those who do not endure to the end. Jesus said such people will not be saved (Matt 24:13), and Hyper-Grace teachers who say otherwise are leading people to a shock on Judgment Day.","refs":["Matt 24:13"],"target":"Eternal security regardless of lifestyle","response":{"text":"Matt 24:13 belongs to the Olivet Discourse, where Jesus answers his disciples' question about the temple's destruction (24:1-3). He says 'this generation will not pass away until all these things take place' (24:34). Enduring 'to the end' meant holding fast through the persecutions and false messiahs before AD 70. Those who did were 'saved' from the catastrophe by fleeing Judea (24:16), as historians record the Christians did. It is not a general statement that strugglers lose eternal life. Habitual sin is still deeply harmful, and a believer caught in it needs help, but the remedy is to see grace more clearly, not to doubt it. The Father who began the work promises to complete it (Phil 1:6).","lenses":["preterist","sonship"],"refs":["Matt 24:1-3","Matt 24:34","Matt 24:16","Phil 1:6"]}}],"questions":[{"q":"If we live in habitual sin, are we truly grateful for the Cross?","answer":"No. Habitual sin shows a lack of gratitude and puts us among those who will not endure and will not be saved.","response":"Ongoing sin shows we have not yet fully seen what the Cross means. The answer is a fuller revelation of grace and our union with Christ. Threats do not heal the heart; love does (2 Cor 3:18)."}],"criticisms":[{"of":"Hyper-Grace teachers generally","quote":"","critique":"They tell people that those living in habitual sin will still be saved, and their followers will be shocked on the Final Judgment Day.","response":"Grace teachers would say salvation rests on Christ's faithfulness, not on our endurance record, and that genuine grace produces change over time. They do not tell people sin is fine. They say the cure for sin is more grace, not less (Rom 5:20-6:2)."}],"illustrations":[{"title":"The Bishop and the Candlesticks","story":"A kind bishop feeds and shelters a rough convict who steals his mother's silver candlesticks. When police bring him back, the bishop says they were a gift, gives them to him, blesses him and shows him a way to Paris, and the convict is reformed.","point":"True grace leads the grateful recipient to turn from his old sinful ways."}],"keyVerses":[{"ref":"Titus 2:12","text":"It teaches us to say 'No' to ungodliness and worldly passions","use":"Grace transforms and empowers us to reject sin"},{"ref":"Matt 24:13","text":"The one who endures to the end will be saved","use":"Those in habitual sin do not endure and will not be saved"}],"flow":["Story: bishop shows grace to a convict","Grace reforms the convict","Christ took our punishment on the Cross","Gratitude leads to daily turning from sin","Grace teaches us to say no (Titus 2:12)","Habitual sin shows ingratitude, failure to endure"],"responseOverview":"App 2: The author picked a story that actually supports the grace view he is criticising. The bishop's mercy was unconditional and given before any change, and that complete gift transformed the convict. The relational gospel agrees that grace produces holiness (Titus 2:11-12), and it goes further than gratitude: in Christ we died and rose (2 Cor 5:14; Rom 6:6), so holy living is our true identity coming into view. The author's use of Matt 24:13 lifts a verse out of the Olivet Discourse, which in context addresses the disciples' generation before the temple's fall in AD 70 (Matt 24:34) and is not a test of whether a believer is persevering enough. Grace teachers do not deny that grace transforms people. They deny that the threat of losing grace is what transforms them."},{"num":10,"section":"Hyper-Grace","title":"When Pakistan Beat India in an ICC World Cup Game Finally and What It's Got to Do with the Hyper-Grace False Teaching","summary":"The author recalls Pakistan's first-ever World Cup win over India (T20 World Cup, Dubai, 24 October 2021), which MS Dhoni had predicted would come someday, since 'you win some and you lose some'. Similarly, the Bible does not say believers will win over sin every time (2 Chron 6:36; Prov 20:9; Eccl 7:20; 1 John 1:8; Jas 3:2). This does not permit deliberately planning sin, remaining in sin or making sin a habit (Rom 6:1,15; Titus 2:11-12; 1 John 3:6; 5:18). Grace is not a licence for immorality (Jude 4).","thesis":"Believers will sometimes fail, but this truth may never be twisted into permission to plan, remain in or habitually practise sin.","outline":null,"claims":[{"claim":"Scripture admits believers will not win over sin every time","detail":"Like a cricket team that wins some and loses some, believers will stumble. 'There is no one who does not sin' (2 Chron 6:36); no one can claim a pure heart (Prov 20:9); there is no righteous man who never sins (Eccl 7:20); claiming sinlessness is self-deception (1 John 1:8); we all stumble in many ways (Jas 3:2).","refs":["2 Chron 6:36","Prov 20:9","Eccl 7:20","1 John 1:8","Jas 3:2"],"target":"Sinless perfection or despair over failure","response":{"text":"This is a welcome and realistic point, and it takes the pressure of perfectionism off believers. The relational gospel adds that our standing does not rise and fall with our 'match results'. Our acceptance is settled in Christ, who 'by a single offering has perfected for all time those who are being sanctified' (Heb 10:14). Notice that verse holds both together: perfected and being sanctified. Knowing we are secure as sons frees us to face our failures honestly instead of hiding them (1 John 1:9). A child learning to walk falls often, but the Father never revokes his adoption. He picks him up (Hos 11:3). Honesty about stumbling and confidence in grace belong together.","lenses":["relational","sonship"],"refs":["Heb 10:14","1 John 1:9","Hos 11:3"]}},{"claim":"Our failures do not permit planning sin, remaining in it or making it a habit","detail":"No Bible teaching can be subtly twisted to allow deliberately planning sin, choosing to remain in sin or making sin a habit (Rom 6:1,15; Titus 2:11-12; 1 John 3:6; 5:18).","refs":["Rom 6:1","Rom 6:15","Titus 2:11-12","1 John 3:6","1 John 5:18"],"target":"Grace used to excuse deliberate sin","response":{"text":"Agreed, and so do grace teachers. Paul's answer in Rom 6 is the model. When asked, 'Shall we continue in sin that grace may abound?', he does not reply 'No, or you will lose salvation'. He says 'How can we who died to sin still live in it?' (6:2). His argument is about identity: you were baptised into Christ's death and raised to new life (6:3-4), so 'consider yourselves dead to sin and alive to God' (6:11). 1 John 3:6-9 says the one born of God does not keep on sinning 'because God's seed abides in him'. The new nature, not fear, is the guarantee. Righteousness-consciousness, knowing who we are, is what breaks the hold of habitual sin.","lenses":["relational","faith","sonship"],"refs":["Rom 6:2-4","Rom 6:11","1 John 3:9"]}},{"claim":"Grace is not a licence for immoral living","detail":"Jude 4 warns against those who turn the grace of God into a licence for immorality.","refs":["Jude 4"],"target":"Antinomian use of grace","response":{"text":"Jude 4 describes ungodly intruders who 'pervert the grace of our God into sensuality and deny our only Master and Lord'. These were people who denied Christ's lordship, not believers who struggle. No serious grace teacher endorses licence. The relational view holds that real grace is the opposite of licence, because it unites us to the holy life of the Trinity (2 Pet 1:4). The safeguard against abusing grace is to understand it more deeply, as relationship with a Father whose love we do not want to grieve (Eph 4:30), not to dilute it with fear.","lenses":["relational"],"refs":["2 Pet 1:4","Eph 4:30"]}}],"questions":[{"q":"Does the Bible indicate the believer will win over sin every single time?","answer":"No. Scripture says all stumble, but this cannot be used to plan sin or remain in it.","response":"Correct. Stumbling is human, and our security rests in Christ's finished work (Heb 10:14). That security is what gives us strength to grow, as children who are learning and not on probation."}],"criticisms":[{"of":"Cultic Hyper-Grace teaching (generally)","quote":"","critique":"It twists biblical admissions of human weakness into permission to deliberately plan sin, remain in it or make it a habit.","response":"Grace teachers would agree that planning sin is incompatible with the new nature. They use texts like 1 John 1:8 to free people from shame, not to give them licence. The aim is a freedom in which sin loses its appeal (Gal 5:13)."}],"illustrations":[{"title":"Pakistan beat India in a World Cup","story":"After 12 straight World Cup losses, Pakistan beat India in the 2021 T20 World Cup in Dubai. MS Dhoni had predicted it, saying you win some and lose some.","point":"Believers too will not win over sin every time, but that is no excuse to plan sin."}],"keyVerses":[{"ref":"Eccl 7:20","text":"There is no righteous man on earth who does good and never sins","use":"Believers will sometimes fail"},{"ref":"1 John 1:8","text":"If we claim to be without sin, we deceive ourselves","use":"No sinless perfection"},{"ref":"Jas 3:2","text":"We all stumble in many ways","use":"Universal stumbling"},{"ref":"Rom 6:1","text":"Shall we go on sinning so that grace may increase?","use":"No licence to remain in sin"},{"ref":"Jude 4","text":"Change the grace of our God into a licence for immorality","use":"Grace is not licence"}],"flow":["Pakistan finally beats India; you win some, lose some","Believers too will not beat sin every time","Many verses admit universal stumbling","But no planning sin or remaining in it","Grace is not a licence (Jude 4)"],"responseOverview":"App 2: This is the author's most balanced chapter. It admits that believers stumble while rejecting grace as a licence, and grace teachers would agree with both points. The difference lies in what keeps a believer from habitual sin. The author points to warnings. The relational and faith perspectives point to identity: we died and rose with Christ (Rom 6:2-11), God's seed abides in us (1 John 3:9), and we have been perfected while being sanctified (Heb 10:14). The author does not say here that stumbling costs salvation. Applied to the rest of the book, this chapter's own logic suggests that a believer's acceptance does not depend on results. As sons and daughters we learn to walk with a Father who picks us up, and that security frees us from sin's hold."},{"num":11,"section":"Hyper-Grace","title":"The Oft-Repeated Movie Dialogue 'All Is Well' and Hyper-Grace Theology","summary":"Hyper-Grace teachers repeat 1 John 4:17 ('as He is, so are we in this world') the way iconic dialogues are repeated in films like '3 Idiots' and 'DDLJ'. They use it to claim God sees sinning believers as he sees Christ, so they can never be condemned. The author quotes a Singapore megachurch pastor's devotional saying God does not judge us by today's performance and believers need not fear judgment. After setting the context of 1 John (a letter answering proto-gnostics who denied the reality of sin), he gives five reasons the interpretation is wrong. These are the Parousia reason (1 John 3:2-3), the plural-pronoun 'we' reason (1 John 1:6; 2:3,28; 3:12,24; 5:18), the 'perfect' reason (love is perfected by keeping his word, 1 John 2:5), the present-continuous tense reason, and the 'pack' reason. The last covers John's Gospel (Judas, John 15:6), 2 John 8-9, 3 John 11 and Revelation (2:11; 21:27; 22:15). He concludes that 'as He is, so are we' refers to those who abide, overcome and persist.","thesis":"1 John 4:17 does not mean God ignores believers' sin; read in the context of all John's writings, it describes believers who continually abide in Christ and reject sin.","outline":{"acronym":"5 P's","items":[{"letter":"P","label":"The Parousia Reason","point":"We are not yet fully like Christ; we will be when he appears, so those with this hope purify themselves now. This is 'already but not yet'.","refs":["1 John 3:2","1 John 3:3"]},{"letter":"P","label":"The Plural Personal Pronoun Reason","point":"Every 'we' in 1 John calls for obedience: walking in light, keeping commands, abiding to avoid shame at his coming, not being like Cain, and not continuing in sin.","refs":["1 John 1:6","1 John 2:3","1 John 2:28","1 John 3:12","1 John 3:24","1 John 5:18"]},{"letter":"P","label":"The 'Perfect' Reason","point":"Boldness in judgment comes from perfected love, and love is perfected in whoever keeps his word, not in those who 'kick' the commands.","refs":["1 John 4:16-17","1 John 2:5"]},{"letter":"P","label":"The Present-Continuous Tense Reason","point":"John's present tenses (goes on believing, is having the Son) show that faith and abiding must continue; the 'if' of 1 John 2:24 refutes once-saved-always-saved.","refs":["1 John 5:5","1 John 5:11-12","1 John 2:24","1 John 4:2"]},{"letter":"P","label":"The 'Pack' Reason","point":"All of John's writings (Gospel, 2 John, 3 John, Revelation) demand continual abiding and overcoming as a condition for heaven.","refs":["John 17:12","John 15:6","2 John 8-9","3 John 11","Rev 2:11","Rev 21:27","Rev 22:15"]}]},"claims":[{"claim":"Hyper-Grace misuses 1 John 4:17 to say God never condemns sinning believers","detail":"Hyper-Grace teachers say that because 'as He is, so are we', God sees believers as he sees Christ no matter how much they sin. As he would never condemn Christ, he will never condemn them, and they need not fear judgment.","refs":["1 John 4:17"],"target":"Believers immune from judgment whatever their conduct","response":{"text":"The verse does promise 'confidence for the day of judgment' because 'as he is so also are we in this world'. This confidence is grounded in our union with Christ, and that is a sound reading. The context is love: 'God is love, and whoever abides in love abides in God' (4:16), and 'there is no fear in love... fear has to do with punishment' (4:18). John's purpose is to free believers from dread of judgment. The relational view does not say sin is irrelevant. It says that in Christ our identity is settled, so we can face judgment unafraid, and that knowing this love casts out the fear that drives sin. Using the verse to excuse sin would be misusing it. Using it to replace fear with love is exactly John's aim.","lenses":["relational","sonship"],"refs":["1 John 4:16","1 John 4:18"]}},{"claim":"1 John was written against proto-gnostics who denied the reality of sin","detail":"Drawing on a New Testament scholar, the author says John wrote to congregations shaken by false teachers (possibly proto-gnostics who said bodily sin did not matter) who denied the reality of sin (1:8,10) and claimed special knowledge (2:20,27). These teachers had left (2:19), and John wrote to reassure believers (5:13).","refs":["1 John 1:8","1 John 1:10","1 John 2:19","1 John 2:20","1 John 2:27","1 John 5:13"],"target":"Context-free reading of 1 John 4:17","response":{"text":"The historical context is helpful, and it actually supports a security-centred reading. The author himself notes John's aim: 'I write these things... that you may know that you have eternal life' (5:13). John wrote to reassure believers shaken by departing teachers, and that is why he stresses that those who stayed had the anointing (2:20,27) and that the defectors 'were not of us' (2:19). The false teachers denied that Christ came in the flesh (4:2) and denied that sin was real (1:8). Grace teachers affirm both. They agree sin is real and must be confessed. Their point, which is John's point, is that believers can know they are accepted, and this assurance is meant to steady them, not to make them anxious.","lenses":["relational"],"refs":["1 John 5:13","1 John 2:19","1 John 4:2"]}},{"claim":"Parousia reason: we are not yet fully like Christ until he appears","detail":"1 John 3:2 says we will be like him when he appears, so we are 'already' but 'not yet' like him. 1 John 3:3 calls those with this hope to purify themselves. So 1 John 4:17 does not open a window to live in sin.","refs":["1 John 3:2","1 John 3:3"],"target":"Present full likeness excusing sin","response":{"text":"The 'already / not yet' framework is correct: our bodies are not yet glorified. But 4:17 says 'as he is so are we in this world', in the present. Our identity and standing are already one with Christ, while our full mani
