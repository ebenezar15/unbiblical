festation awaits his appearing. 1 John 3:2 opens with 'Beloved, we are God's children now'. Then 3:3 says hope purifies. The engine of purity is hope and assurance, not uncertainty about whether we will make it. The sonship view rejoices here: we purify ourselves because we already belong and are sure of the future. Holiness grows out of settled identity, which is the order John himself gives.","lenses":["sonship","relational"],"refs":["1 John 3:1-3"]}},{"claim":"Plural pronoun reason: every 'we' in 1 John demands obedience","detail":"The 'we' of 4:17 must agree with the other 'we' passages: claiming fellowship while walking in darkness is a lie (1:6), we know him if we keep his commands (2:3), whoever keeps his commands abides (3:24, cf. John 14:15,21), and so on.","refs":["1 John 1:6","1 John 2:3","1 John 3:24","John 14:15","John 14:21"],"target":"Righteousness disconnected from obedience","response":{"text":"John's 'we' texts are mainly tests of assurance, ways to know (2:3, 'by this we know') that we are in him. They are not entry requirements. In 1:7 walking in the light is joined to 'the blood of Jesus cleanses us from all sin', so walking in light means living honestly in relationship, not living sinlessly. John's 'commandments' are summed up as believing in Christ and loving one another (3:23). Jesus' words 'if you love me, you will keep my commandments' (John 14:15) describe what love produces. Grace teachers agree that obedience flows from union. The difference is that they see these verses as describing the new life, while the author sees threats to it.","lenses":["relational","sonship"],"refs":["1 John 1:7","1 John 3:23","John 14:15"]}},{"claim":"Without abiding, believers will shrink in shame at Christ's coming","detail":"1 John 2:28 calls us to abide so that we may have confidence and not shrink in shame at his coming. If we keep sinning, he reserves the right to abandon us when he returns.","refs":["1 John 2:28"],"target":"No accountability at Christ's return","response":{"text":"1 John 2:28 speaks of confidence or shame at Christ's appearing, not of being abandoned. Shame here is the embarrassment of a child who has neglected the relationship. It is not disinheritance. The verse begins 'little children', and the next verse adds that 'everyone who practises righteousness has been born of him' (2:29). The motive is the joy of seeing one's Lord without awkwardness. The sonship view takes this seriously: we want to meet him face to face with joy, and abiding makes that possible. But the Father who 'will never leave you nor forsake you' (Heb 13:5) does not leave his children behind.","lenses":["sonship"],"refs":["1 John 2:29","Heb 13:5"]}},{"claim":"'Don't be like Cain' shows righteousness involves turning from sin","detail":"1 John 3:12 says we should not be like Cain, who murdered his brother. If righteousness had nothing to do with sin, such examples would be needless, so Hyper-Grace is unbiblical.","refs":["1 John 3:12"],"target":"Righteousness unrelated to conduct","response":{"text":"Grace teachers do not say righteousness has nothing to do with conduct. They say righteous conduct flows from a righteous nature given as a gift (Rom 5:17). John's Cain example is about love and hatred: 'we should love one another' (3:11), and Cain 'murdered his brother... because his own deeds were evil and his brother's righteous' (3:12). The contrast is between two families, one of the evil one and one of God (3:10). Believers are called not to act like Cain because they are not of Cain's family. That is an argument from identity, and it is the heart of the grace view.","lenses":["relational","faith"],"refs":["Rom 5:17","1 John 3:10-11"]}},{"claim":"1 John 5:18: the one born of God does not keep on sinning","detail":"The climax of the 'we' passages is 1 John 5:18: whoever is born of God does not keep on sinning (does not make a practice of it). This flatly rejects the idea that sin does not matter to God.","refs":["1 John 5:18"],"target":"Sin doesn't matter to God","response":{"text":"1 John 5:18 is a statement of confidence, not a threat: 'he who was born of God protects him, and the evil one does not touch him.' John says the new birth itself produces this pattern because Christ guards the believer. Grace teachers fully agree that the new nature does not love or practise sin. Their claim is not that sin does not matter to God. It matters so much that he dealt with it completely at the Cross and gave us a new nature. Righteousness-consciousness and the new birth are what free believers from habitual sin.","lenses":["faith","relational"],"refs":["1 John 5:18","1 John 3:9"]}},{"claim":"Love is perfected in those who keep his word (1 John 2:5)","detail":"Boldness on Judgment Day comes from perfected love (4:17), and 2:5 says love is perfected in whoever keeps his word. So the boldness belongs to obedient abiders, not to those who keep 'kicking' the commands.","refs":["1 John 4:17","1 John 2:5","1 John 4:16"],"target":"Boldness in judgment for wilful sinners","response":{"text":"In 1 John 'perfected love' is first God's love, which reaches its goal in us: 'In this is love, not that we have loved God but that he loved us and sent his Son' (4:10). In 4:12 'his love is perfected in us' when we love one another. Keeping his word is the expression of that love having its way in us. It is not a way of earning boldness. The confidence of 4:17 comes from 'as he is, so are we', which is union, and 4:18 explains that perfect love casts out fear. Fear-based motivation actually works against the perfected love John describes. Grace and obedience meet in love received.","lenses":["relational"],"refs":["1 John 4:10","1 John 4:12","1 John 4:18"]}},{"claim":"John's present-continuous tenses demand continual faith and abiding","detail":"Quoting a British Bible teacher, the author argues that John's present tenses ('goes on overcoming', 'goes on believing', 'is having the Son', 1 John 5:5,11-12) and the 'if' of 2:24 show that initial faith is not enough and must continue throughout life, refuting 'once saved, always saved'. Another scholar notes that 4:2's 'has come in the flesh' answers Gnostics.","refs":["1 John 5:5","1 John 5:11-12","1 John 2:24","1 John 4:2"],"target":"Once saved, always saved","response":{"text":"Present participles describe the ongoing character of believers. Those who believe are 'believing ones'. But Greek grammar alone does not settle the question of conditional security, because the same tense appears in promises: 'whoever believes has eternal life' (John 3:36; 5:24, 'has passed from death to life'). In 5:11-12 John stresses that life is in the Son and God has given it, a perfect, settled fact, and 5:13 says 'that you may know'. The 'if' of 2:24 encourages remaining in the original apostolic message instead of the defectors' new teaching. Grace teachers agree that true faith continues. They see continuing faith as the Spirit's work, not a performance on which we must anxiously keep watch (Phil 1:6).","lenses":["relational","sonship"],"refs":["John 3:36","John 5:24","1 John 5:13","Phil 1:6"]}},{"claim":"Hyper-Grace teachers mirror the Gnostics' denial","detail":"Gnostics denied Christ's continuing incarnation, while Hyper-Grace teachers deny the need for daily abiding, continual faith and steady rejection of besetting sin.","refs":["1 John 4:2"],"target":"Hyper-Grace as modern Gnosticism","response":{"text":"The comparison is unfair. The Gnostics of 1 John denied that Christ came in the flesh and claimed sin did not touch the spiritual person. Grace teachers affirm the full incarnation and the reality of sin. In fact the relational gospel emphasises the incarnation more strongly: in the Son's taking on flesh, humanity was united to God (John 1:14; Heb 2:14). That is the opposite of Gnosticism. They also teach abiding as resting in Christ (John 15:4). Disagreeing about the basis of security does not make someone a Gnostic, and such labels hinder fruitful dialogue among believers.","lenses":["relational"],"refs":["John 1:14","Heb 2:14","John 15:4"]}},{"claim":"John's Gospel: Judas was lost; unfruitful branches are burned","detail":"Judas, whose name was written in heaven (Luke 10:20), was lost (John 17:12). Branches that do not abide are cut off and thrown into the fire, symbolising loss of salvation and hell (John 15:6).","refs":["Luke 10:20","John 17:12","John 15:6"],"target":"Impossibility of losing salvation","response":{"text":"Jesus calls Judas 'the son of destruction' who fulfilled Scripture (John 17:12), and he says earlier 'one of you is a devil' (John 6:70). John presents Judas as never truly belonging (John 13:10-11, 'not all of you are clean'), not as a saved person who fell. Luke 10:20 was spoken to the seventy-two, and it is not certain Judas was among them. In John 15:6 fire is the vinedresser's imagery for burning useless branches. In the Jewish setting it also echoes the coming fiery judgment on unfruitful Israel (Matt 3:10; 21:43). Jesus' focus is on fruit through union: 'apart from me you can do nothing'. The relational view hears an invitation to rest in the vine.","lenses":["relational","preterist"],"refs":["John 6:70","John 13:10-11","Matt 3:10","Matt 21:43"]}},{"claim":"2 John 8-9: not abiding means losing God, not just rewards","detail":"2 John 8-9 warns not to lose what was worked for, and says whoever does not abide in Christ's teaching does not have God. The corollary is that non-abiders do not have the Father and the Son and are on the wide road to hell.","refs":["2 John 8","2 John 9"],"target":"Only rewards are at stake","response":{"text":"2 John concerns a specific danger: deceivers 'who do not confess the coming of Jesus Christ in the flesh' (v7). The person who 'goes on ahead' (v9) is the one who moves beyond the apostolic teaching about Christ, a doctrinal defection, not a believer struggling with sin. Verse 8 speaks of losing 'what we have worked for' and gaining a 'full reward', which is reward language. John's concern is that the church keep the true Christ: the incarnate Son is where the Father is known. The relational gospel shares this concern completely, because everything rests on who Jesus is.","lenses":["relational"],"refs":["2 John 7","2 John 8-9"]}},{"claim":"3 John 11: one who does evil has not seen God","detail":"Diotrephes, who loved pre-eminence and rejected others, is the evil one not to be imitated. Whoever does evil has not seen God. So whoever lives stubbornly in sin is not even a believer.","refs":["3 John 9-11"],"target":"Sin-condoning grace","response":{"text":"3 John 11 contrasts imitating good with imitating evil. The one who does good is 'from God', and the one doing evil 'has not seen God', meaning he has not really known God's character. That actually matches the relational view: sin is relational blindness, a failure to see God as he is. Diotrephes' problem was pride and control. It is worth noting that John's answer is a visit and a public correction (v10), not a declaration that he is damned. The cure for evil is seeing God truly, and that is what grace preaching aims at: 'whoever sees me has seen the Father' (John 14:9).","lenses":["relational"],"refs":["3 John 10","John 14:9"]}},{"claim":"Revelation: only overcomers escape the second death","detail":"Revelation calls believers to endure (3:10) and overcome (2:11). The corollary of 2:11 is that non-overcomers will be hurt by the second death, which is hell (20:14; 21:8). Those who love and practise falsehood and keep doing what is shameful will be excluded (21:27; 22:15).","refs":["Rev 3:10","Rev 2:11","Rev 20:14","Rev 21:8","Rev 21:27","Rev 22:15"],"target":"No danger for unrepentant believers","response":{"text":"Revelation was written to seven first-century churches about things that 'must soon take place' (1:1), facing persecution under Rome. 'Overcoming' meant staying loyal to Jesus instead of compromising with emperor worship. John defines it: 'they overcame him by the blood of the Lamb and the word of their testimony' (12:11). Overcomers win by Christ's victory, not by moral performance (1 John 5:4-5, 'this is the victory... our faith'). Arguing from a promise to its 'corollary' is a logical step John does not make. The lists in 21:8 and 22:15 describe those outside the city, yet its gates 'will never be shut' (21:25), and the Spirit and the Bride keep saying 'come' (22:17).","lenses":["preterist","relational","faith"],"refs":["Rev 1:1","Rev 12:11","1 John 5:4-5","Rev 21:25","Rev 22:17"]}},{"claim":"'As He is, so are we' means as abiding, overcoming, persisting believers","detail":"Read in the light of all John's writings, 1 John 4:17 means: as He is, so are we, those who are abiding, overcoming and persisting. The author closes with a devotional definition of abiding: making Christ our supreme object, centre and circumference, our all in all.","refs":["1 John 4:17"],"target":"Unconditional reading of 1 John 4:17","response":{"text":"The closing definition of abiding, making Christ our centre, circumference and all in all, is beautiful, and grace teachers would gladly adopt it. Its focus is Christ, not our performance. That is the best way to read 1 John 4:17. We are 'as he is' because we are in him, and abiding is the restful enjoyment of that reality. In the relational gospel the Father has already placed us in the Son by the Spirit (Eph 1:4-5). Those who see this abide, overcome and persist, not as conditions they meet but as the fruit of the union. Adding qualifiers to the verse turns John's assurance back into anxiety.","lenses":["relational","sonship"],"refs":["Eph 1:4-5","1 John 4:13"]}}],"questions":[{"q":"How do we respond to the claim that God judges by Jesus, not by our daily performance?","answer":"By reading 1 John 4:17 in context: five reasons show it does not excuse sin.","response":"Respond with joy. God does see us in Christ, and that is why we can be confident and free from fear (4:17-18). Seeing ourselves as he sees us is what changes our conduct (2 Cor 3:18)."},{"q":"Is 1 John 4:17 in effect saying 'our sins don't matter to God'?","answer":"No. Unless John taught that elsewhere in the letter, which he does not, the verse cannot mean it; 1 John 5:18 flatly rejects it.","response":"Sin matters greatly. It matters so much that God dealt with it in Christ (1 John 2:2). The verse teaches confidence grounded in union, which frees us from both fear and sin."},{"q":"Would you be ashamed on the day of Jesus' return?","answer":"If we do not abide and keep shamelessly sinning, we will be ashamed and he may abandon us.","response":"Abiding helps us meet him with joy rather than embarrassment (1 John 2:28). He calls us 'little children', and that relationship is not revoked (Heb 13:5)."},{"q":"How is 'love perfected' so that we may have boldness in the Day of Judgment?","answer":"By keeping his word (1 John 2:5); those who keep 'kicking' the commands do not have perfected love.","response":"Love is perfected as God's love for us is received and flows out in love for others (1 John 4:10-12). That love casts out fear (4:18), and the boldness comes from union, not from earning."}],"criticisms":[{"of":"A Singapore megachurch pastor (in a devotional book)","quote":"It is wonderful to know that God does not measure and judge you based on your performance today. Instead, he looks at Jesus, and as Jesus is, that is how He sees you... As new covenant believers we do not have to fear the day of judgement... because as he is, so are we in this world!","critique":"The author calls this a cultic, sin-excusing twist of 1 John 4:17 and refutes it with five reasons from the context of John's writings.","response":"This quote is close to John's own aim. 1 John 4:17-18 promises confidence on the day of judgment and says fear has to do with punishment. Believers are accepted in Christ, not by daily performance (Eph 1:6). The pastor does not say sin is harmless. He says our standing is secure, and John wrote so that believers 'may know' they have eternal life (5:13)."},{"of":"Hyper-Grace proponents generally","quote":"","critique":"They repeat 'As He is, so are we in this world' like parrots repeating movie dialogue, twisting Scripture out of desperation and calling obedience negative 'performance'.","response":"Repeating a verse is not wrong in itself; the Psalms repeat 'his love endures forever'. Grace teachers object to performance as the basis of acceptance, not to obedience as its fruit. The real question is the order of grace and obedience."},{"of":"Hyper-Grace teachers as modern Gnostics","quote":"","critique":"Like the Gnostics who denied the continuing reality of Christ's incarnation, they deny the need for daily abiding, continual faith and rejection of besetting sin.","response":"Grace teachers affirm the incarnation and the reality of sin. The relational gospel centres everything on the incarnate Son uniting humanity to God, which is the opposite of Gnostic dualism (John 1:14)."}],"illustrations":[{"title":"'All is well' and 'DDLJ' dialogues","story":"The line 'All is well' recurs in the 2009 film '3 Idiots' (remade in Tamil as 'Nanban'), and 'small, small mistakes in big, big countries' recurs in 'Dilwale Dulhania Le Jayenge' (1995).","point":"Hyper-Grace teachers repeat 1 John 4:17 like parrots, as if all is well and small sins should be ignored."},{"title":"Abiding defined","story":"A devotional writer defines abiding as having Christ as our supreme object, our centre and circumference, our all in all.","point":"Abiding means wholehearted devotion to Christ."}],"keyVerses":[{"ref":"1 John 4:17","text":"As He is, so are we in this world","use":"Refers to abiding, overcoming believers, not sin-excusing"},{"ref":"1 John 3:2-3","text":"When he appears we shall be like him... all who have this hope purify themselves","use":"Already but not yet like Christ; call to holiness"},{"ref":"1 John 1:6","text":"If we say we have fellowship with him while we walk in darkness, we lie","use":"Fellowship requires forsaking sin"},{"ref":"1 John 2:28","text":"Abide in him, so that when he appears we may have confidence and not shrink from him in shame","use":"Non-abiders will be ashamed"},{"ref":"1 John 5:18","text":"Everyone who has been born of God does not keep on sinning","use":"Climactic rejection of Hyper-Grace"},{"ref":"1 John 2:5","text":"Whoever keeps His word, in him truly the love of God is perfected","use":"Perfected love requires obedience"},{"ref":"1 John 2:24","text":"If it does, you also will remain in the Son and in the Father","use":"Conditional abiding refutes once-saved-always-saved"},{"ref":"John 15:6","text":"Thrown away like a branch... thrown into the fire","use":"Loss of salvation and hell"},{"ref":"2 John 9","text":"Everyone who goes on ahead and does not abide in the teaching of Christ, does not have God","use":"Non-abiders lose the Father and Son"},{"ref":"Rev 2:11","text":"He who overcomes will not be hurt by the second death","use":"Only overcomers reach heaven"}],"flow":["Hyper-Grace repeats 1 John 4:17 like movie dialogue","Singapore pastor: God judges by Jesus, not performance","Context: John answering proto-gnostics","Reasons 1-3: Parousia, 'we' passages, perfected love","Reason 4: present-continuous tense demands continuing faith","Reason 5: all John's writings demand abiding","Conclusion: 'we' means abiding, overcoming believers"],"responseOverview":"App 2: The chapter's exegetical effort is serious, but it reads 1 John against its own stated purpose: 'that you may know that you have eternal life' (5:13). John writes to reassure a church shaken by departing false teachers. His 'we' statements and tests are signs by which believers can recognise the life they already have, and they are not hurdles to keep clearing. 1 John 4:17-18 roots confidence in union with Christ and love that casts out fear. The quoted pastor's statement is close to that. The author misreads grace teachers as Gnostics who think sin does not matter. They affirm the incarnation and the reality of sin, and they place obedience as the fruit of union. Several 'pack' texts are read past their context: Judas never belonged (John 13:10-11), 2 John addresses doctrinal deceivers, and Revelation's 'overcomers' win by the blood of the Lamb (Rev 12:11) in a first-century crisis. The closing definition of abiding as making Christ our all in all is one the grace view embraces fully."},{"num":12,"section":"Hyper-Grace","title":"How Do We Respond to Grace Shown to Us? Can We Respond Like Rohit Did in the 2019 ODI World Cup?","summary":"Subtitled as a response to the Hyper-Grace attack on the non-ceremonial moral laws of the Old Testament, this chapter uses cricket to show how grace should be answered. Rohit Sharma, dropped on 9 by Tamim Iqbal against Bangladesh in 2019, went on to a century, as he had after earlier drops, and Kohli and Patidar made big scores after being dropped in IPL 2024. Like them, believers saved by grace (Eph 2:4, 8-10) should respond with grateful good works. The author distinguishes 'good works' of holiness and ministry, which we must do, from 'works of the law', the animal sacrifices and ceremonial laws made obsolete by Christ (Heb 8:13). The moral, non-ceremonial laws (e.g. against adultery, restated in Heb 13:4) still bind believers, who obey them out of gratitude and not to earn salvation, and those who do not should doubt they are saved (1 John 2:3-5). Shivam Dube, dropped by Siraj in a match 45 crore people watched, wasted his reprieve, which pictures believers who refuse holiness after being saved.","thesis":"Grace received should be answered with grateful good works of holiness, including obedience to the Old Testament's non-ceremonial moral laws; only the ceremonial 'works of the law' are set aside.","outline":null,"claims":[{"claim":"Grace shown should be answered with grateful good works","detail":"As Rohit, Kohli and Patidar repaid dropped catches with big scores, believers saved by grace should show gratitude through good works. God was 'rich in mercy' to us (Eph 2:4), so we must be 'full of mercy' (Jas 3:17). Salvation is by grace through faith for good works prepared beforehand (Eph 2:8-10).","refs":["Eph 2:4","Jas 3:17","Eph 2:8-10"],"target":"Grace with no response of good works","response":{"text":"Eph 2:8-10 is a treasure for both sides. Good works are the purpose of our new creation. Notice, though, that Paul says God 'prepared' them beforehand and that we are 'his workmanship' (poiema, his artwork). Good works are less a debt we repay and more the life of Christ expressed through those he has made new. The cricket image has a limit: a batsman repays the fielding side's mistake by beating them, while grace is the Father's deliberate gift, given so that sons might share his life. The relational view is glad to call believers to mercy and good works, and it roots them in union ('created in Christ Jesus'), not in a scoreboard of gratitude.","lenses":["relational","sonship"],"refs":["Eph 2:10","Phil 2:13"]}},{"claim":"Good works of holiness differ from 'works of the law'","detail":"Hyper-Grace confuses believers by implying they should not be concerned about works because they are saved by grace. But the New Testament distinguishes good works of holiness and ministry, which we must do out of gratitude, from works of the law, which are animal sacrifices and ceremonial laws made obsolete by Christ's perfect sacrifice (Heb 8:13). Neither can save.","refs":["Heb 8:13","Titus 3:4-8","Titus 2:11-12","Rom 6:4"],"target":"Rejection of all 'works'","response":{"text":"The distinction between good works and ceremonial law is useful, and grace teachers welcome good works as the fruit of the Spirit. But in Paul, 'works of the law' covers more than sacrifices. In Rom 3:20 and 7:7 'the law' includes 'You shall not covet', a moral command. Paul's point is that no law, ceremonial or moral, can give righteousness or produce life (Gal 3:21). The New Testament answer is the Spirit writing God's law on our hearts (Heb 8:10; 2 Cor 3:3). That is the heart of grace preaching. Grace teachers do not oppose works. They oppose using law as the engine of holiness, because Scripture says 'sin will have no dominion over you, since you are not under law but under grace' (Rom 6:14).","lenses":["relational","faith"],"refs":["Rom 3:20","Rom 7:7","Gal 3:21","Heb 8:10","2 Cor 3:3","Rom 6:14"]}},{"claim":"The non-ceremonial moral laws of the Old Testament still bind believers","detail":"Hebrews itself says God will judge the sexually immoral and adulterers (Heb 13:4), restating 'Do not commit adultery'. So the moral laws still bind us. We obey them because we are saved, out of gratitude, not to earn salvation.","refs":["Heb 13:4","Lev 11:45","1 Thess 4:3-5"],"target":"The moral law is irrelevant to believers","response":{"text":"Nobody in the grace camp says adultery is now acceptable. Heb 13:4 and 1 Thess 4:3-5 make it clear that sexual faithfulness reflects God's character. The question is the source of the ethic. The New Testament speaks of 'the law of Christ' (Gal 6:2) and of love as 'the fulfilling of the law' (Rom 13:8-10). The moral content of the commandments is fulfilled as the Spirit forms Christ's love in us (Gal 5:22-23, 'against such things there is no law'). We are 'released from the law... so that we serve in the new way of the Spirit' (Rom 7:6). Believers keep the moral heart of the law by being joined to Christ, not by placing themselves back under Moses.","lenses":["relational","sonship"],"refs":["Gal 6:2","Rom 13:8-10","Gal 5:22-23","Rom 7:6"]}},{"claim":"Those who don't do good works of holiness should doubt their salvation","detail":"If we stubbornly refuse to obey these moral laws that call us to personal holiness, we must doubt whether we were saved in the first place (1 John 2:3-5).","refs":["1 John 2:3-5"],"target":"Assurance without holiness","response":{"text":"1 John 2:3-5 gives a mark by which we can know we know him, and keeping his word is evidence of a living relationship. But telling struggling believers to 'doubt if they were saved' often deepens the problem. Doubt produces fear, and 'fear has to do with punishment' (1 John 4:18). The sonship view sees the Father's discipline as proof of sonship, not grounds to doubt it (Heb 12:7-8). A son who misbehaves remains a son and is lovingly corrected. Assurance is the soil in which holiness grows. The relational view would invite a struggling believer to look again at Christ's faithfulness (2 Tim 2:13), which renews the heart.","lenses":["sonship","relational"],"refs":["1 John 4:18","Heb 12:7-8","2 Tim 2:13"]}},{"claim":"Refusing holiness after being saved is like Dube wasting his reprieve","detail":"Shivam Dube, dropped by Siraj in a decisive game, was out soon after for 7 off 15. Believers who refuse to walk in holiness, believing Hyper-Grace lies, are like Dube. We should be like Rohit, Kohli and Patidar, responding with persistent holiness.","refs":["Titus 2:11-12"],"target":"Wasting grace through unholy living","response":{"text":"The exhortation not to waste grace is biblical (2 Cor 6:1). Where the analogy needs care is in what follows a 'wasted chance'. In cricket the reprieve is a single opportunity, and once you are out, you are out. In the gospel the Father's grace is not a one-off dropped catch. It is his settled disposition, renewed every morning (Lam 3:22-23). Peter denied Jesus three times and was restored, not dismissed (John 21:15-17). Grace teachers want believers to 'score runs' for the kingdom as much as anyone. They believe it happens best when believers know they are not batting on borrowed time but are beloved children in their Father's team.","lenses":["sonship","relational"],"refs":["Lam 3:22-23","John 21:15-17"]}}],"questions":[{"q":"Do we respond with gratitude to the grace shown to us by exhibiting good works?","answer":"We must, like the cricketers who capitalised on their reprieves. We are saved by grace for good works (Eph 2:8-10).","response":"Yes, and those good works are the Spirit's fruit through our union with Christ (Eph 2:10; Gal 5:22). Gratitude is the right feeling, and union is the deeper source."},{"q":"The non-ceremonial moral laws of the Old Testament: are we to obey them?","answer":"Yes. Only ceremonial laws and sacrifices are obsolete. The moral laws (like 'do not commit adultery', Heb 13:4) bind believers out of gratitude.","response":"The moral heart of the law is fulfilled in love by the Spirit (Rom 13:10; 8:4). Believers walk in it as people under 'the law of Christ' (Gal 6:2), with God's law written on their hearts (Heb 8:10), not as people under Moses."}],"criticisms":[{"of":"Cunning preachers of the Hyper-Grace movement","quote":"","critique":"They wage an unwarranted tirade against good works and works of the law and confuse believers into thinking they need not be concerned about works because they are saved by grace.","response":"Grace teachers usually affirm Eph 2:10. They object to works as the means of acceptance or as anxious self-effort under law, and Paul objects to that too (Gal 3:3). Their emphasis is that the Spirit, not the law, produces holiness."}],"illustrations":[{"title":"Rohit Sharma dropped on 9","story":"In the 2019 World Cup against Bangladesh, Tamim Iqbal dropped an easy catch off Rohit, who went on to his fourth century of the tournament. He had also scored 122, 57 and 104 after earlier drops.","point":"When shown grace, respond with gratitude by 'accumulating runs' of good works."},{"title":"'Even my mother-in-law could have caught that one!'","story":"The author's favourite commentary line for a dropped easy catch.","point":"A humorous lead into undeserved reprieves (grace)."},{"title":"Kohli and Patidar dropped in IPL 2024","story":"Against Punjab Kings in Dharamshala, Kohli, dropped on 0 and 10, made 92 off 47, and Patidar, dropped twice, made 55 off 23.","point":"Grateful recipients of grace make it count."},{"title":"Shivam Dube wastes his reprieve","story":"In a must-win RCB vs CSK game watched by 45 crore people online, Siraj dropped a towering catch off Dube, who was out seven balls later for 7 off 15.","point":"Believers who refuse holiness after being saved waste grace."}],"keyVerses":[{"ref":"Eph 2:8-10","text":"By grace you have been saved through faith... created in Christ Jesus for good works","use":"Saved by grace in order to do good works"},{"ref":"Eph 2:4","text":"God, being rich in mercy","use":"Mercy received should make us merciful"},{"ref":"Jas 3:17","text":"Full of mercy and good fruits","use":"Respond to mercy with mercy"},{"ref":"Heb 8:13","text":"He has made the first one obsolete","use":"Ceremonial laws and sacrifices are set aside"},{"ref":"Heb 13:4","text":"God will judge the sexually immoral and adulterers","use":"Moral law still binding"},{"ref":"1 John 2:3-5","text":"By this we know that we have come to know him, if we keep his commandments","use":"Those without holiness should doubt salvation"}],"flow":["Dropped cricketers repay grace with runs","Believers saved by grace for good works","Hyper-Grace attacks good works","Good works differ from works of the law","Moral laws still bind, obeyed from gratitude","No holiness, then doubt salvation","Don't be like Dube who wasted his reprieve"],"responseOverview":"App 2: The chapter rightly says grace is meant to bear fruit (Eph 2:10) and that believers should be merciful because they have received mercy. Grace teachers agree. The main misreading is the claim that Hyper-Grace opposes good works. It opposes law, including the moral law, as the means of righteousness or the engine of holiness, following Paul's own argument (Rom 6:14; 7:6; Gal 3:21). Paul's 'works of the law' covers more than ceremonies, since in Rom 7:7 it includes the command against coveting. The New Covenant answer is the Spirit writing God's will on our hearts (Heb 8:10) and love fulfilling the law (Rom 13:10). The cricket illustrations are fun, but they turn grace into a one-time reprieve that can be wasted. In the gospel grace is the Father's settled love, which restores a failing Peter. Telling strugglers to doubt their salvation undermines the assurance from which real holiness grows (Heb 12:7-8; 1 John 4:18)."},{"num":13,"section":"Hyper-Grace","title":"The Imagery of God as a Father in the Bible Supports Hyper-Grace Cult?","summary":"Hyper-Grace teachers argue from the father image that one can never stop being God's child even if stubborn in sin until death. The author answers through a set of 'P' headings. Hosea pictures God both as a tender Father (Hos 11) and as a devouring lion, leopard and bear (Hos 13). God is not like earthly fathers (Ps 50:21): he is the Holy Father who disciplines for holiness (Heb 12). Under 'The Plan' (Heb 2:10, bringing many sons to glory), 'The Pain' (Exod 4: God's firstborn son; Christ suffered to make us sons, John 1:12) and 'The Pairing' (the Father image paired with Rock, Eagle and Consuming Fire; Deut 32; Heb 12; Isa 63), he shows privilege comes with responsibility: fruitfulness (Jer 31:9, Ephraim), holiness, kind speech, care for the needy and reverent fear (Jas 1:27; 3:9; 1 Pet 1:2,17). Under 'The Peril', Hosea 11:5 and Rom 11:22 show that spurning the Father's love brings judgment and being cut off, and Rev 14:4 and 21:7-8 tie having God as Father to conquering sin. 'The Parenting' calls fathers to discipline children like God, unlike David and Eli. The chapter ends with a Pune case in which a minor driving a Porsche killed two people, as a warning against 'yes-parenting'.","thesis":"God's fatherhood does not guarantee that stubbornly sinning people remain his children; the Bible pairs his fatherly love with holiness, discipline and judgment.","outline":{"acronym":"The P's of God's Fatherhood","items":[{"letter":"P","label":"The Plan","point":"God's eternal plan was to bring many sons to glory alongside his eternal Son, which brings joy to the Father and to us.","refs":["Heb 2:10"]},{"letter":"P","label":"The Pain","point":"From Exodus 4 God calls Israel his firstborn son; to make slaves of sin his children, Christ suffered and died, and we become children by repentance and faith.","refs":["Exod 4:22-23","John 1:12"]},{"letter":"P","label":"The Pairing","point":"The Father image must be paired with others such as Rock, Eagle and Consuming Fire; the transcendent God is also our doting Father; privilege comes with responsibilities of fruitfulness, holiness, kind speech, care for the poor and reverent fear.","refs":["Deut 32:4-6","Deut 32:11","Heb 12:5-6","Heb 12:29","Eccl 7:18","Isa 63:15-16","Jer 31:9","John 17:11","Jas 3:9","Jas 1:27","1 Pet 1:2","1 Pet 1:17"]},{"letter":"P","label":"The Peril","point":"Spurning the Father's love brings judgment (Assyria), the Father becomes like a bear or lion, and believers can be 'cut off'; only conquerors have God as Father.","refs":["Hos 11:1-5","Hos 13:7-9","Rom 11:22","Rev 14:1","Rev 14:4","Rev 21:7-8"]},{"letter":"P","label":"The Parenting","point":"Fathers should imitate God by lovingly disciplining children toward holiness, unlike David with Amnon and Eli with his sons, and avoid 'yes-parenting'.","refs":["Eph 5:1","Heb 12:7-10","1 Sam 2:12-25","1 Sam 3:13"]}]},"claims":[{"claim":"Hyper-Grace: you can never stop being God's child, even stubborn in sin","detail":"Hyper-Grace teachers use the father image to say a person cannot stop being God's child even if stubborn in sin until death or Christ's return. They argue that just as you do not stop being your earthly father's son by rebelling, you remain God's son and will never go to hell.","refs":["Hos 11:1-4"],"target":"Unbreakable sonship regardless of sin","response":{"text":"The sonship perspective does argue this, and it rests on Scripture, not only analogy. 'You are no longer a slave, but a son, and if a son, then an heir' (Gal 4:7). Jesus contrasts the slave, who 'does not remain in the house forever', with 'the son, who remains forever' (John 8:35). In the prodigal son story (Luke 15), the son does everything rebellious, yet the father never stops being his father. He watches the road and runs to him. The son's real loss was the enjoyment of the father's house, not his sonship. The relational view adds that in Christ, God has adopted humanity (Eph 1:5), and the Father's love is not ours to cancel. We can resist it and suffer for it, but it does not let us go (Rom 8:38-39).","lenses":["sonship","relational"],"refs":["Gal 4:7","John 8:35","Luke 15:20-24","Eph 1:5","Rom 8:38-39"]}},{"claim":"Hosea shows God as loving Father and as attacking wild beast","detail":"Hosea 11 pictures God teaching Israel to walk, bending down to feed them and longing to give another chance (11:1-4, 8-9). Because Israel held on to sin, the same God became like a lion, leopard and bear (13:7-8). We must embrace both images.","refs":["Hos 11:1-4","Hos 11:8-9","Hos 13:7-8"],"target":"God only as gentle Father","response":{"text":"Hosea does hold both images, but notice which word is final. After the lion imagery of 13:7-8, the book ends with 'I will heal their apostasy; I will love them freely, for my anger has turned from them' (14:4). Hosea 11:8-9 shows God's heart refusing to destroy: 'How can I give you up, O Ephraim?... I will not execute my burning anger... for I am God and not a man'. The bear and lion speak of covenant judgment on a nation, carried out through Assyria in history, not of a father disowning children forever. Even there the purpose is restoration (Hos 2:14-23; 3:5). In the relational view, wrath is love's opposition to what destroys the beloved, and love has the last word.","lenses":["relational","preterist"],"refs":["Hos 14:4","Hos 11:8-9","Hos 2:14-23","Hos 3:5"]}},{"claim":"God the Father is not like earthly fathers","detail":"God says, 'You thought I was like you' (Ps 50:21). He is the Holy Father (John 17:11) who disciplines us so we become holy, without which no one will see the Lord (Heb 12:5-6,14).","refs":["Ps 50:21","John 17:11","Heb 12:5-6","Heb 12:14"],"target":"Father imagery modelled on permissive human fathers","response":{"text":"Agreed: God is not a projection of human fathers. That is exactly why grace teachers say his love is greater, not smaller. Jesus argued 'how much more' from earthly to heavenly fatherhood (Matt 7:11). If a flawed earthly father would not disown his son, how much more will the perfect Father hold his own. Heb 12 does call God's discipline a sign of sonship: 'he disciplines us for our good, that we may share his holiness' (12:10). It is not a step toward disinheritance. The holiness 'without which no one will see the Lord' is the holiness the Father himself produces through that discipline. We are 'sanctified through the offering of the body of Jesus Christ once for all' (Heb 10:10).","lenses":["sonship","relational"],"refs":["Matt 7:11","Heb 12:10","Heb 10:10"]}},{"claim":"Both Testaments present God as Father and as consuming fire","detail":"It is wrong to think the Old Testament shows God as consuming fire and the New Testament as loving Father, a belief spread by Hyper-Grace among those who do not read the Bible thoroughly. God is not the Father of popular worship songs. He is pleased with those who walk in holiness like Enoch (Heb 11:5) and not pleased with those who flirt with sin (1 Cor 10:5), and he expects immediate repentance (Rom 2:4-5).","refs":["Heb 11:5","1 Cor 10:5","Rom 2:4-5","Acts 20:27"],"target":"Old Testament wrath vs New Testament love dichotomy","response":{"text":"Rightly, the author insists God is the same in both Testaments, which most grace teachers affirm. The relational view goes further: the fire and the Father are not two sides in tension. 'Our God is a consuming fire' (Heb 12:29) describes the Father's love, which burns away what harms his children, as gold is refined. Jesus is the exact image of the Father (Heb 1:3; John 14:9), so we read the Old Testament's fiery images through his face. Heb 11:5-6 says Enoch pleased God by faith, and 'without faith it is impossible to please him'. That is relational trust, not sinless performance. A popular worship song calling God 'good' is not shallow theology. It echoes Jesus, who said 'No one is good except God alone' (Mark 10:18).","lenses":["relational"],"refs":["Heb 12:29","Heb 1:3","John 14:9","Heb 11:5-6","Mark 10:18"]}},{"claim":"God created us to bring many sons to glory (The Plan)","detail":"God's eternal plan was to be a Father. Having enjoyed fellowship with his Eternal Son, he wanted more fully human sons and daughters, which brings him and us joy. The Son suffered on the Cross to bring many sons to glory (Heb 2:10).","refs":["Heb 2:10"],"target":"(Positive teaching)","response":{"text":"This is one of the most beautiful points in the chapter, and the relational gospel is built on it. Before creation the Father, Son and Spirit lived in overflowing love, and God's purpose was to share that life by adopting us 'in Christ before the foundation of the world' (Eph 1:4-5). Heb 2:11 adds that the Son 'is not ashamed to call them brothers'. Because the plan is the Father's, initiated and secured by the Son's suffering, it is not fragile. Its success rests on the Father's will and the Son's faithfulness. That is why the relational view speaks of confidence: what God planned from eternity, Christ accomplished (John 19:30).","lenses":["relational","sonship"],"refs":["Eph 1:4-5","Heb 2:11","John 19:30"]}},{"claim":"God made slaves of sin his sons through Christ's pain (The Pain)","detail":"One of the first presentations of God as Father is Exodus 4, where Israel is God's son, freed from Pharaoh. In the same way God sent Christ to suffer to make sin's slaves his children, and we become sons and daughters when we repent and believe (John 1:12).","refs":["Exod 4:21-23","John 1:12"],"target":"(Positive teaching)","response":{"text":"The Exodus pattern is rich. Israel was God's son before they left Egypt: 'Israel is my firstborn son' (Exod 4:22). Sonship came first, and deliverance and Sinai followed. In the relational gospel, Christ's incarnation and Cross brought humanity into the Son's relationship with the Father (Heb 2:14-15), and faith is how we receive and live in that adoption (John 1:12). Either way the point stands: it cost the Son great pain to make us children. That cost is why the relationship is so secure and so worth living out.","lenses":["relational","sonship"],"refs":["Exod 4:22","Heb 2:14-15","John 1:12"]}},{"claim":"Father imagery must be paired with Rock, Eagle and Consuming Fire (The Pairing)","detail":"Deut 32 calls God Father (32:5-6) but also Rock (32:4,15,30) and Eagle (32:11). Heb 12 presents a compassionate Father (vv 5-6) and a consuming fire. Those who say God is only a loving Father are wrong. We must hold both (Eccl 7:18). Isaiah 63:15-16 pairs the God who looks down from heaven with 'our Father'.","refs":["Deut 32:4-6","Deut 32:11","Deut 32:15","Deut 32:30","Heb 12:5-6","Heb 12:29","Eccl 7:18","Isa 63:15-16"],"target":"God as only a loving Father","response":{"text":"Scripture's images for God are rich and should all be heard. Look at what they mean in their passages: the Rock is a refuge and the source of salvation (Deut 32:15), and the Eagle stirs its nest and carries its young on its wings (32:11). These are pictures of strong, protective love. They are not counterweights to love. The Song of Moses ends with God avenging his servants and making atonement for his land and people (32:43). The consuming fire of Heb 12:29 is the God of the 'unshakable kingdom' given to us (12:28), whose fire purifies. The relational view does not reduce God to sentiment. It says love is his essence (1 John 4:8), and holiness, fire and strength are all what that love looks like.","lenses":["relational"],"refs":["Deut 32:11","Deut 32:15","Deut 32:43","Heb 12:28-29","1 John 4:8"]}},{"claim":"Having God as Father brings responsibilities: fruitfulness, holiness, love and fear","detail":"Jer 31:9 calls Ephraim ('doubly fruitful') God's firstborn, so we must be fruitful and holy as children of the Holy Father (John 17:11). James ties calling God Father to speaking kindly (Jas 3:9) and caring for orphans and widows (Jas 1:27). Peter links it to sanctification and obedience (1 Pet 1:2) and reverent fear before a Father who judges impartially (1 Pet 1:17).","refs":["Jer 31:9","John 17:11","Jas 3:9","Jas 1:27","1 Pet 1:2","1 Pet 1:17"],"target":"Privilege without responsibility","response":{"text":"Privilege does carry a calling, and grace teachers agree. James' 'pure religion' and Peter's call to holy conduct are vital. The order matters, though. Peter writes that we were 'ransomed... with the precious blood of Christ' (1 Pet 1:18-19) and 'born again... through the living and abiding word' (1:23). The 'fear' of 1:17 is reverent awe that comes from knowing what our redemption cost. It is not dread of losing our place. Jer 31 is the chapter of the New Covenant: 'I will put my law within them... I will forgive their iniquity and remember their sin no more' (31:33-34). The fruitfulness of 'Ephraim' is the fruit God himself produces (Hos 14:8, 'from me comes your fruit').","lenses":["sonship","relational"],"refs":["1 Pet 1:18-19","1 Pet 1:23","Jer 31:33-34","Hos 14:8"]}},{"claim":"Spurning the Father's love brings judgment and being 'cut off' (The Peril)","detail":"Right after Hosea's tender father passage, Hosea 11:5 announces Assyria's rule because Israel refused to return, fulfilled in 722 BC. Rom 11:22 warns that if we spurn God's kindness we may be cut off. Hosea 13:8-9 shows the Father as an angry bear-lion who can ultimately send rebels to hell.","refs":["Hos 11:5","Rom 11:22","Hos 13:8-9"],"target":"Spurning God's love carries no peril","response":{"text":"Hosea 11:5 and 13:8-9 describe a historical, national judgment, the fall of the northern kingdom to Assyria. Hosea never mentions hell. Even after it, God promises 'I will ransom them from the power of Sheol... O Death, where are your plagues?' (Hos 13:14), a verse Paul uses for resurrection victory (1 Cor 15:55). Rom 11:22 speaks of Jewish and Gentile branches in God's covenant olive tree as peoples, and Paul immediately adds 'God has the power to graft them in again' (11:23), concluding that 'God has consigned all to disobedience, that he may have mercy on all' (11:32). The peril of spurning love is real. We suffer the misery of resisting it. But the Father's purpose remains mercy.","lenses":["relational","preterist"],"refs":["Hos 13:14","1 Cor 15:55","Rom 11:23","Rom 11:32"]}},{"claim":"Those with God as Father follow the Lamb and conquer sin","detail":"Those with the Father's name (Rev 14:1) follow the Lamb wherever he goes (14:4), meaning obedience in all areas. Rev 21:7-8 shows those for whom God is Father are conquerors who have turned from sexual immorality, murder, sorcery, idolatry and lying.","refs":["Rev 14:1","Rev 14:4","Rev 21:7-8"],"target":"Sonship without overcoming","response":{"text":"Rev 14's 144,000 are a symbolic firstfruits company marked with the Father's name. The picture is about their identity: they belong to him, so they follow the Lamb. That is the order in sonship: belonging produces following. Rev 21:7 promises 'the one who conquers will have this heritage, and I will be his God and he will be my son'. In Revelation conquering is 'by the blood of the Lamb' (12:11) and faith (1 John 5:4). It is not a moral achievement that earns sonship. The vice list in 21:8 describes the life outside the city. The gospel's call is for all to come in through gates that are never shut (21:25; 22:17).","lenses":["sonship","preterist","relational"],"refs":["Rev 12:11","1 John 5:4","Rev 21:25","Rev 22:17"]}},{"claim":"Fathers must discipline children as God does, not like David or Eli (The Parenting)","detail":"We are to imitate God (Eph 5:1), who disciplines his children in love to share his holiness (Heb 12:7-10). Fathers must discipline their children, including physical correction, when they fall into sins like porn, affairs or gadget addiction. They should not look away as David did when Amnon raped Tamar, or rebuke too late as Eli did (1 Sam 2:12-25; 3:13).","refs":["Eph 5:1","Heb 12:7-10","1 Sam 2:12-25","1 Sam 3:13"],"target":"Permissive parenting","response":{"text":"Loving, engaged parenting that sets boundaries is wise, and David's and Eli's failures are sobering. The relational view would add that God's discipline is described as training (paideia), and its goal is sharing his holiness (Heb 12:10). It is always restorative and never rejecting. Eph 5:1 says 'be imitators of God as beloved children, and walk in love', and Eph 6:4 warns fathers not to provoke their children to anger. For parents, imitating God means that discipline grows out of secure love: correcting a child while making it unmistakable that they are not at risk of losing their place in the family. Discipline that takes the child's belonging for granted reflects the Father's heart (Luke 15:31, 'Son, you are always with me').","lenses":["sonship","relational"],"refs":["Heb 12:10","Eph 5:1-2","Eph 6:4","Luke 15:31"]}}],"questions":[{"q":"Can Hyper-Grace teachers say you never stop being God's child even if stubborn in sin till death?","answer":"No. The Bible pairs fatherly love with judgment, discipline and the peril of being cut off.","response":"Scripture says 'the son remains forever' (John 8:35) and that nothing can separate us from God's love (Rom 8:38-39). Persisting in sin brings real discipline and loss of joy, but the Father does not stop being Father."},{"q":"The big question: why did God create us?","answer":"To be a Father to us, adding fully human sons and daughters to the fellowship he enjoyed with his eternal Son (Heb 2:10).","response":"Beautifully true. We were made to share the Trinity's life of love, chosen in Christ before creation (Eph 1:4-5). That purpose cannot fail because it is God's."},{"q":"Do you see God as only a loving Father and nothing else?","answer":"We must not. Scripture also calls him Rock, Eagle and Consuming Fire, and we must hold all these images.","response":"Love is who God is (1 John 4:8). Rock, Eagle and Fire describe his love as strong, protective and purifying. They are not limits on it."},{"q":"Will God the Father stop being our Father when we are stubbornly in sin?","answer":"Hosea 11:5 and 13, and Rom 11:22, show that spurning his love leads to judgment, being cut off and ultimately hell.","response":"Hosea ends with 'I will love them freely' (14:4), and Rom 11 ends with mercy on all (11:32). Stubbornness brings real pain and discipline, but the Father's heart keeps pursuing, as the prodigal story shows."},{"q":"Conquering sexual sin and keeping God as our Father: what is the connection?","answer":"Those for whom God is Father follow the Lamb and conquer, turning from hell-populating sins (Rev 14:4; 21:7-8).","response":"Belonging comes first: those marked with his name follow the Lamb. Victory over sexual sin grows out of knowing we are sons (Rom 6:11-14)."},{"q":"Are you a yes-parent?","answer":"The Pune Porsche crash shows the grave perils of indulgent parenting; we must parent like our holy heavenly Father.","response":"Wise parents say no out of love. The heavenly Father's 'no' is always for our good and never threatens our place in his family (Heb 12:10)."}],"criticisms":[{"of":"Hyper-Grace cult teachers","quote":"Do you stop becoming your earthly father's son, if you rebel against him? You don't. In the same way the Heavenly Father will never stop loving you even if you walk away from him... You will never go to hell! You still remain His Son!","critique":"They compare God with earthly fathers. Hosea 11:5, Hosea 13 and Rom 11:22 show that spurning the Father's love brings judgment.","response":"The argument is Jesus' own 'how much more' logic (Matt 7:11; Luke 15). The prodigal remained a son. Grace teachers do not say rebellion has no consequences, since the prodigal suffered in the far country. They say the Father's love does not stop."},{"of":"Hyper-Grace worship songs and sermons (popular on YouTube)","quote":"","critique":"They paint God as a 'Good, Good Father' in a way that ignores the full counsel of God (Acts 20:27) and his displeasure with sin.","response":"Celebrating God's goodness is thoroughly biblical (Ps 34:8; Mark 10:18). Songs that help people trust the Father's heart support holiness, because people become like the God they worship."},{"of":"Those who teach an Old Testament fire / New Testament Father split","quote":"","critique":"This belief comes from Hyper-Grace influence on people who do not read the Bible comprehensively.","response":"The relational view rejects this split too. Jesus reveals the same God of both Testaments, and the fire is the Father's love (Heb 12:29)."},{"of":"King David, Priest Eli, and a prominent Pune builder (yes-parenting)","quote":"","critique":"David ignored Amnon's rape of Tamar, Eli rebuked his sons too late, and a Pune father let his drunk minor son drive a Porsche that killed two people.","response":"These are real failures of love. Healthy parenting combines warmth and boundaries, which reflects the Father, who disciplines because he loves (Prov 3:12)."}],"illustrations":[{"title":"Fathers teaching toddlers to walk","story":"Loving dads hold their kids' hands to teach them to walk and bend down to feed them, as God did with Israel (Hos 11).","point":"God is a tender Father."},{"title":"Bear robbed of her cubs","story":"Hosea 13 pictures God as a bear robbed of her cubs and a devouring lion against rebellious Israel.","point":"The same loving Father becomes a judge if his love is spurned."},{"title":"Ephraim means doubly fruitful","story":"God calls Ephraim his firstborn (Jer 31:9), and the name means 'doubly fruitful'.","point":"The privilege of sonship carries the responsibility to be fruitful and holy."},{"title":"David, Amnon and Eli","story":"David looked the other way when Amnon raped Tamar, and Eli warned his sons but never truly rebuked them.","point":"Fathers must discipline their children as God does."},{"title":"The Pune Porsche crash","story":"In 2024 a builder's allegedly drunk 17-year-old son, given a credit card and the car keys with his father's approval, drove a Porsche at about 200 km/h and killed two young techies.","point":"'Yes-parenting' has grave perils, so parent like the holy heavenly Father."}],"keyVerses":[{"ref":"Hos 11:1-4","text":"When Israel was a child, I loved him... I bent down to feed them","use":"God as tender Father"},{"ref":"Hos 11:5","text":"Assyria will be their king because they refused to return to me","use":"Spurning fatherly love brings judgment"},{"ref":"Hos 13:7-9","text":"I will fall upon them like a bear robbed of her cubs","use":"Same God becomes a judging beast"},{"ref":"Ps 50:21","text":"You thought I was altogether like you","use":"God is not like earthly fathers"},{"ref":"Heb 12:5-6","text":"The Lord disciplines the one he loves","use":"The Holy Father disciplines for holiness"},{"ref":"Heb 2:10","text":"In bringing many sons to glory","use":"God's plan to be our Father"},{"ref":"Deut 32:5-6","text":"Is He not your Father, who bought you?","use":"Father image paired with Rock and Eagle"},{"ref":"Eccl 7:18","text":"It is good to grasp the one and not let go of the other","use":"Hold both images of God"},{"ref":"1 Pet 1:17","text":"If you call on him as Father who judges impartially... conduct yourselves with fear","use":"Privilege brings reverent fear"},{"ref":"Rom 11:22","text":"Otherwise you also will be cut off","use":"Peril of spurning God's kindness"},{"ref":"Rev 21:7-8","text":"The one who conquers... I will be his God and he will be my son","use":"Only conquerors have God as Father"}],"flow":["Hyper-Grace: you always remain God's child","Hosea: loving Father and attacking beast","God is the Holy Father, unlike earthly fathers","Plan and Pain: sons brought to glory through Christ","Pairing: Father with Rock, Eagle, Fire; privilege with duty","Peril: spurning love brings judgment, being cut off","Parenting: discipline like God, not David or Eli"],"responseOverview":"App 2: This chapter contains some of the author's finest material: God's eternal plan to bring many sons to glory (Heb 2:10), the cost of adoption, and the call to responsible parenting. The relational and sonship perspectives agree with all of these. The disagreement is over the 'Peril'. The author takes national, historical judgments (Assyria in Hos 11:5; 13) and Paul's olive-tree argument about peoples (Rom 11:22) as proof that sons can be finally disowned. He leaves out the endings of those very passages: 'I will love them freely' (Hos 14:4), 'I will ransom them from Sheol' (13:14), and 'that he may have mercy on all' (Rom 11:32). The Rock, Eagle and Consuming Fire images describe the strength of God's love, not its limit. The grace argument is Jesus' own 'how much more' (Matt 7:11) and the prodigal's father, not a projection of human fathers onto God. Discipline proves sonship (Heb 12:7-8), and 'the son remains forever' (John 8:35)."}]};
window.EXTRA = {"balanceAnswer":[{"name":"Grace and holiness","left":"Grace","right":"Effort","v":"--l-relational","text":"Grace is the source of holiness (Titus 2:11-12). Holiness grows from union with Christ, not from effort to stay forgiven."},{"name":"Love and wrath","left":"Love","right":"Fear","v":"--l-sonship","text":"God's wrath is his love opposing what destroys us. Perfect love casts out fear (1 John 4:18), and sons are corrected, never disowned."},{"name":"Faith and suffering","left":"Healing","right":"Unbelief","v":"--l-faith","text":"Healing was carried in the atonement (Matt 8:17). Persecution is promised, but sickness is never called God's tool in the New Testament."},{"name":"Kingdom and history","left":"Victory","right":"Doom","v":"--l-postmil","text":"Much of the prophecy behind today's fears was fulfilled by AD 70. The kingdom keeps growing until it fills the earth (Dan 2:35)."}],"timeline":[{"when":"AD 30","what":"Cross: death abolished (2 Tim 1:10)","v":"--l-relational"},{"when":"AD 30-70","what":"'This generation' (Matt 24:34)","v":"--l-preterist"},{"when":"AD 64-68","what":"Nero: the beast, 666","v":"--l-faith"},{"when":"AD 70","what":"Temple falls, old age ends","v":"--l-preterist"},{"when":"Church age","what":"Kingdom grows like leaven","v":"--l-postmil"},{"when":"Future","what":"Return, resurrection, all made new","v":"--l-immortality"}],"timelineTitle":"A partial-preterist and postmillennial timeline","timelineSub":"The frame the responses use for 'last days', fiery judgment, Gehenna and the beast: the end of the old covenant age in AD 70, then a kingdom that keeps growing.","compare":[{"topic":"Future sins","book":"Forgiveness is provided, but only possessed by confessing each sin.","resp":"God forgave all our trespasses at the cross (Col 2:13-14). Confession is agreeing with God and enjoying fellowship, not reopening a ledger.","lenses":["relational","sonship"],"ch":[3,4]},{"topic":"Repentance","book":"Turning from sin with deeds; preaching it is essential.","resp":"Metanoia is a change of mind about God and ourselves. Changed behaviour is its fruit, and God's kindness leads us to it (Rom 2:4).","lenses":["relational","faith"],"ch":[2,8]},{"topic":"Holiness","book":"Progressive sanctification through Spirit-enabled effort.","resp":"Holiness is Christ's life in us. We grow by beholding his glory (2 Cor 3:18) and abiding (John 15:5), not by effort to keep our standing.","lenses":["relational","sonship"],"ch":[5,17,18]},{"topic":"How God sees us","book":"Compassionate Father and consuming fire; he sees our sin.","resp":"The consuming fire is the Father's love burning away what harms us. He corrects as a Father and never stops seeing us in his Son (Eph 1:4-6).","lenses":["relational","sonship"],"ch":[2,13]},{"topic":"Security","book":"A saved person can be lost in hell.","resp":"Our life is hidden with Christ in God (Col 3:3). The warnings in Hebrews addressed going back to temple sacrifice before the AD 70 judgment.","lenses":["sonship","preterist","relational"],"ch":[14,20]},{"topic":"Greater works","book":"Wider gospel reach, not bigger miracles.","resp":"Jesus tied greater works to believing and asking in his name (John 14:12-14). The church's reach and its miracles grow together.","lenses":["faith","postmil"],"ch":[21]},{"topic":"Healing","book":"Not always God's will; believers can stay sick.","resp":"Jesus healed all who came and called it the Father's will. Healing is part of the atonement (Isa 53:4-5; Matt 8:17).","lenses":["faith","sonship"],"ch":[22,23,34,35,36]},{"topic":"Death","book":"Believers die until Christ returns; death is the last enemy.","resp":"Christ has abolished death (2 Tim 1:10). An enemy is never to be welcomed; Jesus promised that whoever lives and believes will never die (John 11:26).","lenses":["immortality","faith"],"ch":[24,26,27,28,29,30,31,32,33]},{"topic":"Hell","book":"Eternal conscious torment; no hope after death.","resp":"Gehenna warned of AD 70. 'Aionios' means 'of the age'. The fire is God's purifying love, and the gospel was preached to the dead (1 Pet 4:6).","lenses":["relational","preterist"],"ch":[37,38,39]},{"topic":"The cross","book":"Penal substitution: Jesus bore God's wrath for our sin.","resp":"On the cross, God in Christ reconciled the world to himself (2 Cor 5:19). Jesus bore our sin and its death so as to heal the relationship, not to change the Father's mind.","lenses":["relational"],"ch":[40]},{"topic":"End times","book":"Watchful expectation; warns about apostasy and false prophets.","resp":"Olivet and much of Revelation were fulfilled in the first century. The future is the kingdom's growth, not escalating doom.","lenses":["preterist","postmil"],"ch":[22,42,43]},{"topic":"Scripture","book":"Sola Scriptura: add nothing, subtract nothing.","resp":"Common ground. Jesus is the living Word through whom Scripture is read (John 5:39-40; Luke 24:27). Reading in context, including covenant and time context, protects the whole counsel of God.","lenses":["relational","preterist"],"ch":[0,1,45,46,47]}],"lenses":[{"key":"relational","core":"God is a relationship of love: Father, Son and Spirit. In Jesus' incarnation, death and resurrection, all humanity was included, reconciled and adopted. Faith wakes us up to what is already true; it does not make it true.","svg":"<svg viewBox=\"0 0 300 170\" role=\"img\" aria-label=\"Father, Son and Spirit embracing humanity\"><g style=\"transform-origin:150px 85px;animation:spin 40s linear infinite\">\n<circle cx=\"120\" cy=\"70\" r=\"46\" fill=\"var(--l-relational)\" fill-opacity=\".22\" stroke=\"var(--l-relational)\" stroke-width=\"2.5\"/>\n<circle cx=\"180\" cy=\"70\" r=\"46\" fill=\"var(--l-sonship)\" fill-opacity=\".22\" stroke=\"var(--l-sonship)\" stroke-width=\"2.5\"/>\n<circle cx=\"150\" cy=\"118\" r=\"46\" fill=\"var(--l-immortality)\" fill-opacity=\".22\" stroke=\"var(--l-immortality)\" stroke-width=\"2.5\"/><\/g>\n<circle cx=\"150\" cy=\"88\" r=\"15\" fill=\"var(--fg)\"/><text x=\"150\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"900\" fill=\"var(--bg)\">us<\/text>\n<text x=\"96\" y=\"56\" font-size=\"12\" font-weight=\"800\" fill=\"var(--fg)\">Father<\/text><text x=\"186\" y=\"56\" font-size=\"12\" font-weight=\"800\" fill=\"var(--fg)\">Son<\/text><text x=\"132\" y=\"152\" font-size=\"12\" font-weight=\"800\" fill=\"var(--fg)\">Spirit<\/text><\/svg>","points":["Sin is blindness to the Father's love, not a debt the Father needs paid to love us","Repentance (metanoia) is a change of mind about God and ourselves","God's wrath is his love opposing what destroys us","The 'fire' of God purifies, and hell is resisting that love","Holiness flows from union with Christ, not effort to earn standing"],"refs":["2 Cor 5:14-19","Col 1:19-20","Eph 1:4-5","Heb 12:29","1 Tim 4:10"]},{"key":"faith","core":"Believers carry Christ's authority. Healing and blessing were bought in the atonement, and faith-filled words agree with what God has already said and done.","svg":"<svg viewBox=\"0 0 300 110\" role=\"img\" aria-label=\"flow\"><rect x=\"4\" y=\"24\" width=\"61\" height=\"56\" rx=\"10\" fill=\"var(--l-faith)\" fill-opacity=\"0.25\" stroke=\"var(--l-faith)\" stroke-width=\"2\"/><text x=\"34\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"900\" fill=\"var(--fg)\">Hear<\/text><text x=\"34\" y=\"66\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"var(--muted)\">Rom 10:17<\/text><path d=\"M67 52 l8 0 m-4 -4 l4 4 l-4 4\" stroke=\"var(--fg)\" stroke-width=\"2\" fill=\"none\"/><rect x=\"79\" y=\"24\" width=\"61\" height=\"56\" rx=\"10\" fill=\"var(--l-faith)\" fill-opacity=\"0.43\" stroke=\"var(--l-faith)\" stroke-width=\"2\"/><text x=\"110\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"900\" fill=\"var(--fg)\">Believe<\/text><text x=\"110\" y=\"66\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"var(--muted)\">Mark 11:24<\/text><path d=\"M142 52 l8 0 m-4 -4 l4 4 r. A son is corrected but never disowned, and the spirit of adoption replaces fear-based religion.","svg":"<svg viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"Servant versus son\"><rect x=\"6\" y=\"8\" width=\"138\" height=\"134\" rx=\"12\" fill=\"var(--surface2)\"/><rect x=\"156\" y=\"8\" width=\"138\" height=\"134\" rx=\"12\" fill=\"var(--l-sonship)\" fill-opacity=\".18\" stroke=\"var(--l-sonship)\" stroke-width=\"2\"/>\n<text x=\"75\" y=\"32\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"900\" fill=\"var(--muted)\">Servant<\/text><text x=\"225\" y=\"32\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"900\" fill=\"var(--l-sonship)\">Son<\/text>\n<g font-size=\"11\" font-weight=\"700\" fill=\"var(--fg)\" text-anchor=\"middle\"><text x=\"75\" y=\"60\">works for a place<\/text><text x=\"75\" y=\"84\">fears punishment<\/text><text x=\"75\" y=\"108\">\"Am I still in?\"<\/text><text x=\"75\" y=\"132\">Gal 4:7a<\/text>\n<text x=\"225\" y=\"60\">works from a place<\/text><text x=\"225\" y=\"84\">secure in love<\/text><text x=\"225\" y=\"108\">\"Abba, Father\"<\/text><text x=\"225\" y=\"132\">Rom 8:15<\/text><\/g><\/svg>","points":["'You are no longer a slave, but a son' (Gal 4:7)","The prodigal's father ran before any confession was made","Discipline proves sonship (Heb 12:7-8)","Perfect love casts out fear of punishment (1 John 4:18)"],"refs":["Gal 4:6-7","Rom 8:14-17","John 15:15","Luke 15:20"]},{"key":"postmil","core":"Christ reigns now until all enemies are under his feet. The kingdom grows like leaven and a mustard seed until the knowledge of the Lord fills the earth. The future is hope, not doom.","svg":"<svg viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"Stone becomes a mountain\"><line x1=\"20\" y1=\"130\" x2=\"290\" y2=\"130\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n<path d=\"M20 128 C 90 126, 150 118, 200 92 S 270 30, 290 18 L290 130 L20 130Z\" fill=\"var(--l-postmil)\" fill-opacity=\".25\"/>\n<path d=\"M20 128 C 90 126, 150 118, 200 92 S 270 30, 290 18\" fill=\"none\" stroke=\"var(--l-postmil)\" stroke-width=\"3\" stroke-dasharray=\"400\" stroke-dashoffset=\"400\" style=\"animation:draw 2.4s ease forwards\"/>\n<circle cx=\"24\" cy=\"126\" r=\"5\" fill=\"var(--l-postmil)\"/><circle cx=\"290\" cy=\"18\" r=\"7\" fill=\"var(--l-postmil)\"/>\n<text x=\"28\" y=\"116\" font-size=\"11\" font-weight=\"800\" fill=\"var(--fg)\">stone (Dan 2:34)<\/text><text x=\"196\" y=\"40\" font-size=\"11\" font-weight=\"800\" fill=\"var(--fg)\" text-anchor=\"end\">fills the earth (2:35)<\/text><\/svg>","points":["Of the increase of his government there will be no end (Isa 9:7)","The stone becomes a mountain filling the earth (Dan 2:35)","Pandemics and vaccines are not end-time signs","The gospel will succeed among the nations"],"refs":["Ps 110:1","1 Cor 15:25","Matt 13:31-33","Hab 2:14"]},{"key":"preterist","core":"Jesus' Olivet prophecy and much of Revelation were fulfilled within a generation, at the end of the old covenant age in AD 70. The second coming, resurrection and final judgment are still future.","svg":"<svg viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"AD 30 to AD 70\"><line x1=\"20\" y1=\"60\" x2=\"280\" y2=\"60\" stroke=\"var(--line)\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n<line x1=\"20\" y1=\"60\" x2=\"200\" y2=\"60\" stroke=\"var(--l-preterist)\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n<g font-size=\"11\" font-weight=\"800\" text-anchor=\"middle\"><circle cx=\"20\" cy=\"60\" r=\"7\" fill=\"var(--l-preterist)\"/><text x=\"22\" y=\"40\" fill=\"var(--fg)\">AD 30<\/text><text x=\"26\" y=\"90\" fill=\"var(--muted)\">\"this generation\"<\/text>\n<circle cx=\"200\" cy=\"60\" r=\"9\" fill=\"var(--l-preterist)\"/><text x=\"200\" y=\"40\" fill=\"var(--fg)\">AD 70<\/text><text x=\"200\" y=\"90\" fill=\"var(--muted)\">temple falls<\/text>\n<circle cx=\"280\" cy=\"60\" r=\"7\" fill=\"var(--surface)\" stroke=\"var(--l-preterist)\" stroke-width=\"3\"/><text x=\"272\" y=\"40\" fill=\"var(--fg)\">future<\/text><text x=\"268\" y=\"90\" fill=\"var(--muted)\">return<\/text><\/g><\/svg>","points":["'This generation will not pass away' (Matt 24:34)","Revelation's events were 'soon' and 'near' (Rev 1:1,3)","Gehenna pointed to Jerusalem's destruction (Jer 7:31-34)","The beast's number pointed to Nero, not modern medicine","'Aionios' speaks of the age, not endless time"],"refs":["Matt 24:34","Matt 16:28","Rev 1:1-3","Heb 10:25-27"]}]};
